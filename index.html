
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* Loading ekran */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.45s ease,
                  visibility 0.45s ease;
    }

    #loading-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Oq L logotipi */
    .logo {
      color: #fff;
      font-size: 100px;
      font-weight: 900;
      line-height: 1;
      animation: logoIntro 0.8s ease-out;
    }

    @keyframes logoIntro {
      from {
        opacity: 0;
        transform: scale(0.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Asosiy sahifa */
    #app {
      display: none;
      min-height: 100vh;
      padding: 24px;
    }
  </style>
</head>

<body>

  <!-- Loading ekran -->
  <div id="loading-screen">
    <div class="logo">L</div>
  </div>

  <!-- Asosiy ilova -->
  <main id="app">
    <h1>Asosiy sahifa</h1>
    <p>Ilovangiz tayyor!</p>

    <!-- Bu yerga o'z interfeysingizni qo'shing -->
  </main>

  <script>
    const loadingScreen =
      document.getElementById("loading-screen");

    const app = document.getElementById("app");

    // Asosiy sahifani ko'rsatish
    function showApp() {
      app.style.display = "block";

      if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
      }

      requestAnimationFrame(() => {
        loadingScreen.classList.add("hide");
      });
    }

    // Ilovani ishga tushirish
    async function initializeApp() {
      try {
        // Bu yerda API, foydalanuvchi ma'lumotlari
        // va boshqa kerakli ma'lumotlarni yuklang.

        // Masalan:
        // await loadUserData();
        // await loadLessons();

      } catch (error) {
        console.error("Yuklashda xatolik:", error);
      } finally {
        // Yuklash tugagach, asosiy sahifani ochish
        showApp();
      }
    }

    initializeApp();
  </script>

</body>
</html>
