<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Path UI</title>
  <style>
    :root {
      --bg-color: #07070b;
      --green-top: linear-gradient(135deg, #a2f2c8, #3db87a);
      --green-side: #2c9760;
      --purple-top: linear-gradient(135deg, #c084fc, #7e22ce);
      --purple-side: #6b21a8;
      --gray-top: linear-gradient(135deg, #ffffff, #d1d5db);
      --gray-side: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #141124 0%, var(--bg-color) 70%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      overflow-x: hidden;
      user-select: none;
    }

    /* --- General English Header --- */
    .header-badge {
      background: rgba(18, 20, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-badge .target-icon {
      width: 22px;
      height: 22px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
    }

    .header-badge .title {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.3px;
    }

    .header-badge .chevron {
      color: #9ca3af;
      margin-left: 4px;
    }

    /* --- Path Area --- */
    .path-container {
      position: relative;
      width: 380px;
      height: 780px;
      margin-top: 30px;
    }

    /* Top Star Beam Effect */
    .star-light-beam {
      position: absolute;
      top: -40px;
      left: 170px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* --- Base Cube Item --- */
    .cube-item {
      position: absolute;
      width: 96px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D Top Surface */
    .cube-top {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 22px;
      transform: rotate(45deg) scaleY(0.55);
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 4px 6px rgba(255, 255, 255, 0.8),
        inset 0 -4px 6px rgba(0, 0, 0, 0.25);
    }

    /* Cube Center Icon Adjustments */
    .cube-icon {
      transform: scaleY(1.8) rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3D Side Walls */
    .cube-sides {
      position: absolute;
      top: 22px;
      width: 80px;
      height: 42px;
      z-index: 2;
      display: flex;
    }

    .side-left, .side-right {
      flex: 1;
      height: 100%;
    }

    .side-left {
      border-bottom-left-radius: 16px;
      filter: brightness(0.9);
    }

    .side-right {
      border-bottom-right-radius: 16px;
      filter: brightness(0.72);
    }

    /* Gradient Tail (Shadow blur effect fading downward) */
    .cube-tail {
      position: absolute;
      top: 28px;
      width: 80px;
      height: 85px;
      border-radius: 0 0 18px 18px;
      z-index: 1;
      opacity: 0.9;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 15%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 15%, rgba(0, 0, 0, 0) 100%);
    }

    /* --- Completed Step (Green) --- */
    .cube-item.completed .cube-top {
      background: var(--green-top);
    }
    .cube-item.completed .side-left,
    .cube-item.completed .side-right {
      background: var(--green-side);
    }
    .cube-item.completed .cube-tail {
      background: linear-gradient(to bottom, var(--green-side), transparent);
    }
    .cube-item.completed .cube-icon {
      color: #0f4026;
    }

    /* --- Active Step (Purple) --- */
    .cube-item.active .cube-top {
      background: var(--purple-top);
      box-shadow: 
        inset 0 4px 8px rgba(255, 255, 255, 0.9),
        0 0 35px rgba(168, 85, 247, 0.6);
    }
    .cube-item.active .side-left,
    .cube-item.active .side-right {
      background: var(--purple-side);
    }
    .cube-item.active .cube-tail {
      background: linear-gradient(to bottom, var(--purple-side), transparent);
    }

    /* Floating START Badge */
    .start-tooltip {
      position: absolute;
      top: -42px;
      background: #374151;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.8px;
      padding: 7px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
      animation: float 2s infinite ease-in-out;
    }

    .start-tooltip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #374151;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* --- Locked Step (Gray) --- */
    .cube-item.locked .cube-top {
      background: var(--gray-top);
    }
    .cube-item.locked .side-left,
    .cube-item.locked .side-right {
      background: var(--gray-side);
    }
    .cube-item.locked .cube-tail {
      background: linear-gradient(to bottom, var(--gray-side), transparent);
    }
    .cube-item.locked .cube-icon {
      color: #374151;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Badge -->
  <div class="header-badge">
    <div class="target-icon">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3">
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </div>
    <span class="title">General English</span>
    <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M6 9l6 6 6-6"/>
    </svg>
  </div>

  <!-- Main Path -->
  <div class="path-container">

    <div class="star-light-beam"></div>

    <!-- 1. Green Completed (Bottom Left) -->
    <div class="cube-item completed" style="left: 30px; top: 640px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 2. Green Completed -->
    <div class="cube-item completed" style="left: 110px; top: 540px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 3. Purple Active (START) -->
    <div class="cube-item active" style="left: 190px; top: 430px;">
      <div class="start-tooltip">START</div>
      <div class="cube-top"></div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 4. Gray Locked -->
    <div class="cube-item locked" style="left: 270px; top: 330px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 5. Gray Locked -->
    <div class="cube-item locked" style="left: 190px; top: 235px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 6. Gray Locked -->
    <div class="cube-item locked" style="left: 110px; top: 140px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 7. Gray Locked -->
    <div class="cube-item locked" style="left: 30px; top: 45px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 8. Top Star Cube -->
    <div class="cube-item locked" style="left: 190px; top: -35px;">
      <div class="cube-top" style="background: linear-gradient(135deg, #ffffff, #e5e7eb);">
        <div class="cube-icon" style="color: #9ca3af;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

  </div>

</body>
</html>
