<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>General English</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% -10%,
            #282044 0%,
            #11101c 30%,
            #090a0c 65%,
            #08090b 100%
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;
}

/* =========================
   APP
========================= */

.app {
    position: relative;
    width: 100%;
    height: 100dvh;
    min-height: 600px;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    position: absolute;
    z-index: 100;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    width: min(470px, 94vw);
    height: 76px;

    border-radius: 42px;

    background:
        linear-gradient(
            180deg,
            rgba(23, 21, 38, .97),
            rgba(12, 11, 20, .97)
        );

    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.04);

    display: flex;
    align-items: center;

    padding: 0 22px;
}

.logo {
    width: 40px;
    height: 40px;

    margin-right: 12px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #0b8edc;
    font-size: 27px;
}

.title {
    flex: 1;

    font-size: clamp(23px, 5vw, 31px);
    font-weight: 750;
    letter-spacing: -1px;

    white-space: nowrap;
}

.arrow {
    width: 20px;
    height: 20px;

    border-right: 3px solid white;
    border-bottom: 3px solid white;

    transform: rotate(45deg);
    margin-right: 4px;
    margin-top: -8px;

    opacity: .9;
}

/* =========================
   PATH
========================= */

.path {
    position: absolute;
    inset: 0;
}

/* =========================
   CUBE
========================= */

.cube {
    position: absolute;

    width: 250px;
    height: 250px;

    transform: translate(-50%, -50%);

    border-radius: 34px;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f2f0eb 36%,
            #c9c5bd 58%,
            #55534f 78%,
            #161719 100%
        );

    box-shadow:
        0 25px 35px rgba(0,0,0,.55),
        inset 0 3px 4px rgba(255,255,255,.9),
        inset 0 -35px 50px rgba(0,0,0,.7);

    overflow: hidden;

    transition:
        transform .25s ease,
        filter .25s ease;
}

/*
   Ichki yuqori panel
*/

.cube::before {
    content: "";

    position: absolute;

    top: 18px;
    left: 18px;
    right: 18px;

    height: 82px;

    border-radius: 25px;

    background:
        linear-gradient(
            145deg,
            #f7f6f2,
            #dedbd4
        );

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.9),
        inset 0 -3px 6px rgba(0,0,0,.12);

    clip-path:
        polygon(
            0 0,
            100% 0,
            88% 100%,
            12% 100%
        );
}

/*
   Cube ichidagi chuqurlik
*/

.cube::after {
    content: "";

    position: absolute;

    left: 30px;
    right: 30px;
    bottom: 38px;

    height: 70px;

    border-radius: 18px;

    border: 2px solid rgba(255,255,255,.12);

    box-shadow:
        inset 0 12px 20px rgba(0,0,0,.16);
}

/* =========================
   TOP ICON
========================= */

.lock {
    position: absolute;

    z-index: 5;

    top: 45px;
    left: 50%;

    transform: translateX(-50%);

    width: 58px;
    height: 48px;
}

.lock-body {
    position: absolute;

    left: 13px;
    bottom: 0;

    width: 38px;
    height: 30px;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #55575a,
            #292a2c
        );

    box-shadow:
        inset 0 2px 2px rgba(255,255,255,.25),
        0 3px 4px rgba(0,0,0,.35);
}

.lock-ring {
    position: absolute;

    left: 5px;
    top: 0;

    width: 34px;
    height: 28px;

    border: 6px solid #383a3c;

    border-bottom: 0;

    border-radius: 20px 20px 0 0;

    transform: rotate(-7deg);
}

.lock-dot {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -30%);

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #d7d7d7;
}

/* =========================
   OPEN ICON
========================= */

.check {
    position: absolute;

    z-index: 5;

    top: 43px;
    left: 50%;

    transform: translateX(-50%) rotate(-8deg);

    width: 45px;
    height: 45px;
}

.check::before {
    content: "";

    position: absolute;

    width: 11px;
    height: 34px;

    left: 20px;
    top: 3px;

    border-radius: 7px;

    background: #008e59;

    transform: rotate(4deg);
}

.check::after {
    content: "";

    position: absolute;

    width: 27px;
    height: 11px;

    left: 4px;
    top: 27px;

    border-radius: 7px;

    background: #008e59;

    transform: rotate(-5deg);
}

/* =========================
   ACTIVE PURPLE CUBE
========================= */

.cube.active {
    background:
        linear-gradient(
            145deg,
            #b58aff 0%,
            #8c55f3 38%,
            #5424ad 70%,
            #1c1238 100%
        );

    box-shadow:
        0 28px 45px rgba(0,0,0,.7),
        0 0 35px rgba(130,72,255,.22),
        inset 0 3px 5px rgba(255,255,255,.45),
        inset 0 -40px 60px rgba(22,5,55,.75);
}

.cube.active::before {
    background:
        linear-gradient(
            145deg,
            #bba2ff,
            #7950db
        );

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.6),
        inset 0 -3px 6px rgba(30,10,70,.3);
}

.cube.active::after {
    border-color: rgba(255,255,255,.18);
}

/* =========================
   GREEN CUBES
========================= */

.cube.completed {
    background:
        linear-gradient(
            145deg,
            #c4ffe4 0%,
            #72d9b0 35%,
            #26936c 65%,
            #082d25 100%
        );

    box-shadow:
        0 25px 38px rgba(0,0,0,.58),
        inset 0 3px 4px rgba(255,255,255,.8),
        inset 0 -40px 55px rgba(0,40,31,.7);
}

.cube.completed::before {
    background:
        linear-gradient(
            145deg,
            #d2ffec,
            #7de0b9
        );
}

.cube.completed::after {
    border-color: rgba(255,255,255,.16);
}

/* =========================
   START BUTTON
========================= */

.start {
    position: absolute;

    z-index: 200;

    width: 285px;
    height: 72px;

    transform: translate(-50%, -50%);

    border: 0;
    border-radius: 38px;

    background:
        linear-gradient(
            180deg,
            #525b66,
            #424b56
        );

    color: white;

    font-size: 31px;
    font-weight: 800;

    letter-spacing: -.5px;

    box-shadow:
        0 8px 18px rgba(0,0,0,.35),
        inset 0 1px 1px rgba(255,255,255,.12);

    cursor: pointer;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.start::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -17px;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 17px solid transparent;
    border-right: 17px solid transparent;
    border-top: 17px solid #424b56;
}

.start:active {
    transform: translate(-50%, -50%) scale(.96);
}

.start:hover {
    filter: brightness(1.08);
}

/* =========================
   POSITIONS
========================= */

.cube-1 {
    left: 61%;
    top: 17%;
    transform: translate(-50%, -50%) scale(.92);
    opacity: .72;
}

.cube-2 {
    left: 39%;
    top: 28%;
    transform: translate(-50%, -50%) scale(.95);
}

.cube-3 {
    left: 19%;
    top: 43%;
    transform: translate(-50%, -50%) scale(.91);
}

.cube-4 {
    left: 39%;
    top: 55%;
    transform: translate(-50%, -50%) scale(.95);
}

.cube-5 {
    left: 60%;
    top: 67%;
    transform: translate(-50%, -50%) scale(.94);
}

.cube-6 {
    left: 79%;
    top: 79%;
    transform: translate(-50%, -50%) scale(.91);
}

.cube-7 {
    left: 60%;
    top: 88%;
    transform: translate(-50%, -50%) scale(.95);
}

.cube-8 {
    left: 38%;
    top: 94%;
    transform: translate(-50%, -50%) scale(.93);
}

.start {
    left: 60%;
    top: 79%;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 600px) {

    .header {
        top: 8px;
        height: 68px;
        padding: 0 20px;
    }

    .logo {
        width: 34px;
        height: 34px;
        font-size: 24px;
    }

    .title {
        font-size: 24px;
    }

    .arrow {
        width: 18px;
        height: 18px;
    }

    .cube {
        width: 220px;
        height: 220px;
        border-radius: 31px;
    }

    .cube::before {
        top: 16px;
        left: 16px;
        right: 16px;
        height: 72px;
    }

    .cube::after {
        left: 27px;
        right: 27px;
        bottom: 32px;
        height: 62px;
    }

    .lock {
        top: 39px;
        transform: translateX(-50%) scale(.9);
    }

    .check {
        top: 37px;
        transform:
            translateX(-50%)
            rotate(-8deg)
            scale(.9);
    }

    .start {
        width: 270px;
        height: 68px;
        font-size: 29px;
    }
}

@media (max-width: 390px) {

    .header {
        width: 94vw;
    }

    .title {
        font-size: 21px;
    }

    .cube {
        width: 190px;
        height: 190px;
        border-radius: 27px;
    }

    .cube::before {
        top: 14px;
        left: 14px;
        right: 14px;
        height: 63px;
    }

    .cube::after {
        left: 23px;
        right: 23px;
        bottom: 28px;
        height: 55px;
    }

    .cube-1 {
        top: 16%;
    }

    .cube-2 {
        top: 27%;
    }

    .cube-3 {
        top: 42%;
    }

    .cube-4 {
        top: 54%;
    }

    .cube-5 {
        top: 66%;
    }

    .cube-6 {
        top: 77%;
    }

    .cube-7 {
        top: 87%;
    }

    .start {
        width: 245px;
        height: 62px;
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <div class="header">

        <div class="logo">
            ◉
        </div>

        <div class="title">
            General English
        </div>

        <div class="arrow"></div>

    </div>


    <!-- LEVEL PATH -->
    <div class="path">

        <!-- LOCKED -->
        <div class="cube cube-1">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- LOCKED -->
        <div class="cube cube-2">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- LOCKED -->
        <div class="cube cube-3">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- LOCKED -->
        <div class="cube cube-4">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- LOCKED -->
        <div class="cube cube-5">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- LOCKED -->
        <div class="cube cube-6">
            <div class="lock">
                <div class="lock-ring"></div>
                <div class="lock-body">
                    <div class="lock-dot"></div>
                </div>
            </div>
        </div>


        <!-- ACTIVE -->
        <div class="cube active cube-7">
        </div>


        <!-- COMPLETED -->
        <div class="cube completed cube-8">
            <div class="check"></div>
        </div>


        <!-- START -->
        <button class="start" onclick="startLesson()">
            START
        </button>

    </div>

</div>


<script>

function startLesson() {

    const button = document.querySelector(".start");

    button.textContent = "STARTED";

    button.style.transform =
        "translate(-50%, -50%) scale(.96)";

    setTimeout(() => {

        button.textContent = "START";

        button.style.transform =
            "translate(-50%, -50%) scale(1)";

    }, 600);
}

</script>

</body>
</html>
