<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uy - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}

        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column}

        /* Header */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 90px 20px 14px 20px;
            background: rgba(18, 18, 20, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .admin-trigger-btn {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }
        .admin-trigger-btn:active { transform: scale(0.94); background: rgba(255, 255, 255, 0.2); }

        .verified-badge-sm{width:15px;height:15px;flex-shrink:0;display:inline-block;vertical-align:middle;margin-left:4px}

        .feed{width:100%;display:flex;flex-direction:column;padding-bottom:8px;gap:0}

        /* POST STILI */
        .post-item{width:100%;padding:16px 20px;text-align:left;cursor:pointer;transition:background .15s ease;background:transparent;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;gap:10px;align-items:flex-start}
        .post-item.animate-in{animation:postIn .35s cubic-bezier(.34,1.2,.64,1) both}
        .post-item:active{background:rgba(255,255,255,0.03)}
        @keyframes postIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

        .post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer}
        .post-avatar{object-fit:cover;background:#1c1c1e}
        .post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
        .post-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
        .post-head-info{display:flex;align-items:baseline;gap:6px;min-width:0;flex:1}
        .post-user{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:inline-flex;align-items:center}
        .post-user:active{opacity:.7}
        .post-time{font-size:13px;color:#8e8e93;flex-shrink:0}
        
        .post-more-btn{background:none;border:none;color:#8e8e93;padding:4px 8px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s}
        .post-more-btn:active{background:rgba(255,255,255,0.1);color:#fff}
        .post-more-btn svg{width:18px;height:18px;fill:currentColor}

        .post-text{font-size:15px;line-height:1.45;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}

        .post-image, .post-video, .detail-image, .detail-video{
            width:100%;
            border-radius:16px;
            margin-bottom:12px;
            display:block;
            max-height:80vh;
            object-fit:cover;
            border:0.5px solid rgba(255,255,255,0.1);
            background:#000;
        }

        .post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:12px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px;text-align:left}
        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        @keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
        .act-btn.saved{color:#fff}
        .act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}

        .empty{text-align:center;color:#8e8e93;padding:60px 20px;font-size:15px;line-height:1.6}

        /* POST TUGMASI VA COMPOSER */
        .post-btn{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4);transition:transform .2s}
        .post-btn:active{transform:scale(.94)}
        .post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

        .composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:600;opacity:0;pointer-events:none;transition:opacity .25s}
        .composer-overlay.show{opacity:1;pointer-events:auto}
        .composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#141415;border-radius:32px 32px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:601;padding:24px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
        .composer.show{transform:translate(-50%,0)}
        .composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .composer-title{font-size:17px;font-weight:700}
        .composer-close{background:#2c2c2e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93}
        .composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
        .composer-body{display:flex;gap:12px;margin-bottom:16px}
        .composer-avatar,.composer-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0}
        .composer-avatar{object-fit:cover;background:#1c1c1e}
        .composer-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
        .composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
        .composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
        .composer-preview.show{display:block}
        .composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
        .composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
        .composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}
        .composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
        .composer-attach-group{display:flex;gap:8px}
        .composer-attach{background:#2c2c2e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
        .composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
        .composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}
        .composer-submit:disabled{opacity:.4;cursor:not-allowed}

        /* ACTION SHEET */
        .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:700;opacity:0;pointer-events:none;transition:opacity .2s}
        .sheet-overlay.show{opacity:1;pointer-events:auto}
        .action-sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#1c1c1e;border-radius:26px 26px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:701;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transition:transform .3s cubic-bezier(.34,1.2,.64,1);display:flex;flex-direction:column;gap:8px}
        .action-sheet.show{transform:translate(-50%,0)}
        .sheet-handle{width:36px;height:4px;background:#3a3a3c;border-radius:2px;margin:0 auto 8px}
        .sheet-btn{width:100%;padding:15px 16px;background:#2c2c2e;border:none;border-radius:16px;color:#fff;font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s}
        .sheet-btn:active{background:#3a3a3c}
        .sheet-btn.danger{color:#ff453a}
        .sheet-btn.cancel{justify-content:center;background:#141415;color:#8e8e93;margin-top:4px}
        .sheet-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

        /* SKELETON LOADER */
        .feed-loader{display:none;flex-direction:column;width:100%}
        .feed-loader.active{display:flex}
        .sk-card{display:flex;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.05)}
        .sk-shimmer{background:#161618;background-image:linear-gradient(110deg,#161618 0%,#161618 35%,#26262b 50%,#161618 65%,#161618 100%);background-size:250% 100%;animation:skWave 1.35s linear infinite}
        @keyframes skWave{0%{background-position:100% 0}100%{background-position:-100% 0}}
        .sk-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0}
        .sk-main{flex:1;display:flex;flex-direction:column;gap:10px}
        .sk-head{display:flex;gap:8px}
        .sk-name{width:112px;height:13px;border-radius:7px}
        .sk-time{width:52px;height:11px;border-radius:6px}
        .sk-line{height:12px;border-radius:6px}
        .sk-line.w-95{width:95%}
        .sk-line.w-80{width:80%}
        .sk-line.w-55{width:55%}
        .sk-media{width:100%;height:160px;border-radius:16px}
        .sk-status-pill{margin:16px auto 22px;display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:20px;background:rgba(28,28,30,0.8);border:1px solid rgba(255,255,255,0.08);color:#8e8e93;font-size:12px}
        .sk-spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,0.16);border-top-color:#fff;border-radius:50%;animation:spinLoader .7s linear infinite}
        @keyframes spinLoader{to{transform:rotate(360deg)}}

        /* ISLAND NAVIGATSIYA */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;position:relative}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#2c2c2e;color:#fff}
        .nav-badge{position:absolute;top:2px;right:25%;background:#ff2d55;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 5px;min-width:16px;text-align:center;border:2px solid #1c1c1e}

        /* DETAIL & ADMIN OVERLAYS */
        .detail-overlay, .comment-detail-overlay, .admin-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .28s cubic-bezier(.34,1.2,.64,1) both}
        .detail-overlay.show, .comment-detail-overlay.show, .admin-overlay.show{display:flex}
        .comment-detail-overlay{z-index:520}
        .admin-overlay{z-index:550}
        @keyframes detailIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

        .detail-header, .comment-detail-header, .admin-header{
            display:flex;align-items:center;justify-content:center;padding:90px 16px 14px;
            border-bottom:0.5px solid rgba(255,255,255,0.12);background:rgba(18,18,20,0.65);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            max-width:420px;width:100%;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:20;
        }
        .detail-title, .comment-detail-title, .admin-title{font-size:17px;font-weight:700;text-align:center}

        .detail-scroll, .comment-detail-scroll, .admin-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:138px;padding-bottom:30px;max-width:420px;width:100%;margin:0 auto}
        .detail-post{padding:16px 20px;border-bottom:8px solid #0d0d0f}
        .detail-text{font-size:16px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}

        .detail-comments-title{padding:18px 20px 12px;font-size:14px;font-weight:700;color:#fff}
        .detail-comments-list, .comment-detail-replies{padding:0 20px;display:flex;flex-direction:column;gap:12px}

        /* IZOHLAR & JAVOBLAR */
        .comment-thread{display:flex;flex-direction:column;position:relative}
        .comment-row{display:flex;gap:10px;cursor:pointer;padding:6px 0;align-items:stretch}
        .comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:38px}
        .comment-avatar,.comment-avatar-initial{width:38px;height:38px;border-radius:50%;flex-shrink:0;cursor:pointer;object-fit:cover;background:#1c1c1e}
        .comment-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
        .thread-line-down{width:2px;background:#2c2c2e;flex:1;margin-top:4px;min-height:16px}
        .comment-content{flex:1;min-width:0;padding-bottom:6px}
        .comment-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
        .comment-user{font-size:14px;font-weight:600;display:inline-flex;align-items:center}
        .comment-time{font-size:12px;color:#8e8e93}
        .comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
        .comment-actions{display:flex;gap:4px;align-items:center}
        .comment-act{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:500;cursor:pointer;padding:6px 10px;display:inline-flex;align-items:center;gap:5px;border-radius:10px}
        .comment-act:active{background:rgba(255,255,255,0.08)}
        .comment-act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
        .comment-act.liked{color:#ff2d55}
        .comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55}
        .comment-replies{padding-left:16px;border-left:1.5px solid #2c2c2e;margin-left:18px;display:flex;flex-direction:column;gap:8px}

        .reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#1c1c1e;border-top:1px solid #2c2c2e;font-size:13px;color:#fff;font-weight:600;max-width:420px;width:100%;margin:0 auto}
        .reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .reply-mode-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:14px}

        .detail-input-bar{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#000;max-width:420px;width:100%;margin:0 auto}
        .detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e}
        .detail-island.reply-mode{border-color:#fff}
        .detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
        .detail-send{background:#fff;color:#000;border:none;border-radius:50%;width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
        .detail-send:disabled{opacity:.35;cursor:not-allowed}
        .detail-send svg{width:17px;height:17px;stroke:#000;fill:none;stroke-width:2.5}

        .comment-detail-main{padding:16px 20px;border-bottom:1px solid #1c1c1e}

        /* BOSH ADMINISTRATOR PANELI STILLARI */
        .admin-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 20px}
        .admin-stat-card{background:#141415;border:1px solid #2c2c2e;border-radius:18px;padding:16px}
        .admin-stat-val{font-size:24px;font-weight:800;color:#fff;margin-bottom:4px}
        .admin-stat-lbl{font-size:12px;color:#8e8e93}
        .admin-section-title{padding:12px 20px 8px;font-size:14px;font-weight:700;color:#8e8e93;text-transform:uppercase;letter-spacing:0.5px}
        .admin-user-card{margin:0 20px 10px;background:#141415;border:1px solid #2c2c2e;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
        .admin-user-top{display:flex;align-items:center;gap:10px}
        .admin-user-meta{font-size:12px;color:#a1a1aa;line-height:1.65;background:#1c1c1e;padding:10px 12px;border-radius:12px}
        .admin-time-pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08)}
        .admin-time-pill{background:#141415;padding:6px 8px;border-radius:8px;text-align:center}
        .admin-time-pill span{display:block;font-size:10px;color:#8e8e93}
        .admin-time-pill b{font-size:12px;color:#fff}
        .admin-user-actions{display:flex;gap:8px}
        .admin-btn{flex:1;padding:10px 10px;border-radius:12px;border:none;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
        .admin-btn.verify{background:#fff;color:#000}
        .admin-btn.unverify{background:#2c2c2e;color:#fff}
        .admin-btn.del{background:rgba(255,69,58,0.16);color:#ff453a}
        .admin-load-more{margin:8px 20px 24px;width:calc(100% - 40px);padding:13px;background:#1c1c1e;color:#fff;border:1px solid #2c2c2e;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer}

        .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.95);backdrop-filter:blur(10px);color:#fff;padding:12px 22px;border-radius:16px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;border:1px solid rgba(255,255,255,0.12);max-width:85%;text-align:center}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="brand-title">Lenta</h1>
        <button class="admin-trigger-btn" id="openAdminBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Admin
        </button>
    </header>

    <div class="feed" id="feed"></div>
    <div class="feed-loader" id="feedLoader" aria-hidden="true"></div>
</div>

<!-- POST YOZISH TUGMASI -->
<button class="post-btn" id="postBtn" aria-label="Post yozish">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Post
</button>

/* ================= USER CACHE (ON-DEMAND / LAZY FETCH) ================= */
const UserCache = {
    _map: new Map(),
    _pending: new Map(),

    get(uid) {
        return this._map.get(String(uid)) || null;
    },

    set(uid, data) {
        if (!uid || !data) return;
        this._map.set(String(uid), data);
    },

    async fetchOne(uid) {
        const idStr = String(uid || '');
        if (!idStr || idStr.startsWith('mehmon_')) return null;
        if (this._map.has(idStr)) return this._map.get(idStr);
        if (this._pending.has(idStr)) return this._pending.get(idStr);

        const promise = getDoc(doc(db, USERS_COLLECTION, idStr))
            .then(snap => {
                this._pending.delete(idStr);
                if (snap.exists()) {
                    const d = snap.data();
                    this._map.set(idStr, d);
                    return d;
                }
                return null;
            })
            .catch(() => {
                this._pending.delete(idStr);
                return null;
            });

        this._pending.set(idStr, promise);
        return promise;
    },

    async prefetchForPosts(posts) {
        const uniqueUids = [...new Set(posts.map(p => String(p.userId)).filter(id => id && !this._map.has(id)))];
        if (uniqueUids.length === 0) return;
        await Promise.all(uniqueUids.map(id => this.fetchOne(id)));
    }
};

/* ================= ACTIVE SCREEN TIME TRACKER (KUNLIK / HAFTALIK / OYLIK) ================= */
function getPeriodKeys(date = new Date()) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');

    // ISO hafta raqamini hisoblash
    const tmp = new Date(Date.UTC(yyyy, date.getMonth(), date.getDate()));
    const dayNum = tmp.getUTCDay() || 7;
    tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
    const ww = String(weekNo).padStart(2, '0');

    return {
        dailyKey: `daily_${yyyy}-${mm}-${dd}`,
        weeklyKey: `weekly_${tmp.getUTCFullYear()}-W${ww}`,
        monthlyKey: `monthly_${yyyy}-${mm}`
    };
}

let activeSessionStart = null;
let accumulatedSeconds = 0;
let flushTimer = null;

function isAppForeground() {
    return document.visibilityState === 'visible' && document.hasFocus();
}

function resumeTimeCounting() {
    if (!currentUser || activeSessionStart !== null) return;
    if (isAppForeground()) {
        activeSessionStart = Date.now();
    }
}

function pauseAndCollectSeconds() {
    if (activeSessionStart !== null) {
        const elapsed = Math.floor((Date.now() - activeSessionStart) / 1000);
        if (elapsed > 0) {
            accumulatedSeconds += elapsed;
        }
        activeSessionStart = null;
    }
}

async function flushUsageTimeToServer() {
    pauseAndCollectSeconds();
    if (!currentUser || accumulatedSeconds <= 0) {
        resumeTimeCounting();
        return;
    }

    const secondsToSend = accumulatedSeconds;
    accumulatedSeconds = 0;
    const { dailyKey, weeklyKey, monthlyKey } = getPeriodKeys();

    try {
        await setDoc(doc(db, USERS_COLLECTION, String(currentUser.userId)), {
            [`usageStats.${dailyKey}`]: increment(secondsToSend),
            [`usageStats.${weeklyKey}`]: increment(secondsToSend),
            [`usageStats.${monthlyKey}`]: increment(secondsToSend),
            totalActiveSeconds: increment(secondsToSend),
            lastActiveAt: new Date().toISOString()
        }, { merge: true });
    } catch (e) {
        // Internet uzilsa yig'ilgan vaqt yo'qolmaydi, keyingi safar qo'shiladi
        accumulatedSeconds += secondsToSend;
    }

    resumeTimeCounting();
}

function startActiveTimeTracker() {
    if (!currentUser) return;
    resumeTimeCounting();

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            resumeTimeCounting();
        } else {
            flushUsageTimeToServer();
        }
    });

    window.addEventListener('focus', resumeTimeCounting);
    window.addEventListener('blur', flushUsageTimeToServer);
    window.addEventListener('pagehide', flushUsageTimeToServer);

    // Har 25 soniyada faol vaqtni serverga saqlab borish (sahifa almashganda ham davom etadi)
    clearInterval(flushTimer);
    flushTimer = setInterval(() => {
        if (isAppForeground()) {
            flushUsageTimeToServer();
        }
    }, 25000);
}

function formatDurationSeconds(sec) {
    const s = Math.max(0, Number(sec) || 0);
    if (s < 60) return `${s} son`;
    const mins = Math.floor(s / 60);
    if (mins < 60) return `${mins} daq`;
    const hours = Math.floor(mins / 60);
    const remMins = mins % 60;
    return remMins > 0 ? `${hours} s ${remMins} daq` : `${hours} soat`;
}

function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';

    const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
}

function compressImage(file, maxW = 800, quality = 0.72){
    return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url); let { width, height } = img;
            if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Rasm formati qo'llab-quvvatlanmaydi (HEIC/buzilgan fayl)")); };
        img.src = url;
    });
}

/* ================= LAZY LOADING FIRESTORE POST STORE ================= */
const PostStore = {
    _items: [],
    _lastDoc: null,
    _hasMore: true,
    _isLoading: false,
    _isLoaded: false,
    _hasError: false,

    all() { return this._items; },
    get(id) { return this._items.find(p => String(p.id) === String(id)) || null; },

    async fetchById(id) {
        const cached = this.get(id);
        if (cached) return cached;
        try {
            const snap = await getDoc(doc(db, POSTS_COLLECTION, String(id)));
            if (snap.exists()) {
                const post = { id: snap.id, ...snap.data() };
                await UserCache.fetchOne(post.userId);
                return post;
            }
        } catch {}
        return null;
    },

    async loadInitial() {
        if (this._isLoading) return;
        this._isLoading = true;
        this._hasError = false;

        try {
            const q = query(
                collection(db, POSTS_COLLECTION),
                orderBy("createdAt", "desc"),
                limit(FEED_BATCH_SIZE)
            );
            const snap = await getDocs(q);
            const batch = [];
            snap.forEach(d => batch.push({ id: d.id, ...d.data() }));

            this._items = batch;
            this._lastDoc = snap.docs[snap.docs.length - 1] || null;
            this._hasMore = snap.docs.length === FEED_BATCH_SIZE;
            this._isLoaded = true;

            await UserCache.prefetchForPosts(batch);
            renderInitialFeed();
        } catch (err) {
            console.error("Postlarni yuklashda xato:", err);
            this._isLoaded = true;
            this._hasError = true;
            renderInitialFeed();
        } finally {
            this._isLoading = false;
        }
    },

    async loadNextPage() {
        if (this._isLoading || !this._hasMore || !this._lastDoc) return [];
        this._isLoading = true;

        try {
            const q = query(
                collection(db, POSTS_COLLECTION),
                orderBy("createdAt", "desc"),
                startAfter(this._lastDoc),
                limit(FEED_BATCH_SIZE)
            );
            const snap = await getDocs(q);
            const batch = [];
            snap.forEach(d => batch.push({ id: d.id, ...d.data() }));

            this._items.push(...batch);
            this._lastDoc = snap.docs[snap.docs.length - 1] || this._lastDoc;
            this._hasMore = snap.docs.length === FEED_BATCH_SIZE;

            await UserCache.prefetchForPosts(batch);
            return batch;
        } catch (err) {
            console.error("Keyingi sahifani yuklashda xato:", err);
            return [];
        } finally {
            this._isLoading = false;
        }
    },

    async add(post) {
        try {
            const approxSize = JSON.stringify(post).length;
            if (approxSize > 950000) {
                showToast("Fayl hajmi juda katta! Kichikroq rasm tanlang.");
                return null;
            }
            await setDoc(doc(db, POSTS_COLLECTION, String(post.id)), post);
            updateDoc(doc(db, USERS_COLLECTION, String(post.userId)), { postsCount: increment(1) }).catch(() => {});
            this._items.unshift(post);
            return post;
        } catch (err) {
            console.error("Post saqlashda xatolik:", err);
            showToast("Postni saqlab bo'lmadi: internetni tekshiring");
            return null;
        }
    },

    async update(id, patch) {
        const i = this._items.findIndex(p => String(p.id) === String(id));
        if (i >= 0) {
            this._items[i] = Object.assign({}, this._items[i], patch);
        }
        try {
            await updateDoc(doc(db, POSTS_COLLECTION, String(id)), patch);
            return this._items[i] || null;
        } catch (err) {
            console.error("Yangilashda xatolik:", err);
            showToast("Saqlanmadi: internet aloqasini tekshiring");
            return null;
        }
    },

    async remove(id) {
        const target = this.get(id);
        try {
            await deleteDoc(doc(db, POSTS_COLLECTION, String(id)));
            if (target?.userId) {
                updateDoc(doc(db, USERS_COLLECTION, String(target.userId)), { postsCount: increment(-1) }).catch(() => {});
            }
            this._items = this._items.filter(p => String(p.id) !== String(id));
            return true;
        } catch (err) {
            console.error("O'chirishda xatolik:", err);
            showToast("Postni o'chirib bo'lmadi");
            return false;
        }
    }
};

async function sendNotification(type, recipientId, postId, commentId = null) {
    if (!currentUser || !currentUser.userId || !recipientId) return;
    if (String(recipientId) === String(currentUser.userId)) return;

    const notifId = 'n_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

        postId: String(postId),

        createdAt: new Date().toISOString(),
        isRead: false
    };

    try {
        await setDoc(doc(db, NOTIFS_COLLECTION, notifId), newNotif);
    } catch {}
}

function listenUnreadNotifications() {
    if (!currentUser) return;
    const btn = document.getElementById('navNotifBtn');
    if (!btn) return;

    const q = query(
        collection(db, NOTIFS_COLLECTION),
        where("recipientId", "==", String(currentUser.userId)),
        where("isRead", "==", false),
        limit(50)
    );

    onSnapshot(q, (snap) => {

        let badge = btn.querySelector('.nav-badge');
        if (count > 0) {
            if (!badge) {
                badge = document.createElement('div');
                badge.className = 'nav-badge';
                btn.appendChild(badge);

            badge.textContent = count > 49 ? '50+' : count;
        } else if (badge) {
            badge.remove();
        }
    }, () => {});
}

/* ================= VIEW TRACKER (SERVER-SIDE) ================= */
const viewIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target;
        viewIO.unobserve(el);
        const pid = String(el.dataset.id);
        if (!pid || viewedPostIds.has(pid)) return;

        viewedPostIds.add(pid);
        const fresh = PostStore.get(pid);
        if (fresh) {
            fresh.views = (fresh.views || 0) + 1;
            const cnt = el.querySelectorAll('.act-btn')[2]?.querySelector('.act-count');
            if (cnt) cnt.textContent = fresh.views;
        }

        updateDoc(doc(db, POSTS_COLLECTION, pid), { views: increment(1) }).catch(() => {});
        if (currentUser) {
            updateDoc(doc(db, USERS_COLLECTION, String(currentUser.userId)), {
                viewedPosts: arrayUnion(pid)
            }).catch(() => {});
        }
    });
}, { threshold: 0.5 });

/* ================= COMMENT HELPERS ================= */
function findComment(comments, id){
    for (const c of (comments || [])) {
        if (String(c.id) === String(id)) return { comment: c, parent: null, isReply: false, root: c };
        const found = findInReplies(c, id, c); if (found) return found;
    } return null;
}
function findInReplies(parent, id, root){
    for (const r of (parent.replies || [])) {
        if (String(r.id) === String(id)) return { comment: r, parent, isReply: true, root };
        const found = findInReplies(r, id, root); if (found) return found;
    } return null;
}
function makeCommentObj(text, parentId){
    return {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        userId: String(currentUser.userId),
        user: getCurrentUserName(),
        avatar: currentUser.photo_url || null,
        verified: isUserVerified(currentUser.userId),
        text,
        createdAt: new Date().toISOString(),
        likes: 0,
        likedBy: [],
        replies: [],
        parentId: parentId || null
    };
}
async function addCommentToPost(postId, newComment, replyToId){
    const post = PostStore.get(postId) || await PostStore.fetchById(postId);
    if (!post) return null;
    const commentsCopy = JSON.parse(JSON.stringify(post.comments || []));
    
    if (!replyToId) {
        newComment.parentId = null; 
        commentsCopy.push(newComment);
        const ok = await PostStore.update(postId, { comments: commentsCopy });
        return ok ? { post: ok, comment: newComment, parent: null } : null;
    }
    const found = findComment(commentsCopy, replyToId); if (!found) return null;
    newComment.parentId = replyToId; 
    if (!found.comment.replies) found.comment.replies = [];
    found.comment.replies.push(newComment); 
    const ok = await PostStore.update(postId, { comments: commentsCopy });
    return ok ? { post: ok, comment: newComment, parent: found.comment } : null;
}

/* ================= POST RENDER & LAZY INFINITE SCROLL ================= */
let feedScrollObserver = null;

function countComments(p){
    let n = (p.comments || []).length;
    const walk = (arr) => arr.forEach(c => { n += (c.replies || []).length; if (c.replies) walk(c.replies); });
    walk(p.comments || []);
    return n;
}

function handleShare(entity, postId, commentId){
    let link = location.origin + location.pathname + '?post=' + encodeURIComponent(postId || entity.id);
    if (commentId) link += '&comment=' + encodeURIComponent(commentId);
    if (navigator.share) {
        navigator.share({ title: 'L.uz', url: link }).catch(() => {});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link)
            .then(() => showToast('Havola nusxalandi'))
            .catch(() => showToast('Havolani nusxalab bo\'lmadi'));
    } else {
        showToast('Havolani nusxalab bo\'lmadi');
    }
}

function buildPostItem(p, animate = false){
    const item = document.createElement('div');
    item.className = 'post-item' + (animate ? ' animate-in' : '');
    item.dataset.id = p.id;

    const author = resolveAuthorInfo(p.userId, p.user, p.avatar);
    const postInit = escapeHtml(author.name.charAt(0).toUpperCase());
    const av = author.avatar ? `<img class="post-avatar" src="${escapeHtml(author.avatar)}" alt="" loading="lazy">` : `<div class="post-avatar-initial">${postInit}</div>`;

    let media = '';
    if (p.type === 'image' && p.image) media = `<img class="post-image" src="${escapeHtml(p.image)}" alt="" loading="lazy">`;
    else if (p.type === 'video' && p.image) media = `<video class="post-video" src="${escapeHtml(p.image)}" controls playsinline preload="metadata"></video>`;

    const canManage = currentUser && (String(p.userId) === String(currentUser.userId) || isSuperAdmin());
    const moreBtnHtml = canManage ? `<button class="post-more-btn" aria-label="Boshqarish">${ICONS.more}</button>` : '';

    item.innerHTML = `
        <div style="flex-shrink: 0;" class="post-avatar-wrapper">${av}</div>

            <div class="post-head-row">
                <div class="post-head-info">
                    <div class="post-user">${escapeHtml(author.name)}${getInlineVerifiedBadge(author.userId, p)}</div>
                    <div class="post-time">${escapeHtml(formatExactTime(p.createdAt || p.time))}</div>
                </div>

            </div>
            ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ''}
            ${media}
            <div class="post-actions-slot"></div>
        </div>
    `;

    item.querySelector('.post-actions-slot').appendChild(buildPostActions(p));

    item.querySelector('.post-avatar-wrapper').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(author.userId); });
    item.querySelector('.post-user').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(author.userId); });

}

function updateSinglePostCard(postId) {
    const post = PostStore.get(postId);
    const existingEl = document.querySelector(`.post-item[data-id="${CSS.escape(String(postId))}"]`);
    if (!post || !existingEl) return;

    const textEl = existingEl.querySelector('.post-text');
    if (post.text) {
        if (textEl) textEl.textContent = post.text;
    } else if (textEl) {
        textEl.remove();
    }

    const slot = existingEl.querySelector('.post-actions-slot');
    if (slot) {
        slot.innerHTML = '';
        slot.appendChild(buildPostActions(post));
    }
}

function initLazyFeedObserver(){
    if (feedScrollObserver) { feedScrollObserver.disconnect(); feedScrollObserver = null; }
    const loader = document.getElementById('feedLoader');
    if (!PostStore._hasMore) {
        loader.classList.remove('active');
        return;
    }

    loader.classList.add('active');
    feedScrollObserver = new IntersectionObserver(async (entries) => {
        const entry = entries[0];
        if (entry && entry.isIntersecting && !PostStore._isLoading && PostStore._hasMore) {
            const nextBatch = await PostStore.loadNextPage();
            if (nextBatch.length > 0) {
                const feed = document.getElementById('feed');
                const fragment = document.createDocumentFragment();
                nextBatch.forEach(p => fragment.appendChild(buildPostItem(p, true)));
                feed.appendChild(fragment);
            }
            if (!PostStore._hasMore) {
                loader.classList.remove('active');
                if (feedScrollObserver) { feedScrollObserver.disconnect(); feedScrollObserver = null; }
            }
        }
    }, { root: null, rootMargin: '160px', threshold: 0.05 });

    feedScrollObserver.observe(loader);
}

function renderInitialFeed(){
    const feed = document.getElementById('feed');
    const loader = document.getElementById('feedLoader');

    if (!PostStore._isLoaded) {
        feed.innerHTML = buildSkeletonCardHTML(false) + buildSkeletonCardHTML(true) + buildSkeletonCardHTML(false);
        return;
    }

    if (PostStore._hasError) {
        loader.classList.remove('active');
        feed.innerHTML = '<div class="empty">Server bilan bog\'lanib bo\'lmadi.<br>Internet aloqasini tekshirib, sahifani yangilang.</div>';
        return;
    }

    const initialPosts = PostStore.all();
    viewIO.disconnect();
    feed.innerHTML = '';

    if (initialPosts.length === 0) {
        loader.classList.remove('active');
        feed.innerHTML = '<div class="empty">Hali post yo\'q.<br>Pastdagi "+ Post" tugmasi orqali birinchi postni yarating.</div>';
        return;
    }

    const fragment = document.createDocumentFragment();
    initialPosts.forEach(p => fragment.appendChild(buildPostItem(p, true)));
    feed.appendChild(fragment);

    initLazyFeedObserver();
}

function buildCommentRow(c, mode = 'detail') {
    const row = document.createElement('div');
    row.className = 'comment-row';

    const author = resolveAuthorInfo(c.userId, c.user, c.avatar);
    const init = escapeHtml(author.name.charAt(0).toUpperCase());
    const avHtml = author.avatar
        ? `<img class="comment-avatar" src="${escapeHtml(author.avatar)}" alt="">`
        : `<div class="comment-avatar-initial">${init}</div>`;

    const hasReplies = Array.isArray(c.replies) && c.replies.length > 0 && mode === 'detail';

    row.innerHTML = `
        <div class="comment-avatar-col">
            <div class="c-av-trigger">${avHtml}</div>
            ${hasReplies ? '<div class="thread-line-down"></div>' : ''}
        </div>
        <div class="comment-content">
            <div class="comment-head">
                <span class="comment-user">${escapeHtml(author.name)}${getInlineVerifiedBadge(author.userId, c)}</span>
                <span class="comment-time">${escapeHtml(formatExactTime(c.createdAt))}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
            <div class="comment-actions">
                <button class="comment-act c-like-btn ${isLiked(c) ? 'liked' : ''}">${ICONS.like}<span>${c.likes || 0}</span></button>
                <button class="comment-act c-reply-btn">${ICONS.comment}<span>${(c.replies || []).length || ''}</span></button>
                <button class="comment-act c-share-btn">${ICONS.share}</button>
            </div>
        </div>
    `;

    row.querySelector('.c-av-trigger').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(author.userId); });
    row.querySelector('.comment-user').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(author.userId); });

    const likeBtn = row.querySelector('.c-like-btn');
    likeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!requireTelegramAuth() || !detailPost) return;
        const commentsCopy = JSON.parse(JSON.stringify(detailPost.comments || []));
        const found = findComment(commentsCopy, c.id);
        if (!found) return;

        const liked = toggleLikeObj(found.comment);
        likeBtn.classList.toggle('liked', liked);
        likeBtn.querySelector('span').textContent = found.comment.likes;

        const updated = await PostStore.update(detailPost.id, { comments: commentsCopy });
        if (updated) detailPost = updated;
        if (liked) sendNotification('like', found.comment.userId, detailPost.id, found.comment.id);
    });

    row.querySelector('.c-reply-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!requireTelegramAuth()) return;
        if (mode === 'cd-main' || mode === 'cd-reply') {
            cdReplyTargetId = c.id;
            updateCdReplyModeUI();
            commentDetailInput.focus();
        } else {
            detailReplyTargetId = c.id;
            updateDetailReplyUI();
            detailInput.focus();
        }
    });

    row.querySelector('.c-share-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (detailPost) handleShare(c, detailPost.id, c.id);
    });

    row.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('.c-av-trigger') || e.target.closest('.comment-user')) return;
        if (mode === 'detail' || mode === 'cd-reply') {
            openCommentDetail(c.id);
        }
    });

    return row;
}

async function loadAdminPanelInitial() {

        const [usersCountSnap, postsCountSnap] = await Promise.all([

            </div>
        `;

    }

async function loadAdminUsersNextPage() {
    if (adminIsLoadingUsers || !adminHasMoreUsers) return;
    adminIsLoadingUsers = true;
    adminLoadMoreBtn.textContent = 'Yuklanmoqda...';
    adminLoadMoreBtn.disabled = true;

    try {
        const q = adminLastUserDoc
            ? query(collection(db, USERS_COLLECTION), orderBy("lastActiveAt", "desc"), startAfter(adminLastUserDoc), limit(ADMIN_BATCH_SIZE))
            : query(collection(db, USERS_COLLECTION), orderBy("lastActiveAt", "desc"), limit(ADMIN_BATCH_SIZE));

        const snap = await getDocs(q);
        adminLastUserDoc = snap.docs[snap.docs.length - 1] || adminLastUserDoc;
        adminHasMoreUsers = snap.docs.length === ADMIN_BATCH_SIZE;

        const list = document.getElementById('adminUsersList');
        const { dailyKey, weeklyKey, monthlyKey } = getPeriodKeys();

        for (const dSnap of snap.docs) {
            const u = dSnap.data();
            const uid = String(u.userId || dSnap.id);
            const fullName = [u.firstName, u.lastName].filter(Boolean).join(' ').trim() || 'Foydalanuvchi';
            let verified = Boolean(u.verified || u.isVerified);
            const regDate = formatDateFull(u.createdAt);

            // Kunlik, haftalik va oylik faol vaqtlarni o'qish
            const stats = u.usageStats || {};
            const dailySec = stats[dailyKey] || 0;
            const weeklySec = stats[weeklyKey] || 0;
            const monthlySec = stats[monthlyKey] || 0;

            // Foydalanuvchining aniq postlar sonini serverdan olish
            let userPostsCount = typeof u.postsCount === 'number' ? u.postsCount : 0;
            try {
                const pCountSnap = await getCountFromServer(query(collection(db, POSTS_COLLECTION), where("userId", "==", uid)));
                userPostsCount = pCountSnap.data().count;
            } catch {}

            const card = document.createElement('div');
            card.className = 'admin-user-card';
            card.innerHTML = `
                <div class="admin-user-top">
                    <div style="flex:1;min-width:0">
                        <div class="post-user admin-u-name">${escapeHtml(fullName)}${verified ? VERIFIED_BADGE_SM_SVG : ''}</div>
                        <div class="post-time">ID: ${escapeHtml(uid)} ${u.username ? '• @' + escapeHtml(u.username) : ''}</div>
                    </div>
                </div>
                <div class="admin-user-meta">
                    <div>Ro'yxatdan o'tgan sana: <b>${escapeHtml(regDate)}</b></div>
                    <div>Yozgan postlari soni: <b>${userPostsCount} ta</b></div>
                    <div class="admin-time-pills">
                        <div class="admin-time-pill"><span>Bugun</span><b>${formatDurationSeconds(dailySec)}</b></div>
                        <div class="admin-time-pill"><span>Shu hafta</span><b>${formatDurationSeconds(weeklySec)}</b></div>
                        <div class="admin-time-pill"><span>Shu oy</span><b>${formatDurationSeconds(monthlySec)}</b></div>
                    </div>
                </div>
                <div class="admin-user-actions">
                    <button class="admin-btn ${verified ? 'unverify' : 'verify'}" data-act="toggle-verify">
                        ${verified ? 'Tasdiqni olib tashlash' : 'Tasdiqlash belgisi berish'}
                    </button>
                    <button class="admin-btn del" data-act="delete-user">Kanalni o'chirish</button>
                </div>
            `;

            const verifyBtn = card.querySelector('[data-act="toggle-verify"]');
            verifyBtn.addEventListener('click', async () => {
                verified = !verified;
                try {
                    await updateDoc(doc(db, USERS_COLLECTION, uid), { verified, isVerified: verified });
                    UserCache.set(uid, { ...u, verified, isVerified: verified });
                    verifyBtn.className = `admin-btn ${verified ? 'unverify' : 'verify'}`;
                    verifyBtn.textContent = verified ? 'Tasdiqni olib tashlash' : 'Tasdiqlash belgisi berish';
                    card.querySelector('.admin-u-name').innerHTML = `${escapeHtml(fullName)}${verified ? VERIFIED_BADGE_SM_SVG : ''}`;
                    showToast(verified ? 'Tasdiqlash belgisi berildi' : 'Tasdiqlash belgisi olib tashlandi');
                } catch {
                    verified = !verified;
                    showToast('Xatolik yuz berdi');
                }
            });

            card.querySelector('[data-act="delete-user"]').addEventListener('click', async () => {
                if (uid === String(currentUser.userId)) {
                    showToast('O\'zingizni o\'chira olmaysiz');
                    return;
                }
                try {
                    const userPostsSnap = await getDocs(query(collection(db, POSTS_COLLECTION), where("userId", "==", uid)));
                    for (const up of userPostsSnap.docs) {
                        await deleteDoc(doc(db, POSTS_COLLECTION, up.id));
                    }
                    await deleteDoc(doc(db, USERS_COLLECTION, uid));
                    card.remove();
                    showToast('Kanal va uning barcha postlari o\'chirildi');
                } catch {
                    showToast('O\'chirishda xatolik yuz berdi');
                }
            });

            list.appendChild(card);
        }

        adminLoadMoreBtn.style.display = adminHasMoreUsers ? 'block' : 'none';
        adminLoadMoreBtn.textContent = 'Yana yuklash';
        adminLoadMoreBtn.disabled = false;
    } catch (e) {
        console.error(e);
        adminLoadMoreBtn.style.display = 'none';
    } finally {
        adminIsLoadingUsers = false;
    }
}

/* ================= INIT & NAVIGATION ================= */
async function checkUrlParams() {
    const urlParams = new URLSearchParams(window.location.search);
    const urlPostId = urlParams.get('post');
    const urlCommentId = urlParams.get('comment');
    if (urlPostId) {
        const targetPost = await PostStore.fetchById(urlPostId);
        if (targetPost) {
            openPostDetail(targetPost);
            if (urlCommentId && findComment(detailPost.comments || [], urlCommentId)) {
                openCommentDetail(urlCommentId);
            }
        }
    }
}

(async function bootstrap() {
    renderInitialFeed();
    await initSessionFromServer();
    await PostStore.loadInitial();
    await checkUrlParams();
    updateBackButton();
})();

window.addEventListener('popstate', () => {
    if (anyOverlayOpen()) {
        handleBack();
    }
});
</script>
