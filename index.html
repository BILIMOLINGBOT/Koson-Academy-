<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Yashil Kubik</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            perspective: 1000px;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .scene {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 6s infinite linear;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(45deg);
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #00ff41, #00cc33);
            border: 3px solid #00ff41;
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.5),
                0 0 60px rgba(0, 255, 65, 0.3),
                inset 0 0 30px rgba(0, 255, 65, 0.3);
            opacity: 0.9;
            backdrop-filter: blur(5px);
        }

        .front {
            transform: translateZ(100px);
            background: linear-gradient(135deg, #00ff41, #00cc33);
        }

        .back {
            transform: rotateY(180deg) translateZ(100px);
            background: linear-gradient(135deg, #00cc33, #009926);
        }

        .right {
            transform: rotateY(90deg) translateZ(100px);
            background: linear-gradient(135deg, #00e63d, #00b32b);
        }

        .left {
            transform: rotateY(-90deg) translateZ(100px);
            background: linear-gradient(135deg, #00e63d, #00b32b);
        }

        .top {
            transform: rotateX(90deg) translateZ(100px);
            background: linear-gradient(135deg, #33ff66, #00e63d);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(100px);
            background: linear-gradient(135deg, #00b32b, #008c21);
        }

        @keyframes rotateCube {
            0% {
                transform: rotateX(-20deg) rotateY(0deg);
            }
            100% {
                transform: rotateX(-20deg) rotateY(360deg);
            }
        }

        /* Qo'shimcha effektlar */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.3) 0%, transparent 70%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Matritsali effekt */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ff41;
            border-radius: 50%;
            animation: floatParticle 3s infinite;
            opacity: 0.7;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) translateX(50px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
        <div class="glow"></div>
        
        <!-- Zarrachalar -->
        <div class="particles">
            <div class="particle" style="left: 20%; top: 30%; animation-delay: 0s;"></div>
            <div class="particle" style="left: 50%; top: 60%; animation-delay: 1s;"></div>
            <div class="particle" style="left: 80%; top: 20%; animation-delay: 2s;"></div>
            <div class="particle" style="left: 30%; top: 80%; animation-delay: 1.5s;"></div>
            <div class="particle" style="left: 70%; top: 40%; animation-delay: 0.5s;"></div>
        </div>
    </div>

    <script>
        // Qo'shimcha interaktivlik uchun
        document.addEventListener('mousemove', (e) => {
            const cube = document.querySelector('.cube');
            const rect = cube.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const rotateX = (e.clientY - centerY) / 20;
            const rotateY = (e.clientX - centerX) / 20;
            
            cube.style.transform = `rotateX(${-30 + rotateX}deg) rotateY(${45 + rotateY}deg)`;
        });

        // Avtomatik aylanishni qayta boshlash
        document.addEventListener('mouseleave', () => {
            const cube = document.querySelector('.cube');
            cube.style.transform = 'rotateX(-30deg) rotateY(45deg)';
        });
    </script>
</body>
</html>
