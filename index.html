<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Uy - L.uz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 200px 0;display:flex;flex-direction:column}
        
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 15px 20px; 
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }
        
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feed{width:100%;display:flex;flex-direction:column;padding:0 20px;}
        
        .post-item{width:100%;padding:16px 0;text-align:left;border-bottom:1px solid #2c2c2e;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both}
        .post-item:last-child{border-bottom:none}
        @keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;cursor:pointer}
        .post-avatar-initial{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase;cursor:pointer}
        .post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .post-user{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
        .post-user:active{opacity:.7}
        .post-time{font-size:12px;color:#8e8e93;margin-top:1px}
        .post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        .post-image{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}
        .post-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;background:#000}
        .post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:6px 4px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:14px;text-align:left}
        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55}
        .act-btn.saved{color:#fff}
        .act-btn.saved svg{fill:#fff;stroke:#fff}
        .empty{text-align:center;color:#5a5a5e;padding:60px 20px;font-size:15px;line-height:1.6}
        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
        .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
        .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 8px;transition:transform .15s ease,opacity .15s ease;cursor:pointer;background:none;border:none;font-family:inherit;flex:1}
        .nav-btn:active{transform:scale(.85);opacity:.7}
        .nav-active{color:#fff}.nav-inactive{color:#a1a1aa}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
        .nav-btn .nav-label{font-size:10px;font-weight:500}
        .nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e}
        .nav-btn .nav-avatar-initial{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="brand-title">Lenta</h1>
        <button class="icon-btn">
            <svg viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </button>
    </header>

    <div class="feed" id="feed"></div>
</div>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="nav-btn nav-active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
        <a href="xabar.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="nav-label">Xabar</span></a>
        <a href="qidiruv.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
        <a href="profil.html" class="nav-btn nav-inactive" id="navProfileLink"><span id="navAvatarSlot"></span><span class="nav-label">Profil</span></a>
    </div>
</nav>

<script>
/* ================= DB ================= */
const DB = {
    _K: 'luz_users',
    _S: 'luz_current_user',
    getCurrentUser(){
        const id = localStorage.getItem(this._S);
        if (!id) return null;
        try {
            const users = JSON.parse(localStorage.getItem(this._K)) || [];
            return users.find(u => u.userId === id) || null;
        } catch { return null; }
    },
    getUserById(id){
        try {
            const users = JSON.parse(localStorage.getItem(this._K)) || [];
            return users.find(u => String(u.userId) === String(id)) || null;
        } catch { return null; }
    }
};

/* ================= POST STORE ================= */
const POST_STORE_KEY = 'tg_feed_posts_v1';
const PostStore = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(POST_STORE_KEY);
            this._cache = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(this._cache)) this._cache = [];
        } catch { this._cache = []; }
        return this._cache;
    },
    _save(){
        try { localStorage.setItem(POST_STORE_KEY, JSON.stringify(this._cache || [])); } catch {}
    },
    all(){ return this._load().slice(); },
    update(id, patch){
        const list = this._load();
        const i = list.findIndex(p => p.id === id);
        if (i < 0) return null;
        list[i] = Object.assign({}, list[i], patch);
        this._cache = list;
        this._save();
        return list[i];
    }
};

/* ================= VIEW TRACKER ================= */
const VIEW_LOG_KEY = 'luz_view_log_v1';
const ViewTracker = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(VIEW_LOG_KEY);
            this._cache = raw ? JSON.parse(raw) : {};
            if (!this._cache || typeof this._cache !== 'object') this._cache = {};
        } catch { this._cache = {}; }
        return this._cache;
    },
    _key(uid, pid){ return String(uid) + '::' + String(pid); },
    hasViewed(uid, pid){
        if (!uid || !pid) return false;
        return this._load()[this._key(uid, pid)] === true;
    },
    record(uid, pid){
        if (!uid || !pid) return false;
        const log = this._load();
        const k = this._key(uid, pid);
        if (log[k] === true) return false;
        log[k] = true;
        this._cache = log;
        try { localStorage.setItem(VIEW_LOG_KEY, JSON.stringify(log)); } catch {}
        return true;
    }
};

/* ================= SESSION ================= */
const currentUser = DB.getCurrentUser();
if (!currentUser) window.location.href = 'authorization.html';

/* ================= ORQAGA QAYTISH ================= */
window.history.pushState({ page: 'uy' }, '', '');
window.onpopstate = () => { window.location.href = 'index.html'; };

/* ================= NAV AVATAR ================= */
const navAvatarSlot = document.getElementById('navAvatarSlot');
const cuName = [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi';
const cuInit = cuName.trim().charAt(0).toUpperCase() || 'F';
if (currentUser.photo_url) {
    navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
} else {
    navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;
}

/* ================= HELPERS ================= */
function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diffSec = Math.floor((now - d) / 1000);
    if (diffSec < 5) return 'hozir';
    if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24);
    if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return dd + '.' + mm + '.' + d.getFullYear();
}
function goToProfile(uid){
    if (!uid) return;
    if (String(uid) === String(currentUser?.userId)) window.location.href = 'profil.html';
    else window.location.href = `profil.html?id=${encodeURIComponent(uid)}`;
}

/* ================= POST RENDER ================= */
const savedPosts = new Set();

function countComments(p){
    let n = (p.comments || []).length;
    (p.comments || []).forEach(c => n += (c.replies || []).length);
    return n;
}

function registerView(p, item){
    const uid = currentUser?.userId;
    if (!uid || !p.id) return;
    if (ViewTracker.hasViewed(uid, p.id)) return;
    const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            io.disconnect();
            if (!ViewTracker.record(uid, p.id)) return;
            const fresh = PostStore.all().find(x => x.id === p.id);
            if (!fresh) return;
            const views = (fresh.views || 0) + 1;
            PostStore.update(p.id, { views });
            p.views = views;
            const vc = item.querySelector('.view-count');
            if (vc) vc.textContent = views;
        });
    }, { threshold: 0.5 });
    io.observe(item);
}

function buildPostItem(p){
    const item = document.createElement('div');
    item.className = 'post-item';
    item.dataset.id = p.id;

    const postName = p.user || 'Foydalanuvchi';
    const postInit = (postName.trim().charAt(0) || 'F').toUpperCase();

    // Head
    const head = document.createElement('div');
    head.className = 'post-head';
    const avatarEl = document.createElement(p.avatar ? 'img' : 'div');
    if (p.avatar) {
        avatarEl.className = 'post-avatar';
        avatarEl.src = p.avatar;
        avatarEl.alt = postInit;
    } else {
        avatarEl.className = 'post-avatar-initial';
        avatarEl.textContent = postInit;
    }
    avatarEl.addEventListener('click', () => goToProfile(p.userId));
    head.appendChild(avatarEl);

    const info = document.createElement('div');
    info.className = 'post-head-info';
    const userEl = document.createElement('div');
    userEl.className = 'post-user';
    userEl.textContent = postName;
    userEl.addEventListener('click', () => goToProfile(p.userId));
    const timeEl = document.createElement('div');
    timeEl.className = 'post-time';
    timeEl.textContent = formatExactTime(p.createdAt || p.time);
    info.appendChild(userEl);
    info.appendChild(timeEl);
    head.appendChild(info);
    item.appendChild(head);

    // Media
    if (p.text) {
        const text = document.createElement('div');
        text.className = 'post-text';
        text.textContent = p.text;
        item.appendChild(text);
    }
    if (p.type === 'image' && p.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.src = p.image;
        img.loading = 'lazy';
        item.appendChild(img);
    }
    if (p.type === 'video' && p.image) {
        const vid = document.createElement('video');
        vid.className = 'post-video';
        vid.src = p.image;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        item.appendChild(vid);
    }

    // Actions
    const actions = document.createElement('div');
    actions.className = 'post-actions';

    // LIKE
    const likeBtn = document.createElement('button');
    likeBtn.className = 'act-btn' + (p.liked ? ' liked' : '');
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="act-count like-count">${p.likes || 0}</span>`;
    likeBtn.addEventListener('click', () => {
        const fresh = PostStore.all().find(x => x.id === p.id) || p;
        const liked = !fresh.liked;
        const likes = Math.max(0, (fresh.likes || 0) + (liked ? 1 : -1));
        PostStore.update(p.id, { liked, likes });
        p.liked = liked; p.likes = likes;
        likeBtn.classList.toggle('liked', liked);
        likeBtn.querySelector('.like-count').textContent = likes;
    });
    actions.appendChild(likeBtn);

    // COMMENT
    const commentBtn = document.createElement('button');
    commentBtn.className = 'act-btn';
    commentBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="act-count comment-count">${countComments(p)}</span>`;
    commentBtn.addEventListener('click', () => {
        const ownerId = p.userId || currentUser.userId;
        const isMine = String(ownerId) === String(currentUser.userId);
        const url = isMine ? 'profil.html' : `profil.html?id=${encodeURIComponent(ownerId)}`;
        window.location.href = url + '#comments_' + p.id;
    });
    actions.appendChild(commentBtn);

    // VIEW
    const viewBtn = document.createElement('button');
    viewBtn.className = 'act-btn';
    viewBtn.style.cursor = 'default';
    viewBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="act-count view-count">${p.views || 0}</span>`;
    actions.appendChild(viewBtn);

    // SAVE
    const saveBtn = document.createElement('button');
    saveBtn.className = 'act-btn' + (savedPosts.has(p.id) ? ' saved' : '');
    saveBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
    saveBtn.addEventListener('click', () => {
        if (savedPosts.has(p.id)) { savedPosts.delete(p.id); saveBtn.classList.remove('saved'); }
        else { savedPosts.add(p.id); saveBtn.classList.add('saved'); }
    });
    actions.appendChild(saveBtn);

    // SHARE
    const shareBtn = document.createElement('button');
    shareBtn.className = 'act-btn';
    shareBtn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;
    shareBtn.addEventListener('click', () => {
        const link = location.origin + location.pathname + '?post=' + encodeURIComponent(p.id);
        if (navigator.share) navigator.share({ title: 'Post', text: p.text || 'Post', url: link }).catch(() => {});
        else { try { navigator.clipboard?.writeText(link); } catch {} }
    });
    actions.appendChild(shareBtn);

    item.appendChild(actions);
    registerView(p, item);
    return item;
}

function renderFeed(){
    const feed = document.getElementById('feed');
    const posts = PostStore.all();
    feed.innerHTML = '';
    if (posts.length === 0) {
        feed.innerHTML = '<div class="empty">Hali post yo\'q.<br>Profilga o\'tib birinchi postni yarating.</div>';
        return;
    }
    posts.forEach(p => feed.appendChild(buildPostItem(p)));
}

renderFeed();
</script>
</body>
</html>
