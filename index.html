<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katta tugmalar · Egri chiziqli joylashuv</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2226; /* To'q fon saqlanib qoldi */
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 340px;      /* kengaytirildi: 250 → 340 */
      height: 800px;     /* balandlik ham oshirildi: 700 → 800 */
    }

    .icon-box {
      width: 80px;       /* 60 → 80 */
      height: 80px;      /* 60 → 80 */
      background-color: #4b585a;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3); /* yengil soya qo'shildi */
      transition: transform 0.2s ease;
    }

    .icon-box:hover {
      transform: scale(1.05); /* hoverda biroz kattalashadi */
      background-color: #5b6b6e; /* hover rangi */
    }

    /* SVG ikonka ham kattalashtirildi */
    .icon-box svg {
      width: 48px;       /* 35 → 48 */
      height: 48px;      /* 35 → 48 */
      fill: white;
    }

    /* Kattalashtirilgan o'lchamlarga mos ravishda koordinatalar qayta hisoblandi.
       Egri chiziq (to'lqinsimon) ko'rinishi saqlanib qoldi, lekin tugmalar orasidagi masofa oshdi. */
    .pos1  { top: 0px;   right: 0px; }
    .pos2  { top: 85px;  right: 80px; }
    .pos3  { top: 170px; right: 160px; }
    .pos4  { top: 255px; right: 240px; }
    .pos5  { top: 340px; right: 160px; }
    .pos6  { top: 425px; right: 80px; }
    .pos7  { top: 510px; right: 0px; }
    .pos8  { top: 595px; right: 80px; }
    .pos9  { top: 680px; right: 160px; }
    .pos10 { top: 765px; right: 240px; }

    /* Ekran torayganda ham joylashuvni saqlash uchun moslashuvchanlik */
    @media (max-width: 500px) {
      .container {
        width: 280px;
        height: 700px;
      }
      .icon-box {
        width: 64px;
        height: 64px;
      }
      .icon-box svg {
        width: 38px;
        height: 38px;
      }
      .pos1  { top: 0px;   right: 0px; }
      .pos2  { top: 70px;  right: 60px; }
      .pos3  { top: 140px; right: 120px; }
      .pos4  { top: 210px; right: 180px; }
      .pos5  { top: 280px; right: 120px; }
      .pos6  { top: 350px; right: 60px; }
      .pos7  { top: 420px; right: 0px; }
      .pos8  { top: 490px; right: 60px; }
      .pos9  { top: 560px; right: 120px; }
      .pos10 { top: 630px; right: 180px; }
    }
  </style>
</head>
<body>

  <div class="container" id="iconContainer"></div>

  <script>
    const svgIcon = `<svg viewBox="0 0 24 24"><path d="M19 8c-1.66 0-3 1.34-3 3v2h2v-2c0-.55.45-1 1-1h4v-2h-4zM5 8c-1.66 0-3 1.34-3 3v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1h12V8H5z"/></svg>`;
    
    const positions = ['pos1', 'pos2', 'pos3', 'pos4', 'pos5', 'pos6', 'pos7', 'pos8', 'pos9', 'pos10'];
    const container = document.getElementById('iconContainer');

    // document.write o'rniga to'g'ridan-to'g'ri DOM yaratamiz (xavfsizroq va boshqarish oson)
    positions.forEach(pos => {
      const div = document.createElement('div');
      div.className = `icon-box ${pos}`;
      div.innerHTML = svgIcon;
      container.appendChild(div);
    });
  </script>

</body>
</html>
