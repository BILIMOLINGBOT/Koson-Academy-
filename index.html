<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katta tugmalar · Egri chiziqli joylashuv</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2226;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 500px;      /* yanada kengaytirildi: 340 → 500 */
      height: 1000px;    /* balandlik oshirildi: 800 → 1000 */
    }

    .icon-box {
      width: 110px;      /* 80 → 110 */
      height: 110px;     /* 80 → 110 */
      background-color: #4b585a;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }

    .icon-box:hover {
      transform: scale(1.08);
      background-color: #5b6b6e;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }

    .icon-box:active {
      transform: scale(0.95);
    }

    /* SVG ikonka ham kattalashtirildi */
    .icon-box svg {
      width: 65px;       /* 48 → 65 */
      height: 65px;      /* 48 → 65 */
      fill: white;
    }

    /* Katta o'lchamlarga mos koordinatalar */
    .pos1  { top: 0px;    right: 0px; }
    .pos2  { top: 110px;  right: 110px; }
    .pos3  { top: 220px;  right: 220px; }
    .pos4  { top: 330px;  right: 330px; }
    .pos5  { top: 440px;  right: 220px; }
    .pos6  { top: 550px;  right: 110px; }
    .pos7  { top: 660px;  right: 0px; }
    .pos8  { top: 770px;  right: 110px; }
    .pos9  { top: 880px;  right: 220px; }
    .pos10 { top: 990px;  right: 330px; }

    /* Planshet uchun */
    @media (max-width: 768px) {
      .container {
        width: 400px;
        height: 850px;
      }
      .icon-box {
        width: 90px;
        height: 90px;
      }
      .icon-box svg {
        width: 52px;
        height: 52px;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 90px;   right: 90px; }
      .pos3  { top: 180px;  right: 180px; }
      .pos4  { top: 270px;  right: 270px; }
      .pos5  { top: 360px;  right: 180px; }
      .pos6  { top: 450px;  right: 90px; }
      .pos7  { top: 540px;  right: 0px; }
      .pos8  { top: 630px;  right: 90px; }
      .pos9  { top: 720px;  right: 180px; }
      .pos10 { top: 810px;  right: 270px; }
    }

    /* Mobil uchun */
    @media (max-width: 480px) {
      .container {
        width: 320px;
        height: 700px;
      }
      .icon-box {
        width: 75px;
        height: 75px;
      }
      .icon-box svg {
        width: 44px;
        height: 44px;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 75px;   right: 75px; }
      .pos3  { top: 150px;  right: 150px; }
      .pos4  { top: 225px;  right: 225px; }
      .pos5  { top: 300px;  right: 150px; }
      .pos6  { top: 375px;  right: 75px; }
      .pos7  { top: 450px;  right: 0px; }
      .pos8  { top: 525px;  right: 75px; }
      .pos9  { top: 600px;  right: 150px; }
      .pos10 { top: 675px;  right: 225px; }
    }
  </style>
</head>
<body>

  <div class="container" id="iconContainer"></div>

  <script>
    const svgIcon = `<svg viewBox="0 0 24 24"><path d="M19 8c-1.66 0-3 1.34-3 3v2h2v-2c0-.55.45-1 1-1h4v-2h-4zM5 8c-1.66 0-3 1.34-3 3v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1h12V8H5z"/></svg>`;
    
    const positions = ['pos1', 'pos2', 'pos3', 'pos4', 'pos5', 'pos6', 'pos7', 'pos8', 'pos9', 'pos10'];
    const container = document.getElementById('iconContainer');

    positions.forEach((pos, index) => {
      const div = document.createElement('div');
      div.className = `icon-box ${pos}`;
      div.innerHTML = svgIcon;
      div.setAttribute('role', 'button');
      div.setAttribute('aria-label', `Tugma ${index + 1}`);
      div.setAttribute('tabindex', '0');
      
      // Klaviatura bilan boshqarish
      div.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          div.click();
        }
      });
      
      // Bosilganda qandaydir amal (masalan, konsolga yozish)
      div.addEventListener('click', () => {
        console.log(`Tugma ${index + 1} bosildi`);
        // Bu yerga kerakli amalni yozing
      });
      
      container.appendChild(div);
    });
  </script>

</body>
</html>
