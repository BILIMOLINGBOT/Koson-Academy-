<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px;
        }

        .profile-pic-wrapper {
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        .name {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
        }

        .stat-number { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .stat-label { color: #8e8e93; font-size: 13px; }

        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:active { transform: scale(0.96); opacity: 0.8; }
        .btn-light { background-color: #ffffff; color: #000000; }
        .btn-dark { background-color: #1c1c1e; color: #ffffff; }
        .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .btn-circle {
            background-color: #1c1c1e;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-decoration: none;
        }

        /* --- ZAMONAVIY PILL (ISLAND) TUGMA --- */
        .start-pill-btn {
            position: fixed;
            right: 20px;
            bottom: 100px; /* Pastki menyudan teparoqda */
            z-index: 100;
            display: none; /* Dastlab yashiringan (faqat o'z profilida chiqadi) */
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.95);
            color: #000000;
            padding: 14px 28px;
            border-radius: 100px; /* Pill shakli */
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.3px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5), 
                0 0 0 1px rgba(255, 255, 255, 0.2) inset,
                0 0 20px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .start-pill-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.8);
        }

        .start-pill-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        /* ----------------------------------- */

        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 12px 6px;
            border-radius: 16px;
            text-align: center;
            flex: 1;
            font-weight: 500;
        }
        .tab-item.active { background-color: #48484a; color: #ffffff; }

        /* Pastki Menyu */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            color: #a1a1aa;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-btn.nav-active { color: #ffffff; }
        .nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; }
        .nav-btn .nav-label { font-size: 10px; font-weight: 500; }
        .nav-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    </style>
</head>
<body>

    <div class="container">
        <!-- Profil qismi -->
        <div class="profile-pic-wrapper">
            <img id="userPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" class="profile-pic">
        </div>

        <h1 class="name" id="userName">Foydalanuvchi</h1>
        <p class="last-seen" id="userStatus">@username</p>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number">0</span><span class="stat-label">Obunalar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number">0</span><span class="stat-label">Obunachilar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number">0</span><span class="stat-label">Postlar</span></div>
        </div>

        <!-- Tugmalar -->
        <div class="action-buttons">
            <div id="ownProfileActions" style="display:none; width:100%; gap:10px;">
                <a href="tahrirlash.html" class="btn btn-light">
                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> 
                    Tahrirlash
                </a>
                <a href="setting.html" class="btn-circle">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </a>
            </div>
            
            <div id="otherProfileActions" style="display:none; width:100%; gap:10px;">
                <button class="btn btn-light" id="subscribeBtn">Obuna bo'lish</button>
                <a href="xabar.html" class="btn btn-dark">Xabar</a>
            </div>
        </div>

        <div class="tabs">
            <div class="tab-item active">Bosh sahifa</div>
            <div class="tab-item">Postlar</div>
            <div class="tab-item">Video</div>
        </div>
        
        <p style="color: #8e8e93; font-size: 14px; text-align: center; margin-top: 20px;">Hali ma'lumot yo'q</p>
    </div>

    <!-- ZAMONAVIY "BOSHLASH" PILL TUGMASI -->
    <!-- Unga href="boshlash.html" biriktirilgan -->
    <a href="boshlash.html" class="start-pill-btn" id="startPillBtn">
        Boshlash
        <svg viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
    </a>

    <!-- Pastki menyu oddiy sahifalarga yo'naltirilgan -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span class="nav-label">Uy</span></a>
            <a href="reels.html" class="nav-btn"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><polygon points="10 12 15 14.5 10 17 10 12" fill="currentColor"></polygon></svg><span class="nav-label">Reels</span></a>
            <a href="xabar.html" class="nav-btn"><svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg><span class="nav-label">Xabar</span></a>
            <a href="qidiruv.html" class="nav-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="nav-label">Qidiruv</span></a>
            <a href="profil.html" class="nav-btn nav-active"><img id="navUserPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" class="nav-avatar"><span class="nav-label">Profil</span></a>
        </div>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // Foydalanuvchini aniqlash
        const urlParams = new URLSearchParams(window.location.search);
        const profileUserId = urlParams.get('id');
        const user = tg?.initDataUnsafe?.user;
        const myUserId = user?.id;
        
        const isOwnProfile = !profileUserId || String(profileUserId) === String(myUserId);

        if (isOwnProfile) {
            document.getElementById('ownProfileActions').style.display = 'flex';
            
            // "Boshlash" tugmasini faqat o'z profilida ko'rsatish
            document.getElementById('startPillBtn').style.display = 'flex';

            if (user) {
                const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
                document.getElementById('userName').textContent = fullName;
                document.getElementById('userStatus').textContent = user.username ? '@' + user.username : 'Telegram foydalanuvchisi';
                if (user.photo_url) {
                    document.getElementById('userPhoto').src = user.photo_url;
                    document.getElementById('navUserPhoto').src = user.photo_url;
                }
            }
        } else {
            document.getElementById('otherProfileActions').style.display = 'flex';
            document.getElementById('userName').textContent = 'Foydalanuvchi';
            document.getElementById('userStatus').textContent = 'Profil #' + profileUserId;
        }

        // Kichik vizual effektlar (Haptic)
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('click', () => {
                tg?.HapticFeedback?.selectionChanged();
            });
        });
    </script>
</body>
</html>
