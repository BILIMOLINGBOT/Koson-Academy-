<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrat Farzandlari - UI Clone</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #181124 0%, #08050c 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Asosiy Mobil Konteyner */
        .app-container {
            width: 100%;
            max-width: 400px; /* Telefon ekrani kengligi uchun */
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top, #231835, #08050c 60%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Yuqori Panel (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px 10px 15px;
            z-index: 10;
        }

        .leagues-pill {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 12px 6px 35px;
            border-radius: 20px;
            position: relative;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .leagues-pill .trophy-icon {
            position: absolute;
            left: -10px;
            top: -12px;
            font-size: 32px;
            color: #a482ff;
            text-shadow: 0 0 15px rgba(164, 130, 255, 0.6);
            transform: rotate(-10deg);
        }

        .leagues-pill .new-badge {
            position: absolute;
            top: -10px;
            right: 10px;
            background: #ff527b;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .stats-pill {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            font-size: 14px;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-item .fa-star {
            color: #ffc800;
            font-size: 16px;
        }

        .stat-item .xp-icon {
            background: #2a8bf2;
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            font-style: italic;
            font-weight: 900;
        }

        /* Kurs Sarlavhasi */
        .course-title {
            text-align: center;
            margin-top: 10px;
            z-index: 10;
        }

        .course-title h2 {
            font-size: 15px;
            color: #b5b0c0;
            font-weight: 700;
        }

        .course-title .subtitle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 800;
            margin-top: 4px;
            cursor: pointer;
        }

        .course-title .subtitle i.fa-bullseye {
            color: #4db8ff;
        }

        .course-title .subtitle i.fa-chevron-down {
            font-size: 12px;
            color: #888;
        }

        /* 3D Yo'lak (Path) qismi */
        .path-container {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        /* Kubiklarni ushlab turuvchi quti */
        .cube-wrapper {
            position: absolute;
            width: 64px;
            height: 64px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 3D Kubiklar (CSS Transform yordamida) */
        .cube {
            width: 60px;
            height: 60px;
            transform: rotateX(55deg) rotateZ(45deg); /* Izometrik ko'rinish */
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Kubik ichidagi ikonkani to'g'rilash */
        .cube i {
            transform: rotateZ(-45deg) rotateX(-55deg);
            font-size: 24px;
            font-weight: 900;
        }

        /* Bajarilgan yashil kubiklar */
        .cube-green {
            background: #8ae3b9;
            border: 2px solid #b7f4d5;
            /* Pastga qarab 3D soya (shadow) tushirish */
            box-shadow: 
                -1px 1px 0 #4ca37d, -2px 2px 0 #4ca37d, -3px 3px 0 #4ca37d,
                -4px 4px 0 #4ca37d, -5px 5px 0 #4ca37d, -6px 6px 0 #4ca37d,
                -7px 7px 0 #4ca37d, -8px 8px 0 #4ca37d, -9px 9px 0 #4ca37d,
                -10px 10px 0 #4ca37d, -11px 11px 0 #4ca37d, -12px 12px 0 #4ca37d,
                -15px 15px 25px rgba(138, 227, 185, 0.4);
        }
        .cube-green i { color: #1a5c3d; }

        /* Hozirgi binafsharang kubik */
        .cube-purple {
            background: #9b74ff;
            border: 2px solid #c4abff;
            box-shadow: 
                -1px 1px 0 #6e4cd9, -2px 2px 0 #6e4cd9, -3px 3px 0 #6e4cd9,
                -4px 4px 0 #6e4cd9, -5px 5px 0 #6e4cd9, -6px 6px 0 #6e4cd9,
                -7px 7px 0 #6e4cd9, -8px 8px 0 #6e4cd9, -9px 9px 0 #6e4cd9,
                -10px 10px 0 #6e4cd9, -11px 11px 0 #6e4cd9, -12px 12px 0 #6e4cd9,
                -15px 15px 25px rgba(155, 116, 255, 0.5);
            z-index: 5;
        }

        /* Qulflangan kulrang kubik */
        .cube-gray {
            background: #e2e2e2;
            border: 2px solid #ffffff;
            box-shadow: 
                -1px 1px 0 #a8a8a8, -2px 2px 0 #a8a8a8, -3px 3px 0 #a8a8a8,
                -4px 4px 0 #a8a8a8, -5px 5px 0 #a8a8a8, -6px 6px 0 #a8a8a8,
                -7px 7px 0 #a8a8a8, -8px 8px 0 #a8a8a8, -9px 9px 0 #a8a8a8,
                -10px 10px 0 #a8a8a8, -11px 11px 0 #a8a8a8, -12px 12px 0 #a8a8a8,
                -15px 15px 25px rgba(255, 255, 255, 0.1);
        }
        .cube-gray i { color: #666; font-size: 20px; }

        /* Bo'sh kubik ramkasi */
        .cube-empty {
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                -1px 1px 0 rgba(255,255,255,0.05), -2px 2px 0 rgba(255,255,255,0.05), 
                -3px 3px 0 rgba(255,255,255,0.05), -4px 4px 0 rgba(255,255,255,0.05);
        }

        /* START yozuvi (Tooltip) */
        .start-tooltip {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: #4b5563;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .start-tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #4b5563 transparent transparent transparent;
        }

        /* Zigzag pozitsiyalari (Pastdan Tepaga) */
        .pos-1 { bottom: 2%; left: 15%; }
        .pos-2 { bottom: 13%; left: 35%; }
        .pos-3 { bottom: 24%; left: 55%; }
        .pos-4 { bottom: 35%; left: 75%; }
        .pos-5 { bottom: 46%; left: 55%; }
        .pos-6 { bottom: 57%; left: 35%; } /* Purple / START */
        .pos-7 { bottom: 68%; left: 55%; } /* Gray / Lock */
        .pos-8 { bottom: 79%; left: 75%; } /* Empty */

        /* Pastki Harakatlar Paneli (Tugma qismi) */
        .bottom-action {
            padding: 20px 20px 30px 20px;
            background: linear-gradient(to top, rgba(14,9,22,1) 40%, rgba(14,9,22,0));
            z-index: 20;
            position: absolute;
            bottom: 70px; /* Nav bar balandligi */
            width: 100%;
        }

        .continue-btn {
            width: 100%;
            background: #a482ff;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 5px 0 #7b58d6;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.1s;
        }

        .continue-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #7b58d6;
        }

        .next-level-hint {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #666;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .next-level-hint .line {
            height: 1px;
            background: #333;
            width: 50px;
        }

        /* Eng Pastki Navigatsiya (Bottom Nav) */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #110b1a;
            padding: 15px 0 20px 0;
            border-top: 1px solid #221a30;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 30;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #6c667a;
            font-size: 11px;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item.active {
            color: #a482ff;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Yuqori qism -->
    <div class="header">
        <div class="leagues-pill">
            <i class="fa-solid fa-trophy trophy-icon"></i>
            Leagues <i class="fa-solid fa-chevron-right" style="font-size:10px; margin-left:3px;"></i>
            <div class="new-badge">New</div>
        </div>
        <div class="stats-pill">
            <div class="stat-item">
                <i class="fa-solid fa-star"></i> 328
            </div>
            <div class="stat-item">
                <span class="xp-icon">XP</span> 261
            </div>
        </div>
    </div>

    <!-- Sarlavha -->
    <div class="course-title">
        <h2>Lv.2 Atrofimizdagi dunyo</h2>
        <div class="subtitle">
            <i class="fa-solid fa-bullseye"></i> General English <i class="fa-solid fa-chevron-down"></i>
        </div>
    </div>

    <!-- 3D Yo'lak (Kubiklar) -->
    <div class="path-container">
        <!-- 1 - Yashil -->
        <div class="cube-wrapper pos-1">
            <div class="cube cube-green"><i class="fa-solid fa-check"></i></div>
        </div>
        <!-- 2 - Yashil -->
        <div class="cube-wrapper pos-2">
            <div class="cube cube-green"><i class="fa-solid fa-check"></i></div>
        </div>
        <!-- 3 - Yashil -->
        <div class="cube-wrapper pos-3">
            <div class="cube cube-green"><i class="fa-solid fa-check"></i></div>
        </div>
        <!-- 4 - Yashil -->
        <div class="cube-wrapper pos-4">
            <div class="cube cube-green"><i class="fa-solid fa-check"></i></div>
        </div>
        <!-- 5 - Yashil -->
        <div class="cube-wrapper pos-5">
            <div class="cube cube-green"><i class="fa-solid fa-check"></i></div>
        </div>
        <!-- 6 - Binafsha (Joriy qadam) -->
        <div class="cube-wrapper pos-6">
            <div class="start-tooltip">START</div>
            <div class="cube cube-purple"></div>
        </div>
        <!-- 7 - Kulrang (Qulflangan) -->
        <div class="cube-wrapper pos-7">
            <div class="cube cube-gray"><i class="fa-solid fa-lock"></i></div>
        </div>
        <!-- 8 - Bo'sh -->
        <div class="cube-wrapper pos-8">
            <div class="cube cube-empty"></div>
        </div>
    </div>

    <!-- Harakat tugmasi -->
    <div class="bottom-action">
        <button class="continue-btn">CONTINUE THE TASK</button>
        <div class="next-level-hint">
            <div class="line"></div>
            Lv.1 Hello. English!
            <div class="line"></div>
        </div>
    </div>

    <!-- Menyu -->
    <div class="bottom-nav">
        <div class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Asosiy</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-layer-group"></i>
            <span>O'rganish</span>
        </div>
        <div class="nav-item active">
            <i class="fa-solid fa-bullseye"></i>
            <span>Missiya</span>
        </div>
        <div class="nav-item">
            <i class="fa-regular fa-flag"></i>
            <span>O'yinlar</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profil</span>
        </div>
    </div>

</div>

</body>
</html>
