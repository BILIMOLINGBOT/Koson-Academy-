<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnU - General English Path</title>
  <style>
    /* CSS Variables for precise theming */
    :root {
      --bg-color: #08090B;
      --header-bg: rgba(25, 20, 35, 0.75);
      --btn-color: #4B5561;
      --purple-glow: rgba(139, 85, 243, 0.4);
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Core Reset & Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden; /* Lock body scrolling to container */
    }

    /* Mobile First Container */
    .app-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: var(--bg-color);
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    /* Top Ambient Glow */
    .ambient-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 250px;
      background: radial-gradient(ellipse, rgba(74, 30, 150, 0.3) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Pill Header */
    .header {
      position: absolute;
      top: 45px; /* iOS Status bar clearance */
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 380px;
      height: 74px;
      background: var(--header-bg);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.05);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #1d64e8, #4590ff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
    }

    .header-icon svg {
      fill: #fff;
      width: 16px;
      height: 16px;
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-chevron svg {
      stroke: #fff;
      width: 24px;
      height: 24px;
      opacity: 0.8;
    }

    /* Scrollable Path Area */
    .scroll-path {
      position: relative;
      height: 100%;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding-top: 160px; /* Space for header */
      padding-bottom: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      scroll-behavior: smooth;
      /* Hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .scroll-path::-webkit-scrollbar {
      display: none;
    }

    /* Individual Map Nodes */
    .node {
      position: relative;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -30px; /* Vertical overlap */
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    /* Zig-Zag Diagonal Translation */
    .node:nth-child(1) { transform: translateX(50px); }
    .node:nth-child(2) { transform: translateX(-15px); }
    .node:nth-child(3) { transform: translateX(-70px); }
    .node:nth-child(4) { transform: translateX(5px); }
    .node:nth-child(5) { transform: translateX(65px); }
    .node:nth-child(6) { transform: translateX(20px); }
    .node:nth-child(7) { transform: translateX(-35px); z-index: 20; } /* Purple Active */
    .node:nth-child(8) { transform: translateX(-80px); }
    .node:nth-child(9) { transform: translateX(-20px); }

    /* Interaction Scaling Wrapper */
    .cube-wrapper {
      position: relative;
      width: 100%;
      transition: transform 0.15s ease-out;
    }

    .node.interactive .cube-wrapper {
      cursor: pointer;
    }

    .node.interactive:active .cube-wrapper {
      transform: scale(0.93);
    }

    /* Cube Base Images */
    .cube-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* The Fading Bottom Gradient overlay */
    .cube-wrapper::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: -10%;
      width: 120%;
      height: 55%;
      background: linear-gradient(to bottom, transparent 0%, rgba(8, 9, 11, 0.9) 70%, var(--bg-color) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Lock Icon Positioning */
    .lock-icon {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      object-fit: contain;
      z-index: 6;
      opacity: 0.85;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* ---------------------------------
       CUBE STATES
    ----------------------------------- */
    
    /* Locked (Greyish tint for depth) */
    .node.locked .cube-img {
      filter: grayscale(100%) brightness(0.95);
    }

    /* Active (Vivid Purple) */
    .node.active .cube-img {
      /* Mathematically tints the white base cube to vivid purple */
      filter: sepia(100%) hue-rotate(235deg) saturate(350%) brightness(0.9) contrast(1.1);
    }
    
    .node.active .cube-wrapper::before {
      /* Strong ambient shadow for active node */
      content: '';
      position: absolute;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 60px;
      background: var(--purple-glow);
      filter: blur(25px);
      z-index: -1;
    }

    /* Completed (Uses dedicated Green Asset) */
    /* No filters needed since asset is already green */

    /* ---------------------------------
       START BUTTON
    ----------------------------------- */
    
    .start-button-wrapper {
      position: absolute;
      top: -85px; /* Floats directly above the active cube */
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      transition: transform 0.15s ease-out;
      cursor: pointer;
    }

    .start-button-wrapper:active {
      transform: translateX(-50%) scale(0.95);
    }

    .start-btn {
      width: 280px;
      height: 70px;
      background-color: var(--btn-color);
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255,255,255,0.15);
      position: relative;
    }

    /* Downward Pointer */
    .start-btn::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 14px 16px 0;
      border-style: solid;
      border-color: var(--btn-color) transparent transparent transparent;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="ambient-glow"></div>

    <!-- Header Navigation -->
    <header class="header">
      <div class="header-left">
        <div class="header-icon">
          <!-- Abstract Target SVG -->
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
        </div>
        <div class="header-title">General English</div>
      </div>
      <div class="header-chevron">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </header>

    <!-- Scrollable Isometric Layout -->
    <main class="scroll-path">
      
      <!-- 6 Locked Nodes -->
      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>
      
      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>

      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>

      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>

      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>

      <div class="node locked">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="lock-icon" alt="Locked">
        </div>
      </div>

      <!-- Active Purple Node -->
      <div class="node active interactive">
        <div class="start-button-wrapper" id="startAction">
          <div class="start-btn">START</div>
        </div>
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-img" alt="Cube Base">
        </div>
      </div>

      <!-- Completed Green Nodes -->
      <div class="node completed interactive">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" class="cube-img" alt="Completed Green Cube">
        </div>
      </div>

      <div class="node completed interactive">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" class="cube-img" alt="Completed Green Cube">
        </div>
      </div>

    </main>
  </div>

  <script>
    // Interaction logic for buttons and interactive cubes
    document.addEventListener("DOMContentLoaded", () => {
      
      const triggerStudyAction = () => {
        // Trigger a daily routine prompt simulating moving to the active lesson
        alert("Ready to memorize your next 5 English sentences?");
      };

      // Add click/touch events to the floating START button
      const startBtnWrapper = document.getElementById('startAction');
      startBtnWrapper.addEventListener('click', triggerStudyAction);
      
      // Add basic interactions for the active and completed node wrappers
      const interactiveNodes = document.querySelectorAll('.node.interactive .cube-wrapper');
      
      interactiveNodes.forEach(wrapper => {
        wrapper.addEventListener('click', () => {
          // If it is the parent of the active purple cube, start action
          if(wrapper.parentElement.classList.contains('active')) {
            triggerStudyAction();
          } else {
             // For completed green nodes
            console.log("Reviewing previous lesson.");
          }
        });
      });

      // Automatically scroll so the START button is in the center of the viewport
      const scrollPath = document.querySelector('.scroll-path');
      const startNode = document.querySelector('.node.active');
      
      if(scrollPath && startNode) {
        // Delaying slightly allows DOM to calculate exact height mappings before shifting
        setTimeout(() => {
          const containerHeight = scrollPath.clientHeight;
          const nodeTop = startNode.offsetTop;
          scrollPath.scrollTo({
            top: nodeTop - (containerHeight / 2) + 120, // offset for visual balance
            behavior: 'smooth'
          });
        }, 100);
      }
    });
  </script>

</body>
</html>
