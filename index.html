<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tualet qog'ozi · Rangli kartalar (2 yashil, 1 pushti, 7 kulrang)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #171E22; /* chuqur quyuq fon */
      font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    /* Asosiy sahna — karta maydoni */
    .container {
      position: relative;
      width: 340px;          /* biroz kengroq, qulay joylashuv uchun */
      height: 720px;         /* balandlik yetarli, barcha tugmalar sig'adi */
      margin: 0 auto;
    }

    /* Umumiy karta (ikonka) uslubi */
    .icon {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 16px;       /* yumshoq burchaklar */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35); /* chuqurlik hissi */
      transition: transform 0.1s ease;
      background-color: #536063; /* standart kulrang (fallback) */
    }

    /* ichidagi piktogramma (SVG yoki PNG) */
    .icon img {
      width: 40px;
      height: 40px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
    }

    /* ---------- RANG KLASSLARI (aniq taqsimot) ---------- */
    .green-card {
      background-color: #2E7D32; /* to'q yashil, tabiiy */
      box-shadow: 0 6px 14px rgba(46, 125, 50, 0.4);
    }

    .pink-card {
      background-color: #E91E63; /* pushti / magenta */
      box-shadow: 0 6px 14px rgba(233, 30, 99, 0.4);
    }

    .gray-card {
      background-color: #4A5559; /* o'rtacha kulrang, lekin farq seziladi */
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    /* ---------- ZIG-ZAG JOYLASHUV (absolyut koordinatalar) ---------- */
    /* Har bir karta alohida joylashadi, ko'rinish to'lqinsimon */
    .pos-1 { top: 10px; right: 15px; }    /* o'ng tepa */
    .pos-2 { top: 90px; right: 75px; }   /* o'ng-o'rta, ichkariga */
    .pos-3 { top: 170px; left: 75px; }   /* chap-o'rta, tashqariga */
    .pos-4 { top: 250px; left: 15px; }   /* chap chekka */
    .pos-5 { top: 330px; left: 75px; }   /* yana ichkariga */
    .pos-6 { top: 410px; right: 75px; }  /* o'ng tomonga siljish */
    .pos-7 { top: 490px; right: 15px; }  /* o'ng chekka */
    .pos-8 { top: 570px; left: 75px; }   /* chapga */
    .pos-9 { top: 650px; left: 15px; }   /* pastki chap burchak */
    .pos-10 { top: 700px; left: 15px; }  /* eng pastki, deyarli burchakda */
    /* eslatma: oxirgi ikki karta orasida 50px farq — zigzag davomi */

    /* Kichik ekranlarda ham joylashuvni biroz moslashtiramiz */
    @media (max-width: 400px) {
      .container {
        width: 280px;
        height: 680px;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      .icon img {
        width: 34px;
        height: 34px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 
      ============================================================
      KARTALAR RO'YXATI (10 ta, xuddi so'ralgandek):
      - 2 ta YASHIL (green-card)
      - 1 ta PUSHTI (pink-card)
      - 7 ta KULRANG (gray-card)
      ============================================================
      Zig-zag tartibi: yuqoridan pastga, o'ng-chap almashinib
    -->

    <!-- 1-karta: KULRANG (o'ng tepa) -->
    <div class="icon gray-card pos-1">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 2-karta: YASHIL (o'ng ichkariga) -->
    <div class="icon green-card pos-2">
      <img src="tp.svg" alt="Tualet qog'ozi yashil">
    </div>

    <!-- 3-karta: KULRANG (chapga o'tish) -->
    <div class="icon gray-card pos-3">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 4-karta: PUSHTI (chap chekka, yagona pushti) -->
    <div class="icon pink-card pos-4">
      <img src="tp.svg" alt="Tualet qog'ozi pushti">
    </div>

    <!-- 5-karta: KULRANG (ichkariga) -->
    <div class="icon gray-card pos-5">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 6-karta: YASHIL (o'ngga siljiydi, ikkinchi yashil) -->
    <div class="icon green-card pos-6">
      <img src="tp.svg" alt="Tualet qog'ozi yashil">
    </div>

    <!-- 7-karta: KULRANG (o'ng chekka) -->
    <div class="icon gray-card pos-7">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 8-karta: KULRANG (chapga) -->
    <div class="icon gray-card pos-8">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 9-karta: KULRANG (pastki chap) -->
    <div class="icon gray-card pos-9">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 10-karta: KULRANG (eng pastki) -->
    <div class="icon gray-card pos-10">
      <img src="tp.svg" alt="Tualet qog'ozi kulrang">
    </div>

    <!-- 
      RANGLAR SANOG'I:
      Yashil: 2 ta (2, 6-o'rinlar)
      Pushti: 1 ta (4-o'rin)
      Kulrang: 7 ta (1, 3, 5, 7, 8, 9, 10) — jami 7
      Hammasi: 2+1+7 = 10 ✅ 
    -->
  </div>

  <!-- 
    =====================================================
    IZOH: tp.svg fayli mavjud emas, shuning uchun rasm ko'rinmasligi mumkin.
    Brauzerda piktogramma o'rniga muqobil rang yoki fon ko'rinadi.
    Ammo dizayn va rang taqsimoti to'liq ko'rsatilgan.
    Agar xohlasangiz, quyidagi inline SVG ni ishlatib ko'ring (ixtiyoriy).
    =====================================================
  -->
  <!-- SVG fallback (agar rasm yuklanmasa ham ko'rinish uchun) -->
  <div style="display: none;">
    <!-- kichik svg namunasi: tualet qog'ozi silueti -->
    <svg id="tp-svg" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="10" stroke="white" stroke-width="2" fill="white" opacity="0.7"/>
      <circle cx="12" cy="12" r="4" fill="#2c3e50" />
    </svg>
  </div>
</body>
</html>
