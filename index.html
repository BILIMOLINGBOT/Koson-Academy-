<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Uy - Social Feed</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #000000);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { transition: transform 0.15s ease, opacity 0.15s ease; }
        .nav-btn:active { transform: scale(0.85); opacity: 0.7; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Aktiv nav tugmasi */
        .nav-active { color: #ffffff; }
        .nav-inactive { color: #a1a1aa; }
        .nav-inactive:hover { color: #ffffff; }

        /* ===== SPLASH SCREEN ===== */
        #splashScreen {
            opacity: 1;
            visibility: visible;
            transition: opacity 1.5s ease-out, visibility 1.5s ease-out;
        }
        #splashScreen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .logo-text {
            opacity: 1;
            transition: opacity 1.5s ease-out;
        }
        #splashScreen.hide .logo-text {
            opacity: 0;
        }

        @keyframes loadingBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .loading-bar {
            animation: loadingBar 4s linear forwards;
        }
        /* ===== SPLASH SCREEN TUGADI ===== */
    </style>
</head>
<body class="text-white antialiased flex justify-center min-h-screen selection:bg-zinc-800">

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.requestFullscreen) tg.requestFullscreen();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
            }

            const splash = document.getElementById('splashScreen');
            if (splash) {
                setTimeout(() => {
                    splash.classList.add('hide');
                    setTimeout(() => {
                        splash.remove();
                    }, 1500);
                }, 4000);
            }
        });
    </script>
</body>
</html>
