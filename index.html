<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const firebaseConfig = {
    apiKey: "AIzaSyD0gBUJNcrgvvntcrfKK7Ky8t6_9Qb96Io",

function withTimeout(p, ms = 8000){
    return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
function likeCount(o){ return Array.isArray(o?.likedBy) ? o.likedBy.length : (o?.likes || 0); }

/* ================= TELEGRAM ================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
    try {
        tg.ready(); tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    } catch {}
}

/* 3-BAND: Autentifikatsiya UI'ni bloklamaydi, 8s timeout + AbortController */
const AuthState = { status: 'idle', verifiedServer: false };

async function ensureAuth(){
    if (!tg?.initData || AUTH_URL.includes('REGION')) {
        AuthState.status = tg?.initData ? 'tg_local' : 'guest';
        return;
    }
    AuthState.status = 'loading';
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);
    try {
        const r = await fetch(AUTH_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: tg.initData }),
            signal: controller.signal
        });
        clearTimeout(timer);
        if (!r.ok) throw new Error('Auth HTTP ' + r.status);
        const { token } = await r.json();
        await withTimeout(signInWithCustomToken(auth, token), 8000);
        AuthState.status = 'authenticated';
        AuthState.verifiedServer = true;
    } catch (e) {
        clearTimeout(timer);
        AuthState.status = 'error';
        console.warn('Auth xatosi (ilova ishlashda davom etadi):', e);
    }
}

function isGuestUser(){
    if (!currentUser || !currentUser.userId) return true;
    return String(currentUser.userId).startsWith('mehmon_');
}

function requireAuthenticatedAction(){
    if (!isGuestUser()) return true;
    if (!tg) {
        showToast("Davom etish uchun ilovani Telegram orqali oching");
    } else if (AuthState.status === 'error') {
        showToast("Autentifikatsiya xatosi. Qayta urinib ko'ring");
        ensureAuth();
    } else {
        showToast("Amalni bajarish uchun Telegram orqali kiring");
    }
    return false;
}

/* ================= KONSTANTALAR ================= */
const MAX_VIDEO_SIZE = 15 * 1024 * 1024;
const REPLIES_KEY = 'luz_my_replies_v1';
const VERIFIED_KEY = 'luz_verified_badge';
const SAVED_KEY = 'luz_saved_posts_v1';
const SAVED_COMMENTS_KEY = 'luz_saved_comments_v1';
const FEED_BATCH_SIZE = 20; // 4.5-band: Dastlab 20 ta post

const VERIFIED_BADGE_SM_SVG = `<svg class="verified-badge-sm" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path><path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;

/* ================= 4-BAND: USER CACHE & REQUEST DEDUPLICATION ================= */
const DB = {
    _K: 'luz_users',
    _S: 'luz_current_user',
    _remoteUsers: {},
    _inFlight: new Map(), // Request deduplication

    _getUsers() {
        try { const arr = JSON.parse(localStorage.getItem(this._K)); return Array.isArray(arr) ? arr : []; } catch { return []; }
    },
    _saveUsers(users) {
        const map = new Map();
        users.forEach(u => {
            if (!u || !u.userId) return;
            const idStr = String(u.userId);
            if (idStr === 'me' || idStr === 'undefined' || idStr === 'null') return;
            map.set(idStr, { ...u, userId: idStr });
        });
        const clean = Array.from(map.values());
        localStorage.setItem(this._K, JSON.stringify(clean));
        return clean;
    },
    getCurrentUser() {
        const id = localStorage.getItem(this._S);
        if (!id) return null;
        return this._getUsers().find(u => String(u.userId) === String(id)) || null;
    },
    getUserById(id) {
        if (!id) return null;
        const idStr = String(id);
        if (this._remoteUsers[idStr]) return this._remoteUsers[idStr];
        return this._getUsers().find(u => String(u.userId) === idStr) || null;
    },
    /* Faqat kerakli muallif profilini UID orqali keshlab yuklaydi (maxfiy maydonlarsiz) */
    fetchUser(uid) {
        if (!uid) return Promise.resolve(null);
        const idStr = String(uid);
        if (idStr === 'me' || idStr.startsWith('mehmon_')) return Promise.resolve(null);
        if (this._remoteUsers[idStr]) return Promise.resolve(this._remoteUsers[idStr]);
        if (this._inFlight.has(idStr)) return this._inFlight.get(idStr);

        const req = withTimeout(getDoc(doc(db, USERS_COLLECTION, idStr)), 8000)
            .then(snap => {
                if (snap.exists()) {
                    const d = snap.data();
                    // 4.9-band: Telefon raqami va maxfiy maydonlarni keshga olmaslik
                    this._remoteUsers[idStr] = {
                        userId: idStr,
                        firstName: d.firstName || '',
                        lastName: d.lastName || '',
                        username: d.username || '',
                        photo_url: d.photo_url || null,
                        verified: Boolean(d.verified || d.isVerified),
                        isVerified: Boolean(d.verified || d.isVerified)
                    };
                } else {
                    this._remoteUsers[idStr] = { _missing: true, userId: idStr };
                }
                return this._remoteUsers[idStr];
            })
            .catch(() => null)
            .finally(() => this._inFlight.delete(idStr));

        this._inFlight.set(idStr, req);
        return req;
    },
    async hydrateAuthors(uids) {
        const unique = [...new Set((uids || []).map(String))].filter(id => id && id !== 'me' && !id.startsWith('mehmon_') && !this._remoteUsers[id]);
        if (!unique.length) return;
        await Promise.allSettled(unique.map(id => this.fetchUser(id)));
        if (PostStore._isLoaded) patchFeed();
        if (detailOverlay?.classList.contains('show') && detailPost) refreshAll();
    }
};


/* ================= SESSION ================= */
let currentUser = null;

(function initSession() {
    let users = DB._getUsers();
    const isLocalVerified = localStorage.getItem(VERIFIED_KEY) === '1';

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const tU = tg.initDataUnsafe.user;
        const realId = String(tU.id);
        users = users.filter(u => !String(u.userId).startsWith('mehmon_') && String(u.userId) !== 'me');
        const existing = users.find(u => String(u.userId) === realId);
        if (existing) {
            if (existing.isEdited) {
                currentUser = {
                    ...existing, userId: realId,
                    firstName: existing.firstName || tU.first_name || '',
                    lastName: existing.lastName !== undefined ? existing.lastName : (tU.last_name || ''),
                    username: existing.username || tU.username || '',
                    photo_url: existing.photo_url || tU.photo_url || null,
                    verified: isLocalVerified || !!existing.verified,
                    isVerified: isLocalVerified || !!existing.isVerified
                };
            } else {
                currentUser = {
                    ...existing, userId: realId,
                    firstName: tU.first_name || '', lastName: tU.last_name || '',
                    username: tU.username || '',
                    photo_url: tU.photo_url || existing.photo_url || null,
                    isEdited: false,
                    verified: isLocalVerified || !!existing.verified,
                    isVerified: isLocalVerified || !!existing.isVerified
                };
            }
        } else {
            currentUser = {
                userId: realId, firstName: tU.first_name || '', lastName: tU.last_name || '',
                username: tU.username || '', photo_url: tU.photo_url || null,
                isEdited: false, verified: isLocalVerified, isVerified: isLocalVerified
            };
        }
        users = users.filter(u => String(u.userId) !== realId);
        users.push(currentUser);
        DB._saveUsers(users);
        localStorage.setItem(DB._S, realId);
    } else {
        currentUser = DB.getCurrentUser();
        if (!currentUser && users.length > 0) {
            currentUser = users.find(u => !String(u.userId).startsWith('mehmon_')) || users[0];
            localStorage.setItem(DB._S, String(currentUser.userId));
        }
        if (!currentUser) {
            const guestId = 'mehmon_' + Math.random().toString(36).slice(2, 7);
            currentUser = {
                userId: guestId, firstName: 'Mehmon', lastName: '', username: 'mehmon',
                photo_url: null, isEdited: false, verified: false, isVerified: false
            };
            users.push(currentUser);
            DB._saveUsers(users);
            localStorage.setItem(DB._S, guestId);
        }
    }
})();

function syncMyUserDoc(){
    if (isGuestUser()) return Promise.resolve();
    return withTimeout(setDoc(doc(db, USERS_COLLECTION, String(currentUser.userId)), {
        userId: String(currentUser.userId),
        firstName: currentUser.firstName || '',
        lastName: currentUser.lastName || '',
        username: currentUser.username || '',
        photo_url: currentUser.photo_url || null,
        bio: currentUser.bio || ''
    }, { merge: true }), 8000).catch(e => console.warn(e));
}

/* ================= PROFIL MA'LUMOTLARI ================= */
function resolveAuthorInfo(uid, fallbackName, fallbackAvatar) {
    const idStr = String(uid || '');
    const effectiveId = (idStr === 'me') ? String(currentUser.userId) : idStr;
    const userObj = (effectiveId === String(currentUser.userId)) ? currentUser : DB.getUserById(effectiveId);
    if (userObj && !userObj._missing) {
        const fullName = [userObj.firstName, userObj.lastName].filter(Boolean).join(' ').trim();
        return { userId: String(userObj.userId), name: fullName || fallbackName || 'Foydalanuvchi', avatar: userObj.photo_url || fallbackAvatar || null };
    }
    return { userId: effectiveId, name: fallbackName || 'Foydalanuvchi', avatar: fallbackAvatar || null };
}
function isOwner(uid) {
    if (!uid || !currentUser || isGuestUser()) return false;
    return String(resolveAuthorInfo(uid).userId) === String(currentUser.userId);
}
function isUserVerified(uid, postObj = null) {
    const resolved = resolveAuthorInfo(uid);
    const remote = DB._remoteUsers[String(resolved.userId)];
    if (remote && !remote._missing) return Boolean(remote.verified || remote.isVerified);
    const u = DB.getUserById(resolved.userId);
    if (u && !u._missing) return Boolean(u.verified || u.isVerified);
    return Boolean(postObj && postObj.verified);
}
function getInlineVerifiedBadge(uid, postObj = null) {
    return isUserVerified(uid, postObj) ? VERIFIED_BADGE_SM_SVG : '';
}

/* ================= HELPERS ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';
    const diffSec = Math.floor((new Date() - d) / 1000);
    if (diffSec < 5) return 'hozir'; if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
}
function goToProfile(uid){
    if (!uid) return;
    const resolvedId = resolveAuthorInfo(uid).userId;
    if (String(resolvedId) === String(currentUser?.userId)) window.location.href = 'profil.html';
    else window.location.href = `profil.html?id=${encodeURIComponent(resolvedId)}`;
}
let toastTimer;
function showToast(msg){
    const t = document.getElementById('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function compressImage(file, maxW = 800, quality = 0.72){
    return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url); let { width, height } = img;
            if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
        }; img.onerror = reject; img.src = url;
    });
}

setInterval(() => {
    document.querySelectorAll('[data-ts]').forEach(el => {
        const n = el.firstChild, ts = el.dataset.ts;
        if (ts && n && n.nodeType === 3) n.nodeValue = formatExactTime(ts);
    });
}, 30000);

/* ================= LAYK ================= */
function isLiked(o){
    if (!o || isGuestUser()) return false;
    if (Array.isArray(o.likedBy)) return o.likedBy.includes(String(currentUser.userId));
    return false;
}
function toggleLikeObj(o){
    const uid = String(currentUser.userId);
    if (!Array.isArray(o.likedBy)) o.likedBy = [];
    const i = o.likedBy.indexOf(uid);
    if (i >= 0) o.likedBy.splice(i, 1); else o.likedBy.push(uid);
    o.likes = o.likedBy.length;
    return o.likedBy.includes(uid);
}


/* ================= 10-BAND: FEED STATUS & POST STORE ================= */
const FeedState = {
    status: 'loading', // 'loading' | 'success' | 'empty' | 'error' | 'retrying'
    errorMessage: ''
};

const PostStore = {
    _cache: [],
    _extraPosts: new Map(), // 9-band: URL orqali ochilgan eski postlar keshda saqlanadi
    _isLoaded: false,
    _unsubscribe: null,
    _limit: FEED_BATCH_SIZE,
    _hasMore: true,
    _loadingMore: false,
    _pendingNewPosts: [],

    initRealtime(isRetry = false) {
        if (this._unsubscribe) { this._unsubscribe(); this._unsubscribe = null; }
        FeedState.status = isRetry ? 'retrying' : (this._cache.length ? 'success' : 'loading');
        if (!this._cache.length) renderFeedStateUI();

        const q = query(collection(db, POSTS_COLLECTION), orderBy("createdAt", "desc"), limit(this._limit));
        this._unsubscribe = onSnapshot(q, (snapshot) => {
            const posts = [];
            snapshot.forEach(d => posts.push({ id: d.id, ...d.data() }));

            const prevIds = new Set(this._cache.map(p => String(p.id)));
            const incomingNew = this._isLoaded ? posts.filter(p => !prevIds.has(String(p.id))) : [];

            this._cache = posts;
            this._isLoaded = true;
            this._hasMore = snapshot.size >= this._limit;
            const wasLoadingMore = this._loadingMore;
            this._loadingMore = false;
            FeedState.status = posts.length > 0 ? 'success' : 'empty';

            // Faqat lentadagi mualliflarni yuklash (4.2-band)
            DB.hydrateAuthors(posts.map(p => p.userId));

            // 6.5-band: Agar foydalanuvchi tepada bo'lmasa va yangi postlar kelsa tugma ko'rsatish
            if (incomingNew.length > 0 && window.scrollY > 140 && !wasLoadingMore) {
                this._pendingNewPosts = incomingNew;
                showNewPostsPill(incomingNew.length);
                patchFeed(true); // Mavjud postlarni saqlab turish
            } else {
                hideNewPostsPill();
                patchFeed(false);
            }

            if (wasLoadingMore) {
                if (renderedPostCount < allFeedPosts.length) appendNextFeedBatch();
                initInfiniteScrollObserver();
            }

            if (detailOverlay?.classList.contains('show') && detailPost) {
                const upd = this.get(detailPost.id);
                if (upd) {
                    const changed = detailSig(upd) !== detailSig(detailPost);
                    detailPost = upd;
                    if (changed) patchDetailPostUI(upd);
                }
            }
            checkUrlParamsOnce();
        }, (error) => {
            console.error("Firestore xatosi:", error);
            this._loadingMore = false;
            FeedState.status = 'error';
            FeedState.errorMessage = "Ma'lumotlarni yuklashda xatolik. Qayta urinib ko'ring";
            if (!this._cache.length) renderFeedStateUI();
            else showToast("Server bilan aloqa uzildi");
            checkUrlParamsOnce();
        });
    },
    loadMore() {
        if (!this._hasMore || this._loadingMore) return;
        this._loadingMore = true;
        this._limit += FEED_BATCH_SIZE;
        this.initRealtime();
    },
    all() { return this._cache.slice(); },
    get(id) {
        const idStr = String(id);
        return this._cache.find(p => String(p.id) === idStr) || this._extraPosts.get(idStr) || null;
    },
    registerExtra(post) {
        if (!post || !post.id) return;
        const idStr = String(post.id);
        if (!this._cache.some(p => String(p.id) === idStr)) {
            this._extraPosts.set(idStr, post);
        }
    },
    _patchLocal(id, patch) {
        const idStr = String(id);
        const i = this._cache.findIndex(p => String(p.id) === idStr);
        if (i >= 0) this._cache[i] = { ...this._cache[i], ...patch };
        if (this._extraPosts.has(idStr)) {
            this._extraPosts.set(idStr, { ...this._extraPosts.get(idStr), ...patch });
        }
    },
    async add(post) {
        try {
            await withTimeout(setDoc(doc(db, POSTS_COLLECTION, String(post.id)), post), 8000);
            return post;
        } catch (err) {
            console.error("Post saqlashda xatolik:", err);
            showToast("Postni saqlab bo'lmadi: internetni tekshiring");
            return null;
        }
    },
    async update(id, patch) {
        const prev = this.get(id);
        this._patchLocal(id, patch);
        try {
            await withTimeout(updateDoc(doc(db, POSTS_COLLECTION, String(id)), patch), 8000);
            return this.get(id);
        } catch (err) {
            console.error("Yangilashda xatolik:", err);
            if (prev) this._patchLocal(id, prev);
            showToast("Saqlanmadi: internetni tekshiring");
            patchFeed();
            return null;
        }
    },
    /* 9.4-band: Post lentada bo'lmasa ham post ID orqali to'g'ridan-to'g'ri serverga yuboriladi */
    async likePost(id, uid, like) {
        const idStr = String(id);
        const prev = this.get(idStr);
        if (prev) {
            const arr = (prev.likedBy || []).filter(x => x !== uid);
            if (like) arr.push(uid);
            this._patchLocal(idStr, { likedBy: arr, likes: arr.length });
        }
        try {
            await withTimeout(updateDoc(doc(db, POSTS_COLLECTION, idStr), {
                likedBy: like ? arrayUnion(uid) : arrayRemove(uid),
                likes: increment(like ? 1 : -1)
            }), 8000);
            return true;
        } catch (err) {
            if (prev) this._patchLocal(idStr, { likedBy: prev.likedBy || [], likes: prev.likes || 0 });
            return false;
        }
    },
    async remove(id) {
        const idStr = String(id);
        const prev = this.get(idStr);
        this._cache = this._cache.filter(p => String(p.id) !== idStr);
        this._extraPosts.delete(idStr);
        try {
            await withTimeout(deleteDoc(doc(db, POSTS_COLLECTION, idStr)), 8000);
            return true;
        } catch (err) {
            if (prev) this._cache.push(prev);
            showToast("O'chirishda xatolik yuz berdi");
            return false;
        }
    }
};

/* ================= 5-BAND: ALOHIDA IZOHLAR VA JAVOBLAR STORE ================= */
const CommentStore = {
    _byPost: new Map(),      // postId -> Map(commentId -> commentObj)
    _unsubs: new Map(),      // postId -> unsubscribe fn
    _loadedPosts: new Set(),

    subscribe(postId, onUpdate) {
        const pid = String(postId);
        if (this._unsubs.has(pid)) return;
        const q = query(collection(db, POSTS_COLLECTION, pid, 'comments'), orderBy('createdAt', 'asc'));
        const unsub = onSnapshot(q, (snap) => {
            const map = this._byPost.get(pid) || new Map();
            snap.forEach(d => {
                map.set(d.id, { id: d.id, ...d.data() });
            });
            snap.docChanges().forEach(ch => {
                if (ch.type === 'removed') map.delete(ch.doc.id);
            });
            this._byPost.set(pid, map);
            this._loadedPosts.add(pid);

            const authorIds = [...map.values()].map(c => c.userId);
            DB.hydrateAuthors(authorIds);
            if (onUpdate) onUpdate();
        }, (err) => {
            console.warn('Izohlar listener xatosi:', err);
        });
        this._unsubs.set(pid, unsub);
    },

    unsubscribe(postId) {
        const pid = String(postId);
        const unsub = this._unsubs.get(pid);
        if (unsub) { unsub(); this._unsubs.delete(pid); }
    },

    /* Eski post.comments massivi bilan yangi subcollection ma'lumotlarini xavfsiz birlashtiradi */
    getTree(post) {
        if (!post) return [];
        const pid = String(post.id);
        const merged = new Map();

        
        // 1. Eski massivdagi izohlarni tekislab olish (migratsiya mosligi)
        const flattenLegacy = (arr, parentId = null) => {
            (arr || []).forEach(c => {
                if (!c || !c.id) return;
                const cid = String(c.id);
                merged.set(cid, {
                    ...c,
                    id: cid,
                    parentId: c.parentId || parentId || null,
                    replies: [],
                    _legacy: true
                });
                if (Array.isArray(c.replies) && c.replies.length) {
                    flattenLegacy(c.replies, cid);
                }
            });
        };
        flattenLegacy(post.comments || []);

        // 2. Yangi subcollection hujjatlarini ustun qo'yish
        const subMap = this._byPost.get(pid);
        if (subMap) {
            subMap.forEach((docData, cid) => {
                merged.set(cid, { ...docData, id: cid, replies: [], _legacy: false });
            });
        }

        // 3. Daraxt (tree) tuzilmasini yig'ish
        const roots = [];
        merged.forEach(node => {
            if (node.parentId && merged.has(String(node.parentId))) {
                merged.get(String(node.parentId)).replies.push(node);
            } else {
                roots.push(node);
            }
        });

        const sortByDate = (list) => {
            list.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
            list.forEach(item => { if (item.replies.length) sortByDate(item.replies); });
        };
        sortByDate(roots);
        return roots;
    },

    async add(postId, newComment, replyToId) {
        const pid = String(postId);
        const cid = String(newComment.id);
        const payload = {
            ...newComment,
            id: cid,
            postId: pid,
            parentId: replyToId ? String(replyToId) : null
        };
        try {
            const batch = writeBatch(db);
            batch.set(doc(db, POSTS_COLLECTION, pid, 'comments', cid), payload);
            batch.update(doc(db, POSTS_COLLECTION, pid), { commentsCount: increment(1) });
            await withTimeout(batch.commit(), 8000);
            return payload;
        } catch (e) {
            console.error('Izoh saqlanmadi:', e);
            showToast("Saqlanmadi: internetni tekshiring");
            return null;
        }
    },

    async edit(postId, commentObj, newText) {
        const pid = String(postId);
        const cid = String(commentObj.id);
        const ref = doc(db, POSTS_COLLECTION, pid, 'comments', cid);
        try {
            if (commentObj._legacy) {
                // Eski massivdan yangi subcollection'ga migratsiya
                const { replies, _legacy, ...clean } = commentObj;
                await withTimeout(setDoc(ref, { ...clean, postId: pid, text: newText, editedAt: new Date().toISOString() }), 8000);
            } else {
                await withTimeout(updateDoc(ref, { text: newText, editedAt: new Date().toISOString() }), 8000);
            }
            return true;
        } catch (e) {
            console.error(e);
            showToast("Saqlanmadi: internetni tekshiring");
            return false;
        }
    },

    async remove(postId, commentId) {
        const pid = String(postId);
        const cid = String(commentId);
        const post = PostStore.get(pid);
        try {
            await withTimeout(deleteDoc(doc(db, POSTS_COLLECTION, pid, 'comments', cid)), 8000);
            await updateDoc(doc(db, POSTS_COLLECTION, pid), { commentsCount: increment(-1) }).catch(() => {});
            // Agar eski massivda ham bo'lsa, undan ham olib tashlash
            if (post && Array.isArray(post.comments) && findComment(post.comments, cid)) {
                const copy = JSON.parse(JSON.stringify(post.comments));
                removeCommentRecursive(copy, cid);
                await updateDoc(doc(db, POSTS_COLLECTION, pid), { comments: copy }).catch(() => {});
                PostStore._patchLocal(pid, { comments: copy });
            }
            return true;
        } catch (e) {
            console.error(e);
            showToast("O'chirishda xatolik yuz berdi");
            return false;
        }
    },

    async toggleLike(postId, commentObj, uid, nowLiked) {
        const pid = String(postId);
        const cid = String(commentObj.id);
        const ref = doc(db, POSTS_COLLECTION, pid, 'comments', cid);
        try {
            if (commentObj._legacy) {
                const { replies, _legacy, ...clean } = commentObj;
                const arr = (clean.likedBy || []).filter(x => x !== uid);
                if (nowLiked) arr.push(uid);
                await withTimeout(setDoc(ref, { ...clean, postId: pid, likedBy: arr, likes: arr.length }), 8000);
            } else {
                await withTimeout(updateDoc(ref, {
                    likedBy: nowLiked ? arrayUnion(uid) : arrayRemove(uid),
                    likes: increment(nowLiked ? 1 : -1)
                }), 8000);
            }
            return true;
        } catch (e) {
            console.error(e);
            return false;
        }
    }
};

/* ================= KO'RISHLAR ================= */
const VIEW_LOG_KEY = 'luz_view_log_v1';
const COMMENT_VIEW_LOG_KEY = 'luz_comment_view_log_v1';

function makeTracker(storageKey){
    return {
        _cache: null,
        _load(){
            if (this._cache !== null) return this._cache;
            try { const raw = localStorage.getItem(storageKey); this._cache = raw ? JSON.parse(raw) : {}; if (!this._cache || typeof this._cache !== 'object') this._cache = {}; } catch { this._cache = {}; }
            return this._cache;
        },
        _key(uid, id){ return String(uid) + '::' + String(id); },
        hasViewed(uid, id){ if (!uid || !id) return false; return this._load()[this._key(uid, id)] === true; },
        record(uid, id){
            if (!uid || !id) return false; const log = this._load(); const k = this._key(uid, id);
            if (log[k] === true) return false; log[k] = true; this._cache = log;
            try { localStorage.setItem(storageKey, JSON.stringify(log)); } catch {} return true;
        }
    };
}
const ViewTracker = makeTracker(VIEW_LOG_KEY);
const CommentViewTracker = makeTracker(COMMENT_VIEW_LOG_KEY);

async function registerPostView(pid, uid){
    if (isGuestUser()) return;
    const vRef = doc(db, POSTS_COLLECTION, String(pid), 'views', String(uid));
    const pRef = doc(db, POSTS_COLLECTION, String(pid));
    try {
        await withTimeout(runTransaction(db, async tx => {
            if ((await tx.get(vRef)).exists()) return;
            tx.set(vRef, { at: Date.now() });
            tx.update(pRef, { views: increment(1) });
        }), 8000);
    } catch {}
}
async function registerCommentView(pid, cid, uid){
    if (isGuestUser()) return;
    const vRef = doc(db, POSTS_COLLECTION, String(pid), 'comments', String(cid), 'views', String(uid));
    const cRef = doc(db, POSTS_COLLECTION, String(pid), 'comments', String(cid));
    try {
        await withTimeout(runTransaction(db, async tx => {
            if ((await tx.get(vRef)).exists()) return;
            const cSnap = await tx.get(cRef);
            if (!cSnap.exists()) return;
            tx.set(vRef, { at: Date.now() });
            tx.update(cRef, { views: increment(1) });
        }), 8000);
    } catch {}
}

const viewIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target; viewIO.unobserve(el);
        const pid = el.dataset.id, uid = currentUser?.userId;
        if (!pid || !uid || isGuestUser() || ViewTracker.hasViewed(uid, pid)) return;
        if (ViewTracker.record(uid, pid)) {
            registerPostView(pid, uid);
            const cnt = el.querySelectorAll('.act-btn')[2]?.querySelector('.act-count');
            if (cnt) cnt.textContent = (parseInt(cnt.textContent) || 0) + 1;
        }
    });
}, { threshold: 0.5 });

const commentViewIO = new IntersectionObserver(entries => {
    entries.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target; commentViewIO.unobserve(el);
        const cid = el.dataset.cid, pid = el.dataset.pid, uid = currentUser?.userId;
        if (!cid || !pid || !uid || isGuestUser() || CommentViewTracker.hasViewed(uid, cid)) return;
        if (!CommentViewTracker.record(uid, cid)) return;
        const cnt = el.querySelector('.comment-view-count');
        if (cnt) cnt.textContent = (parseInt(cnt.textContent) || 0) + 1;
        registerCommentView(pid, cid, uid);
    });
}, { threshold: 0.5 });

            if (detailPost && String(detailPost.id) === String(ctx.postId)) { closeCommentDetail(); closePostDetail(); }
            patchFeed();
            showToast("Post o'chirildi");
        }
    } else if (ctx.kind === 'comment') {
        const deleted = await CommentStore.remove(ctx.postId, ctx.commentId);
        if (deleted) {
            removeMyReplyById(ctx.commentId);
            if (activeCommentId && String(activeCommentId) === String(ctx.commentId)) closeCommentDetail();
            else if (detailPost && String(detailPost.id) === String(ctx.postId)) renderDetailCommentsIncremental();
            patchFeed();
            showToast("Izoh o'chirildi");
        }
    }
});

async function prepareMedia(m){
    if (!m) return { image: null, type: 'text' };
    if (!String(m.data).startsWith('data:')) return { image: m.data, type: m.type };
    try {
        const blob = await (await fetch(m.data)).blob();
        const ext = (blob.type.split('/')[1] || 'bin').split(';')[0];
        const r = sRef(storage, `luz_media/${currentUser.userId}/${Date.now()}_${Math.random().toString(36).slice(2,6)}.${ext}`);
        await withTimeout(uploadBytes(r, blob, { contentType: blob.type }), 60000);
        return { image: await getDownloadURL(r), type: m.type };
    } catch (e) { console.error(e); showToast("Faylni yuklab bo'lmadi"); return null; }
}

compSubmit.addEventListener('click', async () => {
    if (isSubmittingPost || !requireAuthenticatedAction()) return;
    const text = compInput.value.trim();

    if (editTarget) {
        if (editTarget.kind === 'post') {
            if (!text && !currentMedia) return;
            isSubmittingPost = true; compSubmit.disabled = true; compSubmit.textContent = 'Saqlanmoqda...';
            const media = await prepareMedia(currentMedia);
            if (!media) { isSubmittingPost = false; compSubmit.disabled = false; compSubmit.textContent = 'Saqlash'; return; }
            const patch = { text, image: media.image, type: media.type, editedAt: new Date().toISOString() };
            const updated = await PostStore.update(editTarget.postId, patch);
            isSubmittingPost = false; compSubmit.textContent = 'Saqlash';
            if (!updated) { compSubmit.disabled = false; return; }
            closeComposer();
            patchFeed();
            if (detailOverlay.classList.contains('show') && detailPost && String(detailPost.id) === String(updated.id)) {
                detailPost = updated; patchDetailPostUI(updated);
            }
            showToast('Post tahrirlandi');
            return;
        }
        if (editTarget.kind === 'comment') {
            if (!text) return;
            isSubmittingPost = true; compSubmit.disabled = true; compSubmit.textContent = 'Saqlanmoqda...';
            const ok = await CommentStore.edit(editTarget.postId, editTarget.commentObj, text);
            isSubmittingPost = false; compSubmit.textContent = 'Saqlash';
            if (!ok) { compSubmit.disabled = false; return; }
            updateMyReplyText(editTarget.commentObj.id, text);
            const targetPid = editTarget.postId;
            closeComposer();
            if (detailPost && String(detailPost.id) === String(targetPid)) refreshAll();
            showToast('Izoh tahrirlandi');
            return;
        }
    }

    if (!text && !currentMedia) return;
    isSubmittingPost = true; compSubmit.disabled = true; compSubmit.textContent = 'Yuklanmoqda...';

    const media = await prepareMedia(currentMedia);
    if (!media) { isSubmittingPost = false; compSubmit.disabled = false; compSubmit.textContent = 'Yuborish'; return; }

    const newPost = {
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        userId: String(currentUser.userId),
        user: getCurrentUserName(),
        avatar: currentUser?.photo_url || null,
        verified: isUserVerified(currentUser.userId),
        createdAt: new Date().toISOString(),
        text,
        image: media.image,
        type: media.type,
        likes: 0, likedBy: [], views: 0, commentsCount: 0, comments: []
    };
    const added = await PostStore.add(newPost);
    isSubmittingPost = false; compSubmit.textContent = 'Yuborish';
    if (!added) { compSubmit.disabled = false; return; }
    resetComposerFields(); closeComposer();
    hideNewPostsPill();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    showToast('Post joylandi');
});

function saveCurrentPostDraft(){

        postDrafts.set(String(detailPost.id), { text: val, replyTargetId });

function restorePostDraft(postId){
    const draft = postDrafts.get(String(postId));
    detailInput.value = draft ? draft.text : '';

function buildCommentRow(c, mode){

    const actions = document.createElement('div'); actions.className = 'comment-actions';

    const likeBtn = document.createElement('button');

    likeBtn.innerHTML = `${ICONS.like}<span class="comment-act-count">${likeCount(c)}</span>`;
    likeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!requireAuthenticatedAction()) return;
        const uid = String(currentUser.userId), pid = detailPost.id;
        const nowLiked = toggleLikeObj(c);
        const cnt = likeBtn.querySelector('.comment-act-count');

    const commBtn = document.createElement('button');

        e.stopPropagation();

        else { cdReplyTargetId = (String(c.id) === String(activeCommentId)) ? null : c.id; commentDetailInput.focus(); updateCdReplyModeUI(); }
    });

    const viewBtn = document.createElement('button');
    viewBtn.className = 'comment-act';
    viewBtn.innerHTML = `${ICONS.view}<span class="comment-act-count comment-view-count">${c.views || 0}</span>`;
    viewBtn.style.cursor = 'default';
    viewBtn.addEventListener('click', (e) => e.stopPropagation());

    const saveBtn = document.createElement('button');
    saveBtn.className = 'comment-act' + (savedComments.has(String(c.id)) ? ' saved' : '');
    saveBtn.innerHTML = `${ICONS.bookmark}`;
    saveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = String(c.id);
        if (savedComments.has(key)) { savedComments.delete(key); saveBtn.classList.remove('saved'); showToast('Olib tashlandi'); }
        else { savedComments.add(key); saveBtn.classList.add('saved'); showToast('Saqlandi'); }
        persistSavedComments();
    });

    const shareBtn = document.createElement('button');
    shareBtn.className = 'comment-act';
    shareBtn.innerHTML = `${ICONS.share}`;
    shareBtn.addEventListener('click', (e) => { e.stopPropagation(); handleShare(c, detailPost.id, c.id); });

function commentSig(c){
    const a = resolveAuthorInfo(c.userId, c.user, c.avatar);
    return JSON.stringify([a.name, a.avatar, isUserVerified(a.userId, c), c.text, c.editedAt, c.likedBy, c.views, (c.replies||[]).map(commentSig)]);
}

function buildDetailComment(c, depth = 0){
    const thread = document.createElement('div');
    thread.className = 'comment-thread' + (depth > 0 ? ' thread-nested' : '');
    thread.dataset.cid = c.id;
    thread.dataset.csig = commentSig(c);
    thread.appendChild(buildCommentRow(c, 'thread'));
    if (c.replies && c.replies.length > 0) {
        const repBox = document.createElement('div'); repBox.className = 'comment-replies';
        c.replies.forEach(r => repBox.appendChild(buildDetailComment(r, depth + 1)));
        thread.appendChild(repBox);
    }
    return thread;
}

function patchDetailPostUI(p){

    const card = box.querySelector('.detail-post');

    const actionsBar = card.querySelector('#detailActionsBar');

        actionsBar.innerHTML = '';

    }

function renderDetailCommentsIncremental(){
    if (!detailPost) return;
    const fresh = PostStore.get(detailPost.id);
    if (fresh) detailPost = fresh;

    const tree = CommentStore.getTree(detailPost);
    const total = countTreeNodes(tree);
    document.getElementById('detailCommTitle').textContent = total ? `Izohlar (${total})` : 'Izohlar';

    const clist = document.getElementById('detailCommentsList');
    const existingThreads = new Map();
    clist.querySelectorAll(':scope > .comment-thread').forEach(el => {
        existingThreads.set(String(el.dataset.cid), el);
    });

    const targetIds = new Set(tree.map(c => String(c.id)));
    existingThreads.forEach((el, id) => {
        if (!targetIds.has(id)) {
            el.remove();
            existingThreads.delete(id);
        }
    });

    let cursor = clist.firstElementChild;
    tree.forEach(c => {
        const cid = String(c.id);
        const sig = commentSig(c);
        let el = existingThreads.get(cid);
        if (el) {
            if (el.dataset.csig !== sig) {
                const rep = buildDetailComment(c, 0);
                el.replaceWith(rep);
                el = rep;
            }
        } else {
            el = buildDetailComment(c, 0);
        }
        if (el !== cursor) clist.insertBefore(el, cursor || null);
        else cursor = cursor.nextElementSibling;
    });
}

detailSend.addEventListener('click', async () => {
    if (isSendingDetailComment || !requireAuthenticatedAction()) return;
    const cleanText = detailInput.value.trim();
    if (!cleanText || !detailPost) return;

    // 8.4-band: Yuborish vaqtida post ID va comment ID ni qayd etish
    const targetPostId = String(detailPost.id);
    const targetReplyId = replyTargetId ? String(replyTargetId) : null;

    isSendingDetailComment = true;
    detailSend.disabled = true;

    const newC = makeCommentObj(cleanText, targetReplyId);
    const saved = await CommentStore.add(targetPostId, newC, targetReplyId);
    isSendingDetailComment = false;

    if (saved && detailPost && String(detailPost.id) === targetPostId) {
        pushMyReply({ id: newC.id, postId: targetPostId, userId: newC.userId, user: newC.user, avatar: newC.avatar, text: newC.text, createdAt: newC.createdAt, postText: detailPost.text });
        const tree = CommentStore.getTree(detailPost);
        if (targetReplyId) {
            const parentFound = findComment(tree, targetReplyId);
            if (parentFound && parentFound.comment) sendNotification('reply', parentFound.comment.userId, targetPostId, newC.id);
        } else {
            sendNotification('comment', detailPost.userId, targetPostId, newC.id);
        }
        replyTargetId = null;
        detailInput.value = '';
        detailInput.style.height = 'auto';
        postDrafts.delete(targetPostId);
        renderDetailCommentsIncremental();
        updateDetailReplyModeUI();
        patchFeed();
    } else {
        detailSend.disabled = detailInput.value.trim().length === 0;
    }
});


/* ================= COMMENT DETAIL ================= */
function renderCommentDetail(){
    if (!detailPost || !activeCommentId) return;
    const sc = document.getElementById('commentDetailScroll'), y = sc.scrollTop;
    const fresh = PostStore.get(detailPost.id); if (fresh) detailPost = fresh;
    const tree = CommentStore.getTree(detailPost);
    const found = findComment(tree, activeCommentId);
    if (!found) { closeCommentDetail(); return; }
    const main = document.getElementById('commentDetailMain');
    main.innerHTML = '';
    main.appendChild(buildCommentRow(found.comment, 'cd-main'));
    const reps = document.getElementById('commentDetailReplies'); reps.innerHTML = '';
    (found.comment.replies || []).forEach(r => reps.appendChild(buildCommentRow(r, 'cd-reply')));
    sc.scrollTop = y;
}
function openCommentDetail(cid){
    if (!detailPost) return;
    const fresh = PostStore.get(detailPost.id); if (fresh) detailPost = fresh;
    const tree = CommentStore.getTree(detailPost);
    const found = findComment(tree, cid); if (!found) return;
    activeCommentId = cid; cdReplyTargetId = null;
    commentDetailInput.value = '';
    commentDetailInput.style.height = 'auto';
    commentDetailSend.disabled = true;
    renderCommentDetail();
    commentDetailOverlay.classList.add('show');
    document.getElementById('commentDetailScroll').scrollTop = 0;
    updateCdReplyModeUI();
    updateBackButton();
}
function closeCommentDetail(){
    commentDetailOverlay.classList.remove('show');
    activeCommentId = null;
    cdReplyTargetId = null;
    commentDetailInput.value = '';
    commentDetailInput.style.height = 'auto';
    commentDetailSend.disabled = true;
    if (detailPost) renderDetailCommentsIncremental();
    updateBackButton();
}

const cdReplyModeCancel = document.getElementById('cdReplyModeCancel'), commentDetailInput = document.getElementById('commentDetailInput'), commentDetailSend = document.getElementById('commentDetailSend');
function updateCdReplyModeUI(){
    if (!detailPost) { document.getElementById('cdReplyModeBar').style.display = 'none'; document.getElementById('commentDetailIsland').classList.remove('reply-mode'); return; }
    const targetId = cdReplyTargetId || activeCommentId;
    const tree = CommentStore.getTree(detailPost);
    const found = targetId ? findComment(tree, targetId) : null;
    if (found) {
        const author = resolveAuthorInfo(found.comment.userId, found.comment.user, found.comment.avatar);
        document.getElementById('cdReplyModeText').textContent = `↩ ${author.name} ga javob`;
        document.getElementById('cdReplyModeBar').style.display = 'flex';
        document.getElementById('commentDetailIsland').classList.add('reply-mode');
    } else {
        document.getElementById('cdReplyModeBar').style.display = 'none';
        document.getElementById('commentDetailIsland').classList.remove('reply-mode');
    }
}
cdReplyModeCancel.addEventListener('click', () => {
    if (cdReplyTargetId) { cdReplyTargetId = null; updateCdReplyModeUI(); }
    else closeCommentDetail();
});
commentDetailInput.addEventListener('input', () => {
    commentDetailInput.style.height = 'auto'; commentDetailInput.style.height = Math.min(commentDetailInput.scrollHeight, 90) + 'px';
    commentDetailSend.disabled = commentDetailInput.value.trim().length === 0;
});

commentDetailSend.addEventListener('click', async () => {
    if (isSendingCdReply || !requireAuthenticatedAction()) return;
    const txt = commentDetailInput.value.trim();
    if (!txt || !detailPost || !activeCommentId) return;

    const targetPostId = String(detailPost.id);
    const targetId = String(cdReplyTargetId || activeCommentId);

    isSendingCdReply = true;
    commentDetailSend.disabled = true;

    const newReply = makeCommentObj(txt, targetId);
    const saved = await CommentStore.add(targetPostId, newReply, targetId);
    isSendingCdReply = false;

    if (saved && detailPost && String(detailPost.id) === targetPostId) {
        pushMyReply({ id: newReply.id, postId: targetPostId, userId: newReply.userId, user: newReply.user, avatar: newReply.avatar, text: newReply.text, createdAt: newReply.createdAt, postText: detailPost.text });
        const tree = CommentStore.getTree(detailPost);
        const parentFound = findComment(tree, targetId);
        if (parentFound && parentFound.comment) sendNotification('reply', parentFound.comment.userId, targetPostId, newReply.id);
        commentDetailInput.value = ''; commentDetailInput.style.height = 'auto';
        cdReplyTargetId = null;
        renderCommentDetail();
        renderDetailCommentsIncremental();
        updateCdReplyModeUI();
        patchFeed();
        showToast('Javob qo\'shildi');
    } else {
        commentDetailSend.disabled = commentDetailInput.value.trim().length === 0;
    }
});

/* ================= 9 & 11-BAND: HAVOLA ORQALI POST OCHISH ================= */
let urlChecked = false;
async function checkUrlParamsOnce() {
    if (urlChecked) return;
    urlChecked = true;
    const params = new URLSearchParams(window.location.search);
    const pid = params.get('post'), cid = params.get('comment');
    if (!pid) return;

    let post = PostStore.get(pid);
    if (!post) {
        try {
            const s = await withTimeout(getDoc(doc(db, POSTS_COLLECTION, pid)), 8000);
            if (s.exists()) {
                post = { id: s.id, ...s.data() };
                PostStore.registerExtra(post);
            }
        } catch (e) {
            showToast("Postni yuklashda xatolik yuz berdi");
            return;
        }
    }

    if (!post) {
        showToast("Ushbu post o'chirilgan yoki mavjud emas");
        return;
    }

    openPostDetail(post);
    if (cid) {
        const tree = CommentStore.getTree(post);
        if (findComment(tree, cid)) openCommentDetail(cid);
    }
}

/* Sahifadan chiqishda listenerlarni tozalash (4.8-band) */
window.addEventListener('pagehide', () => {
    if (PostStore._unsubscribe) PostStore._unsubscribe();
    if (notifUnsubscribe) notifUnsubscribe();
    CommentStore._unsubs.forEach(unsub => unsub());
    CommentStore._unsubs.clear();
});

/* ================= INIT (3-BAND: NON-BLOCKING STARTUP) ================= */
loadMyReplies();
renderFeedStateUI();
updateBackButton();

// Interfeys va ma'lumotlar autentifikatsiyani kutmasdan darhol ishga tushadi
PostStore.initRealtime();
initNotificationBadge();

ensureAuth().then(() => {
    syncMyUserDoc();
});

window.history.pushState({ page: 'uy' }, 'Uy', '');
window.addEventListener('popstate', () => {
    if (handleBack()) window.history.pushState({ page: 'uy' }, 'Uy', '');
    else window.history.back();
});
</script>
