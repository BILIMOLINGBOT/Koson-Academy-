<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yashil 3D Kubiklar Seti</title>
  <style>
    body {
      background-color: #08090B; /* To'q fon, kubiklarni yorqin ko'rsatish uchun */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 2x2 Grid (To'r) tizimi */
    .cube-grid {
      display: grid;
      grid-template-columns: repeat(2, 140px); /* Ikkita ustun */
      gap: 10px 20px; /* Qatorlar va ustunlar orasidagi masofa */
    }

    .cube-item {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Asosiy 3D rasmni o'zgartirmasdan rang berish */
    .cube-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      /* Oq rangli kubikni yashil (mint/green) rangga o'zgartirish */
      filter: sepia(100%) hue-rotate(100deg) saturate(280%) brightness(0.95);
    }

    /* Kubik ostidagi 3D soya (Yashil nur effekti) */
    .cube-item::after {
      content: '';
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(88, 204, 153, 0.5) 0%, transparent 60%);
      z-index: -1;
      filter: blur(8px);
    }
  </style>
</head>
<body>

  <div class="cube-grid">
    <!-- 1-qator -->
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil Kubik 1">
    </div>
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil Kubik 2">
    </div>
    
    <!-- 2-qator -->
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil Kubik 3">
    </div>
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil Kubik 4">
    </div>
  </div>

</body>
</html>
