<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profil</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Sizning CSS stillaringiz... */
        html, body { background: #000 !important; color: #fff; margin: 0; padding: 0; }
    </style>
</head>
<body>

    <!-- Sahifa kontenti (profil ma'lumotlari va h.k.) -->
    <div class="mobile-container">
        <h1>Profil</h1>
        <p>Bu profil sahifasi. Orqaga qaytish uchun tepadagi tugmani yoki telefon tugmasini bosing.</p>
    </div>

    <!-- Telegram Mini App Skriptlari -->
    <script>
        // 1. Telegram Mini App initsializatsiyasi va dizayn sozlamalari
        const tg = window.Telegram?.WebApp;
        
        if (tg) {
            tg.ready();
            tg.expand();
            
            if (tg.requestFullscreen) {
                try {
                    tg.requestFullscreen();
                } catch (e) {
                    console.warn("Fullscreen request failed", e);
                }
            }
            
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');

            // 2. Telegram Mini App dagi tepa "Orqaga" (Back) tugmasini ko'rsatish
            tg.BackButton.show();
            
            // Tepadagi tugma bosilganda index.html ga qaytish
            tg.BackButton.onClick(function() {
                window.location.href = 'index.html';
            });
        }

        // 3. Telefonning o'zidagi (Android back button yoki iOS ishora) orqaga qaytish tugmasi uchun
        // Brauzer tarixiga soxta yozuv qo'shamiz
        window.history.pushState({page: 'profil'}, "Profil", "");
        
        window.addEventListener('popstate', function(event) {
            // Orqaga qaytish hodisasi yuz berganda index.html ga yo'naltirish
            window.location.href = 'index.html';
        });
        
    </script>
</body>
</html>
