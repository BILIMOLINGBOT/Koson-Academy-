<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yashil 3D kubiklar · seti</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #08090B;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1rem;
    }

    /* asosiy grid – 2 ustunli, moslashuvchan */
    .cube-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(120px, 160px));
      gap: 2rem 1.5rem;
      align-items: center;
      justify-items: center;
      width: fit-content;
    }

    .cube-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .cube-item:hover {
      transform: translateY(-4px) scale(1.02);
    }

    /* 3D rasm – yashil rangga o'girilgan kubik */
    .cube-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: sepia(100%) hue-rotate(100deg) saturate(300%) brightness(1.0) drop-shadow(0 6px 8px rgba(46, 255, 150, 0.3));
      transition: filter 0.25s ease;
    }

    .cube-item:hover img {
      filter: sepia(100%) hue-rotate(105deg) saturate(320%) brightness(1.1) drop-shadow(0 10px 14px rgba(0, 255, 128, 0.5));
    }

    /* Soya / yashil nur effekti – kubik tagida */
    .cube-item::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      height: 18px;
      background: radial-gradient(ellipse, rgba(88, 224, 166, 0.65) 0%, rgba(20, 180, 120, 0.25) 45%, transparent 75%);
      filter: blur(10px);
      z-index: 0;
      pointer-events: none;
      border-radius: 50%;
      transition: all 0.25s ease;
    }

    .cube-item:hover::after {
      width: 90%;
      height: 24px;
      background: radial-gradient(ellipse, rgba(130, 255, 190, 0.8) 0%, rgba(40, 220, 140, 0.4) 50%, transparent 80%);
      filter: blur(12px);
    }

    /* rasm elementini soya ustida ko'rsatish uchun */
    .cube-item img {
      position: relative;
      z-index: 2;
    }

    /* Mobil va kichik ekranlar uchun qulaylik */
    @media (max-width: 420px) {
      .cube-grid {
        grid-template-columns: repeat(2, minmax(100px, 130px));
        gap: 1.2rem 0.8rem;
      }
    }

    /* dekorativ yorug'lik chizig'i (ixtiyoriy) */
    .cube-item::before {
      content: '';
      position: absolute;
      inset: -8px;
      background: radial-gradient(circle at 50% 40%, rgba(72, 255, 170, 0.08) 0%, transparent 70%);
      z-index: 0;
      border-radius: 20px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="cube-grid">
    <!-- 1-qator: ikkita yashil kubik -->
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil kubik 1 – 3D">
    </div>
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil kubik 2 – 3D">
    </div>

    <!-- 2-qator: yana ikkita yashil kubik -->
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil kubik 3 – 3D">
    </div>
    <div class="cube-item">
      <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="Yashil kubik 4 – 3D">
    </div>
  </div>
</body>
</html>
