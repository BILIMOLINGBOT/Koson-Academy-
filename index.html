<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LearnU · Asosiy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Umumiy sozlamalar */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000000; color: #ffffff; height: 100vh; overflow: hidden; }
    
    .app-wrapper { 
      width: 100%; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      position: relative; 
    }

    /* Header */
    .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .avatar-wrapper { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 45px; height: 45px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .points-badge { background: #fff; color: #000; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.9rem; }

    /* Modullar ro'yxati (Scroll) */
    .scroll-container { 
      flex: 1; 
      display: flex; 
      padding: 40px 20px; 
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
    }

    /* Zig-zag yo'lak (Roadmap) */
    .roadmap {
      position: relative;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 50px; /* Doiralar orasidagi masofa */
    }

    /* Doira dizayni */
    .level-node {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .level-node:active {
      transform: scale(0.92);
    }

    /* Joylashuvlar */
    .node-left {
      align-self: flex-start;
      margin-left: 10px;
    }

    .node-right {
      align-self: flex-end;
      margin-right: 10px;
    }

    /* 1-doira (Oq doira) */
    .unlocked {
      background: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    /* 2-doira (Qulflangan) */
    .locked {
      background: rgba(255, 255, 255, 0.1); /* Oq qulf ko'rinishi uchun shaffof fon */
      border: 3px solid #ffffff; /* Oq hoshiya */
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Header qismi -->
  <div class="header" onclick="openProfile()">
    <div class="avatar-wrapper">
      <div class="avatar-circle" id="avatarContainer">
        <span id="avatarText">👤</span>
        <img id="avatarImage" src="" alt="avatar" style="display: none;">
      </div>
      <div>
        <h4 id="userName" style="font-size: 1rem;">Yuklanmoqda...</h4>
        <p id="userStatus" style="color: #8e8e93; font-size: 0.8rem;">@username</p>
      </div>
    </div>
    <div class="points-badge" id="userPoints">⚡ 312</div>
  </div>

  <!-- Asosiy yo'lak qismi -->
  <div class="scroll-container" id="moduleList">
    
    <div class="roadmap">
      <!-- Zig-zag ulovchi chiziq (SVG) -->
      <svg style="position: absolute; top: 35px; left: 0; width: 100%; height: 120px; z-index: 0;">
        <line x1="45" y1="0" x2="155" y2="120" stroke="#333333" stroke-width="4" stroke-dasharray="8 8" />
      </svg>

      <!-- 1-chi doira: Oq doira, ichida qora yulduz -->
      <div class="level-node node-left unlocked" onclick="tg.HapticFeedback.impactOccurred('medium')">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#000000">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </div>

      <!-- 2-chi doira: Oq doira (hoshiya), ichida oq qulf -->
      <div class="level-node node-right locked" onclick="tg.HapticFeedback.notificationOccurred('error')">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>
        </svg>
      </div>
      
    </div>

  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  
  // Ilovani to'liq ekranga yoyish
  tg.expand();
  tg.ready();
  tg.headerColor = '#000000';
  tg.backgroundColor = '#000000';

  const user = tg.initDataUnsafe?.user;

  function loadUserData() {
    if (user) {
      document.getElementById('userName').textContent = user.first_name;
      document.getElementById('userStatus').textContent = user.username ? '@' + user.username : 'ID: ' + user.id;
      
      if (user.photo_url) {
        const img = document.getElementById('avatarImage');
        img.src = user.photo_url;
        img.style.display = 'block';
        document.getElementById('avatarText').style.display = 'none';
      }
    }
  }

  function openProfile() {
    tg.HapticFeedback.impactOccurred('light');
    console.log("Profil ochildi");
  }

  loadUserData();
</script>

</body>
</html>
