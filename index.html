<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>English · 3D Path</title>
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #08090B;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    /* main app container – mobile-first 390x844 */
    .app {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #08090B;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* firefox */
      -ms-overflow-style: none; /* ie */
      box-shadow: 0 0 40px rgba(60, 20, 120, 0.2);
    }
    .app::-webkit-scrollbar {
      display: none; /* chrome/safari */
    }
    /* subtle dark purple glow near top */
    .app::before {
      content: '';
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 300px;
      background: radial-gradient(circle, rgba(100, 50, 180, 0.20) 0%, rgba(8, 9, 11, 0) 80%);
      pointer-events: none;
      z-index: 0;
    }
    /* header – floating pill */
    .header {
      position: sticky;
      top: 16px;
      z-index: 20;
      width: calc(100% - 32px);
      max-width: 380px;
      margin: 0 auto 20px;
      height: 74px;
      background: linear-gradient(145deg, #1b1a2a, #12111e);
      border-radius: 40px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 0 1px rgba(120, 80, 200, 0.15);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 12px;
      border: 1px solid rgba(180, 140, 255, 0.08);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-circle {
      width: 44px;
      height: 44px;
      background: #2b5bff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(43, 91, 255, 0.3);
      flex-shrink: 0;
    }
    .icon-circle svg {
      width: 28px;
      height: 28px;
      fill: white;
    }
    .header-title {
      color: white;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.3px;
      white-space: nowrap;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .chevron {
      color: white;
      font-size: 28px;
      font-weight: 300;
      opacity: 0.8;
      margin-right: 4px;
      transform: translateY(2px);
    }
    /* path container – diagonal zigzag */
    .path {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 12px 60px;
      position: relative;
      z-index: 2;
      gap: 20px;
    }
    /* each row holds a cube (or button) and follows zigzag */
    .row {
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 0 8px;
    }
    .row-left { justify-content: flex-start; padding-left: 28px; }
    .row-right { justify-content: flex-end; padding-right: 28px; }
    .row-center { justify-content: center; }
    .row-start { justify-content: center; margin-top: 8px; }

    /* cube wrapper – keeps perspective & shadow */
    .cube-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 30px 30px rgba(0,0,0,0.9)) drop-shadow(0 10px 20px rgba(0,0,0,0.6));
      transition: transform 0.15s ease;
    }
    .cube-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: auto;
      filter: drop-shadow(0 20px 25px rgba(0,0,0,0.9));
      transition: transform 0.15s ease;
    }
    /* active cube special glow */
    .cube-wrapper.active img {
      filter: drop-shadow(0 0 25px rgba(139, 85, 243, 0.7)) drop-shadow(0 20px 30px rgba(0,0,0,0.9));
    }
    /* lock icon overlay – positioned on recessed top */
    .lock-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%) scale(0.38);
      width: 100px;
      height: 100px;
      pointer-events: none;
      opacity: 0.9;
    }
    .lock-overlay img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
    }

    /* START button */
    .start-btn-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 12px 0 6px;
    }
    .start-btn {
      width: 280px;
      height: 70px;
      background: #4B5561;
      border-radius: 40px;
      border: none;
      box-shadow: 0 14px 28px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      color: white;
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s;
      background: linear-gradient(145deg, #4f5a68, #3d4652);
      font-family: inherit;
      padding-bottom: 4px;
      position: relative;
      z-index: 5;
    }
    .start-btn:active {
      transform: scale(0.94);
      box-shadow: 0 6px 16px rgba(0,0,0,0.9);
    }
    /* downward pointer triangle */
    .pointer {
      margin-top: -6px;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 22px solid #4B5561;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.7));
      transform: scale(1);
      z-index: 4;
    }
    /* spacing adjustments */
    .gap-small { gap: 6px; }
    .gap-large { gap: 28px; }

    /* responsive scaling */
    @media (max-width: 400px) {
      .cube-wrapper { width: 180px; height: 180px; }
      .start-btn { width: 240px; height: 64px; font-size: 26px; }
      .header-title { font-size: 24px; }
      .header { height: 68px; padding: 0 14px 0 10px; }
      .icon-circle { width: 38px; height: 38px; }
      .lock-overlay { transform: translate(-50%, -60%) scale(0.32); }
    }
    @media (max-width: 360px) {
      .cube-wrapper { width: 150px; height: 150px; }
      .start-btn { width: 200px; height: 58px; font-size: 22px; }
      .header-title { font-size: 20px; }
      .header { height: 60px; }
      .lock-overlay { transform: translate(-50%, -60%) scale(0.28); }
    }
    @media (min-width: 500px) {
      .cube-wrapper { width: 240px; height: 240px; }
      .start-btn { width: 300px; height: 76px; font-size: 34px; }
      .header { max-width: 420px; }
    }
    /* ensure no horizontal scroll */
    .app {
      overscroll-behavior: none;
    }
    /* extra polish for dark bg */
    .row + .row {
      margin-top: -8px;
    }
    /* completed green cubes – slight extra glow */
    .cube-wrapper.completed img {
      filter: drop-shadow(0 0 18px rgba(114, 221, 181, 0.25)) drop-shadow(0 20px 30px rgba(0,0,0,0.9));
    }
    /* lock cubes – subtle desaturation */
    .cube-wrapper.locked img {
      filter: drop-shadow(0 20px 28px rgba(0,0,0,0.95)) grayscale(0.2);
    }
    /* clickable cubes (active & completed) */
    .cube-wrapper.clickable {
      cursor: pointer;
    }
    .cube-wrapper.clickable:active img {
      transform: scale(0.92);
      transition: transform 0.08s;
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <!-- sticky header -->
  <div class="header">
    <div class="header-left">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <span class="header-title">General English</span>
    </div>
    <div class="chevron">▾</div>
  </div>

  <!-- zigzag path -->
  <div class="path">

    <!-- row 1: locked cube upper-right -->
    <div class="row row-right">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- row 2: locked cube upper-middle/left -->
    <div class="row row-left">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- row 3: locked far-left -->
    <div class="row row-left">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- row 4: locked center -->
    <div class="row row-center">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- row 5: locked right -->
    <div class="row row-right">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- row 6: locked lower-right -->
    <div class="row row-right">
      <div class="cube-wrapper locked">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="locked cube" loading="lazy">
        <div class="lock-overlay"><img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" alt="lock"></div>
      </div>
    </div>

    <!-- START button row (with pointer) -->
    <div class="row row-center" style="margin-top: 10px;">
      <div class="start-btn-wrapper">
        <button class="start-btn" id="startBtn">START</button>
        <div class="pointer"></div>
      </div>
    </div>

    <!-- active purple cube -->
    <div class="row row-center" style="margin-top: -8px;">
      <div class="cube-wrapper active clickable" id="purpleCube">
        <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" alt="active purple cube" loading="lazy">
      </div>
    </div>

    <!-- completed green cube 1 -->
    <div class="row row-left" style="margin-top: -8px;">
      <div class="cube-wrapper completed clickable" id="green1">
        <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" alt="completed green cube" loading="lazy">
      </div>
    </div>

    <!-- completed green cube 2 -->
    <div class="row row-left" style="margin-top: -8px;">
      <div class="cube-wrapper completed clickable" id="green2">
        <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" alt="completed green cube" loading="lazy">
      </div>
    </div>

    <!-- extra spacer for scroll -->
    <div style="height: 30px;"></div>
  </div>
</div>

<script>
  (function() {
    // interactive press feedback: purple cube & START button
    const startBtn = document.getElementById('startBtn');
    const purpleCube = document.getElementById('purpleCube');
    const green1 = document.getElementById('green1');
    const green2 = document.getElementById('green2');

    function animatePress(el) {
      if (!el) return;
      el.style.transition = 'transform 0.08s ease';
      el.style.transform = 'scale(0.94)';
      setTimeout(() => {
        el.style.transform = 'scale(1)';
      }, 100);
    }

    // start button
    startBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      animatePress(this);
      // subtle haptic-like
    });

    // purple cube (active)
    purpleCube.addEventListener('click', function(e) {
      e.stopPropagation();
      animatePress(this);
    });

    // green cubes (completed)
    [green1, green2].forEach(cube => {
      cube.addEventListener('click', function(e) {
        e.stopPropagation();
        animatePress(this);
      });
    });

    // locked cubes – no interaction (disabled)
    document.querySelectorAll('.cube-wrapper.locked').forEach(el => {
      el.style.cursor = 'default';
      el.addEventListener('click', (e) => e.stopPropagation());
    });

    // optional: adjust scroll behavior for smooth
    const app = document.getElementById('app');
    // ensure header sticky works
  })();
</script>
</body>
</html>
