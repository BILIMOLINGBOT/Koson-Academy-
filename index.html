<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Learning Path UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #08080c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* Mobil ekran ko'rinishidagi konteyner */
    .app-screen {
      width: 100%;
      max-width: 410px;
      height: 840px;
      background: linear-gradient(180deg, #12131a 0%, #08080c 100%);
      border-radius: 30px;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 60px 0;
    }

    /* Yuqori Header Pill */
    .header-pill {
      position: sticky;
      top: 15px;
      z-index: 100;
      background: rgba(22, 25, 35, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .header-pill .target-icon {
      width: 22px;
      height: 22px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-pill .target-icon::after {
      content: '';
      width: 8px;
      height: 8px;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    .header-pill span {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.3px;
    }

    .header-pill .arrow {
      border: solid #94a3b8;
      border-width: 0 2px 2px 0;
      display: inline-block;
      padding: 3px;
      transform: rotate(45deg);
      margin-left: 4px;
    }

    /* Yo'lakcha (Path) konteyneri */
    .path-container {
      width: 100%;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px;
    }

    /* Isometric 3D Kubiklar */
    .node-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      perspective: 1000px;
    }

    /* Qatorlar bo'yicha chap va o'ngga surish (Zig-zag) */
    .pos-1 { transform: translateX(-100px); }
    .pos-2 { transform: translateX(-50px); }
    .pos-3 { transform: translateX(10px); }
    .pos-4 { transform: translateX(70px); }
    .pos-5 { transform: translateX(20px); }
    .pos-6 { transform: translateX(-40px); }
    .pos-7 { transform: translateX(-80px); }
    .pos-8 { transform: translateX(-20px); }
    .pos-9 { transform: translateX(30px); }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(60deg) rotateZ(-45deg);
      transition: transform 0.3s ease;
    }

    .cube:hover {
      transform: rotateX(60deg) rotateZ(-45deg) translateZ(8px);
    }

    .face {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 14px;
    }

    /* 3D Tomonlar */
    .face.top {
      transform: translateZ(35px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .face.left {
      transform: rotateY(-90deg) translateZ(35px);
    }

    .face.right {
      transform: rotateX(-90deg) translateZ(35px);
    }

    /* --- STYLES: GREEN (Bajarilgan) --- */
    .cube.completed .top {
      background: #7ae3b5;
    }
    .cube.completed .left {
      background: #41b384;
    }
    .cube.completed .right {
      background: #2e8f66;
    }
    .check-mark {
      transform: rotate(45deg);
      width: 12px;
      height: 22px;
      border: solid #0b4f32;
      border-width: 0 4px 4px 0;
      margin-top: -6px;
    }

    /* --- STYLES: PURPLE (Aktiv - START) --- */
    .cube.active {
      filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6));
    }
    .cube.active .top {
      background: #a855f7;
    }
    .cube.active .left {
      background: #7e22ce;
    }
    .cube.active .right {
      background: #6b21a8;
    }

    /* START Tooltip/Badge */
    .start-badge {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b303c;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 20px;
      letter-spacing: 1px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      z-index: 10;
      white-space: nowrap;
    }

    .start-badge::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0 6px;
      border-style: solid;
      border-color: #2b303c transparent transparent transparent;
    }

    /* --- STYLES: GREY (Qulflangan) --- */
    .cube.locked .top {
      background: #e2e8f0;
    }
    .cube.locked .left {
      background: #94a3b8;
    }
    .cube.locked .right {
      background: #64748b;
    }

    .lock-icon {
      width: 16px;
      height: 14px;
      background: #334155;
      border-radius: 3px;
      position: relative;
      transform: rotate(45deg);
    }
    .lock-icon::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 2px;
      width: 8px;
      height: 8px;
      border: 2px solid #334155;
      border-bottom: none;
      border-radius: 5px 5px 0 0;
    }

    /* --- STYLES: SHINING TOP CUBE (Nurlanuvchi kristall) --- */
    .cube.crystal {
      filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.9));
    }
    .cube.crystal .top {
      background: rgba(255, 255, 255, 0.95);
    }
    .cube.crystal .left {
      background: rgba(200, 210, 225, 0.7);
    }
    .cube.crystal .right {
      background: rgba(160, 175, 200, 0.6);
    }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <!-- Header Dropdown -->
    <div class="header-pill">
      <div class="target-icon"></div>
      <span>General English</span>
      <i class="arrow"></i>
    </div>

    <!-- Path Container (Pastdan yuqoriga qarab taxlangan) -->
    <div class="path-container">

      <!-- 9. Kristall Yoritilgan Kubik (Eng tepada) -->
      <div class="node-wrapper pos-9">
        <div class="cube crystal">
          <div class="face top"></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 8. Qulflangan Kubik -->
      <div class="node-wrapper pos-8">
        <div class="cube locked">
          <div class="face top"><div class="lock-icon"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 7. Qulflangan Kubik -->
      <div class="node-wrapper pos-7">
        <div class="cube locked">
          <div class="face top"><div class="lock-icon"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 6. Qulflangan Kubik -->
      <div class="node-wrapper pos-6">
        <div class="cube locked">
          <div class="face top"><div class="lock-icon"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 5. Qulflangan Kubik -->
      <div class="node-wrapper pos-5">
        <div class="cube locked">
          <div class="face top"><div class="lock-icon"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 4. Qulflangan Kubik -->
      <div class="node-wrapper pos-4">
        <div class="cube locked">
          <div class="face top"><div class="lock-icon"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 3. Aktiv Boshlash Kubiki (START) -->
      <div class="node-wrapper pos-3">
        <div class="start-badge">START</div>
        <div class="cube active">
          <div class="face top"></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 2. Bajarilgan Yashil Kubik -->
      <div class="node-wrapper pos-2">
        <div class="cube completed">
          <div class="face top"><div class="check-mark"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

      <!-- 1. Bajarilgan Yashil Kubik (Eng pastda) -->
      <div class="node-wrapper pos-1">
        <div class="cube completed">
          <div class="face top"><div class="check-mark"></div></div>
          <div class="face left"></div>
          <div class="face right"></div>
        </div>
      </div>

    </div>

  </div>

</body>
</html>
