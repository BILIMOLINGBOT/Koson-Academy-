<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LearnU · Asosiy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Umumiy sozlamalar */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Nunito", "SF Pro Display", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #131415; color: #ffffff; height: 100vh; overflow: hidden; }
    
    .app-wrapper { 
      width: 100%; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }

    /* Header */
    .header { padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10; background: #131415; border-bottom: 2px solid #2b333a; }
    .avatar-wrapper { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 45px; height: 45px; background: #2b333a; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .points-badge { background: #2b333a; color: #58cc02; padding: 6px 14px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }

    /* Scroll hududi */
    .scroll-container { 
      flex: 1; 
      overflow-y: auto;
      position: relative;
      padding: 40px 0 100px 0;
    }

    /* Yo'lak konteyneri */
    .roadmap-container {
      position: relative;
      width: 320px;
      margin: 0 auto;
    }

    /* Ulovchi chiziq (SVG) */
    .roadmap-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Har bir bosqich uchun quti */
    .level-wrapper {
      position: absolute;
      width: 70px; 
      height: 70px;
      z-index: 2;
    }

    /* 3D Tugma dizayni */
    .node-button {
      width: 100%; 
      height: 100%;
      border-radius: 50%;
      display: flex; 
      align-items: center; 
      justify-content: center;
      background: var(--bg-color);
      box-shadow: 0 8px 0 var(--shadow-color);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      position: relative;
      z-index: 2;
    }

    /* Bosilganda pastga cho'kish (3D effekt) */
    .node-button:active {
      transform: translateY(8px);
      box-shadow: 0 0 0 var(--shadow-color);
    }

    /* Ochiq (Current) bosqich */
    .unlocked {
      --bg-color: #58cc02;
      --shadow-color: #58a700;
    }
    .unlocked svg path { fill: #ffffff; }

    /* Qulflangan bosqichlar */
    .locked {
      --bg-color: #2b333a;
      --shadow-color: #171d22;
    }
    .locked svg path { fill: #52656d; }

    /* Ochiq bosqich atrofidagi aylanuvchi halqa */
    .active-ring {
      position: absolute;
      top: -12px; left: -12px; right: -12px; bottom: -12px;
      border: 4px solid rgba(88, 204, 2, 0.4);
      border-radius: 50%;
      z-index: 1;
      animation: pulse 2s infinite;
    }

    /* "Boshlash" yozuvi (Tooltip) */
    .start-tooltip {
      position: absolute;
      top: -45px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #58cc02;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 #e5e5e5;
      white-space: nowrap;
      z-index: 10;
      animation: bounce 2s infinite;
      pointer-events: none;
    }

    .start-tooltip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #e5e5e5;
    }

    /* Animatsiyalar */
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0; }
      100% { transform: scale(0.9); opacity: 1; }
    }
    @keyframes bounce {
      0%, 100% { top: -50px; }
      50% { top: -42px; }
    }
  </style>
</head>
<body>

<div class="app-wrapper">
  <!-- Header -->
  <div class="header" onclick="openProfile()">
    <div class="avatar-wrapper">
      <div class="avatar-circle" id="avatarContainer">
        <span id="avatarText">👤</span>
        <img id="avatarImage" src="" alt="avatar" style="display: none;">
      </div>
      <div>
        <h4 id="userName" style="font-size: 1rem;">Yuklanmoqda...</h4>
        <p id="userStatus" style="color: #52656d; font-size: 0.85rem; font-weight: bold;">O'rganishni boshlaymiz!</p>
      </div>
    </div>
    <div class="points-badge" id="userPoints">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffc800"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      312
    </div>
  </div>

  <!-- Yo'lak (Roadmap) -->
  <div class="scroll-container">
    <div class="roadmap-container" id="roadmapContainer"></div>
  </div>
</div>

<script>
  const tg = window.Telegram.WebApp;
  
  tg.expand();
  tg.ready();
  tg.headerColor = '#131415';
  tg.backgroundColor = '#131415';

  const user = tg.initDataUnsafe?.user;
  function loadUserData() {
    if (user) {
      document.getElementById('userName').textContent = user.first_name;
      if (user.photo_url) {
        const img = document.getElementById('avatarImage');
        img.src = user.photo_url;
        img.style.display = 'block';
        document.getElementById('avatarText').style.display = 'none';
      }
    }
  }

  function openProfile() {
    tg.HapticFeedback.impactOccurred('light');
  }

  loadUserData();

  // --- Duolingo uslubidagi Yo'lak (Roadmap) ---
  function generateRoadmap(totalLevels) {
    const container = document.getElementById('roadmapContainer');
    
    // Ikonkalar
    const starIcon = `<svg width="34" height="34" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
    const lockIcon = `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>`;

    // Ilon izi (S-shape) uchun X o'qidagi siljishlar tartibi
    const xOffsets = [0, -45, -75, -45, 0, 45, 75, 45];
    const nodeSpacingY = 100; // Har bir doira orasidagi masofa
    const centerX = 160;      // Konteynerning o'rtasi
    
    let points = [];
    let nodesHTML = '';

    for (let i = 0; i < totalLevels; i++) {
      const offsetX = xOffsets[i % xOffsets.length];
      const x = centerX + offsetX;
      const y = 35 + i * nodeSpacingY; 
      
      points.push({x, y});
      
      const isUnlocked = i === 0;
      const statusClass = isUnlocked ? 'unlocked' : 'locked';
      const icon = isUnlocked ? starIcon : lockIcon;
      
      let extraElements = '';
      if (isUnlocked) {
        extraElements = `
          <div class="active-ring"></div>
          <div class="start-tooltip">Boshlash</div>
        `;
      }

      nodesHTML += `
        <div class="level-wrapper" style="left: ${x - 35}px; top: ${y - 35}px;">
          ${extraElements}
          <div class="node-button ${statusClass}" onclick="handleNodeClick(${isUnlocked})">
            ${icon}
          </div>
        </div>`;
    }

    // SVG orqali silliq qalin chiziq tortish
    let pathD = `M ${points[0].x} ${points[0].y}`;
    for (let i = 1; i < points.length; i++) {
      let p0 = points[i - 1];
      let p1 = points[i];
      let midY = (p0.y + p1.y) / 2;
      // Bezier curvelari orqali silliq aylanish efekti yaratamiz
      pathD += ` C ${p0.x} ${midY}, ${p1.x} ${midY}, ${p1.x} ${p1.y}`;
    }

    const svgHeight = points[points.length - 1].y + 50;
    container.style.height = svgHeight + 'px';

    const svgLinesHTML = `
      <svg class="roadmap-lines" width="100%" height="${svgHeight}">
        <path d="${pathD}" fill="none" stroke="#2b333a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    
    container.innerHTML = svgLinesHTML + nodesHTML;
  }

  window.handleNodeClick = function(isUnlocked) {
    if (isUnlocked) {
      tg.HapticFeedback.impactOccurred('heavy');
      // Darsga o'tish kodi
    } else {
      tg.HapticFeedback.notificationOccurred('error');
    }
  };

  generateRoadmap(30);
</script>

</body>
</html>
