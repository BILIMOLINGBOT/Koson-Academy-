
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>L App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* Loading ekran */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* L logotipi */
    .logo {
      font-size: 100px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      animation: logoIntro 1.5s ease-in-out infinite;
      text-shadow: 0 0 25px rgba(255,255,255,0.3);
    }

    .loading-text {
      color: #888;
      font-size: 13px;
      letter-spacing: 4px;
      animation: textPulse 1.2s ease-in-out infinite;
    }

    @keyframes logoIntro {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-12deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.1) rotate(0deg);
      }

      75% {
        transform: scale(1);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    /* Asosiy sahifa */
    #app {
      min-height: 100vh;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #app.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div id="loader">
    <div class="logo">L</div>
    <div class="loading-text">LOADING...</div>
  </div>

  <main id="app">
    <h1>L App</h1>
    <p>Asosiy sahifaga xush kelibsiz!</p>
  </main>

  <script>
    const loader = document.getElementById("loader");
    const app = document.getElementById("app");

    // Loading tugagach, logotip yo'qoladi
    window.addEventListener("load", () => {
      setTimeout(() => {
        loader.classList.add("hide");
        app.classList.add("show");
      }, 1800);
    });
  </script>

</body>
</html>
