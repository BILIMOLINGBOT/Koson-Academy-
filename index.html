<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2226; /* Rasmga yaqin to'q fon */
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 250px;
      height: 700px;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background-color: #4b585a; /* Rasmga yaqin karta rangi */
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
    }

    /* Tualet qog'ozi SVG ikonasi */
    .icon-box svg {
      width: 35px;
      height: 35px;
      fill: white;
    }

    /* Rasm bo'yicha aniq koordinatalar */
    .pos1 { top: 0px; right: 0px; }
    .pos2 { top: 70px; right: 60px; }
    .pos3 { top: 140px; right: 120px; }
    .pos4 { top: 210px; right: 180px; }
    .pos5 { top: 280px; right: 120px; }
    .pos6 { top: 350px; right: 60px; }
    .pos7 { top: 420px; right: 0px; }
    .pos8 { top: 490px; right: 60px; }
    .pos9 { top: 560px; right: 120px; }
    .pos10 { top: 630px; right: 180px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- SVG ikonasi bilan birgalikda 10 ta tugma -->
    <script>
      const svgIcon = `<svg viewBox="0 0 24 24"><path d="M19 8c-1.66 0-3 1.34-3 3v2h2v-2c0-.55.45-1 1-1h4v-2h-4zM5 8c-1.66 0-3 1.34-3 3v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1h12V8H5z"/></svg>`;
      const positions = ['pos1', 'pos2', 'pos3', 'pos4', 'pos5', 'pos6', 'pos7', 'pos8', 'pos9', 'pos10'];
      
      positions.forEach(pos => {
        document.write(`<div class="icon-box ${pos}">${svgIcon}</div>`);
      });
    </script>
  </div>

</body>
</html>
