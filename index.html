<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Darslar - Ilon izi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA style -->
  <meta name="theme-color" content="#4da3e2">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center; 
      padding: 50px 20px; 
      box-sizing: border-box;
      overflow-x: hidden; 
    }

    /* Cards Grid - Vertikal ilon izi shakli */
    .cards-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 35px; /* Kartalar orasidagi vertikal masofa kattalashtirildi */
      width: 100%;
      max-width: 600px;
      position: relative;
      padding: 20px 0;
    }

    /* SVG chiziq uchun (Kartalar orqasidagi yo'lak) */
    #path-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Kartalar orqasida turishi uchun */
      pointer-events: none;
    }

    /* Card Styles - Circular */
    .card {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      color: white;
      transition: all 0.4s ease;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      position: relative; /* Chap/O'ng siljishlar ishlashi uchun muhim */
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 2; /* SVG chiziqdan ustunda turadi */
    }

    .card:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.18);
      z-index: 10;
    }

    .card.active {
      cursor: pointer;
      opacity: 1;
    }

    .card.locked {
      cursor: not-allowed;
      opacity: 0.7;
      filter: grayscale(0.3);
    }

    .card.locked:hover {
      transform: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    /* Card content */
    .card-number {
      font-size: 24px;
      font-weight: bold;
      opacity: 0.9;
    }

    .status-icon {
      font-size: 18px;
      margin-top: 3px;
    }

    /* Card states */
    .card.completed {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    .card.in-progress {
      background: linear-gradient(135deg, #4da3e2, #3b82f6);
    }

    .card.locked-state {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
    }

    .card.next-available {
      background: linear-gradient(135deg, #4da3e2, #3b82f6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(77, 163, 226, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(77, 163, 226, 0); }
      100% { box-shadow: 0 0 0 0 rgba(77, 163, 226, 0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .card { width: 85px; height: 85px; }
      .card-number { font-size: 20px; }
      .status-icon { font-size: 14px; }
      .cards-grid { gap: 25px; }
    }

    @media (max-width: 480px) {
      .card { width: 70px; height: 70px; }
      .card-number { font-size: 18px; }
      .status-icon { font-size: 12px; }
      .cards-grid { gap: 20px; }
    }

    /* Loading animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeIn 0.6s ease forwards; }
  </style>
</head>
<body>

  <div class="cards-grid" id="cardsContainer">
    <!-- SVG Bog'lovchi yo'lak -->
    <svg id="path-svg"></svg>
    <!-- Kartalar JavaScript orqali shu yerga qo'shiladi -->
  </div>

  <script>
    // Darslar ma'lumotlari
    const lessonsData = Array(30).fill(null).map((_, i) => {
      if (i < 2) return { percent: 100, completed: true, unlocked: true };
      if (i === 2) return { percent: 80, completed: false, unlocked: true };
      return { percent: 0, completed: false, unlocked: false };
    });

    const cardsContainer = document.getElementById('cardsContainer');

    /* 
       Siz chizib bergan aniq zigzag shaklining raqamli koeffitsientlari.
       (O'ngga maksimal = 1.0, Chapga maksimal = -1.0)
    */
    const pathOffsets = [1.0, 0.5, 0.0, -0.3, 0.2, 0.6, 0.9, 0.3, -0.3, -1.0];

    // Kartalarning gorizontal joylashuvini o'rnatish
    function updateCardPositions() {
      const cards = document.querySelectorAll('.card');
      
      let amplitude = 120; // Siljish radiusi (Keng ekranlar uchun)
      if (window.innerWidth <= 480) {
        amplitude = 80; // Telefonlar uchun
      } else if (window.innerWidth <= 768) {
        amplitude = 100; // Planshetlar uchun
      }

      cards.forEach((card, index) => {
        const offsetMultiplier = pathOffsets[index % pathOffsets.length];
        card.style.left = `${offsetMultiplier * amplitude}px`;
      });
    }

    // Nuqtalarni bir-biriga ulovchi chiziqni (path) chizish
    function drawPath() {
      const svg = document.getElementById('path-svg');
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;
      
      let d = "";
      cards.forEach((card, index) => {
        // Har bir kartaning markaziy koordinatasini topamiz
        const x = card.offsetLeft + (card.offsetWidth / 2);
        const y = card.offsetTop + (card.offsetHeight / 2);
        
        if (index === 0) {
          d += `M ${x} ${y} `; // Boshlang'ich nuqta
        } else {
          d += `L ${x} ${y} `; // Chiziq orqali ulash
        }
      });
      
      // Chiziq dizayni (qalinligi, rangi)
      svg.innerHTML = `
        <path d="${d}" 
              stroke="rgba(77, 163, 226, 0.3)" 
              stroke-width="16" 
              fill="none" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
      `;
    }

    // Kartalarni yaratish funksiyasi
    function createCards() {
      let nextAvailableIndex = -1;
      
      lessonsData.forEach((lesson, index) => {
        if (lesson.unlocked && !lesson.completed && nextAvailableIndex === -1) {
          nextAvailableIndex = index;
        }
      });

      lessonsData.forEach((lesson, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);
        card.style.animationDelay = `${(index % 10) * 0.05}s`;
        
        let cardClass = '';
        let statusIcon = '';
        
        if (lesson.completed) {
          cardClass = 'completed';
          statusIcon = '<i class="fas fa-check status-icon"></i>';
        } else if (lesson.unlocked) {
          if (index === nextAvailableIndex) {
            cardClass = 'next-available';
            statusIcon = '<i class="fas fa-play status-icon"></i>';
          } else {
            cardClass = 'in-progress';
            statusIcon = '<i class="fas fa-circle status-icon"></i>';
          }
        } else {
          cardClass = 'locked-state';
          statusIcon = '<i class="fas fa-lock status-icon"></i>';
        }
        
        card.classList.add(cardClass);
        
        if (lesson.unlocked) {
          card.classList.add('active');
          card.onclick = () => { window.location.href = `dars${index + 1}.html`; };
        } else {
          card.classList.add('locked');
          card.onclick = () => { alert(`Iltimos, avval ${index}-darsni tugating!`); };
        }
        
        card.innerHTML = `
          <div class="card-number">${index + 1}</div>
          ${statusIcon}
        `;
        
        cardsContainer.appendChild(card);
      });

      // Kartalar yaratilgach ularning joyini to'g'irlaymiz
      updateCardPositions();
      
      // DOM joylashib bo'lgach orqa fon chizig'ini chizamiz
      setTimeout(drawPath, 50);
    }

    // Oyna o'lchami o'zgarganda dizayn buzilmasligi uchun qayta hisoblash
    window.addEventListener('resize', () => {
      updateCardPositions();
      drawPath();
    });

    window.onload = function() {
      createCards();
      
      // Test uchun: 3-dars ochilishi
      setTimeout(() => {
        if (lessonsData[2].percent >= 80) {
          simulateLessonCompletion(3);
        }
      }, 2000);
    };

    function simulateLessonCompletion(lessonIndex) {
      if (lessonIndex >= 0 && lessonIndex < lessonsData.length) {
        lessonsData[lessonIndex].unlocked = true;
        
        const card = document.querySelector(`.card[data-index="${lessonIndex}"]`);
        if (card) {
          card.classList.remove('locked', 'locked-state');
          card.classList.add('active', 'in-progress', 'next-available');
          
          const statusIcon = card.querySelector('.status-icon');
          if (statusIcon) statusIcon.outerHTML = '<i class="fas fa-play status-icon"></i>';
          
          card.style.background = 'linear-gradient(135deg, #4da3e2, #3b82f6)';
          card.onclick = () => { window.location.href = `dars${lessonIndex + 1}.html`; };
        }
      }
    }
  </script>
</body>
</html>
