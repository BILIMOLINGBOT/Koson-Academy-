<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tualet Qog'ozi va Rangli Kartalar UI</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #171E22; /* To'q rangli fon */
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 300px;
      height: 700px;
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); /* Yengil soya */
    }

    /* Karta fon ranglari */
    .gray { background-color: #9BA0A6; }
    .green { background-color: #00A36C; }
    .pink { background-color: #F48FB1; }

    /* Rasm (tualet qog'ozi) o'lchami va oq rangga o'tkazish */
    .icon img {
      width: 35px;
      height: 35px;
      /* Asl tp.svg qora rangda bo'lsa, uni oq rangga aylantiradi */
      filter: brightness(0) invert(1); 
    }

    /* Zig-zag joylashuvlari */
    .top-right { top: 20px; right: 20px; }
    .top-mid-right { top: 90px; right: 80px; }
    .top-mid-left { top: 160px; left: 80px; }
    .mid-left { top: 230px; left: 20px; }
    .mid-mid-left { top: 300px; left: 80px; }
    .mid-mid-right { top: 370px; right: 80px; }
    .bot-mid-right { top: 440px; right: 20px; }
    .bot-mid-left { top: 510px; left: 80px; }
    .bot-left { top: 580px; left: 20px; }
    .extreme-bot-left { top: 650px; left: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 7 ta Kulrang, 2 ta Yashil, 1 ta Pushti -->
    
    <div class="icon gray top-right">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon gray top-mid-right">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon gray top-mid-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon gray mid-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>

    <!-- 2 ta Yashil karta -->
    <div class="icon green mid-mid-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon green mid-mid-right">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>

    <!-- 1 ta Pushti karta -->
    <div class="icon pink bot-mid-right">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>

    <!-- Davomi yana Kulrang kartalar -->
    <div class="icon gray bot-mid-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon gray bot-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
    
    <div class="icon gray extreme-bot-left">
      <img src="tp.svg" alt="Tualet Qog'ozi">
    </div>
  </div>
</body>
</html>
