    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2226;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 250px;
      height: 700px;
      /* markazga qo'shimcha tekshirish */
      margin: 0 auto;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background-color: #4b585a;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
    }

    .icon-box svg {
      width: 35px;
      height: 35px;
      fill: white;
    }

    /* Koordinatalar o'zgartirildi - barcha elementlar markazga yaqinroq */

</head>
