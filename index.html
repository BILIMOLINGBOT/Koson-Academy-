<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrat Farzandlari UI – tugsiz</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #1a1529;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at top, #261e38, #0a080e 70%);
        }

        /* Zigzag yo'li — button olib tashlandi, to'liq balandlik */
        .path {
            position: relative;
            height: 100%;
            width: 100%;
            margin-top: 50px;
        }

        /* Umumiy kubik uslubi */
        .cube {
            width: 80px;
            height: 80px;
            border-radius: 50px;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(50deg) rotateZ(45deg);
            transition: 0.3s;
        }

        /* Kubiklar uchun "porlash" (glow) */
        .glow {
            box-shadow: 0 0 25px 5px rgba(255, 255, 255, 0.1);
        }

        /* Yashil kubik (bajarilgan) */
        .cube-green {
            background-color: #58cc02;
            box-shadow: inset 0 -8px 0 #46a302, 0 10px 20px rgba(88, 204, 2, 0.4);
        }

        /* Binafsha kubik (START) */
        .cube-purple {
            background-color: #8952ff;
            box-shadow: inset 0 -8px 0 #6830df, 0 10px 20px rgba(137, 82, 255, 0.4);
        }

        /* Kulrang kubik (qulflangan) */
        .cube-gray {
            background-color: #e5e5e5;
            box-shadow: inset 0 -8px 0 #b3b3b3;
        }

        /* Keyingi bo'sh kubik (endi ishlatilmayapti, lekin qoldirilgan) */
        .cube-next {
            background-color: transparent;
            border: 4px solid #4a4556;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Ikonkalar */
        .icon {
            color: white;
            font-size: 30px;
            transform: rotate(-45deg) rotateX(-50deg);
        }

        /* START yozuvi */
        .start-label {
            position: absolute;
            top: -50px;
            background: #3c354a;
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transform: rotate(-45deg) rotateX(-50deg);
        }

        /* Pozitsiyalar – faqat 6 ta, pastdagi bo'sh joy to'liq saqlanadi */
        .p1 { bottom: 10%; left: 20%; }
        .p2 { bottom: 22%; left: 45%; }
        .p3 { bottom: 34%; left: 70%; }
        .p4 { bottom: 46%; left: 45%; }
        .p5 { bottom: 58%; left: 20%; }
        .p6 { bottom: 70%; left: 45%; }

        /* Tugma butunlay olib tashlandi — hech qanday btn qoidasi qolmadi */
    </style>
</head>
<body>

<div class="container">
    <div class="path">
        <!-- Yo'l elementlari (button yo'q, faqat kubiklar) -->
        <div class="cube cube-green p1 glow">
            <i class="fas fa-check icon"></i>
        </div>

        <div class="cube cube-green p2 glow">
            <i class="fas fa-check icon"></i>
        </div>

        <div class="cube cube-green p3 glow">
            <i class="fas fa-check icon"></i>
        </div>

        <div class="cube cube-green p4 glow">
            <i class="fas fa-check icon"></i>
        </div>

        <!-- START elementi – binafsha kubik, ichida START yozuvi -->
        <div class="cube cube-purple p5 glow">
            <div class="start-label">START</div>
        </div>

        <!-- Qulflangan element – kulrang kubik, qulf ikonkasi -->
        <div class="cube cube-gray p6">
            <i class="fas fa-lock icon"></i>
        </div>
    </div>

    <!-- "CONTINUE THE TASK" tugmasi butunlay olib tashlandi -->
</div>

</body>
</html>
