<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Learning Path UI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #08080c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    /* Asosiy Mobil Ekran */
    .app-screen {
      width: 100%;
      max-width: 410px;
      height: 840px;
      background: radial-gradient(circle at top, #161924 0%, #08080c 100%);
      border-radius: 30px;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 2px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 80px 0;
    }

    /* Scrollbar yashirish */
    .app-screen::-webkit-scrollbar { display: none; }
    .app-screen { -ms-overflow-style: none; scrollbar-width: none; }

    /* Yuqori Menyu Pill */
    .header-pill {
      position: sticky;
      top: 15px;
      z-index: 100;
      background: rgba(22, 25, 35, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 10px 22px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .header-pill:active { transform: scale(0.95); }

    .header-pill .target-icon {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .header-pill .target-icon::after {
      content: ''; width: 8px; height: 8px;
      border: 2px solid #fff; border-radius: 50%;
    }
    .header-pill span { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
    .header-pill .arrow {
      border: solid #94a3b8; border-width: 0 2px 2px 0;
      display: inline-block; padding: 4px;
      transform: rotate(45deg); margin-left: 5px; margin-bottom: 2px;
    }

    /* Yo'lakcha Container */
    .path-container {
      width: 100%; margin-top: 50px;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
    }

    /* Zig-zag Joylashuv (Premium dizayn) */
    .pos-1 { margin-left: -70px; }
    .pos-2 { margin-left: -20px; }
    .pos-3 { margin-left: 40px;  }
    .pos-4 { margin-left: 90px;  }
    .pos-5 { margin-left: 30px;  }
    .pos-6 { margin-left: -30px; }
    .pos-7 { margin-left: -80px; }
    .pos-8 { margin-left: -30px; }
    .pos-9 { margin-left: 40px;  }

    /* --- 3D KUBIKLAR STRUKTURASI --- */
    .node-wrapper {
      position: relative;
      width: 80px; height: 80px;
      perspective: 1500px;
    }

    /* Nurlanish Effekti (2D da - mobil xatolarni oldini oladi) */
    .glow-bg {
      position: absolute;
      top: 50%; left: 50%;
      width: 140px; height: 140px;
      transform: translate(-50%, -40%);
      border-radius: 50%;
      opacity: 0; pointer-events: none;
      z-index: 0;
    }

    .cube {
      width: 100%; height: 100%;
      position: relative; z-index: 1;
      transform-style: preserve-3d;
      transform: rotateX(55deg) rotateZ(-45deg); /* Yaxshilangan burchak */
      transition: transform 0.3s ease;
    }
    
    .cube:hover { transform: rotateX(55deg) rotateZ(-45deg) translateZ(10px); }

    .face {
      position: absolute;
      width: 70px; height: 70px;
      border-radius: 12px; /* Yumshoq burchaklar */
      box-sizing: border-box;
      /* Hajm (Bevel) berish */
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Asosiy 3 Tomon */
    .face.top {
      transform: translateZ(35px);
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.1), inset 0 4px 12px rgba(255,255,255,0.4);
    }
    .face.left {
      transform: rotateY(-90deg) translateZ(35px);
      box-shadow: inset -5px 0 15px rgba(0,0,0,0.15);
    }
    .face.right {
      transform: rotateX(-90deg) translateZ(35px);
      box-shadow: inset 0 -5px 15px rgba(0,0,0,0.25);
    }

    /* Ochiq joylarni yopish uchun ichki "qorong'u" qismlar */
    .face.bottom, .face.back-left, .face.back-right {
      background: #050508; border: none; box-shadow: none;
    }
    .face.bottom { transform: translateZ(-34px); }
    .face.back-left { transform: rotateY(90deg) translateZ(34px); }
    .face.back-right { transform: rotateX(90deg) translateZ(34px); }

    /* SVG Ikonkalar (Aniqlik uchun) */
    .icon {
      width: 32px; height: 32px;
      transform: rotate(45deg); /* 3D burilishga moslash */
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.2));
    }
    .icon-sm { width: 24px; height: 24px; }


    /* ========================================= */
    /* THEMES (Zamonaviy ranglar va gradientlar) */
    /* ========================================= */

    /* 1. COMPLETED (Yashil) */
    .completed .face.top { background: linear-gradient(135deg, #87efc3, #55c898); }
    .completed .face.left { background: #3ba97c; }
    .completed .face.right { background: #268961; }
    .completed .icon { color: #0b4f32; }

    /* 2. ACTIVE (Binafsharang) */
    .active .glow-bg {
      background: radial-gradient(circle, rgba(168,85,247,0.7) 0%, rgba(168,85,247,0) 65%);
      opacity: 1;
    }
    .active .face.top { background: linear-gradient(135deg, #c084fc, #9333ea); }
    .active .face.left { background: #7e22ce; }
    .active .face.right { background: #581c87; }

    /* 3. LOCKED (Kulrang) */
    .locked .face.top { background: linear-gradient(135deg, #e2e8f0, #cbd5e1); }
    .locked .face.left { background: #8899ac; }
    .locked .face.right { background: #5c6e84; }
    .locked .icon { color: #334155; }

    /* 4. CRYSTAL (Nur sochuvchi Oq/Shisha) */
    .crystal .glow-bg {
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 65%);
      opacity: 1;
    }
    .crystal .face.top { background: linear-gradient(135deg, #ffffff, #e0e7ff); border: 1px solid #fff;}
    .crystal .face.left { background: #b8c7dd; }
    .crystal .face.right { background: #8fa5c5; }


    /* START TUGMASI (Qalqib turuvchi zamonaviy dizayn) */
    .start-badge {
      position: absolute;
      top: -42px; left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-weight: 800; font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      letter-spacing: 1px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      z-index: 10;
      white-space: nowrap;
      animation: float 2.5s ease-in-out infinite;
    }
    .start-badge::after {
      content: ''; position: absolute;
      bottom: -5px; left: 50%;
      transform: translateX(-50%);
      border-width: 5px 5px 0 5px;
      border-style: solid;
      border-color: rgba(30, 41, 59, 0.9) transparent transparent transparent;
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }
  </style>
</head>
