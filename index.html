<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Profil UI Dizayni - Birlashtirilgan Panel</title>

<!-- Telegram Web App SDK (Telegram imkoniyatlaridan foydalanish uchun) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    margin: 0;
    padding: 0;
    background-color: var(--tg-theme-bg-color, #000000); /* Telegram mavzusiga moslashuvchanlik */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  .mobile-container {
    width: 100%;
    max-width: 400px;
    background-color: #000000;
    min-height: 100vh;
    padding-bottom: 40px; 
    box-shadow: 0 0 20px rgba(255,255,255,0.02);
  }

  .header-card {
    background: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
    background-size: cover;
    background-position: center;
    height: 380px;
    border-bottom-left-radius: 50px;
    border-bottom-right-radius: 50px;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.1);
  }

  .profile-content {
    position: absolute;
    bottom: 30px;
    left: 25px;
    right: 25px;
  }

  .avatar {
    width: 75px;
    height: 75px;
    background-image: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=200&q=80');
    background-size: cover;
    background-position: center;
    border: 3px solid white;
    border-radius: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    margin-bottom: 12px;
    position: relative;
  }

  .status-dot {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    background-color: #e6007e;
    border-radius: 4px;
    border: 2px solid white;
  }

  .profile-name {
    color: white;
    font-size: 24px;
    margin: 0 0 16px 0;
    font-weight: 600;
    letter-spacing: -0.5px;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
  }

  .action-buttons {
    display: flex;
    gap: 12px;
  }

  button {
    background-color: white;
    color: #111;
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: transform 0.1s ease;
  }

  button:active {
    transform: scale(0.97);
  }

  .btn-subscribe {
    flex: 1;
  }

  .btn-share {
    width: 46px;
    padding: 0;
    flex: 0 0 46px;
  }

  .btn-share svg {
    width: 22px;
    height: 22px;
    stroke: #111;
  }

  /* --- Birlashtirilgan bitta panel dizayni --- */
  .combined-island-panel {
    margin: 25px auto 0;
    width: calc(100% - 40px);
    max-width: 360px;
    background-color: rgba(28, 28, 30, 0.85); 
    border-radius: 32px; 
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Statistika qismi (yuqorida) */
  .profile-stats {
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 18px 15px;
  }

  .stat-item {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .stat-value {
    color: #ffffff;
    font-size: 18px;
    font-weight: 700;
  }

  .stat-label {
    color: #8e8e93;
    font-size: 13px;
    font-weight: 500;
  }

  /* O'rtadagi nozik ajratuvchi chiziq */
  .panel-divider {
    height: 1px;
    background-color: rgba(255, 255, 255, 0.08);
    width: 88%;
    margin: 0 auto;
  }

  /* Navigatsiya qismi (pastda) */
  .profile-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px 14px 12px;
  }

  .nav-item {
    color: #8e8e93;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 20px;
    transition: all 0.3s ease;
  }

  .nav-item.active {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.12);
  }

  .nav-item:hover:not(.active) {
    color: #d1d1d6;
  }
</style>
</head>
<body>

<div class="mobile-container">
  
  <!-- Katta dumaloq burchakli profil kartochkasi -->
  <div class="header-card">
    <div class="profile-content">
      <div class="avatar">
        <div class="status-dot"></div>
      </div>
      <h2 class="profile-name">T2</h2>
      <div class="action-buttons">
        <button class="btn-subscribe">Obuna bo‘lish</button>
        <button class="btn-share" aria-label="Ulashish">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Birlashtirilgan muallaq panel (Statistika + Navigatsiya) -->
  <div class="combined-island-panel">
    
    <!-- Statistika bloki -->
    <div class="profile-stats">
      <div class="stat-item">
        <span class="stat-value">5</span>
        <span class="stat-label">Obunalar</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">44</span>
        <span class="stat-label">Obunachilar</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">3</span>
        <span class="stat-label">Postlar</span>
      </div>
    </div>

    <!-- Ajratuvchi chiziq -->
    <div class="panel-divider"></div>

    <!-- Navigatsiya bloki -->
    <nav class="profile-nav">
      <a href="#" class="nav-item active">Bosh sahifa</a>
      <a href="#" class="nav-item">Postlar</a>
      <a href="#" class="nav-item">Foto</a>
      <a href="#" class="nav-item">Video</a>
    </nav>
    
  </div>

</div>

<!-- Telegram Mini App va telefon Back tugmasi uchun skriptlar -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. Telegram Mini App sozlamalari
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            
            // To'liq ekran rejimi (ixtiyoriy, agar header'ni yo'qotmoqchi bo'lsangiz)
            tg.expand();
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }
            
            // Telegram tepa panelidagi "Orqaga" (Back) tugmasini ko'rsatish
            tg.BackButton.show();
            
            // Telegram Back tugmasi bosilganda
            tg.BackButton.onClick(function() {
                window.location.href = 'index.html';
            });
        }

        // 2. Telefonning jismoniy yoki ishora orqali (swipe) orqaga qaytish hodisasi
        // Brauzer tarixiga soxta sahifa qo'shamiz
        window.history.pushState({page: 'profil'}, "Profil", "");
        
        // Foydalanuvchi telefonda "Orqaga" qilganda ushlab qolib yo'naltirish
        window.addEventListener('popstate', function(event) {
            window.location.href = 'index.html';
        });
    });
</script>

</body>
</html>
