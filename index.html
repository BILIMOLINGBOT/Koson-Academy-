<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tualet Qog'ozi UI Dizayn</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #171E22; /* To'q rangli fon */
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 300px; /* Ikonkalar joylashadigan maydon kengligi */
      height: 700px; /* Ikonkalar joylashadigan maydon balandligi */
    }

    .icon {
      width: 60px; /* Tugma o'lchami */
      height: 60px;
      background-color: #536063; /* Tugma foni */
      border-radius: 12px; /* Burchaklarni yumaloqlash */
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute; /* Mutlaq joylashuv */
    }

    /* Piktogramma tasviri uchun (o'zingiz SVG yoki PNG faylini qo'ying) */
    .icon img {
      width: 35px;
      height: 35px;
    }

    /* Har bir tugmaning aniq zig-zag joylashuvi (absolut) */
    .top-right { top: 20px; right: 20px; }
    .top-mid-right { top: 90px; right: 80px; }
    .top-mid-left { top: 160px; left: 80px; }
    .mid-left { top: 230px; left: 20px; }
    .mid-mid-left { top: 300px; left: 80px; }
    .mid-mid-right { top: 370px; right: 80px; }
    .bot-mid-right { top: 440px; right: 20px; }
    .bot-mid-left { top: 510px; left: 80px; }
    .bot-left { top: 580px; left: 20px; }
    .extreme-bot-left { top: 650px; left: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Piktogrammalarni bu erga qo'shing (tp.svg faylini yarating) -->
    <div class="icon top-right"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon top-mid-right"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon top-mid-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon mid-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon mid-mid-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon mid-mid-right"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon bot-mid-right"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon bot-mid-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon bot-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
    <div class="icon extreme-bot-left"><img src="tp.svg" alt="Tualet Qog'ozi"></div>
  </div>
</body>
</html>
