<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnU 3D Map</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --completed-color: #58cc99; /* Yashil */
      --current-color: #9b51e0;   /* Binafsha */
      --locked-color: #ffffff;    /* Oq/Kulrang */
    }

    body {
      background-color: var(--bg-color);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .map-container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 50px;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Yuqori qismdagi tugma */
    .header-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-badge .chevron {
      opacity: 0.6;
      font-weight: 400;
    }

    /* Yo'lak (Path) */
    .path {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      align-items: center;
    }

    .node {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Zig-Zag joylashuv */
    .node-1 { transform: translateX(40px); }
    .node-2 { transform: translateX(-20px); }
    .node-3 { transform: translateX(-50px); }
    .node-4 { transform: translateX(10px); }
    .node-5 { transform: translateX(50px); z-index: 10; } /* Hozirgi bosqich */
    .node-6 { transform: translateX(-10px); }
    .node-7 { transform: translateX(-60px); }

    .cube-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Kubik ostidagi nur (Glow shadow) */
    .cube-wrapper::after {
      content: '';
      position: absolute;
      bottom: 0px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 50px;
      background: radial-gradient(ellipse, var(--glow-color) 0%, transparent 60%);
      z-index: -1;
      opacity: 0.4;
      filter: blur(10px);
    }

    .cube-base {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: grayscale(100%) brightness(0.9); /* Standart qulflangan holat */
    }

    .cube-icon {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      object-fit: contain;
      z-index: 2;
    }

    .lock-icon {
      width: 28px;
      height: 28px;
      opacity: 0.7;
    }

    /* Tugallangan holat (Yashil) */
    .node.completed { 
      --glow-color: var(--completed-color); 
    }
    .node.completed .cube-wrapper::after {
      opacity: 0.6;
    }
    .node.completed .cube-base {
      filter: sepia(1) hue-rotate(100deg) saturate(2.5) brightness(0.9);
    }

    /* Hozirgi holat (Binafsha) */
    .node.current { 
      --glow-color: var(--current-color); 
    }
    .node.current .cube-wrapper::after {
      opacity: 0.8;
      bottom: -10px;
    }
    .node.current .cube-base {
      filter: sepia(1) hue-rotate(240deg) saturate(3) brightness(1.1);
    }

    /* Qulflangan holat */
    .node.locked { 
      --glow-color: var(--locked-color); 
    }

    /* START yozuvi */
    .start-tooltip {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      background: #4a4a5e;
      color: white;
      padding: 8px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      z-index: 20;
      animation: bounce 2s infinite ease-in-out;
    }

    .start-tooltip::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #4a4a5e transparent transparent transparent;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -6px); }
    }
  </style>
</head>
<body>

  <div class="map-container">
    <!-- Yuqori qism -->
    <div class="header-badge">
      <span class="icon">🎯</span> General English <span class="chevron">⌄</span>
    </div>

    <!-- Xarita yo'lagi -->
    <div class="path">
      
      <!-- Qulflangan bosqichlar -->
      <div class="node locked node-1">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="cube-icon lock-icon" alt="Lock">
        </div>
      </div>

      <div class="node locked node-2">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="cube-icon lock-icon" alt="Lock">
        </div>
      </div>

      <div class="node locked node-3">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="cube-icon lock-icon" alt="Lock">
        </div>
      </div>

      <div class="node locked node-4">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/Hc2IivT0BxnM5Bpc7TXV" class="cube-icon lock-icon" alt="Lock">
        </div>
      </div>

      <!-- Hozirgi (START) bosqich -->
      <div class="node current node-5">
        <div class="start-tooltip">START</div>
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
        </div>
      </div>

      <!-- Tugallangan bosqichlar -->
      <div class="node completed node-6">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" class="cube-icon check-icon" alt="Check">
        </div>
      </div>

      <div class="node completed node-7">
        <div class="cube-wrapper">
          <img src="https://kommodo.ai/i/oatf5U6Dx34b5SAAWyQG" class="cube-base" alt="Cube">
          <img src="https://kommodo.ai/i/F5blHS7GfI2FpCnbrEzu" class="cube-icon check-icon" alt="Check">
        </div>
      </div>

    </div>
  </div>

</body>
</html>
