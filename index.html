<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tualet Qog'ozi UI Dizayn - Yashil SVG</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #171E22; /* To'q rangli fon */
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 300px;
      height: 700px;
    }

    .icon {
      width: 60px;
      height: 60px;
      background-color: #536063;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }

    .icon:hover {
      transform: scale(1.08);
    }

    .icon svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    /* Zig-zag joylashuv */
    .top-right { top: 20px; right: 20px; }
    .top-mid-right { top: 90px; right: 80px; }
    .top-mid-left { top: 160px; left: 80px; }
    .mid-left { top: 230px; left: 20px; }
    .mid-mid-left { top: 300px; left: 80px; }
    .mid-mid-right { top: 370px; right: 80px; }
    .bot-mid-right { top: 440px; right: 20px; }
    .bot-mid-left { top: 510px; left: 80px; }
    .bot-left { top: 580px; left: 20px; }
    .extreme-bot-left { top: 650px; left: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 1-ikonka: To'q yashil -->
    <div class="icon top-right">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Asosiy rolik -->
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#1B5E20" stroke="#0D3B0F" stroke-width="3"/>
        <!-- Ichki doira -->
        <circle cx="50" cy="50" r="20" fill="#4CAF50" stroke="#0D3B0F" stroke-width="3"/>
        <!-- Ichki teshik -->
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#0D3B0F" stroke-width="2"/>
        <!-- Qog'oz varaq -->
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#2E7D32" stroke="#0D3B0F" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Qog'oz cheti -->
        <path d="M25 35 L75 35" stroke="#0D3B0F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
        <!-- Pastki qatlam -->
        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#1B5E20" stroke-width="2" stroke-linecap="round"/>
        <!-- Yorqinlik -->
        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#66BB6A" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 2-ikonka -->
    <div class="icon top-mid-right">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#2E7D32" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="20" fill="#66BB6A" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#4CAF50" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M25 35 L75 35" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"/>
        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 3-ikonka -->
    <div class="icon top-mid-left">

        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#66BB6A" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#388E3C" stroke-width="2" stroke-linecap="round"/>
        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#A5D6A7" stroke-width="2" stroke-linecap="round"/>

        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#43A047" stroke-width="2" stroke-linecap="round"/>
        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#C8E6C9" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 5-ikonka -->
    <div class="icon mid-mid-left">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#4CAF50" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="20" fill="#C8E6C9" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#A5D6A7" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M25 35 L75 35" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 7-ikonka -->
    <div class="icon bot-mid-right">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#81C784" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="20" fill="#F1F8E9" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#E8F5E9" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M25 35 L75 35" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#81C784" stroke-width="2" stroke-linecap="round"/>
        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 8-ikonka -->
    <div class="icon bot-mid-left">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#A5D6A7" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="20" fill="#FFFFFF" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#F1F8E9" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M32 22 Q38 18 44 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <!-- 9-ikonka -->
    <div class="icon bot-left">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="15" width="70" height="70" rx="18" fill="#C8E6C9" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="20" fill="#FFFFFF" stroke="#1B5E20" stroke-width="3"/>
        <circle cx="50" cy="50" r="9" fill="#171E22" stroke="#1B5E20" stroke-width="2"/>
        <path d="M30 25 Q40 18 50 25 Q60 32 70 25" fill="#F1F8E9" stroke="#1B5E20" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M28 40 Q40 36 50 40 Q60 44 72 40" fill="none" stroke="#C8E6C9" stroke-width="2" stroke-linecap="round"/>

    <!-- 10-ikonka -->

      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

</html>
