
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Uy - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* iOS Design System Fonts & Resets */
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column}
        
        /* Yuqori qism: iPhone notch (safe-area) bilan ishlashi uchun padding o'zgartirildi */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(70px + env(safe-area-inset-top)) 20px 15px 20px; 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feed{width:100%;display:flex;flex-direction:column;padding:0;gap:0;}
        
        .post-item{width:100%;padding:16px 20px;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;transition:background .15s ease;background:transparent;border-radius:0;border:none;border-bottom:1px solid rgba(255,255,255,0.05)}
        .post-item:active{background:rgba(255,255,255,0.03)}
        @keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        
        .post-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer}
        .post-avatar{object-fit:cover;background:#1c1c1e}
        .post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
        .post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .post-user{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
        .post-user:active{opacity:.7}
        .post-time{font-size:13px;color:#8e8e93;margin-top:1px}
        .post-text{font-size:15px;line-height:1.45;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        
        .post-image, .post-video, .detail-image, .detail-video{
            width:100%;
            border-radius:16px;
            margin-bottom:12px;
            display:block;
            max-height:80vh;
            object-fit:cover;
            border:0.5px solid rgba(255,255,255,0.1);
            background:#000;
        }

        .post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:12px 6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:12px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px;text-align:left}
        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        @keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
        .act-btn.saved{color:#fff}
        .act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        
        .empty{text-align:center;color:#5a5a5e;padding:60px 20px;font-size:15px;line-height:1.6}

        /* "ISLAND" PASTKI NAVIGATSIYA */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}

        /* ============ DETAIL (POST) ============ */
        .detail-overlay, .comment-detail-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .3s cubic-bezier(.34,1.2,.64,1) both}
        .detail-overlay.show, .comment-detail-overlay.show{display:flex}
        @keyframes detailIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
        
        .detail-header, .comment-detail-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:420px;width:100%;margin:0 auto;position:sticky;top:0;z-index:10}
        .detail-title, .comment-detail-title{font-size:17px;font-weight:600;text-align:center;}
        
        .detail-scroll, .comment-detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:420px;width:100%;margin:0 auto}
        .detail-post{padding:16px;border-bottom:10px solid #0a0a0a}
        .detail-post-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
        .detail-avatar,.detail-avatar-initial{width:46px;height:46px;border-radius:50%;flex-shrink:0}
        .detail-avatar{object-fit:cover;background:#1c1c1e}
        .detail-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
        .detail-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .detail-user{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .detail-time{font-size:13px;color:#8e8e93;margin-top:2px}
        .detail-text{font-size:16px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
        .detail-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:8px}
        
        .detail-comments-title{padding:20px 16px 12px;font-size:14px;font-weight:600;color:#fff;letter-spacing:0.3px}
        .detail-comments-list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
        .detail-empty{text-align:center;color:#5a5a5e;font-size:15px;padding:40px 0}

        /* ===== IZOH THREAD (UZLUKSIZ CHIZIQ) ===== */
        .comment-thread{display:flex;flex-direction:column;animation:postIn .3s ease both;position:relative}
        .comment-row{display:flex;gap:10px;cursor:pointer;padding:4px 0;transition:opacity .15s ease;align-items:stretch}
        .comment-row:active{opacity:.85}
        .comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
        .comment-avatar,.comment-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;z-index:2;background:#000;border:2px solid #000}
        .comment-avatar{object-fit:cover}
        .comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
        .thread-line-down{width:2px;background:#3a3a3c;flex:1;margin-top:-2px;min-height:20px;border-radius:0;align-self:center;z-index:1}

        .comment-content{flex:1;min-width:0;padding-bottom:10px;padding-top:2px}
        .comment-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
        .comment-user{font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .comment-user:active{opacity:.7}
        .comment-time{font-size:12px;color:#8e8e93}
        .comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
        
        /* 5 TA IKONKA UCHUN */
        .comment-actions{display:flex;gap:2px;align-items:center;justify-content:space-between;padding-top:2px;max-width:100%;width:100%}
        .comment-act{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;padding:12px 6px;display:flex;align-items:center;gap:5px;flex:1;justify-content:center;border-radius:10px;transition:transform .15s,color .2s,background .15s}
        .comment-act:active{transform:scale(.9);background:rgba(255,255,255,.06)}
        .comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
        .comment-act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:10px;text-align:left}
        .comment-act.liked{color:#ff2d55}
        .comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .comment-act.saved{color:#fff}
        .comment-act.saved svg{fill:#fff;stroke:#fff}

        /* ===== JAVOBLAR (NESTED) ===== */
        .comment-replies{display:flex;flex-direction:column;position:relative;margin-left:0;padding-left:0;padding-bottom:4px}
        .thread-nested{position:relative}
        .comment-more-btn{background:none;border:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:4px 0 8px 52px;margin-top:0;font-family:inherit;text-align:left}
        .comment-more-btn:active{opacity:.7}

        /* ===== REPLY MODE BAR (NEYTRAL) ===== */
        .reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#fff;font-weight:600;max-width:420px;width:100%;margin:0 auto}
        .reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .reply-mode-bar button{background:none;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.1);font-family:inherit}
        .reply-mode-bar button:active{background:rgba(255,255,255,.2)}

        .detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:#000;max-width:420px;width:100%;margin:0 auto}
        .detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e;transition:border-color .2s}
        .detail-island:focus-within{border-color:#4a4a4e}
        .detail-island.reply-mode{border-color:#fff;box-shadow:none}
        .detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
        .detail-input::placeholder{color:#5a5a5e}
        .detail-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,opacity .2s}
        .detail-send:active{transform:scale(.9)}
        .detail-send:disabled{opacity:.4;cursor:not-allowed}
        .detail-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

        /* ===== COMMENT DETAIL VIEW ===== */
        .comment-detail-main{padding:16px;border-bottom:1px solid rgba(255,255,255,0.05);background:transparent}
        .comment-detail-replies{padding:0 16px;display:flex;flex-direction:column;gap:12px}
        .comment-highlight{animation:commentHi 1.3s ease}
        @keyframes commentHi{0%,100%{background:transparent}20%,60%{background:rgba(255,255,255,.08)}}

        .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.1);max-width:80%;text-align:center}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>

<script>
/* ================= TELEGRAM FULLSCREEN ================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) {
    try {
        tg.ready(); 
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen(); // Tepa qismni to'liq yo'qotadi va telefon barini yopadi
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    } catch {}
}

/* ================= BILDIRISHNOMA TUGMASI ================= */
document.getElementById('notifBtn').addEventListener('click', () => {
    window.location.href = 'notification.html';
});


/* ================= KONSTANTALAR ================= */
const MAX_VISIBLE_DEPTH = 2;
const REPLIES_KEY = 'luz_my_replies_v1';


/* ================= DB ================= */
const DB = {
    _K: 'luz_users', _S: 'luz_current_user',
    getCurrentUser(){
        const id = localStorage.getItem(this._S); if (!id) return null;
        try { const users = JSON.parse(localStorage.getItem(this._K)) || []; return users.find(u => u.userId === id) || null; } catch { return null; }
    }
};

/* ================= POST STORE ================= */
const POST_STORE_KEY = 'tg_feed_posts_v1';
const PostStore = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try { const raw = localStorage.getItem(POST_STORE_KEY); this._cache = raw ? JSON.parse(raw) : []; if (!Array.isArray(this._cache)) this._cache = []; } catch { this._cache = []; }
        return this._cache;
    },
    _save(){ try { localStorage.setItem(POST_STORE_KEY, JSON.stringify(this._cache || [])); return true; } catch { showToast('Saqlashda xatolik'); return false; } },
    all(){ return this._load().slice(); },
    get(id){ return this._load().find(p => p.id === id) || null; },
    update(id, patch){
        const list = this._load(); const i = list.findIndex(p => p.id === id); if (i < 0) return null;
        list[i] = Object.assign({}, list[i], patch); this._cache = list; this._save(); return list[i];
    }
};

/* ================= VIEW TRACKER ================= */
const VIEW_LOG_KEY = 'luz_view_log_v1';
const ViewTracker = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try { const raw = localStorage.getItem(VIEW_LOG_KEY); this._cache = raw ? JSON.parse(raw) : {}; if (!this._cache || typeof this._cache !== 'object') this._cache = {}; } catch { this._cache = {}; }
        return this._cache;
    },
    _key(uid, pid){ return String(uid) + '::' + String(pid); },
    hasViewed(uid, pid){ if (!uid || !pid) return false; return this._load()[this._key(uid, pid)] === true; },
    record(uid, pid){
        if (!uid || !pid) return false; const log = this._load(); const k = this._key(uid, pid);
        if (log[k] === true) return false; log[k] = true; this._cache = log;
        try { localStorage.setItem(VIEW_LOG_KEY, JSON.stringify(log)); } catch {} return true;
    }
};

/* ================= SESSION & AVATAR ================= */
const currentUser = DB.getCurrentUser();
if (!currentUser) window.location.href = 'authorization.html';

const navAvatarSlot = document.getElementById('navAvatarSlot');
const cuName = [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi';
const cuInit = cuName.trim().charAt(0).toUpperCase() || 'F';
if (currentUser.photo_url) navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
else navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;

/* ================= HELPERS ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';
    const diffSec = Math.floor((new Date() - d) / 1000);
    if (diffSec < 5) return 'hozir'; if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
}
function goToProfile(uid){
    if (!uid) return;
    if (String(uid) === String(currentUser?.userId)) window.location.href = 'profil.html';
    else window.location.href = `profil.html?id=${encodeURIComponent(uid)}`;
}
let toastTimer;
function showToast(msg){
    const t = document.getElementById('toast'); if (!t) return;
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ================= MY REPLIES & HELPERS ================= */
let myReplies = [];
function loadMyReplies(){ try { const raw = localStorage.getItem(REPLIES_KEY); myReplies = raw ? JSON.parse(raw) : []; } catch { myReplies = []; } }
function saveMyReplies(){ try { localStorage.setItem(REPLIES_KEY, JSON.stringify(myReplies)); } catch {} }
function pushMyReply(entry){ myReplies.unshift(entry); saveMyReplies(); }

function findComment(comments, id){
    for (const c of (comments || [])) {
        if (c.id === id) return { comment: c, parent: null, isReply: false, root: c };
        const found = findInReplies(c, id, c); if (found) return found;
    } return null;
}
function findInReplies(parent, id, root){
    for (const r of (parent.replies || [])) {
        if (r.id === id) return { comment: r, parent, isReply: true, root };
        const found = findInReplies(r, id, root); if (found) return found;
    } return null;
}
function makeCommentObj(text, parentId){
    return {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        userId: currentUser?.userId || '', user: cuName, avatar: currentUser.photo_url || null,
        text, createdAt: new Date().toISOString(), likes: 0, liked: false, replies: [], parentId: parentId || null
    };
}
function addCommentToPost(postId, newComment, replyToId){
    const post = PostStore.get(postId); if (!post) return null;
    if (!post.comments) post.comments = [];
    if (!replyToId) {
        newComment.parentId = null; post.comments.push(newComment);
        PostStore.update(postId, { comments: post.comments }); return { post, comment: newComment, parent: null };
    }
    const found = findComment(post.comments, replyToId); if (!found) return null;
    newComment.parentId = replyToId; if (!found.comment.replies) found.comment.replies = [];
    found.comment.replies.push(newComment); PostStore.update(postId, { comments: post.comments });
    return { post, comment: newComment, parent: found.comment };
}
function countRepliesDeep(c){
    let n = (c.replies || []).length; (c.replies || []).forEach(r => { n += countRepliesDeep(r); }); return n;
}

/* ================= POST RENDER ================= */
const savedPosts = new Set();
function countComments(p){
    let n = (p.comments || []).length; const walk = (arr) => arr.forEach(c => { n += (c.replies || []).length; if (c.replies) walk(c.replies); }); walk(p.comments || []); return n;
}
function handleShare(entity){
    const link = location.origin + location.pathname + '?post=' + encodeURIComponent(entity.id);
    if (navigator.share) navigator.share({ title: 'Post', url: link }).catch(() => {});
    else { try { navigator.clipboard?.writeText(link); } catch {} showToast('Havola nusxalandi'); }
}

function buildPostActions(p){
    const actions = document.createElement('div'); actions.className = 'post-actions';
    const createBtn = (icon, count, cls, clk) => {
        const b = document.createElement('button'); b.className = 'act-btn ' + cls;
        b.innerHTML = `${icon}<span class="act-count">${count!==null?count:''}</span>`;
        if (clk) b.addEventListener('click', clk); return b;
    };
    
    const likeBtn = createBtn(ICONS.like, p.likes||0, p.liked?'liked':'', (e)=>{
        e.stopPropagation(); const fresh = PostStore.get(p.id) || p; const liked = !fresh.liked;
        const likes = Math.max(0, (fresh.likes || 0) + (liked ? 1 : -1));
        PostStore.update(p.id, { liked, likes }); p.liked = liked; p.likes = likes;
        likeBtn.classList.toggle('liked', liked); likeBtn.querySelector('.act-count').textContent = likes;
    });
    const commBtn = createBtn(ICONS.comment, countComments(p), '', (e)=>{ e.stopPropagation(); openPostDetail(p); });
    const viewBtn = createBtn(ICONS.view, p.views||0, '', (e)=>{ e.stopPropagation(); }); viewBtn.style.cursor='default';
    const saveBtn = createBtn(ICONS.bookmark, null, savedPosts.has(p.id)?'saved':'', (e)=>{
        e.stopPropagation();
        if (savedPosts.has(p.id)) { savedPosts.delete(p.id); saveBtn.classList.remove('saved'); showToast("Olib tashlandi"); }
        else { savedPosts.add(p.id); saveBtn.classList.add('saved'); showToast("Saqlandi"); }
    });
    const shareBtn = createBtn(ICONS.share, null, '', (e)=>{ e.stopPropagation(); handleShare(p); });

    actions.append(likeBtn, commBtn, viewBtn, saveBtn, shareBtn); return actions;
}

function buildPostItem(p){
    const item = document.createElement('div'); item.className = 'post-item'; item.dataset.id = p.id;
    const postInit = (p.user || 'F').trim().charAt(0).toUpperCase();
    const av = p.avatar ? `<img class="post-avatar" src="${p.avatar}" alt="">` : `<div class="post-avatar-initial">${postInit}</div>`;
    
    let media = '';
    if (p.type === 'image' && p.image) media = `<img class="post-image" src="${p.image}" alt="" loading="lazy">`;
    else if (p.type === 'video' && p.image) media = `<video class="post-video" src="${p.image}" controls playsinline></video>`;

    item.innerHTML = `
        <div class="post-head">
            ${av}
            <div class="post-head-info"><div class="post-user">${escapeHtml(p.user)}</div><div class="post-time">${escapeHtml(formatExactTime(p.createdAt || p.time))}</div></div>
        </div>
        ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ''}
        ${media}
    `;

    item.querySelector('.post-avatar').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(p.userId); });
    item.querySelector('.post-user').addEventListener('click', (e) => { e.stopPropagation(); goToProfile(p.userId); });
    
    item.appendChild(buildPostActions(p));
    item.addEventListener('click', (e) => { if (e.target.closest('.act-btn') || e.target.tagName === 'VIDEO') return; openPostDetail(p); });

    const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
            if (en.isIntersecting && !ViewTracker.hasViewed(currentUser?.userId, p.id)) {
                io.disconnect();
                if (ViewTracker.record(currentUser?.userId, p.id)) {
                    const fresh = PostStore.get(p.id);
                    if (fresh) {
                        p.views = (fresh.views || 0) + 1; PostStore.update(p.id, { views: p.views });
                        item.querySelectorAll('.act-btn')[2].querySelector('.act-count').textContent = p.views;
                    }
                }
            }
        });
    }, { threshold: 0.5 }); io.observe(item);

    return item;
}

function renderFeed(){
    const feed = document.getElementById('feed'); const posts = PostStore.all(); feed.innerHTML = '';
    if (posts.length === 0) { feed.innerHTML = '<div class="empty">Hali post yo\'q.<br>Profilga o\'tib birinchi postni yarating.</div>'; return; }
    posts.forEach(p => feed.appendChild(buildPostItem(p)));
}
/* ================= POST DETAIL VIEW ================= */
const detailOverlay = document.getElementById('detailOverlay'), detailInput = document.getElementById('detailInput'), detailSend = document.getElementById('detailSend');
let detailPost = null, replyTargetId = null;

function updateDetailReplyModeUI(){
    const bar = document.getElementById('replyModeBar'), island = document.getElementById('detailIsland');
    if (!replyTargetId || !detailPost) { bar.style.display = 'none'; island.classList.remove('reply-mode'); return; }
    const found = findComment(detailPost.comments || [], replyTargetId);
    if (found) { document.getElementById('replyModeText').textContent = `↩ ${found.comment.user} ga javob`; bar.style.display = 'flex'; island.classList.add('reply-mode'); }
    else { bar.style.display = 'none'; island.classList.remove('reply-mode'); }
}
document.getElementById('replyModeCancel').addEventListener('click', () => { replyTargetId = null; detailInput.value = ''; updateDetailReplyModeUI(); });

function buildDetailComment(c, depth = 0){
    const thread = document.createElement('div'); thread.className = 'comment-thread' + (depth > 0 ? ' thread-nested' : ''); thread.dataset.cid = c.id;
    const init = (c.user || 'F').trim().charAt(0).toUpperCase();
    const av = c.avatar ? `<img class="comment-avatar" src="${c.avatar}">` : `<div class="comment-avatar-initial">${init}</div>`;
    const hasReplies = c.replies && c.replies.length > 0;

    const row = document.createElement('div'); row.className = 'comment-row';
    row.innerHTML = `
        <div class="comment-avatar-col">
            ${av}
            ${hasReplies ? '<div class="thread-line-down"></div>' : ''}
        </div>
        <div class="comment-content">
            <div class="comment-head"><span class="comment-user" data-uid="${c.userId||''}">${escapeHtml(c.user)}</span><span class="comment-time">${escapeHtml(formatExactTime(c.createdAt || c.time))}</span></div>
            <div class="comment-text">${escapeHtml(c.text || '')}</div>
        </div>
    `;
    
    // YAXSHILANGAN IZOH HARAKATLARI (5 ta Ikonka)
    const actions = document.createElement('div'); actions.className = 'comment-actions';
    const likeBtn = document.createElement('button'); likeBtn.className = 'comment-act' + (c.liked?' liked':''); likeBtn.innerHTML = `${ICONS.like}<span class="comment-act-count">${c.likes||0}</span>`;
    likeBtn.addEventListener('click', (e) => { e.stopPropagation(); c.liked = !c.liked; c.likes = Math.max(0, (c.likes||0) + (c.liked?1:-1)); PostStore.update(detailPost.id, {comments:detailPost.comments}); refreshDetailFromStore(); });
    
    const commBtn = document.createElement('button'); commBtn.className = 'comment-act'; commBtn.innerHTML = `${ICONS.comment}<span class="comment-act-count">${(c.replies||[]).length||''}</span>`;
    commBtn.addEventListener('click', (e) => { e.stopPropagation(); replyTargetId = c.id; detailInput.focus(); updateDetailReplyModeUI(); });

    const viewBtn = document.createElement('button'); viewBtn.className = 'comment-act'; viewBtn.innerHTML = `${ICONS.view}<span class="comment-act-count"></span>`; viewBtn.style.cursor = 'default';
    viewBtn.addEventListener('click', (e) => e.stopPropagation());

    const saveBtn = document.createElement('button'); saveBtn.className = 'comment-act'; saveBtn.innerHTML = `${ICONS.bookmark}`;
    saveBtn.addEventListener('click', (e) => { e.stopPropagation(); saveBtn.classList.toggle('saved'); showToast(saveBtn.classList.contains('saved')?'Saqlandi':'Olib tashlandi'); });

    const shareBtn = document.createElement('button'); shareBtn.className = 'comment-act'; shareBtn.innerHTML = `${ICONS.share}`;
    shareBtn.addEventListener('click', (e) => { e.stopPropagation(); handleShare(c); });

    actions.append(likeBtn, commBtn, viewBtn, saveBtn, shareBtn);
    row.querySelector('.comment-content').appendChild(actions);

    row.querySelectorAll('[data-uid]').forEach(el => { el.addEventListener('click', (e) => { e.stopPropagation(); goToProfile(el.getAttribute('data-uid')); }); });
    row.addEventListener('click', (e) => { if (!e.target.closest('.comment-act')) openCommentDetail(c.id); });
    thread.appendChild(row);

    if (hasReplies) {
        const repBox = document.createElement('div'); repBox.className = 'comment-replies';
        c.replies.forEach(r => repBox.appendChild(buildDetailComment(r, depth + 1)));
        thread.appendChild(repBox);
    }
    return thread;
}
function refreshDetailFromStore(){
    if (!detailPost) return;
    const fresh = PostStore.get(detailPost.id); if (fresh) detailPost = fresh; renderDetailPost();
    const clist = document.getElementById('detailCommentsList'); clist.innerHTML = '';
    document.getElementById('detailCommTitle').textContent = (detailPost.comments||[]).length ? `Izohlar (${countComments(detailPost)})` : 'Izohlar';
    (detailPost.comments||[]).forEach(c => clist.appendChild(buildDetailComment(c, 0)));
}
function renderDetailPost(){
    if (!detailPost) return; const p = detailPost, postInit = (p.user||'F').trim().charAt(0).toUpperCase();
    const av = p.avatar ? `<img class="detail-avatar" src="${p.avatar}" data-uid="${p.userId||''}">` : `<div class="detail-avatar-initial" data-uid="${p.userId||''}">${postInit}</div>`;
    let media = '';
    if (p.type === 'image' && p.image) media = `<img class="detail-image" src="${p.image}">`;
    else if (p.type === 'video' && p.image) media = `<video class="detail-video" src="${p.image}" controls playsinline></video>`;

    document.getElementById('detailPostBox').innerHTML = `
        <div class="detail-post">
            <div class="detail-post-head">${av}<div class="detail-info"><div class="detail-user" data-uid="${p.userId||''}">${escapeHtml(p.user)}</div><div class="detail-time">${escapeHtml(formatExactTime(p.createdAt))}</div></div></div>
            ${p.text ? `<div class="detail-text">${escapeHtml(p.text)}</div>` : ''}
            ${media}
            <div class="detail-actions" id="detailActionsBar"></div>
        </div>
    `;
    
    document.getElementById('detailPostBox').querySelectorAll('[data-uid]').forEach(el => { el.style.cursor='pointer'; el.addEventListener('click', (e)=>{ e.stopPropagation(); goToProfile(el.getAttribute('data-uid')); }); });
    document.getElementById('detailActionsBar').appendChild(buildPostActions(p).cloneNode(true));
}

function openPostDetail(p){
    detailPost = PostStore.get(p.id) || p; if (!detailPost.comments) detailPost.comments = [];
    replyTargetId = null; refreshDetailFromStore(); updateDetailReplyModeUI();
    detailOverlay.classList.add('show'); document.getElementById('detailScroll').scrollTop = 0;
    if (tg?.BackButton) { try { tg.BackButton.onClick(closePostDetail); tg.BackButton.show(); } catch {} }
}
function closePostDetail(){
    detailOverlay.classList.remove('show'); detailPost = null; replyTargetId = null;
    renderFeed();
    if (tg?.BackButton) { try { tg.BackButton.onClick(goHome); } catch {} }
}

detailInput.addEventListener('input', () => {
    detailInput.style.height = 'auto'; detailInput.style.height = Math.min(detailInput.scrollHeight, 90) + 'px';
    detailSend.disabled = detailInput.value.trim().length === 0;
});
detailSend.addEventListener('click', () => {
    const raw = detailInput.value.trim(); if (!raw || !detailPost) return;
    let cleanText = raw; if (replyTargetId) cleanText = raw.replace(/^@\S+\s*/, '').trim();
    if (!cleanText) { showToast('Javob matni bo\'sh'); return; }

    const newC = makeCommentObj(cleanText, replyTargetId);
    if (addCommentToPost(detailPost.id, newC, replyTargetId)) {
        pushMyReply({ id: newC.id, postId: detailPost.id, userId: newC.userId, user: newC.user, avatar: newC.avatar, text: newC.text, createdAt: newC.createdAt, postText: detailPost.text });
        replyTargetId = null; detailInput.value = ''; detailSend.disabled = true; refreshDetailFromStore();
    }
});

/* ================= COMMENT DETAIL ================= */
const commentDetailOverlay = document.getElementById('commentDetailOverlay');
let activeCommentId = null;
function openCommentDetail(cid){
    if (!detailPost) return; const fresh = PostStore.get(detailPost.id); if (!fresh) return; detailPost = fresh;
    const found = findComment(detailPost.comments || [], cid); if (!found) return;
    activeCommentId = cid;
    document.getElementById('commentDetailMain').innerHTML = '';
    document.getElementById('commentDetailMain').appendChild(buildDetailComment(found.comment, 0).querySelector('.comment-row').cloneNode(true));
    const reps = document.getElementById('commentDetailReplies'); reps.innerHTML = '';
    (found.comment.replies || []).forEach(r => reps.appendChild(buildDetailComment(r, 0).querySelector('.comment-row').cloneNode(true)));
    
    commentDetailOverlay.classList.add('show'); document.getElementById('commentDetailScroll').scrollTop = 0; updateCdReplyModeUI();
    if (tg?.BackButton) { try { tg.BackButton.onClick(closeCommentDetail); } catch {} }
}
function closeCommentDetail(){
    commentDetailOverlay.classList.remove('show'); activeCommentId = null;
    if (tg?.BackButton) { try { if (detailOverlay.classList.contains('show')) tg.BackButton.onClick(closePostDetail); else tg.BackButton.onClick(goHome); } catch {} }
}

const cdReplyModeCancel = document.getElementById('cdReplyModeCancel'), commentDetailInput = document.getElementById('commentDetailInput'), commentDetailSend = document.getElementById('commentDetailSend');
function updateCdReplyModeUI(){
    if (!detailPost) { document.getElementById('cdReplyModeBar').style.display = 'none'; document.getElementById('commentDetailIsland').classList.remove('reply-mode'); return; }
    const found = activeCommentId ? findComment(detailPost.comments || [], activeCommentId) : null;
    if (found) { document.getElementById('cdReplyModeText').textContent = `↩ ${found.comment.user} ga javob`; document.getElementById('cdReplyModeBar').style.display = 'flex'; document.getElementById('commentDetailIsland').classList.add('reply-mode'); }
    else { document.getElementById('cdReplyModeBar').style.display = 'none'; document.getElementById('commentDetailIsland').classList.remove('reply-mode'); }
}
cdReplyModeCancel.addEventListener('click', closeCommentDetail);
commentDetailInput.addEventListener('input', () => {
    commentDetailInput.style.height = 'auto'; commentDetailInput.style.height = Math.min(commentDetailInput.scrollHeight, 90) + 'px';
    commentDetailSend.disabled = commentDetailInput.value.trim().length === 0;
});
commentDetailSend.addEventListener('click', () => {
    const txt = commentDetailInput.value.trim(); if (!txt || !detailPost || !activeCommentId) return;
    const newReply = makeCommentObj(txt, activeCommentId);
    if (addCommentToPost(detailPost.id, newReply, activeCommentId)) {
        pushMyReply({ id: newReply.id, postId: detailPost.id, userId: newReply.userId, user: newReply.user, avatar: newReply.avatar, text: newReply.text, createdAt: newReply.createdAt, postText: detailPost.text });
        commentDetailInput.value = ''; commentDetailSend.disabled = true; refreshDetailFromStore();
        
        const found = findComment(detailPost.comments || [], activeCommentId);
        if (found) {
            document.getElementById('commentDetailMain').innerHTML = ''; document.getElementById('commentDetailMain').appendChild(buildDetailComment(found.comment, 0).querySelector('.comment-row').cloneNode(true));
            const reps = document.getElementById('commentDetailReplies'); reps.innerHTML = '';
            (found.comment.replies || []).forEach(r => reps.appendChild(buildDetailComment(r, 0).querySelector('.comment-row').cloneNode(true)));
        }
        updateCdReplyModeUI(); showToast('Javob qo\'shildi');
    }
});

/* ================= INIT & NAVIGATION ================= */
loadMyReplies(); renderFeed();
function goHome(){ window.location.href = 'index.html'; }

window.history.pushState({ page: 'uy' }, 'Uy', '');
window.addEventListener('popstate', () => {
    if (commentDetailOverlay?.classList.contains('show')) { closeCommentDetail(); window.history.pushState({ page: 'uy' }, 'Uy', ''); }
    else if (detailOverlay?.classList.contains('show')) { closePostDetail(); window.history.pushState({ page: 'uy' }, 'Uy', ''); }
    else goHome();
});
</script>
