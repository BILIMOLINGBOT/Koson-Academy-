<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Feed - Index</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    /* iOS tizim shrifti */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    display: flex;
    justify-content: center;
    color: #ffffff;
  }

  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #000000;
    min-height: 100vh;
  }

  /* iOS uslubidagi loyqa (blur) qilingan Header */
  .app-header {
    background-color: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 0.5px solid #333333;
  }

  .logo-m {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  .header-icons {
    display: flex;
    gap: 22px;
    align-items: center;
  }

  .header-icons i {
    font-size: 22px;
    color: #ffffff;
    cursor: pointer;
  }

  .video-card {
    background-color: #000000;
    margin-bottom: 16px; 
    border-bottom: 0.5px solid #222222;
    padding-bottom: 12px;
  }

  .thumbnail-link {
    display: block;
    position: relative;
    text-decoration: none;
  }

  .thumbnail-link img {
    width: 100%;
    height: 240px;
    display: block;
    object-fit: cover;
  }

  .duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background-color: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
  }

  .video-info {
    display: flex;
    padding: 12px 16px 0 16px;
    align-items: flex-start;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 14px;
  }

  .video-details {
    flex-grow: 1;
    padding-right: 12px;
  }

  .video-title {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 4px;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-meta {
    font-size: 13px;
    color: #98989d; /* iOS ikkilamchi matn rangi */
    line-height: 1.4;
  }

  .more-options {
    flex-shrink: 0;
    color: #ffffff;
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="app-header">
    <div class="logo-m">Dono</div>
    <div class="header-icons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-regular fa-bell"></i>
    </div>
  </header>

  <div class="video-card">
    <a href="view.html" class="thumbnail-link">
      <img src="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80" alt="Truck thumbnail">
      <span class="duration">14:44</span>
    </a>
    <div class="video-info">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="avatar">
      <div class="video-details">
        <h3 class="video-title">Apm Update — Loyiha haqida to'liq ma'lumot</h3>
        <p class="video-meta">TRIPLE R · 176 marta · 12 soat oldin</p>
      </div>
      <div class="more-options">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </div>
  </div>

  <div class="video-card">
    <a href="view.html" class="thumbnail-link">
      <img src="https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=800&q=80" alt="Brain thumbnail">
      <span class="duration">5:33</span>
    </a>
    <div class="video-info">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/BBC_News_2019.svg/100px-BBC_News_2019.svg.png" alt="BBC News Avatar" class="avatar" style="background: #b00; padding: 2px;">
      <div class="video-details">
        <h3 class="video-title">Is being bilingual good for your brain? | BBC Ideas</h3>
        <p class="video-meta">BBC News · 1,3 mln marta · 1 yil oldin</p>
      </div>
      <div class="more-options">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
    </div>
  </div>

</div>

</body>
</html>
