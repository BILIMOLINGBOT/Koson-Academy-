<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katta tugmalar · Egri chiziqli joylashuv</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a2226;
      font-family: sans-serif;
    }

    .container {
      position: relative;
      width: 500px;
      height: 1000px;
    }

    .icon-box {
      width: 110px;
      height: 110px;
      background-color: #4b585a; /* default gray (fallback) */
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
      font-size: 2.8rem; /* icon size */
      color: #f0f0f0;
      line-height: 1;
    }

    /* individual variations */
    .icon-box.green-card {
      background-color: #2e7d32; /* rich green */
      color: #ffffff;
    }

    .icon-box.pink-card {
      background-color: #e91e63; /* vivid pink */
      color: #ffffff;
      /* no icon, still flex centered but empty */
    }

    .icon-box.gray-lock {
      background-color: #5d6d70; /* slightly lighter gray for lock cards */
      color: #e0e0e0;
    }

    .icon-box:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
    }

    .icon-box:active {
      transform: scale(0.95);
    }

    /* Katta o'lchamlarga mos koordinatalar (desktop default) */
    .pos1  { top: 0px;    right: 0px; }
    .pos2  { top: 110px;  right: 110px; }
    .pos3  { top: 220px;  right: 220px; }
    .pos4  { top: 330px;  right: 330px; }
    .pos5  { top: 440px;  right: 220px; }
    .pos6  { top: 550px;  right: 110px; }
    .pos7  { top: 660px;  right: 0px; }
    .pos8  { top: 770px;  right: 110px; }
    .pos9  { top: 880px;  right: 220px; }
    .pos10 { top: 990px;  right: 330px; }

    /* Planshet uchun */
    @media (max-width: 768px) {
      .container {
        width: 400px;
        height: 850px;
      }
      .icon-box {
        width: 90px;
        height: 90px;
        font-size: 2.2rem;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 90px;   right: 90px; }
      .pos3  { top: 180px;  right: 180px; }
      .pos4  { top: 270px;  right: 270px; }
      .pos5  { top: 360px;  right: 180px; }
      .pos6  { top: 450px;  right: 90px; }
      .pos7  { top: 540px;  right: 0px; }
      .pos8  { top: 630px;  right: 90px; }
      .pos9  { top: 720px;  right: 180px; }
      .pos10 { top: 810px;  right: 270px; }
    }

    /* Mobil uchun */
    @media (max-width: 480px) {
      .container {
        width: 320px;
        height: 700px;
      }
      .icon-box {
        width: 75px;
        height: 75px;
        font-size: 1.8rem;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 75px;   right: 75px; }
      .pos3  { top: 150px;  right: 150px; }
      .pos4  { top: 225px;  right: 225px; }
      .pos5  { top: 300px;  right: 150px; }
      .pos6  { top: 375px;  right: 75px; }
      .pos7  { top: 450px;  right: 0px; }
      .pos8  { top: 525px;  right: 75px; }
      .pos9  { top: 600px;  right: 150px; }
      .pos10 { top: 675px;  right: 225px; }
    }

    /* fallback for icons using unicode or text */
    .check-icon::before {
      content: "✓";
      font-weight: bold;
    }
    .lock-icon::before {
      content: "🔒";
      font-size: 0.85em;
    }
    .no-icon::before {
      content: ""; /* empty */
    }
  </style>
</head>
<body>

  <div class="container" id="iconContainer"></div>

  <script>
    (function() {
      const container = document.getElementById('iconContainer');
      
      // Define exactly 10 items with types:
      // 1: green card + check icon
      // 2: pink card + NO icon
      // 3-10: gray cards + lock icon
      const cardDefinitions = [
        { type: 'green-check', label: 'Yashil karta, tasdiq' },
        { type: 'pink-noicon', label: 'Pushti karta, ikonka yo\'q' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' }
      ];

      // positions array (pos1..pos10)
      const positionClasses = ['pos1', 'pos2', 'pos3', 'pos4', 'pos5', 'pos6', 'pos7', 'pos8', 'pos9', 'pos10'];

      cardDefinitions.forEach((def, index) => {
        const div = document.createElement('div');
        // base class + position class
        div.className = `icon-box ${positionClasses[index]}`;
        
        // apply type-specific classes and icon content
        if (def.type === 'green-check') {
          div.classList.add('green-card', 'check-icon');
          div.setAttribute('aria-label', `Tugma ${index + 1}: yashil, tasdiq belgisi`);
        } else if (def.type === 'pink-noicon') {
          div.classList.add('pink-card', 'no-icon');
          div.setAttribute('aria-label', `Tugma ${index + 1}: pushti, ikonka yo'q`);
        } else if (def.type === 'gray-lock') {
          div.classList.add('gray-lock', 'lock-icon');
          div.setAttribute('aria-label', `Tugma ${index + 1}: kulrang, qulf belgisi`);
        }
        
        // Common attributes
        div.setAttribute('role', 'button');
        div.setAttribute('tabindex', '0');
        div.setAttribute('title', def.label);
        
        // Keyboard support
        div.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            div.click();
          }
        });
        
        // Click action (console log)
        div.addEventListener('click', () => {
          console.log(`Tugma ${index + 1} (${def.type}) bosildi`);
          // Additional action can be placed here
        });
        
        container.appendChild(div);
      });

      // Optional: ensure exactly 10 elements rendered (debug)
      console.log('Rendered cards:', container.children.length);
    })();
  </script>

  <!-- 
    Visual check: 
    - First card (pos1) is green with a check mark (✓)
    - Second card (pos2) is pink with NO icon
    - Cards 3–10 are gray with lock icons (🔒)
    - The arrangement follows the curved/zigzag pattern as per CSS coordinates.
  -->
</body>
</html>
