<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Media UI Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Umumiy sozlamalar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
        }

        /* Mobil qurilma kengligini simulyatsiya qilish */
        .mobile-container {
            width: 100%;
            max-width: 480px; /* Telefon ekranidek ko'rinishi uchun */
            padding: 16px;
        }

        /* Har bir maqola kartochkasi */
        .card {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Rasm qismi */
        .card-image {
            width: 100%;
            aspect-ratio: 16 / 10; /* Rasmdagi kabi proporsiya */
            border-radius: 20px;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Teglar va ruknlar */
        .card-tags {
            font-size: 12px;
            font-weight: 500;
            color: #333333;
        }

        .card-tags .separator {
            color: #aaaaaa;
            margin: 0 6px;
        }

        /* Sarlavha */
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
            letter-spacing: -0.3px;
        }

        /* Ma'lumot qismi (Sana va vaqt) */
        .card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #999999;
            margin-top: 4px;
        }

        .card-meta .time {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Soat ikonchasi */
        .icon-clock {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        
        <!-- 1-Maqola Kartochkasi -->
        <article class="card">
            <div class="card-image">
                <!-- Rasm havolasini shu yerda o'zgartirasiz -->
                <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Gullar">
            </div>
            
            <div class="card-tags">
                <span>Sarflash va tejash</span> 
                <span class="separator">|</span> 
                <span>moliyaviy odatlar</span>
            </div>
            
            <h2 class="card-title">Moliyaviy odatlar: Toshkentlik shifokor pullarini qanday sarflashi va tejashi haqida</h2>
            
            <div class="card-meta">
                <span class="date">19.04.2024</span>
                <span class="time">
                    <!-- SVG soat ikonchasi -->
                    <svg class="icon-clock" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    8 daqiqa
                </span>
            </div>
        </article>

        <!-- 2-Maqola Kartochkasi -->
        <article class="card">
            <div class="card-image">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Geymerlar">
            </div>
            
            <div class="card-tags">
                <span>Xaridlar</span>
            </div>
            
            <h2 class="card-title">PS, Xbox va Nintendo uchun o'yinlarda tejamkorlik: geymer layfxaklari</h2>
            
            <div class="card-meta">
                <span class="date">06.04.2024</span>
                <span class="time">
                    <svg class="icon-clock" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    11 daqiqa
                </span>
            </div>
        </article>

    </div>

</body>
</html>
