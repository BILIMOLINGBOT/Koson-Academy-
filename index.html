<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>L.uz — Lenta</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    .frosted-header {
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .island-nav {
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      bottom: calc(14px + env(safe-area-inset-bottom));
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }
    .skeleton {
      animation: pulse-subtle 1.4s ease-in-out infinite;
      background: #18181b;
    }
  </style>
</head>
<body class="bg-black text-white antialiased selection:bg-white selection:text-black">

  <!-- Dynamic Toast -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] pointer-events-none opacity-0 -translate-y-3 transition-all duration-200">
    <div id="toast-text" class="px-4 py-2 rounded-full bg-zinc-900/95 border border-white/15 text-xs font-medium text-white shadow-2xl backdrop-blur-xl"></div>
  </div>

  <!-- Sticky Frosted Header -->
  <header class="sticky top-0 z-40 frosted-header border-b border-white/[0.08]">
    <div class="max-w-xl mx-auto px-4 pt-3 pb-2 flex items-center justify-between">
      <a href="profil.html" class="w-8 h-8 rounded-full overflow-hidden bg-zinc-900 border border-white/10 flex items-center justify-center shrink-0">
        <img id="header-avatar" src="" alt="Profil" class="w-full h-full object-cover hidden" />
        <span id="header-avatar-fallback" class="text-xs font-semibold text-zinc-400">L</span>
      </a>

      <button id="scroll-top-btn" type="button" class="text-lg font-bold tracking-tight text-white active:opacity-70 transition">
        L.uz
      </button>

      <button id="refresh-btn" type="button" aria-label="Yangilash" class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-400 hover:text-white active:scale-90 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- Feed Tabs -->
    <div class="max-w-xl mx-auto grid grid-cols-2 text-sm font-medium">
      <button id="tab-all" type="button" class="py-2.5 text-center text-white relative transition">
        Barchasi
        <span id="tab-all-indicator" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-[2px] bg-white rounded-full"></span>
      </button>
      <button id="tab-following" type="button" class="py-2.5 text-center text-zinc-500 relative transition">
        Obunalar
        <span id="tab-following-indicator" class="hidden absolute bottom-0 left-1/2 -translate-x-1/2 w-12 h-[2px] bg-white rounded-full"></span>
      </button>
    </div>
  </header>

  <!-- Main Feed -->
  <main class="max-w-xl mx-auto">
    <div id="feed-container" class="divide-y divide-white/[0.08]">
      <!-- Initial Skeletons -->
      <div class="p-4 flex gap-3">
        <div class="w-10 h-10 rounded-full skeleton shrink-0"></div>
        <div class="flex-1 space-y-2.5">
          <div class="h-3.5 w-32 rounded skeleton"></div>
          <div class="h-3.5 w-full rounded skeleton"></div>
          <div class="h-3.5 w-3/4 rounded skeleton"></div>
        </div>
      </div>
      <div class="p-4 flex gap-3">
        <div class="w-10 h-10 rounded-full skeleton shrink-0"></div>
        <div class="flex-1 space-y-2.5">
          <div class="h-3.5 w-28 rounded skeleton"></div>
          <div class="h-3.5 w-5/6 rounded skeleton"></div>
          <div class="h-40 w-full rounded-2xl skeleton"></div>
        </div>
      </div>
    </div>

    <!-- Pagination Sentinel & Controls -->
    <div id="pagination-area" class="py-8 px-4 flex flex-col items-center justify-center text-center">
      <div id="page-spinner" class="hidden w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
      <button id="load-more-btn" type="button" class="hidden px-4 py-2 rounded-full bg-zinc-900 border border-white/10 text-xs font-medium text-zinc-300 active:scale-95 transition">
        Yana yuklash
      </button>
      <p id="end-of-feed" class="hidden text-xs text-zinc-600">Barcha postlar ko‘rsatildi</p>
    </div>
  </main>

  <!-- Floating Island Bottom Navigation (No Xabar button) -->
  <nav aria-label="Asosiy navigatsiya" class="fixed left-1/2 -translate-x-1/2 z-40 island-nav border border-white/[0.12] rounded-full px-3 py-2 shadow-[0_8px_32px_rgba(0,0,0,0.85)] flex items-center gap-2">
    <a href="index.html" aria-label="Lenta" class="w-11 h-11 rounded-full flex items-center justify-center text-white bg-white/10 transition">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z" />
        <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z" />
      </svg>
    </a>

    <a href="search.html" aria-label="Qidiruv" class="w-11 h-11 rounded-full flex items-center justify-center text-zinc-400 hover:text-white active:scale-90 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </a>

    <button id="open-create-btn" type="button" aria-label="Yangi post" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center shadow-md active:scale-90 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>

    <a href="notification.html" aria-label="Bildirishnomalar" class="relative w-11 h-11 rounded-full flex items-center justify-center text-zinc-400 hover:text-white active:scale-90 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
      </svg>
      <span id="notif-badge" class="hidden absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-white ring-2 ring-zinc-900"></span>
    </a>

    <a href="profil.html" aria-label="Profil" class="w-11 h-11 rounded-full flex items-center justify-center text-zinc-400 hover:text-white active:scale-90 transition">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
      </svg>
    </a>
  </nav>

  <!-- Create Post Modal -->
  <div id="create-modal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col justify-end sm:justify-center">
    <div class="bg-zinc-950 border-t sm:border border-white/15 w-full max-w-xl mx-auto rounded-t-3xl sm:rounded-3xl p-4 pb-8 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-white/[0.08]">
        <button id="close-create-btn" type="button" class="text-sm text-zinc-400 hover:text-white px-2 py-1">
          Bekor qilish
        </button>
        <span class="text-sm font-semibold">Yangi post</span>
        <button id="submit-post-btn" type="button" disabled class="px-4 py-1.5 rounded-full bg-white text-black text-xs font-semibold disabled:opacity-35 active:scale-95 transition">
          Joylashtirish
        </button>
      </div>

      <div class="pt-4 flex gap-3">
        <div class="w-9 h-9 rounded-full bg-zinc-900 border border-white/10 overflow-hidden shrink-0 flex items-center justify-center">
          <img id="composer-avatar" src="" alt="" class="w-full h-full object-cover hidden" />
          <span id="composer-avatar-fallback" class="text-xs font-semibold text-zinc-400">L</span>
        </div>
        <div class="flex-1">
          <textarea id="post-text-input" rows="4" maxlength="1000" placeholder="Nimalar haqida o‘ylayapsiz?" class="w-full bg-transparent text-[15px] text-white placeholder-zinc-600 resize-none focus:outline-none leading-relaxed"></textarea>

          <!-- Media Preview -->
          <div id="media-preview-box" class="hidden relative mt-2 rounded-2xl overflow-hidden border border-white/10 bg-zinc-900">
            <img id="media-preview-img" src="" alt="Tanlangan rasm" class="w-full max-h-64 object-cover" />
            <button id="remove-media-btn" type="button" aria-label="Rasmni olib tashlash" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/75 text-white flex items-center justify-center border border-white/15">
              ✕
            </button>
          </div>

          <!-- Optional Image URL Input -->
          <div id="url-input-box" class="hidden mt-2">
            <input id="post-url-input" type="url" placeholder="https://... rasm havolasini kiriting" class="w-full bg-zinc-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-white/30" />
          </div>

          <div class="mt-3 pt-3 border-t border-white/[0.06] flex items-center justify-between">
            <div class="flex items-center gap-2">
              <label class="cursor-pointer px-3 py-1.5 rounded-full bg-zinc-900 border border-white/10 text-xs text-zinc-300 flex items-center gap-1.5 active:scale-95 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span>Rasm</span>
                <input id="post-file-input" type="file" accept="image/*" class="hidden" />
              </label>

              <button id="toggle-url-btn" type="button" class="px-3 py-1.5 rounded-full bg-zinc-900 border border-white/10 text-xs text-zinc-400 active:scale-95 transition">
                URL
              </button>
            </div>

            <span id="char-counter" class="text-[11px] text-zinc-500">0 / 1000</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Comments Bottom Sheet -->
  <div id="comments-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end">
    <div id="comments-backdrop" class="flex-1"></div>
    <div class="bg-zinc-950 border-t border-white/15 w-full max-w-xl mx-auto rounded-t-3xl h-[78vh] flex flex-col shadow-2xl">
      <div class="px-4 py-3 border-b border-white/[0.08] flex items-center justify-between shrink-0">
        <span class="w-8"></span>
        <span class="text-sm font-semibold">Kommentariyalar</span>
        <button id="close-comments-btn" type="button" class="w-8 h-8 rounded-full bg-zinc-900 text-zinc-400 flex items-center justify-center text-xs">
          ✕
        </button>
      </div>

      <div id="comments-list" class="flex-1 overflow-y-auto divide-y divide-white/[0.06] px-4"></div>

      <form id="comment-form" class="p-3 border-t border-white/[0.08] bg-black flex items-center gap-2 shrink-0 pb-[calc(12px+env(safe-area-inset-bottom))]">
        <input id="comment-input" type="text" maxlength="1000" placeholder="Kommentariya yozing..." class="flex-1 bg-zinc-900 border border-white/10 rounded-full px-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-white/30" />
        <button id="send-comment-btn" type="submit" class="px-4 py-2.5 rounded-full bg-white text-black text-xs font-semibold active:scale-95 transition">
          Yuborish
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import {
      db,
      tg,
      ensureAuth,
      getCurrentTgUser,
      toggleLike,
      toggleSave,
      recordUniqueView,
      escapeHTML,
      formatTimeAgo
    } from "./firebase-core.js";

    import {
      collection,
      doc,
      getDoc,
      getDocs,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      startAfter,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // --- STATE ---
    const PAGE_SIZE = 15;
    let currentUser = null;
    let currentUserProfile = null;
    let activeTab = "all"; // "all" | "following"
    let lastVisibleDoc = null;
    let isFetching = false;
    let hasMorePosts = true;
    const renderedPostIds = new Set();

    let selectedMediaDataUrl = "";
    let activeCommentPost = null;

    // --- DOM ELEMENTS ---
    const feedContainer = document.getElementById("feed-container");
    const pageSpinner = document.getElementById("page-spinner");
    const loadMoreBtn = document.getElementById("load-more-btn");
    const endOfFeed = document.getElementById("end-of-feed");
    const paginationArea = document.getElementById("pagination-area");

    const createModal = document.getElementById("create-modal");
    const postTextInput = document.getElementById("post-text-input");
    const postFileInput = document.getElementById("post-file-input");
    const postUrlInput = document.getElementById("post-url-input");
    const urlInputBox = document.getElementById("url-input-box");
    const mediaPreviewBox = document.getElementById("media-preview-box");
    const mediaPreviewImg = document.getElementById("media-preview-img");
    const submitPostBtn = document.getElementById("submit-post-btn");
    const charCounter = document.getElementById("char-counter");

    const commentsModal = document.getElementById("comments-modal");
    const commentsList = document.getElementById("comments-list");
    const commentForm = document.getElementById("comment-form");
    const commentInput = document.getElementById("comment-input");

    // --- HELPERS ---
    function showToast(msg) {
      const toast = document.getElementById("toast");
      const text = document.getElementById("toast-text");
      text.textContent = msg;
      toast.classList.remove("opacity-0", "-translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "-translate-y-3");
      }, 2400);
    }

    function safeUrl(url) {
      if (!url || typeof url !== "string") return "";
      const trimmed = url.trim();
      if (
        trimmed.startsWith("https://") ||
        trimmed.startsWith("http://") ||
        trimmed.startsWith("data:image/")
      ) {
        return trimmed;
      }
      return "";
    }

    function updateBackButton() {
      if (!tg?.BackButton) return;
      const modalOpen =
        !createModal.classList.contains("hidden") ||
        !commentsModal.classList.contains("hidden");
      if (modalOpen) {
        tg.BackButton.show();
      } else {
        tg.BackButton.hide();
      }
    }

    if (tg?.BackButton) {
      tg.BackButton.onClick(() => {
        if (!commentsModal.classList.contains("hidden")) {
          closeCommentsModal();
        } else if (!createModal.classList.contains("hidden")) {
          closeCreateModal();
        }
      });
    }

    // --- UNIQUE VIEW OBSERVER ---
    const viewedInSession = new Set();
    const viewObserver = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const postId = entry.target.dataset.postId;
            viewObserver.unobserve(entry.target);
            if (postId && !viewedInSession.has(postId)) {
              viewedInSession.add(postId);
              recordUniqueView(postId).catch(() => {});
            }
          }
        });
      },
      { threshold: 0.55 }
    );

    // --- PAGINATION OBSERVER ---
    const pageObserver = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting && hasMorePosts && !isFetching) {
          loadNextPage();
        }
      },
      { rootMargin: "250px" }
    );

    
    // --- RENDER POST CARD ---
    function createPostElement(post, isLiked, isSaved) {
      const article = document.createElement("article");
      article.className = "p-4 hover:bg-white/[0.015] transition";
      article.dataset.postId = post.id;

      const authorName = escapeHTML(post.authorName || "Foydalanuvchi");
      const authorUsername = post.authorUsername ? `@${escapeHTML(post.authorUsername)}` : "";
      const timeStr = formatTimeAgo(post.createdAt);
      const avatarSrc = safeUrl(post.authorPhoto);
      const mediaSrc = safeUrl(post.mediaUrl);
      const initial = authorName.charAt(0).toUpperCase() || "U";

      const canDelete =
        currentUser &&
        (String(post.authorId) === currentUser.tgId || currentUserProfile?.isAdmin === true);

      const verifiedBadge = post.authorVerified
        ? `<svg class="w-3.5 h-3.5 text-white inline-block ml-1 shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" />
          </svg>`
        : "";

      article.innerHTML = `
        <div class="flex gap-3">
          <a href="profil.html?id=${encodeURIComponent(post.authorId)}" class="w-10 h-10 rounded-full bg-zinc-900 border border-white/10 overflow-hidden shrink-0 flex items-center justify-center">
            ${
              avatarSrc
                ? `<img src="${avatarSrc}" alt="${authorName}" loading="lazy" class="w-full h-full object-cover" />`
                : `<span class="text-sm font-semibold text-zinc-400">${initial}</span>`
            }
          </a>

          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <a href="profil.html?id=${encodeURIComponent(post.authorId)}" class="text-[14px] font-semibold text-white truncate flex items-center">
                  ${authorName}${verifiedBadge}
                </a>
                ${authorUsername ? `<span class="text-xs text-zinc-500 truncate">${authorUsername}</span>` : ""}
                <span class="text-xs text-zinc-600">·</span>
                <span class="text-xs text-zinc-500 shrink-0">${timeStr}</span>
              </div>

              ${
                canDelete
                  ? `<button type="button" data-action="delete" class="text-zinc-600 hover:text-red-400 p-1 rounded-lg transition" aria-label="O'chirish">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                      </svg>
                    </button>`
                  : ""
              }
            </div>

            ${
              post.text
                ? `<p class="mt-1.5 text-[15px] text-zinc-100 leading-relaxed whitespace-pre-wrap break-words">${escapeHTML(post.text)}</p>`
                : ""
            }

            ${
              mediaSrc
                ? `<div class="mt-3 rounded-2xl overflow-hidden border border-white/10 bg-zinc-950">
                    <img src="${mediaSrc}" alt="Post rasmi" loading="lazy" class="w-full max-h-[420px] object-cover" />
                  </div>`
                : ""
            }

            <!-- Action Bar -->
            <div class="mt-3 flex items-center justify-between max-w-sm text-zinc-500">
              <!-- Comment -->
              <button type="button" data-action="comment" class="flex items-center gap-1.5 text-xs hover:text-white active:scale-95 transition py-1">

                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 20.25c4.97 0 9-3.694 9-8.25s-4.03-8.25-9-8.25S3 7.444 3 12c0 2.104.859 4.023 2.273 5.48.432.447.74 1.04.586 1.641a4.483 4.483 0 01-.923 1.785A5.969 5.969 0 006 21c1.282 0 2.47-.402 3.445-1.087.81.22 1.668.337 2.555.337z" />

                <svg class="w-[18px] h-[18px]" fill="${isLiked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />

              <!-- Views -->

                <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />

              <!-- Save -->
              <button type="button" data-action="save" data-saved="${isSaved ? "1" : "0"}" class="flex items-center gap-1 text-xs ${isSaved ? "text-white" : "hover:text-white"} active:scale-95 transition py-1" aria-label="Saqlash">
                <svg class="w-[18px] h-[18px]" fill="${isSaved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />

      // Bind incremental interactions directly on the card
      const likeBtn = article.querySelector('[data-action="like"]');
      likeBtn.addEventListener("click", async () => {
        if (!currentUser) return showToast("Avtorizatsiya kutilmoqda...");
        const wasLiked = likeBtn.dataset.liked === "1";
        const countEl = likeBtn.querySelector('[data-role="like-count"]');
        const svg = likeBtn.querySelector("svg");
        const currentCount = Number(countEl.textContent) || 0;

        // Optimistic UI update
        const nextLiked = !wasLiked;
        likeBtn.dataset.liked = nextLiked ? "1" : "0";
        likeBtn.classList.toggle("text-rose-500", nextLiked);
        likeBtn.classList.toggle("hover:text-rose-400", !nextLiked);
        svg.setAttribute("fill", nextLiked ? "currentColor" : "none");
        countEl.textContent = String(Math.max(0, currentCount + (nextLiked ? 1 : -1)));

        try {
          await toggleLike(post.id, post.authorId, post.text || "Rasm");
        } catch (err) {
          // Rollback on failure
          likeBtn.dataset.liked = wasLiked ? "1" : "0";
          likeBtn.classList.toggle("text-rose-500", wasLiked);
          svg.setAttribute("fill", wasLiked ? "currentColor" : "none");
          countEl.textContent = String(currentCount);
          showToast("Layk bosishda xatolik");
        }
      });

      const saveBtn = article.querySelector('[data-action="save"]');
      saveBtn.addEventListener("click", async () => {
        if (!currentUser) return showToast("Avtorizatsiya kutilmoqda...");
        const wasSaved = saveBtn.dataset.saved === "1";
        const svg = saveBtn.querySelector("svg");
        const nextSaved = !wasSaved;

        saveBtn.dataset.saved = nextSaved ? "1" : "0";
        saveBtn.classList.toggle("text-white", nextSaved);
        svg.setAttribute("fill", nextSaved ? "currentColor" : "none");

        try {
          await toggleSave(post.id);
          showToast(nextSaved ? "Saqlandi" : "Saqlanganlardan olindi");
        } catch {
          saveBtn.dataset.saved = wasSaved ? "1" : "0";
          saveBtn.classList.toggle("text-white", wasSaved);
          svg.setAttribute("fill", wasSaved ? "currentColor" : "none");
          showToast("Saqlashda xatolik");
        }
      });

      const commentBtn = article.querySelector('[data-action="comment"]');
      commentBtn.addEventListener("click", () => {
        openCommentsModal(post, article.querySelector('[data-role="comment-count"]'));
      });

      const deleteBtn = article.querySelector('[data-action="delete"]');
      if (deleteBtn) {
        deleteBtn.addEventListener("click", async () => {
          if (!confirm("Ushbu postni o‘chirmoqchimisiz?")) return;
          try {
            await deleteDoc(doc(db, "posts", post.id));
            if (String(post.authorId) === currentUser?.tgId) {
              await updateDoc(doc(db, "users", currentUser.tgId), {
                postsCount: increment(-1)
              }).catch(() => {});
            }
            article.remove();
            renderedPostIds.delete(post.id);
            showToast("Post o‘chirildi");
          } catch {
            showToast("O‘chirishga ruxsat yo‘q");
          }
        });
      }

      viewObserver.observe(article);
      return article;
    }

    // --- FETCH PAGINATED FEED ---
    async function loadNextPage(reset = false) {
      if (isFetching) return;
      if (!reset && !hasMorePosts) return;

      isFetching = true;
      pageSpinner.classList.remove("hidden");
      loadMoreBtn.classList.add("hidden");
      endOfFeed.classList.add("hidden");

      if (reset) {
        lastVisibleDoc = null;
        hasMorePosts = true;
        renderedPostIds.clear();
        feedContainer.innerHTML = "";
      }

      try {
        let q;
        if (activeTab === "following") {
          if (!currentUser) {
            renderEmptyState("Obunalarni ko‘rish uchun Telegram orqali kiring.");
            hasMorePosts = false;
            return;
          }
          const followsSnap = await getDocs(
            query(collection(db, "follows"), where("followerId", "==", currentUser.tgId))
          );
          const followingIds = followsSnap.docs.map((d) => String(d.data().followingId));

          if (followingIds.length === 0) {
            renderEmptyState("Hali hech kimga obuna bo‘lmagansiz.");
            hasMorePosts = false;
            return;
          }

          const targetIds = followingIds.slice(0, 30);
          q = lastVisibleDoc
            ? query(
                collection(db, "posts"),
                where("authorId", "in", targetIds),
                orderBy("createdAt", "desc"),
                startAfter(lastVisibleDoc),
                limit(PAGE_SIZE)
              )
            : query(
                collection(db, "posts"),
                where("authorId", "in", targetIds),
                orderBy("createdAt", "desc"),
                limit(PAGE_SIZE)
              );
        } else {
          q = lastVisibleDoc
            ? query(
                collection(db, "posts"),
                orderBy("createdAt", "desc"),
                startAfter(lastVisibleDoc),
                limit(PAGE_SIZE)
              )
            : query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(PAGE_SIZE));
        }

        const snap = await getDocs(q);

        if (snap.empty) {
          hasMorePosts = false;
          if (renderedPostIds.size === 0) {
            renderEmptyState("Hozircha postlar yo‘q. Birinchi bo‘lib yozing!");
          } else {
            endOfFeed.classList.remove("hidden");
          }
          return;
        }

        lastVisibleDoc = snap.docs[snap.docs.length - 1];
        if (snap.docs.length < PAGE_SIZE) {
          hasMorePosts = false;
        }

        const posts = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .filter((p) => !renderedPostIds.has(p.id));

        // Batch check liked & saved status for this page
        const statusMap = new Map();
        if (currentUser && posts.length > 0) {
          await Promise.all(
            posts.map(async (p) => {
              const [likeSnap, saveSnap] = await Promise.all([
                getDoc(doc(db, "likes", `${p.id}_${currentUser.tgId}`)).catch(() => null),
                getDoc(doc(db, "saves", `${p.id}_${currentUser.tgId}`)).catch(() => null)
              ]);
              statusMap.set(p.id, {
                liked: Boolean(likeSnap?.exists()),
                saved: Boolean(saveSnap?.exists())
              });
            })
          );
        }

        const fragment = document.createDocumentFragment();
        posts.forEach((post) => {
          renderedPostIds.add(post.id);
          const st = statusMap.get(post.id) || { liked: false, saved: false };
          fragment.appendChild(createPostElement(post, st.liked, st.saved));
        });

        feedContainer.appendChild(fragment);

        if (hasMorePosts) {
          loadMoreBtn.classList.remove("hidden");
        } else {
          endOfFeed.classList.remove("hidden");
        }
      } catch (err) {
        console.error("Lentani yuklashda xato:", err);
        if (renderedPostIds.size === 0) {
          renderEmptyState("Ma’lumotlarni yuklashda xatolik yuz berdi. Qayta urinib ko‘ring.");
        } else {
          loadMoreBtn.classList.remove("hidden");
        }
      } finally {
        isFetching = false;
        pageSpinner.classList.add("hidden");
      }
    }

    function renderEmptyState(message) {
      feedContainer.innerHTML = `
        <div class="py-20 px-6 text-center">
          <p class="text-sm text-zinc-500">${escapeHTML(message)}</p>
        </div>
      `;
    }

    // --- TAB SWITCHING ---
    const tabAll = document.getElementById("tab-all");
    const tabFollowing = document.getElementById("tab-following");
    const tabAllInd = document.getElementById("tab-all-indicator");
    const tabFollowingInd = document.getElementById("tab-following-indicator");

    function switchTab(tab) {
      if (activeTab === tab) return;
      activeTab = tab;

      if (tab === "all") {
        tabAll.classList.replace("text-zinc-500", "text-white");
        tabFollowing.classList.replace("text-white", "text-zinc-500");
        tabAllInd.classList.remove("hidden");
        tabFollowingInd.classList.add("hidden");
      } else {
        tabFollowing.classList.replace("text-zinc-500", "text-white");
        tabAll.classList.replace("text-white", "text-zinc-500");
        tabFollowingInd.classList.remove("hidden");
        tabAllInd.classList.add("hidden");
      }

      loadNextPage(true);
    }

    tabAll.addEventListener("click", () => switchTab("all"));
    tabFollowing.addEventListener("click", () => switchTab("following"));

    
    // --- CREATE POST MODAL ---
    function openCreateModal() {
      if (!currentUser) {
        showToast("Post yozish uchun Telegram orqali kiring");
        return;
      }
      createModal.classList.remove("hidden");
      updateBackButton();
      setTimeout(() => postTextInput.focus(), 60);
    }

    function closeCreateModal() {
      createModal.classList.add("hidden");
      updateBackButton();
    }

    function updateSubmitState() {
      const len = postTextInput.value.length;
      charCounter.textContent = `${len} / 1000`;
      const hasContent =
        postTextInput.value.trim().length > 0 ||
        Boolean(selectedMediaDataUrl) ||
        Boolean(safeUrl(postUrlInput.value));
      submitPostBtn.disabled = !hasContent;
    }

    document.getElementById("open-create-btn").addEventListener("click", openCreateModal);
    document.getElementById("close-create-btn").addEventListener("click", closeCreateModal);

    postTextInput.addEventListener("input", updateSubmitState);
    postUrlInput.addEventListener("input", () => {
      const valid = safeUrl(postUrlInput.value);
      if (valid) {
        selectedMediaDataUrl = "";
        mediaPreviewImg.src = valid;
        mediaPreviewBox.classList.remove("hidden");
      } else if (!selectedMediaDataUrl) {
        mediaPreviewBox.classList.add("hidden");
      }
      updateSubmitState();
    });

    document.getElementById("toggle-url-btn").addEventListener("click", () => {
      urlInputBox.classList.toggle("hidden");
    });

    document.getElementById("remove-media-btn").addEventListener("click", () => {
      selectedMediaDataUrl = "";
      postUrlInput.value = "";
      postFileInput.value = "";
      mediaPreviewImg.src = "";
      mediaPreviewBox.classList.add("hidden");
      updateSubmitState();
    });

    // Compress image on canvas so it stays lightweight (<220KB)
    postFileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const MAX_W = 1080;
          let w = img.width;
          let h = img.height;
          if (w > MAX_W) {
            h = Math.round((h * MAX_W) / w);
            w = MAX_W;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          selectedMediaDataUrl = canvas.toDataURL("image/jpeg", 0.75);
          postUrlInput.value = "";
          urlInputBox.classList.add("hidden");
          mediaPreviewImg.src = selectedMediaDataUrl;
          mediaPreviewBox.classList.remove("hidden");
          updateSubmitState();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    submitPostBtn.addEventListener("click", async () => {
      if (!currentUser || submitPostBtn.disabled) return;

      const text = postTextInput.value.trim();
      const mediaUrl = selectedMediaDataUrl || safeUrl(postUrlInput.value);
      if (!text && !mediaUrl) return;

      submitPostBtn.disabled = true;
      submitPostBtn.textContent = "Yuklanmoqda...";

      try {
        const authorName =
          [currentUserProfile?.firstName || currentUser.firstName, currentUserProfile?.lastName || currentUser.lastName]
            .filter(Boolean)
            .join(" ") || "Foydalanuvchi";

        const newPostData = {
          authorId: currentUser.tgId,
          authorName,
          authorUsername: currentUserProfile?.username || currentUser.username || "",
          authorPhoto: currentUserProfile?.photoUrl || currentUser.photoUrl || "",
          authorVerified: Boolean(currentUserProfile?.isVerified),
          text,
          mediaUrl: mediaUrl || "",
          mediaType: mediaUrl ? "image" : "",
          likesCount: 0,
          commentsCount: 0,
          viewsCount: 0,
          savesCount: 0,
          createdAt: serverTimestamp()
        };

        const docRef = await addDoc(collection(db, "posts"), newPostData);

        await updateDoc(doc(db, "users", currentUser.tgId), {
          postsCount: increment(1)
        }).catch(() => {});

        // Reset composer
        postTextInput.value = "";
        postUrlInput.value = "";
        postFileInput.value = "";
        selectedMediaDataUrl = "";
        mediaPreviewBox.classList.add("hidden");
        urlInputBox.classList.add("hidden");
        updateSubmitState();
        closeCreateModal();

        // Incremental prepend to DOM without reloading feed
        if (renderedPostIds.size === 0) {
          feedContainer.innerHTML = "";
        }
        renderedPostIds.add(docRef.id);
        const card = createPostElement(
          { id: docRef.id, ...newPostData, createdAt: new Date() },
          false,
          false
        );
        feedContainer.prepend(card);
        showToast("Post joylandi");
      } catch (err) {
        console.error("Post joylashda xato:", err);
        showToast("Post joylashda xatolik yuz berdi");
      } finally {
        submitPostBtn.textContent = "Joylashtirish";
        updateSubmitState();
      }
    });

    // --- COMMENTS SUBCOLLECTION SHEET ---
    async function openCommentsModal(post, counterEl) {
      activeCommentPost = { post, counterEl };
      commentsModal.classList.remove("hidden");
      updateBackButton();
      commentsList.innerHTML = `<div class="py-12 text-center text-xs text-zinc-500">Yuklanmoqda...</div>`;

      try {
        const q = query(
          collection(db, "posts", post.id, "comments"),
          orderBy("createdAt", "asc"),
          limit(60)
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          commentsList.innerHTML = `<div class="py-14 text-center text-xs text-zinc-500">Hali kommentariyalar yo‘q. Birinchi bo‘ling!</div>`;
          return;
        }

        commentsList.innerHTML = "";
        snap.docs.forEach((d) => {
          commentsList.appendChild(renderCommentItem(post, d.id, d.data()));
        });
      } catch (err) {
        console.error("Kommentariyalar xatosi:", err);
        commentsList.innerHTML = `<div class="py-12 text-center text-xs text-red-400">Kommentariyalarni yuklab bo‘lmadi</div>`;
      }
    }

    function renderCommentItem(post, commentId, c) {
      const row = document.createElement("div");
      row.className = "py-3 flex gap-2.5";

      const name = escapeHTML(c.authorName || "Foydalanuvchi");
      const avatar = safeUrl(c.authorPhoto);
      const canDelete =
        currentUser &&
        (String(c.authorId) === currentUser.tgId ||
          String(post.authorId) === currentUser.tgId ||
          currentUserProfile?.isAdmin === true);

      row.innerHTML = `
        <a href="profil.html?id=${encodeURIComponent(c.authorId)}" class="w-8 h-8 rounded-full bg-zinc-900 border border-white/10 overflow-hidden shrink-0 flex items-center justify-center">
          ${
            avatar
              ? `<img src="${avatar}" alt="${name}" class="w-full h-full object-cover" />`
              : `<span class="text-xs font-semibold text-zinc-400">${name.charAt(0).toUpperCase()}</span>`
          }
        </a>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-xs font-semibold text-white truncate">${name}</span>
              <span class="text-[11px] text-zinc-500">${formatTimeAgo(c.createdAt)}</span>
            </div>
            ${
              canDelete
                ? `<button type="button" data-del-comment class="text-[11px] text-zinc-600 hover:text-red-400">O‘chirish</button>`
                : ""
            }
          </div>
          <p class="mt-1 text-[13px] text-zinc-200 break-words leading-snug">${escapeHTML(c.text)}</p>
        </div>
      `;

      const delBtn = row.querySelector("[data-del-comment]");
      if (delBtn) {
        delBtn.addEventListener("click", async () => {
          try {
            await deleteDoc(doc(db, "posts", post.id, "comments", commentId));
            await updateDoc(doc(db, "posts", post.id), {
              commentsCount: increment(-1)
            }).catch(() => {});
            row.remove();
            if (activeCommentPost?.counterEl) {
              const cur = Number(activeCommentPost.counterEl.textContent) || 0;
              activeCommentPost.counterEl.textContent = String(Math.max(0, cur - 1));
            }
          } catch {
            showToast("O‘chirishda xatolik");
          }
        });
      }

      return row;
    }

    function closeCommentsModal() {
      commentsModal.classList.add("hidden");
      activeCommentPost = null;
      updateBackButton();
    }

    document.getElementById("close-comments-btn").addEventListener("click", closeCommentsModal);
    document.getElementById("comments-backdrop").addEventListener("click", closeCommentsModal);

    commentForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser || !activeCommentPost) return;

      const text = commentInput.value.trim();
      if (!text) return;

      const { post, counterEl } = activeCommentPost;
      const sendBtn = document.getElementById("send-comment-btn");
      sendBtn.disabled = true;

      try {
        const authorName =
          [currentUserProfile?.firstName || currentUser.firstName, currentUserProfile?.lastName || currentUser.lastName]
            .filter(Boolean)
            .join(" ") || "Foydalanuvchi";

        const commentData = {
          authorId: currentUser.tgId,
          authorName,
          authorUsername: currentUserProfile?.username || currentUser.username || "",
          authorPhoto: currentUserProfile?.photoUrl || currentUser.photoUrl || "",
          text,
          replyToId: "",
          createdAt: serverTimestamp()
        };

        const cRef = await addDoc(collection(db, "posts", post.id, "comments"), commentData);

        await updateDoc(doc(db, "posts", post.id), {
          commentsCount: increment(1)
        });

        if (String(post.authorId) !== currentUser.tgId) {
          await addDoc(collection(db, "luz_notifications"), {
            toUserId: String(post.authorId),
            fromUserId: currentUser.tgId,
            fromName: authorName,
            fromPhoto: commentData.authorPhoto,
            type: "comment",
            postId: post.id,
            previewText: text.slice(0, 60),
            isRead: false,
            createdAt: serverTimestamp()
          }).catch(() => {});
        }

        if (commentsList.querySelector(".text-center")) {
          commentsList.innerHTML = "";
        }
        commentsList.appendChild(
          renderCommentItem(post, cRef.id, { ...commentData, createdAt: new Date() })

        commentsList.scrollTop = commentsList.scrollHeight;

        if (counterEl) {
          counterEl.textContent = String((Number(counterEl.textContent) || 0) + 1);
        }
        commentInput.value = "";
      } catch (err) {
        console.error("Kommentariya yuborish xatosi:", err);
        showToast("Kommentariya yuborilmadi");
      } finally {
        sendBtn.disabled = false;
      }
    });

        if (photo) {
          const hImg = document.getElementById("header-avatar");
          hImg.src = photo;
          hImg.classList.remove("hidden");

          cImg.classList.remove("hidden");
          document.getElementById("composer-avatar-fallback").classList.add("hidden");

          document.getElementById("header-avatar-fallback").textContent = initial;
          document.getElementById("composer-avatar-fallback").textContent = initial;
