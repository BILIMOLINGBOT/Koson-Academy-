<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Feed UI</title>
<style>
  /* Asosiy sozlamalar */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Roboto, Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  /* Mobil ekran o'lchami uchun cheklov */
  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #e5e5e5;
  }

  .video-card {
    background-color: #e9e9e9;
    margin-bottom: 2px; /* Videolar orasidagi kichik chiziq */
  }

  /* Rasm qismi (Thumbnail) */
  .thumbnail-wrapper {
    position: relative;
    width: 100%;
  }

  .thumbnail-wrapper img {
    width: 100%;
    height: 220px;
    display: block;
    object-fit: cover;
  }

  /* Vaqt belgisi */
  .duration {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background-color: rgba(0, 0, 0, 0.8);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 3px 5px;
    border-radius: 4px;
    line-height: 1;
  }

  /* Ma'lumotlar qismi (Kanal, sarlavha) */
  .video-info {
    display: flex;
    padding: 12px;
    align-items: flex-start;
  }

  /* Kanal logotipi */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 12px;
  }

  .video-details {
    flex-grow: 1;
    padding-right: 12px;
  }

  /* Video nomi */
  .video-title {
    font-size: 16px;
    font-weight: 400;
    color: #0f0f0f;
    margin-bottom: 4px;
    line-height: 1.3;
    /* Ikki qatordan oshsa, nuqtalar bilan kesish */
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Ko'rishlar soni va vaqti */
  .video-meta {
    font-size: 13px;
    color: #606060;
    line-height: 1.4;
  }

  /* 3 ta nuqta (Menyu) */
  .more-options {
    flex-shrink: 0;
    color: #0f0f0f;
    cursor: pointer;
    padding-top: 2px;
  }

  .more-options svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
</style>
</head>
<body>

<div class="app-container">

  <div class="video-card">
    <div class="thumbnail-wrapper">
      <img src="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80" alt="Truck thumbnail">
      <span class="duration">14:44</span>
    </div>
    <div class="video-info">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="avatar">
      <div class="video-details">
        <h3 class="video-title">Apm Update</h3>
        <p class="video-meta">TRIPLE R · 176 marta · 12 soat oldin</p>
      </div>
      <div class="more-options">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path></svg>
      </div>
    </div>
  </div>

  <div class="video-card">
    <div class="thumbnail-wrapper">
      <img src="https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=800&q=80" alt="Brain thumbnail">
      <span class="duration">5:33</span>
    </div>
    <div class="video-info">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/BBC_News_2019.svg/100px-BBC_News_2019.svg.png" alt="BBC News Avatar" class="avatar" style="background: #b00; padding: 2px;">
      <div class="video-details">
        <h3 class="video-title">Is being bilingual good for you brain? | BBC Ideas</h3>
        <p class="video-meta">BBC News · 1,3 mln marta · 1 yil oldin</p>
      </div>
      <div class="more-options">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path></svg>
      </div>
    </div>
  </div>

</div>

</body>
</html>
