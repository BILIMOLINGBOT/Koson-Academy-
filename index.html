<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katta tugmalar · Uzaytirilgan Zig-zag</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      /* markazlashtirishni biroz o'zgartiramizki, scroll qilish oson bo'lsin */
      align-items: flex-start; 
      padding: 50px 0;
      min-height: 100vh;
      background-color: #0f172a; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      position: relative;
      width: 500px;
      height: 2200px; /* 20 ta tugma sig'ishi uchun balandlik oshirildi */
    }

    .icon-box {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    /* Yashil karta - Emerald */
    .icon-box.green-card {
      background: linear-gradient(135deg, #10b981, #047857);
      box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
    }

    /* Pushti karta - Rose */
    .icon-box.pink-card {
      background: linear-gradient(135deg, #f43f5e, #be123c);
      box-shadow: 0 10px 20px -5px rgba(244, 63, 94, 0.4);
    }

    /* Kulrang karta va qulf - Slate */
    .icon-box.gray-lock {
      background: linear-gradient(135deg, #334155, #1e293b);
      color: #94a3b8; 
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.6);
    }

    /* Hover va Active holatlari */
    .icon-box:hover {
      transform: scale(1.1) translateY(-5px);
      border-color: rgba(255, 255, 255, 0.3);
    }
    
    .icon-box.green-card:hover { box-shadow: 0 20px 25px -5px rgba(16, 185, 129, 0.6); }
    .icon-box.pink-card:hover { box-shadow: 0 20px 25px -5px rgba(244, 63, 94, 0.6); }
    .icon-box.gray-lock:hover { color: #e2e8f0; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.8); }

    .icon-box:active {
      transform: scale(0.95);
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.4);
    }

    /* Katta o'lchamlarga mos koordinatalar (1 dan 20 gacha) */
    .pos1  { top: 0px;    right: 0px; }
    .pos2  { top: 110px;  right: 110px; }
    .pos3  { top: 220px;  right: 220px; }
    .pos4  { top: 330px;  right: 330px; }
    .pos5  { top: 440px;  right: 220px; }
    .pos6  { top: 550px;  right: 110px; }
    .pos7  { top: 660px;  right: 0px; }
    .pos8  { top: 770px;  right: 110px; }
    .pos9  { top: 880px;  right: 220px; }
    .pos10 { top: 990px;  right: 330px; }
    .pos11 { top: 1100px; right: 220px; }
    .pos12 { top: 1210px; right: 110px; }
    .pos13 { top: 1320px; right: 0px; }
    .pos14 { top: 1430px; right: 110px; }
    .pos15 { top: 1540px; right: 220px; }
    .pos16 { top: 1650px; right: 330px; }
    .pos17 { top: 1760px; right: 220px; }
    .pos18 { top: 1870px; right: 110px; }
    .pos19 { top: 1980px; right: 0px; }
    .pos20 { top: 2090px; right: 110px; }

    /* Planshet uchun */
    @media (max-width: 768px) {
      .container {
        width: 400px;
        height: 1850px; /* Balandlik uzaytirildi */
      }
      .icon-box {
        width: 90px;
        height: 90px;
        border-radius: 20px;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 90px;   right: 90px; }
      .pos3  { top: 180px;  right: 180px; }
      .pos4  { top: 270px;  right: 270px; }
      .pos5  { top: 360px;  right: 180px; }
      .pos6  { top: 450px;  right: 90px; }
      .pos7  { top: 540px;  right: 0px; }
      .pos8  { top: 630px;  right: 90px; }
      .pos9  { top: 720px;  right: 180px; }
      .pos10 { top: 810px;  right: 270px; }
      .pos11 { top: 900px;  right: 180px; }
      .pos12 { top: 990px;  right: 90px; }
      .pos13 { top: 1080px; right: 0px; }
      .pos14 { top: 1170px; right: 90px; }
      .pos15 { top: 1260px; right: 180px; }
      .pos16 { top: 1350px; right: 270px; }
      .pos17 { top: 1440px; right: 180px; }
      .pos18 { top: 1530px; right: 90px; }
      .pos19 { top: 1620px; right: 0px; }
      .pos20 { top: 1710px; right: 90px; }
    }

    /* Mobil uchun */
    @media (max-width: 480px) {
      .container {
        width: 320px;
        height: 1550px; /* Balandlik uzaytirildi */
      }
      .icon-box {
        width: 75px;
        height: 75px;
        border-radius: 16px;
      }
      .pos1  { top: 0px;    right: 0px; }
      .pos2  { top: 75px;   right: 75px; }
      .pos3  { top: 150px;  right: 150px; }
      .pos4  { top: 225px;  right: 225px; }
      .pos5  { top: 300px;  right: 150px; }
      .pos6  { top: 375px;  right: 75px; }
      .pos7  { top: 450px;  right: 0px; }
      .pos8  { top: 525px;  right: 75px; }
      .pos9  { top: 600px;  right: 150px; }
      .pos10 { top: 675px;  right: 225px; }
      .pos11 { top: 750px;  right: 150px; }
      .pos12 { top: 825px;  right: 75px; }
      .pos13 { top: 900px;  right: 0px; }
      .pos14 { top: 975px;  right: 75px; }
      .pos15 { top: 1050px; right: 150px; }
      .pos16 { top: 1125px; right: 225px; }
      .pos17 { top: 1200px; right: 150px; }
      .pos18 { top: 1275px; right: 75px; }
      .pos19 { top: 1350px; right: 0px; }
      .pos20 { top: 1425px; right: 75px; }
    }
  </style>
</head>
<body>

  <div class="container" id="iconContainer"></div>

  <script>
    (function() {
      const container = document.getElementById('iconContainer');
      
      const checkIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" style="width: 45%; height: 45%;"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>`;
      const lockIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 40%; height: 40%;"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>`;
      
      // Endi massiv 20 ta elementdan iborat
      const cardDefinitions = [
        { type: 'green-check', label: 'Yashil karta, tasdiq' },
        { type: 'pink-noicon', label: 'Pushti karta, ikonka yo\'q' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' },
        { type: 'gray-lock', label: 'Kulrang karta, qulf' }
      ];

      // 20 tagacha position klasslari
      const positionClasses = [
        'pos1', 'pos2', 'pos3', 'pos4', 'pos5', 'pos6', 'pos7', 'pos8', 'pos9', 'pos10',
        'pos11', 'pos12', 'pos13', 'pos14', 'pos15', 'pos16', 'pos17', 'pos18', 'pos19', 'pos20'
      ];

      cardDefinitions.forEach((def, index) => {
        const div = document.createElement('div');
        div.className = `icon-box ${positionClasses[index]}`;
        
        if (def.type === 'green-check') {
          div.classList.add('green-card');
          div.innerHTML = checkIconSVG;
          div.setAttribute('aria-label', `Tugma ${index + 1}: yashil, tasdiq belgisi`);
        } else if (def.type === 'pink-noicon') {
          div.classList.add('pink-card');
          div.setAttribute('aria-label', `Tugma ${index + 1}: pushti, ikonka yo'q`);
        } else if (def.type === 'gray-lock') {
          div.classList.add('gray-lock');
          div.innerHTML = lockIconSVG;
          div.setAttribute('aria-label', `Tugma ${index + 1}: kulrang, qulf belgisi`);
        }
        
        div.setAttribute('role', 'button');
        div.setAttribute('tabindex', '0');
        div.setAttribute('title', def.label);
        
        div.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            div.click();
          }
        });
        
        div.addEventListener('click', () => {
          console.log(`Tugma ${index + 1} (${def.type}) bosildi`);
        });
        
        container.appendChild(div);
      });
    })();
  </script>
</body>
</html>
