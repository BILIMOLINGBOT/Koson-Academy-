<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Darslar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA style -->
  <meta name="theme-color" content="#4da3e2">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Cards Grid - Circular layout */
    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      max-width: 800px;
    }

    /* Card Styles - Circular */
    .card {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      color: white;
      transition: all 0.4s ease;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      position: relative;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 25px rgba(0,0,0,0.18);
    }

    .card.active {
      cursor: pointer;
      opacity: 1;
    }

    .card.locked {
      cursor: not-allowed;
      opacity: 0.7;
      filter: grayscale(0.3);
    }

    .card.locked:hover {
      transform: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    /* Card content */
    .card-number {
      font-size: 24px;
      font-weight: bold;
      opacity: 0.9;
    }

    .status-icon {
      font-size: 18px;
      margin-top: 3px;
    }

    /* Card states - Faqat moviy rang variantlari */
    .card.completed {
      background: linear-gradient(135deg, #3498db, #2980b9);
    }

    .card.in-progress {
      background: linear-gradient(135deg, #4da3e2, #3b82f6);
    }

    .card.locked-state {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
    }

    .card.next-available {
      background: linear-gradient(135deg, #4da3e2, #3b82f6);
      animation: pulse 2s infinite;
    }

    /* Pulse animation for next available lesson */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(77, 163, 226, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(77, 163, 226, 0); }
      100% { box-shadow: 0 0 0 0 rgba(77, 163, 226, 0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cards-grid {
        gap: 15px;
      }
      
      .card {
        width: 80px;
        height: 80px;
      }
      
      .card-number {
        font-size: 20px;
      }
      
      .status-icon {
        font-size: 14px;
      }
    }

    @media (max-width: 480px) {
      .card {
        width: 65px;
        height: 65px;
      }
      
      .card-number {
        font-size: 16px;
      }
      
      .status-icon {
        font-size: 12px;
      }
    }

    /* Loading animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeIn 0.6s ease forwards;
    }
  </style>
</head>
<body>

  <div class="cards-grid" id="cardsContainer">
    <!-- Cards will be generated by JavaScript -->
  </div>

  <script>
    // Darslar ma'lumotlari - ketma-ket ochilish
    const lessonsData = [
      { percent: 100, completed: true, unlocked: true },
      { percent: 100, completed: true, unlocked: true },
      { percent: 80, completed: false, unlocked: true },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false },
      { percent: 0, completed: false, unlocked: false }
    ];

    const cardsContainer = document.getElementById('cardsContainer');

    // Kartalarni yaratish
    function createCards() {
      // Keyingi ochiladigan darsni aniqlash
      let nextAvailableIndex = -1;
      
      lessonsData.forEach((lesson, index) => {
        if (lesson.unlocked && !lesson.completed && nextAvailableIndex === -1) {
          nextAvailableIndex = index;
        }
      });

      // Har bir dars uchun karta yaratish
      lessonsData.forEach((lesson, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-index', index);
        card.style.animationDelay = `${index * 0.05}s`;
        
        // Karta holatini aniqlash
        let cardClass = '';
        let statusIcon = '';
        
        if (lesson.completed) {
          cardClass = 'completed';
          statusIcon = '<i class="fas fa-check status-icon"></i>';
        } else if (lesson.unlocked) {
          if (index === nextAvailableIndex) {
            cardClass = 'next-available';
            statusIcon = '<i class="fas fa-play status-icon"></i>';
          } else {
            cardClass = 'in-progress';
            statusIcon = '<i class="fas fa-circle status-icon"></i>';
          }
        } else {
          cardClass = 'locked-state';
          statusIcon = '<i class="fas fa-lock status-icon"></i>';
        }
        
        card.classList.add(cardClass);
        
        // Agar dars ochiq bo'lsa, active qilish
        if (lesson.unlocked) {
          card.classList.add('active');
          card.onclick = () => {
            window.location.href = `dars${index + 1}.html`;
          };
        } else {
          card.classList.add('locked');
          card.onclick = () => {
            // Dars ochiq emasligi haqida xabar
            alert(`Iltimos, avval ${index}-darsni tugating!`);
          };
        }
        
        card.innerHTML = `
          <div class="card-number">${index + 1}</div>
          ${statusIcon}
        `;
        
        cardsContainer.appendChild(card);
      });
    }

    // Dasturni ishga tushirish
    window.onload = function() {
      createCards();
      
      // Test uchun: 3-darsdan keyin 4-darsni ochish
      // Haqiqiy loyihada bu ma'lumotlar bazasidan olinadi
      setTimeout(() => {
        // Bu faqat demo maqsadida
        if (lessonsData[2].percent >= 80) {
          // Agar 3-dars 80% dan ko'p bo'lsa, 4-darsni ochish
          simulateLessonCompletion(3);
        }
      }, 2000);
    };

    // Darsni tugatishni simulyatsiya qilish (demo uchun)
    function simulateLessonCompletion(lessonIndex) {
      if (lessonIndex >= 0 && lessonIndex < lessonsData.length) {
        lessonsData[lessonIndex].unlocked = true;
        
        // Karta holatini yangilash
        const card = document.querySelector(`.card[data-index="${lessonIndex}"]`);
        if (card) {
          card.classList.remove('locked', 'locked-state');
          card.classList.add('active', 'in-progress');
          
          // Status ikonkani yangilash
          const statusIcon = card.querySelector('.status-icon');
          if (statusIcon) {
            statusIcon.outerHTML = '<i class="fas fa-play status-icon"></i>';
          }
          
          // Karta rangini yangilash
          card.style.background = 'linear-gradient(135deg, #4da3e2, #3b82f6)';
          
          // Karta bosilganda dars sahifasiga o'tish
          card.onclick = () => {
            window.location.href = `dars${lessonIndex + 1}.html`;
          };
          
          // Xabar chiqarish
          setTimeout(() => {
            alert(`Tabriklaymiz! ${lessonIndex}-dars ochildi. Endi siz bu darsni boshlashingiz mumkin.`);
          }, 500);
        }
      }
    }

    // Darsni tugatish funksiyasi (haqiqiy loyihada bu serverga so'rov yuboradi)
    function completeLesson(lessonIndex) {
      if (lessonIndex >= 0 && lessonIndex < lessonsData.length) {
        lessonsData[lessonIndex].percent = 100;
        lessonsData[lessonIndex].completed = true;
        
        // Keyingi darsni ochish (agar mavjud bo'lsa)
        if (lessonIndex + 1 < lessonsData.length) {
          lessonsData[lessonIndex + 1].unlocked = true;
        }
        
        // Sahifani yangilash
        setTimeout(() => {
          location.reload();
        }, 1000);
      }
    }

    // PWA funksiyalari
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>

</body>
</html>
