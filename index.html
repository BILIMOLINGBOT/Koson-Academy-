<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Telefon uchun moslangan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #1a2226; /* Rasmga yaqin to'q fon */
      font-family: sans-serif;
      padding: 16px 0;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 320px;  /* telefon ekranida qulay kenglik */
      height: 620px;     /* balandlikni ham moslab qo'yamiz */
      margin: 0 auto;
      padding: 0 12px;   /* yon tomondan kichik nafas */
    }

    .icon-box {
      width: 60px;
      height: 60px;
      background-color: #4b585a;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      box-shadow: 0 8px 12px rgba(0,0,0,0.25); /* ozgina chuqurlik */
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-box:active {
      transform: scale(0.94);
      background-color: #5c6b6e;
    }

    .icon-box svg {
      width: 34px;
      height: 34px;
      fill: white;
      pointer-events: none; /* svg bosilganda qulay bo'lishi uchun */
    }

    /* Koordinatalar: mobil uchun qulay, markazga yaqin va egri chiziq bo'ylab */
    .pos1  { top: 0px;   right: 0px; }
    .pos2  { top: 65px;  right: 55px; }
    .pos3  { top: 130px; right: 110px; }
    .pos4  { top: 195px; right: 165px; }
    .pos5  { top: 260px; right: 110px; }
    .pos6  { top: 325px; right: 55px; }
    .pos7  { top: 390px; right: 0px; }
    .pos8  { top: 455px; right: 55px; }
    .pos9  { top: 520px; right: 110px; }
    .pos10 { top: 585px; right: 165px; }

    /* Kichik ekranlar (masalan, 360px dan past) uchun nozik sozlash */
    @media (max-width: 380px) {
      .container {
        height: 560px;
        max-width: 280px;
        padding: 0 8px;
      }
      .icon-box {
        width: 52px;
        height: 52px;
        border-radius: 14px;
      }
      .icon-box svg {
        width: 30px;
        height: 30px;
      }
      /* pozitsiyalarni biroz ixchamlashtiramiz */
      .pos1  { top: 0px;   right: 0px; }
      .pos2  { top: 58px;  right: 48px; }
      .pos3  { top: 116px; right: 96px; }
      .pos4  { top: 174px; right: 144px; }
      .pos5  { top: 232px; right: 96px; }
      .pos6  { top: 290px; right: 48px; }
      .pos7  { top: 348px; right: 0px; }
      .pos8  { top: 406px; right: 48px; }
      .pos9  { top: 464px; right: 96px; }
      .pos10 { top: 522px; right: 144px; }
    }

    /* Juda kichik ekranlar (masalan, 320px) */
    @media (max-width: 340px) {
      .container {
        height: 520px;
        max-width: 260px;
      }
      .icon-box {
        width: 48px;
        height: 48px;
      }
      .icon-box svg {
        width: 26px;
        height: 26px;
      }
      .pos1  { top: 0px;   right: 0px; }
      .pos2  { top: 54px;  right: 42px; }
      .pos3  { top: 108px; right: 84px; }
      .pos4  { top: 162px; right: 126px; }
      .pos5  { top: 216px; right: 84px; }
      .pos6  { top: 270px; right: 42px; }
      .pos7  { top: 324px; right: 0px; }
      .pos8  { top: 378px; right: 42px; }
      .pos9  { top: 432px; right: 84px; }
      .pos10 { top: 486px; right: 126px; }
    }
  </style>
</head>
<body>
  <div class="container" role="group" aria-label="Tualet qog'ozi piktogrammalari">
    <!-- SVG ikonasi bilan birgalikda 10 ta tugma (JS orqali yaratiladi) -->
  </div>

  <script>
    (function() {
      const container = document.querySelector('.container');
      if (!container) return;

      // SVG ikonasi (tualet qog'ozi tasviri)
      const svgIcon = `
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M19 8c-1.66 0-3 1.34-3 3v2h2v-2c0-.55.45-1 1-1h4v-2h-4zM5 8c-1.66 0-3 1.34-3 3v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2H5c-.55 0-1-.45-1-1v-2c0-.55.45-1 1-1h12V8H5z"/>
        </svg>`;

      // Pozitsiya klasslari (mobil uchun sozlangan)
      const positions = [
        'pos1', 'pos2', 'pos3', 'pos4', 'pos5',
        'pos6', 'pos7', 'pos8', 'pos9', 'pos10'
      ];

      // Har bir tugma uchun div yaratamiz
      positions.forEach((pos, index) => {
        const box = document.createElement('div');
        box.className = `icon-box ${pos}`;
        box.setAttribute('role', 'button');
        box.setAttribute('tabindex', '0');
        box.setAttribute('aria-label', `Tualet qog'ozi belgisi ${index + 1}`);
        box.innerHTML = svgIcon;
        
        // Bosish yoki Enter/Space bosilganda oddiy reaksiya (ixtiyoriy)
        box.addEventListener('click', () => {
          // Bu yerda kerakli amalni bajarish mumkin
          console.log(`Tugma ${index + 1} bosildi`);
        });
        
        // Klaviatura bilan ishlash uchun
        box.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            box.click();
          }
        });

        container.appendChild(box);
      });
    })();
  </script>

  <p style="color: #6b7a7e; text-align: center; margin-top: 12px; font-size: 14px; letter-spacing: 0.3px;">
    Telefon uchun qulay joylashuv
  </p>
</body>
</html>
