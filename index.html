<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Path UI</title>
  <style>
    :root {
      --bg-color: #08080c;
      --green-top: linear-gradient(135deg, #7be4ad, #41c183);
      --green-side: #2e9f65;
      --purple-top: linear-gradient(135deg, #a77bf3, #7c3aed);
      --purple-side: #6d28d9;
      --gray-top: linear-gradient(135deg, #ffffff, #d1d5db);
      --gray-side: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Dropdown Header */
    .header-badge {
      background: rgba(22, 25, 35, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 18px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-badge .target-icon {
      width: 20px;
      height: 20px;
      background: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-badge .title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.2px;
    }

    .header-badge .chevron {
      color: #9ca3af;
      margin-left: 2px;
    }

    /* Path Container */
    .path-container {
      position: relative;
      width: 360px;
      height: 760px;
      margin-top: 20px;
    }

    /* Cube Base Item */
    .cube-item {
      position: absolute;
      width: 90px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 3D Top Surface */
    .cube-top {
      position: absolute;
      width: 76px;
      height: 76px;
      border-radius: 20px;
      transform: rotate(45deg) scaleY(0.55);
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        inset 0 3px 5px rgba(255, 255, 255, 0.7),
        inset 0 -3px 5px rgba(0, 0, 0, 0.2);
    }

    /* Icon inside top face */
    .cube-icon {
      transform: scaleY(1.8) rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3D Side Walls */
    .cube-sides {
      position: absolute;
      top: 21px;
      width: 76px;
      height: 40px;
      z-index: 2;
      display: flex;
    }

    .side-left, .side-right {
      flex: 1;
      height: 100%;
    }

    .side-left {
      border-bottom-left-radius: 14px;
      filter: brightness(0.9);
    }

    .side-right {
      border-bottom-right-radius: 14px;
      filter: brightness(0.75);
    }

    /* Gradient Tail (Vertical Blur Fade) */
    .cube-tail {
      position: absolute;
      top: 25px;
      width: 76px;
      height: 75px;
      border-radius: 0 0 16px 16px;
      z-index: 1;
      opacity: 0.85;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 10%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 10%, rgba(0,0,0,0) 100%);
    }

    /* --- Completed (Green) --- */
    .cube-item.completed .cube-top {
      background: var(--green-top);
    }
    .cube-item.completed .side-left,
    .cube-item.completed .side-right {
      background: var(--green-side);
    }
    .cube-item.completed .cube-tail {
      background: linear-gradient(to bottom, var(--green-side), transparent);
    }
    .cube-item.completed .cube-icon {
      color: #125432;
    }

    /* --- Active (Purple) --- */
    .cube-item.active .cube-top {
      background: var(--purple-top);
      box-shadow: 
        inset 0 3px 6px rgba(255, 255, 255, 0.8),
        0 0 30px rgba(167, 123, 243, 0.5);
    }
    .cube-item.active .side-left,
    .cube-item.active .side-right {
      background: var(--purple-side);
    }
    .cube-item.active .cube-tail {
      background: linear-gradient(to bottom, var(--purple-side), transparent);
    }

    /* Floating START Tooltip */
    .start-tooltip {
      position: absolute;
      top: -38px;
      background: #374151;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.6px;
      padding: 6px 18px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
      animation: float 2s infinite ease-in-out;
    }

    .start-tooltip::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid #374151;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* --- Locked (Gray) --- */
    .cube-item.locked .cube-top {
      background: var(--gray-top);
    }
    .cube-item.locked .side-left,
    .cube-item.locked .side-right {
      background: var(--gray-side);
    }
    .cube-item.locked .cube-tail {
      background: linear-gradient(to bottom, var(--gray-side), transparent);
    }
    .cube-item.locked .cube-icon {
      color: #4b5563;
    }

    /* Top Star Glow */
    .top-glow {
      position: absolute;
      top: -15px;
      left: 215px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>

    <div class="cube-item locked" style="left: 170px; top: 230px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 6. Gray Locked -->
    <div class="cube-item locked" style="left: 95px; top: 140px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          </svg>
        </div>
      </div>
      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 7. Gray Locked -->
    <div class="cube-item locked" style="left: 170px; top: 50px;">
      <div class="cube-top">
        <div class="cube-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 8a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>

      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

    <!-- 8. Top Star Cube -->
    <div class="cube-item locked" style="left: 235px; top: -30px;">

          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">

      <div class="cube-sides"><div class="side-left"></div><div class="side-right"></div></div>
      <div class="cube-tail"></div>
    </div>

  </div>

</body>
</html>
