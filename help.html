<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Yordam — U platformasi</title>
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent: #0a84ff;
      --divider: rgba(255, 255, 255, 0.12);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      /* Telegram fullscreen tugmalari uchun qo'shimcha bo'shliq */
      --tg-fullscreen-offset: 90px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 17px;
      line-height: 1.55;
      letter-spacing: -0.01em;
      padding:
        calc(var(--safe-top) + var(--tg-fullscreen-offset))
        calc(var(--safe-right) + 20px)
        calc(var(--safe-bottom) + 40px)
        calc(var(--safe-left) + 20px);
      max-width: 720px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:active {
      opacity: 0.6;
    }

    header.hero {
      padding: 0 0 24px;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 28px;
    }

    header.hero h1 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    header.hero p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }

    /* Telefon raqam kartasi */
    .help-card {
      display: block;
      background: rgba(10, 132, 255, 0.10);
      border: 1px solid rgba(10, 132, 255, 0.25);
      border-radius: 16px;
      padding: 22px 20px;
      margin-bottom: 20px;
      color: var(--text);
      transition: background 0.15s ease;
    }

    .help-card:active {
      background: rgba(10, 132, 255, 0.20);
    }

    .help-label {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .help-phone {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .help-phone span {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.25;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .help-phone svg {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      color: var(--accent);
    }

    .note {
      margin: 18px 0 4px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--muted);
      border-radius: 8px;
      font-size: 15px;
      color: var(--muted);
    }

    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--divider);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    footer .slogan {
      margin-top: 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1>Yordam</h1>
    <p>Savollaringiz bormi? Biz bilan bogʻlaning — yordam berishga tayyormiz.</p>
  </header>

  <main>
    <a class="help-card" href="tel:+998776681719" aria-label="Qoʻngʻiroq qilish: +998 77 668 17 19">
      <span class="help-label">Qoʻllab-quvvatlash xizmati</span>
      <span class="help-phone">
        <span>+998 77 668 17 19</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </span>
    </a>

    <div class="note">Raqamga bosish orqali toʻgʻridan-toʻgʻri qoʻngʻiroq qilishingiz mumkin.</div>
  </main>

  <footer>
    <p>&copy; 2026 U platformasi. Barcha huquqlar himoyalangan.</p>
    <p class="slogan">Fikr bildiring. Oʻqing. Fikr almashing.</p>
  </footer>

</body>
</html>
