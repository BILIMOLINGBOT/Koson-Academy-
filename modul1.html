<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Nemis tilini o'rganish · All-in-One</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #333333;
            --accent-black: #000000;
            --chip-bg: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            display: none;
            flex-direction: column;
            padding: 40px 20px;
        }
        .app-container.active { display: flex; }
        .card-stack { flex: 1; display: flex; flex-direction: column; gap: 20px; justify-content: center; }
        .flashcard { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 32px; padding: 25px; }
        .flag-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .flag-img { width: 45px; height: 30px; border-radius: 4px; object-fit: cover; background: #ddd; }
        .part-of-speech { color: var(--text-secondary); font-weight: 700; letter-spacing: 1px; font-size: 16px; text-transform: uppercase; }
        .word-main { font-size: 38px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
        .audio-icon { color: var(--text-secondary); cursor: pointer; font-size: 28px; }
        .audio-icon:hover { color: var(--text-primary); }
        .translation-word { font-size: 26px; font-weight: 700; line-height: 1.3; }
        .next-btn, .check-btn {
            width: 100%;
            height: 65px;
            background: white;
            color: black;
            border: none;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            margin-top: 20px;
        }
        .next-btn:active, .check-btn:active { transform: scale(0.96); }
        .next-btn:disabled, .check-btn:disabled { background: #333; color: #666; cursor: not-allowed; pointer-events: none; opacity: 0.7; }
        .header { text-align: center; margin-bottom: 30px; }
        .q-num { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
        .prompt-text { font-size: 28px; font-weight: 700; }
        .game-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .zone {
            min-height: 80px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 15px;
        }
        .bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .chip, .token {
            background: var(--chip-bg);
            padding: 12px 18px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-primary);
            font-weight: 500;
        }
        .chip:active, .token:active { transform: scale(0.95); background: #3a3a3a; }
        .token.disabled { opacity: 0.15; pointer-events: none; }
        .result-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            color: black;
            border-radius: 30px 30px 0 0;
            padding: 40px 25px;
            transform: translateY(100%);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .result-panel.active { transform: translateY(0); }
        .res-title { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
        .res-msg { font-size: 18px; margin-bottom: 25px; color: #444; }
        #res-btn { background: black !important; color: white !important; }
        .trophy-icon { font-size: 80px; color: gold; margin-bottom: 20px; }
    </style>
</head>
<body>

<!-- 1. FLASHCARDS (nemischa lug'at) -->
<div id="screen1" class="app-container active">
    <div class="header"><div class="q-num">LUG'AT BOYITISH · NEMISCHA</div></div>
    <div class="card-stack">
        <div class="flashcard">
            <div class="flag-row">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg" class="flag-img" alt="Germany">
                <span class="part-of-speech" id="f-pos">PRONOUN</span>
            </div>
            <div class="word-main">
                <span id="f-eng">Er</span>
                <i class="fas fa-volume-up audio-icon" onclick="speak()"></i>
            </div>
        </div>
        <div class="flashcard">
            <div class="flag-row">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Flag_of_Uzbekistan.svg" class="flag-img" alt="Uzbekistan">
            </div>
            <div class="translation-word" id="f-uzb">u (erkak)</div>
        </div>
    </div>
    <button class="next-btn" onclick="nextFlashcard()">
        Keyingi <i class="fas fa-arrow-right"></i>
    </button>
</div>

<!-- 2. SO'Z O'YINI (nemischa) -->
<div id="screen2" class="app-container">
    <div class="header">
        <div class="q-num" id="g1-count">1 / 17</div>
        <div class="prompt-text" id="g1-prompt">U (erkak)</div>
    </div>
    <div class="game-content">
        <div class="zone" id="g1-zone"></div>
        <div class="bank" id="g1-bank"></div>
    </div>
    <button class="check-btn" id="g1-check" onclick="checkWordGame()" disabled>Tekshirish</button>
</div>

<!-- 3. GAP TUZISH (nemischa) -->
<div id="screen3" class="app-container">
    <div class="header">
        <div class="q-num" id="g2-count">1 / 5</div>
        <div class="prompt-text" id="g2-prompt">U o'qituvchi.</div>
    </div>
    <div class="game-content">
        <div class="zone" id="g2-zone"></div>
        <div class="bank" id="g2-bank"></div>
    </div>
    <button class="check-btn" id="g2-check" onclick="checkSentenceGame()" disabled>Tekshirish</button>
</div>

<!-- FINAL SCREEN -->
<div id="screen-final" class="app-container" style="text-align: center; justify-content: center;">
    <i class="fas fa-trophy trophy-icon"></i>
    <h1 style="font-size: 32px; margin-bottom: 10px;">Tabriklaymiz!</h1>
    <p style="color: var(--text-secondary); margin-bottom: 40px;">Nemis tili bosqichlarini muvaffaqiyatli yakunladingiz.</p>
    <button class="next-btn" onclick="location.reload()">Qaytadan boshlash</button>
</div>

<!-- GLOBAL RESULT PANEL -->
<div class="result-panel" id="res-panel">
    <div id="res-title" class="res-title">Ajoyib!</div>
    <div id="res-msg" class="res-msg">To'g'ri javob.</div>
    <button class="next-btn" id="res-btn">Davom etish</button>
</div>

<script>
    // ---------- NEMISCHA LUG'AT MA'LUMOTLARI (17 ta) ----------
    const vocabData = [
        { pos: "PRONOUN", eng: "Er", uzb: "u (erkak)" },
        { pos: "VERB", eng: "ist", uzb: "-dir / bo‘lmoq" },
        { pos: "NOUN", eng: "Lehrer", uzb: "o‘qituvchi (erkak)" },
        { pos: "PRONOUN", eng: "Sie", uzb: "u (ayol)" },
        { pos: "VERB", eng: "ist", uzb: "-dir / bo‘lmoq" },
        { pos: "NOUN", eng: "Studentin", uzb: "talaba qiz" },
        { pos: "PRONOUN", eng: "Es", uzb: "u / bu" },
        { pos: "VERB", eng: "ist", uzb: "-dir / bo‘lmoq" },
        { pos: "ADJECTIVE", eng: "kalt", uzb: "sovuq" },
        { pos: "PHRASE", eng: "Er", uzb: "u (erkak)" },
        { pos: "VERB", eng: "ist", uzb: "-dir / bo‘lmoq" },
        { pos: "NOUN", eng: "Lehrer", uzb: "o‘qituvchi (erkak)" },
        { pos: "PHRASE", eng: "Sie", uzb: "u (ayol)" },
        { pos: "VERB", eng: "ist", uzb: "-dir / bo‘lmoq" },
        { pos: "NOUN", eng: "Studentin", uzb: "talaba qiz" },
        { pos: "PHRASE", eng: "Es", uzb: "u / bu" },
        { pos: "ADJECTIVE", eng: "kalt", uzb: "sovuq" }
    ];

    // So'z o'yini uchun alohida (17 ta element)
    const wordGameData = [
        { uz: "U (erkak)", correct: ["Er"] },
        { uz: "-dir / bo‘lmoq", correct: ["ist"] },
        { uz: "O‘qituvchi (erkak)", correct: ["Lehrer"] },
        { uz: "U (ayol)", correct: ["Sie"] },
        { uz: "-dir / bo‘lmoq", correct: ["ist"] },
        { uz: "Talaba qiz", correct: ["Studentin"] },
        { uz: "U / bu", correct: ["Es"] },
        { uz: "-dir / bo‘lmoq", correct: ["ist"] },
        { uz: "Sovuq", correct: ["kalt"] },
        { uz: "U (erkak)", correct: ["Er"] },
        { uz: "-dir / bo‘lmoq", correct: ["ist"] },
        { uz: "O‘qituvchi (erkak)", correct: ["Lehrer"] },
        { uz: "U (ayol)", correct: ["Sie"] },
        { uz: "-dir / bo‘lmoq", correct: ["ist"] },
        { uz: "Talaba qiz", correct: ["Studentin"] },
        { uz: "U / bu", correct: ["Es"] },
        { uz: "Sovuq", correct: ["kalt"] }
    ];

    // Gap tuzish (5 ta gap, flashcardsga mos)
    const sentenceData = [
        { uz: "U o'qituvchi.", correct: ["Er", "ist", "Lehrer."] },
        { uz: "U talaba qiz.", correct: ["Sie", "ist", "Studentin."] },
        { uz: "Havo sovuq.", correct: ["Es", "ist", "kalt."] },
        { uz: "U o'qituvchi.", correct: ["Er", "ist", "Lehrer."] },
        { uz: "U talaba qiz.", correct: ["Sie", "ist", "Studentin."] }
    ];

    // distraktorlar (aralash so'zlar uchun)
    const distractors = ["Wo", "Das", "Schule", "wir", "ihr", "du", "heiß", "bin", "kalt", "Lehrerin", "Student"];

    // ---------- STATE ----------
    let currentFlash = 0;
    let g1Idx = 0;
    let g2Idx = 0;
    let builtSeq = [];
    let usedFlags = [];
    let currentBank = [];

    // ---------- EKRAN BOSHQARISH ----------
    function showScreen(id) {
        document.querySelectorAll('.app-container').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function togglePanel(show, title = "", msg = "", callback = null) {
        const panel = document.getElementById('res-panel');
        if (show) {
            document.getElementById('res-title').textContent = title;
            document.getElementById('res-msg').textContent = msg;
            panel.classList.add('active');
            document.getElementById('res-btn').onclick = () => {
                panel.classList.remove('active');
                if (callback) callback();
            };
        } else {
            panel.classList.remove('active');
        }
    }

    // ---------- FLASHCARD LOGIC ----------
    function nextFlashcard() {
        if (currentFlash < vocabData.length - 1) {
            currentFlash++;
            const item = vocabData[currentFlash];
            document.getElementById('f-pos').textContent = item.pos;
            document.getElementById('f-eng').textContent = item.eng;
            document.getElementById('f-uzb').textContent = item.uzb;
        } else {
            // flashcards tugadi -> so'z o'yiniga o'tamiz
            showScreen('screen2');
            initWordGame();
        }
    }

    function speak() {
        const text = document.getElementById('f-eng').textContent;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE';  // nemischa talaffuz
        window.speechSynthesis.speak(u);
    }

    // ---------- WORD GAME LOGIC ----------
    function initWordGame() {
        if (g1Idx >= wordGameData.length) {
            // barcha so'z o'yinlari tugadi -> gap tuzishga o'tamiz
            showScreen('screen3');
            initSentenceGame();
            return;
        }
        const curr = wordGameData[g1Idx];
        document.getElementById('g1-count').textContent = `${g1Idx + 1} / ${wordGameData.length}`;
        document.getElementById('g1-prompt').textContent = curr.uz;
        
        let words = [...curr.correct];
        // distractor qo'shamiz (agar mavjud bo'lsa)
        if (distractors.length > 0) {
            words.push(distractors[Math.floor(Math.random() * distractors.length)]);
        }
        
        // aralashtirish
        for (let i = words.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [words[i], words[j]] = [words[j], words[i]];
        }
        
        builtSeq = [];
        usedFlags = new Array(words.length).fill(false);
        window.currentBank = words;
        renderGame('g1');
    }

    function renderGame(prefix) {
        const zone = document.getElementById(`${prefix}-zone`);
        const bank = document.getElementById(`${prefix}-bank`);
        const btn = document.getElementById(`${prefix}-check`);
        
        zone.innerHTML = '';
        builtSeq.forEach((item, i) => {
            const d = document.createElement('div');
            d.className = 'chip';
            d.textContent = item.word;
            d.onclick = () => {
                usedFlags[item.idx] = false;
                builtSeq.splice(i, 1);
                renderGame(prefix);
            };
            zone.appendChild(d);
        });

        bank.innerHTML = '';
        window.currentBank.forEach((word, i) => {
            if (!usedFlags[i]) {
                const t = document.createElement('div');
                t.className = 'token';
                t.textContent = word;
                t.onclick = () => {
                    usedFlags[i] = true;
                    builtSeq.push({word, idx: i});
                    renderGame(prefix);
                };
                bank.appendChild(t);
            }
        });

        const isComplete = builtSeq.length > 0;
        btn.disabled = !isComplete;
        btn.style.opacity = isComplete ? '1' : '0.6';
    }

    function checkWordGame() {
        if (g1Idx >= wordGameData.length) return;
        const correct = wordGameData[g1Idx].correct;
        const isCorrect = builtSeq.length === correct.length && builtSeq.every((v, i) => v.word === correct[i]);
        
        togglePanel(true, isCorrect ? "Barakalla!" : "Xato!", isCorrect ? "To'g'ri topdingiz." : "To'g'ri javob: " + correct.join(' '), () => {
            g1Idx++;
            if (g1Idx < wordGameData.length) {
                initWordGame();
            } else {
                showScreen('screen3');
                initSentenceGame();
            }
        });
    }

    // ---------- SENTENCE GAME LOGIC ----------
    function initSentenceGame() {
        if (g2Idx >= sentenceData.length) {
            showScreen('screen-final');
            return;
        }
        const curr = sentenceData[g2Idx];
        document.getElementById('g2-count').textContent = `${g2Idx + 1} / ${sentenceData.length}`;
        document.getElementById('g2-prompt').textContent = curr.uz;
        
        let words = [...curr.correct];
        for (let i = words.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [words[i], words[j]] = [words[j], words[i]];
        }
        
        builtSeq = [];
        usedFlags = new Array(words.length).fill(false);
        window.currentBank = words;
        renderGame('g2');
    }

    function checkSentenceGame() {
        if (g2Idx >= sentenceData.length) return;
        const correct = sentenceData[g2Idx].correct;
        const isCorrect = builtSeq.length === correct.length && builtSeq.every((v, i) => v.word === correct[i]);

        togglePanel(true, isCorrect ? "Zo'r!" : "E'tiborli bo'ling!", isCorrect ? "Gap to'g'ri tuzildi." : "To'g'ri tartib: " + correct.join(' '), () => {
            g2Idx++;
            if (g2Idx < sentenceData.length) {
                initSentenceGame();
            } else {
                showScreen('screen-final');
            }
        });
    }

    // ---------- BOSHLANG'ICH O'RNATISH ----------
    const firstItem = vocabData[0];
    document.getElementById('f-pos').textContent = firstItem.pos;
    document.getElementById('f-eng').textContent = firstItem.eng;
    document.getElementById('f-uzb').textContent = firstItem.uzb;

    // Agar foydalanuvchi sahifani yangilasa, flashcards boshidan boshlanadi.
    // Barcha tugmalar va holat to'g'ri ishlaydi.
    window.currentBank = [];
</script>

</body>
</html>
