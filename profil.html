<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - L.uz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        .mobile-container{width:100%;max-width:420px;padding:20px 20px 200px;display:flex;flex-direction:column;align-items:center}
        .profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:60px 0 20px}
        .profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#1c1c1e;border:3px solid #1c1c1e}
        /* Avatar fallback (harf) */
        .avatar-letter{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2c2c2e 0%,#1c1c1e 100%);color:#fff;font-weight:700;text-transform:uppercase;user-select:none;border:3px solid #1c1c1e}
        .profile-pic.avatar-letter{font-size:52px;width:120px;height:120px;border-radius:50%}
        .name{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center;cursor:pointer;transition:opacity .2s}
        .name:active{opacity:.7}
        .last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}
        .stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
        .stat-item{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
        .stat-item:active{opacity:.7}
        .stat-divider{width:1px;background:#2c2c2e;height:40px;align-self:center}
        .stat-number{font-size:20px;font-weight:600;margin-bottom:6px}
        .stat-label{color:#8e8e93;font-size:14px}
        .action-buttons{display:flex;width:100%;gap:10px;margin-bottom:20px}
        .btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:100px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
        .btn-edit:active{opacity:.8;transform:scale(.98)}
        .btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .btn-settings{background:#1c1c1e;border:none;border-radius:50%;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
        .btn-settings:active{transform:scale(.95) rotate(45deg);background:#2c2c2e}
        .btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .content-area{color:#8e8e93;font-size:16px;text-align:center;width:100%;padding:20px 0}
        .empty-icon{width:60px;height:60px;margin:0 auto 16px;border:2px solid #3f3f46;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3f3f46}
        .empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .post-btn{position:fixed;right:20px;bottom:110px;z-index:60;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;letter-spacing:-.01em;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease}
        .post-btn:active{transform:scale(.94);box-shadow:0 4px 12px rgba(255,255,255,.1),0 1px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
        .post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .composer-overlay.show{opacity:1;pointer-events:auto}
        .composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
        .composer.show{transform:translate(-50%,0)}
        .composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .composer-title{font-size:17px;font-weight:700}
        .composer-close{background:#1c1c1e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;transition:transform .2s,background .2s}
        .composer-close:active{transform:scale(.9);background:#2c2c2e}
        .composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .composer-body{display:flex;gap:12px;margin-bottom:16px}
        .composer-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;font-size:16px}
        .composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
        .composer-input::placeholder{color:#5a5a5e}
        .composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
        .composer-preview.show{display:block}
        .composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
        .composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
        .composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
        .composer-attach-group{display:flex;gap:8px}
        .composer-attach{background:#1c1c1e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .2s,transform .2s}
        .composer-attach:active{transform:scale(.92);background:#2c2c2e}
        .composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s}
        .composer-submit:active{transform:scale(.95)}
        .composer-submit:disabled{opacity:.4;cursor:not-allowed}
        .feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px}
        .post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;border-bottom:1px solid #2c2c2e}
        .post-item:last-child{border-bottom:none}
        @keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;cursor:pointer;font-size:16px}
        .post-avatar.avatar-letter{border:none}
        .post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .post-user{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:opacity .15s}
        .post-user:active{opacity:.6}
        .post-time{font-size:12px;color:#8e8e93;margin-top:1px}
        .post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        .post-image{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}
        .post-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;background:#000}
        .post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:6px 4px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:14px;text-align:left}
        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        @keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
        .act-btn.saved{color:#fff}
        .act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .comments-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:110;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .comments-overlay.show{opacity:1;pointer-events:auto}
        .comments-panel{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;height:75vh;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:111;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
        .comments-panel.show{transform:translate(-50%,0)}
        .comments-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #1f1f22;flex-shrink:0}
        .comments-title{font-size:16px;font-weight:700}
        .comments-list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
        .comments-empty{text-align:center;color:#5a5a5e;font-size:14px;padding:40px 0}
        .comment-item{display:flex;gap:10px;animation:postIn .3s ease both}
        .comment-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;font-size:13px;cursor:pointer}
        .comment-avatar.avatar-letter{border:none}
        .comment-body{flex:1;min-width:0}
        .comment-top{display:flex;align-items:baseline;gap:8px}
        .comment-user{font-size:13px;font-weight:600;cursor:pointer}
        .comment-user:active{opacity:.6}
        .comment-time{font-size:11px;color:#5a5a5e}
        .comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;margin-top:3px;word-break:break-word;white-space:pre-wrap}
        .comment-actions{display:flex;gap:16px;margin-top:8px;align-items:center}
        .comment-action-btn{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 6px;display:flex;align-items:center;gap:5px;border-radius:8px;transition:transform .15s,background .15s,color .2s}
        .comment-action-btn:active{transform:scale(.94);background:rgba(255,255,255,.06)}
        .comment-action-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s,stroke .2s}
        .comment-action-btn.liked{color:#ff2d55}
        .comment-action-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .comment-action-count{font-variant-numeric:tabular-nums}
        .comment-replies{margin-top:10px;padding-left:12px;border-left:2px solid #1f1f22;display:flex;flex-direction:column;gap:12px}
        .comment-reply-item{display:flex;gap:8px}
        .comment-reply-item .comment-avatar{width:26px;height:26px;font-size:11px}
        .comment-reply-item .comment-user{font-size:12px}
        .comment-reply-item .comment-text{font-size:13px}
        .comments-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1f1f22;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:#0a0a0a}
        .comments-input{flex:1;background:#1c1c1e;border:none;border-radius:20px;padding:10px 14px;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4}
        .comments-input::placeholder{color:#5a5a5e}
        .comments-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,opacity .2s}
        .comments-send:active{transform:scale(.9)}
        .comments-send:disabled{opacity:.4;cursor:not-allowed}
        .comments-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .reply-indicator{font-size:12px;color:#0a84ff;padding:4px 20px 8px;display:none;align-items:center;justify-content:space-between;background:#0a0a0a}
        .reply-indicator.show{display:flex}
        .reply-indicator button{background:none;border:none;color:#8e8e93;font-size:12px;cursor:pointer;font-family:inherit}
        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
        .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
        .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 8px;transition:transform .15s ease,opacity .15s ease;cursor:pointer;background:none;border:none;font-family:inherit;flex:1}
        .nav-btn:active{transform:scale(.85);opacity:.7}
        .nav-active{color:#fff}.nav-inactive{color:#a1a1aa}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
        .nav-btn .nav-label{font-size:10px;font-weight:500}
        .nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e;font-size:11px}
        #otherProfileActions .btn-message{flex:1;background:#1c1c1e;color:#fff}
        #otherProfileActions .btn-message svg{stroke:#fff}
        .toast{position:fixed;left:50%;bottom:200px;transform:translate(-50%,20px);background:#1c1c1e;color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;border:1px solid #2c2c2e;box-shadow:0 8px 30px rgba(0,0,0,.6);white-space:nowrap}
        .toast.show{opacity:1;transform:translate(-50%,0)}
        .back-btn{position:fixed;top:20px;left:20px;z-index:70;width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:transform .15s,background .2s}
        .back-btn:active{transform:scale(.9);background:#2c2c2e}
        .back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
</head>
<body>

<button class="back-btn" id="backBtn" aria-label="Orqaga">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
</button>

<div class="mobile-container">
    <div class="profile-pic-wrapper">
        <img id="userPhoto" src="" alt="Profil rasmi" class="profile-pic">
    </div>
    <h1 class="name" id="userName">Yuklanmoqda...</h1>
    <p class="last-seen" id="userStatus">Profil</p>
    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="postsStat"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>
    <div class="action-buttons">
        <div id="ownProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="editBtn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Tahrirlash</button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
        <div id="otherProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="subscribeBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>Obuna bo'lish</button>
            <button class="btn-edit btn-message" id="messageBtn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Xabar</button>
        </div>
    </div>
    <div class="content-area" id="contentArea">
        <div class="empty-icon" id="emptyIcon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <p id="contentText">Hali post yo'q</p>
    </div>
</div>

<button class="post-btn" id="postBtn" aria-label="Post yozish"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Post</button>

<div class="composer-overlay" id="composerOverlay"></div>
<div class="composer" id="composer">
    <div class="composer-header"><span class="composer-title">Yangi post</span><button class="composer-close" id="composerClose" aria-label="Yopish"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="composer-body"><img id="composerAvatar" class="composer-avatar" src="" alt="Avatar"><textarea class="composer-input" id="composerInput" placeholder="Nima haqida o'ylayapsiz?" rows="1"></textarea></div>
    <div class="composer-preview" id="composerPreview"><img id="previewImg" src="" alt="Preview" style="display:none"><video id="previewVid" src="" controls playsinline style="display:none"></video><button class="remove-img" id="removeImg" aria-label="O'chirish"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="composer-actions">
        <div class="composer-attach-group">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <input type="file" id="videoInput" accept="video/*" hidden>

<script>
/* ============================================================
   L.uz USER DB (shared with authorization.html)
   ============================================================ */
const DB = {
    USERS_KEY: 'luz_users',
    SESSION_KEY: 'luz_current_user',
    getUsers(){ try{ return JSON.parse(localStorage.getItem(this.USERS_KEY)) || []; }catch{ return []; } },
    saveUsers(users){ localStorage.setItem(this.USERS_KEY, JSON.stringify(users)); },
    findUser(userId){ return this.getUsers().find(u => String(u.userId) === String(userId)) || null; },
    isUsernameTaken(username){
        const users = this.getUsers();
        const lower = username.toLowerCase();
        return users.some(u => u.username.toLowerCase() === lower);
    },
    createUser(userData){
        const users = this.getUsers();
        if (users.some(u => u.username.toLowerCase() === userData.username.toLowerCase())) {
            return { success: false, error: 'USERNAME_TAKEN' };
        }
        const userId = `L.uz@${userData.username}`;
        if (users.some(u => u.userId === userId)) {
            return { success: false, error: 'ID_TAKEN' };
        }
        const newUser = { ...userData, userId, createdAt: new Date().toISOString() };
        users.push(newUser);
        this.saveUsers(users);
        return { success: true, user: newUser };
    },
    setSession(userId){ localStorage.setItem(this.SESSION_KEY, userId); },
    getCurrentUser(){
        const id = localStorage.getItem(this.SESSION_KEY);
        if (!id) return null;
        return this.getUsers().find(u => u.userId === id) || null;
    }
};

/* ============================================================
   POST STORE
   ============================================================ */
const POST_STORE_KEY='tg_feed_posts_v1';

const PostStore = {
    _cache: null,
    _load(){
        if(this._cache!==null) return this._cache;
        try{
            const raw=localStorage.getItem(POST_STORE_KEY);
            this._cache = raw ? JSON.parse(raw) : [];
            if(!Array.isArray(this._cache)) this._cache=[];
        }catch(e){ this._cache=[]; }
        return this._cache;
    },
    _save(){
        try{ localStorage.setItem(POST_STORE_KEY, JSON.stringify(this._cache||[])); }catch(e){ console.warn('PostStore save failed',e); }
    },
    all(){ return this._load().slice(); },
    byUser(userId){
        const all=this._load();
        if(!userId) return all.slice();
        return all.filter(p=>String(p.userId)===String(userId));
    },
    getById(id){ return this._load().find(p=>p.id===id) || null; },
    add(post){
        const list=this._load();
        list.unshift(post);
        this._cache=list;
        this._save();
        return post;
    },
    update(id, patch){
        const list=this._load();
        const i=list.findIndex(p=>p.id===id);
        if(i<0) return null;
        list[i]=Object.assign({},list[i],patch);
        this._cache=list;
        this._save();
        return list[i];
    },
    remove(id){
        const list=this._load().filter(p=>p.id!==id);
        this._cache=list;
        this._save();
    }
};

/* ============================================================
   SESSION / USER
   ============================================================ */
const currentUser = DB.getCurrentUser();
if (!currentUser) {
    window.location.replace('authorization.html');
    throw new Error('No session');
}

// Qaysi profil ochilgan?
const profileUserId = new URLSearchParams(location.search).get('id');
const targetUserId = profileUserId || currentUser.userId;
const isOwn = String(targetUserId) === String(currentUser.userId);

const profileOwner = isOwn ? currentUser : DB.findUser(targetUserId);

if (!profileOwner) {
    // Foydalanuvchi topilmadi
    document.getElementById('userName').textContent = 'Foydalanuvchi topilmadi';
    document.getElementById('userStatus').textContent = 'ID: ' + targetUserId;
    document.getElementById('contentArea').innerHTML = '<div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><p>Bunday foydalanuvchi mavjud emas</p>';
    document.getElementById('postBtn').style.display = 'none';
}

/* ============================================================
   HELPERS
   ============================================================ */
const AVATAR_COLORS = ['#ff2d55','#ff9500','#ffcc00','#34c759','#00c7be','#30b0c7','#007aff','#5856d6','#af52de','#ff3b30'];

function hashString(str){
    let h = 0;
    for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
    return Math.abs(h);
}

function getAvatarLetter(user){
    const name = user ? ([user.firstName, user.lastName].filter(Boolean).join(' ') || user.username || '') : '';
    return (name.trim()[0] || '?').toUpperCase();
}

function getAvatarColor(seed){
    return AVATAR_COLORS[hashString(String(seed||'x')) % AVATAR_COLORS.length];
}

// Avatar element yaratish: agar rasm bo'lsa — img, aks holda — harfli div
function createAvatar(user, size, className){
    const letter = getAvatarLetter(user);
    const color = getAvatarColor(user?.userId || user?.username || user?.firstName || 'x');
    if (user?.photo_url){
        const img = document.createElement('img');
        img.src = user.photo_url;
        img.className = className + ' ' + (size ? 'avatar-' + size : '');
        img.style.cssText = size ? `width:${size}px;height:${size}px` : '';
        img.alt = letter;
        return img;
    }
    const div = document.createElement('div');
    div.className = className + ' avatar-letter';
    div.textContent = letter;
    div.style.cssText = `background:${color};` + (size ? `width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px` : '');
    div.setAttribute('aria-label', letter);
    return div;
}

// Foydalanuvchi profiliga o'tish
function goToProfile(userId){
    if (!userId) return;
    if (String(userId) === String(currentUser.userId)) {
        window.location.href = 'profil.html';
    } else {
        window.location.href = 'profil.html?id=' + encodeURIComponent(userId);
    }
}

// Vaqtni hisoblash (seconds/minutes/hours/days)
function formatRelativeTime(timestamp){
    if (!timestamp) return '';
    const ts = typeof timestamp === 'number' ? timestamp : Date.parse(timestamp);
    if (!ts || isNaN(ts)) return '';
    const now = Date.now();
    const diff = Math.floor((now - ts) / 1000); // seconds

    if (diff < 0) return 'hozir';
    if (diff < 10) return 'hozir';
    if (diff < 60) return diff + ' soniya oldin';
    const mins = Math.floor(diff / 60);
    if (mins < 60) return mins + ' daqiqa oldin';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' soat oldin';
    const days = Math.floor(hours / 24);
    if (days < 7) return days + ' kun oldin';
    if (days < 30) return Math.floor(days / 7) + ' hafta oldin';
    const months = Math.floor(days / 30);
    if (months < 12) return months + ' oy oldin';
    return Math.floor(months / 12) + ' yil oldin';
}

let toastTimer;
function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   UI FILL
   ============================================================ */
document.getElementById('ownProfileActions').style.display = isOwn ? 'flex' : 'none';
document.getElementById('otherProfileActions').style.display = isOwn ? 'none' : 'flex';
document.getElementById('postBtn').style.display = isOwn ? 'inline-flex' : 'none';

const displayName = profileOwner

    const navPhoto = document.getElementById('navUserPhoto');

        navPhoto.style.display = 'block';
    } else {
        navPhoto.style.display = 'none';
        const navBtn = document.getElementById('navProfileBtn');
        if (!navBtn.querySelector('.nav-avatar-letter')){
            const letterSpan = document.createElement('span');

            letterSpan.textContent = getAvatarLetter(currentUser);

            navPhoto.insertAdjacentElement('afterend', letterSpan);
        }

    // Composer avatar
    const cAvatar = document.getElementById('composerAvatar');
    if (profileOwner.photo_url){
        cAvatar.src = profileOwner.photo_url;
        cAvatar.classList.remove('avatar-letter');
    } else {
        cAvatar.removeAttribute('src');
        cAvatar.classList.add('avatar-letter');
        cAvatar.textContent = getAvatarLetter(profileOwner);
        cAvatar.style.background = getAvatarColor(profileOwner.userId);
        cAvatar.style.display = 'flex';
        cAvatar.style.alignItems = 'center';
        cAvatar.style.justifyContent = 'center';
        cAvatar.style.color = '#fff';
        cAvatar.style.fontWeight = '700';
        cAvatar.style.fontSize = '16px';
    }
}

// Avatar va ism bosilsa — o'z profiliga (agar boshqa profilda bo'lsa)
document.querySelector('.profile-pic-wrapper').style.cursor = isOwn ? 'default' : 'pointer';

/* ============================================================
   BACK BUTTON
   ============================================================ */
document.getElementById('backBtn').addEventListener('click', () => {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = 'index.html';
    }
});

/* ============================================================
   BUTTONS
   ============================================================ */
document.getElementById('editBtn')?.addEventListener('click', () => {
    location.href = 'tahrirlash.html';
});
document.getElementById('settingsBtn')?.addEventListener('click', () => {
    location.href = 'setting.html';
});
document.getElementById('subscribeBtn')?.addEventListener('click', () => {

document.getElementById('messageBtn')?.addEventListener('click', () => {

/* ============================================================
   POSTS / RENDER
   ============================================================ */
let posts = [];
let savedPosts = new Set();
let viewedByMe = new Set();

function loadUserPosts(){
    posts = PostStore.byUser(targetUserId);
    // Fallback: eski postlar userId saqlamagan bo'lishi mumkin
    if (posts.length === 0 && profileOwner){
        posts = PostStore.all().filter(p =>
            p.user === displayName ||
            (p.userId && String(p.userId) === String(targetUserId))
        );
    }
    document.getElementById('postsCount').textContent = posts.length;
}

function renderEmpty(){
    const area = document.getElementById('contentArea');
    area.innerHTML = `<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><p>Hali post yo'q</p>`;
}

function renderPosts(){
    const area = document.getElementById('contentArea');
    if (posts.length === 0){ renderEmpty(); return; }
    area.innerHTML = '<div class="feed" id="feed"></div>';
    const feed = document.getElementById('feed');
    posts.forEach(p => feed.appendChild(buildPostItem(p)));
}

/* ============================================================
   LIKE — real, per-user
   ============================================================ */
function toggleLike(post){
    const uid = currentUser.userId;
    post.likedBy = Array.isArray(post.likedBy) ? post.likedBy : [];
    const idx = post.likedBy.indexOf(uid);
    if (idx >= 0){
        post.likedBy.splice(idx, 1);
        post.liked = false;
    } else {
        post.likedBy.push(uid);
        post.liked = true;
    }
    post.likes = post.likedBy.length;
    PostStore.update(post.id, { likedBy: post.likedBy, liked: post.liked, likes: post.likes });
    return post;
}

function isPostLikedByMe(post){
    return Array.isArray(post.likedBy) && post.likedBy.includes(currentUser.userId);
}

/* ============================================================
   POST ITEM
   ============================================================ */
function buildPostItem(p){
    const item = document.createElement('div');
    item.className = 'post-item';
    item.dataset.id = p.id;

    // Author info
    const authorUser = DB.findUser(p.userId) || {
        firstName: (p.user || '').split(' ')[0] || 'F',
        lastName: (p.user || '').split(' ').slice(1).join(' ') || '',
        userId: p.userId
    };

    const head = document.createElement('div');
    head.className = 'post-head';

    const avatarEl = createAvatar(authorUser, 40, 'post-avatar');
    avatarEl.addEventListener('click', (e) => {
        e.stopPropagation();
        goToProfile(p.userId);
    });
    head.appendChild(avatarEl);

    const info = document.createElement('div');
    info.className = 'post-head-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'post-user';
    nameEl.textContent = p.user || displayName;
    nameEl.addEventListener('click', (e) => {
        e.stopPropagation();
        goToProfile(p.userId);
    });
    info.appendChild(nameEl);

    const timeEl = document.createElement('div');
    timeEl.className = 'post-time';
    timeEl.textContent = formatRelativeTime(p.createdAt);
    timeEl.dataset.ts = String(p.createdAt || '');
    info.appendChild(timeEl);

    head.appendChild(info);
    item.appendChild(head);

    if (p.text){
        const text = document.createElement('div');
        text.className = 'post-text';
        text.textContent = p.text;
        item.appendChild(text);
    }
    if (p.type === 'image' && p.image){
        const img = document.createElement('img');
        img.className = 'post-image';
        img.src = p.image;
        item.appendChild(img);
    }
    if (p.type === 'video' && p.image){
        const vid = document.createElement('video');
        vid.className = 'post-video';
        vid.src = p.image;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        item.appendChild(vid);
    }

    // Actions
    const actions = document.createElement('div');
    actions.className = 'post-actions';

    // === 1-o'rin: LIKE (avvalgi Share joyida) ===
    const likeBtn = document.createElement('button');
    likeBtn.className = 'act-btn' + (isPostLikedByMe(p) ? ' liked' : '');
    likeBtn.setAttribute('aria-label', 'Like');
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="act-count like-count">${p.likes || 0}</span>`;
    likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLike(p);
        likeBtn.classList.toggle('liked', p.liked);
        likeBtn.querySelector('.like-count').textContent = p.likes;
    });
    actions.appendChild(likeBtn);

    // === 2-o'rin: IZOHLAR ===
    const commentBtn = document.createElement('button');
    commentBtn.className = 'act-btn';
    commentBtn.setAttribute('aria-label', 'Izohlar');
    commentBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="act-count comment-count">${countComments(p)}</span>`;
    commentBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openComments(p);
    });
    actions.appendChild(commentBtn);

    // === 3-o'rin: KO'RISH ===
    const viewBtn = document.createElement('button');
    viewBtn.className = 'act-btn';
    viewBtn.style.cursor = 'default';
    viewBtn.setAttribute('aria-label', "Ko'rishlar");
    viewBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="act-count view-count">${p.views || 0}</span>`;
    actions.appendChild(viewBtn);

    // === 4-o'rin: SAQLASH ===
    const saveBtn = document.createElement('button');
    saveBtn.className = 'act-btn' + (savedPosts.has(p.id) ? ' saved' : '');
    saveBtn.setAttribute('aria-label', 'Saqlash');
    saveBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
    saveBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (savedPosts.has(p.id)){
            savedPosts.delete(p.id);
            saveBtn.classList.remove('saved');
            showToast('Saqlanganlardan olib tashlandi');
        } else {
            savedPosts.add(p.id);
            saveBtn.classList.add('saved');
            showToast('Saqlandi');
        }
    });
    actions.appendChild(saveBtn);

    // === 5-o'rin: SHARE (avvalgi Like joyida) ===
    const shareBtn = document.createElement('button');
    shareBtn.className = 'act-btn';
    shareBtn.setAttribute('aria-label', 'Ulashish');
    shareBtn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;
    shareBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sharePost(p);
    });
    actions.appendChild(shareBtn);

    item.appendChild(actions);
    registerView(p, item);
    return item;
}

function countComments(p){
    let n = (p.comments || []).length;
    (p.comments || []).forEach(c => n += (c.replies || []).length);
    return n;
}

function registerView(p, item){
    if (viewedByMe.has(p.id)) return;
    const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !viewedByMe.has(p.id)){
                viewedByMe.add(p.id);
                p.views = (p.views || 0) + 1;
                PostStore.update(p.id, { views: p.views });
                const vc = item.querySelector('.view-count');
                if (vc) vc.textContent = p.views;
                io.disconnect();
            }
        });
    }, { threshold: 0.5 });
    io.observe(item);
}

function sharePost(p){
    const link = location.origin + location.pathname + '?post=' + encodeURIComponent(p.id);
    const shareData = { title: 'Post', text: p.text || 'Post', url: link };
    if (navigator.share){
        navigator.share(shareData).catch(() => {});
    } else {
        try { navigator.clipboard?.writeText(link); } catch (e) {}
        showToast('Havola nusxalandi');
    }
}

/* ============================================================
   COMMENTS
   ============================================================ */
const commentsOverlay = document.getElementById('commentsOverlay');
const commentsPanel = document.getElementById('commentsPanel');
const commentsList = document.getElementById('commentsList');
const commentsInput = document.getElementById('commentsInput');
const commentsSend = document.getElementById('commentsSend');
const commentsClose = document.getElementById('commentsClose');
const replyIndicator = document.getElementById('replyIndicator');
const replyText = document.getElementById('replyText');
const cancelReply = document.getElementById('cancelReply');

let activePost = null;
let replyTarget = null;

function openComments(p){
    activePost = p;
    replyTarget = null;
    if (!activePost.comments) activePost.comments = [];
    replyIndicator.classList.remove('show');
    renderComments();
    commentsOverlay.classList.add('show');
    commentsPanel.classList.add('show');
}
function closeComments(){
    commentsOverlay.classList.remove('show');
    commentsPanel.classList.remove('show');
    activePost = null;
    replyTarget = null;
    commentsInput.value = '';
    commentsSend.disabled = true;
}
commentsOverlay.addEventListener('click', closeComments);
commentsClose.addEventListener('click', closeComments);

function renderComments(){
    if (!activePost) return;
    commentsList.innerHTML = '';
    if (activePost.comments.length === 0){
        commentsList.innerHTML = '<div class="comments-empty">Hali izoh yo\'q. Birinchi bo\'ling!</div>';
        return;
    }
    activePost.comments.forEach(c => commentsList.appendChild(buildComment(c)));
}


/* Comment like */
function toggleCommentLike(comment){
    const uid = currentUser.userId;
    comment.likedBy = Array.isArray(comment.likedBy) ? comment.likedBy : [];
    const idx = comment.likedBy.indexOf(uid);
    if (idx >= 0){
        comment.likedBy.splice(idx, 1);
        comment.liked = false;
    } else {
        comment.likedBy.push(uid);
        comment.liked = true;
    }
    comment.likes = comment.likedBy.length;
    // Save to post
    PostStore.update(activePost.id, { comments: activePost.comments });
}

function isCommentLikedByMe(comment){
    return Array.isArray(comment.likedBy) && comment.likedBy.includes(currentUser.userId);
}

function buildComment(c){
    const wrap = document.createElement('div');
    wrap.className = 'comment-item';

    const authorUser = DB.findUser(c.userId) || {
        firstName: (c.user || '').split(' ')[0] || 'F',
        lastName: (c.user || '').split(' ').slice(1).join(' ') || '',
        userId: c.userId
    };

    const avatarEl = createAvatar(authorUser, 32, 'comment-avatar');
    avatarEl.addEventListener('click', () => goToProfile(c.userId));
    wrap.appendChild(avatarEl);

    const body = document.createElement('div');
    body.className = 'comment-body';

    const top = document.createElement('div');
    top.className = 'comment-top';
    const userEl = document.createElement('span');
    userEl.className = 'comment-user';
    userEl.textContent = c.user;
    userEl.addEventListener('click', () => goToProfile(c.userId));
    top.appendChild(userEl);

    const timeEl = document.createElement('span');
    timeEl.className = 'comment-time';
    timeEl.textContent = formatRelativeTime(c.createdAt);
    timeEl.dataset.ts = String(c.createdAt || '');
    top.appendChild(timeEl);
    body.appendChild(top);

    const textEl = document.createElement('div');
    textEl.className = 'comment-text';
    textEl.textContent = c.text;
    body.appendChild(textEl);

    // Action buttons row: [Like] [Reply]
    const actionRow = document.createElement('div');
    actionRow.className = 'comment-actions';

    // LIKE button (before reply)
    const likeBtn = document.createElement('button');
    likeBtn.className = 'comment-action-btn' + (isCommentLikedByMe(c) ? ' liked' : '');
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="comment-action-count">${c.likes || 0}</span>`;
    likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCommentLike(c);
        likeBtn.classList.toggle('liked', c.liked);
        likeBtn.querySelector('.comment-action-count').textContent = c.likes;
    });
    actionRow.appendChild(likeBtn);

    // REPLY button (always visible)
    const replyBtn = document.createElement('button');
    replyBtn.className = 'comment-action-btn';
    replyBtn.textContent = 'Javob berish';
    replyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        replyTarget = { commentId: c.id, user: c.user };
        replyText.textContent = `@${c.user} ga javob`;
        replyIndicator.classList.add('show');
        commentsInput.focus();
    });
    actionRow.appendChild(replyBtn);

    body.appendChild(actionRow);

    // Replies
    if (c.replies && c.replies.length){
        const repliesBox = document.createElement('div');
        repliesBox.className = 'comment-replies';
        c.replies.forEach(r => repliesBox.appendChild(buildReply(r)));
        body.appendChild(repliesBox);
    }

    wrap.appendChild(body);
    return wrap;
}

function buildReply(r){
    const ri = document.createElement('div');
    ri.className = 'comment-reply-item';

    const authorUser = DB.findUser(r.userId) || {
        firstName: (r.user || '').split(' ')[0] || 'F',
        lastName: (r.user || '').split(' ').slice(1).join(' ') || '',
        userId: r.userId
    };

    const avatarEl = createAvatar(authorUser, 26, 'comment-avatar');
    avatarEl.addEventListener('click', () => goToProfile(r.userId));
    ri.appendChild(avatarEl);

    const body = document.createElement('div');
    body.className = 'comment-body';
    body.innerHTML = `
        <div class="comment-top"><span class="comment-user">${escapeHtml(r.user)}</span><span class="comment-time">${formatRelativeTime(r.createdAt)}</span></div>
        <div class="comment-text">${escapeHtml(r.text)}</div>`;

    // Avatar/user click → profile
    body.querySelector('.comment-user').addEventListener('click', () => goToProfile(r.userId));

    ri.appendChild(body);
    return ri;
}

cancelReply.addEventListener('click', () => {
    replyTarget = null;
    replyIndicator.classList.remove('show');
});

commentsInput.addEventListener('input', () => {
    commentsInput.style.height = 'auto';
    commentsInput.style.height = Math.min(commentsInput.scrollHeight, 80) + 'px';
    commentsSend.disabled = commentsInput.value.trim().length === 0;
});

commentsSend.addEventListener('click', () => {
    const txt = commentsInput.value.trim();
    if (!txt || !activePost) return;

    const now = Date.now();
    const newC = {
        id: 'c_' + now + '_' + Math.random().toString(36).slice(2,7),
        userId: currentUser.userId,
        user: displayName,
        text: txt,
        createdAt: now,
        likes: 0,
        likedBy: [],
        replies: []
    };

    if (replyTarget){
        const parent = activePost.comments.find(c => c.id === replyTarget.commentId);
        if (parent){
            parent.replies = parent.replies || [];
            parent.replies.push(newC);
        }
    } else {
        activePost.comments.push(newC);
    }

    PostStore.update(activePost.id, { comments: activePost.comments });

    commentsInput.value = '';
    commentsInput.style.height = 'auto';
    commentsSend.disabled = true;
    replyTarget = null;
    replyIndicator.classList.remove('show');
    renderComments();

    const item = document.querySelector(`.post-item[data-id="${activePost.id}"]`);
    if (item){
        const cc = item.querySelector('.comment-count');
        if (cc) cc.textContent = countComments(activePost);
    }
    commentsList.scrollTop = commentsList.scrollHeight;
});

/* ============================================================
   COMPOSER
   ============================================================ */
const postBtn = document.getElementById('postBtn');
const overlay = document.getElementById('composerOverlay');
const composer = document.getElementById('composer');
const input = document.getElementById('composerInput');
const submitBtn = document.getElementById('composerSubmit');
const attachBtn = document.getElementById('attachBtn');
const attachVideoBtn = document.getElementById('attachVideoBtn');
const fileInput = document.getElementById('fileInput');
const videoInput = document.getElementById('videoInput');
const preview = document.getElementById('composerPreview');
const previewImg = document.getElementById('previewImg');
const previewVid = document.getElementById('previewVid');
const removeImg = document.getElementById('removeImg');
const composerClose = document.getElementById('composerClose');

let currentMedia = null;

function openComposer(){
    overlay.classList.add('show');
    composer.classList.add('show');
    setTimeout(() => input.focus(), 300);
}
function closeComposer(){
    overlay.classList.remove('show');
    composer.classList.remove('show');
    input.blur();
}
function refreshSubmit(){
    submitBtn.disabled = !(input.value.trim().length > 0 || currentMedia);
}

postBtn?.addEventListener('click', openComposer);
overlay.addEventListener('click', closeComposer);
composerClose.addEventListener('click', closeComposer);

input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    refreshSubmit();
});

attachBtn.addEventListener('click', () => fileInput.click());
attachVideoBtn.addEventListener('click', () => videoInput.click());

fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
        currentMedia = { data: ev.target.result, type: 'image' };
        previewImg.src = currentMedia.data;
        previewImg.style.display = 'block';
        previewVid.style.display = 'none';
        previewVid.src = '';
        preview.classList.add('show');
        refreshSubmit();
    };
    reader.readAsDataURL(f);
    fileInput.value = '';
});

videoInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
        currentMedia = { data: ev.target.result, type: 'video' };
        previewVid.src = currentMedia.data;
        previewVid.style.display = 'block';
        previewImg.style.display = 'none';
        previewImg.src = '';
        preview.classList.add('show');
        refreshSubmit();
    };
    reader.readAsDataURL(f);
    videoInput.value = '';
});

removeImg.addEventListener('click', () => {
    currentMedia = null;
    preview.classList.remove('show');
    previewImg.src = '';
    previewImg.style.display = 'none';
    previewVid.src = '';
    previewVid.style.display = 'none';
    refreshSubmit();
});

submitBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text && !currentMedia) return;

    const type = currentMedia ? (currentMedia.type === 'video' ? 'video' : 'image') : 'text';
    const now = Date.now();

    const newPost = {
        id: 'p_' + now + '_' + Math.random().toString(36).slice(2, 7),
        userId: currentUser.userId,
        user: displayName,
        createdAt: now,
        text,
        image: currentMedia ? currentMedia.data : null,
        type,
        likes: 0,
        liked: false,
        likedBy: [],
        views: 0,
        comments: []
    };

    PostStore.add(newPost);

    posts = PostStore.byUser(targetUserId);
    document.getElementById('postsCount').textContent = posts.length;

    input.value = '';
    input.style.height = 'auto';
    currentMedia = null;
    preview.classList.remove('show');
    previewImg.src = '';
    previewImg.style.display = 'none';
    previewVid.src = '';
    previewVid.style.display = 'none';
    refreshSubmit();
    closeComposer();
    renderPosts();
});

/* ============================================================
   TIME AUTO-REFRESH (har 30 sekundda vaqtni yangilash)
   ============================================================ */
setInterval(() => {
    document.querySelectorAll('.post-time, .comment-time').forEach(el => {
        const ts = el.dataset.ts;
        if (ts) el.textContent = formatRelativeTime(ts);
    });
}, 30000);

/* ============================================================
   INIT
   ============================================================ */
if (profileOwner){
    loadUserPosts();
    renderPosts();
}
</script>
