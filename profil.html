<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil UI Dizayni</title>
    <style>
        /* Asosiy sozlamalar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Mobil ko'rinish cheklovi */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profil rasmi */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-top: 30px;
            margin-bottom: 20px;
            background-color: #333; /* Rasm yo'q bo'lsa ko'rinadigan rang */
        }

        /* Ism va status */
        .name {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* Statistika qismi */
        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Tugmalar qismi */
        .action-buttons {
            display: flex;
            width: 100%;
            gap: 12px;
            margin-bottom: 30px;
        }

        .btn-subscribe {
            flex-grow: 1;
            background-color: #007aff; /* Ochiq ko'k rang */
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-subscribe:active {
            opacity: 0.8;
        }

        .btn-share {
            background-color: #1c1c1e;
            border: none;
            border-radius: 12px;
            width: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .btn-share svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Menyular (Tablar) */
        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 60px;
            justify-content: space-between;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex-grow: 1;
        }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 500;
        }

        /* Kontent */
        .content-area {
            color: #8e8e93;
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Profil rasmi (src ichiga o'zingizning rasmingiz manzilini qo'ying) -->
        <img src="https://via.placeholder.com/120" alt="Profil rasmi" class="profile-pic">

        <!-- Ism va holat -->
        <h1 class="name">M</h1>
        <p class="last-seen">5-sen kuni 14:54 da kirgan</p>

        <!-- Statistika (Obunalar, Obunachilar, Postlar) -->
        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Obunalar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Obunachilar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number">0</span>
                <span class="stat-label">Postlar</span>
            </div>
        </div>

        <!-- Tugmalar (Obuna bo'lish, Ulashish) -->
        <div class="action-buttons">
            <button class="btn-subscribe">Obuna bo'lish</button>
            <button class="btn-share">
                <!-- Ulashish ikonchasi (SVG) -->
                <svg viewBox="0 0 24 24">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Menyu tablari -->
        <div class="tabs">
            <div class="tab-item">Storylar</div>
            <div class="tab-item active">Postlar</div>
            <div class="tab-item">Quote'lar</div>
            <div class="tab-item">Giftlar</div>
        </div>

        <!-- Asosiy qism -->
        <div class="content-area">
            <p>Hali post yo'q</p>
        </div>
    </div>

</body>
</html>
