<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Design - Wavy Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000; /* Asosiy qora fon */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            color: #fff;
            position: relative;
        }

        /* Profile Header Section */
        .profile-header {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'); /* Muqova rasmi */
            background-size: cover;
            background-position: center;
            /* Burchaklarni olib tashladik, chunki pastda to'lqin bo'ladi */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }

        .profile-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.9) 100%);
            padding: 40px 20px 60px 20px; /* To'lqin uchun pastdan ko'proq joy qoldirdik */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 520px; 
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            z-index: 2;
        }

        .icon-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .right-icons {
            display: flex;
            gap: 10px;
        }

        .profile-info {
            position: relative;
            margin-bottom: 25px;
            margin-top: auto;
            z-index: 2;
        }

        .profile-middle {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .avatar-container {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 2.5px solid #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.1); /* Bo'sh holatda chiroyli turishi uchun */
            backdrop-filter: blur(3px);
        }

        .avatar-text {
            font-size: 20px;
            font-weight: 600;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
        }

        .badge {
            position: absolute;
            right: 0;
            bottom: 5px;
            background-color: rgba(255, 255, 255, 0.25);
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            z-index: 2;
            position: relative;
        }

        .action-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* SVG To'lqin dizayni (Siz chizgan chiziq) */
        .wave-bottom {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            overflow: hidden;
            line-height: 0;
            z-index: 1;
        }

        .wave-bottom svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 45px;
        }

        .wave-bottom .shape-fill {
            fill: #000000; /* Asosiy qora fon bilan birlashib ketishi uchun */
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Yuqori profil qismi -->
        <div class="profile-header">
            <div class="profile-overlay">
                
                <!-- Yuqori menyu tugmalari -->
                <div class="top-bar">
                    <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="right-icons">
                        <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                        <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </div>
                
                <!-- Profil ma'lumotlari -->
                <div class="profile-info">
                    <div class="profile-middle">
                        <div class="avatar-container">
                            <!-- Bo'sh avatar, rasm yo'q -->
                        </div>
                        <div class="avatar-text">Matnni kiriting</div>
                    </div>
                    
                    <div class="profile-name">Япония</div>
                    <div class="badge">A+</div>
                </div>

                <!-- Tugmalar -->
                <div class="action-buttons">
                    <button>Obuna bo'lish</button>
                    <button>Xabar</button>
                </div>
            </div>

            <!-- Pastki to'lqinsimon chiziq (SVG) -->
            <div class="wave-bottom">
                <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118.08,130.83,120.73,195,108.43,238.16,100.1,280.9,81.16,321.39,56.44Z" class="shape-fill"></path>
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
