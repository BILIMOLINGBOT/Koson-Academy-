<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
            min-height: 100vh;
        }

        /* Profil rasmi */
        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Statistika */
        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Tugmalar */
        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-edit {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active { opacity: 0.8; transform: scale(0.98); }

        .btn-edit svg {
            width: 16px; height: 16px;
            stroke: currentColor; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .btn-settings {
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            width: 50px; height: 50px;
            flex-shrink: 0;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:active { transform: scale(0.95) rotate(45deg); background-color: #2c2c2e; }

        .btn-settings svg {
            width: 22px; height: 22px;
            fill: none; stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Tablar */
        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 30px;
            gap: 2px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 12px 6px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: all 0.25s ease;
            user-select: none;
            font-weight: 500;
            white-space: nowrap;
        }

        .tab-item:active { transform: scale(0.97); }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 600;
        }

        /* Kontent */
        .content-area {
            color: #8e8e93;
            font-size: 16px;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        .empty-icon {
            width: 60px; height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #3f3f46;
        }

        .empty-icon svg {
            width: 28px; height: 28px;
            stroke: currentColor; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ============================= */
        /* KONTENT GRID — postlar/video  */
        /* ============================= */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
            padding: 0;
        }

        .grid-item {
            aspect-ratio: 9 / 16;
            background-color: #1c1c1e;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .grid-item video,
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-item .video-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(0,0,0,0.7);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            display: flex; align-items: center; gap: 3px;
            color: #fff;
        }

        .grid-item .video-badge svg {
            width: 10px; height: 10px;
            fill: #fff;
        }

        .grid-item .item-title {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 6px 6px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: #fff;
            font-size: 10px;
            line-height: 1.3;
            max-height: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* ============================= */
        /* BOSHLASH — PILL               */
        /* ============================= */
        .start-btn {
            position: fixed;
            right: 20px;
            bottom: 110px;
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            color: #000000;
            border: none;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            user-select: none;
            box-shadow:
                0 8px 24px rgba(255, 255, 255, 0.15),
                0 2px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.2s ease;
        }

        .start-btn:active {
            transform: scale(0.94);
        }

        .start-btn svg {
            width: 18px; height: 18px;
            stroke: #000000; fill: none;
            stroke-width: 2.5;
            stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.25s ease;
        }

        .start-btn:active svg { transform: translateX(2px); }

        /* ============================= */
        /* MODAL — Video / Jonli efir    */
        /* ============================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            width: 100%;
            max-width: 420px;
            background-color: #1c1c1e;
            border-radius: 24px 24px 0 0;
            padding: 12px 20px 30px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        .modal-overlay.show .modal-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 40px; height: 4px;
            background-color: #3f3f46;
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .sheet-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .sheet-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sheet-option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            background-color: #2c2c2e;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            text-align: left;
            color: #fff;
        }

        .sheet-option:active {
            transform: scale(0.98);
            background-color: #3a3a3c;
        }

        .sheet-option-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sheet-option-icon.video-icon {
            background: linear-gradient(135deg, #007aff 0%, #0051d5 100%);
        }

        .sheet-option-icon.live-icon {
            background: linear-gradient(135deg, #ff3b30 0%, #d70015 100%);
        }

        .sheet-option-icon svg {
            width: 24px; height: 24px;
            stroke: #fff; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .sheet-option-text {
            flex: 1;
        }

        .sheet-option-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .sheet-option-desc {
            font-size: 13px;
            color: #8e8e93;
        }

        .sheet-option-arrow {
            color: #8e8e93;
            flex-shrink: 0;
        }

        .sheet-option-arrow svg {
            width: 18px; height: 18px;
            stroke: currentColor; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #2c2c2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            padding: 0 12px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-btn:active { transform: scale(0.85); opacity: 0.7; }

        .nav-active { color: #ffffff; }
        .nav-inactive { color: #a1a1aa; }

        .nav-btn svg {
            width: 24px; height: 24px;
            stroke: currentColor; fill: none;
            stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .nav-btn .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-btn .nav-avatar {
            width: 24px; height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
        }
    </style>
</head>

        </div>

        <!-- Tablar -->
        <div class="tabs" id="tabsContainer">
            <div class="tab-item active" data-tab="home">Bosh sahifa</div>
            <div class="tab-item" data-tab="posts">Postlar</div>
            <div class="tab-item" data-tab="video">Video</div>
        </div>

        <!-- Kontent -->
        <div class="content-area" id="contentArea">
            <div class="empty-icon" id="emptyIcon">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <p id="contentText">Hali ma'lumot yo'q</p>
        </div>
    </div>

    <!-- BOSHLASH TUGMASI -->
    <button class="start-btn" id="startBtn" aria-label="Boshlash">
        Boshlash
        <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </button>

    
    <!-- MODAL — Video / Jonli efir -->
    <div class="modal-overlay" id="startModal">
        <div class="modal-sheet">
            <div class="sheet-handle"></div>
            <h2 class="sheet-title">Nima joylash?</h2>

            <div class="sheet-options">
                <button class="sheet-option" id="optionVideo">
                    <div class="sheet-option-icon video-icon">

                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>

                        <div class="sheet-option-title">Jonli efir</div>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">

    <script>
        // ============================
        // TELEGRAM
        // ============================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // ============================
        // FOYDALANUVCHI
        // ============================
        function loadUser() {
            const user = tg?.initDataUnsafe?.user;
            if (!user) return;
            const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
            document.getElementById('userName').textContent = fullName;
            document.getElementById('userStatus').textContent = user.username
                ? '@' + user.username : 'Telegram foydalanuvchisi';
            if (user.photo_url) {
                document.getElementById('userPhoto').src = user.photo_url;
                document.getElementById('navUserPhoto').src = user.photo_url;
            }
        }
        loadUser();

        // ============================
        // TOAST
        // ============================
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ============================
        // MA'LUMOTLAR — localStorage
        // ============================
        const STORAGE_KEY = 'profile_posts_v1';

        function getPosts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch { return []; }
        }

        function savePosts(posts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        function addPost(post) {
            const posts = getPosts();
            posts.unshift(post);
            savePosts(posts);
        }

        // ============================
        // KONTENT KO'RSATISH
        // ============================
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
            posts: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`
        };

        const emptyTexts = {
            home: "Hali ma'lumot yo'q",
            posts: "Hali post yo'q",
            video: "Hali video yo'q"
        };

        let currentTab = 'home';

        function renderContent(tab) {
            currentTab = tab;
            const area = document.getElementById('contentArea');
            const allPosts = getPosts();

            let filtered;
            if (tab === 'home') filtered = allPosts;
            else if (tab === 'posts') filtered = allPosts.filter(p => p.type === 'post');
            else if (tab === 'video') filtered = allPosts.filter(p => p.type === 'video');

            // Yangi postlar soni
            document.getElementById('postsCount').textContent = allPosts.length;

            if (!filtered.length) {
                area.innerHTML = `
                    <div class="empty-icon">${icons[tab]}</div>
                    <p>${emptyTexts[tab]}</p>
                `;
                return;
            }

            // Grid
            const grid = document.createElement('div');
            grid.className = 'content-grid';

            filtered.forEach(post => {
                const item = document.createElement('div');
                item.className = 'grid-item';

                // Video element
                const vid = document.createElement('video');
                vid.src = post.url;
                vid.muted = true;
                vid.playsInline = true;
                vid.preload = 'metadata';
                // Birinchi kadrni ko'rsatish
                vid.addEventListener('loadedmetadata', () => { vid.currentTime = 0.1; });
                item.appendChild(vid);

                // Badge
                const badge = document.createElement('div');
                badge.className = 'video-badge';
                badge.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
                item.appendChild(badge);

                // Sarlavha
                if (post.title) {
                    const title = document.createElement('div');
                    title.className = 'item-title';
                    title.textContent = post.title;
                    item.appendChild(title);
                }

                grid.appendChild(item);
            });

            area.innerHTML = '';
            area.appendChild(grid);
        }

        // ============================
        // TABLAR
        // ============================
        document.getElementById('tabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderContent(tab.dataset.tab);
            tg?.HapticFeedback?.selectionChanged();
        });

        // Boshlang'ich render
        renderContent('home');

        // Boshqa tab'dan qaytganda yangilash
        window.addEventListener('focus', () => renderContent(currentTab));

        // ============================
        // MODAL — BOSHLASH
        // ============================
        const startModal = document.getElementById('startModal');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('medium');
            startModal.classList.add('show');
        });

        startModal.addEventListener('click', (e) => {
            if (e.target === startModal) {
                startModal.classList.remove('show');
            }
        });

        // ============================
        // VIDEO TANLASH → update.html
        // ============================
        document.getElementById('optionVideo').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            startModal.classList.remove('show');

            // update.html ga o'tish — galereya ochiladi
            setTimeout(() => {
                window.location.href = 'update.html?type=video';
            }, 250);
        });

        // ============================
        // JONLI EFIR
        // ============================
        document.getElementById('optionLive').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            startModal.classList.remove('show');
            showToast('Jonli efir tez orada...');
            // keyinroq: window.location.href = 'live.html';
        });

        // ============================
        // TUGMALAR
        // ============================
        document.getElementById('editBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            window.location.href = 'tahrirlash.html';
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            window.location.href = 'setting.html';
        });
    </script>
</body>
</html>
