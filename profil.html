<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - L.uz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#000!important;color:#fff}
body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.mobile-container{width:100%;max-width:420px;padding:20px 20px 200px;display:flex;flex-direction:column;align-items:center}
.back-bar{width:100%;display:flex;align-items:center;margin:0 0 10px}
.back-btn{background:#1c1c1e;border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:transform .15s,background .2s}
.back-btn:active{transform:scale(.9);background:#2c2c2e}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:20px 0;position:relative}
.profile-pic,.profile-pic-initial{width:120px;height:120px;border-radius:50%;border:3px solid #1c1c1e;cursor:pointer}
.profile-pic{object-fit:cover;background:#1c1c1e}
.profile-pic-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff;text-transform:uppercase}
.name{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center;cursor:pointer}
.name:active{opacity:.7}
.last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}
.stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
.stat-item{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.stat-item:active{opacity:.7}
.stat-divider{width:1px;background:#2c2c2e;height:40px;align-self:center}
.stat-number{font-size:20px;font-weight:600;margin-bottom:6px}
.stat-label{color:#8e8e93;font-size:14px}
.action-buttons{display:flex;width:100%;gap:10px;margin-bottom:30px}
.btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:100px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-edit:active{opacity:.8;transform:scale(.98)}
.btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-settings{background:#1c1c1e;border:none;border-radius:50%;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
.btn-settings:active{transform:scale(.95) rotate(45deg);background:#2c2c2e}
.btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;background:#1c1c1e;width:100%;border-radius:20px;padding:4px;margin-bottom:30px}
.tab-item{color:#8e8e93;padding:12px 4px;border-radius:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;transition:all .25s ease;user-select:none}
.tab-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tab-item:active{transform:scale(.97)}
.tab-item.active{background:#48484a;color:#fff}
.content-area{color:#8e8e93;font-size:16px;text-align:center;width:100%;padding:40px 0}
.empty-icon{width:60px;height:60px;margin:0 auto 16px;border:2px solid #3f3f46;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3f3f46}
.empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-btn{position:fixed;right:20px;bottom:110px;z-index:60;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.post-btn:active{transform:scale(.94);box-shadow:0 4px 12px rgba(255,255,255,.1),0 1px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.composer-title{font-size:17px;font-weight:700}
.composer-close{background:#1c1c1e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;transition:transform .2s,background .2s}
.composer-close:active{transform:scale(.9);background:#2c2c2e}
.composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-body{display:flex;gap:12px;margin-bottom:16px}
.composer-avatar,.composer-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.composer-avatar{object-fit:cover;background:#1c1c1e}
.composer-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
.composer-input::placeholder{color:#5a5a5e}
.composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
.composer-preview.show{display:block}
.composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
.composer-attach-group{display:flex;gap:8px}
.composer-attach{background:#1c1c1e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .2s,transform .2s}
.composer-attach:active{transform:scale(.92);background:#2c2c2e}
.composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s}
.composer-submit:active{transform:scale(.95)}
.composer-submit:disabled{opacity:.4;cursor:not-allowed}
.feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px}
.post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;border-bottom:1px solid #2c2c2e}
.post-item:last-child{border-bottom:none}
@keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-avatar,.post-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0;cursor:pointer}
.post-avatar{object-fit:cover;background:#1c1c1e}
.post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
.post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
.post-user{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.post-user:active{opacity:.7}
.post-time{font-size:12px;color:#8e8e93;margin-top:1px}
.post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.post-image{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}
.post-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;background:#000}
.post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
.act-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:6px 4px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
.act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
.act-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:14px;text-align:left}
.act-btn.liked{color:#ff2d55}
.act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act-btn.saved{color:#fff}
.act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
.comments-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:110;opacity:0;pointer-events:none;transition:opacity .3s}
.comments-overlay.show{opacity:1;pointer-events:auto}
.comments-panel{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;height:75vh;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:111;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
.comments-panel.show{transform:translate(-50%,0)}
.comments-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #1f1f22;flex-shrink:0}
.comments-title{font-size:16px;font-weight:700}
.comments-list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.comments-empty{text-align:center;color:#5a5a5e;font-size:14px;padding:40px 0}
.comment-item{display:flex;gap:10px;animation:postIn .3s ease both}
.comment-avatar,.comment-avatar-initial{width:32px;height:32px;border-radius:50%;flex-shrink:0;cursor:pointer}
.comment-avatar{object-fit:cover;background:#1c1c1e}
.comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;text-transform:uppercase}
.comment-body{flex:1;min-width:0}
.comment-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.comment-user{font-size:13px;font-weight:600;cursor:pointer}
.comment-user:active{opacity:.7}
.comment-time{font-size:11px;color:#5a5a5e}
.comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;margin-top:3px;word-break:break-word;white-space:pre-wrap}
.comment-actions{display:flex;gap:18px;margin-top:6px;align-items:center}
.comment-reply-btn,.comment-like-btn{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0;display:flex;align-items:center;gap:5px;transition:color .2s,transform .15s}
.comment-reply-btn:active,.comment-like-btn:active{opacity:.6;transform:scale(.94)}
.comment-like-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s,stroke .2s}
.comment-like-btn.liked{color:#ff2d55}
.comment-like-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
.comment-replies{margin-top:10px;padding-left:12px;border-left:2px solid #1f1f22;display:flex;flex-direction:column;gap:12px}
.comment-reply-item{display:flex;gap:8px}
.comment-reply-item .comment-avatar,.comment-reply-item .comment-avatar-initial{width:26px;height:26px;font-size:12px}
.comment-reply-item .comment-user{font-size:12px}
.comment-reply-item .comment-text{font-size:13px}
.comments-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1f1f22;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:#0a0a0a}
.comments-input{flex:1;background:#1c1c1e;border:none;border-radius:20px;padding:10px 14px;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4}
.comments-input::placeholder{color:#5a5a5e}
.comments-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,opacity .2s}
.comments-send:active{transform:scale(.9)}
.comments-send:disabled{opacity:.4;cursor:not-allowed}
.comments-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.reply-indicator{font-size:12px;color:#0a84ff;padding:4px 20px 8px;display:none;align-items:center;justify-content:space-between;background:#0a0a0a}
.reply-indicator.show{display:flex}
.reply-indicator button{background:none;border:none;color:#8e8e93;font-size:12px;cursor:pointer;font-family:inherit}
.bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
.bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 8px;transition:transform .15s ease,opacity .15s ease;cursor:pointer;background:none;border:none;font-family:inherit;flex:1}
.nav-btn:active{transform:scale(.85);opacity:.7}
.nav-active{color:#fff}.nav-inactive{color:#a1a1aa}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-btn .nav-label{font-size:10px;font-weight:500}
.nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e}
.nav-btn .nav-avatar-initial{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase}
#otherProfileActions .btn-message{flex:1;background:#1c1c1e;color:#fff}
#otherProfileActions .btn-message svg{stroke:#fff}
.toast{position:fixed;left:50%;bottom:200px;transform:translate(-50%,20px);background:#1c1c1e;color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;border:1px solid #2c2c2e;box-shadow:0 8px 30px rgba(0,0,0,.6);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="mobile-container">
    <div class="back-bar">
        <button class="back-btn" id="backBtn" aria-label="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
    </div>

    <div class="profile-pic-wrapper" id="profilePicWrapper">
        <img id="userPhoto" class="profile-pic" style="display:none" alt="Profil rasmi">
        <div id="userInitial" class="profile-pic-initial"></div>
    </div>
    <h1 class="name" id="userName">Yuklanmoqda...</h1>
    <p class="last-seen" id="userStatus">Profil</p>
    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="postsStat"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>
    <div class="action-buttons">
        <div id="ownProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="editBtn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Tahrirlash</button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
        <div id="otherProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="subscribeBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>Obuna bo'lish</button>
            <button class="btn-edit btn-message" id="messageBtn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Xabar</button>
        </div>
    </div>
    <div class="tabs" id="tabsContainer">
        <div class="tab-item active" data-tab="posts" aria-label="Postlar" title="Postlar">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <div class="tab-item" data-tab="video" aria-label="Video" title="Video">
            <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>

<script>
/* ================= DB ================= */
const DB = {
    _K: 'luz_users',
    _S: 'luz_current_user',
    _getUsers(){
        try { return JSON.parse(localStorage.getItem(this._K)) || []; }
        catch { return []; }
    },
    _saveUsers(users){ localStorage.setItem(this._K, JSON.stringify(users)); },
    getCurrentUser(){
        const id = localStorage.getItem(this._S);
        if (!id) return null;
        return this._getUsers().find(u => u.userId === id) || null;
    },
    getUserById(id){
        return this._getUsers().find(u => String(u.userId) === String(id)) || null;
    },
    updateUser(userId, patch){
        const users = this._getUsers();
        const i = users.findIndex(u => u.userId === userId);
        if (i < 0) return null;
        users[i] = Object.assign({}, users[i], patch);
        this._saveUsers(users);
        return users[i];
    },
    isUsernameTaken(username, excludeUserId){
        const users = this._getUsers();
        const lower = String(username).toLowerCase();
        return users.some(u => u.username.toLowerCase() === lower && u.userId !== excludeUserId);
    }
};

/* ================= POST STORE ================= */
const POST_STORE_KEY = 'tg_feed_posts_v1';
const PostStore = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(POST_STORE_KEY);
            this._cache = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(this._cache)) this._cache = [];
        } catch { this._cache = []; }
        return this._cache;
    },
    _save(){
        try { localStorage.setItem(POST_STORE_KEY, JSON.stringify(this._cache || [])); } catch {}
    },
    all(){ return this._load().slice(); },
    byUser(uid){
        if (!uid) return this.all();
        return this._load().filter(p => String(p.userId) === String(uid) || p.user === uid);
    },
    add(post){
        const list = this._load();
        list.unshift(post);
        this._cache = list;
        this._save();
        return post;
    },
    update(id, patch){
        const list = this._load();
        const i = list.findIndex(p => p.id === id);
        if (i < 0) return null;
        list[i] = Object.assign({}, list[i], patch);
        this._cache = list;
        this._save();
        return list[i];
    },
    updateUserInfo(userId, { firstName, lastName, photo_url }){
        const list = this._load();
        const newName = [firstName, lastName].filter(Boolean).join(' ') || 'Foydalanuvchi';
        list.forEach(p => {
            if (String(p.userId) === String(userId)) {
                p.user = newName;
                if (photo_url !== undefined) p.avatar = photo_url;
            }
        });
        this._cache = list;
        this._save();
    }
};

/* ================= VIEW TRACKER ================= */
const VIEW_LOG_KEY = 'luz_view_log_v1';
const ViewTracker = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(VIEW_LOG_KEY);
            this._cache = raw ? JSON.parse(raw) : {};
            if (!this._cache || typeof this._cache !== 'object') this._cache = {};
        } catch { this._cache = {}; }
        return this._cache;
    },
    _key(uid, pid){ return String(uid) + '::' + String(pid); },
    hasViewed(uid, pid){
        if (!uid || !pid) return false;
        return this._load()[this._key(uid, pid)] === true;
    },
    record(uid, pid){
        if (!uid || !pid) return false;
        const log = this._load();
        const k = this._key(uid, pid);
        if (log[k] === true) return false;
        log[k] = true;
        this._cache = log;
        try { localStorage.setItem(VIEW_LOG_KEY, JSON.stringify(log)); } catch {}
        return true;
    }
};

/* ================= SESSION ================= */
const currentUser = DB.getCurrentUser();
if (!currentUser) window.location.href = 'authorization.html';

const profileUserId = new URLSearchParams(location.search).get('id');
const isOwn = !profileUserId || String(profileUserId) === String(currentUser?.userId);
const profileOwner = isOwn ? currentUser : (DB.getUserById(profileUserId) || null);

const displayName = profileOwner
    ? ([profileOwner.firstName, profileOwner.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi')
    : 'Foydalanuvchi';
const displayUsername = profileOwner?.username ? '@' + profileOwner.username : '';
const initialLetter = (displayName || 'F').trim().charAt(0).toUpperCase() || 'F';

/* ================= HELPERS ================= */
function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diffSec = Math.floor((now - d) / 1000);
    if (diffSec < 5) return 'hozir';
    if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24);
    if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return dd + '.' + mm + '.' + d.getFullYear();
}
function avatarMarkup(user, cls){
    const name = user ? ([user.firstName, user.lastName].filter(Boolean).join(' ') || user.user || 'F') : 'F';
    const init = (name.trim().charAt(0) || 'F').toUpperCase();
    const photo = user?.photo_url;
    if (photo) return `<img class="${cls}" src="${photo}" alt="${escapeHtml(init)}">`;
    return `<div class="${cls.replace('-avatar','-avatar-initial')}">${init}</div>`;
}
function goToProfile(uid){
    if (!uid) return;
    if (String(uid) === String(currentUser?.userId)) window.location.href = 'profil.html';
    else window.location.href = `profil.html?id=${encodeURIComponent(uid)}`;
}
let toastTimer;
function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= PROFIL UI ================= */
if (isOwn) document.getElementById('ownProfileActions').style.display = 'flex';
else {
    document.getElementById('otherProfileActions').style.display = 'flex';
    document.getElementById('postBtn').style.display = 'none';
}
document.getElementById('userName').textContent = displayName;
document.getElementById('userStatus').textContent = displayUsername || 'Profil';

const userPhotoEl = document.getElementById('userPhoto');
const userInitialEl = document.getElementById('userInitial');
if (profileOwner?.photo_url) {
    userPhotoEl.src = profileOwner.photo_url;
    userPhotoEl.style.display = 'block';
    userInitialEl.style.display = 'none';
} else {
    userPhotoEl.style.display = 'none';
    userInitialEl.textContent = initialLetter;
    userInitialEl.style.display = 'flex';
}

document.getElementById('profilePicWrapper').addEventListener('click', () => {
    if (!isOwn) goToProfile(profileOwner?.userId);
});
document.getElementById('userName').addEventListener('click', () => {
    if (!isOwn) goToProfile(profileOwner?.userId);
});

document.getElementById('composerAvatarSlot').innerHTML = avatarMarkup(profileOwner, 'composer-avatar');
document.getElementById('navAvatarSlot').innerHTML = avatarMarkup(currentUser, 'nav-avatar');

/* ================= TUGMALAR ================= */
document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
window.history.pushState({ page: 1 }, '', '');
window.onpopstate = () => { window.location.href = 'index.html'; };

document.getElementById('editBtn')?.addEventListener('click', () => {
    location.href = 'tahrirlash.html';
});
document.getElementById('settingsBtn')?.addEventListener('click', () => { location.href = 'setting.html'; });
document.getElementById('subscribeBtn')?.addEventListener('click', () => {
    const b = document.getElementById('subscribeBtn');
    b.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Obuna bo'lindi`;
    b.style.opacity = '.7';
    b.disabled = true;
});
document.getElementById('messageBtn')?.addEventListener('click', () => {
    location.href = `xabar.html?chat=${encodeURIComponent(profileUserId)}`;
});

/* ================= ICONS/TEXTS ================= */
const icons = {
    posts: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,
    answers: `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
    saved: `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`
};
const texts = { posts: "Hali post yo'q", video: "Hali video yo'q", answers: "Hali javob yo'q", saved: "Hali saqlangan post yo'q" };

/* ================= POSTS ================= */
let posts = [];
const savedPosts = new Set();
let myReplies = [];

function loadMyPosts(){
    if (profileUserId) posts = PostStore.byUser(profileUserId);
    else {
        posts = PostStore.byUser(currentUser.userId);
        if (posts.length === 0) posts = PostStore.all().filter(p => p.user === displayName);
    }
    document.getElementById('postsCount').textContent = posts.length;
}

function renderList(list, key){
    const area = document.getElementById('contentArea');
    if (list.length === 0) {
        area.innerHTML = `<div class="empty-icon">${icons[key]}</div><p>${texts[key]}</p>`;
        return;
    }
    area.innerHTML = '<div class="feed" id="feed"></div>';
    const feed = document.getElementById('feed');
    list.forEach(p => feed.appendChild(buildPostItem(p)));
}

function countComments(p){
    let n = (p.comments || []).length;
    (p.comments || []).forEach(c => n += (c.replies || []).length);
    return n;
}

function registerView(p, item){
    const uid = currentUser?.userId;
    if (!uid || !p.id) return;
    if (ViewTracker.hasViewed(uid, p.id)) return;
    const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            io.disconnect();
            if (!ViewTracker.record(uid, p.id)) return;
            const fresh = PostStore.all().find(x => x.id === p.id);
            if (!fresh) return;
            const views = (fresh.views || 0) + 1;
            PostStore.update(p.id, { views });
            p.views = views;
            const vc = item.querySelector('.view-count');
            if (vc) vc.textContent = views;
        });
    }, { threshold: 0.5 });
    io.observe(item);
}

function buildPostItem(p){
    const item = document.createElement('div');
    item.className = 'post-item';
    item.dataset.id = p.id;

    const postName = p.user || 'Foydalanuvchi';
    const postInit = (postName.trim().charAt(0) || 'F').toUpperCase();

    const head = document.createElement('div');
    head.className = 'post-head';
    const avatarEl = document.createElement(p.avatar ? 'img' : 'div');
    if (p.avatar) { avatarEl.className = 'post-avatar'; avatarEl.src = p.avatar; avatarEl.alt = postInit; }
    else { avatarEl.className = 'post-avatar-initial'; avatarEl.textContent = postInit; }
    avatarEl.addEventListener('click', () => goToProfile(p.userId));
    head.appendChild(avatarEl);

    const info = document.createElement('div');
    info.className = 'post-head-info';
    const userEl = document.createElement('div');
    userEl.className = 'post-user';
    userEl.textContent = postName;
    userEl.addEventListener('click', () => goToProfile(p.userId));
    const timeEl = document.createElement('div');
    timeEl.className = 'post-time';
    timeEl.textContent = formatExactTime(p.createdAt || p.time);
    info.appendChild(userEl);
    info.appendChild(timeEl);
    head.appendChild(info);
    item.appendChild(head);

    if (p.text) {
        const text = document.createElement('div');
        text.className = 'post-text';
        text.textContent = p.text;
        item.appendChild(text);
    }
    if (p.type === 'image' && p.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.src = p.image;
        item.appendChild(img);
    }
    if (p.type === 'video' && p.image) {
        const vid = document.createElement('video');
        vid.className = 'post-video';
        vid.src = p.image;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        item.appendChild(vid);
    }

    const actions = document.createElement('div');
    actions.className = 'post-actions';

    
    // LIKE
    const likeBtn = document.createElement('button');
    likeBtn.className = 'act-btn' + (p.liked ? ' liked' : '');
    likeBtn.setAttribute('aria-label', 'Like');
    likeBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="act-count like-count">${p.likes || 0}</span>`;
    likeBtn.addEventListener('click', () => {
        const fresh = PostStore.all().find(x => x.id === p.id) || p;
        const liked = !fresh.liked;
        const likes = Math.max(0, (fresh.likes || 0) + (liked ? 1 : -1));
        PostStore.update(p.id, { liked, likes });
        p.liked = liked; p.likes = likes;
        likeBtn.classList.toggle('liked', liked);
        likeBtn.querySelector('.like-count').textContent = likes;
    });
    actions.appendChild(likeBtn);

    // COMMENT
    const commentBtn = document.createElement('button');
    commentBtn.className = 'act-btn';
    commentBtn.setAttribute('aria-label', 'Izohlar');
    commentBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="act-count comment-count">${countComments(p)}</span>`;
    commentBtn.addEventListener('click', () => openComments(p));
    actions.appendChild(commentBtn);

    // VIEW
    const viewBtn = document.createElement('button');
    viewBtn.className = 'act-btn';
    viewBtn.style.cursor = 'default';
    viewBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="act-count view-count">${p.views || 0}</span>`;
    actions.appendChild(viewBtn);

    // SAVE
    const saveBtn = document.createElement('button');
    saveBtn.className = 'act-btn' + (savedPosts.has(p.id) ? ' saved' : '');
    saveBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;
    saveBtn.addEventListener('click', () => {
        if (savedPosts.has(p.id)) { savedPosts.delete(p.id); saveBtn.classList.remove('saved'); showToast('Saqlanganlardan olib tashlandi'); }
        else { savedPosts.add(p.id); saveBtn.classList.add('saved'); showToast('Saqlandi'); }
        if (currentTab === 'saved') renderSaved();
    });
    actions.appendChild(saveBtn);

    // SHARE
    const shareBtn = document.createElement('button');
    shareBtn.className = 'act-btn';
    shareBtn.innerHTML = `<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`;
    shareBtn.addEventListener('click', () => {
        const link = location.origin + location.pathname + '?post=' + encodeURIComponent(p.id);
        if (navigator.share) navigator.share({ title: 'Post', text: p.text || 'Post', url: link }).catch(() => {});
        else { try { navigator.clipboard?.writeText(link); } catch {} showToast('Havola nusxalandi'); }
    });
    actions.appendChild(shareBtn);

    item.appendChild(actions);
    registerView(p, item);
    return item;
}

function renderPosts(){ renderList(posts, 'posts'); }
function renderVideos(){ renderList(posts.filter(p => p.type === 'video'), 'video'); }
function renderSaved(){ renderList(posts.filter(p => savedPosts.has(p.id)), 'saved'); }
function renderReplies(){
    const area = document.getElementById('contentArea');
    if (myReplies.length === 0) { area.innerHTML = `<div class="empty-icon">${icons.answers}</div><p>${texts.answers}</p>`; return; }
    area.innerHTML = '<div class="feed" id="feed"></div>';
    const feed = document.getElementById('feed');
    myReplies.forEach(r => {
        const item = document.createElement('div');
        item.className = 'post-item';
        const init = (r.user || 'F').trim().charAt(0).toUpperCase();
        item.innerHTML = `
            <div class="post-head">
                ${r.avatar ? `<img class="post-avatar" src="${r.avatar}" alt="${escapeHtml(init)}">` : `<div class="post-avatar-initial">${init}</div>`}
                <div class="post-head-info">
                    <div class="post-user">${escapeHtml(r.user)}</div>
                    <div class="post-time">${escapeHtml(formatExactTime(r.createdAt))}</div>
                </div>
            </div>
            <div class="post-text">${escapeHtml(r.text)}</div>
            <div style="font-size:12px;color:#5a5a5e;margin-top:8px">Javob: "${escapeHtml(r.postText || 'post')}"</div>`;
        feed.appendChild(item);
    });
}

/* ================= COMMENTS ================= */
const commentsOverlay = document.getElementById('commentsOverlay');
const commentsPanel = document.getElementById('commentsPanel');
const commentsList = document.getElementById('commentsList');
const commentsInput = document.getElementById('commentsInput');
const commentsSend = document.getElementById('commentsSend');
const commentsClose = document.getElementById('commentsClose');
const replyIndicator = document.getElementById('replyIndicator');
const replyText = document.getElementById('replyText');
const cancelReply = document.getElementById('cancelReply');

let activePost = null;
let replyTarget = null;

function openComments(p){
    activePost = p;
    replyTarget = null;
    if (!activePost.comments) activePost.comments = [];
    replyIndicator.classList.remove('show');
    renderComments();
    commentsOverlay.classList.add('show');
    commentsPanel.classList.add('show');
}
function closeComments(){
    commentsOverlay.classList.remove('show');
    commentsPanel.classList.remove('show');
    activePost = null;
    replyTarget = null;
    commentsInput.value = '';
    commentsSend.disabled = true;
}
commentsOverlay.addEventListener('click', closeComments);
commentsClose.addEventListener('click', closeComments);
cancelReply.addEventListener('click', () => {
    replyTarget = null;
    replyIndicator.classList.remove('show');
});

function renderComments(){
    if (!activePost) return;
    commentsList.innerHTML = '';
    if (!activePost.comments.length) {
        commentsList.innerHTML = '<div class="comments-empty">Hali izoh yo\'q. Birinchi bo\'ling!</div>';
        return;
    }
    activePost.comments.forEach(c => commentsList.appendChild(buildComment(c, false)));
}

function buildComment(c, isReply){
    const wrap = document.createElement('div');
    wrap.className = isReply ? 'comment-reply-item' : 'comment-item';
    const init = (c.user || 'F').trim().charAt(0).toUpperCase();
    const av = c.avatar
        ? `<img class="comment-avatar" src="${c.avatar}" alt="" data-uid="${c.userId||''}">`
        : `<div class="comment-avatar-initial" data-uid="${c.userId||''}">${init}</div>`;

    wrap.innerHTML = `
        ${av}
        <div class="comment-body">
            <div class="comment-top">
                <span class="comment-user" data-uid="${c.userId||''}">${escapeHtml(c.user)}</span>
                <span class="comment-time">${escapeHtml(formatExactTime(c.createdAt || c.time))}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
            <div class="comment-actions">
                <button class="comment-reply-btn" data-cid="${c.id}">Javob berish</button>
                <button class="comment-like-btn ${c.liked ? 'liked' : ''}" data-cid="${c.id}">
                    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span class="comment-like-count">${c.likes || 0}</span>
                </button>
            </div>
        </div>`;

    wrap.querySelectorAll('[data-uid]').forEach(el => {
        el.addEventListener('click', () => goToProfile(el.getAttribute('data-uid')));
    });
    wrap.querySelector('.comment-reply-btn').addEventListener('click', () => {
        replyTarget = { commentId: c.id, user: c.user };
        replyText.textContent = `@${c.user} ga javob`;
        replyIndicator.classList.add('show');
        commentsInput.focus();
    });
    const likeBtn = wrap.querySelector('.comment-like-btn');
    likeBtn.addEventListener('click', () => {
        const fresh = PostStore.all().find(x => x.id === activePost.id);
        if (!fresh) return;
        const comments = fresh.comments || [];
        let target = comments.find(x => x.id === c.id);
        if (!target) {
            for (const cc of comments) {
                const rr = (cc.replies || []).find(r => r.id === c.id);
                if (rr) { target = rr; break; }
            }
        }
        if (!target) return;
        target.liked = !target.liked;
        target.likes = Math.max(0, (target.likes || 0) + (target.liked ? 1 : -1));
        PostStore.update(activePost.id, { comments });
        c.liked = target.liked; c.likes = target.likes;
        likeBtn.classList.toggle('liked', target.liked);
        likeBtn.querySelector('.comment-like-count').textContent = target.likes;
    });

    if (!isReply && c.replies && c.replies.length) {
        const box = document.createElement('div');
        box.className = 'comment-replies';
        c.replies.forEach(r => box.appendChild(buildComment(r, true)));
        wrap.querySelector('.comment-body').appendChild(box);
    }
    return wrap;
}

commentsInput.addEventListener('input', () => {
    commentsInput.style.height = 'auto';
    commentsInput.style.height = Math.min(commentsInput.scrollHeight, 80) + 'px';
    commentsSend.disabled = commentsInput.value.trim().length === 0;
});

commentsSend.addEventListener('click', () => {
    const txt = commentsInput.value.trim();
    if (!txt || !activePost) return;
    const userId = currentUser?.userId || '';
    const newC = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        userId,
        user: displayName,
        avatar: profileOwner?.photo_url || null,
        text: txt,
        createdAt: new Date().toISOString(),
        likes: 0,
        liked: false,
        replies: []
    };

    if (replyTarget) {
        const parent = activePost.comments.find(c => c.id === replyTarget.commentId);
        if (parent) (parent.replies = parent.replies || []).push(newC);
    } else {
        activePost.comments.push(newC);
    }

    PostStore.update(activePost.id, { comments: activePost.comments });
    myReplies.unshift({
        id: newC.id, postId: activePost.id, userId,
        user: displayName, avatar: newC.avatar, text: txt,
        createdAt: newC.createdAt, postText: activePost.text
    });

    commentsInput.value = '';
    commentsInput.style.height = 'auto';
    commentsSend.disabled = true;
    replyTarget = null;
    replyIndicator.classList.remove('show');
    renderComments();

    const item = document.querySelector(`.post-item[data-id="${activePost.id}"]`);
    if (item) {
        const cc = item.querySelector('.comment-count');
        if (cc) cc.textContent = countComments(activePost);
    }
    commentsList.scrollTop = commentsList.scrollHeight;
});

/* ================= TABS ================= */
let currentTab = 'posts';
function switchTab(k){
    currentTab = k;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === k));
    if (k === 'posts') renderPosts();
    else if (k === 'video') renderVideos();
    else if (k === 'answers') renderReplies();
    else if (k === 'saved') renderSaved();
}
document.getElementById('tabsContainer').addEventListener('click', e => {
    const tab = e.target.closest('.tab-item');
    if (tab) switchTab(tab.dataset.tab);
});

/* ================= COMPOSER ================= */
const postBtn = document.getElementById('postBtn');
const overlay = document.getElementById('composerOverlay');
const composer = document.getElementById('composer');
const input = document.getElementById('composerInput');
const submitBtn = document.getElementById('composerSubmit');
const attachBtn = document.getElementById('attachBtn');
const attachVideoBtn = document.getElementById('attachVideoBtn');
const fileInput = document.getElementById('fileInput');
const videoInput = document.getElementById('videoInput');
const preview = document.getElementById('composerPreview');
const previewImg = document.getElementById('previewImg');
const previewVid = document.getElementById('previewVid');
const removeImg = document.getElementById('removeImg');
const composerClose = document.getElementById('composerClose');

let currentMedia = null;

function refreshSubmit(){ submitBtn.disabled = !(input.value.trim().length > 0 || currentMedia); }
function openComposer(){ overlay.classList.add('show'); composer.classList.add('show'); setTimeout(() => input.focus(), 300); }
function closeComposer(){ overlay.classList.remove('show'); composer.classList.remove('show'); input.blur(); }

postBtn?.addEventListener('click', openComposer);
overlay.addEventListener('click', closeComposer);
composerClose.addEventListener('click', closeComposer);

input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
    refreshSubmit();
});

attachBtn.addEventListener('click', () => fileInput.click());
attachVideoBtn.addEventListener('click', () => videoInput.click());

function handleMedia(file, type){
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        currentMedia = { data: ev.target.result, type };
        if (type === 'image') {
            previewImg.src = currentMedia.data; previewImg.style.display = 'block';
            previewVid.style.display = 'none'; previewVid.src = '';
        } else {
            previewVid.src = currentMedia.data; previewVid.style.display = 'block';
            previewImg.style.display = 'none'; previewImg.src = '';
        }
        preview.classList.add('show');
        refreshSubmit();
    };
    reader.readAsDataURL(file);
}

fileInput.addEventListener('change', e => { handleMedia(e.target.files[0], 'image'); fileInput.value = ''; });
videoInput.addEventListener('change', e => { handleMedia(e.target.files[0], 'video'); videoInput.value = ''; });

removeImg.addEventListener('click', () => {
    currentMedia = null;
    preview.classList.remove('show');
    previewImg.src = ''; previewImg.style.display = 'none';
    previewVid.src = ''; previewVid.style.display = 'none';
    refreshSubmit();
});

submitBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text && !currentMedia) return;
    const type = currentMedia ? (currentMedia.type === 'video' ? 'video' : 'image') : 'text';
    const newPost = {
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        userId: currentUser?.userId || 'me',
        user: displayName,
        avatar: profileOwner?.photo_url || null,
        createdAt: new Date().toISOString(),
        text,
        image: currentMedia ? currentMedia.data : null,
        type,
        likes: 0, liked: false, views: 0, comments: []
    };
    PostStore.add(newPost);
    posts = profileUserId ? PostStore.byUser(profileUserId) : PostStore.byUser(currentUser?.userId || 'me');
    document.getElementById('postsCount').textContent = posts.length;

    input.value = '';
    input.style.height = 'auto';
    currentMedia = null;
    preview.classList.remove('show');
    previewImg.src = ''; previewImg.style.display = 'none';
    previewVid.src = ''; previewVid.style.display = 'none';
    refreshSubmit();
    closeComposer();
    setTimeout(() => switchTab('posts'), 250);
});

/* ================= INIT ================= */
loadMyPosts();
switchTab('posts');
</script>
