<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Telegram Mini App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SPA Sahifalar uchun --- */
        .page {
            display: none;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; /* Pastki menyu uchun joy */
            min-height: 100vh;
            animation: fadeIn 0.3s ease;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* --------------------------- */

        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-edit {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active { transform: scale(0.96); }

        .btn-edit svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-settings {
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:active {
            transform: scale(0.95) rotate(45deg);
        }

        .btn-settings svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
        }

        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 30px;
            gap: 2px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 12px 6px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: all 0.25s ease;
            font-weight: 500;
        }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 600;
        }

        .content-area {
            color: #8e8e93;
            font-size: 16px;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f3f46;
        }

        .empty-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Pastki Menyu */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            bottom: calc(16px + env(safe-area-inset-bottom)); /* iOS uchun himoya */
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 0 12px;
            cursor: pointer;
            background: none;
            border: none;
            color: #a1a1aa;
            transition: all 0.2s ease;
        }

        .nav-btn.nav-active { color: #ffffff; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .nav-btn .nav-label { font-size: 10px; font-weight: 500; }
        
        .nav-btn .nav-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid transparent;
        }
        
        .nav-btn.nav-active .nav-avatar {
            border-color: #ffffff;
        }

        #otherProfileActions .btn-message {
            background-color: #1c1c1e;
            color: #ffffff;
        }
        
        /* Loading holati */
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 50px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- 1. PROFIL SAHIFASI -->
    <div id="page-profile" class="page active">
        <div class="profile-pic-wrapper">
            <!-- Xato bo'lsa standart SVG rasmga qaytish uchun onerror qo'shildi -->
            <img id="userPhoto"
                 src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>"
                 onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%231c1c1e\'/><circle cx=\'50\' cy=\'40\' r=\'18\' fill=\'%233f3f46\'/><ellipse cx=\'50\' cy=\'90\' rx=\'30\' ry=\'22\' fill=\'%233f3f46\'/></svg>';"
                 alt="Profil rasmi" class="profile-pic">
        </div>

        <h1 class="name" id="userName">Yuklanmoqda...</h1>
        <p class="last-seen" id="userStatus">...</p>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
        </div>

        <div class="action-buttons">
            <div id="ownProfileActions" style="display:none; width:100%; gap:10px;">
                <button class="btn-edit" id="editBtn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Tahrirlash</button>
                <button class="btn-settings" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
            </div>
            <div id="otherProfileActions" style="display:none; width:100%; gap:10px;">
                <button class="btn-edit" id="subscribeBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg> Obuna bo'lish</button>
                <button class="btn-edit btn-message" id="messageBtn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg> Xabar</button>
            </div>
        </div>

        <div class="tabs" id="tabsContainer">
            <div class="tab-item active" data-tab="home">Bosh sahifa</div>
            <div class="tab-item" data-tab="posts">Postlar</div>
            <div class="tab-item" data-tab="video">Video</div>
        </div>

        <div class="content-area" id="mainContent">
            <div class="empty-icon" id="emptyIcon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <p id="contentText">Ma'lumotlar yuklanmoqda...</p>
        </div>
    </div>

    <!-- BOSHQA SAHIFALAR (SPA uchun) -->
    <div id="page-home" class="page">
        <h2>Bosh sahifa / Lenta</h2>
        <p style="color: #8e8e93; margin-top: 10px;">Lenta bo'sh</p>
    </div>
    <div id="page-reels" class="page">
        <h2>Reels</h2>
        <p style="color: #8e8e93; margin-top: 10px;">Videolar bu yerda chiqadi</p>
    </div>
    <div id="page-messages" class="page">
        <h2>Xabarlar</h2>
        <p style="color: #8e8e93; margin-top: 10px;">Xabarlar ro'yxati</p>
    </div>
    <div id="page-search" class="page">
        <h2>Qidiruv</h2>
        <p style="color: #8e8e93; margin-top: 10px;">Qidiruv tizimi</p>
    </div>

    <!-- PASTKI NAVIGATSIYA (Routing) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <button class="nav-btn" data-target="page-home">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span class="nav-label">Uy</span>
            </button>
            <button class="nav-btn" data-target="page-reels">
                <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><line x1="2" y1="8" x2="22" y2="8"></line><line x1="2" y1="16" x2="22" y2="16"></line><line x1="8" y1="2" x2="8" y2="8"></line><line x1="16" y1="2" x2="16" y2="8"></line><polygon points="10 12 15 14.5 10 17 10 12" fill="currentColor"></polygon></svg>
                <span class="nav-label">Reels</span>
            </button>
            <button class="nav-btn" data-target="page-messages">
                <svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                <span class="nav-label">Xabar</span>
            </button>
            <button class="nav-btn" data-target="page-search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <span class="nav-label">Qidiruv</span>
            </button>
            <button class="nav-btn nav-active" data-target="page-profile">
                <img id="navUserPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" alt="Profile" class="nav-avatar"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%231c1c1e\'/><circle cx=\'50\' cy=\'40\' r=\'18\' fill=\'%233f3f46\'/><ellipse cx=\'50\' cy=\'90\' rx=\'30\' ry=\'22\' fill=\'%233f3f46\'/></svg>';">
                <span class="nav-label">Profil</span>
            </button>
        </div>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        
        // Dastlabki sozlamalar
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // BACKENDGA ULASH UCHUN TAYYOR FUNKSIYA (Xavfsizlik uchun)
        async function authenticateUser() {
            // Haqiqiy loyihada tg.initData ni serverga yuborasiz:
            // const response = await fetch('https://sizning-serveringiz.uz/api/auth', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify({ initData: tg.initData })
            // });
            // return await response.json();
            return { success: true }; // Hozircha mock (yolg'on) javob
        }

        // Ma'lumotlarni serverdan olish simulyatsiyasi
        async function fetchProfileData(userId) {
            return new Promise(resolve => {
                setTimeout(() => {
                    resolve({
                        subs: 124,
                        followers: 5390,
                        posts: 42
                    });
                }, 800); // 0.8 soniya kutish effekti
            });
        }

        // Ilova yuklanganda ishlaydigan asosiy funksiya
        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const profileUserId = urlParams.get('id');
            const user = tg?.initDataUnsafe?.user;
            const myUserId = user?.id;
            
            const isOwnProfile = !profileUserId || String(profileUserId) === String(myUserId);

            // Foydalanuvchi ismlari va rasmlarini qo'yish
            if (isOwnProfile && user) {
                const fullName = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
                document.getElementById('userName').textContent = fullName;
                document.getElementById('userStatus').textContent = user.username ? '@' + user.username : 'Telegram foydalanuvchisi';
                
                if (user.photo_url) {
                    document.getElementById('userPhoto').src = user.photo_url;
                    document.getElementById('navUserPhoto').src = user.photo_url;
                }
                document.getElementById('ownProfileActions').style.display = 'flex';
            } else {
                // Boshqa odam profiliga kirganda
                document.getElementById('userName').textContent = 'Foydalanuvchi';
                document.getElementById('userStatus').textContent = 'Profil #' + profileUserId;
                document.getElementById('otherProfileActions').style.display = 'flex';
            }

            // Backenddan ma'lumotlarni kutish (simulyatsiya)
            document.getElementById('contentText').innerHTML = '<div class="loading-spinner"></div>';
            document.getElementById('emptyIcon').style.display = 'none';
            
            const stats = await fetchProfileData(profileUserId || myUserId);
            
            // Statistikani yangilash
            document.getElementById('subsCount').textContent = stats.subs;
            document.getElementById('followersCount').textContent = stats.followers;
            document.getElementById('postsCount').textContent = stats.posts;
            
            // Tab matnini tiklash
            document.getElementById('emptyIcon').style.display = 'flex';
            document.getElementById('contentText').textContent = "Hali ma'lumot yo'q";
        }

        // SPA ROUTING (Sahifalarni almashish mexanizmi)
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                tg?.HapticFeedback?.selectionChanged();
                
                const targetPageId = btn.dataset.target;
                
                // Hamma sahifalarni yashirish
                document.querySelectorAll('.page').forEach(page => {
                    page.classList.remove('active');
                });
                
             // Kerakli sahifani ko'rsatish
                document.getElementById(targetPageId).classList.add('active');

                // Tugmalarni aktiv/passiv qilish
                document.querySelectorAll('.nav-btn').forEach(nav => {
                    nav.classList.remove('nav-active');
                });
                btn.classList.add('nav-active');
            });
        });

        // Tablarni boshqarish (Profil sahifasi ichida)
        const tabContents = {
            home: { text: "Hali ma'lumot yo'q", icon: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>` },
            posts: { text: "Hali post yo'q", icon: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>` },
            video: { text: "Hali video yo'q", icon: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>` }
        };

        document.getElementById('tabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            const key = tab.dataset.tab;
            document.getElementById('contentText').textContent = tabContents[key].text;
            document.getElementById('emptyIcon').innerHTML = tabContents[key].icon;

            tg?.HapticFeedback?.selectionChanged();
        });

        // Obuna bo'lish tugmasi logikasi
        document.getElementById('subscribeBtn')?.addEventListener('click', function() {
            tg?.HapticFeedback?.impactOccurred('medium');
            this.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> Obuna bo'lindi`;
            this.style.opacity = '0.7';
            this.disabled = true;
            // Bu yerda backendga POST request yuboriladi
        });

        // Dasturni ishga tushirish
        initApp();
    </script>
</body>
</html>
