<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T2 Profile Card UI</title>
<style>
    body {
        /* Markazlashtirish va fonga rang berish (ko'rsatilgan dizayn ajralib turishi uchun) */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f2f2f2;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .profile-card {
        width: 320px;
        height: 360px;
        /* Tepadan pastga kulrang va qora gradient fon */
        background: linear-gradient(to bottom, #a3a3a3 0%, #616161 50%, #222222 100%);
        /* Faqat pastki burchaklarni yumaloqlash */
        border-bottom-left-radius: 32px;
        border-bottom-right-radius: 32px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px 20px;
        box-sizing: border-box;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        position: relative;
    }

    .avatar-container {
        width: 76px;
        height: 76px;
        background-color: black;
        border-radius: 50%;
        border: 2.5px solid white;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 16px;
    }

    .avatar-logo {
        color: white;
        font-size: 28px;
        font-weight: 500;
        display: flex;
        align-items: center;
        letter-spacing: -1px;
    }

    .logo-square {
        width: 9px;
        height: 9px;
        background-color: #e6007e; /* Pushti kvadrat */
        margin-right: 2px;
        margin-top: 3px;
    }

    .profile-name {
        color: white;
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 16px 0;
    }

    .action-buttons {
        display: flex;
        gap: 10px;
    }

    .btn {
        border: none;
        border-radius: 8px;
        background-color: white;
        color: #111;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        transition: background-color 0.2s;
    }

    .btn:hover {
        background-color: #f0f0f0;
    }

    .btn-subscribe {
        flex: 1.8;
    }

    .btn-message {
        flex: 1.2;
    }

    .btn-icon {
        width: 42px;
        height: 40px;
        padding: 0;
        flex-shrink: 0;
    }

    /* SVG ikonkasi (Tashqi havola / Ulashish) */
    .btn-icon svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: black;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
</style>
</head>
<body>

<div class="profile-card">
    <div class="avatar-container">
        <div class="avatar-logo">
            <div class="logo-square"></div>
            t2
        </div>
    </div>
    
    <h2 class="profile-name">T2</h2>
    
    <div class="action-buttons">
        <button class="btn btn-subscribe">Obuna bo'lish</button>
        <button class="btn btn-message">Xabar</button>
        <button class="btn btn-icon" aria-label="Ulashish">
            <svg viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        </button>
    </div>
</div>

</body>
</html>
