<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Uy - L.uz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Telegram Web App skripti (majburiy) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 200px 0;display:flex;flex-direction:column}
        
        /* ✅ Header: "Lenta" 40px pastga tushirildi */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 80px 20px 15px 20px;  /* 40px + 40px = 80px tepadan */
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }
        
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feed{width:100%;display:flex;flex-direction:column;padding:0 20px;}
        
        /* Chiziqlar olib tashlangan */
        .post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;transition:opacity .15s ease}
        .post-item:active{opacity:.9}
        @keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        @keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
        @keyframes detailIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .post-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;cursor:pointer}
        .post-avatar-initial{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase;cursor:pointer}
        .post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .post-user{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
        .post-user:active{opacity:.7}
        .post-time{font-size:12px;color:#8e8e93;margin-top:1px}
        .post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        .post-image{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}
        .post-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;background:#000}
        .post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:6px 4px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:14px;text-align:left}
        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .act-btn.saved{color:#fff}
        .act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .empty{text-align:center;color:#5a5a5e;padding:60px 20px;font-size:15px;line-height:1.6}
        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
        .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
        .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 8px;transition:transform .15s ease,opacity .15s ease;cursor:pointer;background:none;border:none;font-family:inherit;flex:1}
        .nav-btn:active{transform:scale(.85);opacity:.7}
        .nav-active{color:#fff}.nav-inactive{color:#a1a1aa}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
        .nav-btn .nav-label{font-size:10px;font-weight:500}
        .nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e}
        .nav-btn .nav-avatar-initial{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;text-transform:uppercase}

        /* ============ DETAIL (POST) ============ */
        .detail-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .25s ease both}
        .detail-overlay.show{display:flex}
        .detail-header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + 40px);border-bottom:1px solid #1f1f22;flex-shrink:0;background:#000;max-width:420px;width:100%;margin:0 auto}
        .detail-back{background:#1c1c1e;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;flex-shrink:0;transition:transform .15s,background .2s}
        .detail-back:active{transform:scale(.9);background:#2c2c2e}
        .detail-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .detail-title{font-size:17px;font-weight:700}
        .detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:420px;width:100%;margin:0 auto}
        .detail-post{padding:16px;border-bottom:1px solid #1f1f22}
        .detail-post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .detail-avatar,.detail-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0}
        .detail-avatar{object-fit:cover;background:#1c1c1e}
        .detail-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
        .detail-info{display:flex;flex-direction:column;min-width:0;flex:1}
        .detail-user{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .detail-time{font-size:12px;color:#8e8e93;margin-top:2px}
        .detail-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        .detail-image,.detail-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}
        .detail-video{background:#000}
        .detail-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
        .detail-comments-title{padding:16px 16px 8px;font-size:14px;font-weight:700;color:#8e8e93;text-transform:uppercase;letter-spacing:.5px}
        .detail-comments-list{padding:0 16px;display:flex;flex-direction:column;gap:16px}
        .detail-empty{text-align:center;color:#5a5a5e;font-size:14px;padding:30px 0}

        /* ===== IZOH THREAD ===== */
        .comment-thread{display:flex;flex-direction:column;animation:postIn .3s ease both;position:relative}
        .thread-nested{position:relative}
        .comment-row{display:flex;gap:10px;cursor:pointer;padding:4px 0;transition:opacity .15s ease;align-items:flex-start}
        .comment-row:active{opacity:.85}
        .comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
        .comment-avatar,.comment-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;z-index:2;background:#1c1c1e}
        .comment-avatar{object-fit:cover;background:#1c1c1e}
        .comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
        .thread-line-down{width:2px;background:#4a4a4e;flex:1;margin-top:6px;min-height:20px;border-radius:1px;align-self:center}
        .comment-content{flex:1;min-width:0;padding-bottom:4px}
        .comment-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
        .comment-user{font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .comment-user:active{opacity:.7}
        .comment-time{font-size:12px;color:#8e8e93}
        .comment-text{font-size:14px;line-height:1.5;color:#e5e5ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
        .comment-actions{display:flex;gap:4px;align-items:center;justify-content:space-between;padding-top:2px;max-width:340px}
        .comment-act{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;padding:8px 6px;display:flex;align-items:center;gap:5px;flex:1;justify-content:center;border-radius:10px;transition:transform .15s,color .2s,background .15s}
        .comment-act:active{transform:scale(.9);background:rgba(255,255,255,.06)}
        .comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
        .comment-act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:10px;text-align:left}
        .comment-act.liked{color:#ff2d55}
        .comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        .comment-act.saved{color:#fff}
        .comment-act.saved svg{fill:#fff;stroke:#fff}

        /* ===== JAVOBLAR ===== */
        .comment-replies{display:flex;flex-direction:column;position:relative;padding-bottom:4px}
        .reply-row{display:flex;gap:10px;cursor:pointer;padding:6px 0;position:relative;transition:opacity .15s ease;align-items:flex-start}
        .reply-row:active{opacity:.85}
        .reply-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
        .reply-row .comment-avatar,
        .reply-row .comment-avatar-initial{width:42px;height:42px;font-size:16px;position:relative;z-index:2}
        .reply-row .reply-avatar-col.has-through::before{content:'';position:absolute;top:-30px;bottom:50%;left:50%;transform:translateX(-50%);width:2px;background:#4a4a4e;z-index:1}
        .reply-row:last-child .reply-avatar-col.has-through::after{display:none}
        .reply-row:not(:last-child) .reply-avatar-col.has-through::after{content:'';position:absolute;top:50%;bottom:-6px;left:50%;transform:translateX(-50%);width:2px;background:#4a4a4e;z-index:1}
        .reply-row .comment-user{font-size:13px}
        .reply-row .comment-time{font-size:11px}
        .reply-row .comment-text{font-size:13px}
        .reply-row .comment-act{padding:6px 4px}
        .reply-row .comment-act svg{width:16px;height:16px}
        .reply-row .comment-act-count{font-size:11px}
        .comment-more-btn{background:none;border:none;color:#0a84ff;font-size:12px;font-weight:600;cursor:pointer;padding:4px 0 4px 52px;margin-top:2px;font-family:inherit;text-align:left}
        .comment-more-btn:active{opacity:.7}

        /* ===== REPLY MODE BAR ===== */
        .reply-mode-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(10,132,255,.12);border-top:1px solid rgba(10,132,255,.2);font-size:12px;color:#0a84ff;font-weight:600;max-width:420px;width:100%;margin:0 auto}
        .reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .reply-mode-bar button{background:none;border:none;color:#0a84ff;font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px;font-family:inherit}
        .reply-mode-bar button:active{background:rgba(10,132,255,.2)}

        .detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:#000;max-width:420px;width:100%;margin:0 auto}
        .detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e;transition:border-color .2s}
        .detail-island:focus-within{border-color:#3a3a3c}
        .detail-island.reply-mode{border-color:#0a84ff;box-shadow:0 0 0 1px rgba(10,132,255,.25)}
        .detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
        .detail-input::placeholder{color:#5a5a5e}
        .detail-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,opacity .2s}
        .detail-send:active{transform:scale(.9)}
        .detail-send:disabled{opacity:.4;cursor:not-allowed}
        .detail-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

        /* ===== COMMENT DETAIL VIEW ===== */
        .comment-detail-overlay{position:fixed;inset:0;background:#000;z-index:600;display:none;flex-direction:column;animation:detailIn .25s ease both}
        .comment-detail-overlay.show{display:flex}
        .comment-detail-header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + 40px);border-bottom:none;flex-shrink:0;background:#000;max-width:420px;width:100%;margin:0 auto}
        .comment-detail-title{font-size:17px;font-weight:700}
        .comment-detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:420px;width:100%;margin:0 auto}
        .comment-detail-main{padding:16px;background:transparent}
        .comment-detail-replies{padding:16px;display:flex;flex-direction:column;gap:16px}

        .comment-highlight{animation:commentHi 1.3s ease}
        @keyframes commentHi{0%,100%{background:transparent}20%,60%{background:rgba(255,255,255,.06)}}

        .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:#1c1c1e;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid #2c2c2e;max-width:80%;text-align:center}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="brand-title">Lenta</h1>
        <!-- ✅ Bildirishnoma ikonkasi: notification.html ga o'tadi -->

    <div class="comment-detail-scroll" id="commentDetailScroll">

    <div class="detail-input-bar">
        <div class="detail-island" id="commentDetailIsland">
            <textarea class="detail-input" id="commentDetailInput" placeholder="Javob yozish..." rows="1"></textarea>
            <button class="detail-send" id="commentDetailSend" disabled>
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= KONSTANTALAR ================= */
const MAX_VISIBLE_DEPTH = 2;
const REPLIES_KEY = 'luz_my_replies_v1';

/* ================= TELEGRAM WEBAPP INIT ================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

if (tg) {
    try {
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        if (tg.BackButton) tg.BackButton.show();
    } catch (e) {
        console.warn('Telegram WebApp init error:', e);
    }
}

/* ================= DB ================= */
const DB = {
    _K: 'luz_users',
    _S: 'luz_current_user',
    getCurrentUser(){
        const id = localStorage.getItem(this._S);
        if (!id) return null;
        try {
            const users = JSON.parse(localStorage.getItem(this._K)) || [];
            return users.find(u => u.userId === id) || null;
        } catch { return null; }
    }
};

/* ================= POST STORE ================= */
const POST_STORE_KEY = 'tg_feed_posts_v1';
const PostStore = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(POST_STORE_KEY);
            this._cache = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(this._cache)) this._cache = [];
        } catch { this._cache = []; }
        return this._cache;
    },
    _save(){
        try { localStorage.setItem(POST_STORE_KEY, JSON.stringify(this._cache || [])); return true; }
        catch { showToast('Saqlashda xatolik'); return false; }
    },
    all(){ return this._load().slice(); },
    get(id){ return this._load().find(p => p.id === id) || null; },
    update(id, patch){
        const list = this._load();
        const i = list.findIndex(p => p.id === id);
        if (i < 0) return null;
        list[i] = Object.assign({}, list[i], patch);
        this._cache = list;
        this._save();
        return list[i];
    }
};

/* ================= VIEW TRACKER ================= */
const VIEW_LOG_KEY = 'luz_view_log_v1';
const ViewTracker = {
    _cache: null,
    _load(){
        if (this._cache !== null) return this._cache;
        try {
            const raw = localStorage.getItem(VIEW_LOG_KEY);
            this._cache = raw ? JSON.parse(raw) : {};
            if (!this._cache || typeof this._cache !== 'object') this._cache = {};
        } catch { this._cache = {}; }
        return this._cache;
    },
    _key(uid, pid){ return String(uid) + '::' + String(pid); },
    hasViewed(uid, pid){
        if (!uid || !pid) return false;
        return this._load()[this._key(uid, pid)] === true;
    },
    record(uid, pid){
        if (!uid || !pid) return false;
        const log = this._load();
        const k = this._key(uid, pid);
        if (log[k] === true) return false;
        log[k] = true;
        this._cache = log;
        try { localStorage.setItem(VIEW_LOG_KEY, JSON.stringify(log)); } catch {}
        return true;
    }
};

/* ================= HELPERS ================= */
function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const diffSec = Math.floor((now - d) / 1000);
    if (diffSec < 5) return 'hozir';
    if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60);
    if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60);
    if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24);
    if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return dd + '.' + mm + '.' + d.getFullYear();
}
function goToProfile(uid){

}
let toastTimer;
function showToast(msg){
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ================= IZOH HELPERS (NESTED) ================= */
function findComment(comments, id){
    for (const c of (comments || [])) {
        if (c.id === id) return { comment: c, parent: null, isReply: false, root: c };
        const found = findInReplies(c, id, c);
        if (found) return found;
    }
    return null;
}
function findInReplies(parent, id, root){
    for (const r of (parent.replies || [])) {
        if (r.id === id) return { comment: r, parent, isReply: true, root };
        const found = findInReplies(r, id, root);
        if (found) return found;
    }
    return null;
}
function makeCommentObj(text, parentId){
    return {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        userId: currentUser?.userId || '',
        user: [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi',
        avatar: currentUser.photo_url || null,
        text,
        createdAt: new Date().toISOString(),
        likes: 0, liked: false, replies: [],
        parentId: parentId || null
    };
}
function addCommentToPost(postId, newComment, replyToId){
    const post = PostStore.get(postId);
    if (!post) return null;
    if (!post.comments) post.comments = [];

    if (!replyToId) {
        newComment.parentId = null;
        post.comments.push(newComment);
        PostStore.update(postId, { comments: post.comments });
        return { post, comment: newComment, parent: null };
    }

    const found = findComment(post.comments, replyToId);
    if (!found) return null;

    newComment.parentId = replyToId;
    if (!found.comment.replies) found.comment.replies = [];
    found.comment.replies.push(newComment);

    PostStore.update(postId, { comments: post.comments });
    return { post, comment: newComment, parent: found.comment };
}
function countRepliesDeep(c){
    let n = (c.replies || []).length;
    (c.replies || []).forEach(r => { n += countRepliesDeep(r); });
    return n;
}

/* ================= POST RENDER ================= */
const savedPosts = new Set();

function countComments(p){
    let n = 0;
    const walk = (arr) => arr.forEach(c => { n++; if (c.replies) walk(c.replies); });
    walk(p.comments || []);
    return n;
}

function registerView(p, item){
    const uid = currentUser?.userId;
    if (!uid || !p.id) return;
    if (ViewTracker.hasViewed(uid, p.id)) return;
    const io = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            io.disconnect();
            if (!ViewTracker.record(uid, p.id)) return;
            const fresh = PostStore.get(p.id);
            if (!fresh) return;
            const views = (fresh.views || 0) + 1;
            PostStore.update(p.id, { views });
            p.views = views;
            const vc = item.querySelector('.view-count');
            if (vc) vc.textContent = views;
        });
    }, { threshold: 0.5 });
    io.observe(item);
}

function handleShare(entity){
    const link = location.origin + location.pathname + '?post=' + encodeURIComponent(entity.id);
    if (navigator.share) navigator.share({ title: 'Post', text: entity.text || 'Post', url: link }).catch(() => {});
    else { try { navigator.clipboard?.writeText(link); } catch {} showToast('Havola nusxalandi'); }
}

function buildPostItem(p){
    const item = document.createElement('div');
    item.className = 'post-item';
    item.dataset.id = p.id;

    const postName = p.user || 'Foydalanuvchi';
    const postInit = (postName.trim().charAt(0) || 'F').toUpperCase();

    const head = document.createElement('div');
    head.className = 'post-head';
    const avatarEl = document.createElement(p.avatar ? 'img' : 'div');
    if (p.avatar) {
        avatarEl.className = 'post-avatar';
        avatarEl.src = p.avatar;
        avatarEl.alt = postInit;
    } else {
        avatarEl.className = 'post-avatar-initial';
        avatarEl.textContent = postInit;
    }
    avatarEl.addEventListener('click', (e) => { e.stopPropagation(); goToProfile(p.userId); });
    head.appendChild(avatarEl);

    const info = document.createElement('div');
    info.className = 'post-head-info';
    const userEl = document.createElement('div');
    userEl.className = 'post-user';
    userEl.textContent = postName;
    userEl.addEventListener('click', (e) => { e.stopPropagation(); goToProfile(p.userId); });
    const timeEl = document.createElement('div');
    timeEl.className = 'post-time';
    timeEl.textContent = formatExactTime(p.createdAt || p.time);
    info.appendChild(userEl);
    info.appendChild(timeEl);
    head.appendChild(info);
    item.appendChild(head);

    if (p.text) {
        const text = document.createElement('div');
        text.className = 'post-text';
        text.textContent = p.text;
        item.appendChild(text);
    }
    if (p.type === 'image' && p.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.src = p.image;
        img.loading = 'lazy';
        item.appendChild(img);
    }
    if (p.type === 'video' && p.image) {
        const vid = document.createElement('video');
        vid.className = 'post-video';
        vid.src = p.image;
        vid.controls = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        vid.addEventListener('click', (e) => e.stopPropagation());
        item.appendChild(vid);
    }

    item.appendChild(buildPostActions(p));

    item.addEventListener('click', (e) => {
        if (e.target.closest('.act-btn')) return;
        if (e.target.closest('[data-uid]')) return;
        if (e.target.tagName === 'VIDEO') return;
        openPostDetail(p);
    });

    registerView(p, item);
    return item;
}

    likeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const fresh = PostStore.get(p.id) || p;

        const likes = Math.max(0, (fresh.likes || 0) + (liked ? 1 : -1));

    shareBtn.addEventListener('click', (e) => {

function buildDetailComment(c, depth){
    depth = depth || 0;
    const thread = document.createElement('div');
    thread.className = 'comment-thread' + (depth > 0 ? ' thread-nested' : '');
    thread.dataset.cid = c.id;

    const init = (c.user || 'F').trim().charAt(0).toUpperCase();
    const av = c.avatar
        ? `<img class="comment-avatar" src="${c.avatar}" alt="" data-uid="${c.userId||''}">`
        : `<div class="comment-avatar-initial" data-uid="${c.userId||''}">${init}</div>`;

    const hasReplies = c.replies && c.replies.length > 0;

    const row = document.createElement('div');
    row.className = 'comment-row';
    row.innerHTML = `
        <div class="comment-avatar-col">
            ${av}
            ${hasReplies ? '<div class="thread-line-down"></div>' : ''}
        </div>
        <div class="comment-content">
            <div class="comment-head">
                <span class="comment-user" data-uid="${c.userId||''}">${escapeHtml(c.user)}</span>
                <span class="comment-time">${escapeHtml(formatExactTime(c.createdAt || c.time))}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text || '')}</div>
        </div>
    `;

    row.querySelectorAll('[data-uid]').forEach(el => {
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            goToProfile(el.getAttribute('data-uid'));
        });
    });

    row.querySelector('.comment-content').appendChild(buildCommentActions(c));

    row.addEventListener('click', (e) => {
        if (e.target.closest('.comment-act')) return;
        if (e.target.closest('[data-uid]')) return;
        openCommentDetail(c.id);
    });

    thread.appendChild(row);

    if (hasReplies) {
        const repliesBox = document.createElement('div');
        repliesBox.className = 'comment-replies';

        const visible = depth < MAX_VISIBLE_DEPTH ? c.replies : c.replies.slice(0, 1);
        const hidden = c.replies.length - visible.length;

        visible.forEach(r => repliesBox.appendChild(buildDetailComment(r, depth + 1)));

        if (hidden > 0) {
            const moreBtn = document.createElement('button');
            moreBtn.className = 'comment-more-btn';
            moreBtn.textContent = `${hidden} ta javobni ko'rish`;
            moreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                c.replies.forEach(r => {
                    if (!repliesBox.querySelector(`[data-cid="${r.id}"]`)) {
                        repliesBox.appendChild(buildDetailComment(r, depth + 1));
                    }
                });
                moreBtn.remove();
            });
            repliesBox.appendChild(moreBtn);
        }

        thread.appendChild(repliesBox);
    }

    return thread;
}

function openPostDetail(p){
    if (!p) return;
    detailPost = PostStore.get(p.id) || p;
    if (!detailPost.comments) detailPost.comments = [];

    replyTargetId = null;

    renderDetailPost();
    renderDetailComments();
    updateDetailReplyModeUI();

    detailInput.value = '';
    detailInput.style.height = 'auto';
    detailSend.disabled = true;

    detailOverlay.classList.add('show');
    document.getElementById('detailScroll').scrollTop = 0;

    if (tg?.BackButton) {
        try { tg.BackButton.onClick(closePostDetail); } catch {}
    }
}

function closePostDetail(){
    detailOverlay.classList.remove('show');
    detailPost = null;
    replyTargetId = null;
    detailInput.value = '';
    detailInput.style.height = 'auto';
    detailSend.disabled = true;

    renderFeed();

    if (tg?.BackButton) {
        try { tg.BackButton.onClick(goHome); } catch {}
    }
}

detailInput.addEventListener('input', () => {
    detailInput.style.height = 'auto';
    detailInput.style.height = Math.min(detailInput.scrollHeight, 90) + 'px';
    detailSend.disabled = detailInput.value.trim().length === 0;
});

detailSend.addEventListener('click', () => {
    const raw = detailInput.value.trim();
    if (!raw || !detailPost) return;

    let cleanText = raw;
    if (replyTargetId) {
        cleanText = raw.replace(/^@\S+\s*/, '').trim();
        if (!cleanText) { showToast('Javob matni bo\'sh'); return; }
    }

    const newC = makeCommentObj(cleanText, replyTargetId);
    const result = addCommentToPost(detailPost.id, newC, replyTargetId);
    if (!result) { showToast('Xatolik yuz berdi'); return; }

    pushMyReply({
        id: newC.id, postId: detailPost.id, userId: newC.userId,
        user: newC.user, avatar: newC.avatar, text: newC.text,
        createdAt: newC.createdAt, postText: detailPost.text
    });

    replyTargetId = null;
    detailInput.value = '';
    detailInput.style.height = 'auto';
    detailSend.disabled = true;

    refreshDetailFromStore();

    setTimeout(() => {
        const newEl = detailCommentsList.querySelector(`[data-cid="${newC.id}"]`);
        if (newEl) {
            newEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            newEl.classList.add('comment-highlight');
            setTimeout(() => newEl.classList.remove('comment-highlight'), 1300);
        }
    }, 60);
});

/* ================= COMMENT DETAIL VIEW ================= */
const commentDetailOverlay = document.getElementById('commentDetailOverlay');
const commentDetailBack = document.getElementById('commentDetailBack');
const commentDetailMain = document.getElementById('commentDetailMain');
const commentDetailReplies = document.getElementById('commentDetailReplies');
const commentDetailInput = document.getElementById('commentDetailInput');
const commentDetailSend = document.getElementById('commentDetailSend');
const commentDetailIsland = document.getElementById('commentDetailIsland');
const cdReplyModeBar = document.getElementById('cdReplyModeBar');
const cdReplyModeText = document.getElementById('cdReplyModeText');
const cdReplyModeCancel = document.getElementById('cdReplyModeCancel');

let activeCommentId = null;

function updateCdReplyModeUI(){
    if (!detailPost) { cdReplyModeBar.style.display = 'none'; commentDetailIsland.classList.remove('reply-mode'); return; }
    const found = activeCommentId ? findComment(detailPost.comments || [], activeCommentId) : null;
    if (found) {
        cdReplyModeText.textContent = `↩ ${found.comment.user} ga javob`;
        cdReplyModeBar.style.display = 'flex';
        commentDetailIsland.classList.add('reply-mode');
    } else {
        cdReplyModeBar.style.display = 'none';
        commentDetailIsland.classList.remove('reply-mode');
    }
}
cdReplyModeCancel.addEventListener('click', closeCommentDetail);

function buildCommentCard(c){
    const row = document.createElement('div');
    row.className = 'comment-row';
    row.style.cursor = 'default';
    const init = (c.user || 'F').trim().charAt(0).toUpperCase();
    const av = c.avatar
        ? `<img class="comment-avatar" src="${c.avatar}" alt="" data-uid="${c.userId||''}">`
        : `<div class="comment-avatar-initial" data-uid="${c.userId||''}">${init}</div>`;

    row.innerHTML = `
        <div class="comment-avatar-col">${av}</div>
        <div class="comment-content">
            <div class="comment-head">
                <span class="comment-user" data-uid="${c.userId||''}">${escapeHtml(c.user)}</span>
                <span class="comment-time">${escapeHtml(formatExactTime(c.createdAt || c.time))}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.text || '')}</div>
        </div>
    `;

    row.querySelectorAll('[data-uid]').forEach(el => {
        el.style.cursor = 'pointer';
        el.addEventListener('click', (e) => {
            e.stopPropagation();
            goToProfile(el.getAttribute('data-uid'));
        });
    });

    row.querySelector('.comment-content').appendChild(buildCommentActions(c));
    return row;
}

function openCommentDetail(commentId){
    if (!detailPost) return;
    const fresh = PostStore.get(detailPost.id);
    if (!fresh) return;
    detailPost = fresh;

    const found = findComment(detailPost.comments || [], commentId);
    if (!found) { showToast('Izoh topilmadi'); return; }

    activeCommentId = commentId;

    commentDetailMain.innerHTML = '';
    commentDetailMain.appendChild(buildCommentCard(found.comment));

    commentDetailReplies.innerHTML = '';
    const replies = found.comment.replies || [];
    if (replies.length === 0) {
        commentDetailReplies.innerHTML = '<div class="detail-empty">Hali javob yo\'q</div>';
    } else {
        replies.forEach(r => commentDetailReplies.appendChild(buildCommentCard(r)));
    }

    commentDetailInput.value = '';
    commentDetailInput.style.height = 'auto';
    commentDetailSend.disabled = true;

    commentDetailOverlay.classList.add('show');
    document.getElementById('commentDetailScroll').scrollTop = 0;
    updateCdReplyModeUI();

    if (tg?.BackButton) {
        try { tg.BackButton.onClick(closeCommentDetail); } catch {}
    }
}

function closeCommentDetail(){
    commentDetailOverlay.classList.remove('show');
    activeCommentId = null;
    commentDetailInput.value = '';
    commentDetailInput.style.height = 'auto';
    commentDetailSend.disabled = true;
    cdReplyModeBar.style.display = 'none';
    commentDetailIsland.classList.remove('reply-mode');

    if (tg?.BackButton) {
        try {
            if (detailOverlay.classList.contains('show')) tg.BackButton.onClick(closePostDetail);
            else tg.BackButton.onClick(goHome);
        } catch {}
    }
}

commentDetailBack.addEventListener('click', closeCommentDetail);

commentDetailInput.addEventListener('input', () => {
    commentDetailInput.style.height = 'auto';
    commentDetailInput.style.height = Math.min(commentDetailInput.scrollHeight, 90) + 'px';
    commentDetailSend.disabled = commentDetailInput.value.trim().length === 0;
});

commentDetailSend.addEventListener('click', () => {
    const txt = commentDetailInput.value.trim();
    if (!txt || !detailPost || !activeCommentId) return;

    const replyToId = activeCommentId;
    const newReply = makeCommentObj(txt, replyToId);
    const result = addCommentToPost(detailPost.id, newReply, replyToId);
    if (!result) { showToast('Xatolik yuz berdi'); return; }

    pushMyReply({
        id: newReply.id, postId: detailPost.id, userId: newReply.userId,
        user: newReply.user, avatar: newReply.avatar, text: newReply.text,
        createdAt: newReply.createdAt, postText: detailPost.text
    });

    commentDetailInput.value = '';
    commentDetailInput.style.height = 'auto';
    commentDetailSend.disabled = true;

    refreshDetailFromStore();

    const found = findComment(detailPost.comments || [], activeCommentId);
    if (found) {
        commentDetailMain.innerHTML = '';
        commentDetailMain.appendChild(buildCommentCard(found.comment));

        commentDetailReplies.innerHTML = '';
        const replies = found.comment.replies || [];
        if (replies.length === 0) {
            commentDetailReplies.innerHTML = '<div class="detail-empty">Hali javob yo\'q</div>';
        } else {
            replies.forEach(r => commentDetailReplies.appendChild(buildCommentCard(r)));
        }
    }

    updateCdReplyModeUI();
    showToast('Javob qo\'shildi');
});

/* ================= INIT ================= */
loadMyReplies();
renderFeed();

/* ================= TELEGRAM BACK BUTTON ================= */
if (tg?.BackButton) {
    try {
        tg.BackButton.show();
        tg.BackButton.onClick(goHome);
    } catch {}
}

window.history.pushState({ page: 'uy' }, 'Uy', '');
window.addEventListener('popstate', () => {
    if (commentDetailOverlay?.classList.contains('show')) {
        closeCommentDetail();
        window.history.pushState({ page: 'uy' }, 'Uy', '');
    } else if (detailOverlay?.classList.contains('show')) {
        closePostDetail();
        window.history.pushState({ page: 'uy' }, 'Uy', '');
    } else {
        goHome();
    }
});

window.addEventListener('beforeunload', () => {
    if (tg?.BackButton) { try { tg.BackButton.hide(); } catch {} }
});
</script>
