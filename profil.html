<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kanal - Profil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* Asosiy sozlamalar */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    display: flex;
    justify-content: center;
    color: #ffffff;
  }

  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #000000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* iOS Header */
  .profile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background-color: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid #333333;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
  }

  .back-btn {
    font-size: 22px;
    color: #ffffff;
    text-decoration: none;
    margin-right: 20px;
  }

  .profile-header h2 {
    font-size: 17px;
    font-weight: 600;
  }

  .header-right i {
    font-size: 20px;
    color: #ffffff;
    cursor: pointer;
  }

  /* Profil Ma'lumotlari (O'rta qism) */
  .profile-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    border-bottom: 0.5px solid #222222;
  }

  .profile-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 16px;
    border: 2px solid #333333;
  }

  .profile-name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .profile-handle {
    font-size: 15px;
    color: #98989d;
    margin-bottom: 20px;
  }

  /* Statistika qismi */
  .profile-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 24px;
    width: 100%;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 13px;
    color: #98989d;
  }

  /* Obuna bo'lish tugmasi */
  .subscribe-btn {
    background-color: #ffffff;
    color: #000000;
    border: none;
    padding: 12px 0;
    width: 100%;
    max-width: 250px;
    border-radius: 24px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .subscribe-btn:hover {
    opacity: 0.8;
  }

  /* Video Grid (Pastdagi 3 ta video thumbnail) */
  .video-grid-title {
    font-size: 16px;
    font-weight: 600;
    padding: 16px;
    color: #ffffff;
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px; /* Videolar orasidagi ingichka qora chiziq */
    padding-bottom: 20px;
  }

  .video-item {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16; /* TikTok/Shorts uslubidagi vertikal o'lcham. Agar gorizontal kerak bo'lsa: 16/9 qiling */
    background-color: #1c1c1e;
    cursor: pointer;
  }

  .video-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .view-count-badge {
    position: absolute;
    bottom: 8px;
    left: 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }

  .view-count-badge i {
    font-size: 10px;
  }

</style>
</head>
<body>

<div class="app-container">

  <!-- Header -->
  <header class="profile-header">
    <div class="header-left">
      <a href="index.html" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h2>Profil</h2>
    </div>
    <div class="header-right">
      <i class="fa-solid fa-ellipsis"></i>
    </div>
  </header>

  <!-- Profil Ma'lumotlari -->
  <div class="profile-info">
    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" alt="Profile Avatar" class="profile-avatar">
    
    <h1 class="profile-name">TRIPLE R</h1>
    <p class="profile-handle">@triple_r_official</p>

    <!-- Statistika -->
    <div class="profile-stats">
      <div class="stat-item">
        <span class="stat-value">3</span>
        <span class="stat-label">Video</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">10K</span>
        <span class="stat-label">Ko'rish</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">4K</span>
        <span class="stat-label">Obunachi</span>
      </div>
    </div>

    <!-- Tugma -->
    <button class="subscribe-btn">Obuna boʻlish</button>
  </div>

  <!-- Videolar qismi -->
  <h3 class="video-grid-title">Videolar</h3>
  <div class="video-grid">
    
    <!-- Video 1 -->
    <a href="view.html" class="video-item">
      <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?auto=format&fit=crop&w=400&q=80" alt="Video 1">
      <div class="view-count-badge">
        <i class="fa-solid fa-play"></i> 5.2K
      </div>
    </a>

    <!-- Video 2 -->
    <a href="view.html" class="video-item">
      <img src="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=400&q=80" alt="Video 2">
      <div class="view-count-badge">
        <i class="fa-solid fa-play"></i> 3.1K
      </div>
    </a>

    <!-- Video 3 -->
    <a href="view.html" class="video-item">
      <img src="https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=400&q=80" alt="Video 3">
      <div class="view-count-badge">
        <i class="fa-solid fa-play"></i> 1.7K
      </div>
    </a>

  </div>

</div>

</body>
</html>
