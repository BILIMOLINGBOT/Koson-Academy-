<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Design - Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
        }

        /* Profile Header Section */
        .profile-header {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'); /* Muqova rasmi */
            background-size: cover;
            background-position: center;
            padding-bottom: 20px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .profile-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.8) 100%);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            padding: 20px;
            padding-top: 40px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 150px;
        }

        .icon-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .right-icons {
            display: flex;
            gap: 10px;
        }

        .profile-info {
            position: relative;
            margin-bottom: 15px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #fff;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
        }

        .badge {
            position: absolute;
            right: 10px;
            bottom: 30px;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Yuqori profil qismi -->
        <div class="profile-header">
            <div class="profile-overlay">
                <div class="top-bar">
                    <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="right-icons">
                        <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                        <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </div>
                
                <div class="profile-info">
                    <div class="avatar-container">
                        <!-- Qiz rasmi uchun joy -->
                        <img src="https://images.unsplash.com/photo-1544299946-86c6732dc740?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Avatar">
                    </div>
                    <div class="profile-name">Япония</div>
                    <div class="badge">A+</div>
                </div>

                <div class="action-buttons">
                    <button>Obuna bo'lish</button>
                    <button>Xabar</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
