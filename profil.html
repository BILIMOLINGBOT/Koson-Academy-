<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>

    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh; /* #19 tuzatildi */
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            transition: opacity 0.2s;
        }

        .stat-number.loading {
            opacity: 0.4;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-edit {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-edit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-edit svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-settings {
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:active {
            transform: scale(0.95) rotate(45deg);
            background-color: #2c2c2e;
        }

        .btn-settings svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 30px;
            gap: 2px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 12px 6px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: all 0.25s ease;
            user-select: none;
            font-weight: 500;
            white-space: nowrap;
        }

        .tab-item:active {
            transform: scale(0.97);
        }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 600;
        }

        .content-area {
            color: #8e8e93;
            font-size: 16px;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f3f46;
        }

        .empty-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor; /* #9 tuzatildi - stroke aniq berildi */
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .start-btn {
            position: fixed;
            right: 20px;
            /* #18 tuzatildi - safe-area hisobga olindi */
            bottom: calc(110px + env(safe-area-inset-bottom, 0px));
            z-index: 60;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;
            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            color: #000000;
            border: none;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: -0.01em;
            cursor: pointer;
            user-select: none;
            box-shadow:
                0 8px 24px rgba(255, 255, 255, 0.15),
                0 2px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }

        .start-btn:active {
            transform: scale(0.94);
            box-shadow:
                0 4px 12px rgba(255, 255, 255, 0.1),
                0 1px 4px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .start-btn svg {
            width: 18px;
            height: 18px;
            stroke: #000000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-nav {
            position: fixed;
            /* #17 tuzatildi - safe-area to'g'ri hisoblandi */
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            padding: 0 12px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            color: inherit;
        }

        .nav-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }

        .nav-active { color: #ffffff; }
        .nav-inactive { color: #a1a1aa; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-btn .nav-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
        }

        #otherProfileActions .btn-message {
            flex: 1;
            background-color: #1c1c1e;
            color: #ffffff;
        }

        #otherProfileActions .btn-message svg {
            stroke: #ffffff;
        }

        .toast {
            position: fixed;
            bottom: calc(180px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(40, 40, 45, 0.95);
            backdrop-filter: blur(20px);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

            <!-- Boshqa foydalanuvchi profili -->

    <div class="toast" id="toast"></div>

    <script>
        // ============ SOZLAMALAR ============
        const API_BASE = 'https://your-backend.com/api'; // #1 - real backendga almashtiring
        const USE_MOCK_API = true; // demo uchun; real backendda false qiling

        // ============ TELEGRAM WEBAPP ============
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // #2 - initDataUnsafe faqat UI uchun, mantiqiy tekshiruv emas
        // Haqiqiy tekshiruv serverda: POST {initData} -> {valid: true, user}
        const tgUser = tg?.initDataUnsafe?.user;

        
        // ============ YORDAMCHI FUNKSIYALAR ============
        function showToast(msg, duration = 2000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), duration);
        }

        function haptic(type = 'light') {
            try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) { /* eski versiya */ }
        }

        function hapticSelect() {
            try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {}
        }

        // #14 - rasm yuklanmasa fallback
        const FALLBACK_PHOTO = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231c1c1e'/%3E%3Ccircle cx='50' cy='40' r='18' fill='%233f3f46'/%3E%3Cellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/%3E%3C/svg%3E";

        function setPhoto(imgId, url) {
            const img = document.getElementById(imgId);
            if (!img) return;
            img.onerror = () => { img.onerror = null; img.src = FALLBACK_PHOTO; };
            img.src = url || FALLBACK_PHOTO;
        }

        // ============ MOCK API (#1, #3, #5 tuzatildi) ============
        // Real backendga ulash uchun USE_MOCK_API = false qiling va API_BASE ni o'zgartiring
        const MOCK_DB = {
            // Demo foydalanuvchilar
            users: {
                'self': null, // keyin to'ldiriladi
                '100': {
                    id: 100,
                    first_name: 'Ali',
                    last_name: 'Valiyev',
                    username: 'ali_valiyev',
                    photo_url: null,
                    last_seen: '5 daqiqa oldin',
                    stats: { subs: 42, followers: 128, posts: 17 },
                    is_subscribed: false
                },
                '200': {
                    id: 200,
                    first_name: 'Zulfiya',
                    last_name: 'Karimova',
                    username: 'zulfiya_k',
                    photo_url: null,
                    last_seen: '1 soat oldin',
                    stats: { subs: 89, followers: 340, posts: 52 },
                    is_subscribed: true
                }
            },
            // Obuna holatlari (demo)
            subscriptions: new Set(['200']) // self -> 200 obuna
        };

        async function apiGetUser(userId, initData) {
            if (USE_MOCK_API) {
                await new Promise(r => setTimeout(r, 400));
                if (String(userId) === String(tgUser?.id)) {
                    // O'z profili - Telegram ma'lumotlaridan
                    return {
                        id: tgUser.id,
                        first_name: tgUser.first_name,
                        last_name: tgUser.last_name,
                        username: tgUser.username,
                        photo_url: tgUser.photo_url,
                        last_seen: 'Hozir onlayn',
                        stats: { subs: 12, followers: 34, posts: 5 },
                        is_self: true,
                        is_subscribed: false
                    };
                }
                const u = MOCK_DB.users[String(userId)];
                if (!u) throw new Error('Foydalanuvchi topilmadi');
                return { ...u, is_self: false, is_subscribed: MOCK_DB.subscriptions.has(String(userId)) };
            }
            // Real backend
            const res = await fetch(`${API_BASE}/user/${encodeURIComponent(userId)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function apiToggleSubscribe(userId, action, initData) {
            if (USE_MOCK_API) {
                await new Promise(r => setTimeout(r, 500));
                const key = String(userId);
                if (action === 'subscribe') MOCK_DB.subscriptions.add(key);
                else MOCK_DB.subscriptions.delete(key);
                // statistika mock
                const u = MOCK_DB.users[key];
                if (u) u.stats.followers += action === 'subscribe' ? 1 : -1;
                return { ok: true, is_subscribed: action === 'subscribe' };
            }
            const res = await fetch(`${API_BASE}/subscribe`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ initData, targetId: userId, action })
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // ============ PROFIL YUKLASH ============
        const urlParams = new URLSearchParams(window.location.search);
        const profileUserId = urlParams.get('id');
        // #10 - isOwnProfile faqat UI uchun, lekin serverdan javob kelguncha
        const isOwnProfile = !profileUserId;

        const startBtn = document.getElementById('startBtn');
        const subscribeBtn = document.getElementById('subscribeBtn');
        const messageBtn = document.getElementById('messageBtn');

        if (isOwnProfile) {
            document.getElementById('ownProfileActions').style.display = 'flex';
            startBtn.style.display = ''; // #10 - default ko'rinadi
        } else {
            document.getElementById('otherProfileActions').style.display = 'flex';
            startBtn.style.display = 'none';
        }

        function renderStats(stats) {
            const items = [
                ['subsCount', stats.subs],
                ['followersCount', stats.followers],
                ['postsCount', stats.posts]
            ];
            items.forEach(([id, val]) => {
                const el = document.getElementById(id);
                el.textContent = typeof val === 'number' ? val.toLocaleString('uz-UZ') : '—';
                el.classList.remove('loading');
            });
        }

        function renderUser(data) {
            document.getElementById('userName').textContent =
                [data.first_name, data.last_name].filter(Boolean).join(' ') || 'Foydalanuvchi';
            document.getElementById('userStatus').textContent =
                data.username ? '@' + data.username : (data.last_seen || 'Telegram foydalanuvchisi');

            setPhoto('userPhoto', data.photo_url);
            if (data.is_self) setPhoto('navUserPhoto', data.photo_url);

            renderStats(data.stats || { subs: 0, followers: 0, posts: 0 });

            // #3 - obuna holati serverdan
            if (!data.is_self && subscribeBtn) {
                updateSubscribeButton(data.is_subscribed);
            }

            // Boshlash tugmasi faqat o'ziniki uchun
            if (data.is_self) {
                document.getElementById('ownProfileActions').style.display = 'flex';
                document.getElementById('otherProfileActions').style.display = 'none';
                startBtn.style.display = '';
            } else {
                document.getElementById('ownProfileActions').style.display = 'none';
                document.getElementById('otherProfileActions').style.display = 'flex';
                startBtn.style.display = 'none';
            }
        }

        function updateSubscribeButton(isSubscribed) {
            if (!subscribeBtn) return;
            if (isSubscribed) {
                subscribeBtn.innerHTML = `
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    Obuna bo'lingan`;
                subscribeBtn.style.opacity = '0.7';
            } else {
                subscribeBtn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                    Obuna bo'lish`;
                subscribeBtn.style.opacity = '1';
            }
            subscribeBtn.dataset.subscribed = isSubscribed ? 'true' : 'false';
            subscribeBtn.disabled = false;
        }

        async function loadProfile() {
            try {
                const userId = profileUserId || tgUser?.id || 'self';
                // #2 - initData serverga yuboriladi (real backendda tekshiriladi)
                const data = await apiGetUser(userId, tg?.initData || '');
                renderUser(data);
            } catch (err) {
                console.error('Profil yuklashda xato:', err);
                document.getElementById('userName').textContent = 'Xatolik';
                document.getElementById('userStatus').textContent = 'Profil yuklanmadi';
                renderStats({ subs: 0, followers: 0, posts: 0 });
                showToast('Profil yuklanmadi. Qayta urinib ko\'ring.');
            }
        }

        // ============ TUGMALAR ============
        document.getElementById('editBtn')?.addEventListener('click', () => {
            haptic('light');
            // #6 - sahifa mavjudligini tekshirish (fallback bilan)
            safeNavigate('tahrirlash.html');
        });

        document.getElementById('settingsBtn')?.addEventListener('click', () => {
            haptic('light');
            safeNavigate('setting.html');
        });

        function safeNavigate(url) {
            // #6 - 404 oldini olish: fetch bilan tekshirish
            fetch(url, { method: 'HEAD' })
                .then(r => {
                    if (r.ok) window.location.href = url;
                    else showToast('Sahifa topilmadi: ' + url);
                })
                .catch(() => showToast('Sahifa topilmadi: ' + url));
        }

        // #3 - obuna real ishlaydi (server bilan)
        subscribeBtn?.addEventListener('click', async () => {
            if (subscribeBtn.disabled) return;
            haptic('medium');

            const currentlySubscribed = subscribeBtn.dataset.subscribed === 'true';
            const action = currentlySubscribed ? 'unsubscribe' : 'subscribe';

            // Optimistic UI
            subscribeBtn.disabled = true;
            subscribeBtn.style.opacity = '0.6';

            try {
                const res = await apiToggleSubscribe(profileUserId, action, tg?.initData || '');
                updateSubscribeButton(res.is_subscribed);
                showToast(res.is_subscribed ? 'Obuna bo\'lindi ✓' : 'Obuna bekor qilindi');
                // Statistikani yangilash
                const followersEl = document.getElementById('followersCount');
                const cur = parseInt(followersEl.textContent.replace(/\D/g, '')) || 0;
                followersEl.textContent = (cur + (res.is_subscribed ? 1 : -1)).toLocaleString('uz-UZ');
            } catch (err) {
                console.error('Obuna xatosi:', err);
                showToast('Xatolik. Qayta urinib ko\'ring.');
                updateSubscribeButton(currentlySubscribed);
            }
        });

        // #4 - xabar: Telegram deep link ishlatish
        messageBtn?.addEventListener('click', () => {
            haptic('light');
            if (!profileUserId) {
                showToast('Foydalanuvchi aniqlanmadi');
                return;
            }
            // Username bo'lsa Telegram'da ochish
            const username = document.getElementById('userStatus').textContent;
            if (username.startsWith('@')) {
                const link = `https://t.me/${username.slice(1)}`;
                if (tg?.openTelegramLink) {
                    tg.openTelegramLink(link);
                } else {
                    window.open(link, '_blank');
                }
            } else {
                // Fallback: ichki xabar sahifasi
                safeNavigate(`xabar.html?chat=${encodeURIComponent(profileUserId)}`);
            }
        });

        startBtn?.addEventListener('click', () => {
            haptic('medium');
            safeNavigate('boshlash.html');
        });

        // ============ TABLAR ============
        // #9 - SVG'larga stroke aniq berildi
        const icons = {
            home: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
            posts: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            video: `<svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`
        };

        const tabTexts = {
            home: "Hali ma'lumot yo'q",
            posts: "Hali post yo'q",
            video: "Hali video yo'q"
        };

        document.getElementById('tabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            // #13 - key validatsiyasi
            const key = tab.dataset.tab;
            if (!icons[key] || !tabTexts[key]) return;

            document.getElementById('contentText').textContent = tabTexts[key];
            document.getElementById('emptyIcon').innerHTML = icons[key];

            hapticSelect();
        });

        // ============ ISHGA TUSHIRISH ============
        // telegram-web-app.js defer bilan yuklangani uchun kutish
        function init() {
            loadProfile();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Telegram skript kechiksa qayta urinish
        if (!window.Telegram && !USE_MOCK_API) {
            console.warn('Telegram WebApp skripti yuklanmagan');
        }
    </script>
</body>
</html>
