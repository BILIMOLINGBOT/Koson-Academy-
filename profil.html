<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenjer UI Dizayni</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f1115; /* Orqa fon (brauzer uchun) */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobil ekran ramkasi */
        .mobile-app {
            width: 390px;
            height: 844px;
            background-color: #12181f; /* Asosiy to'q ko'k/qora fon */
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #222;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Yuqori qism (Header) */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 50px 16px 15px; /* Yuqoridan joy qoldirilgan */
            gap: 10px;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #383c44;
            color: #ffffff;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
        }

        .user-info-pill {
            background-color: #383c44;
            padding: 6px 16px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            display: inline-block;
        }

        .user-status {
            color: #aeb5bd;
            font-size: 11px;
            margin-top: 3px;
        }

        .header-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .profile-pic {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Asosiy qism (Chat hududi) */
        .chat-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .empty-state-box {
            background-color: #262a30;
            width: 100%;
            border-radius: 20px;
            padding: 35px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .empty-state-box h2 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }

        .empty-state-box p {
            color: #aeb5bd;
            font-size: 14px;
            line-height: 1.5;
            max-width: 250px;
        }

        .handshake-emoji {
            font-size: 90px;
            margin-top: 15px;
        }

        /* Pastki qism (Xabar yozish) */
        .app-footer {
            padding: 10px 16px 25px; /* Pastdan indikator uchun joy */
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-footer .icon-button {
            background-color: #171c22;
            width: 44px;
            height: 44px;
        }

        .message-input-area {
            flex: 1;
            background-color: #171c22;
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 44px;
        }

        .message-input-area input {
            flex: 1;
            background-color: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        .message-input-area input::placeholder {
            color: #757b82;
        }

        .emoji-btn {
            background: transparent;
            border: none;
            color: #757b82;
            font-size: 20px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* Telefonning pastdagi uy (home) indikatori */
        .home-indicator {
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 10px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="mobile-app">
        <!-- Yuqori qism (Header) -->
        <header class="app-header">
            <button class="icon-button">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <div class="user-info-pill">
                <div class="user-name">
                    Daniel Reyes <span class="status-dot"></span>
                </div>
                <div class="user-status">2-iyn kuni 00:36 da kirgan</div>
            </div>

            <div class="header-right">
                <button class="icon-button">
                    <i class="fa-solid fa-phone"></i>
                </button>
                <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile" class="profile-pic">
            </div>
        </header>

        <!-- Asosiy qism (Chat) -->
        <main class="chat-content">
            <div class="empty-state-box">
                <h2>Bu yerda hali xabarlar yo'q...</h2>
                <p>Suhbatni boshlash uchun xabar yuboring.</p>
                <div class="handshake-emoji">🤝</div>
            </div>
        </main>

        <!-- Pastki qism (Xabar paneli) -->
        <footer class="app-footer">
            <button class="icon-button">
                <i class="fa-solid fa-paperclip"></i>
            </button>
            
            <div class="message-input-area">
                <input type="text" placeholder="Xabar yozing...">
                <button class="emoji-btn">
                    <i class="fa-regular fa-face-smile"></i>
                </button>
            </div>
            
            <button class="icon-button">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </footer>

        <!-- Mobil indikator liniyasi -->
        <div class="home-indicator"></div>
    </div>

</body>
</html>
