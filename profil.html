<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil UI Dizayni</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .mobile-container {
    width: 100%;
    max-width: 400px;
    background-color: #000000;
    min-height: 100vh;
    position: relative;
    padding-bottom: 40px; 
  }

  /* Asosiy fonga inson qiyofasi joylashtirildi va pastki gradient kulrang qilindi */
  .header-card {
    background: linear-gradient(to bottom, rgba(128, 128, 128, 0) 40%, rgba(128, 128, 128, 1) 100%), 
                url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
    background-size: cover;
    background-position: center top;
    height: 380px;
    border-bottom-left-radius: 35px;
    border-bottom-right-radius: 35px;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .profile-content {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
  }

  .profile-name {
    color: white; /* Agar kulrang fonga oq rang tushmasa, buni o'zgartirishingiz mumkin */
    font-size: 22px;
    margin: 0;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="mobile-container">
  <!-- Profil kartochkasi -->
  <div class="header-card">
    <div class="profile-content">
      <h2 class="profile-name">Alicia Brown</h2>
    </div>
  </div>
</div>

</body>
</html>
