<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profil - L.uz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Umumiy sozlamalar */
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{background-color:#000000!important;color:#ffffff;overscroll-behavior-y:none}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;-webkit-font-smoothing:antialiased}

.profile-card{width:100%;max-width:480px;background-color:#000000;position:relative;padding-bottom:140px}

/* Yuqori sticky sarlavha (Full Screen safe-area bilan) */
.top-controls{position:fixed;top:0;width:100%;max-width:480px;height:calc(62px + env(safe-area-inset-top));padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;justify-content:center;align-items:center;z-index:40;pointer-events:none}
.sticky-header-title{font-size:17px;font-weight:700;color:#ffffff;opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease;display:flex;align-items:center;gap:5px}
.sticky-header-title.visible{opacity:1;transform:translateY(0)}

/* Banner: 230px + safe-area */
.banner{height:calc(230px + env(safe-area-inset-top));background:radial-gradient(120% 100% at 50% 0%, #242426 0%, #121214 55%, #000000 100%);position:sticky;top:0;z-index:5;overflow:hidden}
.banner-default{width:100%;height:100%;background:linear-gradient(160deg, #1f1f22 0%, #111113 48%, #050505 100%);position:relative;transform-origin:center top;will-change:transform,filter}
.banner-default::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 60%);pointer-events:none}
.banner-img{width:100%;height:100%;object-fit:cover;display:none;transform-origin:center top;will-change:transform,filter}

/* Avatar: 40% bannerda, 60% qora fonda */
.avatar-container{width:108px;height:108px;border-radius:50%;background-color:#222222;border:5px solid #000000;position:absolute;left:20px;top:calc(168.8px + env(safe-area-inset-top));transform-origin:center center;z-index:30;overflow:hidden;will-change:transform;cursor:pointer}
.avatar-container img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-initial-big{width:100%;height:100%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;text-transform:uppercase}

/* Pastki qora panel */
.bottom-sheet{background-color:#000000;border-top-left-radius:18px;border-top-right-radius:18px;margin-top:-18px;position:relative;z-index:20;padding:14px 20px 10px 20px}

/* Avatar o'ng tomonidagi ism va @username bloki */
.profile-name-block{margin-left:120px;min-height:52px;display:flex;flex-direction:column;justify-content:center;margin-bottom:16px}
.profile-name-row{display:flex;align-items:center;gap:6px;cursor:pointer}
.profile-name-row:active{opacity:.75}
.user-title{font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-handle{font-size:14px;color:#71767b;margin-top:2px}
.verified-badge-icon{width:21px;height:21px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.verified-badge-sm{width:15px;height:15px;flex-shrink:0;display:inline-block;vertical-align:middle;margin-left:4px}

/* Obunachilar, Obunalar va Postlar statistikasi */
.stats-row{display:flex;align-items:center;gap:18px;margin-bottom:10px;font-size:15px;flex-wrap:wrap}
.stat-item{cursor:pointer}
.stat-item:active{opacity:.75}
.stat-item strong{color:#ffffff;font-weight:700}
.stat-item span{color:#71767b}

/* Bio matni */
.bio-text{font-size:14.5px;line-height:1.4;color:#e7e9ea;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}

/* Tahrirlash va Sozlamalar tugmalari */
.action-buttons{display:flex;align-items:center;gap:12px;margin-bottom:6px;background-color:#000000}
.btn-edit{flex:1;height:46px;border-radius:9999px;background-color:#000000;border:1.5px solid #333639;color:#ffffff;font-size:16px;font-weight:700;cursor:pointer;transition:background-color .2s ease,transform .15s ease,color .2s ease,border-color .2s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-edit:active{background-color:#16181c;transform:scale(.98)}
.btn-edit.primary{background-color:#ffffff;color:#000000;border-color:#ffffff}
.btn-edit.primary:active{background-color:#e5e5e5}
.btn-edit svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-settings{width:46px;height:46px;border-radius:50%;background-color:#000000;border:1.5px solid #333639;color:#ffffff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:background-color .2s ease,transform .15s ease}
.btn-settings:active{background-color:#16181c;transform:scale(.94) rotate(30deg)}
.btn-settings svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Navigatsiya tablari */
.nav-tabs{background-color:#000000;display:flex;justify-content:space-around;align-items:center;padding-top:4px;position:sticky;top:calc(62px + env(safe-area-inset-top));z-index:25}
.tab-item{flex:1;padding:14px 12px;color:#71767b;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:color .2s ease,transform .15s ease;user-select:none}
.tab-item:active{transform:scale(.94)}
.tab-item.active{color:#ffffff}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:48%;max-width:52px;height:3px;background:#ffffff;border-radius:3px 3px 0 0;animation:tabSlide .25s ease both}
@keyframes tabSlide{from{transform:translateX(-50%) scaleX(.3);opacity:0}to{transform:translateX(-50%) scaleX(1);opacity:1}}

/* Kontent maydoni va bo'sh holat */
.content-area{color:#71767b;font-size:15px;text-align:center;width:100%;padding:8px 20px}
.empty-state{padding:44px 0}
.empty-icon{width:58px;height:58px;margin:0 auto 14px;border:1.5px solid #333639;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#71767b}
.empty-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Skeleton Loader */
.tab-loader{display:none;flex-direction:column;width:100%;padding:8px 0}
.tab-loader.active{display:flex}
.sk-post{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.sk-shimmer{background:#161618;background-image:linear-gradient(110deg,#161618 0%,#161618 35%,#26262b 50%,#161618 65%,#161618 100%);background-size:250% 100%;animation:skWave 1.35s linear infinite}
@keyframes skWave{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-av{width:42px;height:42px;border-radius:50%;flex-shrink:0}
.sk-col{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.sk-l1{width:45%;height:13px;border-radius:6px}
.sk-l2{width:90%;height:12px;border-radius:6px}
.sk-l3{width:65%;height:12px;border-radius:6px}

/* Floating Post tugmasi */
.post-btn{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.post-btn:active{transform:scale(.94)}
.post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Composer (Post yozish oynasi) */
.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:#141415;border-radius:32px 32px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:24px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.composer-title{font-size:17px;font-weight:700}
.composer-close{background:#2c2c2e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93}
.composer-close:active{transform:scale(.9);background:#3a3a3c}
.composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-body{display:flex;gap:12px;margin-bottom:16px}
.composer-avatar,.composer-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.composer-avatar{object-fit:cover;background:#1c1c1e}
.composer-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
.composer-input::placeholder{color:#5a5a5e}
.composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
.composer-preview.show{display:block}
.composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
.composer-attach-group{display:flex;gap:8px}
.composer-attach{background:#2c2c2e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.composer-attach:active{transform:scale(.92);background:#3a3a3c}
.composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}
.composer-submit:active{transform:scale(.95)}
.composer-submit:disabled{opacity:.4;cursor:not-allowed}

/* Feed va Postlar */
.feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px;gap:0}
.post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;transition:background .15s ease;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.06)}
.post-item:active{background:rgba(255,255,255,0.03)}
@keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer}
.post-avatar{object-fit:cover;background:#1c1c1e}
.post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
.post-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.post-head-info{display:flex;flex-direction:row;align-items:baseline;gap:6px;min-width:0}
.post-user{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:inline-flex;align-items:center}
.post-time{font-size:13px;color:#71767b;flex-shrink:0}
.post-del-btn{background:none;border:none;color:#71767b;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0}
.post-del-btn:active{color:#ff453a;background:rgba(255,69,58,0.12)}
.post-del-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-text{font-size:15px;line-height:1.45;color:#e7e9ea;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.post-image,.post-video,.detail-image,.detail-video{width:100%;border-radius:16px;margin-bottom:12px;display:block;max-height:80vh;object-fit:cover;border:0.5px solid rgba(255,255,255,0.1);background:#000}

.post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
.act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#71767b;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:12px}
.act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.act-count{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px;text-align:left}
.act-btn.liked{color:#ff2d55}
.act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act-btn.saved{color:#fff}
.act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}

/* Izohlar va Post Detail */
.comment-thread{display:flex;flex-direction:column;animation:postIn .3s ease both;position:relative}
.comment-row{display:flex;gap:10px;cursor:pointer;padding:4px 0;align-items:stretch}
.comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
.comment-avatar,.comment-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;z-index:2;background:#000;border:2px solid #000}
.comment-avatar{object-fit:cover}
.comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
.thread-line-down{width:2px;background:#333639;flex:1;margin-top:-2px;min-height:20px;align-self:center;z-index:1}
.comment-content{flex:1;min-width:0;padding-bottom:10px;padding-top:2px}
.comment-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.comment-user{font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.comment-time{font-size:12px;color:#71767b}
.comment-text{font-size:14px;line-height:1.45;color:#e7e9ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
.comment-actions{display:flex;gap:2px;align-items:center;justify-content:space-between;padding-top:2px;width:100%}
.comment-act{background:none;border:none;color:#71767b;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 6px;display:flex;align-items:center;gap:5px;flex:1;justify-content:center;border-radius:10px}
.comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.comment-act.liked{color:#ff2d55}
.comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55}
.comment-act.saved{color:#fff}
.comment-act.saved svg{fill:#fff;stroke:#fff}
.comment-replies{display:flex;flex-direction:column;position:relative;padding-bottom:4px}

.reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#fff;font-weight:600;max-width:480px;width:100%;margin:0 auto}
.reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-mode-bar button{border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.1)}

.detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:#000;max-width:480px;width:100%;margin:0 auto}
.detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e}
.detail-island.reply-mode{border-color:#fff}
.detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
.detail-input::placeholder{color:#5a5a5e}
.detail-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.detail-send:disabled{opacity:.4;cursor:not-allowed}
.detail-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.detail-overlay,.comment-detail-overlay,.follows-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .3s cubic-bezier(.34,1.2,.64,1) both}
.detail-overlay.show,.comment-detail-overlay.show,.follows-overlay.show{display:flex}
@keyframes detailIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
.detail-header,.comment-detail-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(20px);max-width:480px;width:100%;margin:0 auto;position:sticky;top:0;z-index:10}
.detail-title,.comment-detail-title{font-size:17px;font-weight:600;text-align:center}
.detail-scroll,.comment-detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:480px;width:100%;margin:0 auto}
.detail-post{padding:16px;border-bottom:8px solid #0a0a0a}
.detail-avatar,.detail-avatar-initial{width:46px;height:46px;border-radius:50%;flex-shrink:0}
.detail-avatar{object-fit:cover;background:#1c1c1e}
.detail-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.detail-user{font-size:16px;font-weight:600;display:inline-flex;align-items:center}
.detail-time{font-size:13px;color:#71767b}
.detail-text{font-size:16px;line-height:1.5;color:#e7e9ea;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.detail-comments-title{padding:20px 16px 12px;font-size:14px;font-weight:600;color:#fff}
.detail-comments-list,.comment-detail-replies{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.comment-detail-main{padding:16px;border-bottom:1px solid rgba(255,255,255,0.06)}


/* Telegram ID orqali tezkor kirish oynasi */
.tg-id-gate{position:fixed;inset:0;background:#000000;z-index:900;display:none;align-items:center;justify-content:center;padding:24px}
.tg-id-gate.show{display:flex}
.tg-id-card{width:100%;max-width:380px;background:#141415;border:1px solid #2c2c2e;border-radius:28px;padding:28px 22px;text-align:center}
.tg-id-title{font-size:20px;font-weight:700;color:#ffffff;margin-bottom:8px}
.tg-id-desc{font-size:14px;color:#8e8e93;line-height:1.45;margin-bottom:20px}
.tg-id-input{width:100%;height:48px;background:#1c1c1e;border:1.5px solid #333639;border-radius:16px;padding:0 16px;color:#ffffff;font-size:16px;outline:none;margin-bottom:12px;text-align:center}
.tg-id-input:focus{border-color:#ffffff}
.tg-id-btn{width:100%;height:48px;background:#ffffff;color:#000000;border:none;border-radius:9999px;font-size:16px;font-weight:700;cursor:pointer}
.tg-id-btn:active{transform:scale(.98)}

/* Obunachilar / Obunalar ro'yxati */
.follow-user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
.follow-user-row:active{background:rgba(255,255,255,0.04)}
.follow-user-info{flex:1;min-width:0;text-align:left}
.follow-user-name{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px}
.follow-user-handle{font-size:13px;color:#71767b;margin-top:2px}

.nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}

/* ================= FIREBASE SDK IMPORT & INIT (INDEX & NOTIFICATION BILAN BIR XIL) ================= */

const firebaseConfig = {

const app = initializeApp(firebaseConfig);

const VERIFIED_BADGE_MAIN_SVG = `<svg width="21" height="21" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path><path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
const VERIFIED_BADGE_STICKY_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path><path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;
const VERIFIED_BADGE_SM_SVG = `<svg class="verified-badge-sm" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path><path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;

/* ================= TELEGRAM FULLSCREEN & INIT ================= */
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const isTelegram = !!tg;
if (tg) {
    try {
        tg.ready();
        tg.expand();
        if (typeof tg.requestFullscreen === 'function') tg.requestFullscreen();
        if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
        if (tg.setHeaderColor) tg.setHeaderColor('#000000');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    } catch {}
}

/* ================= LAZY USER CACHE ================= */
const UserCache = {
    _map: new Map(),
    _pending: new Map(),
    get(uid) { return this._map.get(String(uid)) || null; },
    set(uid, data) { if (uid && data) this._map.set(String(uid), data); },
    async fetchOne(uid) {
        const idStr = String(uid || '');
        if (!idStr) return null;
        if (this._map.has(idStr)) return this._map.get(idStr);
        if (this._pending.has(idStr)) return this._pending.get(idStr);
        const p = getDoc(doc(db, USERS_COLLECTION, idStr))
            .then(s => {
                this._pending.delete(idStr);
                if (s.exists()) { this._map.set(idStr, s.data()); return s.data(); }
                return null;
            })
            .catch(() => { this._pending.delete(idStr); return null; });
        this._pending.set(idStr, p);
        return p;
    },
    async prefetch(uids) {
        const unique = [...new Set(uids.map(String).filter(id => id && !this._map.has(id)))];
        if (unique.length) await Promise.all(unique.map(id => this.fetchOne(id)));
    }
};


/* ================= IN-MEMORY SESSION (NO LOCALSTORAGE FOR DATA) ================= */
let currentUser = null;
let savedPosts = new Set();
let viewedPostIds = new Set();

function extractTelegramUser() {
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return tg.initDataUnsafe.user;
    }
    if (tg && typeof tg.initData === 'string' && tg.initData.includes('user=')) {
        try {
            const params = new URLSearchParams(tg.initData);
            const rawUser = params.get('user');
            if (rawUser) {
                const parsed = JSON.parse(rawUser);
                if (parsed && parsed.id) return parsed;
            }
        } catch {}
    }
    if (location.hash && location.hash.includes('tgWebAppData=')) {
        try {
            const hashParams = new URLSearchParams(location.hash.slice(1));
            const webAppData = hashParams.get('tgWebAppData');
            if (webAppData) {
                const innerParams = new URLSearchParams(webAppData);
                const rawUser = innerParams.get('user');
                if (rawUser) {
                    const parsed = JSON.parse(rawUser);
                    if (parsed && parsed.id) return parsed;
                }
            }
        } catch {}
    }
    const urlTgId = new URLSearchParams(location.search).get('tg_id');
    if (urlTgId && /^\d+$/.test(urlTgId.trim())) {
        return { id: urlTgId.trim() };
    }
    return null;
}

async function loginWithTelegramId(tU) {
    const realId = String(tU.id);
    const nowIso = new Date().toISOString();

    try {
        const snap = await getDoc(doc(db, USERS_COLLECTION, realId));
        const existing = snap.exists() ? snap.data() : null;

        const merged = {
            ...(existing || {}),
            userId: realId,
            firstName: (existing?.isEdited && existing?.firstName) ? existing.firstName : (tU.first_name || existing?.firstName || 'Foydalanuvchi'),
            lastName: (existing?.isEdited && existing?.lastName !== undefined) ? existing.lastName : (tU.last_name || existing?.lastName || ''),
            username: (existing?.isEdited && existing?.username) ? existing.username : (tU.username || existing?.username || ''),
            photo_url: (existing?.isEdited && existing?.photo_url) ? existing.photo_url : (tU.photo_url || existing?.photo_url || null),
            bio: existing?.bio || '',
            banner_url: existing?.banner_url || null,
            verified: Boolean(existing?.verified || existing?.isVerified),
            isVerified: Boolean(existing?.verified || existing?.isVerified),
            lastActiveAt: nowIso
        };

        await setDoc(doc(db, USERS_COLLECTION, realId), merged, { merge: true });
        UserCache.set(realId, merged);
        return merged;
    } catch {
        const fallback = {
            userId: realId,
            firstName: tU.first_name || 'Foydalanuvchi',
            lastName: tU.last_name || '',
            username: tU.username || '',
            photo_url: tU.photo_url || null
        };
        UserCache.set(realId, fallback);
        return fallback;
    }
}

function getFullName(u) {
    if (!u) return '';
    return [u.firstName, u.lastName].filter(Boolean).join(' ').trim() || (u.username ? '@' + u.username : 'ID ' + u.userId);
}

const profileUserId = new URLSearchParams(location.search).get('id');
let isOwn = true;
let profileOwner = null;

function isUserVerified(uid, fallbackUser) {
    if (!uid) return false;
    const u = fallbackUser || UserCache.get(String(uid));
    return Boolean(u && (u.verified || u.isVerified));
}

function getInlineVerifiedBadge(uid) {
    return isUserVerified(uid) ? VERIFIED_BADGE_SM_SVG : '';
}

/* ================= ACTIVE SCREEN TIME TRACKER (INDEX & NOTIFICATION BILAN SINXRON) ================= */
function getPeriodKeys(date = new Date()) {
    const yyyy = date.getFullYear();
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');

    const tmp = new Date(Date.UTC(yyyy, date.getMonth(), date.getDate()));
    const dayNum = tmp.getUTCDay() || 7;
    tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
    const ww = String(weekNo).padStart(2, '0');

    return {
        dailyKey: `daily_${yyyy}-${mm}-${dd}`,
        weeklyKey: `weekly_${tmp.getUTCFullYear()}-W${ww}`,
        monthlyKey: `monthly_${yyyy}-${mm}`
    };
}

let activeSessionStart = null;
let accumulatedSeconds = 0;
let flushTimer = null;

function isAppForeground() {
    return document.visibilityState === 'visible' && document.hasFocus();
}

function resumeTimeCounting() {
    if (!currentUser || activeSessionStart !== null) return;
    if (isAppForeground()) activeSessionStart = Date.now();
}

function pauseAndCollectSeconds() {
    if (activeSessionStart !== null) {
        const elapsed = Math.floor((Date.now() - activeSessionStart) / 1000);
        if (elapsed > 0) accumulatedSeconds += elapsed;
        activeSessionStart = null;
    }
}

async function flushUsageTimeToServer() {
    pauseAndCollectSeconds();
    if (!currentUser || accumulatedSeconds <= 0) {
        resumeTimeCounting();
        return;
    }
    const secondsToSend = accumulatedSeconds;
    accumulatedSeconds = 0;
    const { dailyKey, weeklyKey, monthlyKey } = getPeriodKeys();

    try {
        await setDoc(doc(db, USERS_COLLECTION, String(currentUser.userId)), {
            [`usageStats.${dailyKey}`]: increment(secondsToSend),
            [`usageStats.${weeklyKey}`]: increment(secondsToSend),
            [`usageStats.${monthlyKey}`]: increment(secondsToSend),
            totalActiveSeconds: increment(secondsToSend),
            lastActiveAt: new Date().toISOString()
        }, { merge: true });
    } catch {
        accumulatedSeconds += secondsToSend;
    }
    resumeTimeCounting();
}

function startActiveTimeTracker() {
    if (!currentUser) return;
    resumeTimeCounting();
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') resumeTimeCounting();
        else flushUsageTimeToServer();
    });
    window.addEventListener('focus', resumeTimeCounting);
    window.addEventListener('blur', flushUsageTimeToServer);
    window.addEventListener('pagehide', flushUsageTimeToServer);
    clearInterval(flushTimer);
    flushTimer = setInterval(() => {
        if (isAppForeground()) flushUsageTimeToServer();
    }, 25000);
}

const FollowStore = {
    _followers: [],
    _following: [],
    _isFollowingTarget: false,

    initForProfile(targetId) {
        const tId = String(targetId);

        onSnapshot(query(collection(db, FOLLOWS_COLLECTION), where("targetId", "==", tId)), (snap) => {
            const arr = [];
            snap.forEach(d => arr.push(String(d.data().followerId)));
            this._followers = arr;
            updateFollowStatsUI();
        });

        onSnapshot(query(collection(db, FOLLOWS_COLLECTION), where("followerId", "==", tId)), (snap) => {
            const arr = [];
            snap.forEach(d => arr.push(String(d.data().targetId)));
            this._following = arr;
            updateFollowStatsUI();
        });

        if (currentUser && String(currentUser.userId) !== tId) {
            const relId = `${String(currentUser.userId)}_${tId}`;
            onSnapshot(doc(db, FOLLOWS_COLLECTION, relId), (snap) => {
                this._isFollowingTarget = snap.exists();
                updateFollowStatsUI();
            });
        }
    },

    getFollowers() { return this._followers; },
    getFollowing() { return this._following; },

    async toggle(followerId, targetId) {
        if (!followerId || !targetId || String(followerId) === String(targetId)) return false;
        const docId = `${String(followerId)}_${String(targetId)}`;
        const active = this._isFollowingTarget;

        if (active) {
            this._isFollowingTarget = false;
            updateFollowStatsUI();
            await deleteDoc(doc(db, FOLLOWS_COLLECTION, docId)).catch(() => {});
            return false;
        } else {
            this._isFollowingTarget = true;
            updateFollowStatsUI();
            const entry = {
                id: docId,
                followerId: String(followerId),
                targetId: String(targetId),
                createdAt: new Date().toISOString()
            };
            await setDoc(doc(db, FOLLOWS_COLLECTION, docId), entry).catch(() => {});
            pushNotification({
                type: 'follow',
                recipientId: String(targetId),
                senderId: String(followerId),
                senderName: getFullName(currentUser),
                senderAvatar: currentUser?.photo_url || null
            });
            return true;
        }
    }

(function initScrollEffects(){
    const avatar = document.getElementById('avatarContainer');
    const bannerImg = document.getElementById('bannerImg');
    const bannerDefault = document.getElementById('bannerDefault');
    const stickyTitle = document.getElementById('stickyTitle');
    let currentProgress = 0;
    const maxScroll = 160;

    function updateProgress() {
        const scrollY = window.scrollY || window.pageYOffset;
        const targetProgress = Math.min(Math.max(scrollY / maxScroll, 0), 1);
        currentProgress += (targetProgress - currentProgress) * 0.14;

        const scale = 1 - (currentProgress * 0.45);
        avatar.style.transform = `scale(${scale})`;

        const blurAmount = currentProgress * 6;
        const bannerScale = 1 + (currentProgress * 0.08);
        const activeBannerEl = (bannerImg.style.display === 'block') ? bannerImg : bannerDefault;

        if (activeBannerEl) {
            activeBannerEl.style.filter = `blur(${blurAmount}px) brightness(${1 - currentProgress * 0.35})`;
            activeBannerEl.style.transform = `scale(${bannerScale})`;
        }

        if (currentProgress > 0.75) stickyTitle.classList.add('visible');
        else stickyTitle.classList.remove('visible');

        requestAnimationFrame(updateProgress);
    }
    requestAnimationFrame(updateProgress);
})();

const PostStore = {
    _userPosts: [],
    _savedPostsList: [],
    _repliesList: [],
    _byId: new Map(),
    _lastUserDoc: null,
    _hasMoreUserPosts: true,
    _isLoading: false,

    get(id) {
        return this._byId.get(String(id)) || null;
    },

    _registerPosts(list) {
        list.forEach(p => this._byId.set(String(p.id), p));
    },

    async loadUserPostsInitial(targetId) {
        const tId = String(targetId);
        this._isLoading = true;
        showTabLoader(true);

        try {
            // Aniq postlar sonini serverdan olish
            const countSnap = await getCountFromServer(query(collection(db, POSTS_COLLECTION), where("userId", "==", tId)));
            document.getElementById('postsCount').textContent = countSnap.data().count || 0;

            const q = query(
                collection(db, POSTS_COLLECTION),
                where("userId", "==", tId),
                orderBy("createdAt", "desc"),
                limit(BATCH_SIZE)
            );
            const snap = await getDocs(q);
            const batch = [];
            snap.forEach(d => batch.push({ id: d.id, ...d.data() }));

            this._userPosts = batch;
            this._registerPosts(batch);
            this._lastUserDoc = snap.docs[snap.docs.length - 1] || null;
            this._hasMoreUserPosts = snap.docs.length === BATCH_SIZE;

            await UserCache.prefetch([tId]);
        } catch (e) {
            console.error("Postlarni yuklash xatosi:", e);
            this._hasMoreUserPosts = false;
        } finally {
            this._isLoading = false;
            showTabLoader(false);
        }
    },

    async loadNextUserPostsPage(targetId) {
        if (this._isLoading || !this._hasMoreUserPosts || !this._lastUserDoc) return;
        const tId = String(targetId);
        this._isLoading = true;
        showTabLoader(true);

        try {
            const q = query(
                collection(db, POSTS_COLLECTION),
                where("userId", "==", tId),
                orderBy("createdAt", "desc"),
                startAfter(this._lastUserDoc),
                limit(BATCH_SIZE)
            );
            const snap = await getDocs(q);
            const batch = [];
            snap.forEach(d => batch.push({ id: d.id, ...d.data() }));

            this._userPosts.push(...batch);
            this._registerPosts(batch);
            this._lastUserDoc = snap.docs[snap.docs.length - 1] || this._lastUserDoc;
            this._hasMoreUserPosts = snap.docs.length === BATCH_SIZE;

            if (batch.length > 0 && (currentTab === 'posts' || currentTab === 'video')) {
                switchTab(currentTab);
            }
        } catch (e) {
            console.error("Keyingi sahifa xatosi:", e);
        } finally {
            this._isLoading = false;
            showTabLoader(false);
        }
    },

    listenUserPostsRealtime(targetId) {
        const tId = String(targetId);
        const q = query(
            collection(db, POSTS_COLLECTION),
            where("userId", "==", tId),
            orderBy("createdAt", "desc"),
            limit(BATCH_SIZE)
        );
        onSnapshot(q, (snap) => {
            const topFresh = [];
            snap.forEach(d => topFresh.push({ id: d.id, ...d.data() }));
            const freshIds = new Set(topFresh.map(x => String(x.id)));
            const older = this._userPosts.filter(x => !freshIds.has(String(x.id)));
            this._userPosts = [...topFresh, ...older];
            this._registerPosts(topFresh);

            if (currentTab === 'posts' || currentTab === 'video') {
                switchTab(currentTab);
            }
            if (detailOverlay?.classList.contains('show') && detailPost) {
                refreshDetailFromStore();
                if (commentDetailOverlay?.classList.contains('show')) refreshCommentDetailFromStore();
            }
        }, () => {});
    },

    async loadSavedPostsFromServer() {
        const ids = [...savedPosts];
        if (ids.length === 0) {
            this._savedPostsList = [];
            return;
        }
        showTabLoader(true);
        try {
            const snaps = await Promise.all(ids.map(pid => getDoc(doc(db, POSTS_COLLECTION, String(pid)))));
            const fetched = [];
            const authorIds = [];
            snaps.forEach(s => {
                if (s.exists()) {
                    const data = { id: s.id, ...s.data() };
                    fetched.push(data);
                    if (data.userId) authorIds.push(data.userId);
                }
            });
            await UserCache.prefetch(authorIds);
            this._savedPostsList = fetched;
            this._registerPosts(fetched);
        } catch {
            this._savedPostsList = [];
        } finally {
            showTabLoader(false);
        }
    },

    listenUserReplies(targetId) {
        const tId = String(targetId);
        const q = query(
            collection(db, REPLIES_COLLECTION),
            where("userId", "==", tId),
            orderBy("createdAt", "desc"),
            limit(30)
        );
        onSnapshot(q, async (snap) => {
            const arr = [];
            snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
            this._repliesList = arr;
            await UserCache.prefetch([tId]);
            if (currentTab === 'answers') renderReplies();
        }, () => {});
    },

    async add(post) {
        try {
            if (JSON.stringify(post).length > 950000) {
                showToast("Fayl hajmi juda katta! Kichikroq rasm tanlang.");
                return null;
            }
            await setDoc(doc(db, POSTS_COLLECTION, String(post.id)), post);
            this._registerPosts([post]);
            const countEl = document.getElementById('postsCount');
            countEl.textContent = (parseInt(countEl.textContent || '0', 10) + 1);
            return post;
        } catch {
            showToast('Saqlashda xatolik');
            return null;
        }
    },

    async remove(id) {
        const idStr = String(id);
        this._userPosts = this._userPosts.filter(p => String(p.id) !== idStr);
        this._savedPostsList = this._savedPostsList.filter(p => String(p.id) !== idStr);
        this._byId.delete(idStr);
        try {
            await deleteDoc(doc(db, POSTS_COLLECTION, idStr));
            const countEl = document.getElementById('postsCount');
            countEl.textContent = Math.max(0, parseInt(countEl.textContent || '0', 10) - 1);
            return true;
        } catch {
            showToast("O'chirishda xatolik");
            return false;
        }
    },

    async update(id, patch) {
        const idStr = String(id);
        const existing = this._byId.get(idStr);
        if (existing) {
            const updated = Object.assign({}, existing, patch);
            this._byId.set(idStr, updated);
            const idx1 = this._userPosts.findIndex(p => String(p.id) === idStr);
            if (idx1 >= 0) this._userPosts[idx1] = updated;
            const idx2 = this._savedPostsList.findIndex(p => String(p.id) === idStr);
            if (idx2 >= 0) this._savedPostsList[idx2] = updated;
        }
        try {
            await updateDoc(doc(db, POSTS_COLLECTION, idStr), patch);
            return this._byId.get(idStr) || null;
        } catch {
            return null;
        }
    }
};

/* ================= HELPERS ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';
    const diffSec = Math.floor((new Date() - d) / 1000);
    if (diffSec < 5) return 'hozir'; if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
}
function avatarMarkup(user, cls){
    const name = user ? getFullName(user) : 'U';
    const init = (name.trim().charAt(0) || 'U').toUpperCase();

}

function compressImage(file, maxW = 800, quality = 0.72){
    return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url); let { width, height } = img;
            if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
        }; img.onerror = reject; img.src = url;
    });
}

}
function toggleLikeObj(o){

}

/* ================= IZOHLAR YORDAMCHISI ================= */
function findComment(comments, id){
    for (const c of (comments || [])) {
        if (c.id === id) return { comment: c, parent: null, isReply: false, root: c };
        const found = findInReplies(c, id, c); if (found) return found;
    } return null;
}
function findInReplies(parent, id, root){
    for (const r of (parent.replies || [])) {
        if (r.id === id) return { comment: r, parent, isReply: true, root };
        const found = findInReplies(r, id, root); if (found) return found;
    } return null;
}
function makeCommentObj(text, parentId){
    return {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
        userId: String(currentUser.userId), user: getFullName(currentUser), avatar: currentUser.photo_url || null,
        text, createdAt: new Date().toISOString(), likes: 0, likedBy: [], replies: [], parentId: parentId || null
    };
}
async function addCommentToPost(postId, newComment, replyToId){
    let post = PostStore.get(postId);
    if (!post) {
        const s = await getDoc(doc(db, POSTS_COLLECTION, String(postId)));
        if (s.exists()) { post = { id: s.id, ...s.data() }; PostStore._registerPosts([post]); }
    }
    if (!post) return null;

    const commentsCopy = JSON.parse(JSON.stringify(post.comments || []));
    if (!replyToId) {
        newComment.parentId = null; commentsCopy.push(newComment);
        await PostStore.update(postId, { comments: commentsCopy });
        pushNotification({
            type: 'comment',
            recipientId: String(post.userId),
            senderId: String(currentUser.userId),
            senderName: getFullName(currentUser),
            senderAvatar: currentUser.photo_url || null,
            postId: post.id,
            commentId: newComment.id
        });
        return { post, comment: newComment, parent: null };
    }
    const found = findComment(commentsCopy, replyToId); if (!found) return null;
    newComment.parentId = replyToId; if (!found.comment.replies) found.comment.replies = [];
    found.comment.replies.push(newComment);
    await PostStore.update(postId, { comments: commentsCopy });
    pushNotification({
        type: 'reply',
        recipientId: String(found.comment.userId || post.userId),
        senderId: String(currentUser.userId),
        senderName: getFullName(currentUser),
        senderAvatar: currentUser.photo_url || null,
        postId: post.id,
        commentId: newComment.id
    });
    return { post, comment: newComment, parent: found.comment };
}

function listenProfileUsersRealtime(targetId) {

        if (!snap.exists()) return;
        const data = snap.data();
        currentUser = { ...currentUser, ...data };
        UserCache.set(String(currentUser.userId), currentUser);

        const newSaved = new Set(Array.isArray(data.savedPosts) ? data.savedPosts.map(String) : []);
        const changed = newSaved.size !== savedPosts.size || [...newSaved].some(id => !savedPosts.has(id));
        savedPosts = newSaved;

        if (isOwn) {
            profileOwner = currentUser;
            renderProfileHeader();

        if (changed && currentTab === 'saved') {
            PostStore.loadSavedPostsFromServer().then(() => renderSaved());
        }
    });

    if (!isOwn && targetId) {
        onSnapshot(doc(db, USERS_COLLECTION, String(targetId)), (snap) => {
            if (!snap.exists()) return;
            const data = snap.data();
            profileOwner = { ...profileOwner, ...data };
            UserCache.set(String(targetId), profileOwner);
            renderProfileHeader();
        });
    }
}

        box.innerHTML = `<div class="empty-state" style="text-align:center;color:#71767b;padding:60px 20px;">${mode === 'followers' ? "Hali obunachilar yo'q" : "Hali obunalar yo'q"}</div>`;
    } else {
        await UserCache.prefetch(ids);
        ids.forEach(uid => {
            const u = UserCache.get(uid) || { userId: uid, firstName: 'ID', lastName: uid };
            const row = document.createElement('div');
            row.className = 'follow-user-row';
            row.innerHTML = `
                ${avatarMarkup(u, 'post-avatar')}
                <div class="follow-user-info">
                    <div class="follow-user-name">${escapeHtml(getFullName(u))}${getInlineVerifiedBadge(uid)}</div>
                    <div class="follow-user-handle">${u.username ? '@' + escapeHtml(u.username) : '@id' + escapeHtml(uid)}</div>
                </div>
            `;
            row.addEventListener('click', () => goToProfile(uid));
            box.appendChild(row);
        });
    }

    followsOverlay.classList.add('show');
    if (isTelegram) { try { tg.BackButton.onClick(closeFollowsList); tg.BackButton.show(); } catch {} }
}
function closeFollowsList() {
    followsOverlay.classList.remove('show');
    if (isTelegram) { try { tg.BackButton.onClick(goBack); } catch {} }
}
document.getElementById('followersStat').addEventListener('click', () => openFollowsList('followers'));
document.getElementById('subsStat').addEventListener('click', () => openFollowsList('following'));

/* ================= NAVIGATION ================= */
async function goBack(){
    await flushUsageTimeToServer();
    window.location.href = 'index.html';
}
if (isTelegram) { try { tg.BackButton.show(); tg.BackButton.onClick(goBack); } catch {} }
window.history.pushState({ page: 'profil' }, 'Profil', '');
window.addEventListener('popstate', () => {
    if (followsOverlay?.classList.contains('show')) closeFollowsList();
    else if (commentDetailOverlay?.classList.contains('show')) closeCommentDetail();
    else if (detailOverlay?.classList.contains('show')) closePostDetail();
    else goBack();
});

/* ================= ACTION TUGMALAR ================= */
document.getElementById('editBtn')?.addEventListener('click', async () => { await flushUsageTimeToServer(); location.href = 'tahrirlash.html'; });
document.getElementById('settingsBtn')?.addEventListener('click', async () => { await flushUsageTimeToServer(); location.href = 'setting.html'; });
document.getElementById('subscribeBtn')?.addEventListener('click', async () => {
    if (!profileOwner || isOwn || !currentUser) return;
    const subscribed = await FollowStore.toggle(currentUser.userId, profileOwner.userId);
    showToast(subscribed ? "Obuna bo'ldingiz" : "Obuna bekor qilindi");
});


/* ================= COMMENT DETAIL ================= */
const commentDetailOverlay = document.getElementById('commentDetailOverlay');
const cdInput = document.getElementById('commentDetailInput');
const cdSend = document.getElementById('commentDetailSend');
let activeCommentId = null, cdReplyTargetId = null;

function updateCdReplyModeUI(){
    const bar = document.getElementById('cdReplyModeBar'), island = document.getElementById('commentDetailIsland');
    if (!cdReplyTargetId || !detailPost || cdReplyTargetId === activeCommentId) {
        bar.style.display = 'none';
        island.classList.remove('reply-mode');
        return;
    }
    const found = findComment(detailPost.comments || [], cdReplyTargetId);
    if (found) {
        document.getElementById('cdReplyModeText').textContent = `↩ ${found.comment.user} ga javob`;
        bar.style.display = 'flex';
        island.classList.add('reply-mode');
    } else {
        bar.style.display = 'none';
        island.classList.remove('reply-mode');
    }
}

document.getElementById('cdReplyModeCancel').addEventListener('click', () => {
    cdReplyTargetId = activeCommentId;
    cdInput.value = '';
    cdInput.style.height = 'auto';
    updateCdReplyModeUI();
});

function refreshCommentDetailFromStore(){
    if (!detailPost || !activeCommentId) return;
    const fresh = PostStore.get(detailPost.id); if (fresh) detailPost = fresh;
    const found = findComment(detailPost.comments || [], activeCommentId);
    if (!found) { closeCommentDetail(); return; }

    const mainBox = document.getElementById('commentDetailMain');
    mainBox.innerHTML = '';
    mainBox.appendChild(buildDetailComment(found.comment, 0, true));

    const reps = document.getElementById('commentDetailReplies');
    reps.innerHTML = '';
    (found.comment.replies || []).forEach(r => {
        reps.appendChild(buildDetailComment(r, 0, true));
    });
}

function openCommentDetail(cid){
    if (!detailPost) return;
    const fresh = PostStore.get(detailPost.id); if (!fresh) return;
    detailPost = fresh;
    const found = findComment(detailPost.comments || [], cid); if (!found) return;

    activeCommentId = cid;
    cdReplyTargetId = cid;
    cdInput.value = '';
    cdInput.style.height = 'auto';
    cdSend.disabled = true;
    updateCdReplyModeUI();
    refreshCommentDetailFromStore();

    commentDetailOverlay.classList.add('show');
    document.getElementById('commentDetailScroll').scrollTop = 0;
    if (isTelegram) { try { tg.BackButton.onClick(closeCommentDetail); } catch {} }
}

function closeCommentDetail(){
    commentDetailOverlay.classList.remove('show');
    activeCommentId = null;
    cdReplyTargetId = null;
    refreshDetailFromStore();
    if (isTelegram) {
        try {
            if (detailOverlay.classList.contains('show')) tg.BackButton.onClick(closePostDetail);
            else tg.BackButton.onClick(goBack);
        } catch {}
    }
}

cdInput.addEventListener('input', () => {
    cdInput.style.height = 'auto';
    cdInput.style.height = Math.min(cdInput.scrollHeight, 90) + 'px';
    cdSend.disabled = cdInput.value.trim().length === 0;
});

cdSend.addEventListener('click', async () => {
    const raw = cdInput.value.trim();
    if (!raw || !detailPost || !activeCommentId || !currentUser) return;
    cdSend.disabled = true;
    const target = cdReplyTargetId || activeCommentId;
    const newC = makeCommentObj(raw, target);
    const res = await addCommentToPost(detailPost.id, newC, target);
    if (res) {
        saveReplyToServer({
            id: newC.id,
            postId: detailPost.id,
            userId: String(currentUser.userId),
            user: newC.user,
            avatar: newC.avatar,
            text: newC.text,
            createdAt: newC.createdAt,
            postText: detailPost.text || ''
        });
        cdReplyTargetId = activeCommentId;
        cdInput.value = '';
        cdInput.style.height = 'auto';
        updateCdReplyModeUI();
        refreshCommentDetailFromStore();
        await refreshDetailFromStore();
    } else {
        cdSend.disabled = false;
    }
});


/* ================= COMPOSER ================= */
const composer = document.getElementById('composer'), compOverlay = document.getElementById('composerOverlay'), compInput = document.getElementById('composerInput'), compSubmit = document.getElementById('composerSubmit');
let currentMedia = null;
let isSubmittingPost = false;

function openComposer(){ compOverlay.classList.add('show'); composer.classList.add('show'); setTimeout(() => compInput.focus(), 300); }
function closeComposer(){ compOverlay.classList.remove('show'); composer.classList.remove('show'); compInput.blur(); }
document.getElementById('postBtn')?.addEventListener('click', openComposer);
document.getElementById('composerClose').addEventListener('click', closeComposer);
compOverlay.addEventListener('click', closeComposer);
document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('attachVideoBtn').addEventListener('click', () => document.getElementById('videoInput').click());

compInput.addEventListener('input', () => {
    compInput.style.height = 'auto'; compInput.style.height = Math.min(compInput.scrollHeight, 160) + 'px';
    compSubmit.disabled = !(compInput.value.trim().length > 0 || currentMedia);
});

document.getElementById('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
        const data = await compressImage(file); currentMedia = { data, type: 'image' };
        document.getElementById('previewImg').src = data; document.getElementById('previewImg').style.display = 'block';
        document.getElementById('previewVid').style.display = 'none'; document.getElementById('composerPreview').classList.add('show');
        compSubmit.disabled = false;
    } catch {}
});
document.getElementById('videoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > MAX_VIDEO_SIZE) { showToast("Video juda katta (Maksimum 700KB)"); return; }
    const reader = new FileReader();
    reader.onload = ev => {
        currentMedia = { data: ev.target.result, type: 'video' };
        document.getElementById('previewVid').src = currentMedia.data; document.getElementById('previewVid').style.display = 'block';
        document.getElementById('previewImg').style.display = 'none'; document.getElementById('composerPreview').classList.add('show');
        compSubmit.disabled = false;
    }; reader.readAsDataURL(file);
});
document.getElementById('removeImg').addEventListener('click', () => {
    currentMedia = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('previewVid').src = '';
    document.getElementById('composerPreview').classList.remove('show');
    compSubmit.disabled = compInput.value.trim().length === 0;
});

compSubmit.addEventListener('click', async () => {
    if (isSubmittingPost) return;
    const text = compInput.value.trim(); if ((!text && !currentMedia) || !currentUser) return;

    isSubmittingPost = true;
    compSubmit.disabled = true;
    compSubmit.textContent = 'Yuklanmoqda...';

    const me = UserCache.get(String(currentUser.userId)) || currentUser;
    const added = await PostStore.add({
        id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        userId: String(me.userId), user: getFullName(me), avatar: me.photo_url || null,
        verified: isUserVerified(me.userId),
        createdAt: new Date().toISOString(), text, image: currentMedia ? currentMedia.data : null,
        type: currentMedia ? currentMedia.type : 'text', likes: 0, likedBy: [], views: 0, comments: []
    });

    isSubmittingPost = false;
    compSubmit.textContent = 'Yuborish';

    if (!added) {
        compSubmit.disabled = false;
        return;
    }

    compInput.value = '';
    compInput.style.height = 'auto';
    compSubmit.disabled = true;
    currentMedia = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('previewVid').src = '';
    document.getElementById('composerPreview').classList.remove('show');
    closeComposer();
    switchTab('posts');
    showToast('Post joylandi');
});

/* ================= QO'LDA TELEGRAM ID KIRITISH ================= */
document.getElementById('tgIdManualSubmit').addEventListener('click', async () => {
    const rawId = document.getElementById('tgIdManualInput').value.trim();
    if (!/^\d+$/.test(rawId)) {
        showToast("To'g'ri raqamli Telegram ID kiriting");
        return;
    }

(async function bootstrap() {
    const tgUser = extractTelegramUser();
    if (tgUser && tgUser.id) {
        const user = await loginWithTelegramId(tgUser);
        await bootAppWithUser(user);
    } else {
        document.getElementById('tgIdGate').classList.add('show');
    }
})();
</script>
