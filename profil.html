<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil UI Dizayni</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
        }

        body {
            background-color: #000000 !important;
            color: #ffffff;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Mobil ko'rinish cheklovi */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 130px;
            background-color: #000000;
            border-left: 1px solid #18181b;
            border-right: 1px solid #18181b;
            min-height: 100vh;
        }

        /* Profil rasmi */
        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 80px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        /* Ism va status */
        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
            color: #ffffff;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Statistika qismi */
        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Tugmalar qismi */
        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        /* TAHRIRLASH TUGMASI - OQ RANG, KAPSULA */
        .btn-edit {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-edit svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* SOZLAMALAR TUGMASI - DUMALOQ */
        .btn-settings {
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:active {
            transform: scale(0.95) rotate(45deg);
            background-color: #2c2c2e;
        }

        .btn-settings svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Tablar */
        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 30px;
            justify-content: space-between;
            gap: 2px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 13px;
            padding: 10px 8px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: all 0.25s ease;
            user-select: none;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tab-item:active {
            transform: scale(0.95);
        }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 600;
        }

        /* Kontent */
        .content-area {
            color: #8e8e93;
            font-size: 16px;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        .content-area .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f3f46;
        }

        .content-area .empty-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            padding: 0 12px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }

        .nav-active { color: #ffffff; }
        .nav-inactive { color: #a1a1aa; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .nav-btn .nav-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
        }

        .nav-btn .nav-icon-wrapper {
            position: relative;
        }

        .nav-badge {
            position: absolute;
            top: -6px;
            right: -8px;
            width: 16px;
            height: 16px;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 0 0 2px #18181b;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #2c2c2e;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Profil rasmi -->
        <div class="profile-pic-wrapper">
            <img id="userPhoto"
                 src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>"
                 alt="Profil rasmi" class="profile-pic">
        </div>

        <!-- Ism va holat -->
        <h1 class="name" id="userName">Yuklanmoqda...</h1>
        <p class="last-seen" id="userStatus">Telegram foydalanuvchisi</p>

        <!-- Statistika -->
        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-number" id="subsCount">0</span>
                <span class="stat-label">Obunalar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="followersCount">0</span>
                <span class="stat-label">Obunachilar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="postsCount">0</span>
                <span class="stat-label">Postlar</span>
            </div>
        </div>

        <!-- Tugmalar: Tahrirlash + Sozlamalar -->
        <div class="action-buttons">
            <button class="btn-edit" id="editBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Tahrirlash
            </button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <!-- Tablar -->
        <div class="tabs" id="tabsContainer">
            <div class="tab-item" data-tab="stories">Storylar</div>
            <div class="tab-item active" data-tab="posts">Postlar</div>
            <div class="tab-item" data-tab="quotes">Quote'lar</div>
            <div class="tab-item" data-tab="gifts">Giftlar</div>
        </div>

        <!-- Asosiy qism -->
        <div class="content-area" id="contentArea">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <p id="contentText">Hali post yo'q</p>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Uy</span>
            </a>

            <a href="reels.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <line x1="2" y1="8" x2="22" y2="8"></line>
                    <line x1="2" y1="16" x2="22" y2="16"></line>
                    <line x1="8" y1="2" x2="8" y2="8"></line>
                    <line x1="16" y1="2" x2="16" y2="8"></line>
                    <polygon points="10 12 15 14.5 10 17 10 12" fill="currentColor"></polygon>
                </svg>
                <span class="nav-label">Reels</span>
            </a>

            <a href="xabar.html" class="nav-btn nav-inactive">
                <div class="nav-icon-wrapper">
                    <svg viewBox="0 0 24 24" style="transform: scaleX(-1);">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                    <span class="nav-badge">3</span>
                </div>
                <span class="nav-label">Xabar</span>
            </a>

            <a href="qidiruv.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="nav-label">Qidiruv</span>
            </a>

            <a href="profil.html" class="nav-btn nav-active">
                <img id="navUserPhoto"
                     src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>"
                     alt="Profile" class="nav-avatar">
                <span class="nav-label">Profil</span>
            </a>
        </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 1. TELEGRAM WEB APP INITSIALIZATSIYASI
        // ============================================================
        let tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // ============================================================
        // 2. FOYDALANUVCHI MA'LUMOTLARINI YUKLASH
        // ============================================================
        function loadTelegramUser() {
            let user = tg?.initDataUnsafe?.user;

            // Brauzerda test qilish uchun demo
            if (!user) {
                console.warn('⚠️ Telegram foydalanuvchi ma\'lumotlari topilmadi. Demo rejim.');
                user = {
                    first_name: 'Mehmon',
                    last_name: 'Foydalanuvchi',
                    username: 'mehmon',
                    photo_url: null
                };
            }

            // Ism
            const fullName = [user.first_name, user.last_name]
                .filter(Boolean)
                .join(' ') || 'Foydalanuvchi';

            const userNameEl = document.getElementById('userName');
            if (userNameEl) userNameEl.textContent = fullName;

            // Status — @username
            const userStatusEl = document.getElementById('userStatus');
            if (userStatusEl) {
                userStatusEl.textContent = user.username
                    ? '@' + user.username
                    : 'Telegram foydalanuvchisi';
            }

            // Profil rasmi
            const userPhotoEl = document.getElementById('userPhoto');
            const navPhotoEl  = document.getElementById('navUserPhoto');

            if (user.photo_url) {
                if (userPhotoEl) userPhotoEl.src = user.photo_url;
                if (navPhotoEl)  navPhotoEl.src  = user.photo_url;
            } else {
                const initials = encodeURIComponent(
                    (user.first_name?.[0] || 'U') + (user.last_name?.[0] || '')
                );
                const fallback = `https://ui-avatars.com/api/?name=${initials}&background=1c1c1e&color=ffffff&size=200&bold=true`;
                if (userPhotoEl) userPhotoEl.src = fallback;
                if (navPhotoEl)  navPhotoEl.src  = fallback;
            }

            window.__tgUser = user;
        }

        loadTelegramUser();

        // ============================================================
        // 3. TELEFON ORQAGA TUGMASI
        // ============================================================
        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.href = 'index.html';
                }
            });
        }

        // ============================================================
        // 4. TAHRIRLASH TUGMASI
        // ============================================================
        document.getElementById('editBtn').addEventListener('click', function() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            showToast('Tahrirlash sahifasi ochilmoqda...');
            // Profilni tahrirlash sahifasiga o'tish
            // window.location.href = 'tahrirlash.html';
        });

        // ============================================================
        // 5. SOZLAMALAR TUGMASI → setting.html
        // ============================================================
        document.getElementById('settingsBtn').addEventListener('click', function() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            window.location.href = 'setting.html';
        });

        // ============================================================
        // 6. TABLAR (PANEL)
        // ============================================================
        const tabsContainer = document.getElementById('tabsContainer');
        const contentText = document.getElementById('contentText');

        const tabContents = {
            stories: 'Hali story yo\'q',
            posts: 'Hali post yo\'q',
            quotes: 'Hali quote yo\'q',
            gifts: 'Hali gift yo\'q'
        };

        tabsContainer.addEventListener('click', function(e) {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            tabsContainer.querySelectorAll('.tab-item').forEach(t => {
                t.classList.remove('active');
            });

            tab.classList.add('active');

            const tabName = tab.dataset.tab;
            contentText.textContent = tabContents[tabName] || 'Ma\'lumot yo\'q';

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        });

        // ============================================================
        // 7. TOAST XABARNOMA
        // ============================================================
        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // ============================================================
        // 8. BOTTOM NAV UCHUN HAPTIC
        // ============================================================
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.selectionChanged();
                }
            });
        });

        // ============================================================
        // 9. TARIXGA HOLAT QO'SHISH
        // ============================================================
        if (window.history && window.history.pushState) {
            window.history.pushState({ page: 'profil' }, '', window.location.href);
        }
    </script>
</body>
</html>
