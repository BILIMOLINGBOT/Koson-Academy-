<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        .mobile-container{width:100%;max-width:420px;padding:20px 20px 200px;display:flex;flex-direction:column;align-items:center}
        .profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:60px 0 20px}
        .profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#1c1c1e;border:3px solid #1c1c1e}
        .name{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center}
        .last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}
        .stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
        .stat-item{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
        .stat-item:active{opacity:.7}
        .stat-divider{width:1px;background:#2c2c2e;height:40px;align-self:center}
        .stat-number{font-size:20px;font-weight:600;margin-bottom:6px}
        .stat-label{color:#8e8e93;font-size:14px}
        .action-buttons{display:flex;width:100%;gap:10px;margin-bottom:30px}
        .btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:100px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
        .btn-edit:active{opacity:.8;transform:scale(.98)}
        .btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .btn-settings{background:#1c1c1e;border:none;border-radius:50%;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
        .btn-settings:active{transform:scale(.95) rotate(45deg);background:#2c2c2e}
        .btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .tabs{display:flex;background:#1c1c1e;width:100%;border-radius:20px;padding:4px;margin-bottom:30px}
        .tab-item{color:#8e8e93;font-size:14px;padding:12px 6px;border-radius:16px;cursor:pointer;text-align:center;flex:1;transition:all .25s ease;user-select:none;font-weight:500;white-space:nowrap}
        .tab-item:active{transform:scale(.97)}
        .tab-item.active{background:#48484a;color:#fff;font-weight:600}
        .content-area{color:#8e8e93;font-size:16px;text-align:center;width:100%;padding:40px 0}
        .empty-icon{width:60px;height:60px;margin:0 auto 16px;border:2px solid #3f3f46;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3f3f46}
        .empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

        .post-btn{position:fixed;right:20px;bottom:110px;z-index:60;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;letter-spacing:-.01em;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease,background .2s ease}
        .post-btn:active{transform:scale(.94);box-shadow:0 4px 12px rgba(255,255,255,.1),0 1px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
        .post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

        .composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .composer-overlay.show{opacity:1;pointer-events:auto}
        .composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
        .composer.show{transform:translate(-50%,0)}
        .composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .composer-title{font-size:17px;font-weight:700}
        .composer-close{background:#1c1c1e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;transition:transform .2s,background .2s}
        .composer-close:active{transform:scale(.9);background:#2c2c2e}
        .composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .composer-body{display:flex;gap:12px;margin-bottom:16px}
        .composer-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0}
        .composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
        .composer-input::placeholder{color:#5a5a5e}
        .composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
        .composer-preview.show{display:block}
        .composer-preview img{width:100%;max-height:240px;object-fit:cover;display:block}
        .composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
        .composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .composer-actions{display:flex;justify-content:space-between;align-items:center}
        .composer-attach{background:#1c1c1e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .2s,transform .2s}
        .composer-attach:active{transform:scale(.92);background:#2c2c2e}
        .composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s}
        .composer-submit:active{transform:scale(.95)}
        .composer-submit:disabled{opacity:.4;cursor:not-allowed}

        .feed{width:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:20px}
        .post-card{background:#0f0f10;border:1px solid #1f1f22;border-radius:18px;padding:16px;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both}
        @keyframes postIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
        .post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
        .post-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1c1c1e}
        .post-user{font-size:14px;font-weight:600}
        .post-time{font-size:12px;color:#8e8e93;margin-top:1px}
        .post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
        .post-image{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:400px;object-fit:cover}

        /* --- 5 ta interaction icon --- */
        .post-actions{display:flex;align-items:center;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:1px solid #1f1f22;gap:4px}
        .act-btn{background:none;border:none;display:flex;align-items:center;gap:5px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:6px 4px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
        .act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
        .act-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
        .act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:14px;text-align:left}

        .act-btn.liked{color:#ff2d55}
        .act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
        @keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

        .act-btn.saved{color:#ffd60a}
        .act-btn.saved svg{fill:#ffd60a;stroke:#ffd60a;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}

        .act-btn.commented{color:#0a84ff}

        /* --- Comments panel --- */
        .comments-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:110;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .comments-overlay.show{opacity:1;pointer-events:auto}
        .comments-panel{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;height:75vh;background:#0a0a0a;border-radius:24px 24px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:111;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
        .comments-panel.show{transform:translate(-50%,0)}
        .comments-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #1f1f22;flex-shrink:0}
        .comments-title{font-size:16px;font-weight:700}
        .comments-list{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
        .comments-empty{text-align:center;color:#5a5a5e;font-size:14px;padding:40px 0}
        .comment-item{display:flex;gap:10px;animation:postIn .3s ease both}
        .comment-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0}
        .comment-body{flex:1;min-width:0}
        .comment-top{display:flex;align-items:baseline;gap:8px}
        .comment-user{font-size:13px;font-weight:600}
        .comment-time{font-size:11px;color:#5a5a5e}
        .comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;margin-top:3px;word-break:break-word;white-space:pre-wrap}
        .comment-actions{display:flex;gap:16px;margin-top:6px}
        .comment-reply-btn{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:0}
        .comment-reply-btn:active{opacity:.6}
        .comment-replies{margin-top:10px;padding-left:12px;border-left:2px solid #1f1f22;display:flex;flex-direction:column;gap:12px}
        .comment-reply-item{display:flex;gap:8px}
        .comment-reply-item .comment-avatar{width:26px;height:26px}
        .comment-reply-item .comment-user{font-size:12px}
        .comment-reply-item .comment-text{font-size:13px}

        .comments-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1f1f22;display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:#0a0a0a}
        .comments-input{flex:1;background:#1c1c1e;border:none;border-radius:20px;padding:10px 14px;color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.4}
        .comments-input::placeholder{color:#5a5a5e}
        .comments-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s,opacity .2s}
        .comments-send:active{transform:scale(.9)}
        .comments-send:disabled{opacity:.4;cursor:not-allowed}
        .comments-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        .reply-indicator{font-size:12px;color:#0a84ff;padding:4px 20px 8px;display:none;align-items:center;justify-content:space-between;background:#0a0a0a}
        .reply-indicator.show{display:flex}
        .reply-indicator button{background:none;border:none;color:#8e8e93;font-size:12px;cursor:pointer;font-family:inherit}

        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
        .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
        .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 12px;transition:transform .15s ease,opacity .15s ease;cursor:pointer;background:none;border:none;font-family:inherit}
        .nav-btn:active{transform:scale(.85);opacity:.7}
        .nav-active{color:#fff}.nav-inactive{color:#a1a1aa}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
        .nav-btn .nav-label{font-size:10px;font-weight:500}
        .nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e}
        #otherProfileActions .btn-message{flex:1;background:#1c1c1e;color:#fff}
        #otherProfileActions .btn-message svg{stroke:#fff}

        /* Toast */
        .toast{position:fixed;left:50%;bottom:200px;transform:translate(-50%,20px);background:#1c1c1e;color:#fff;padding:12px 22px;border-radius:100px;font-size:14px;font-weight:500;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;border:1px solid #2c2c2e;box-shadow:0 8px 30px rgba(0,0,0,.6);white-space:nowrap}
        .toast.show{opacity:1;transform:translate(-50%,0)}
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="profile-pic-wrapper">
        <img id="userPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" alt="Profil rasmi" class="profile-pic">
    </div>

    <h1 class="name" id="userName">Yuklanmoqda...</h1>
    <p class="last-seen" id="userStatus">Telegram foydalanuvchisi</p>

    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="postsStat"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>

    <div class="action-buttons">
        <div id="ownProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="editBtn">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Tahrirlash
            </button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>

        <div id="otherProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="subscribeBtn">
                <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                Obuna bo'lish
            </button>
            <button class="btn-edit btn-message" id="messageBtn">
                <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                Xabar
            </button>
        </div>
    </div>

    <div class="tabs" id="tabsContainer">
        <div class="tab-item active" data-tab="home">Bosh sahifa</div>
        <div class="tab-item" data-tab="posts">Postlar</div>
        <div class="tab-item" data-tab="video">Video</div>
        <div class="tab-item" data-tab="answers">Javoblar</div>
    </div>

    <div class="content-area" id="contentArea">
        <div class="empty-icon" id="emptyIcon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <p id="contentText">Hali ma'lumot yo'q</p>
    </div>
</div>

<button class="post-btn" id="postBtn" aria-label="Post yozish">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Post
</button>

<div class="composer-overlay" id="composerOverlay"></div>

<div class="composer" id="composer">
    <div class="composer-header">
        <span class="composer-title">Yangi post</span>
        <button class="composer-close" id="composerClose" aria-label="Yopish">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="composer-body">
        <img id="composerAvatar" class="composer-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" alt="Avatar">
        <textarea class="composer-input" id="composerInput" placeholder="Nima haqida o'ylayapsiz?" rows="1"></textarea>
    </div>
    <div class="composer-preview" id="composerPreview">
        <img id="previewImg" src="" alt="Preview">
        <button class="remove-img" id="removeImg" aria-label="O'chirish">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
    </div>
    <div class="composer-actions">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button class="composer-attach" id="attachBtn" aria-label="Rasm yuklash">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button class="composer-submit" id="composerSubmit" disabled>Yuborish</button>
    </div>
</div>

<!-- Comments panel -->
<div class="comments-overlay" id="commentsOverlay"></div>
<div class="comments-panel" id="commentsPanel">
    <div class="comments-header">

<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor('#000000');tg.setBackgroundColor('#000000')}

const profileUserId=new URLSearchParams(location.search).get('id');
const myUserId=tg?.initDataUnsafe?.user?.id;
const isOwn=!profileUserId||String(profileUserId)===String(myUserId);

/* ---------- Profil ma'lumotlari ---------- */
if(isOwn){
    document.getElementById('ownProfileActions').style.display='flex';
    const u=tg?.initDataUnsafe?.user;
    if(u){
        document.getElementById('userName').textContent=[u.first_name,u.last_name].filter(Boolean).join(' ')||'Foydalanuvchi';
        document.getElementById('userStatus').textContent=u.username?'@'+u.username:'Telegram foydalanuvchisi';
        if(u.photo_url){
            document.getElementById('userPhoto').src=u.photo_url;
            document.getElementById('navUserPhoto').src=u.photo_url;
            document.getElementById('composerAvatar').src=u.photo_url;
        }
    }
}else{
    document.getElementById('otherProfileActions').style.display='flex';
    document.getElementById('postBtn').style.display='none';
    document.getElementById('userName').textContent='Foydalanuvchi';
    document.getElementById('userStatus').textContent='Profil #'+profileUserId;
}

document.getElementById('editBtn')?.addEventListener('click',()=>{tg?.HapticFeedback?.impactOccurred('light');location.href='tahrirlash.html'});
document.getElementById('settingsBtn')?.addEventListener('click',()=>{tg?.HapticFeedback?.impactOccurred('light');location.href='setting.html'});
document.getElementById('subscribeBtn')?.addEventListener('click',()=>{
    tg?.HapticFeedback?.impactOccurred('medium');
    const b=document.getElementById('subscribeBtn');
    b.innerHTML=`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Obuna bo'lindi`;
    b.style.opacity='.7';b.disabled=true;
});
document.getElementById('messageBtn')?.addEventListener('click',()=>{tg?.HapticFeedback?.impactOccurred('light');location.href=`xabar.html?chat=${profileUserId}`});

/* ---------- Icons & texts ---------- */
const icons={
    home:`<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    posts:`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    video:`<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,
    answers:`<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
    saved:`<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`
};
const texts={home:"Hali ma'lumot yo'q",posts:"Hali post yo'q",video:"Hali video yo'q",answers:"Hali javob yo'q",saved:"Hali saqlangan post yo'q"};

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- State ---------- */
let posts=[];
let savedPosts=new Set(); // post id set
let viewedByMe=new Set(); // post id set (bu sessiyada ko'rilgan)

function updatePostsCount(){document.getElementById('postsCount').textContent=posts.length}

function renderEmpty(k){
    const area=document.getElementById('contentArea');
    area.innerHTML=`<div class="empty-icon">${icons[k]}</div><p>${texts[k]}</p>`;
}

/* ---------- Feed ---------- */
let currentTab='home';
function renderFeed(){
    const area=document.getElementById('contentArea');
    if(posts.length===0){renderEmpty('posts');return;}
    area.innerHTML='<div class="feed" id="feed"></div>';
    const feed=document.getElementById('feed');
    posts.forEach(p=>feed.appendChild(buildPostCard(p)));
}

function renderSaved(){
    const area=document.getElementById('contentArea');
    const list=posts.filter(p=>savedPosts.has(p.id));
    if(list.length===0){renderEmpty('saved');return;}
    area.innerHTML='<div class="feed" id="feed"></div>';
    const feed=document.getElementById('feed');
    list.forEach(p=>feed.appendChild(buildPostCard(p,true)));
}

/* ---------- Post card builder (5 icon) ---------- */
function buildPostCard(p){
    const card=document.createElement('div');
    card.className='post-card';
    card.dataset.id=p.id;

    const head=document.createElement('div');
    head.className='post-head';
    head.innerHTML=`<img class="post-avatar" src="${p.avatar}" alt="Avatar"><div><div class="post-user">${p.user}</div><div class="post-time">${p.time}</div></div>`;
    card.appendChild(head);

    if(p.text){
        const text=document.createElement('div');
        text.className='post-text';text.textContent=p.text;
        card.appendChild(text);
    }
    if(p.image){
        const img=document.createElement('img');
        img.className='post-image';img.src=p.image;
        card.appendChild(img);
    }

    /* --- Interaction actions --- */
    const actions=document.createElement('div');
    actions.className='post-actions';

    // 1) LIKE
    const likeBtn=document.createElement('button');
    likeBtn.className='act-btn'+(p.liked?' liked':'');
    likeBtn.setAttribute('aria-label','Like');
    likeBtn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="act-count like-count">${p.likes}</span>`;
    likeBtn.addEventListener('click',()=>{
        p.liked=!p.liked;
        p.likes+=p.liked?1:-1;
        likeBtn.classList.toggle('liked',p.liked);
        likeBtn.querySelector('.like-count').textContent=p.likes;
        tg?.HapticFeedback?.impactOccurred('light');
    });
    actions.appendChild(likeBtn);

    // 2) COMMENT
    const commentBtn=document.createElement('button');
    commentBtn.className='act-btn'+(p.comments.length?' commented':'');
    commentBtn.setAttribute('aria-label','Izohlar');
    commentBtn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="act-count comment-count">${countComments(p)}</span>`;
    commentBtn.addEventListener('click',()=>openComments(p));
    actions.appendChild(commentBtn);

    // 3) VIEWS
    const viewBtn=document.createElement('button');
    viewBtn.className='act-btn';
    viewBtn.style.cursor='default';
    viewBtn.setAttribute('aria-label','Ko\'rishlar');
    viewBtn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="act-count view-count">${p.views}</span>`;
    actions.appendChild(viewBtn);

    // 4) SAVE
    const saveBtn=document.createElement('button');
    saveBtn.className='act-btn'+(savedPosts.has(p.id)?' saved':'');
    saveBtn.setAttribute('aria-label','Saqlash');
    saveBtn.innerHTML=`<svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span class="act-count save-count">${savedPosts.has(p.id)?1:0}</span>`;
    saveBtn.addEventListener('click',()=>{
        if(savedPosts.has(p.id)){
            savedPosts.delete(p.id);
            saveBtn.classList.remove('saved');
            saveBtn.querySelector('.save-count').textContent=0;
            showToast('Saqlanganlardan olib tashlandi');
        }else{
            savedPosts.add(p.id);
            saveBtn.classList.add('saved');
            saveBtn.querySelector('.save-count').textContent=1;
            showToast('Saqlandi');
        }
        tg?.HapticFeedback?.impactOccurred('light');
    });
    actions.appendChild(saveBtn);

    // 5) SHARE
    const shareBtn=document.createElement('button');
    shareBtn.className='act-btn';
    shareBtn.setAttribute('aria-label','Ulashish');
    shareBtn.innerHTML=`<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg><span class="act-count">Ulashish</span>`;
    shareBtn.addEventListener('click',()=>sharePost(p));
    actions.appendChild(shareBtn);

    card.appendChild(actions);

    // 3) Ko'rishlar — avtomatik hisoblash (faqat bir marta)
    registerView(p, card);

    return card;
}

function countComments(p){
    let n=p.comments.length;
    p.comments.forEach(c=>n+=c.replies.length);
    return n;
}

/* ---------- View counting (unikal) ---------- */
function registerView(p, card){
    if(viewedByMe.has(p.id)) return;
    // Faqat ekranda ko'ringanda sanash
    const io=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting && !viewedByMe.has(p.id)){
                viewedByMe.add(p.id);
                p.views+=1;
                const vc=card.querySelector('.view-count');
                if(vc) vc.textContent=p.views;
                io.disconnect();
            }
        });
    },{threshold:0.5});
    io.observe(card);
}

/* ---------- Share ---------- */
function sharePost(p){
    tg?.HapticFeedback?.impactOccurred('light');
    const link=location.origin+location.pathname+'?post='+encodeURIComponent(p.id);
    const text=`${p.user} tomonidan post:\n${p.text||'(rasm)'}\n${link}`;
    if(navigator.share){
        navigator.share({title:'Post',text:p.text||'Post',url:link}).catch(()=>{});
    }else{
        // Telegram share
        const tgShare=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(p.text||'Post')}`;
        if(tg && tg.openTelegramLink){
            tg.openTelegramLink(tgShare);
        }else{
            window.open(tgShare,'_blank');
        }
    }
    // Qo'shimcha: clipboard
    try{navigator.clipboard?.writeText(link);}catch(e){}
    showToast('Havola nusxalandi');
}


/* ---------- Comments panel ---------- */
const commentsOverlay=document.getElementById('commentsOverlay');
const commentsPanel=document.getElementById('commentsPanel');
const commentsList=document.getElementById('commentsList');
const commentsInput=document.getElementById('commentsInput');
const commentsSend=document.getElementById('commentsSend');
const commentsClose=document.getElementById('commentsClose');
const replyIndicator=document.getElementById('replyIndicator');
const replyText=document.getElementById('replyText');
const cancelReply=document.getElementById('cancelReply');

let activePost=null;
let replyTarget=null; // {commentId}

function openComments(p){
    activePost=p;
    replyTarget=null;
    replyIndicator.classList.remove('show');
    renderComments();
    commentsOverlay.classList.add('show');
    commentsPanel.classList.add('show');
    tg?.HapticFeedback?.impactOccurred('light');
}
function closeComments(){
    commentsOverlay.classList.remove('show');
    commentsPanel.classList.remove('show');
    activePost=null;replyTarget=null;
    commentsInput.value='';commentsSend.disabled=true;
}

commentsOverlay.addEventListener('click',closeComments);
commentsClose.addEventListener('click',()=>{closeComments();tg?.HapticFeedback?.impactOccurred('light')});

function renderComments(){
    if(!activePost)return;
    const list=commentsList;
    list.innerHTML='';
    if(activePost.comments.length===0){
        list.innerHTML='<div class="comments-empty">Hali izoh yo\'q. Birinchi bo\'ling!</div>';
        return;
    }
    activePost.comments.forEach(c=>list.appendChild(buildComment(c)));
}

function buildComment(c){
    const wrap=document.createElement('div');
    wrap.className='comment-item';
    wrap.innerHTML=`
        <img class="comment-avatar" src="${c.avatar}" alt="">
        <div class="comment-body">
            <div class="comment-top"><span class="comment-user">${c.user}</span><span class="comment-time">${c.time}</span></div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
            <div class="comment-actions"><button class="comment-reply-btn">Javob berish</button></div>
        </div>`;
    wrap.querySelector('.comment-reply-btn').addEventListener('click',()=>{
        replyTarget={commentId:c.id,user:c.user};
        replyText.textContent=`@${c.user} ga javob`;
        replyIndicator.classList.add('show');
        commentsInput.focus();
    });

    // replies
    if(c.replies.length){
        const repliesBox=document.createElement('div');
        repliesBox.className='comment-replies';
        c.replies.forEach(r=>{
            const ri=document.createElement('div');
            ri.className='comment-reply-item';
            ri.innerHTML=`
                <img class="comment-avatar" src="${r.avatar}" alt="">
                <div class="comment-body">
                    <div class="comment-top"><span class="comment-user">${r.user}</span><span class="comment-time">${r.time}</span></div>
                    <div class="comment-text">${escapeHtml(r.text)}</div>
                </div>`;
            repliesBox.appendChild(ri);
        });
        wrap.querySelector('.comment-body').appendChild(repliesBox);
    }
    return wrap;
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

cancelReply.addEventListener('click',()=>{
    replyTarget=null;
    replyIndicator.classList.remove('show');
});

commentsInput.addEventListener('input',()=>{
    commentsInput.style.height='auto';
    commentsInput.style.height=Math.min(commentsInput.scrollHeight,80)+'px';
    commentsSend.disabled=commentsInput.value.trim().length===0;
});

commentsSend.addEventListener('click',()=>{
    const txt=commentsInput.value.trim();
    if(!txt||!activePost)return;
    const u=tg?.initDataUnsafe?.user;
    const userName=u?([u.first_name,u.last_name].filter(Boolean).join(' ')||'Foydalanuvchi'):'Foydalanuvchi';
    const avatar=u?.photo_url||document.getElementById('userPhoto').src;
    const newC={id:'c_'+Date.now(),user:userName,avatar,text:txt,time:formatTimeShort(),replies:[]};

    if(replyTarget){
        const parent=activePost.comments.find(c=>c.id===replyTarget.commentId);
        if(parent) parent.replies.push(newC);
    }else{
        activePost.comments.push(newC);
    }
    commentsInput.value='';
    commentsInput.style.height='auto';
    commentsSend.disabled=true;
    replyTarget=null;
    replyIndicator.classList.remove('show');
    renderComments();
    tg?.HapticFeedback?.notificationOccurred('success');

    // Feed dagi comment count yangilash
    const card=document.querySelector(`.post-card[data-id="${activePost.id}"]`);
    if(card){
        const cc=card.querySelector('.comment-count');
        if(cc) cc.textContent=countComments(activePost);
        const cb=card.querySelector('.act-btn[aria-label="Izohlar"]');
        if(cb) cb.classList.toggle('commented', countComments(activePost)>0);
    }
    commentsList.scrollTop=commentsList.scrollHeight;
});

function formatTimeShort(){
    const d=new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ---------- Tab switching ---------- */
function switchTab(k){
    currentTab=k;
    document.querySelectorAll('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.tab===k));
    if(k==='posts') renderFeed();
    else if(k==='saved') renderSaved();
    else renderEmpty(k);
}
document.getElementById('tabsContainer').addEventListener('click',e=>{
    const tab=e.target.closest('.tab-item');
    if(!tab)return;
    switchTab(tab.dataset.tab);
    tg?.HapticFeedback?.selectionChanged();
});

/* ---------- Composer ---------- */
const postBtn=document.getElementById('postBtn');
const overlay=document.getElementById('composerOverlay');
const composer=document.getElementById('composer');
const input=document.getElementById('composerInput');
const submitBtn=document.getElementById('composerSubmit');
const attachBtn=document.getElementById('attachBtn');
const fileInput=document.getElementById('fileInput');
const preview=document.getElementById('composerPreview');
const previewImg=document.getElementById('previewImg');
const removeImg=document.getElementById('removeImg');
const composerClose=document.getElementById('composerClose');

let currentImage=null;

function openComposer(){overlay.classList.add('show');composer.classList.add('show');setTimeout(()=>input.focus(),300);tg?.HapticFeedback?.impactOccurred('light')}
function closeComposer(){overlay.classList.remove('show');composer.classList.remove('show');input.blur()}
function refreshSubmit(){submitBtn.disabled=!(input.value.trim().length>0||currentImage)}

postBtn?.addEventListener('click',openComposer);
overlay.addEventListener('click',closeComposer);
composerClose.addEventListener('click',()=>{closeComposer();tg?.HapticFeedback?.impactOccurred('light')});

input.addEventListener('input',()=>{
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,160)+'px';
    refreshSubmit();
});

attachBtn.addEventListener('click',()=>{fileInput.click();tg?.HapticFeedback?.impactOccurred('light')});
fileInput.addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
        currentImage=ev.target.result;
        previewImg.src=currentImage;
        preview.classList.add('show');
        refreshSubmit();
    };
    reader.readAsDataURL(f);fileInput.value='';
});
removeImg.addEventListener('click',()=>{currentImage=null;preview.classList.remove('show');previewImg.src='';refreshSubmit()});

submitBtn.addEventListener('click',()=>{
    const text=input.value.trim();
    if(!text && !currentImage) return;
    const u=tg?.initDataUnsafe?.user;
    const userName=u?([u.first_name,u.last_name].filter(Boolean).join(' ')||'Foydalanuvchi'):'Foydalanuvchi';
    const avatar=u?.photo_url||document.getElementById('userPhoto').src;

    const newPost={
        id:'p_'+Date.now(),
        user:userName,avatar,
        time:formatTimeShort()+' · hozir',
        text,image:currentImage,
        likes:0,liked:false,
        views:0,
        comments:[]
    };
    posts.unshift(newPost);
    updatePostsCount();

    input.value='';input.style.height='auto';
    currentImage=null;preview.classList.remove('show');previewImg.src='';
    refreshSubmit();
    closeComposer();
    tg?.HapticFeedback?.notificationOccurred('success');
    setTimeout(()=>switchTab('posts'),250);
});
</script>
