<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Profil - L.uz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* iOS Typography & Base */
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#000!important;color:#fff}
body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.mobile-container{width:100%;max-width:420px;padding:20px 20px 200px;display:flex;flex-direction:column;align-items:center}

/* Header & Profile Info */
.back-bar{width:100%;display:flex;align-items:center;margin:40px 0 10px}
.back-btn{background:#1c1c1e;border:none;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:transform .15s,background .2s}
.back-btn:active{transform:scale(.9);background:#2c2c2e}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:20px 0;position:relative}
.profile-pic,.profile-pic-initial{width:120px;height:120px;border-radius:50%;border:2px solid #1c1c1e;cursor:pointer}
.profile-pic{object-fit:cover;background:#1c1c1e}
.profile-pic-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff;text-transform:uppercase}
.name{font-size:26px;font-weight:700;margin-bottom:6px;text-align:center;cursor:pointer;letter-spacing:-0.5px}
.name:active{opacity:.7}
.last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}

/* Stats */
.stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
.stat-item{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.stat-item:active{opacity:.7}
.stat-divider{width:1px;background:#2c2c2e;height:36px;align-self:center}
.stat-number{font-size:19px;font-weight:700;margin-bottom:4px}
.stat-label{color:#8e8e93;font-size:13px;font-weight:500}

/* Actions */
.action-buttons{display:flex;width:100%;gap:10px;margin-bottom:30px}
.btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:14px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-edit:active{opacity:.8;transform:scale(.97)}
.btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-settings{background:#1c1c1e;border:none;border-radius:14px;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
.btn-settings:active{transform:scale(.95);background:#2c2c2e}
.btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Tabs */
.tabs{display:flex;width:100%;margin-bottom:12px;background:transparent;padding:0;gap:0;border-radius:0}
.tab-item{color:#636366;padding:12px 4px;border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;transition:color .25s ease;user-select:none;position:relative}
.tab-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tab-item:active{transform:scale(.94)}
.tab-item.active{color:#fff}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40%;max-width:50px;height:3px;background:#fff;border-radius:3px 3px 0 0;animation:tabSlide .25s cubic-bezier(0.1,0.7,0.1,1) both}
@keyframes tabSlide{from{transform:translateX(-50%) scaleX(.3);opacity:0}to{transform:translateX(-50%) scaleX(1);opacity:1}}

/* Feed & Posts */
.content-area{color:#8e8e93;font-size:16px;text-align:center;width:100%;padding:8px 0}
.empty-icon{width:60px;height:60px;margin:0 auto 16px;border:2px solid #3a3a3c;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#636366}
.empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px;gap:10px}
.post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;border-bottom:1px solid #1c1c1e}
.post-item:active{opacity:.85}
@keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0}
.post-avatar{object-fit:cover;background:#1c1c1e}
.post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff}
.post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
.post-user{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-time{font-size:13px;color:#8e8e93;margin-top:2px}
.post-text{font-size:15px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}

/* Media: 16:9 & 9:16 qo'llab-quvvatlash uchun */
.post-image, .post-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:800px;object-fit:cover;background:#000;border:1px solid #1c1c1e}

/* Actions */
.post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
.act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#8e8e93;font-size:13px;font-weight:600;cursor:pointer;padding:6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:10px}
.act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:all .2s ease}
.act-count{font-variant-numeric:tabular-nums;font-size:13px}
.act-btn.liked{color:#ff3b30}
.act-btn.liked svg{fill:#ff3b30;stroke:#ff3b30;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act-btn.saved{color:#fff}
.act-btn.saved svg{fill:#fff;stroke:#fff}

/* Composer Floating Button */
.post-btn{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#000;border:none;border-radius:100px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.post-btn:active{transform:scale(.94)}
.post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Detail Overlays */
.detail-overlay, .comment-detail-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .3s cubic-bezier(0.1,0.7,0.1,1) both}
.detail-overlay.show, .comment-detail-overlay.show{display:flex}
@keyframes detailIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}

.detail-header{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top, 40px));background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:10;position:sticky;top:0;max-width:420px;width:100%;margin:0 auto}
.detail-back{background:transparent;border:none;width:36px;height:36px;display:flex;align-items:center;justify-content:flex-start;cursor:pointer;color:#fff;transition:opacity .15s}
.detail-back:active{opacity:.6}
.detail-back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-title{font-size:17px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}

.detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:420px;width:100%;margin:0 auto}
.detail-post{padding:16px;border-bottom:1px solid #1c1c1e}
.detail-image, .detail-video{width:100%;border-radius:14px;margin-bottom:12px;display:block;max-height:800px;object-fit:cover;background:#000}

/* Izohlar (Thread Lines - mahkam bog'langan) */
.detail-comments-title{padding:16px 16px 8px;font-size:14px;font-weight:600;color:#8e8e93}
.detail-comments-list{padding:0 16px;display:flex;flex-direction:column;gap:16px}
.comment-thread{display:flex;flex-direction:column;position:relative}
.comment-row{display:flex;gap:12px;cursor:pointer;padding:4px 0;transition:opacity .15s ease;align-items:flex-start}
.comment-row:active{opacity:.85}

.comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:40px;position:relative}
.comment-avatar,.comment-avatar-initial{width:40px;height:40px;border-radius:50%;position:relative;z-index:2;background:#1c1c1e}
.comment-avatar{object-fit:cover}
.comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff}
/* Mahkam chiziq */
.thread-line-down{position:absolute;top:40px;bottom:-16px;width:2px;background:#2c2c2e;z-index:1}

.comment-content{flex:1;min-width:0;padding-bottom:8px}
.comment-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.comment-user{font-size:15px;font-weight:600}
.comment-time{font-size:13px;color:#8e8e93}
.comment-text{font-size:15px;line-height:1.4;color:#e5e5ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
.comment-actions{display:flex;gap:4px;align-items:center;justify-content:flex-start;max-width:300px}
.comment-act{background:none;border:none;color:#8e8e93;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px 6px 0;display:flex;align-items:center;gap:6px;transition:opacity .15s}
.comment-act:active{opacity:.6}
.comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Nested Replies */
.comment-replies{display:flex;flex-direction:column;position:relative;margin-left:0;padding-left:0;padding-bottom:4px}
.comment-more-btn{background:none;border:none;color:#8e8e93;font-size:14px;font-weight:600;cursor:pointer;padding:8px 0 8px 52px;font-family:inherit;text-align:left}

/* Reply Mode Bar (Ko'k rang olib tashlandi, iOS neytral) */
.reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#1c1c1e;border-top:1px solid #2c2c2e;font-size:13px;color:#fff;font-weight:600;max-width:420px;width:100%;margin:0 auto}
.reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8e8e93}
.reply-mode-bar button{background:none;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:4px 8px;background:#2c2c2e;border-radius:12px}

/* Input Area */
.detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:rgba(28,28,30,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.05);max-width:420px;width:100%;margin:0 auto}
.detail-island{display:flex;gap:10px;align-items:flex-end;background:#000;border-radius:24px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e;transition:border-color .2s}
.detail-island.reply-mode{border-color:#4a4a4e;box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;line-height:1.4;resize:none;outline:none;max-height:90px;padding:8px 0}
.detail-input::placeholder{color:#636366}
.detail-send{background:#fff;color:#000;border:none;border-radius:50%;width:34px;height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,opacity .2s}
.detail-send:active{transform:scale(.9)}
.detail-send:disabled{opacity:.3;cursor:not-allowed}
.detail-send svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Bottom Nav (Island - Pill Design) */
.bottom-nav{
    position:fixed;
    bottom:calc(15px + env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:380px;
    background:rgba(28,28,30,0.85);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:40px;
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.bottom-nav-inner{display:flex;justify-content:space-around;padding:10px 15px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#8e8e93;transition:color .2s;flex:1}
.nav-btn:active{opacity:.7}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-active{color:#fff}
.nav-label{font-size:11px;font-weight:600}
.nav-avatar,.nav-avatar-initial{width:24px;height:24px;border-radius:50%;object-fit:cover}
.nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}

/* Toast & Composer Overlays */
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:100px;font-size:14px;font-weight:600;z-index:1000;opacity:0;pointer-events:none;transition:all .3s;box-shadow:0 8px 24px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,0.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#1c1c1e;border-radius:24px 24px 0 0;z-index:101;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(0.1,0.7,0.1,1)}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.composer-title{font-size:17px;font-weight:700}
.composer-close{background:#2c2c2e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93}
.composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round}
.composer-body{display:flex;gap:12px;margin-bottom:16px}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
.composer-input::placeholder{color:#636366}
.composer-preview{position:relative;width:100%;border-radius:14px;overflow:hidden;margin-bottom:16px;display:none}
.composer-preview.show{display:block}
.composer-preview img,.composer-preview video{width:100%;max-height:400px;object-fit:cover;display:block}
.composer-actions{display:flex;justify-content:space-between;align-items:center}
.composer-attach{background:#2c2c2e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;margin-right:8px}
.composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-submit{background:#fff;color:#000;border:none;border-radius:100px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer}
.composer-submit:disabled{opacity:.4}
</style>
</head>
<body>

<div class="mobile-container">
    <div class="back-bar">
        <button class="back-btn" id="backBtn" aria-label="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
    </div>

    <div class="profile-pic-wrapper" id="profilePicWrapper">
        <img id="userPhoto" class="profile-pic" style="display:none" alt="Profil rasmi">
        <div id="userInitial" class="profile-pic-initial"></div>
    </div>
    <h1 class="name" id="userName">Yuklanmoqda...</h1>
    <p class="last-seen" id="userStatus">Profil</p>
    
    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item" id="postsStat"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>
    
    <div class="action-buttons">
        <div id="ownProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="editBtn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Tahrirlash</button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </div>
        <div id="otherProfileActions" style="display:none;width:100%;gap:10px">
            <button class="btn-edit" id="subscribeBtn"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>Obuna bo'lish</button>
            <button class="btn-edit" id="messageBtn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Xabar</button>
        </div>
    </div>
    
    <div class="tabs" id="tabsContainer">
        <div class="tab-item active" data-tab="posts" aria-label="Postlar">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <div class="tab-item" data-tab="video" aria-label="Video">
            <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
