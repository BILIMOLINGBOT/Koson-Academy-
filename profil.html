<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profil - L.uz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* iOS Design System Fonts & Resets */
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}

.mobile-container{width:100%;max-width:420px;padding:40px 20px 140px;display:flex;flex-direction:column;align-items:center}
.profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:20px 0;position:relative}
.profile-pic,.profile-pic-initial{width:120px;height:120px;border-radius:50%;border:2px solid #2c2c2e;cursor:pointer}
.profile-pic{object-fit:cover;background:#1c1c1e}
.profile-pic-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:#fff;text-transform:uppercase}
.name{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center;cursor:pointer;letter-spacing:-0.5px}
.name:active{opacity:.7}
.last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}
.stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
.stat-item{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.stat-item:active{opacity:.7}
.stat-number{font-size:20px;font-weight:600;margin-bottom:6px}
.stat-label{color:#8e8e93;font-size:13px}
.action-buttons{display:flex;width:100%;gap:10px;margin-bottom:30px}
.btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:100px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-edit:active{opacity:.8;transform:scale(.98)}
.btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-settings{background:#1c1c1e;border:none;border-radius:50%;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
.btn-settings:active{transform:scale(.95) rotate(45deg);background:#2c2c2e}
.btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;width:100%;margin-bottom:8px;background:transparent;padding:0;gap:0;border-radius:0}
.tab-item{color:#5a5a5e;padding:14px 4px;border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;transition:color .25s ease;user-select:none;background:transparent;position:relative}
.tab-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tab-item:active{transform:scale(.94)}
.tab-item.active{background:transparent;color:#fff}
.tab-item.active::after{content:'absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;max-width:60px;height:3px;background:#fff;border-radius:3px 3px 0 0;animation:tabSlide .25s ease both}
@keyframes tabSlide{from{transform:translateX(-50%) scaleX(.3);opacity:0}to{transform:translateX(-50%) scaleX(1);opacity:1}}

.content-area{color:#8e8e93;font-size:16px;text-align:center;width:100%;padding:8px 0}
.empty-icon{width:60px;height:60px;margin:0 auto 16px;border:1.5px solid #3f3f46;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3f3f46}
.empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.post-btn{position:fixed;right:20px;bottom:100px;z-index:40;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.post-btn:active{transform:scale(.94);box-shadow:0 4px 12px rgba(255,255,255,.1),0 1px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.8)}
.post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:420px;background:#141415;border-radius:32px 32px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:24px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.composer-title{font-size:17px;font-weight:700}
.composer-close{background:#2c2c2e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;transition:transform .2s,background .2s}
.composer-close:active{transform:scale(.9);background:#3a3a3c}
.composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-body{display:flex;gap:12px;margin-bottom:16px}
.composer-avatar,.composer-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.composer-avatar{object-fit:cover;background:#1c1c1e}
.composer-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
.composer-input::placeholder{color:#5a5a5e}
.composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
.composer-preview.show{display:block}
.composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
.composer-attach-group{display:flex;gap:8px}
.composer-attach{background:#2c2c2e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;transition:background .2s,transform .2s}
.composer-attach:active{transform:scale(.92);background:#3a3a3c}
.composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s}
.composer-submit:active{transform:scale(.95)}
.composer-submit:disabled{opacity:.4;cursor:not-allowed}

.feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px;gap:0}
.post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .4s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;transition:background .15s ease;background:transparent;border-radius:0;border:none;border-bottom:1px solid rgba(255,255,255,0.05)}
.post-item:active{background:rgba(255,255,255,0.03)}
@keyframes postIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.post-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer}
.post-avatar{object-fit:cover;background:#1c1c1e}
.post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
.post-head-info{display:flex;flex-direction:column;min-width:0;flex:1}
.post-user{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.post-user:active{opacity:.7}
.post-time{font-size:13px;color:#8e8e93;margin-top:1px}
.post-text{font-size:15px;line-height:1.45;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}

.post-image, .post-video, .detail-image, .detail-video{
    width:100%;
    border-radius:16px;
    margin-bottom:12px;
    display:block;
    max-height:80vh;
    object-fit:cover;
    border:0.5px solid rgba(255,255,255,0.1);
    background:#000;
}

.post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
.act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#8e8e93;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:12px 6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:12px}
.act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s ease,stroke .2s ease,transform .2s cubic-bezier(.34,1.56,.64,1);flex-shrink:0}
.act-count{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px;text-align:left}
.act-btn.liked{color:#ff2d55}
.act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act-btn.saved{color:#fff}
.act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}

/* COMMENTS THREAD */
.comment-thread{display:flex;flex-direction:column;animation:postIn .3s ease both;position:relative}
.comment-row{display:flex;gap:10px;cursor:pointer;padding:4px 0;transition:opacity .15s ease;align-items:stretch}
.comment-row:active{opacity:.85}
.comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
.comment-avatar,.comment-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;z-index:2;background:#000;border:2px solid #000}
.comment-avatar{object-fit:cover}
.comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
.thread-line-down{width:2px;background:#3a3a3c;flex:1;margin-top:-2px;min-height:20px;border-radius:0;align-self:center;z-index:1}

.comment-content{flex:1;min-width:0;padding-bottom:10px;padding-top:2px}
.comment-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.comment-user{font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comment-user:active{opacity:.7}
.comment-time{font-size:12px;color:#8e8e93}
.comment-text{font-size:14px;line-height:1.45;color:#e5e5ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
.comment-actions{display:flex;gap:2px;align-items:center;justify-content:space-between;padding-top:2px;max-width:100%;width:100%}
.comment-act{background:none;border:none;color:#8e8e93;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;padding:12px 6px;display:flex;align-items:center;gap:5px;flex:1;justify-content:center;border-radius:10px;transition:transform .15s,color .2s,background .15s}
.comment-act:active{transform:scale(.9);background:rgba(255,255,255,.06)}
.comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.comment-act-count{font-variant-numeric:tabular-nums;font-size:12px;min-width:10px;text-align:left}
.comment-act.liked{color:#ff2d55}
.comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
.comment-act.saved{color:#fff}
.comment-act.saved svg{fill:#fff;stroke:#fff}

.comment-replies{display:flex;flex-direction:column;position:relative;margin-left:0;padding-left:0;padding-bottom:4px}
.thread-nested{position:relative}

/* REPLY MODE BAR */
.reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#fff;font-weight:600;max-width:420px;width:100%;margin:0 auto}
.reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-mode-bar button{background:none;border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.1);font-family:inherit}
.reply-mode-bar button:active{background:rgba(255,255,255,.2)}

.detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:#000;max-width:420px;width:100%;margin:0 auto}
.detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e;transition:border-color .2s}
.detail-island:focus-within{border-color:#4a4a4e}
.detail-island.reply-mode{border-color:#fff;box-shadow:none}
.detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
.detail-input::placeholder{color:#5a5a5e}
.detail-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,opacity .2s}
.detail-send:active{transform:scale(.9)}
.detail-send:disabled{opacity:.4;cursor:not-allowed}
.detail-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* POST & COMMENT DETAIL VIEWS */
.detail-overlay, .comment-detail-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .3s cubic-bezier(.34,1.2,.64,1) both}
.detail-overlay.show, .comment-detail-overlay.show{display:flex}
@keyframes detailIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
.detail-header, .comment-detail-header{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:calc(16px + 30px);border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:420px;width:100%;margin:0 auto;position:sticky;top:0;z-index:10}
.detail-title, .comment-detail-title{font-size:17px;font-weight:600;text-align:center;}
.detail-scroll, .comment-detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:420px;width:100%;margin:0 auto}
.detail-post{padding:16px;border-bottom:10px solid #0a0a0a}
.detail-post-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.detail-avatar,.detail-avatar-initial{width:46px;height:46px;border-radius:50%;flex-shrink:0}
.detail-avatar{object-fit:cover;background:#1c1c1e}
.detail-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.detail-info{display:flex;flex-direction:column;min-width:0;flex:1}
.detail-user{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-time{font-size:13px;color:#8e8e93;margin-top:2px}
.detail-text{font-size:16px;line-height:1.5;color:#f2f2f7;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.detail-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:8px}
.detail-comments-title{padding:20px 16px 12px;font-size:14px;font-weight:600;color:#fff;letter-spacing:0.3px}
.detail-comments-list{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.detail-empty{text-align:center;color:#5a5a5e;font-size:15px;padding:40px 0}
.comment-detail-main{padding:16px;border-bottom:1px solid rgba(255,255,255,0.05);background:transparent}
.comment-detail-replies{padding:0 16px;display:flex;flex-direction:column;gap:12px}

.nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
.comment-highlight{animation:commentHi 1.3s ease}
@keyframes commentHi{0%,100%{background:transparent}20%,60%{background:rgba(255,255,255,.08)}}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.1);max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* "ISLAND" PASTKI NAVIGATSIYA */
.bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
.bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s}
.nav-btn:active{transform:scale(.92)}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav-active{color:#fff}
.nav-label{font-size:10px;font-weight:600}
</style>
</head>
<body>


<div class="mobile-container">
    <div class="profile-pic-wrapper" id="profilePicWrapper">
        <img id="userPhoto" class="profile-pic" style="display:none" alt="Profil rasmi">
        <div id="userInitial" class="profile-pic-initial"></div>
    </div>
    <h1 class="name" id="userName">Yuklanmoqda...</h1>
    <p class="last-seen" id="userStatus">Profil</p>
    
    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-item" id="postsStat"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>
    
    <div class="action-buttons">

/* ================= POST STORE (SERVER) ================= */
const PostStore = {
    _cache: [],
    async init(){
        try {
            const [pr, sr, mr] = await Promise.all([
                sbFetch('posts?select=data&order=created_at.desc'),
                sbFetch('post_stats?select=*'),
                sbFetch('likes?select=post_id&user_id=eq.' + encodeURIComponent(UID()))
            ]);
            const rows = await pr.json(), stats = await sr.json(), mine = await mr.json();
            const st = new Map((Array.isArray(stats) ? stats : []).map(s => [s.post_id, s]));
            const my = new Set((Array.isArray(mine) ? mine : []).map(m => m.post_id));
            this._cache = (Array.isArray(rows) ? rows : []).map(x => {
                const p = x.data, s = st.get(p.id) || {};
                return { ...p, likes: s.likes || 0, views: s.views || 0, liked: my.has(p.id) };
            });
        } catch { this._cache = []; }
    },
    _load(){ return this._cache; },
    all(){ return this._cache.slice(); },
    byUser(uid){ if (!uid) return this.all(); return this._cache.filter(p => String(p.userId) === String(uid) || p.user === uid); },
    get(id){ return this._cache.find(p => p.id === id) || null; },
    add(post){
        this._cache.unshift(post);
        const { liked, likes, views, ...clean } = post;
        sbFetch('posts', { method: 'POST', headers: UPSERT,
            body: JSON.stringify({ id: post.id, user_id: String(post.userId), created_at: post.createdAt, data: clean })
        }).catch(() => showToast('Saqlashda xatolik'));
        return post;
    },
    update(id, patch){
        const i = this._cache.findIndex(p => p.id === id); if (i < 0) return null;
        const merged = Object.assign({}, this._cache[i], patch);
        this._cache[i] = merged;
        const uid = encodeURIComponent(UID()), pid = encodeURIComponent(id);
        if ('liked' in patch) {
            if (patch.liked) sbFetch('likes', { method: 'POST', headers: UPSERT, body: JSON.stringify({ user_id: UID(), post_id: id }) }).catch(() => {});

        }

            sbFetch('post_views', { method: 'POST', headers: UPSERT, body: JSON.stringify({ user_id: UID(), post_id: id }) }).catch(() => {});

        }

    }
};

/* ================= HELPERS ================= */
function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatExactTime(dateInput){
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';
    const diffSec = Math.floor((new Date() - d) / 1000);
    if (diffSec < 5) return 'hozir'; if (diffSec < 60) return diffSec + ' soniya oldin';
    const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa oldin';
    const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat oldin';
    const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun oldin';
    const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
}
function avatarMarkup(user, cls){

}

}
function compressImage(file, maxW = 1080, quality = 0.85){
    return new Promise((resolve, reject) => {
        const img = new Image(); const url = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(url); let { width, height } = img;
            if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
            const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch (e) { reject(e); }
        }; img.onerror = reject; img.src = url;
    });
}

function findComment(comments, id){
    for (const c of (comments || [])) {
        if (c.id === id) return { comment: c, parent: null, isReply: false, root: c };
        const found = findInReplies(c, id, c); if (found) return found;
    } return null;
}
function findInReplies(parent, id, root){
    for (const r of (parent.replies || [])) {
        if (r.id === id) return { comment: r, parent, isReply: true, root };
        const found = findInReplies(r, id, root); if (found) return found;
    } return null;
}

}
function addCommentToPost(postId, newComment, replyToId){
    const post = PostStore.get(postId); if (!post) return null;
    if (!post.comments) post.comments = [];
    if (!replyToId) {
        newComment.parentId = null; post.comments.push(newComment);
        PostStore.update(postId, { comments: post.comments }); return { post, comment: newComment, parent: null };
    }
    const found = findComment(post.comments, replyToId); if (!found) return null;
    newComment.parentId = replyToId; if (!found.comment.replies) found.comment.replies = [];
    found.comment.replies.push(newComment); PostStore.update(postId, { comments: post.comments });
    return { post, comment: newComment, parent: found.comment };
}

class SavedSet extends Set {
    add(v){
        super.add(v);
        sbFetch('saved', { method: 'POST', headers: UPSERT, body: JSON.stringify({ user_id: UID(), post_id: v }) }).catch(() => {});
        return this;
    }
    delete(v){
        const r = super.delete(v);
        sbFetch(`saved?user_id=eq.${encodeURIComponent(UID())}&post_id=eq.${encodeURIComponent(v)}`, { method: 'DELETE' }).catch(() => {});
        return r;
    }
}
let posts = [], savedPosts = new SavedSet(), myReplies = [];

async function loadSaved(){
    try {
        const rows = await (await sbFetch('saved?select=post_id&user_id=eq.' + encodeURIComponent(UID()))).json();
        if (Array.isArray(rows)) rows.forEach(r => Set.prototype.add.call(savedPosts, r.post_id));
    } catch {}
}
async function loadMyReplies(){
    try {
        const rows = await (await sbFetch('replies?select=data&order=created_at.desc&user_id=eq.' + encodeURIComponent(UID()))).json();
        myReplies = Array.isArray(rows) ? rows.map(r => r.data) : [];

}
function loadMyPosts(){

    document.getElementById('postsCount').textContent = posts.length;
}
function countComments(p){
    let n = (p.comments || []).length; const walk = (arr) => arr.forEach(c => { n += (c.replies || []).length; if (c.replies) walk(c.replies); }); walk(p.comments || []); return n;
}
function handleShare(entity){
    const link = location.origin + location.pathname + '?post=' + encodeURIComponent(entity.id);
    if (navigator.share) navigator.share({ title: 'Post', url: link }).catch(() => {});
    else { try { navigator.clipboard?.writeText(link); } catch {} showToast('Havola nusxalandi'); }
}

function buildPostActions(p, item){
    const actions = document.createElement('div'); actions.className = 'post-actions';
    const createBtn = (icon, count, cls, clk) => {
        const b = document.createElement('button'); b.className = 'act-btn ' + cls;
        b.innerHTML = `${icon}<span class="act-count">${count!==null?count:''}</span>`;
        if (clk) b.addEventListener('click', clk); return b;
    };
    const likeBtn = createBtn(ICONS.like, p.likes||0, p.liked?'liked':'', (e)=>{
        e.stopPropagation(); const fresh = PostStore.get(p.id) || p; const liked = !fresh.liked;
        const likes = Math.max(0, (fresh.likes || 0) + (liked ? 1 : -1));
        PostStore.update(p.id, { liked, likes }); p.liked = liked; p.likes = likes;
        likeBtn.classList.toggle('liked', liked); likeBtn.querySelector('.act-count').textContent = likes;
    });
    const commBtn = createBtn(ICONS.comment, countComments(p), '', (e)=>{ e.stopPropagation(); openPostDetail(p); });
    const viewBtn = createBtn(ICONS.view, p.views||0, '', (e)=>{ e.stopPropagation(); }); viewBtn.style.cursor='default';
    const saveBtn = createBtn(ICONS.bookmark, null, savedPosts.has(p.id)?'saved':'', (e)=>{

function buildPostItem(p){

    const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
            if (en.isIntersecting && !ViewTracker.hasViewed(currentUser?.userId, p.id)) {
                io.disconnect();
                if (ViewTracker.record(currentUser?.userId, p.id)) {

    return item;
}

// Yuborilgan faylni Supabase Storage'ga yuklash uchun maxsus funksiya
async function uploadToStorage(blob, fileName, contentType) {
    const url = `${SB_URL}/storage/v1/object/post_stats/${fileName}`;
    const res = await fetch(url, {
        method: 'POST',
        headers: {
            'apikey': SB_KEY,
            'Authorization': `Bearer ${SB_KEY}`,
            'Content-Type': contentType
        },
        body: blob
    });
    if (!res.ok) throw new Error('Storage yuklashda xatolik');
    // Yuklangan faylning ochiq (public) manzilini qaytarish
    return `${SB_URL}/storage/v1/object/public/post_stats/${fileName}`;
}

function openComposer(){ compOverlay.classList.add('show'); composer.classList.add('show'); setTimeout(() => compInput.focus(), 300); }

    try {
        const data = await compressImage(file);
        // Base64 formatidagi rasmni serverga yuborish uchun Blob ga o'tkazamiz
        const blob = await (await fetch(data)).blob(); 
        currentMedia = { data, type: 'image', blob, ext: 'jpg', mime: 'image/jpeg' };
        document.getElementById('previewImg').src = data; document.getElementById('previewImg').style.display = 'block';
        document.getElementById('previewVid').style.display = 'none'; document.getElementById('composerPreview').classList.add('show');
        compSubmit.disabled = false;
    } catch {}
});

document.getElementById('videoInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    if (file.size > MAX_VIDEO_SIZE) { showToast("Video juda katta (Maksimum 5MB)"); return; }
    const reader = new FileReader();
    reader.onload = ev => {
        const ext = file.name.split('.').pop() || 'mp4';
        currentMedia = { data: ev.target.result, type: 'video', blob: file, ext, mime: file.type || 'video/mp4' };
        document.getElementById('previewVid').src = currentMedia.data; document.getElementById('previewVid').style.display = 'block';
        document.getElementById('previewImg').style.display = 'none'; document.getElementById('composerPreview').classList.add('show');
        compSubmit.disabled = false;

});

// Postni saqlash jarayoni
compSubmit.addEventListener('click', async () => {
    const text = compInput.value.trim(); if (!text && !currentMedia) return;
    
    // Tarmoq jarayonida tugmani vaqtincha bloklash
    const origText = compSubmit.textContent;
    compSubmit.disabled = true;
    compSubmit.textContent = 'Yuklanmoqda...';

    try {
        let mediaUrl = null;
        let mediaType = 'text';

        // Agar fayl biriktirilgan bo'lsa, uni avval Storage'ga yuklaymiz
        if (currentMedia) {
            mediaType = currentMedia.type;
            const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${currentMedia.ext}`;
            mediaUrl = await uploadToStorage(currentMedia.blob, fileName, currentMedia.mime);
        }

        // Qaytgan manzilni (mediaUrl) ma'lumotlar bazasiga saqlaymiz
        PostStore.add({
            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            userId: currentUser?.userId || 'me', user: displayName, avatar: profileOwner?.photo_url || null,
            createdAt: new Date().toISOString(), text, image: mediaUrl, 
            type: mediaType, likes: 0, liked: false, views: 0, comments: []
        });
        
        compInput.value = ''; currentMedia = null; document.getElementById('composerPreview').classList.remove('show');
        closeComposer(); loadMyPosts(); switchTab('posts');
    } catch (err) {
        showToast("Faylni yuklashda xatolik yuz berdi");
        console.error(err);
    } finally {
        // Jarayon tugagach tugmani asliga qaytarish
        compSubmit.disabled = false;
        compSubmit.textContent = origText;
    }
});

/* ================= INIT ================= */
await Promise.all([PostStore.init(), ViewTracker.init(), loadSaved(), loadMyReplies()]);
loadMyPosts(); switchTab('posts');

})();
</script>
</body>
</html>
