<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil UI Dizayni - Qora Fon</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .mobile-container {
    width: 100%;
    max-width: 400px;
    background-color: #000000;
    min-height: 100vh;
  }

  .header-card {
    background: linear-gradient(to bottom, #a4a4a4 0%, #767676 50%, #262626 100%);
    height: 380px;
    border-bottom-left-radius: 35px;
    border-bottom-right-radius: 35px;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .profile-content {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
  }

  .avatar {
    width: 75px;
    height: 75px;
    background-color: black;
    border: 3px solid white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    margin-bottom: 10px;
  }

  .avatar-text {
    color: white;
    font-size: 32px;
    font-weight: 500;
    display: flex;
    align-items: center;
    letter-spacing: -1px;
  }

  .avatar-text::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: #e6007e;
    margin-right: 2px;
  }

  .profile-name {
    color: white;
    font-size: 22px;
    margin: 0 0 15px 0;
    font-weight: 500;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
  }

  button {
    background-color: white;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .btn-subscribe {
    flex: 1; /* Tugma endi kengroq bo'ladi */
  }

  .btn-share {
    width: 44px;
    padding: 0;
    flex: 0 0 44px;
  }

  .btn-share svg {
    width: 20px;
    height: 20px;
    stroke: #111;
  }
</style>
</head>
<body>

<div class="mobile-container">
  <div class="header-card">
    <div class="profile-content">
      <div class="avatar">
        <div class="avatar-text">t2</div>
      </div>
      <h2 class="profile-name">T2</h2>
      <div class="action-buttons">
        <button class="btn-subscribe">Obuna bo‘lish</button>
        <button class="btn-share" aria-label="Ulashish">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
