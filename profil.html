<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UI Dizayni</title>
    
    <!-- Tailwind CSS ulash -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome iconkalari uchun -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind ranglarini moslashtirish -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'app-bg': '#141A21',       /* Asosiy fon rangi */
                        'app-card': '#272D35',     /* O'rtadagi blok rangi */
                        'app-btn': '#434954',      /* Yuqori tugmalar rangi */
                        'app-input-bg': '#171B21'  /* Pastki input fon rangi */
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #141A21;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="flex flex-col h-screen mx-auto max-w-md w-full relative sm:border-x sm:border-gray-800">

    <!-- YUQORI QISM (Header) -->
    <header class="flex items-center justify-between p-4 mt-2">
        <!-- Orqaga tugmasi -->
        <button class="w-11 h-11 rounded-full bg-app-btn flex items-center justify-center text-gray-200 hover:bg-gray-500 transition duration-200">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <!-- Foydalanuvchi ma'lumotlari -->
        <div class="bg-app-btn px-6 py-1.5 rounded-full flex flex-col items-center justify-center shadow-sm">
            <div class="flex items-center gap-2">
                <span class="font-semibold text-[16px] tracking-wide">Daniel Reyes</span>
                <span class="w-2 h-2 rounded-full bg-red-500 mt-0.5"></span>
            </div>
            <span class="text-[12px] text-gray-300 font-light mt-0.5">2-iyn kuni 00:36 da kirgan</span>
        </div>

        <!-- Qo'ng'iroq va Profil rasmi -->
        <div class="flex items-center gap-3">
            <button class="w-11 h-11 rounded-full bg-app-btn flex items-center justify-center text-gray-200 hover:bg-gray-500 transition duration-200">
                <i class="fa-solid fa-phone"></i>
            </button>
            <img src="https://i.pravatar.cc/150?img=11" alt="Profil rasmi" class="w-11 h-11 rounded-full object-cover">
        </div>
    </header>

    <!-- ASOSIY QISM (Xabarlar maydoni / Bo'sh holat) -->
    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-app-card w-full max-w-[340px] rounded-[24px] p-8 pb-10 flex flex-col items-center text-center shadow-lg">
            <h2 class="text-[20px] font-bold mb-2">Bu yerda hali xabarlar yo'q...</h2>
            <p class="text-gray-400 text-[15px] leading-relaxed mb-8">
                Suhbatni boshlash uchun xabar<br>yuboring.
            </p>
            <!-- Qo'l siqishish emojisi -->
            <div class="text-[100px] leading-none drop-shadow-2xl">🤝</div>
        </div>
    </main>

    <!-- PASTKI QISM (Xabar yozish maydoni) -->
    <footer class="p-4 pb-6 flex items-center gap-3">
        <!-- Fayl biriktirish tugmasi -->
        <button class="w-12 h-12 rounded-full border border-gray-700 flex-shrink-0 flex items-center justify-center text-gray-300 hover:bg-gray-800 transition duration-200 bg-app-input-bg">
            <i class="fa-solid fa-paperclip text-lg"></i>
        </button>

        <!-- Matn kiritish maydoni -->
        <div class="flex-1 border border-gray-700 rounded-full px-4 py-3 flex items-center bg-app-input-bg">
            <input type="text" placeholder="Xabar yozing..." class="bg-transparent border-none outline-none text-white w-full placeholder-gray-500 text-[16px]">
            <button class="text-gray-400 ml-2 hover:text-white transition duration-200">
                <i class="fa-regular fa-face-smile text-xl"></i>
            </button>
        </div>

        <!-- Mikrofon tugmasi -->
        <button class="w-12 h-12 rounded-full border border-gray-700 flex-shrink-0 flex items-center justify-center text-gray-300 hover:bg-gray-800 transition duration-200 bg-app-input-bg">
            <i class="fa-solid fa-microphone text-lg"></i>
        </button>
    </footer>

</body>
</html>
