<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Design - Profil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000; /* Asosiy qora fon */
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: #000;
            color: #fff;
        }

        /* Profile Header Section */
        .profile-header {
            position: relative;
            background-image: url('https://images.unsplash.com/photo-1490806843957-31f4c9a91c65?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'); /* Muqova rasmi */
            background-size: cover;
            background-position: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            overflow: hidden; /* Fon va gradient burchakdan chiqib ketmasligi uchun */
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15); /* Profilni ajratib ko'rsatish uchun ozroq soya/yorug'lik */
        }

        .profile-overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
            padding: 40px 20px 25px 20px; /* Tugmalardan keyin faqat 25px rasm foni qoladi */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 480px; /* Rasm uzunroq turishi uchun */
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
        }

        .icon-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .right-icons {
            display: flex;
            gap: 10px;
        }

        .profile-info {
            position: relative;
            margin-bottom: 20px;
            margin-top: auto; /* Elementlarni pastga itarish */
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 26px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .badge {
            position: absolute;
            right: 0;
            bottom: 15px;
            background-color: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-buttons button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Yuqori profil qismi -->
        <div class="profile-header">
            <div class="profile-overlay">
                <!-- Yuqori menyu tugmalari -->
                <div class="top-bar">
                    <button class="icon-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="right-icons">
                        <button class="icon-btn"><i class="fa-regular fa-bell"></i></button>
                        <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                    </div>
                </div>
                
                <!-- Profil ma'lumotlari -->
                <div class="profile-info">
                    <div class="avatar-container">
                        <!-- Agar profil rasmi bo'lmasa, src joyini bo'sh qoldirib rasm qoyishingiz mumkin -->
                        <img src="" alt="" onerror="this.style.display='none'"> 
                    </div>
                    <div class="profile-name">Япония</div>
                    <div class="badge">A+</div>
                </div>

                <!-- Tugmalar -->
                <div class="action-buttons">
                    <button>Obuna bo'lish</button>
                    <button>Xabar</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
