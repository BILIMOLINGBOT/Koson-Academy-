<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil UI Dizayni - Rasmlar bilan</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .mobile-container {
    width: 100%;
    max-width: 400px;
    background-color: #000000;
    min-height: 100vh;
    position: relative;
    padding-bottom: 40px; 
  }

  /* Asosiy fonga inson qiyofasi joylashtirildi */
  .header-card {
    background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%), 
                url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');
    background-size: cover;
    background-position: center top;
    height: 380px;
    border-bottom-left-radius: 35px;
    border-bottom-right-radius: 35px;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .profile-content {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
  }

  .profile-name {
    color: white;
    font-size: 22px;
    margin: 0 0 15px 0;
    font-weight: 500;
  }

  .action-buttons {
    display: flex;
    gap: 10px;
  }

  button {
    background-color: white;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 12px 10px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .btn-subscribe {
    flex: 1;
  }

  .btn-share {
    width: 44px;
    padding: 0;
    flex: 0 0 44px;
  }

  .btn-share svg {
    width: 20px;
    height: 20px;
    stroke: #111;
  }

  /* Statistika Paneli */
  .profile-stats-pill {
    margin: 25px auto 0;
    width: calc(100% - 40px);
    max-width: 360px;
    background-color: #1c1c1e;
    border-radius: 40px; 
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    padding: 12px 15px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .stat-item {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-value {
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
  }

  .stat-label {
    color: #8e8e93;
    font-size: 12px;
    font-weight: 500;
  }

  /* Statistika ostidagi Navigatsiya Paneli */
  .profile-nav-pill {
    margin: 15px auto 0;
    width: calc(100% - 40px);
    max-width: 360px;
    background-color: rgba(28, 28, 30, 0.85); 
    border-radius: 40px; 
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .nav-item {
    color: #8e8e93;
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 15px;
    border-radius: 30px;
    transition: all 0.3s ease;
  }

  .nav-item.active {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.15);
  }

  .nav-item:hover:not(.active) {
    color: #d1d1d6;
  }
</style>
</head>
<body>

<div class="mobile-container">
  <!-- Profil kartochkasi -->
  <div class="header-card">
    <div class="profile-content">
      <h2 class="profile-name">T2</h2>
      <div class="action-buttons">
        <button class="btn-subscribe">Obuna bo‘lish</button>
        <button class="btn-share" aria-label="Ulashish">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Statistika paneli -->
  <div class="profile-stats-pill">
    <div class="stat-item">
      <span class="stat-value">5</span>
      <span class="stat-label">Obunalar</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">44</span>
      <span class="stat-label">Obunachilar</span>
    </div>
    <div class="stat-item">
      <span class="stat-value">3</span>
      <span class="stat-label">Postlar</span>
    </div>
  </div>

  <!-- Statistika ostidagi Navigatsiya paneli -->
  <nav class="profile-nav-pill">
    <a href="#" class="nav-item active">Bosh sahifa</a>
    <a href="#" class="nav-item">Postlar</a>
    <a href="#" class="nav-item">Foto</a>
    <a href="#" class="nav-item">Video</a>
  </nav>

</div>

</body>
</html>
