<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2 UI Design - 35% Kichraytirilgan</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 375px;
            height: 812px; 
            background: linear-gradient(to bottom, #dcdcdc 0%, #8a8a8a 100%);
            position: relative;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            
            /* DIZAYNNI 35% GACHA KICHRAYTIRISH */
            transform: scale(0.35); 
            transform-origin: center;
        }

        /* Yuqori qismdagi piktogrammalar */
        .top-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }

        .icon-btn {
            background-color: rgba(0, 0, 0, 0.3);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .right-icons {
            display: flex;
            gap: 10px;
        }

        /* "GARANTIYA" matni bloki */
        .promo-banner {
            position: absolute;
            top: 70px;
            left: 10px;
            background-color: black;
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
        }

        .promo-banner h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            line-height: 1.1;
        }

        .promo-banner p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #ddd;
        }

        /* Asosiy rasm bo'shlig'i */
        .main-image-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Pastki qismdagi ma'lumotlar */
        .bottom-content {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
            z-index: 10;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            background-color: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid white;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .logo-text {
            color: white;
            font-weight: bold;
            font-size: 32px;
            letter-spacing: -2px;
            position: relative;
        }
        
        .logo-text span {
             color: #e5007f;
             font-size: 16px;
             position: absolute;
             left: -12px;
             top: 8px;
        }

        .brand-name {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin: 0 0 15px 0;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: white;
            color: black;
            border: none;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            flex-grow: 1;
            cursor: pointer;
            text-align: center;
        }

        .btn-share {
            width: 44px;
            flex-grow: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        
        .subscribers {
            position: absolute;
            bottom: -50px;
            left: 20px;
            color: white;
            font-size: 14px;
        }

    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <div class="main-image-placeholder"></div>

        <div class="top-icons">
            <button class="icon-btn"><i class="fas fa-arrow-left"></i></button>
            <div class="right-icons">
                <button class="icon-btn"><i class="fas fa-bell"></i></button>
                <button class="icon-btn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>

        <div class="promo-banner">
            <h1>ГАРАНТИЯ<br>ЛУЧШЕЙ<br>ЦЕНЫ</h1>
            <p>Подключайтесь выгодно</p>
        </div>

        <div class="bottom-content">
            <div class="logo-container">
                <div class="logo-text"><span>■</span>t2</div>
            </div>
            
            <h2 class="brand-name">T2</h2>

            <div class="action-buttons">
                <button class="btn">Obuna bo‘lish</button>
                <button class="btn">Xabar</button>
                <button class="btn btn-share"><i class="fas fa-arrow-up-right-from-square"></i></button>
            </div>
        </div>
        
        <div class="subscribers"><b>703,3K</b> obuna</div>
    </div>

</body>
</html>
