<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Rasm joylari uchun placeholder fon */
        .img-placeholder {
            background: linear-gradient(135deg, #2d3748, #1a202c);
        }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- Mobil ekran o'lchami uchun konteyner -->
    <div class="w-full max-w-md bg-black min-h-screen relative pb-10">
        
        <!-- Yuqori panel (App Bar) -->
        <div class="flex justify-between items-center p-4">
            <button class="bg-[#242424] text-white p-2 rounded-full w-10 h-10 flex items-center justify-center">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button class="bg-[#242424] text-white p-2 rounded-full w-10 h-10 flex items-center justify-center">
                <svg fill="currentColor" viewBox="0 0 20 20" class="w-5 h-5"><path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z"></path></svg>
            </button>
        </div>

        <!-- Profil ma'lumotlari -->
        <div class="flex flex-col items-center mt-2">
            <!-- Rasm -->
            <div class="w-24 h-24 rounded-full img-placeholder overflow-hidden border border-gray-800">
                <img src="https://via.placeholder.com/150" alt="Profile Picture" class="w-full h-full object-cover">
            </div>
            
            <!-- Ism va holat -->
            <h1 class="text-3xl font-semibold mt-4 tracking-wide">Saydalimov Murodbek</h1>
            <p class="text-gray-400 text-sm mt-1.5">15-avg kuni 00:32 da kirgan</p>
        </div>

        <!-- Statistikalar -->
        <div class="flex justify-center items-center mt-6 pt-2 px-6">
            <div class="flex-1 text-center border-r border-[#242424]">
                <div class="text-2xl font-bold">0</div>
                <div class="text-[#888888] text-[13px] mt-1">Obunalar</div>
            </div>
            <div class="flex-1 text-center border-r border-[#242424]">
                <div class="text-2xl font-bold">0</div>
                <div class="text-[#888888] text-[13px] mt-1">Obunachilar</div>
            </div>
            <div class="flex-1 text-center">
                <div class="text-2xl font-bold">2</div>
                <div class="text-[#888888] text-[13px] mt-1">Postlar</div>
            </div>
        </div>

        <!-- Tugmalar -->
        <div class="flex gap-2 px-4 mt-8">
            <button class="bg-[#007aff] hover:bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 rounded-xl flex-1 text-[15px]">
                Obuna bo'lish
            </button>
            <button class="bg-[#242424] hover:bg-[#333] p-3 rounded-xl w-14 flex items-center justify-center">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            </button>
        </div>

        <!-- Tablar (Menyular) -->
        <div class="px-4 mt-6">
            <div class="bg-[#242424] rounded-full flex p-1 h-12 items-center">
                <button class="flex-1 text-[#888888] text-[14px] font-medium tracking-wide">Storylar</button>
                <button class="flex-1 bg-[#4a4a4a] text-white rounded-full h-full text-[14px] font-semibold tracking-wide shadow-sm">Postlar</button>
                <button class="flex-1 text-[#888888] text-[14px] font-medium tracking-wide">Quote'lar</button>
                <button class="flex-1 text-[#888888] text-[14px] font-medium tracking-wide">Giftlar</button>
            </div>
        </div>

        <!-- Postlar tarmog'i (Grid) -->
        <div class="grid grid-cols-2 gap-0.5 mt-4 px-4">
            
            <!-- 1-post -->
            <div class="relative aspect-[3/4] img-placeholder rounded-l-md overflow-hidden">
                <img src="https://via.placeholder.com/300x400" alt="Post 1" class="w-full h-full object-cover">
                <!-- Musiqa belgisi -->
                <div class="absolute top-2 left-2 bg-black/40 p-1.5 rounded-full">
                    <svg fill="currentColor" viewBox="0 0 20 20" class="w-4 h-4 text-white"><path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"></path></svg>
                </div>
                <!-- Karusel belgisi -->
                <div class="absolute top-2 right-2 p-1">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="w-5 h-5 text-white"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                </div>
            </div>

            <!-- 2-post -->
            <div class="relative aspect-[3/4] img-placeholder rounded-r-md overflow-hidden">
                <img src="https://via.placeholder.com/300x400" alt="Post 2" class="w-full h-full object-cover">
                <!-- Musiqa belgisi -->
                <div class="absolute top-2 left-2 bg-black/40 p-1.5 rounded-full">
                    <svg fill="currentColor" viewBox="0 0 20 20" class="w-4 h-4 text-white"><path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.37 4.37 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"></path></svg>
                </div>
            </div>
            
        </div>

        <!-- iOS pastki chizig'i (Home Indicator) -->
        <div class="fixed bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-white rounded-full"></div>

    </div>

</body>
</html>
