<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Sahifalar (SPA) */
        .page {
            display: none;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
            padding-bottom: 140px; 
            min-height: 100vh;
            animation: fadeIn 0.3s ease;
        }

        .page.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profil rasmi va ism */
        .profile-pic-wrapper { margin: 40px 0 20px; }
        
        .profile-pic {
            width: 120px; height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
        }

        .name { font-size: 24px; font-weight: 600; margin-bottom: 6px; text-align: center; }
        .last-seen { color: #8e8e93; font-size: 15px; margin-bottom: 24px; text-align: center; }

        /* Statistika */
        .stats-container {
            display: flex; width: 100%; justify-content: space-between;
            margin-bottom: 24px; padding: 0 10px;
        }
        .stat-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .stat-divider { width: 1px; background-color: #2c2c2e; height: 40px; align-self: center; }
        .stat-number { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
        .stat-label { color: #8e8e93; font-size: 13px; }

        /* Tugmalar */
        .action-buttons { display: flex; width: 100%; gap: 10px; margin-bottom: 24px; }
        .btn-edit, .btn-message {
            flex: 1; border: none; border-radius: 100px; padding: 14px 0;
            font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: transform 0.2s ease;
        }
        .btn-edit { background-color: #ffffff; color: #000000; }
        .btn-message { background-color: #1c1c1e; color: #ffffff; }
        .btn-edit:active, .btn-message:active { transform: scale(0.96); }
        .btn-edit svg, .btn-message svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* Tablar */
        .tabs {
            display: flex; background-color: #1c1c1e; width: 100%;
            border-radius: 20px; padding: 4px; margin-bottom: 20px; gap: 2px;
        }
        .tab-item {
            color: #8e8e93; font-size: 14px; padding: 10px 6px;
            border-radius: 16px; cursor: pointer; text-align: center;
            flex: 1; font-weight: 500; transition: all 0.2s ease;
        }
        .tab-item.active { background-color: #48484a; color: #ffffff; font-weight: 600; }

        /* Content */
        .content-area { color: #8e8e93; font-size: 15px; text-align: center; width: 100%; padding: 30px 0; }
        .empty-icon {
            width: 50px; height: 50px; margin: 0 auto 12px;
            border: 2px solid #3f3f46; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #3f3f46;
        }
        .empty-icon svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }

        /* 🚀 ZAMONAVIY "BOSHLASH" TUGMASI (Island/Pill) */
        .start-pill-btn {
            position: fixed;
            right: 20px;
            bottom: calc(90px + env(safe-area-inset-bottom));
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #000000;
            border: none;
            border-radius: 100px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15), 0 4px 12px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .start-pill-btn:active {
            transform: scale(0.92);
            opacity: 0.9;
        }

        .start-pill-btn svg {
            width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        }

        /* Pastki Menyu */
        .bottom-nav {
            position: fixed;
            bottom: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5); border-radius: 2rem; z-index: 50;
        }
        .bottom-nav-inner { display: flex; justify-content: space-around; align-items: center; padding: 12px 8px; }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 0 12px; cursor: pointer; background: none; border: none; color: #a1a1aa;
        }
        .nav-btn.nav-active { color: #ffffff; }
        .nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; }
        .nav-btn .nav-label { font-size: 10px; font-weight: 500; }
        .nav-btn .nav-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid transparent; }
        .nav-btn.nav-active .nav-avatar { border-color: #ffffff; }
    </style>
</head>
<body>

    <!-- Boshlash (Pill) Tugmasi -->
    <button class="start-pill-btn" id="startBtn">
        Boshlash
        <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </button>

    <!-- PROFIL SAHIFASI -->
    <div id="page-profile" class="page active">
        <div class="profile-pic-wrapper">
            <img id="userPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" class="profile-pic">
        </div>

        <h1 class="name" id="userName">Foydalanuvchi</h1>
        <p class="last-seen" id="userStatus">@username</p>

        <div class="stats-container">
            <div class="stat-item"><span class="stat-number" id="subsCount">0</span><span class="stat-label">Obunalar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="followersCount">0</span><span class="stat-label">Obunachilar</span></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
        </div>

        <div class="action-buttons">
            <div id="ownProfileActions" style="display:none; width:100%; gap:10px;">
                <button class="btn-edit" id="editBtn"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Tahrirlash</button>
            </div>
            <div id="otherProfileActions" style="display:none; width:100%; gap:10px;">
                <button class="btn-edit" id="subscribeBtn">Obuna bo'lish</button>
                <button class="btn-message" id="messageBtn">Xabar</button>
            </div>
        </div>

        <div class="tabs" id="tabsContainer">
            <div class="tab-item active" data-tab="home">Lenta</div>
            <div class="tab-item" data-tab="posts">Postlar</div>
            <div class="tab-item" data-tab="video">Video</div>
        </div>

        <div class="content-area">
            <div class="empty-icon" id="emptyIcon">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <p id="contentText">Hali ma'lumot yo'q</p>
        </div>
    </div>

    <!-- BOSHQA SAHIFALAR (Bo'sh SPA qismlar) -->
    <div id="page-home" class="page"><h2>Uy sahifasi</h2></div>
    <div id="page-reels" class="page"><h2>Reels</h2></div>
    <div id="page-messages" class="page"><h2>Xabarlar</h2></div>
    <div id="page-search" class="page"><h2>Qidiruv</h2></div>

    <!-- PASTKI NAVIGATSIYA -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <button class="nav-btn" data-target="page-home"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span class="nav-label">Uy</span></button>
            <button class="nav-btn" data-target="page-reels"><svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><line x1="2" y1="8" x2="22" y2="8"></line><line x1="2" y1="16" x2="22" y2="16"></line></svg><span class="nav-label">Reels</span></button>
            <button class="nav-btn" data-target="page-messages"><svg viewBox="0 0 24 24" style="transform: scaleX(-1);"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg><span class="nav-label">Xabar</span></button>
            <button class="nav-btn" data-target="page-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><span class="nav-label">Qidiruv</span></button>
            <button class="nav-btn nav-active" data-target="page-profile">
                <img id="navUserPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" class="nav-avatar">
                <span class="nav-label">Profil</span>
            </button>
        </div>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // Boshlash tugmasi bosilganda URL ni ochish
        document.getElementById('startBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('medium');
            window.location.href = 'Boshlash.html'; // Boshlash.html sahifasini ochadi
        });

        // Foydalanuvchi ma'lumotlarini yuklash
        const urlParams = new URLSearchParams(window.location.search);
        const profileUserId = urlParams.get('id');
        const user = tg?.initDataUnsafe?.user;
        const isOwnProfile = !profileUserId || String(profileUserId) === String(user?.id);

        if (user) {
            document.getElementById('userName').textContent = user.first_name || 'Foydalanuvchi';
            if (user.photo_url) {
                document.getElementById('userPhoto').src = user.photo_url;
                document.getElementById('navUserPhoto').src = user.photo_url;
            }
        }

        if (isOwnProfile) {
            document.getElementById('ownProfileActions').style.display = 'flex';
        } else {
            document.getElementById('otherProfileActions').style.display = 'flex';
            document.getElementById('startBtn').style.display = 'none'; // Boshqa birovni profilida "Boshlash" kerak bo'lmasa
        }

        // SPA Routing (pastki menyu orqali sahifa o'zgartirish)
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                tg?.HapticFeedback?.selectionChanged();
                document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
                document.getElementById(btn.dataset.target).classList.add('active');
                document.querySelectorAll('.nav-btn').forEach(nav => nav.classList.remove('nav-active'));
                btn.classList.add('nav-active');
            });
        });

        // Profil Tablarini boshqarish
        const tabTexts = { home: "Hali ma'lumot yo'q", posts: "Hali post yo'q", video: "Hali video yo'q" };
        document.getElementById('tabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('contentText').textContent = tabTexts[tab.dataset.tab];
            tg?.HapticFeedback?.selectionChanged();
        });
    </script>
</body>
</html>
