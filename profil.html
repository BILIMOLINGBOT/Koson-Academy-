<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil - L.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= ASOSIY VA PROFIL STIL ================= */
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{background:#000!important;color:#e7e9ea;overflow-x:hidden}
body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
.app-wrapper {width:100%;max-width:600px;position:relative;background:#000;min-height:100vh;border-left:1px solid #2f3336;border-right:1px solid #2f3336;overflow:hidden;}

/* EKRANLAR UCHUN (SLIDE ANIMATSIYA) */
.screen {position:absolute;top:0;left:0;width:100%;min-height:100%;background-color:#000;transition:transform 0.3s ease;overflow-y:auto;overflow-x:hidden;}
#mainScreen {transform:translateX(0);z-index:1;padding-bottom:80px;} /* Bottom nav uchun joy */
#detailScreen {transform:translateX(100%);z-index:200;display:none;padding-bottom:60px;} 
.screen-hidden-left {transform:translateX(-30%);}
.screen-active {transform:translateX(0) !important; display:block !important;}

/* PROFIL HEADER QISMI */
.mobile-container{padding:20px 20px 0;display:flex;flex-direction:column;align-items:center}
.back-bar{width:100%;display:flex;align-items:center;margin:0 0 10px}
.back-btn{background:#1c1c1e;border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;}
.back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:10px 0 20px;position:relative}
.profile-pic,.profile-pic-initial{width:90px;height:90px;border-radius:50%;border:2px solid #000;cursor:pointer}
.profile-pic{object-fit:cover;background:#1c1c1e}
.profile-pic-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;}
.name{font-size:22px;font-weight:800;margin-bottom:4px;text-align:center;color:#e7e9ea}
.last-seen{color:#71767b;font-size:15px;margin-bottom:20px;text-align:center}
.stats-container{display:flex;width:100%;justify-content:center;gap:20px;margin-bottom:20px;color:#71767b;font-size:14px}
.stat-item{display:flex;gap:4px;cursor:pointer}
.stat-number{font-weight:700;color:#e7e9ea}
.action-buttons{display:flex;width:100%;gap:10px;margin-bottom:20px}
.btn-edit{flex:1;background:#eff3f4;color:#0f1419;border:none;border-radius:9999px;padding:8px 0;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn-settings{background:transparent;border:1px solid #536471;border-radius:50%;width:36px;height:36px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.btn-settings svg{width:18px;height:18px;fill:none;stroke:#eff3f4;stroke-width:2}
.tabs{display:flex;width:100%;border-bottom:1px solid #2f3336;margin-bottom:0}
.tab-item{color:#71767b;padding:16px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:1;font-weight:500;font-size:15px;position:relative;transition:background .2s}
.tab-item:hover{background:rgba(231,233,234,0.1)}
.tab-item.active{color:#e7e9ea;font-weight:700}
.tab-item.active::after{content:'';position:absolute;bottom:0;width:56px;height:4px;background:#1d9bf0;border-radius:2px}
.content-area{width:100%;}
.empty-icon{color:#71767b;margin:40px auto 10px;text-align:center}
.empty-icon svg{width:40px;height:40px;stroke:currentColor;fill:none}
.empty-text{color:#71767b;text-align:center;font-size:15px}

/* ================= X (TWITTER) FEED POST ================= */
.tweet-feed {padding:12px 16px;border-bottom:1px solid #2f3336;display:flex;cursor:pointer;transition:background .2s;}
.tweet-feed:hover {background-color:rgba(255,255,255,0.03);}
.avatar-container {margin-right:12px;}
.feed-avatar,.feed-avatar-initial {width:40px;height:40px;border-radius:50%;object-fit:cover;}
.feed-avatar-initial {background:linear-gradient(135deg,#3a3a3c,#1c1c1e);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;font-size:18px;}
.content-container {flex:1;min-width:0;}
.header-feed {display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px;}
.user-info {display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:15px;}
.display-name {font-weight:700;color:#e7e9ea;}
.username, .timestamp {color:#71767b;}
.verified-badge {width:16px;height:16px;fill:#1d9bf0;display:inline-block;}
.tweet-text-feed {font-size:15px;line-height:20px;margin:0 0 12px 0;word-wrap:break-word;color:#e7e9ea;}
.post-media {width:100%;border-radius:14px;margin-bottom:12px;border:1px solid #2f3336;max-height:400px;object-fit:cover;}
.actions-feed {display:flex;justify-content:space-between;color:#71767b;max-width:425px;}
.action-item {display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 0;transition:color .2s;}
.action-item svg {width:18.75px;height:18.75px;fill:currentColor;}
.action-item:hover {color:#1d9bf0;}
.action-item.retweet:hover {color:#00ba7c;}
.action-item.like:hover, .action-item.liked {color:#f91880;}

/* ================= X (TWITTER) DETAIL VIEW ================= */
.top-bar {position:sticky;top:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);display:flex;align-items:center;padding:0 16px;height:53px;z-index:10;}
.top-bar-title {font-size:20px;font-weight:700;margin-left:20px;}
.icon-btn {width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn svg {width:20px;height:20px;fill:#e7e9ea;}

.main-post {padding:12px 16px 0;}
.main-user-info {display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.user-left {display:flex;align-items:center;gap:12px;}
.detail-avatar {width:40px;height:40px;border-radius:50%;object-fit:cover;}
.name-block {display:flex;flex-direction:column;}
.main-tweet-text {font-size:17px;line-height:24px;margin-bottom:16px;word-wrap:break-word;}
.post-stats {color:#71767b;font-size:15px;padding-bottom:16px;border-bottom:1px solid #2f3336;}
.post-stats strong {color:#e7e9ea;}
.main-actions {display:flex;justify-content:space-around;padding:12px 4px;border-bottom:1px solid #2f3336;}
.sort-row {display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2f3336;font-size:15px;color:#71767b;font-weight:700;}

/* COMMENTS QISMI (TWITTER REPLY) */
.reply-tweet {display:flex;padding:12px 16px;border-bottom:1px solid #2f3336;}
.reply-avatar-col {margin-right:12px;}
.reply-content {flex:1;}
.reply-header {display:flex;justify-content:space-between;}
.reply-text {font-size:15px;line-height:20px;margin:4px 0 12px;}

/* BOTTOM COMMENT INPUT (DETAIL) */
.detail-bottom-bar {position:fixed;bottom:0;max-width:600px;width:100%;background:#000;border-top:1px solid #2f3336;display:flex;align-items:center;padding:8px 16px;z-index:210;}
.detail-bottom-avatar {width:32px;height:32px;border-radius:50%;background:#1d9bf0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;margin-right:12px;}
.detail-input-wrap {flex:1;display:flex;align-items:center;}
.detail-reply-input {background:none;border:none;color:#e7e9ea;font-size:15px;flex:1;outline:none;}
.detail-send-btn {background:none;border:none;color:#1d9bf0;font-weight:700;font-size:15px;padding:0 8px;cursor:pointer;}
.detail-send-btn:disabled {opacity:0.5;}

/* BOSHQA ELEMENTLAR (COMPOSER, NAV, TOAST) */
.post-btn{position:fixed;right:20px;bottom:90px;z-index:60;width:56px;height:56px;background:#1d9bf0;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(29,155,240,0.4);}
.post-btn svg{width:24px;height:24px;fill:#fff;}

.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:600px;background:#000;border-radius:16px 16px 0 0;z-index:301;padding:16px;transition:transform .3s;border-top:1px solid #2f3336;}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;margin-bottom:16px;}
.composer-submit{background:#1d9bf0;color:#fff;border:none;border-radius:9999px;padding:6px 16px;font-weight:700;font-size:15px;cursor:pointer;}
.composer-submit:disabled{opacity:0.5;}
.composer-close{background:none;border:none;color:#e7e9ea;font-size:15px;cursor:pointer;}
.composer-body{display:flex;gap:12px;}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#e7e9ea;font-size:17px;min-height:80px;resize:none;}
.composer-actions{display:flex;gap:16px;margin-top:10px;padding-left:52px;color:#1d9bf0;}
.composer-actions svg{width:20px;height:20px;fill:currentColor;cursor:pointer;}

.bottom-nav{position:fixed;bottom:0;width:100%;max-width:600px;background:#000;border-top:1px solid #2f3336;z-index:50;display:flex;justify-content:space-around;padding:12px 0 env(safe-area-inset-bottom);}
.nav-btn{color:#71767b;display:flex;justify-content:center;flex:1;}
.nav-active{color:#e7e9ea;}
.nav-btn svg{width:26px;height:26px;fill:currentColor;}

.toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);background:#1d9bf0;color:#fff;padding:10px 20px;border-radius:9999px;font-size:14px;z-index:400;opacity:0;pointer-events:none;transition:all .3s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

<script>
/* ================= DB & XOTIRA MANTIQ ================= */
const DB = {
    _K: 'luz_users', _S: 'luz_current_user',
    _getUsers(){ try { return JSON.parse(localStorage.getItem(this._K)) || []; } catch { return []; } },
    getCurrentUser(){ const id = localStorage.getItem(this._S); return this._getUsers().find(u => u.userId === id) || null; },
    getUserById(id){ return this._getUsers().find(u => String(u.userId) === String(id)) || null; }
};
const POST_STORE_KEY = 'tg_feed_posts_v1';
const PostStore = {
    _load(){ try { return JSON.parse(localStorage.getItem(POST_STORE_KEY)) || []; } catch { return []; } },
    _save(list){ localStorage.setItem(POST_STORE_KEY, JSON.stringify(list)); },
    all(){ return this._load(); },
    byUser(uid){ return uid ? this._load().filter(p => String(p.userId) === String(uid)) : this._load(); },
    add(post){ const l = this._load(); l.unshift(post); this._save(l); return post; },
    update(id, patch){ 
        const l = this._load(); const i = l.findIndex(p => p.id === id); 
        if(i >= 0){ l[i] = {...l[i], ...patch}; this._save(l); return l[i]; } 
        return null;
    }
};

const currentUser = DB.getCurrentUser();
if (!currentUser) window.location.href = 'authorization.html';

const profileUserId = new URLSearchParams(location.search).get('id');
const isOwn = !profileUserId || String(profileUserId) === String(currentUser?.userId);
const profileOwner = isOwn ? currentUser : (DB.getUserById(profileUserId) || null);

const displayName = profileOwner ? ([profileOwner.firstName, profileOwner.lastName].filter(Boolean).join(' ') || 'User') : 'User';
const displayUsername = profileOwner?.username ? '@' + profileOwner.username : '@user';
const initL = displayName.charAt(0).toUpperCase();


/* ================= PROFIL YUKLASH ================= */
document.getElementById('userName').textContent = displayName;
document.getElementById('userStatus').textContent = displayUsername;
document.getElementById('detailAvatarInitial').textContent = currentUser ? (currentUser.firstName?.charAt(0).toUpperCase() || 'U') : 'U';
document.getElementById('composerAvatarSlot').textContent = initL;

if (isOwn) {

/* ================= POST FEED RENDER ================= */
let posts = [];
function loadMyPosts(){
    posts = profileUserId ? PostStore.byUser(profileUserId) : PostStore.byUser(currentUser.userId);
    document.getElementById('postsCount').textContent = posts.length;
    renderPosts();
}

window.toggleLike = function(id, btnElement) {
    const post = PostStore.all().find(x => x.id === id);
    if(!post) return;
    post.liked = !post.liked;
    post.likes = Math.max(0, (post.likes||0) + (post.liked ? 1 : -1));
    PostStore.update(id, {liked: post.liked, likes: post.likes});
    
    btnElement.classList.toggle('liked', post.liked);
    btnElement.querySelector('.like-cnt').textContent = post.likes;
    
    // Agar detal sahifada bo'lsa, uni ham yangilash
    if(activePost && activePost.id === id) {
        activePost.liked = post.liked;
        activePost.likes = post.likes;
        document.getElementById('detailLikeCnt').textContent = post.likes;
        document.getElementById('detailLikeBtn').classList.toggle('liked', post.liked);
    }
}

function renderPosts(){
    const area = document.getElementById('contentArea');
    area.innerHTML = '';
    if(posts.length === 0){
        area.innerHTML = `<div class="empty-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></div><div class="empty-text">No posts yet</div>`;
        return;
    }
    posts.forEach(p => area.appendChild(buildPostItem(p)));
}

/* ================= 3. DETAIL VIEW (ICHKI SAHIFA) ================= */

    dp.innerHTML = `
        <div class="main-user-info">

                    </div>
                    <span class="username">${escapeHtml(username)}</span>
                </div>
            </div>
            <button class="btn-edit" style="width:auto;padding:0 16px;height:32px">Follow</button>
        </div>
        <div class="main-tweet-text">${escapeHtml(p.text)}</div>
        <div class="post-stats">21:50 · 21 okt 26 · <strong>${p.views||0}</strong> Views</div>
        <div class="main-actions">
            <div class="action-item">${ICON_COMMENT} <span id="detailCommCnt">${(p.comments||[]).length}</span></div>

            <div class="action-item like ${p.liked?'liked':''}" id="detailLikeBtn" onclick="toggleLike('${p.id}', this)">${ICON_LIKE} <span id="detailLikeCnt">${p.likes||0}</span></div>
            <div class="action-item">${ICON_SHARE}</div>
        </div>
    `;

    renderDetailComments();

    // Sahifani ochish animatsiyasi
    document.getElementById('mainScreen').classList.add('screen-hidden-left');
    document.getElementById('detailScreen').classList.add('screen-active');
}

function closeDetailView() {
    document.getElementById('mainScreen').classList.remove('screen-hidden-left');
    document.getElementById('detailScreen').classList.remove('screen-active');
    activePost = null;
    loadMyPosts(); // update UI (likes/comments numbers)
}

function renderDetailComments() {
    const box = document.getElementById('detailComments');
    box.innerHTML = '';
    const comments = activePost.comments || [];
    
    if(comments.length === 0) {
        box.innerHTML = `<div style="padding:40px;text-align:center;color:#71767b;">No replies yet</div>`;
        return;
    }
    
    comments.forEach(c => {
        const u = c.user || 'User';
        const un = '@' + u.toLowerCase().replace(/\s/g, '');
        const i = u.charAt(0).toUpperCase();
        
        const d = document.createElement('div');
        d.className = 'reply-tweet';
        d.innerHTML = `
            <div class="reply-avatar-col">
                <div class="feed-avatar-initial" style="width:40px;height:40px;font-size:16px;">${i}</div>
            </div>
            <div class="reply-content">
                <div class="reply-header">
                    <div style="display:flex;gap:4px;align-items:center;font-size:15px;">
                        <span class="display-name">${escapeHtml(u)}</span>
                        <span class="username">${escapeHtml(un)} · 1h</span>
                    </div>
                </div>
                <div class="reply-text">${escapeHtml(c.text)}</div>
                <div class="actions-feed" style="max-width:300px;font-size:13px;">
                    <div class="action-item">${ICON_COMMENT} <span>0</span></div>
                    <div class="action-item retweet">${ICON_RETWEET} <span>0</span></div>
                    <div class="action-item like">${ICON_LIKE} <span>0</span></div>
                </div>
            </div>
        `;
        box.appendChild(d);
    });
}

// Izoh yozish
const detailInput = document.getElementById('detailReplyInput');
const detailSend = document.getElementById('detailReplyBtn');

detailInput.addEventListener('input', () => {
    detailSend.disabled = detailInput.value.trim().length === 0;
});

detailSend.addEventListener('click', () => {
    if(!activePost) return;
    const txt = detailInput.value.trim();
    if(!txt) return;
    
    if(!activePost.comments) activePost.comments = [];
    activePost.comments.push({
        id: 'c_' + Date.now(),
        user: displayName,
        text: txt,
        time: new Date().toISOString()
    });
    
    PostStore.update(activePost.id, { comments: activePost.comments });
    
    detailInput.value = '';
    detailSend.disabled = true;
    document.getElementById('detailCommCnt').textContent = activePost.comments.length;
    renderDetailComments();
    
    // Yozilgandan kiyin pastga tushirish
    const scroll = document.getElementById('detailScreen');
    setTimeout(() => { scroll.scrollTo({ top: scroll.scrollHeight, behavior: 'smooth' }) }, 100);
});


/* ================= COMPOSER (Yangi post yozish) ================= */
document.getElementById('postBtn').onclick = () => {
    document.getElementById('composerOverlay').classList.add('show');
    document.getElementById('composer').classList.add('show');
};

const cClose = document.getElementById('composerClose');
const cOver = document.getElementById('composerOverlay');
function closeComp() {
    cOver.classList.remove('show');
    document.getElementById('composer').classList.remove('show');
}
cClose.onclick = closeComp; cOver.onclick = closeComp;

const cInput = document.getElementById('composerInput');
const cSubmit = document.getElementById('composerSubmit');

cInput.addEventListener('input', () => { cSubmit.disabled = cInput.value.trim().length === 0; });

cSubmit.onclick = () => {
    const text = cInput.value.trim();
    if(!text) return;
    PostStore.add({
        id: 'p_' + Date.now(),
        userId: currentUser?.userId || 'me',
        user: displayName,
        text: text,
        time: new Date().toISOString(),
        likes: 0, liked: false, views: 0, comments: []
    });
    
    cInput.value = '';
    cSubmit.disabled = true;
    closeComp();
    loadMyPosts();
};

/* Init */
loadMyPosts();

/* Telegram orqaga tugmasini yo'naltirish */
document.getElementById('backBtn').onclick = () => { location.href='index.html'; };
