<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Profil - L.uz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
    --tg-header-h:calc(92px + env(safe-area-inset-top));
    --tg-header-pad-top:calc(48px + env(safe-area-inset-top));
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{background-color:#000000!important;color:#ffffff;overscroll-behavior-y:none}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;-webkit-font-smoothing:antialiased}

.profile-card{width:100%;max-width:480px;background-color:#000000;position:relative;padding-bottom:140px}

/* Yuqori sticky sarlavha (Telegram Fullscreen tugmalari qatoriga moslangan) */
.top-controls{
    position:fixed;
    top:0;
    width:100%;
    max-width:480px;
    height:var(--tg-header-h);
    padding:var(--tg-header-pad-top) 84px 10px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:40;
    pointer-events:none;
    background:transparent;
    transition:background-color .25s ease,backdrop-filter .25s ease;
}
.top-controls.scrolled{
    background:rgba(0,0,0,0.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}
.sticky-header-title{
    font-size:17px;
    font-weight:700;
    color:#ffffff;
    opacity:0;
    transform:translateY(6px);
    transition:opacity .22s ease,transform .22s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    max-width:100%;
    overflow:hidden;
}
.sticky-header-title #stickyNameText{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.sticky-header-title.visible{opacity:1;transform:translateY(0)}

/* Banner */
.banner{height:calc(230px + env(safe-area-inset-top));background:radial-gradient(120% 100% at 50% 0%, #242426 0%, #121214 55%, #000000 100%);position:sticky;top:0;z-index:5;overflow:hidden}
.banner-default{width:100%;height:100%;background:linear-gradient(160deg, #1f1f22 0%, #111113 48%, #050505 100%);position:relative;transform-origin:center top;will-change:transform,filter}
.banner-default::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 60%);pointer-events:none}
.banner-img{width:100%;height:100%;object-fit:cover;display:none;transform-origin:center top;will-change:transform,filter}

/* Avatar: 40% bannerda, 60% qora fonda */
.avatar-container{width:108px;height:108px;border-radius:50%;background-color:#222222;border:5px solid #000000;position:absolute;left:20px;top:calc(168.8px + env(safe-area-inset-top));transform-origin:center center;z-index:30;overflow:hidden;will-change:transform;cursor:pointer}
.avatar-container img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-initial-big{width:100%;height:100%;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;text-transform:uppercase}

/* Pastki qora panel */
.bottom-sheet{background-color:#000000;border-top-left-radius:18px;border-top-right-radius:18px;margin-top:-18px;position:relative;z-index:20;padding:14px 20px 10px 20px}

/* Ism va @username bloki */
.profile-name-block{margin-left:120px;min-height:52px;display:flex;flex-direction:column;justify-content:center;margin-bottom:16px}
.profile-name-row{display:flex;align-items:center;gap:6px;cursor:pointer}
.profile-name-row:active{opacity:.75}
.user-title{font-size:22px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-handle{font-size:14px;color:#71767b;margin-top:2px}
.verified-badge-icon{width:21px;height:21px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.verified-badge-sm{width:15px;height:15px;flex-shrink:0;display:inline-block;vertical-align:middle;margin-left:4px}

/* Statistika */
.stats-row{display:flex;align-items:center;gap:18px;margin-bottom:10px;font-size:15px;flex-wrap:wrap}
.stat-item{cursor:pointer}
.stat-item:active{opacity:.75}
.stat-item strong{color:#ffffff;font-weight:700}
.stat-item span{color:#71767b}

/* Bio */
.bio-text{font-size:14.5px;line-height:1.4;color:#e7e9ea;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}

/* Action tugmalar */
.action-buttons{display:flex;align-items:center;gap:12px;margin-bottom:6px;background-color:#000000}
.btn-edit{flex:1;height:46px;border-radius:9999px;background-color:#000000;border:1.5px solid #333639;color:#ffffff;font-size:16px;font-weight:700;cursor:pointer;transition:background-color .2s ease,transform .15s ease,color .2s ease,border-color .2s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-edit:active{background-color:#16181c;transform:scale(.98)}
.btn-edit.primary{background-color:#ffffff;color:#000000;border-color:#ffffff}
.btn-edit.primary:active{background-color:#e5e5e5}
.btn-edit svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn-settings{width:46px;height:46px;border-radius:50%;background-color:#000000;border:1.5px solid #333639;color:#ffffff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:background-color .2s ease,transform .15s ease}
.btn-settings:active{background-color:#16181c;transform:scale(.94) rotate(30deg)}
.btn-settings svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Navigatsiya tablari */
.nav-tabs{
    background-color:#000000;
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding-top:4px;
    position:sticky;
    top:var(--tg-header-h);
    z-index:35;
    border-bottom:1px solid #1c1c1e;
}
.tab-item{flex:1;padding:14px 12px;color:#71767b;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:color .2s ease,transform .15s ease;user-select:none}
.tab-item:active{transform:scale(.94)}
.tab-item.active{color:#ffffff}
.tab-item.active::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:48%;max-width:52px;height:3px;background:#ffffff;border-radius:3px 3px 0 0;animation:tabSlide .25s ease both}
@keyframes tabSlide{from{transform:translateX(-50%) scaleX(.3);opacity:0}to{transform:translateX(-50%) scaleX(1);opacity:1}}

/* Kontent maydoni */
.content-area{
    position:relative;
    z-index:22;
    background-color:#000000;
    color:#71767b;
    font-size:15px;
    text-align:center;
    width:100%;
    padding:4px 20px 24px;
    min-height:calc(100vh - 150px);
}
.empty-state{padding:48px 0}
.empty-icon{width:58px;height:58px;margin:0 auto 14px;border:1.5px solid #333639;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#71767b}
.empty-icon svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.load-more-btn{
    margin:16px auto 8px;
    padding:10px 22px;
    border-radius:999px;
    background:#161618;
    border:1px solid #2c2c2e;
    color:#ffffff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}
.load-more-btn:active{background:#242426}
.load-more-btn:disabled{opacity:.5;cursor:default}

/* Skeleton Loader */
.tab-loader{display:none;flex-direction:column;width:100%;padding:8px 0;position:relative;z-index:22;background-color:#000000}
.tab-loader.active{display:flex}
.sk-post{display:flex;gap:10px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.sk-shimmer{background:#161618;background-image:linear-gradient(110deg,#161618 0%,#161618 35%,#26262b 50%,#161618 65%,#161618 100%);background-size:250% 100%;animation:skWave 1.35s linear infinite}
@keyframes skWave{0%{background-position:100% 0}100%{background-position:-100% 0}}
.sk-av{width:42px;height:42px;border-radius:50%;flex-shrink:0}
.sk-col{flex:1;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.sk-l1{width:45%;height:13px;border-radius:6px}
.sk-l2{width:90%;height:12px;border-radius:6px}
.sk-l3{width:65%;height:12px;border-radius:6px}

/* Floating Post tugmasi */
.post-btn{position:fixed;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:40;display:inline-flex;align-items:center;gap:10px;padding:14px 26px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;user-select:none;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
.post-btn:active{transform:scale(.94)}
.post-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Composer */
.composer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.composer-overlay.show{opacity:1;pointer-events:auto}
.composer{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;background:#141415;border-radius:32px 32px 0 0;border:1px solid #2c2c2e;border-bottom:none;z-index:101;padding:24px 20px calc(24px + env(safe-area-inset-bottom));transition:transform .35s cubic-bezier(.34,1.2,.64,1);box-shadow:0 -10px 60px rgba(0,0,0,.9)}
.composer.show{transform:translate(-50%,0)}
.composer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.composer-title{font-size:17px;font-weight:700}
.composer-close{background:#2c2c2e;border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93}
.composer-close:active{transform:scale(.9);background:#3a3a3c}
.composer-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-body{display:flex;gap:12px;margin-bottom:16px}
.composer-avatar,.composer-avatar-initial{width:40px;height:40px;border-radius:50%;flex-shrink:0}
.composer-avatar{object-fit:cover;background:#1c1c1e}
.composer-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.composer-input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit;resize:none;min-height:44px;max-height:160px;line-height:1.4;padding-top:10px}
.composer-input::placeholder{color:#5a5a5e}
.composer-preview{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:16px;display:none;border:1px solid #2c2c2e}
.composer-preview.show{display:block}
.composer-preview img,.composer-preview video{width:100%;max-height:240px;object-fit:cover;display:block}
.composer-preview .remove-img{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.composer-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}
.composer-attach-group{display:flex;gap:8px}
.composer-attach{background:#2c2c2e;border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
.composer-attach:active{transform:scale(.92);background:#3a3a3c}
.composer-attach svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.composer-submit{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer}
.composer-submit:active{transform:scale(.95)}
.composer-submit:disabled{opacity:.4;cursor:not-allowed}

/* Feed va Postlar */
.feed{width:100%;display:flex;flex-direction:column;padding-bottom:20px;gap:0}
.post-item{width:100%;padding:16px 0;text-align:left;animation:postIn .35s cubic-bezier(.34,1.2,.64,1) both;cursor:pointer;transition:background .15s ease;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.06)}
.post-item:active{background:rgba(255,255,255,0.03)}
@keyframes postIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.post-avatar,.post-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer}
.post-avatar{object-fit:cover;background:#1c1c1e}
.post-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;text-transform:uppercase}
.post-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.post-head-info{display:flex;flex-direction:row;align-items:baseline;gap:6px;min-width:0}
.post-user{font-size:15px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;display:inline-flex;align-items:center}
.post-time{font-size:13px;color:#71767b;flex-shrink:0}
.post-del-btn{background:none;border:none;color:#71767b;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0}
.post-del-btn:active{color:#ff453a;background:rgba(255,69,58,0.12)}
.post-del-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-text{font-size:15px;line-height:1.45;color:#e7e9ea;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.post-image,.post-video,.detail-image,.detail-video{width:100%;border-radius:16px;margin-bottom:12px;display:block;max-height:80vh;object-fit:cover;border:0.5px solid rgba(255,255,255,0.1);background:#000}

.post-actions{display:flex;align-items:center;justify-content:space-between;gap:4px;padding-top:4px}
.act-btn{background:none;border:none;display:flex;align-items:center;gap:6px;color:#71767b;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 6px;transition:transform .15s ease,color .2s ease;flex:1;justify-content:center;border-radius:12px}
.act-btn:active{transform:scale(.88);background:rgba(255,255,255,.05)}
.act-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.act-count{font-variant-numeric:tabular-nums;font-size:13px;min-width:14px;text-align:left}
.act-btn.liked{color:#ff2d55}
.act-btn.liked svg{fill:#ff2d55;stroke:#ff2d55;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes likePop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act-btn.saved{color:#fff}
.act-btn.saved svg{fill:#fff;stroke:#fff;animation:likePop .35s cubic-bezier(.34,1.56,.64,1)}



/* Izohlar va Post Detail */
.comment-thread{display:flex;flex-direction:column;animation:postIn .3s ease both;position:relative}
.comment-row{display:flex;gap:10px;cursor:pointer;padding:4px 0;align-items:stretch}
.comment-avatar-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:42px;position:relative}
.comment-avatar,.comment-avatar-initial{width:42px;height:42px;border-radius:50%;flex-shrink:0;cursor:pointer;position:relative;z-index:2;background:#000;border:2px solid #000}
.comment-avatar{object-fit:cover}
.comment-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;text-transform:uppercase}
.thread-line-down{width:2px;background:#333639;flex:1;margin-top:-2px;min-height:20px;align-self:center;z-index:1}
.comment-content{flex:1;min-width:0;padding-bottom:10px;padding-top:2px}
.comment-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.comment-user{font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.comment-time{font-size:12px;color:#71767b}
.comment-text{font-size:14px;line-height:1.45;color:#e7e9ea;word-break:break-word;white-space:pre-wrap;margin-bottom:6px}
.comment-actions{display:flex;gap:2px;align-items:center;justify-content:space-between;padding-top:2px;width:100%}
.comment-act{background:none;border:none;color:#71767b;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;padding:10px 6px;display:flex;align-items:center;gap:5px;flex:1;justify-content:center;border-radius:10px}
.comment-act svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.comment-act.liked{color:#ff2d55}
.comment-act.liked svg{fill:#ff2d55;stroke:#ff2d55}
.comment-act.saved{color:#fff}
.comment-act.saved svg{fill:#fff;stroke:#fff}
.comment-replies{display:flex;flex-direction:column;position:relative;padding-bottom:4px}

.reply-mode-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:#fff;font-weight:600;max-width:480px;width:100%;margin:0 auto}
.reply-mode-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-mode-bar button{border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.1)}

.detail-input-bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-shrink:0;background:#000;max-width:480px;width:100%;margin:0 auto}
.detail-island{display:flex;gap:10px;align-items:flex-end;background:#1c1c1e;border-radius:26px;padding:6px 6px 6px 16px;border:1px solid #2c2c2e}
.detail-island.reply-mode{border-color:#fff}
.detail-input{flex:1;background:transparent;border:none;color:#fff;font-size:15px;font-family:inherit;resize:none;outline:none;max-height:90px;line-height:1.4;padding:8px 0}
.detail-input::placeholder{color:#5a5a5e}
.detail-send{background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:50%;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.detail-send:disabled{opacity:.4;cursor:not-allowed}
.detail-send svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.detail-overlay,.comment-detail-overlay,.follows-overlay{position:fixed;inset:0;background:#000;z-index:500;display:none;flex-direction:column;animation:detailIn .3s cubic-bezier(.34,1.2,.64,1) both}
.detail-overlay.show,.comment-detail-overlay.show,.follows-overlay.show{display:flex}
@keyframes detailIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
.detail-header,.comment-detail-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:var(--tg-header-pad-top) 84px 12px;
    min-height:var(--tg-header-h);
    border-bottom:1px solid rgba(255,255,255,0.08);
    flex-shrink:0;
    background:rgba(0,0,0,0.92);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    max-width:480px;
    width:100%;
    margin:0 auto;
    position:sticky;
    top:0;
    z-index:10;
}
.detail-title,.comment-detail-title{font-size:17px;font-weight:700;text-align:center}
.detail-scroll,.comment-detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px;max-width:480px;width:100%;margin:0 auto}
.detail-post{padding:16px;border-bottom:8px solid #0a0a0a}
.detail-avatar,.detail-avatar-initial{width:46px;height:46px;border-radius:50%;flex-shrink:0}
.detail-avatar{object-fit:cover;background:#1c1c1e}
.detail-avatar-initial{background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;text-transform:uppercase}
.detail-user{font-size:16px;font-weight:600;display:inline-flex;align-items:center}
.detail-time{font-size:13px;color:#71767b}
.detail-text{font-size:16px;line-height:1.5;color:#e7e9ea;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.detail-comments-title{padding:20px 16px 12px;font-size:14px;font-weight:600;color:#fff}
.detail-comments-list,.comment-detail-replies{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.comment-detail-main{padding:16px;border-bottom:1px solid rgba(255,255,255,0.06)}

/* Telegram ichida ochish ogohlantirishi */
.tg-id-gate{position:fixed;inset:0;background:#000000;z-index:900;display:none;align-items:center;justify-content:center;padding:24px}
.tg-id-gate.show{display:flex}
.tg-id-card{width:100%;max-width:380px;background:#141415;border:1px solid #2c2c2e;border-radius:28px;padding:28px 22px;text-align:center}

.tg-id-desc{font-size:14px;color:#8e8e93;line-height:1.45;margin-bottom:20px}
.tg-id-btn{width:100%;height:48px;background:#ffffff;color:#000000;border:none;border-radius:9999px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.tg-id-btn:active{transform:scale(.98)}

/* Obunachilar / Obunalar ro'yxati */
.follow-user-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
.follow-user-row:active{background:rgba(255,255,255,0.04)}
.follow-user-info{flex:1;min-width:0;text-align:left}
.follow-user-name{font-size:15px;font-weight:600;color:#fff;display:flex;align-items:center;gap:4px}
.follow-user-handle{font-size:13px;color:#71767b;margin-top:2px}

.nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
.nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.1);max-width:80%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* "ISLAND" PASTKI NAVIGATSIYA */
.bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
.bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s;position:relative}
.nav-btn:active{transform:scale(.92)}

/* ================= XAVFSIZLIK VA YORDAMCHI FUNKSIYALAR ================= */
function escapeHtml(str) {
    return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function safeUrl(url) {
    if (!url || typeof url !== 'string') return '';
    const trimmed = url.trim();
    if (/^(https?:\/\/|data:image\/|blob:)/i.test(trimmed)) return trimmed;
    return '';
}

let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function formatExactTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diffSec < 60) return 'Hozirgina';
    if (diffSec < 3600) return `${Math.floor(diffSec / 60)} daq`;
    if (diffSec < 86400) return `${Math.floor(diffSec / 3600)} soat`;
    const months = ['yan', 'fev', 'mar', 'apr', 'may', 'iyn', 'iyl', 'avg', 'sen', 'okt', 'noy', 'dek'];
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${d.getDate()} ${months[d.getMonth()]}, ${hh}:${mm}`;
}

function avatarMarkup(u, cls) {
    const name = getFullName(u) || 'U';
    const photo = safeUrl(u?.photo_url);
    const init = (name.trim().charAt(0) || 'U').toUpperCase();
    if (photo) {
        return `<img class="${cls}" src="${escapeHtml(photo)}" alt="" loading="lazy" onerror="this.style.display='none';if(this.nextElementSibling)this.nextElementSibling.style.display='flex'"><div class="${cls}-initial" style="display:none">${escapeHtml(init)}</div>`;
    }
    return `<div class="${cls}-initial">${escapeHtml(init)}</div>`;
}

function compressImage(file, maxDim = 1280, quality = 0.82) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = (ev) => {
            const img = new Image();
            img.onerror = reject;
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    } else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                canvas.toBlob((blob) => {
                    if (blob) resolve({ blob, dataUrl });
                    else reject(new Error('Blob xatosi'));
                }, 'image/jpeg', quality);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });
}

function buildCommentTree(flatList) {
    const map = new Map();
    const roots = [];
    flatList.forEach(item => {
        map.set(String(item.comment_id), { ...item, replies: [] });
    });
    map.forEach(node => {
        const pid = node.parent_id ? String(node.parent_id) : null;
        if (pid && map.has(pid)) {
            map.get(pid).replies.push(node);
        } else {
            roots.push(node);
        }
    });
    return roots;
}

function findCommentNode(nodes, targetId) {
    const tid = String(targetId);
    for (const node of nodes) {
        if (String(node.comment_id) === tid) return node;
        if (node.replies && node.replies.length > 0) {
            const found = findCommentNode(node.replies, tid);
            if (found) return found;
        }
    }
    return null;
}

/* ================= 5-DAQIQALIK SESSIONSTORAGE + RAM USER CACHE ================= */
const UserCache = {
    _map: new Map(),
    _pending: new Map(),
    _TTL: 5 * 60 * 1000,

    _readSession(uid) {
        try {
            const raw = sessionStorage.getItem(`luz_uc_${uid}`);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (Date.now() - parsed.ts > this._TTL) {
                sessionStorage.removeItem(`luz_uc_${uid}`);
                return null;
            }
            return parsed.data;
        } catch { return null; }
    },

    _writeSession(uid, data) {
        try {
            sessionStorage.setItem(`luz_uc_${uid}`, JSON.stringify({ ts: Date.now(), data }));
        } catch {}
    },

    get(uid) {
        const idStr = String(uid || '');
        if (!idStr) return null;
        if (this._map.has(idStr)) return this._map.get(idStr);
        const cached = this._readSession(idStr);
        if (cached) { this._map.set(idStr, cached); return cached; }
        return null;
    },

    set(uid, data) {
        if (!uid || !data) return;
        const idStr = String(uid);
        this._map.set(idStr, data);
        this._writeSession(idStr, data);
    },

    _normalize(uid, raw) {
        const display = raw.display_name || [raw.firstName, raw.lastName].filter(Boolean).join(' ').trim() || (raw.username ? '@' + raw.username : 'ID ' + uid);
        return {
            ...raw,
            user_id: String(raw.user_id || raw.userId || uid),
            display_name: display,
            username: raw.username || '',
            photo_url: raw.photo_url || null,
            bio: raw.bio || '',
            banner_url: raw.banner_url || null,
            verified: Boolean(raw.verified || raw.isVerified)
        };
    },

    async fetchOne(uid) {
        const idStr = String(uid || '');
        if (!idStr) return null;
        const existing = this.get(idStr);
        if (existing) return existing;
        if (this._pending.has(idStr)) return this._pending.get(idStr);

        const p = (async () => {
            try {
                let s = await getDoc(doc(db, USERS_COL, idStr));
                if (!s.exists()) {
                    s = await getDoc(doc(db, LEGACY_USERS_COL, idStr));
                }
                if (s.exists()) {
                    const norm = this._normalize(idStr, s.data());
                    this.set(idStr, norm);
                    return norm;
                }
                return null;
            } catch {
                return null;
            } finally {
                this._pending.delete(idStr);
            }
        })();

        this._pending.set(idStr, p);
        return p;
    },

    async prefetch(uids) {
        const unique = [...new Set(uids.map(String).filter(id => id && !this.get(id)))];
        if (unique.length) await Promise.all(unique.map(id => this.fetchOne(id)));
    }
};

async function authenticateWithBackend(initData, tU) {
    const user_id = String(tU.id);
    const nowIso = new Date().toISOString();
    const tgDisplay = [tU.first_name, tU.last_name].filter(Boolean).join(' ').trim() || 'Foydalanuvchi';

    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        const resp = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData }),
            signal: controller.signal
        });
        clearTimeout(timer);

        if (resp.ok) {
            const data = await resp.json();
            if (data?.token) {
                await signInWithCustomToken(auth, data.token);
            }
        } else if (resp.status === 401 || resp.status === 403) {
            return null;
        }
    } catch {
        // /api/auth vaqtincha mavjud bo'lmasa ham mavjud Firestore oqimi ishlashda davom etadi
    }

    try {
        const ref = doc(db, USERS_COL, user_id);
        let snap = await getDoc(ref);
        let legacyData = null;

        if (!snap.exists()) {
            const legacySnap = await getDoc(doc(db, LEGACY_USERS_COL, user_id)).catch(() => null);
            if (legacySnap && legacySnap.exists()) legacyData = legacySnap.data();
        }

        const existing = snap.exists() ? snap.data() : legacyData;

        const merged = {
            ...(existing || {}),
            user_id,
            username: (existing?.isEdited && existing?.username !== undefined) ? existing.username : (tU.username || existing?.username || ''),
            display_name: (existing?.isEdited && existing?.display_name)
                ? existing.display_name
                : (existing?.display_name || [existing?.firstName, existing?.lastName].filter(Boolean).join(' ').trim() || tgDisplay),
            created_at: existing?.created_at || nowIso,
            photo_url: (existing?.isEdited && existing?.photo_url) ? existing.photo_url : (tU.photo_url || existing?.photo_url || null),
            bio: existing?.bio || '',
            banner_url: existing?.banner_url || null,
            verified: Boolean(existing?.verified || existing?.isVerified),
            lastActiveAt: nowIso
        };

        await setDoc(ref, merged, { merge: true });
        UserCache.set(user_id, merged);
        return merged;
    } catch {
        const fallback = {
            user_id,
            username: tU.username || '',
            display_name: tgDisplay,
            created_at: nowIso,
            photo_url: tU.photo_url || null
        };
        UserCache.set(user_id, fallback);
        return fallback;
    }
}

/* ================= ACTIVE SCREEN TIME TRACKER ================= */
function getPeriodKeys(date = new Date()) {
    const yyyy = date.getFullYear(), mm = String(date.getMonth() + 1).padStart(2, '0'), dd = String(date.getDate()).padStart(2, '0');
    const tmp = new Date(Date.UTC(yyyy, date.getMonth(), date.getDate()));
    const dayNum = tmp.getUTCDay() || 7;
    tmp.setUTCDate(tmp.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(tmp.getUTCFullYear(), 0, 1));
    const weekNo = Math.ceil((((tmp - yearStart) / 86400000) + 1) / 7);
    return {
        dailyKey: `daily_${yyyy}-${mm}-${dd}`,
        weeklyKey: `weekly_${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`,
        monthlyKey: `monthly_${yyyy}-${mm}`
    };
}

let activeSessionStart = null, accumulatedSeconds = 0, flushTimer = null;
function isAppForeground() { return document.visibilityState === 'visible' && document.hasFocus(); }
function resumeTimeCounting() { if (currentUser && activeSessionStart === null && isAppForeground()) activeSessionStart = Date.now(); }
function pauseAndCollectSeconds() {
    if (activeSessionStart !== null) {
        const elapsed = Math.floor((Date.now() - activeSessionStart) / 1000);
        if (elapsed > 0) accumulatedSeconds += elapsed;
        activeSessionStart = null;
    }
}
async function flushUsageTimeToServer() {
    pauseAndCollectSeconds();
    if (!currentUser || accumulatedSeconds <= 0) { resumeTimeCounting(); return; }
    const secondsToSend = accumulatedSeconds;
    accumulatedSeconds = 0;
    const { dailyKey, weeklyKey, monthlyKey } = getPeriodKeys();
    try {
        await setDoc(doc(db, USERS_COL, String(currentUser.user_id)), {
            [`usageStats.${dailyKey}`]: increment(secondsToSend),
            [`usageStats.${weeklyKey}`]: increment(secondsToSend),
            [`usageStats.${monthlyKey}`]: increment(secondsToSend),
            totalActiveSeconds: increment(secondsToSend),
            lastActiveAt: new Date().toISOString()
        }, { merge: true });
    } catch { accumulatedSeconds += secondsToSend; }
    resumeTimeCounting();
}
function startActiveTimeTracker() {
    if (!currentUser) return;
    resumeTimeCounting();
    document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' ? resumeTimeCounting() : flushUsageTimeToServer());
    window.addEventListener('focus', resumeTimeCounting);
    window.addEventListener('blur', flushUsageTimeToServer);
    window.addEventListener('pagehide', flushUsageTimeToServer);
    clearInterval(flushTimer);
    flushTimer = setInterval(() => { if (isAppForeground()) flushUsageTimeToServer(); }, 25000);
}

            this._savedIds.clear();
            savesSnap.forEach(d => this._savedIds.add(String(d.data().post_id)));
        } catch {}
    },

    hasLiked(target_id) { return this._likedIds.has(String(target_id)); },

/* ================= PASSIVE SCROLL ANIMATION ================= */
(function initScrollEffects(){
    const avatar = document.getElementById('avatarContainer');
    const bannerImg = document.getElementById('bannerImg');
    const bannerDefault = document.getElementById('bannerDefault');
    const stickyTitle = document.getElementById('stickyTitle');
    const topControls = document.getElementById('topControls');
    let currentProgress = 0;
    let rafId = null;
    const maxScroll = 140;

    function tick() {
        const scrollY = window.scrollY || window.pageYOffset;
        const targetProgress = Math.min(Math.max(scrollY / maxScroll, 0), 1);
        const diff = targetProgress - currentProgress;

        if (Math.abs(diff) < 0.002) {
            currentProgress = targetProgress;
            rafId = null;
        } else {
            currentProgress += diff * 0.2;
            rafId = requestAnimationFrame(tick);
        }

        const scale = 1 - (currentProgress * 0.45);
        avatar.style.transform = `scale(${scale})`;

        const blurAmount = currentProgress * 6;
        const bannerScale = 1 + (currentProgress * 0.08);
        const activeBannerEl = (bannerImg.style.display === 'block') ? bannerImg : bannerDefault;

        if (activeBannerEl) {
            activeBannerEl.style.filter = `blur(${blurAmount}px) brightness(${1 - currentProgress * 0.35})`;
            activeBannerEl.style.transform = `scale(${bannerScale})`;
        }

        if (currentProgress > 0.72) {
            stickyTitle.classList.add('visible');
            topControls.classList.add('scrolled');
        } else {
            stickyTitle.classList.remove('visible');
            topControls.classList.remove('scrolled');
        }
    }

    window.addEventListener('scroll', () => {
        if (!rafId) rafId = requestAnimationFrame(tick);
    }, { passive: true });
})();

/* ================= VIDEO AUTO-PAUSE MANAGER ================= */
function bindVideoAutoPause(videoEl) {
    if (!videoEl) return;
    videoEl.addEventListener('play', () => {
        document.querySelectorAll('video').forEach(v => {
            if (v !== videoEl && !v.paused) v.pause();
        });
    });
    const vio = new IntersectionObserver(entries => {
        entries.forEach(en => {
            if (!en.isIntersecting && !videoEl.paused) videoEl.pause();
        });
    }, { threshold: 0.25 });
    vio.observe(videoEl);
}

/* ================= CHUNKED BATCH DELETE ================= */
async function deleteQueryInChunks(q) {
    const snap = await getDocs(q);
    if (snap.empty) return;
    const docs = snap.docs;
    for (let i = 0; i < docs.length; i += 400) {
        const batch = writeBatch(db);
        docs.slice(i, i + 400).forEach(d => batch.delete(d.ref));
        await batch.commit();
    }
}

/* ================= `posts/` & `comments/` STORE ================= */
const PostStore = {
    _allUserPosts: [],
    _visibleCount: PAGE_SIZE,
    _savedPostsList: [],
    _userCommentsList: [],
    _byId: new Map(),

    get(post_id) {
        return this._byId.get(String(post_id)) || null;
    },

    _normalizePost(id, raw, isLegacy = false) {
        const pid = String(raw.post_id || id);
        return {
            ...raw,
            post_id: pid,
            author_id: String(raw.author_id || raw.userId || ''),
            text: raw.text || '',
            created_at: raw.created_at || raw.createdAt || new Date().toISOString(),
            image: raw.image || null,
            type: raw.type || 'text',
            likes_count: Number(raw.likes_count ?? raw.likes ?? 0),
            views_count: Number(raw.views_count ?? raw.views ?? 0),
            comments_count: typeof raw.comments_count === 'number'
                ? raw.comments_count
                : (Array.isArray(raw.comments) ? raw.comments.length : 0),
            _isLegacy: isLegacy
        };
    },

    _registerPosts(list) {
        list.forEach(p => this._byId.set(String(p.post_id), p));
    },

    _sortDesc(list) {
        return list.slice().sort((a, b) => {
            const ta = new Date(a.created_at || 0).getTime() || 0;
            const tb = new Date(b.created_at || 0).getTime() || 0;
            return tb - ta;
        });
    },

    getVisibleUserPosts() {
        return this._allUserPosts.slice(0, this._visibleCount);
    },

    hasMoreUserPosts() {
        return this._visibleCount < this._allUserPosts.length;
    },

    loadNextPage() {
        this._visibleCount += PAGE_SIZE;
    },

    async loadUserPostsInitial(targetId) {
        const tId = String(targetId);
        this._visibleCount = PAGE_SIZE;
        showTabLoader(true);

        try {
            const [newSnap, legacySnap] = await Promise.all([
                getDocs(query(collection(db, POSTS_COL), where("author_id", "==", tId))),
                getDocs(query(collection(db, LEGACY_POSTS_COL), where("userId", "==", tId))).catch(() => ({ forEach: () => {} }))
            ]);

            const map = new Map();
            newSnap.forEach(d => {
                const p = this._normalizePost(d.id, d.data(), false);
                map.set(p.post_id, p);
            });
            legacySnap.forEach(d => {
                const p = this._normalizePost(d.id, d.data(), true);
                if (!map.has(p.post_id)) map.set(p.post_id, p);
            });

            this._allUserPosts = this._sortDesc([...map.values()]);
            this._registerPosts(this._allUserPosts);
            document.getElementById('postsCount').textContent = this._allUserPosts.length;
            await UserCache.prefetch([tId]);
        } catch (e) {
            console.error("Postlarni yuklash xatosi:", e);
            this._allUserPosts = [];
            document.getElementById('postsCount').textContent = '0';
        }
    },

    async loadSavedPostsFromServer() {
        const ids = [...PostMetrics._savedIds];
        if (ids.length === 0) {
            this._savedPostsList = [];
            return;
        }
        showTabLoader(true);
        try {
            const fetched = [];
            const authorIds = [];
            await Promise.all(ids.map(async pid => {
                let s = await getDoc(doc(db, POSTS_COL, String(pid))).catch(() => null);
                let isLegacy = false;
                if (!s || !s.exists()) {
                    s = await getDoc(doc(db, LEGACY_POSTS_COL, String(pid))).catch(() => null);
                    isLegacy = true;
                }
                if (s && s.exists()) {
                    const data = this._normalizePost(s.id, s.data(), isLegacy);
                    fetched.push(data);
                    if (data.author_id) authorIds.push(data.author_id);
                }
            }));
            await UserCache.prefetch(authorIds);
            this._savedPostsList = this._sortDesc(fetched);
            this._registerPosts(this._savedPostsList);
        } catch {
            this._savedPostsList = [];
        }
    },

    async loadUserComments(targetId) {
        const tId = String(targetId);
        showTabLoader(true);
        try {
            const snap = await getDocs(query(collection(db, COMMENTS_COL), where("user_id", "==", tId)));
            const arr = [];
            snap.forEach(d => arr.push({ comment_id: d.id, ...d.data() }));
            this._userCommentsList = this._sortDesc(arr);
            await UserCache.prefetch([tId]);
        } catch {
            this._userCommentsList = [];
        }
    },

    async add({ author_id, text, image, type }) {
        try {
            const post_id = 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            const post = {
                post_id,
                author_id: String(author_id),
                text: text || '',
                created_at: new Date().toISOString(),
                image: image || null,
                type: type || 'text',
                likes_count: 0,
                views_count: 0,
                comments_count: 0
            };
            if (JSON.stringify(post).length > 950000) {
                showToast("Fayl hajmi juda katta! Kichikroq rasm tanlang.");
                return null;
            }
            await setDoc(doc(db, POSTS_COL, post_id), post);
            const normalized = this._normalizePost(post_id, post, false);
            this._allUserPosts.unshift(normalized);
            this._registerPosts([normalized]);
            document.getElementById('postsCount').textContent = this._allUserPosts.length;
            return normalized;
        } catch {
            showToast('Saqlashda xatolik');
            return null;
        }
    },

    async remove(post_id) {
        const pid = String(post_id);
        const existing = this._byId.get(pid);
        this._allUserPosts = this._allUserPosts.filter(p => String(p.post_id) !== pid);
        this._savedPostsList = this._savedPostsList.filter(p => String(p.post_id) !== pid);
        this._byId.delete(pid);
        document.getElementById('postsCount').textContent = this._allUserPosts.length;

        try {
            const colName = existing?._isLegacy ? LEGACY_POSTS_COL : POSTS_COL;
            await deleteDoc(doc(db, colName, pid));
            await Promise.all([
                deleteQueryInChunks(query(collection(db, LIKES_COL), where("post_id", "==", pid))),
                deleteQueryInChunks(query(collection(db, VIEWS_COL), where("post_id", "==", pid))),
                deleteQueryInChunks(query(collection(db, COMMENTS_COL), where("post_id", "==", pid))),
                deleteQueryInChunks(query(collection(db, SAVES_COL), where("post_id", "==", pid)))
            ]);
            return true;
        } catch {
            showToast("O'chirishda xatolik");
            return false;
        }
    }
};

    const postInit = (authorName || 'U').trim().charAt(0).toUpperCase();
    const av = authorAvatar ? `<img class="post-avatar" src="${escapeHtml(authorAvatar)}" alt="" loading="lazy">` : `<div class="post-avatar-initial">${escapeHtml(postInit)}</div>`;

    const validMediaUrl = safeUrl(p.image);
    let media = '';
    if (p.type === 'image' && validMediaUrl) media = `<img class="post-image" src="${escapeHtml(validMediaUrl)}" alt="" loading="lazy">`;
    else if (p.type === 'video' && validMediaUrl) media = `<video class="post-video" src="${escapeHtml(validMediaUrl)}" controls playsinline preload="metadata"></video>`;

    const canDelete = currentUser && String(p.author_id) === String(currentUser.user_id);

    item.innerHTML = `
        <div style="flex-shrink:0;">${av}</div>
        <div style="flex:1;min-width:0;">
            <div class="post-head-row">
                <div class="post-head-info">
                    <div class="post-user">${escapeHtml(authorName)}${getInlineVerifiedBadge(p.author_id)}</div>
                    <div class="post-time">${escapeHtml(formatExactTime(p.created_at))}</div>
                </div>
                ${canDelete ? `<button class="post-del-btn" title="O'chirish" aria-label="Postni o'chirish">${ICONS.trash}</button>` : ''}
            </div>
            ${p.text ? `<div class="post-text">${escapeHtml(p.text)}</div>` : ''}
            ${media}
            <div class="post-actions-slot"></div>
        </div>
    `;
    item.querySelector('.post-actions-slot').appendChild(buildPostActions(p));

    const vidEl = item.querySelector('video');
    if (vidEl) bindVideoAutoPause(vidEl);

    if (canDelete) {
        item.querySelector('.post-del-btn')?.addEventListener('click', async (e) => {
            e.stopPropagation();
            item.remove();
            await PostStore.remove(pid);
            if (!document.querySelector('#feed .post-item')) switchTab(currentTab);
            showToast("Post o'chirildi");
        });
    }

    item.addEventListener('click', (e) => {
        if (e.target.closest('.act-btn') || e.target.closest('.post-del-btn') || e.target.tagName === 'VIDEO') return;
        openPostDetail(p);
    });

    const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
            if (en.isIntersecting) {
                io.disconnect();
                PostMetrics.recordView(p);
            }
        });
    }, { threshold: 0.5 });
    io.observe(item);

    return item;
}

function renderList(list, key, withLoadMore = false){
    const area = document.getElementById('contentArea');
    if (list.length === 0) {
        area.innerHTML = `<div class="empty-state"><div class="empty-icon">${emptyIcons[key]}</div><p>${texts[key]}</p></div>`;
        return;
    }
    area.innerHTML = '<div class="feed" id="feed"></div>';
    const feed = document.getElementById('feed');
    list.forEach(p => feed.appendChild(buildPostItem(p)));

    if (withLoadMore && PostStore.hasMoreUserPosts()) {
        const moreBtn = document.createElement('button');
        moreBtn.className = 'load-more-btn';
        moreBtn.textContent = 'Yana yuklash';
        moreBtn.addEventListener('click', () => {
            const prevCount = PostStore.getVisibleUserPosts().length;
            PostStore.loadNextPage();
            const nextSlice = PostStore.getVisibleUserPosts().slice(prevCount);
            nextSlice.forEach(p => feed.insertBefore(buildPostItem(p), moreBtn));
            if (!PostStore.hasMoreUserPosts()) moreBtn.remove();
        });
        feed.appendChild(moreBtn);
    }
}
function renderPosts(){ renderList(PostStore.getVisibleUserPosts(), 'posts', true); }
function renderVideos(){ renderList(PostStore._allUserPosts.filter(p => p.type === 'video'), 'video', false); }
function renderSaved(){ renderList(PostStore._savedPostsList, 'saved', false); }
function renderReplies(){
    const area = document.getElementById('contentArea');
    const list = PostStore._userCommentsList;
    if (list.length === 0) {
        area.innerHTML = `<div class="empty-state"><div class="empty-icon">${emptyIcons.answers}</div><p>${texts.answers}</p></div>`;
        return;
    }
    area.innerHTML = '<div class="feed" id="feed"></div>';
    const feed = document.getElementById('feed');
    list.forEach(r => {
        const item = document.createElement('div'); item.className = 'post-item';
        item.style.display = 'flex'; item.style.gap = '10px'; item.style.alignItems = 'flex-start';
        const author = UserCache.get(String(r.user_id));
        const rName = author ? getFullName(author) : 'Foydalanuvchi';
        const rAvatar = safeUrl(author ? author.photo_url : null);
        const init = (rName || 'U').trim().charAt(0).toUpperCase();
        const av = rAvatar ? `<img class="post-avatar" src="${escapeHtml(rAvatar)}">` : `<div class="post-avatar-initial">${escapeHtml(init)}</div>`;
        item.innerHTML = `
            <div style="flex-shrink:0;">${av}</div>
            <div style="flex:1;min-width:0;">
                <div class="post-head-info">
                    <div class="post-user">${escapeHtml(rName)}${getInlineVerifiedBadge(r.user_id)}</div>
                    <div class="post-time">${escapeHtml(formatExactTime(r.created_at))}</div>
                </div>
                <div class="post-text">${escapeHtml(r.text)}</div>
            </div>`;
        item.addEventListener('click', async () => {
            let p = PostStore.get(r.post_id);
            if (!p && r.post_id) {
                let s = await getDoc(doc(db, POSTS_COL, String(r.post_id))).catch(() => null);
                let isLegacy = false;
                if (!s || !s.exists()) {
                    s = await getDoc(doc(db, LEGACY_POSTS_COL, String(r.post_id))).catch(() => null);
                    isLegacy = true;
                }
                if (s && s.exists()) {
                    p = PostStore._normalizePost(s.id, s.data(), isLegacy);
                    PostStore._registerPosts([p]);
                }
            }
            if (p) openPostDetail(p);
        });
        feed.appendChild(item);
    });
}

let currentTab = 'posts';
async function switchTab(k){
    currentTab = k;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.tab === k));
    if (k === 'posts') renderPosts();
    else if (k === 'video') renderVideos();
    else if (k === 'answers') {
        await PostStore.loadUserComments(profileOwner?.user_id || currentUser.user_id);
        renderReplies();
    } else if (k === 'saved') {
        await PostStore.loadSavedPostsFromServer();
        renderSaved();
    }
}
document.getElementById('tabsContainer').addEventListener('click', e => {
    const tab = e.target.closest('.tab-item');
    if (tab) switchTab(tab.dataset.tab);
});


/* ================= COMMENTS & POST DETAIL ================= */
const detailOverlay = document.getElementById('detailOverlay'), detailInput = document.getElementById('detailInput'), detailSend = document.getElementById('detailSend');
let detailPost = null, replyTargetId = null;

function updateDetailReplyModeUI(){
    const bar = document.getElementById('replyModeBar'), island = document.getElementById('detailIsland');
    if (!replyTargetId || !detailPost) { bar.style.display = 'none'; island.classList.remove('reply-mode'); return; }
    const targetC = PostMetrics._activeDetailComments.find(c => String(c.comment_id) === String(replyTargetId));
    if (targetC) {
        const u = UserCache.get(String(targetC.user_id));
        document.getElementById('replyModeText').textContent = `↩ ${getFullName(u)} ga javob`;
        bar.style.display = 'flex';
        island.classList.add('reply-mode');
    } else {
        bar.style.display = 'none';
        island.classList.remove('reply-mode');
    }
}
document.getElementById('replyModeCancel').addEventListener('click', (e) => {
    e.stopPropagation();
    replyTargetId = null;
    detailInput.value = '';
    detailInput.style.height = 'auto';
    detailSend.disabled = true;
    updateDetailReplyModeUI();
});

function buildDetailComment(c, depth = 0, inCommentDetail = false){
    const cid = String(c.comment_id);
    const thread = document.createElement('div'); thread.className = 'comment-thread' + (depth > 0 ? ' thread-nested' : ''); thread.dataset.cid = cid;
    const cAuthor = UserCache.get(String(c.user_id));
    const cName = cAuthor ? getFullName(cAuthor) : 'Foydalanuvchi';
    const cAvatar = safeUrl(cAuthor ? cAuthor.photo_url : null);
    const init = (cName || 'U').trim().charAt(0).toUpperCase();
    const av = cAvatar ? `<img class="comment-avatar" src="${escapeHtml(cAvatar)}">` : `<div class="comment-avatar-initial">${escapeHtml(init)}</div>`;
    const hasReplies = !inCommentDetail && c.replies && c.replies.length > 0;

    const row = document.createElement('div'); row.className = 'comment-row';
    row.innerHTML = `
        <div class="comment-avatar-col">
            ${av}
            ${hasReplies ? '<div class="thread-line-down"></div>' : ''}
        </div>
        <div class="comment-content">
            <div class="comment-head"><span class="comment-user">${escapeHtml(cName)}${getInlineVerifiedBadge(c.user_id)}</span><span class="comment-time">${escapeHtml(formatExactTime(c.created_at))}</span></div>
            <div class="comment-text">${escapeHtml(c.text || '')}</div>
        </div>
    `;
    const actions = document.createElement('div'); actions.className = 'comment-actions';
    let localLikes = Number(c.likes_count || 0);
    const likeBtn = document.createElement('button');
    likeBtn.className = 'comment-act' + (PostMetrics.hasLiked(cid) ? ' liked' : '');
    likeBtn.innerHTML = `${ICONS.like}<span>${localLikes}</span>`;
    likeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const liked = await PostMetrics.toggleCommentLike(cid);
        localLikes = Math.max(0, localLikes + (liked ? 1 : -1));
        c.likes_count = localLikes;
        likeBtn.classList.toggle('liked', liked);
        likeBtn.querySelector('span').textContent = localLikes;
    });

    const commBtn = document.createElement('button'); commBtn.className = 'comment-act'; commBtn.innerHTML = `${ICONS.comment}<span>${(c.replies||[]).length||''}</span>`;
    commBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (inCommentDetail) {
            cdReplyTargetId = cid;
            cdInput.focus();
            updateCdReplyModeUI();
        } else {
            replyTargetId = cid;
            detailInput.focus();
            updateDetailReplyModeUI();
        }
    });

    const viewBtn = document.createElement('button'); viewBtn.className = 'comment-act'; viewBtn.innerHTML = `${ICONS.view}`; viewBtn.style.cursor = 'default';
    viewBtn.addEventListener('click', (e) => e.stopPropagation());

    const saveBtn = document.createElement('button');
    saveBtn.className = 'comment-act' + (PostMetrics.isSaved(cid) ? ' saved' : '');
    saveBtn.innerHTML = `${ICONS.bookmark}`;
    saveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const savedNow = await PostMetrics.toggleSave(cid);
        saveBtn.classList.toggle('saved', savedNow);
        showToast(savedNow ? 'Saqlandi' : 'Olib tashlandi');
    });

    const shareBtn = document.createElement('button'); shareBtn.className = 'comment-act'; shareBtn.innerHTML = `${ICONS.share}`;
    shareBtn.addEventListener('click', (e) => { e.stopPropagation(); handleShare(detailPost?.post_id || cid); });

    actions.append(likeBtn, commBtn, viewBtn, saveBtn, shareBtn);
    row.querySelector('.comment-content').appendChild(actions);
    row.addEventListener('click', (e) => {
        if (!e.target.closest('.comment-act') && (!inCommentDetail || cid !== activeCommentId)) {
            openCommentDetail(cid);
        }
    });
    thread.appendChild(row);

    if (hasReplies) {
        const repBox = document.createElement('div'); repBox.className = 'comment-replies';
        c.replies.forEach(r => repBox.appendChild(buildDetailComment(r, depth + 1, false)));
        thread.appendChild(repBox);
    }
    return thread;
}

function renderDetailCommentsOnly() {
    const flatComments = PostMetrics._activeDetailComments;
    const tree = buildCommentTree(flatComments);
    const clist = document.getElementById('detailCommentsList');
    clist.innerHTML = '';
    document.getElementById('detailCommTitle').textContent = flatComments.length ? `Izohlar (${flatComments.length})` : 'Izohlar';
    tree.forEach(c => clist.appendChild(buildDetailComment(c, 0, false)));
}

function renderDetailPost(){
    if (!detailPost) return; const p = detailPost;
    const author = UserCache.get(String(p.author_id));
    const pName = author ? getFullName(author) : 'Foydalanuvchi';
    const pAvatar = safeUrl(author ? author.photo_url : null);
    const postInit = (pName || 'U').trim().charAt(0).toUpperCase();
    const av = pAvatar ? `<img class="detail-avatar" src="${escapeHtml(pAvatar)}">` : `<div class="detail-avatar-initial">${escapeHtml(postInit)}</div>`;
    const validMediaUrl = safeUrl(p.image);
    let media = '';
    if (p.type === 'image' && validMediaUrl) media = `<img class="detail-image" src="${escapeHtml(validMediaUrl)}">`;
    else if (p.type === 'video' && validMediaUrl) media = `<video class="detail-video" src="${escapeHtml(validMediaUrl)}" controls playsinline></video>`;

    document.getElementById('detailPostBox').innerHTML = `
        <div class="detail-post" style="display:flex;gap:10px;align-items:flex-start;">
            <div style="flex-shrink:0;">${av}</div>
            <div style="flex:1;min-width:0;">
                <div style="display:flex;flex-direction:row;align-items:baseline;gap:6px;margin-bottom:6px;">
                    <div class="detail-user">${escapeHtml(pName)}${getInlineVerifiedBadge(p.author_id)}</div>
                    <div class="detail-time">${escapeHtml(formatExactTime(p.created_at))}</div>
                </div>
                ${p.text ? `<div class="detail-text">${escapeHtml(p.text)}</div>` : ''}
                ${media}
                <div id="detailActionsBar"></div>
            </div>
        </div>
    `;
    document.getElementById('detailActionsBar').appendChild(buildPostActions(p));
    const vidEl = document.querySelector('#detailPostBox video');
    if (vidEl) bindVideoAutoPause(vidEl);
}

async function openPostDetail(p){
    detailPost = PostStore.get(p.post_id) || p;
    replyTargetId = null;
    await UserCache.prefetch([detailPost.author_id]);
    renderDetailPost();
    renderDetailCommentsOnly();
    updateDetailReplyModeUI();
    PostMetrics.openCommentsListener(detailPost.post_id);
    detailOverlay.classList.add('show');
    document.getElementById('detailScroll').scrollTop = 0;
    BackButtonManager.set(closePostDetail);
}
function closePostDetail(){
    const closingPid = detailPost?.post_id;
    detailOverlay.classList.remove('show');
    PostMetrics.closeCommentsListener();
    detailPost = null;
    replyTargetId = null;
    if (closingPid) PostMetrics.syncPostCountersDOM(closingPid);
    BackButtonManager.set(goBack);
}

detailInput.addEventListener('input', () => {
    detailInput.style.height = 'auto'; detailInput.style.height = Math.min(detailInput.scrollHeight, 90) + 'px';
    detailSend.disabled = detailInput.value.trim().length === 0;
});
detailSend.addEventListener('click', async () => {
    const raw = detailInput.value.trim(); if (!raw || !detailPost || !currentUser) return;
    detailSend.disabled = true;
    const saved = await addCommentToServer(detailPost, raw, replyTargetId);
    if (saved) {
        replyTargetId = null; detailInput.value = ''; detailInput.style.height = 'auto';
        updateDetailReplyModeUI();
    } else {
        detailSend.disabled = false;
    }
});


/* ================= COMMENT DETAIL ================= */
const commentDetailOverlay = document.getElementById('commentDetailOverlay');
const cdInput = document.getElementById('commentDetailInput');
const cdSend = document.getElementById('commentDetailSend');
let activeCommentId = null, cdReplyTargetId = null;

function updateCdReplyModeUI(){
    const bar = document.getElementById('cdReplyModeBar'), island = document.getElementById('commentDetailIsland');
    if (!cdReplyTargetId || !detailPost || cdReplyTargetId === activeCommentId) {
        bar.style.display = 'none';
        island.classList.remove('reply-mode');
        return;
    }
    const targetC = PostMetrics._activeDetailComments.find(c => String(c.comment_id) === String(cdReplyTargetId));
    if (targetC) {
        const u = UserCache.get(String(targetC.user_id));
        document.getElementById('cdReplyModeText').textContent = `↩ ${getFullName(u)} ga javob`;
        bar.style.display = 'flex';
        island.classList.add('reply-mode');
    } else {
        bar.style.display = 'none';
        island.classList.remove('reply-mode');
    }
}

document.getElementById('cdReplyModeCancel').addEventListener('click', (e) => {
    e.stopPropagation();
    cdReplyTargetId = activeCommentId;
    cdInput.value = '';
    cdInput.style.height = 'auto';
    cdSend.disabled = true;
    updateCdReplyModeUI();
});

function refreshCommentDetailFromStore(){
    if (!detailPost || !activeCommentId) return;
    const tree = buildCommentTree(PostMetrics._activeDetailComments);
    const found = findCommentNode(tree, activeCommentId);
    if (!found) { closeCommentDetail(); return; }

    const mainBox = document.getElementById('commentDetailMain');
    mainBox.innerHTML = '';
    mainBox.appendChild(buildDetailComment(found, 0, true));

    const reps = document.getElementById('commentDetailReplies');
    reps.innerHTML = '';
    (found.replies || []).forEach(r => {
        reps.appendChild(buildDetailComment(r, 0, true));
    });
}

function openCommentDetail(cid){
    if (!detailPost) return;
    const tree = buildCommentTree(PostMetrics._activeDetailComments);
    const found = findCommentNode(tree, cid); if (!found) return;

    activeCommentId = String(cid);
    cdReplyTargetId = String(cid);
    cdInput.value = '';
    cdInput.style.height = 'auto';
    cdSend.disabled = true;
    updateCdReplyModeUI();
    refreshCommentDetailFromStore();

    commentDetailOverlay.classList.add('show');
    document.getElementById('commentDetailScroll').scrollTop = 0;
    BackButtonManager.set(closeCommentDetail);
}

function closeCommentDetail(){
    commentDetailOverlay.classList.remove('show');
    activeCommentId = null;
    cdReplyTargetId = null;
    renderDetailCommentsOnly();
    BackButtonManager.set(detailOverlay.classList.contains('show') ? closePostDetail : goBack);
}

cdInput.addEventListener('input', () => {
    cdInput.style.height = 'auto';
    cdInput.style.height = Math.min(cdInput.scrollHeight, 90) + 'px';
    cdSend.disabled = cdInput.value.trim().length === 0;
});

cdSend.addEventListener('click', async () => {
    const raw = cdInput.value.trim();
    if (!raw || !detailPost || !activeCommentId || !currentUser) return;
    cdSend.disabled = true;
    const target = cdReplyTargetId || activeCommentId;
    const saved = await addCommentToServer(detailPost, raw, target);
    if (saved) {
        cdReplyTargetId = activeCommentId;
        cdInput.value = '';
        cdInput.style.height = 'auto';
        updateCdReplyModeUI();
    } else {
        cdSend.disabled = false;
    }
});

/* ================= COMPOSER (FIREBASE STORAGE + FALLBACK) ================= */
const composer = document.getElementById('composer'), compOverlay = document.getElementById('composerOverlay'), compInput = document.getElementById('composerInput'), compSubmit = document.getElementById('composerSubmit');
let currentMedia = null;
let isSubmittingPost = false;

function openComposer(){ compOverlay.classList.add('show'); composer.classList.add('show'); setTimeout(() => compInput.focus(), 300); }
function closeComposer(){ compOverlay.classList.remove('show'); composer.classList.remove('show'); compInput.blur(); }
document.getElementById('postBtn')?.addEventListener('click', openComposer);
document.getElementById('composerClose').addEventListener('click', closeComposer);
compOverlay.addEventListener('click', closeComposer);
document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('attachVideoBtn').addEventListener('click', () => document.getElementById('videoInput').click());

compInput.addEventListener('input', () => {
    compInput.style.height = 'auto'; compInput.style.height = Math.min(compInput.scrollHeight, 160) + 'px';
    compSubmit.disabled = !(compInput.value.trim().length > 0 || currentMedia);
});

document.getElementById('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
        const { blob, dataUrl } = await compressImage(file);
        currentMedia = { blob, dataUrl, type: 'image', ext: 'jpg' };
        document.getElementById('previewImg').src = dataUrl;
        document.getElementById('previewImg').style.display = 'block';
        document.getElementById('previewVid').style.display = 'none';
        document.getElementById('composerPreview').classList.add('show');
        compSubmit.disabled = false;
    } catch {
        showToast("Rasmni qayta ishlashda xatolik");
    }
});

document.getElementById('videoInput').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.size > MAX_VIDEO_SIZE) { showToast("Video juda katta (Maksimum 8MB)"); return; }
    const previewUrl = URL.createObjectURL(file);
    currentMedia = { blob: file, previewUrl, type: 'video', ext: (file.name.split('.').pop() || 'mp4') };
    document.getElementById('previewVid').src = previewUrl;
    document.getElementById('previewVid').style.display = 'block';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('composerPreview').classList.add('show');
    compSubmit.disabled = false;
});

document.getElementById('removeImg').addEventListener('click', () => {
    if (currentMedia?.previewUrl) URL.revokeObjectURL(currentMedia.previewUrl);
    currentMedia = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('previewVid').src = '';
    document.getElementById('composerPreview').classList.remove('show');
    compSubmit.disabled = compInput.value.trim().length === 0;
});

async function uploadMediaToStorage(media, uid) {
    const fileName = `posts/${uid}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.${media.ext}`;
    const sRef = storageRef(storage, fileName);
    await uploadBytes(sRef, media.blob);
    return await getDownloadURL(sRef);
}

compSubmit.addEventListener('click', async () => {
    if (isSubmittingPost) return;
    const text = compInput.value.trim(); if ((!text && !currentMedia) || !currentUser) return;

    isSubmittingPost = true;
    compSubmit.disabled = true;
    compSubmit.textContent = 'Yuklanmoqda...';

    let finalMediaUrl = null;
    if (currentMedia) {
        try {
            finalMediaUrl = await uploadMediaToStorage(currentMedia, String(currentUser.user_id));
        } catch {
            if (currentMedia.type === 'image' && currentMedia.dataUrl && currentMedia.dataUrl.length < 850000) {
                finalMediaUrl = currentMedia.dataUrl;
            } else {
                isSubmittingPost = false;
                compSubmit.disabled = false;
                compSubmit.textContent = 'Yuborish';
                showToast("Media yuklashda xatolik (Firebase Storage)");
                return;
            }
        }
    }

    const added = await PostStore.add({
        author_id: String(currentUser.user_id),
        text,
        image: finalMediaUrl,
        type: currentMedia ? currentMedia.type : 'text'
    });

    isSubmittingPost = false;
    compSubmit.textContent = 'Yuborish';

    if (!added) {
        compSubmit.disabled = false;
        return;
    }

    if (currentMedia?.previewUrl) URL.revokeObjectURL(currentMedia.previewUrl);
    compInput.value = '';
    compInput.style.height = 'auto';
    compSubmit.disabled = true;
    currentMedia = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('previewVid').src = '';
    document.getElementById('composerPreview').classList.remove('show');
    closeComposer();

    if (currentTab === 'posts' || (currentTab === 'video' && added.type === 'video')) {
        const feed = document.getElementById('feed');
        if (feed) feed.prepend(buildPostItem(added));
        else switchTab(currentTab);
    } else {
        switchTab('posts');
    }
    showToast('Post joylandi');
});
