<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 200px;
            min-height: 100vh;
        }

        /* Profil rasmi */
        .profile-pic-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
            border: 3px solid #1c1c1e;
        }

        /* Ism va status */
        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }

        .last-seen {
            color: #8e8e93;
            font-size: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Statistika */
        .stats-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .stat-divider {
            width: 1px;
            background-color: #2c2c2e;
            height: 40px;
            align-self: center;
        }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Tugmalar */
        .action-buttons {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-edit {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 100px;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-edit:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-edit svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-settings {
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-settings:active {
            transform: scale(0.95) rotate(45deg);
            background-color: #2c2c2e;
        }

        .btn-settings svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Tablar — 3 ta */
        .tabs {
            display: flex;
            background-color: #1c1c1e;
            width: 100%;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 30px;
            gap: 2px;
        }

        .tab-item {
            color: #8e8e93;
            font-size: 14px;
            padding: 12px 6px;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            transition: all 0.25s ease;
            user-select: none;
            font-weight: 500;
            white-space: nowrap;
        }

        .tab-item:active {
            transform: scale(0.97);
        }

        .tab-item.active {
            background-color: #48484a;
            color: #ffffff;
            font-weight: 600;
        }

        /* Kontent */
        .content-area {
            color: #8e8e93;
            font-size: 16px;
            text-align: center;
            width: 100%;
            padding: 40px 0;
        }

        .empty-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border: 2px solid #3f3f46;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3f3f46;
        }

        .empty-icon svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* =============================== */
        /* BOSHLASH TUGMASI — PILL/ISLAND  */
        /* =============================== */
        .start-btn {
            position: fixed;
            right: 20px;
            bottom: 110px; /* bottom-nav ustida */
            z-index: 60;

            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 26px;

            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            color: #000000;

            border: none;
            border-radius: 100px;

            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: -0.01em;

            cursor: pointer;
            user-select: none;

            box-shadow:
                0 8px 24px rgba(255, 255, 255, 0.15),
                0 2px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);

            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.2s ease,
                        background 0.2s ease;
        }

        .start-btn:hover {
            box-shadow:
                0 10px 30px rgba(255, 255, 255, 0.25),
                0 2px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .start-btn:active {
            transform: scale(0.94);
            box-shadow:
                0 4px 12px rgba(255, 255, 255, 0.1),
                0 1px 4px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        .start-btn svg {
            width: 18px;
            height: 18px;
            stroke: #000000;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.25s ease;
        }

        .start-btn:active svg {
            transform: translateX(2px);
        }

        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            background-color: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5);
            border-radius: 2rem;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            padding: 0 12px;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .nav-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }

        .nav-active { color: #ffffff; }
        .nav-inactive { color: #a1a1aa; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-btn .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-btn .nav-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #1c1c1e;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Profil rasmi -->
        <div class="profile-pic-wrapper">
            <img id="userPhoto"
                 src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>"
                 alt="Profil rasmi" class="profile-pic">
        </div>

        <!-- Ism va holat -->
        <h1 class="name" id="userName">Yuklanmoqda...</h1>
        <p class="last-seen" id="userStatus">Telegram foydalanuvchisi</p>

        <!-- Statistika -->
        <div class="stats-container">
            <div class="stat-item">
                <span class="stat-number" id="subsCount">0</span>
                <span class="stat-label">Obunalar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="followersCount">0</span>
                <span class="stat-label">Obunachilar</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-item">
                <span class="stat-number" id="postsCount">0</span>
                <span class="stat-label">Postlar</span>
            </div>
        </div>

        <!-- Tugmalar -->
        <div class="action-buttons">
            <button class="btn-edit" id="editBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Tahrirlash
            </button>
            <button class="btn-settings" id="settingsBtn" aria-label="Sozlamalar">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <!-- Tablar: Bosh sahifa, Postlar, Video -->
        <div class="tabs" id="tabsContainer">
            <div class="tab-item active" data-tab="home">Bosh sahifa</div>
            <div class="tab-item" data-tab="posts">Postlar</div>
            <div class="tab-item" data-tab="video">Video</div>
        </div>

        <!-- Kontent -->
        <div class="content-area" id="contentArea">
            <div class="empty-icon" id="emptyIcon">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </div>
            <p id="contentText">Hali ma'lumot yo'q</p>
        </div>
    </div>

    <!-- BOSHLASH TUGMASI — PILL/ISLAND -->
    <button class="start-btn" id="startBtn" aria-label="Boshlash">
        Boshlash
        <svg viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
    </button>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="nav-label">Uy</span>
            </a>

            <a href="reels.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <line x1="2" y1="8" x2="22" y2="8"></line>
                    <line x1="2" y1="16" x2="22" y2="16"></line>
                    <line x1="8" y1="2" x2="8" y2="8"></line>
                    <line x1="16" y1="2" x2="16" y2="8"></line>
                    <polygon points="10 12 15 14.5 10 17 10 12" fill="currentColor"></polygon>
                </svg>
                <span class="nav-label">Reels</span>
            </a>

            <a href="xabar.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24" style="transform: scaleX(-1);">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
                <span class="nav-label">Xabar</span>
            </a>

            <a href="qidiruv.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span class="nav-label">Qidiruv</span>
            </a>

            <a href="profil.html" class="nav-btn nav-active">
                <img id="navUserPhoto"
                     src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>"
                     alt="Profile" class="nav-avatar">
                <span class="nav-label">Profil</span>
            </a>
        </div>
    </nav>

    <script>
        // Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // Foydalanuvchi ma'lumotlari
        function loadUser() {
            const user = tg?.initDataUnsafe?.user;
            if (!user) return;

            const fullName = [user.first_name, user.last_name]
                .filter(Boolean).join(' ') || 'Foydalanuvchi';

            document.getElementById('userName').textContent = fullName;
            document.getElementById('userStatus').textContent = user.username
                ? '@' + user.username
                : 'Telegram foydalanuvchisi';

            if (user.photo_url) {
                document.getElementById('userPhoto').src = user.photo_url;
                document.getElementById('navUserPhoto').src = user.photo_url;
            }
        }
        loadUser();

        // Tahrirlash
        document.getElementById('editBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            window.location.href = 'tahrirlash.html';
        });

        // Sozlamalar
        document.getElementById('settingsBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            window.location.href = 'setting.html';
        });

        // Boshlash tugmasi
        document.getElementById('startBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('medium');
            window.location.href = 'boshlash.html';
        });

        // Tablar
        const icons = {
            home: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
            posts: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
            video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`
        };

        const tabTexts = {
            home: "Hali ma'lumot yo'q",
            posts: "Hali post yo'q",
            video: "Hali video yo'q"
        };

        document.getElementById('tabsContainer').addEventListener('click', (e) => {
            const tab = e.target.closest('.tab-item');
            if (!tab) return;

            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');

            const key = tab.dataset.tab;
            document.getElementById('contentText').textContent = tabTexts[key];
            document.getElementById('emptyIcon').innerHTML = icons[key];

            tg?.HapticFeedback?.selectionChanged();
        });
    </script>
</body>
</html>
