<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil UI Dizayni</title>
    <!-- FontAwesome ikonkalari uchun ulash -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        /* Yuqori qismdagi gradient fon */
        .header-bg {
            height: 180px;
            background: linear-gradient(135deg, #e65c00 0%, #F9D423 0%, #b24100 30%, #302016 100%);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        /* Ikonka tugmalari */
        .icon-btn {
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .right-icons {
            display: flex;
            gap: 10px;
        }

        /* Asosiy kontent qismi */
        .content {
            background-color: #000;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            margin-top: -30px;
            padding: 0 15px 20px 15px;
            position: relative;
        }

        /* Profil rasmi */
        .profile-pic-container {
            position: absolute;
            top: -60px;
            left: 20px;
            width: 110px;
            height: 110px;
            background-color: #fff;
            border-radius: 50%;
            border: 3px solid #1c1c1e;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ma'lumotlar kartasi (Card) */
        .stats-card {
            background-color: #1c1c1e;
            border-radius: 24px;
            margin-top: 60px;
            padding: 25px 20px 15px 20px;
        }

        /* Statistika (Obunalar, Obunachilar, Postlar) */
        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-num {
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #8e8e93;
            font-size: 14px;
        }

        /* Ajratuvchi chiziq */
        .divider {
            height: 1px;
            background-color: #333;
            margin: 0 5px 15px 5px;
        }

        /* Tab menyular */
        .tabs-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tab {
            color: #8e8e93;
            font-size: 14px;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
        }

        .tab.active {
            background-color: #2c2c2e;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- Yuqori qism -->
    <div class="header-bg">
        <button class="icon-btn"><i class="fas fa-arrow-left"></i></button>
        <div class="right-icons">
            <button class="icon-btn"><i class="far fa-bell"></i></button>
            <button class="icon-btn"><i class="fas fa-ellipsis-v"></i></button>
        </div>
    </div>

    <!-- Asosiy qism -->
    <div class="content">
        <!-- Profil logotipi -->
        <div class="profile-pic-container">
            <!-- Rasm o'rniga namuna qo'yildi, o'zingizning rasmingiz URL'ini qo'yishingiz mumkin -->
            <img src="https://img.freepik.com/premium-vector/abstract-business-man-unicycle-logo-design-vector_762148-18.jpg" alt="Profile">
        </div>

        <!-- Kartochka -->
        <div class="stats-card">
            <div class="stats-row">
                <div class="stat-item">
                    <span class="stat-num">5</span>
                    <span class="stat-label">Obunalar</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">44</span>
                    <span class="stat-label">Obunachilar</span>
                </div>
                <div class="stat-item">
                    <span class="stat-num">3</span>
                    <span class="stat-label">Postlar</span>
                </div>
            </div>
            
            <div class="divider"></div>

            <div class="tabs-row">
                <div class="tab active">Bosh sahifa</div>
                <div class="tab">Postlar</div>
                <div class="tab">Foto</div>
                <div class="tab">Video</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
