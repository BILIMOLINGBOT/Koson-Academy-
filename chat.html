<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chat</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #000000);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { transition: transform 0.15s ease, opacity 0.15s ease; }
        .nav-btn:active { transform: scale(0.85); opacity: 0.7; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Xabar pufakchalari animatsiyasi */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-anim { animation: slideIn 0.25s ease-out; }
        
        /* Input focus effekti */
        .input-wrapper:focus-within {
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="text-white antialiased flex justify-center min-h-screen selection:bg-zinc-800 bg-black">

    <div class="w-full max-w-lg border-x border-zinc-900 h-screen flex flex-col relative bg-black">
        
        <!-- ===== HEADER - YANADA PASTGA TUSHIRILGAN ===== -->
        <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-xl border-b border-zinc-900 safe-top flex-shrink-0">
            <div class="flex items-center justify-between px-3 pb-3" style="padding-top: 90px;">
                
                <!-- Orqaga tugmasi -->
                <button onclick="goBack()" class="w-11 h-11 rounded-full bg-zinc-900 flex items-center justify-center text-gray-200 hover:bg-zinc-800 transition duration-200 flex-shrink-0">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <!-- Foydalanuvchi ma'lumotlari (markazda) -->
                <div class="flex-1 flex items-center justify-center gap-2.5 mx-2 min-w-0">
                    <img id="headerAvatar" src="" alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-zinc-800 flex-shrink-0">
                    <div class="flex flex-col min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span id="headerName" class="font-semibold text-[15px] truncate">Foydalanuvchi</span>
                            <span id="onlineDot" class="w-2 h-2 rounded-full flex-shrink-0 hidden"></span>
                        </div>
                        <span id="headerStatus" class="text-[11px] text-gray-400 font-light truncate">online</span>
                    </div>
                </div>

                <!-- Qo'ng'iroq va menyu -->
                <div class="flex items-center gap-2 flex-shrink-0">
                    <button class="w-11 h-11 rounded-full bg-zinc-900 flex items-center justify-center text-gray-200 hover:bg-zinc-800 transition duration-200">
                        <i class="fa-solid fa-phone text-sm"></i>
                    </button>
                    <button class="w-11 h-11 rounded-full bg-zinc-900 flex items-center justify-center text-gray-200 hover:bg-zinc-800 transition duration-200">
                        <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== XABARLAR MAYDONI ===== -->
        <main id="chatMessages" class="flex-1 overflow-y-auto no-scrollbar px-3 py-4 flex flex-col gap-2">
            
            <!-- Bo'sh holat (xabarlar yo'q bo'lganda) -->
            <div id="emptyState" class="flex-1 flex flex-col items-center justify-center p-4">
                <div class="bg-zinc-900/60 w-full max-w-[340px] rounded-[24px] p-8 pb-10 flex flex-col items-center text-center shadow-lg">
                    <h2 class="text-[20px] font-bold mb-2">Bu yerda hali xabarlar yo'q...</h2>
                    <p class="text-gray-400 text-[15px] leading-relaxed mb-8">
                        Suhbatni boshlash uchun xabar<br>yuboring.
                    </p>
                    <div class="text-[100px] leading-none drop-shadow-2xl">🤝</div>
                </div>
            </div>
        </main>

        <!-- ===== PASTKI INPUT QISMI ===== -->
        <footer class="flex-shrink-0 p-3 pb-4 safe-bottom bg-black border-t border-zinc-900">
            <div class="flex items-center gap-2">
                
                <!-- Fayl biriktirish -->
                <button class="w-11 h-11 rounded-full border border-zinc-700 flex-shrink-0 flex items-center justify-center text-gray-300 hover:bg-zinc-800 transition duration-200 bg-zinc-950">
                    <i class="fa-solid fa-paperclip text-base"></i>
                </button>

                <!-- Matn kiritish maydoni -->
                <div class="input-wrapper flex-1 border border-zinc-700 rounded-full px-4 py-2.5 flex items-center bg-zinc-950 transition duration-200">
                    <input 
                        type="text" 
                        id="messageInput"
                        placeholder="Xabar yozing..." 
                        class="bg-transparent border-none outline-none text-white w-full placeholder-gray-500 text-[15px]"
                        autocomplete="off"
                    >
                    <button class="text-gray-400 ml-2 hover:text-white transition duration-200 flex-shrink-0">
                        <i class="fa-regular fa-face-smile text-lg"></i>
                    </button>
                </div>

                <!-- Mikrofon / Yuborish tugmasi -->
                <button id="sendBtn" class="w-11 h-11 rounded-full border border-zinc-700 flex-shrink-0 flex items-center justify-center text-gray-300 hover:bg-zinc-800 transition duration-200 bg-zinc-950">
                    <i id="sendIcon" class="fa-solid fa-microphone text-base"></i>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // ===== URL PARAMETRLARINI O'QISH =====
        const params = new URLSearchParams(window.location.search);
        const userName = params.get('name') || 'Foydalanuvchi';
        const userAvatar = params.get('avatar') || 'https://i.pravatar.cc/150?img=11';
        const isOnline = params.get('online') === '1';

        // ===== HEADER'NI TO'LDIRISH =====
        document.getElementById('headerAvatar').src = userAvatar;
        document.getElementById('headerName').textContent = userName;

        const onlineDot = document.getElementById('onlineDot');
        const headerStatus = document.getElementById('headerStatus');

        if (isOnline) {
            onlineDot.classList.remove('hidden');
            onlineDot.classList.add('bg-green-500');
            headerStatus.textContent = 'online';
            headerStatus.classList.add('text-green-400');
        } else {
            onlineDot.classList.remove('hidden');
            onlineDot.classList.add('bg-zinc-500');
            headerStatus.textContent = 'yaqinda online edi';
        }

        // ===== SAHIFA SARLAVHASINI O'ZGARTIRISH =====
        document.title = userName + ' - Chat';

        // ===== XABAR YUBORISH LOGIKASI =====
        const input = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const sendIcon = document.getElementById('sendIcon');
        const chatMessages = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');

        // Input bo'sh/to'la ekanligiga qarab ikonkani o'zgartirish
        input.addEventListener('input', function() {
            if (this.value.trim().length > 0) {
                sendIcon.classList.remove('fa-microphone');
                sendIcon.classList.add('fa-paper-plane');
                sendBtn.classList.add('bg-blue-600', 'border-blue-600', 'text-white');
                sendBtn.classList.remove('bg-zinc-950', 'text-gray-300');
            } else {
                sendIcon.classList.remove('fa-paper-plane');
                sendIcon.classList.add('fa-microphone');
                sendBtn.classList.remove('bg-blue-600', 'border-blue-600', 'text-white');
                sendBtn.classList.add('bg-zinc-950', 'text-gray-300');
            }
        });

        // Xabar yuborish
        function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Bo'sh holatni yashirish
            if (emptyState && emptyState.parentNode) {
                emptyState.remove();
            }

            // Foydalanuvchi xabari (o'ng tomonda)
            addMessage(text, 'sent');

            // Inputni tozalash
            input.value = '';
            sendIcon.classList.remove('fa-paper-plane');
            sendIcon.classList.add('fa-microphone');
            sendBtn.classList.remove('bg-blue-600', 'border-blue-600', 'text-white');
            sendBtn.classList.add('bg-zinc-950', 'text-gray-300');

            // Scroll pastga
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Avtomatik javob (demo uchun)
            setTimeout(() => {
                const replies = [
                    'Yaxshi, tushundim 👍',
                    'Albatta, kelishamiz!',
                    'Rahmat!',
                    'Bugun bandman, ertaga gaplashamiz',
                    'Zo\'r fikr! ✅'
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                addMessage(randomReply, 'received');
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1200);
        }

        // Xabarni ekranga qo'shish
        function addMessage(text, type) {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-anim flex w-full ' + (type === 'sent' ? 'justify-end' : 'justify-start');

            const bubble = document.createElement('div');
            const baseClass = 'px-3.5 py-2 rounded-2xl max-w-[75%] text-[15px] break-words shadow-md leading-snug';
            
            if (type === 'sent') {
                bubble.className = baseClass + ' bg-blue-600 text-white rounded-br-md';
            } else {
                bubble.className = baseClass + ' bg-zinc-800 text-white rounded-bl-md';
            }
            
            bubble.textContent = text;
            wrapper.appendChild(bubble);
            chatMessages.appendChild(wrapper);
        }

        // Yuborish tugmasi
        sendBtn.addEventListener('click', function() {
            if (input.value.trim().length > 0) {
                sendMessage();
            } else {
                console.log('Mikrofon bosildi');
            }
        });

        // Enter tugmasi
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // Sahifa yuklanganda inputga fokus
        window.addEventListener('load', () => {
            setTimeout(() => input.focus(), 300);
        });

        // ===== ORQAGA QAYTISH =====
        function goBack() {
            window.location.href = 'xabar.html';
        }

        // ===== TELEGRAM WEB APP =====
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
                
                tg.BackButton.show();
                tg.BackButton.onClick(function() {
                    window.location.href = 'xabar.html';
                });
            }

            // Brauzer orqaga tugmasi
            window.history.pushState({ page: 1 }, "", "");
            window.onpopstate = function() {
                window.location.href = 'xabar.html';
            };
        });
    </script>
</body>
</html>
