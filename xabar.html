<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil UI Dizayn</title>
    <!-- Tailwind CSS ulash -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome ikonkalari ulash -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #121212; /* Orqa fon (Desktop uchun) */
            display: flex; 
            justify-content: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Gradientlar */
        .bg-gradient-header { 
            background: linear-gradient(to bottom right, #8a0b0b, #2a0b12); 
        }
        .bg-gradient-avatar { 
            background: linear-gradient(to bottom right, #b429f9, #541793); 
        }
        /* Faol tab ostidagi chiziq */
        .tab-active { 
            border-bottom: 2px solid white; 
            color: white !important;
        }
        /* Skrollbarni yashirish */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-screen w-full">

    <!-- Mobil Ekran Konteyneri -->
    <div class="w-full max-w-[400px] h-full bg-black relative overflow-hidden flex flex-col shadow-2xl">
        
        <!-- Skroll qilinadigan asosiy qism -->
        <div class="flex-1 overflow-y-auto pb-20 relative">
            
            <!-- Yuqori qizil fon -->
            <div class="bg-gradient-header h-40 w-full absolute top-0 left-0"></div>

            <!-- Yuqori Navigatsiya -->
            <div class="relative z-10 flex justify-between items-center p-4 pt-6">
                <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center backdrop-blur-md cursor-pointer text-white">
                    <i class="fa-solid fa-arrow-left"></i>
                </div>
                <div class="flex gap-3 text-white">
                    <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center backdrop-blur-md cursor-pointer">
                        <i class="fa-regular fa-bell text-lg"></i>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-black/40 flex items-center justify-center backdrop-blur-md cursor-pointer">
                        <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                    </div>
                </div>
            </div>

            <!-- Profil Ma'lumotlari bo'limi -->
            <div class="relative z-10 bg-[#1c1c1e] rounded-t-3xl mt-4 px-4 pb-4">
                
                <!-- Katta Dumaloq Avatar -->
                <div class="absolute -top-10 left-4 w-[84px] h-[84px] rounded-full bg-gradient-avatar border-[4px] border-[#1c1c1e] flex items-center justify-center text-3xl font-bold text-white shadow-sm">
                    WB
                </div>

                <div class="pt-14 text-white">
                    <h1 class="text-[22px] font-semibold tracking-wide mb-1">Девочки и Wildberries</h1>
                    <p class="text-gray-400 text-[15px] mb-3"><span class="text-white font-medium">7,5K</span> obuna</p>
                    
                    <div class="flex items-center gap-2 text-gray-400 text-sm mb-5">
                        <i class="fa-regular fa-circle-info text-lg"></i> 
                        <span>Jamiyat haqida</span>
                    </div>

                    <!-- Tugmalar (Obuna bo'lish, Xabar) -->
                    <div class="flex gap-3">
                        <button class="flex-1 bg-white text-black font-semibold py-2.5 rounded-xl hover:bg-gray-200 transition text-[15px]">
                            Obuna bo'lish
                        </button>
                        <button class="flex-1 bg-[#2c2c2e] text-white font-semibold py-2.5 rounded-xl hover:bg-[#3c3c3e] transition text-[15px]">
                            Xabar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tablar (Rasm, Video, Chat, Bookmark) -->
            <div class="flex bg-black mt-1 px-2">
                <div class="flex-1 py-4 flex justify-center tab-active cursor-pointer">
                    <i class="fa-regular fa-image text-xl"></i>
                </div>
                <div class="flex-1 py-4 flex justify-center text-gray-500 cursor-pointer">
                    <i class="fa-solid fa-video text-xl"></i>
                </div>
                <div class="flex-1 py-4 flex justify-center text-gray-500 cursor-pointer">
                    <i class="fa-regular fa-comment text-xl"></i>
                </div>
                <div class="flex-1 py-4 flex justify-center text-gray-500 cursor-pointer">
                    <i class="fa-regular fa-bookmark text-xl"></i>
                </div>
            </div>

            <!-- Xabarlar / Postlar lentalari -->
            <div class="p-4 space-y-7 text-white">
                
                <!-- 1-chi Post -->
                <div>
                    <div class="flex items-center gap-3 mb-2.5">
                        <img src="https://via.placeholder.com/40x40/333/fff?text=JR" class="w-[38px] h-[38px] rounded-full object-cover" alt="User avatar">
                        <div>
                            <p class="font-medium text-[15px] leading-tight">Javlon Rashidov</p>
                            <p class="text-gray-500 text-[13px]">hozir</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-3 font-light">Yana pastga tushir tugmasini bosing</p>
                    <div class="flex justify-between text-gray-500 text-[15px] px-1">
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-heart"></i> 0</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-comment"></i> 0</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-eye"></i> 1</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-bookmark"></i></div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-share-nodes"></i></div>
                    </div>
                </div>

                <!-- 2-chi Post -->
                <div>
                    <div class="flex items-center gap-3 mb-2.5">
                        <img src="https://via.placeholder.com/40x40/333/fff?text=JR" class="w-[38px] h-[38px] rounded-full object-cover" alt="User avatar">
                        <div>
                            <p class="font-medium text-[15px] leading-tight">Javlon Rashidov</p>
                            <p class="text-gray-500 text-[13px]">10 soniya oldin</p>
                        </div>
                    </div>
                    <p class="text-[15px] mb-3 font-light">Yana bir bor sinab</p>
                    <div class="flex justify-between text-gray-500 text-[15px] px-1">
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-heart"></i> 0</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-comment"></i> 0</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-eye"></i> 1</div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-regular fa-bookmark"></i></div>
                        <div class="flex items-center gap-1.5 cursor-pointer"><i class="fa-solid fa-share-nodes"></i></div>
                    </div>
                </div>

                <!-- 3-chi Post -->
                <div>
                    <div class="flex items-center gap-3 mb-2.5">
                        <img src="https://via.placeholder.com/40x40/333/fff?text=JR" class="w-[38px] h-[38px] rounded-full object-cover" alt="User avatar">
                        <div>
                            <p class="font-medium text-[15px] leading-tight">Javlon Rashidov</p>
                            <p class="text-gray-500 text-[13px]">2 soat oldin</p>
                        </div>
                    </div>
                    <!-- Ma'lumot yo'q, lekin ramka bor -->
                </div>
            </div>
        </div>

        <!-- + Post Qo'shish Tugmasi (Floating Action Button) -->
        <button class="absolute bottom-[80px] right-4 bg-white text-black font-semibold py-3 px-5 rounded-full flex items-center gap-2 shadow-[0_4px_15px_rgba(0,0,0,0.5)] z-20 hover:scale-105 transition-transform">
            <i class="fa-solid fa-plus"></i> Post
        </button>

        <!-- Pastki Navigatsiya (Bottom Nav) -->
        <div class="absolute bottom-0 w-full bg-[#0a0a0a] border-t border-gray-900 flex justify-around items-center pt-3 pb-6 px-2 z-30">
            <div class="flex flex-col items-center text-gray-500 gap-1 cursor-pointer hover:text-white transition">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-[11px] font-medium">Uy</span>
            </div>
            <div class="flex flex-col items-center text-gray-500 gap-1 cursor-pointer hover:text-white transition">
                <i class="fa-regular fa-message text-xl"></i>
                <span class="text-[11px] font-medium">Xabar</span>
            </div>
            <div class="flex flex-col items-center text-gray-500 gap-1 cursor-pointer hover:text-white transition">
                <i class="fa-solid fa-magnifying-glass text-xl"></i>
                <span class="text-[11px] font-medium">Qidiruv</span>
            </div>
            <div class="flex flex-col items-center text-white gap-1 cursor-pointer">
                <img src="https://via.placeholder.com/24x24/333/fff?text=JR" class="w-6 h-6 rounded-full border border-gray-600" alt="Profil">
                <span class="text-[11px] font-medium">Profil</span>
            </div>
        </div>

    </div>

</body>
</html>
