<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistika - Minimal Oq-Qora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-white dark:bg-black min-h-screen flex items-center justify-center sm:p-4 text-black dark:text-white">

    <!-- Mobil ilova konteyneri -->
    <div class="w-full h-[100vh] sm:h-auto sm:max-w-[400px] bg-white dark:bg-black sm:rounded-[40px] sm:border-[8px] sm:border-black dark:sm:border-[#333] overflow-hidden relative flex flex-col justify-between">
        
        <!-- Yuqori qism: Sarlavha va Kartasiz matnli statistika -->
        <div class="px-6 pt-12 pb-4">
            <h1 class="text-4xl font-bold tracking-tight mb-10">Statistika</h1>
            
            <div class="space-y-6">
                <!-- Reyting -->
                <div class="flex justify-between items-baseline border-b border-black/10 dark:border-white/10 pb-4">
                    <h2 class="text-[17px] font-medium opacity-60">Reytingi oʻrningiz</h2>
                    <span class="text-4xl font-bold tracking-tight">343</span>
                </div>
                
                <!-- O'sish -->
                <div class="flex justify-between items-baseline border-b border-black/10 dark:border-white/10 pb-4">
                    <h2 class="text-[17px] font-medium opacity-60">Oʻsish koʻrsatkichi</h2>
                    <span class="text-4xl font-bold tracking-tight">+33</span>
                </div>
                
                <!-- Faollik -->
                <div class="flex justify-between items-baseline border-b border-black/10 dark:border-white/10 pb-4">
                    <h2 class="text-[17px] font-medium opacity-60">Faolligingiz</h2>
                    <span class="text-4xl font-bold tracking-tight">80 <span class="text-[20px] font-medium opacity-60 ml-1">kun</span></span>
                </div>
            </div>
        </div>

        <!-- Pastki qism: Ustunli (Bar) Chart (Rasmdagi kabi) -->
        <div class="px-6 pb-12 pt-8 mt-auto">
            <div class="flex items-end justify-between h-48 gap-2">
                <!-- Ya (Faol) -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black dark:bg-white rounded-md transition-all" style="height: 100%;"></div>
                    <span class="text-[13px] font-bold">Ya</span>
                </div>
                <!-- Du -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 55%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Du</span>
                </div>
                <!-- Se -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 85%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Se</span>
                </div>
                <!-- Ch -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 80%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Ch</span>
                </div>
                <!-- Pa -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 40%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Pa</span>
                </div>
                <!-- Ju -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 50%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Ju</span>
                </div>
                <!-- Sh -->
                <div class="flex flex-col items-center gap-3 w-full h-full justify-end">
                    <div class="w-full bg-black/30 dark:bg-white/30 rounded-md transition-all" style="height: 65%;"></div>
                    <span class="text-[13px] font-medium opacity-50">Sh</span>
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
