<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Statistika - iOS UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS tipografiyasi va scroll xususiyatlari */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'media', // Qurilma mavzusiga qarab Avto Dark/Light rejim
            theme: {
                extend: {
                    colors: {
                        ios: {
                            bg: '#F2F2F7',
                            darkBg: '#000000',
                            card: '#FFFFFF',
                            darkCard: '#1C1C1E',
                            blue: '#007AFF',
                            green: '#34C759',
                            orange: '#FF9500',
                            text: '#000000',
                            darkText: '#FFFFFF',
                            gray: '#8E8E93'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-ios-bg dark:bg-ios-darkBg min-h-screen flex items-center justify-center sm:p-4">

    <!-- Mobil ilova konteyneri (Telegram Mini App uchun moslangan kenglik) -->
    <div class="w-full h-[100vh] sm:h-auto sm:max-w-[400px] bg-ios-bg dark:bg-ios-darkBg sm:rounded-[40px] sm:shadow-2xl overflow-hidden relative sm:border-[8px] sm:border-gray-900">
        
        <!-- Sarlavha -->
        <div class="px-6 pt-10 pb-4">
            <h1 class="text-3xl font-bold text-ios-text dark:text-ios-darkText tracking-tight">Statistika</h1>
        </div>

        <!-- Asosiy Grid -->
        <div class="px-4 pb-8 grid grid-cols-2 gap-4">
            
            <!-- Reyting (To'liq kenglikda) -->
            <div class="col-span-2 bg-ios-card dark:bg-ios-darkCard rounded-[22px] p-5 shadow-sm active:scale-[0.98] transition-transform">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-9 h-9 rounded-full bg-blue-100 dark:bg-blue-900/40 flex items-center justify-center">
                        <svg class="w-5 h-5 text-ios-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                        </svg>
                    </div>
                    <h3 class="text-[15px] font-semibold text-ios-gray">Reytingi oʻrningiz</h3>
                </div>
                <div class="mt-1 flex items-baseline gap-1">
                    <span class="text-[42px] font-bold text-ios-text dark:text-ios-darkText leading-none tracking-tight">343</span>
                </div>
            </div>

            <!-- O'sish ko'rsatkichi (Chap kvadrat) -->
            <div class="bg-ios-card dark:bg-ios-darkCard rounded-[22px] p-5 shadow-sm flex flex-col justify-between aspect-square active:scale-[0.98] transition-transform">
                <div class="w-9 h-9 rounded-full bg-green-100 dark:bg-green-900/40 flex items-center justify-center mb-2">
                    <svg class="w-5 h-5 text-ios-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
                    </svg>
                </div>
                <div>
                    <span class="text-[32px] font-bold text-ios-text dark:text-ios-darkText leading-none tracking-tight">+33</span>
                    <p class="text-[13px] font-medium text-ios-gray mt-1 leading-snug">Oʻsish koʻrsatkichi</p>
                </div>
            </div>

            <!-- Faollik (O'ng kvadrat) -->
            <div class="bg-ios-card dark:bg-ios-darkCard rounded-[22px] p-5 shadow-sm flex flex-col justify-between aspect-square active:scale-[0.98] transition-transform">
                <div class="w-9 h-9 rounded-full bg-orange-100 dark:bg-orange-900/40 flex items-center justify-center mb-2">
                    <svg class="w-5 h-5 text-ios-orange" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path>
                    </svg>
                </div>
                <div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-[32px] font-bold text-ios-text dark:text-ios-darkText leading-none tracking-tight">80</span>
                        <span class="text-sm font-semibold text-ios-gray">kun</span>
                    </div>
                    <p class="text-[13px] font-medium text-ios-gray mt-1 leading-snug">Faolligingiz</p>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
