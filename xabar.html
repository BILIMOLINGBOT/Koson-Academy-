<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Xabarlar - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* iOS Design System Fonts & Resets */
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column;min-height:100vh;}
        
        /* Yuqori qism: iPhone notch (safe-area) bilan ishlashi uchun padding */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(16px + env(safe-area-inset-top)) 20px 15px 20px; 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .brand-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bo'sh holat (Empty state) dizayni */
        .empty-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            text-align: center;
            margin-top: 30%;
            animation: fadeIn 0.4s ease-out;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #8e8e93;
        }

        .empty-icon svg {
            width: 32px;
            height: 32px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            color: #8e8e93;
            font-size: 16px;
            line-height: 1.5;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* "ISLAND" PASTKI NAVIGATSIYA */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="brand-title">Xabarlar</h1>
        <button class="icon-btn" id="newMsgBtn" aria-label="Yangi xabar">
            <svg viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14"></path>
            </svg>
        </button>
    </header>

    <main class="empty-container">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1)">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            </svg>
        </div>
        <p class="empty-text">Hali xabarlar yo‘q</p>
    </main>
</div>

<!-- OROLCHA NAVIGATSIYA -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <!-- Uy - inactive -->
        <a href="index.html" class="nav-btn nav-inactive">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-label">Uy</span>
        </a>
        <!-- Xabar - ACTIVE -->
        <a href="xabar.html" class="nav-btn nav-active">
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="nav-label">Xabar</span>
        </a>
        <!-- Qidiruv - inactive -->
        <a href="qidiruv.html" class="nav-btn nav-inactive">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="nav-label">Qidiruv</span>
        </a>
        <!-- Profil - inactive -->
        <a href="profil.html" class="nav-btn nav-inactive" id="navProfileLink">
            <span id="navAvatarSlot"><div class="nav-avatar-initial">F</div></span>
            <span class="nav-label">Profil</span>
        </a>
    </div>
</nav>

<script>
    /* Telegram Web App sozlamalari */
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
        try {
            tg.ready(); 
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        } catch (e) {}
    }

    /* Yangi xabar tugmasi logikasi (ixtiyoriy) */
    document.getElementById('newMsgBtn').addEventListener('click', () => {
        // Yangi xabar yozish yoki qidiruv oynasini ochish kodi
    });

    /* Profil avatarini yuklash (Local DB) */
    try {
        const currentUser = JSON.parse(localStorage.getItem('luz_users'))?.find(u => u.userId === localStorage.getItem('luz_current_user'));
        if (currentUser) {
            const navAvatarSlot = document.getElementById('navAvatarSlot');
            const cuInit = (currentUser.firstName || 'F').charAt(0).toUpperCase();
            if (currentUser.photo_url) {
                navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
            } else {
                navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;
            }
        }
    } catch (e) {}
</script>
</body>
</html>
