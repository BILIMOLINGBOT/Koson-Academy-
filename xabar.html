<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Xabar - Chat</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #000000);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Chat elementlari uchun aktiv effekt */
        .chat-item { transition: background-color 0.15s ease, transform 0.1s ease; }
        .chat-item:active { transform: scale(0.98); background-color: #18181b; }
        
        /* ================= BOTTOM NAV (index.html bilan sinxron) ================= */
        .bottom-nav {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            width: 92%; max-width: 400px; background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(63, 63, 70, 0.5); border-radius: 2rem; z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); padding-bottom: env(safe-area-inset-bottom);
        }
        .bottom-nav-inner { display: flex; justify-content: space-around; align-items: center; padding: 12px 8px; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; padding: 0 8px; transition: transform .15s ease, opacity .15s ease; cursor: pointer; background: none; border: none; font-family: inherit; flex: 1; }
        .nav-btn:active { transform: scale(0.85); opacity: 0.7; }
        .nav-active { color: #fff; } .nav-inactive { color: #a1a1aa; }
        .nav-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        .nav-btn .nav-label { font-size: 10px; font-weight: 500; }
        
        .nav-btn .nav-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #1c1c1e; }
        .nav-btn .nav-avatar-initial { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #3a3a3c 0%, #1c1c1e 100%); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; text-transform: uppercase; }
        
        .nav-badge { position: absolute; top: -4px; right: 12px; width: 16px; height: 16px; background: #ef4444; color: white; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #18181b; }
    </style>
</head>
<body class="text-white antialiased flex justify-center min-h-screen selection:bg-zinc-800 bg-black">

    <div class="w-full max-w-lg border-x border-zinc-900 min-h-screen flex flex-col relative bg-black pb-28 no-scrollbar">
        
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-black/80 backdrop-blur-xl border-b border-zinc-900 flex items-end px-4 pb-4 safe-top" style="height: 120px;">
            <h1 class="text-3xl font-bold tracking-tight text-white">Xabarlar</h1>
        </header>

        <!-- Qidiruv qismi -->
        <div class="px-4 pt-4 pb-2">
            <div class="relative">
                <svg class="absolute left-3 top-2.5 w-5 h-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="Qidiruv..." class="w-full bg-zinc-900 text-white text-sm rounded-full pl-10 pr-4 py-2.5 focus:outline-none focus:ring-1 focus:ring-zinc-700 transition-shadow">
            </div>
        </div>

        <!-- Chatlar ro'yxati -->
        <div class="px-5 py-2 text-zinc-400 font-semibold text-sm">
            Barcha suhbatlar
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar" id="chat-list">
            <!-- Chat 1 -->
            <div onclick="openChat('Ali Valiyev', 'https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=100&auto=format&fit=crop&q=80', true)" 
                 class="chat-item flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-zinc-900 bg-zinc-900/50">
                <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?w=100&auto=format&fit=crop&q=80" alt="Ali" class="w-14 h-14 rounded-full object-cover border border-zinc-800">
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-center mb-0.5">
                        <h3 class="font-semibold text-[16px] truncate text-white">Ali Valiyev</h3>
                        <span class="text-xs text-zinc-500">10:42</span>
                    </div>
                    <p class="text-[14px] text-zinc-400 truncate">Qachon ko'rishamiz?</p>
                </div>
                <div class="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>
            </div>

            <!-- Chat 2 -->
            <div onclick="openChat('Malika', 'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&auto=format&fit=crop&q=80', false)" 
                 class="chat-item flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-zinc-900">
                <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&auto=format&fit=crop&q=80" alt="Malika" class="w-14 h-14 rounded-full object-cover border border-zinc-800">
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-center mb-0.5">
                        <h3 class="font-semibold text-[16px] truncate text-white">Malika</h3>
                        <span class="text-xs text-zinc-500">Kecha</span>
                    </div>
                    <p class="text-[14px] text-zinc-400 truncate">Yangi dizaynni yubordim</p>
                </div>
            </div>

            <!-- Chat 3 -->
            <div onclick="openChat('Sardor Aka', 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80', false)" 
                 class="chat-item flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-zinc-900">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80" alt="Sardor" class="w-14 h-14 rounded-full object-cover border border-zinc-800">
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between items-center mb-0.5">
                        <h3 class="font-semibold text-[16px] truncate text-white">Sardor Aka</h3>
                        <span class="text-xs text-zinc-500">Du</span>
                    </div>
                    <p class="text-[14px] text-zinc-400 truncate">Loyiha zo'r chiqibdi, rahmat!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (index.html bilan sinxronlashtirilgan) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <!-- Uy -->
            <a href="index.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Uy</span>
            </a>
            
            <!-- Xabar (AKTIV) -->
            <a href="xabar.html" class="nav-btn nav-active" style="position: relative;">
                <svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                <span class="nav-badge">3</span>
                <span class="nav-label">Xabar</span>
            </a>
            
            <!-- Qidiruv -->
            <a href="qidiruv.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="nav-label">Qidiruv</span>
            </a>
            
            <!-- Profil -->
            <a href="profil.html" class="nav-btn nav-inactive" id="navProfileLink">
                <span id="navAvatarSlot"></span>
                <span class="nav-label">Profil</span>
            </a>
        </div>
    </nav>

    <script>
        /* ================= DB VA SESSIYA (index.html dan olingan) ================= */
        const DB = {
            _K: 'luz_users',
            _S: 'luz_current_user',
            getCurrentUser(){
                const id = localStorage.getItem(this._S);
                if (!id) return null;
                try {
                    const users = JSON.parse(localStorage.getItem(this._K)) || [];
                    return users.find(u => u.userId === id) || null;
                } catch { return null; }
            }
        };

        const currentUser = DB.getCurrentUser();
        // Agar tizimga kirmagan bo'lsa authorization ga o'tkazish
        if (!currentUser) window.location.href = 'authorization.html';

        /* ================= NAV AVATAR ================= */
        const navAvatarSlot = document.getElementById('navAvatarSlot');
        if (currentUser && navAvatarSlot) {
            const cuName = [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi';
            const cuInit = cuName.trim().charAt(0).toUpperCase() || 'F';
            if (currentUser.photo_url) {
                navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
            } else {
                navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;
            }
        }

        /* ================= CHAT FUNKSIYASI ================= */
        function openChat(name, avatar, isOnline) {
            const params = new URLSearchParams({
                name: name,
                avatar: avatar,
                online: isOnline ? '1' : '0'
            });
            window.location.href = 'chat.html?' + params.toString();
        }

        /* ================= TELEGRAM WEB APP VA ORQAGA QAYTISH ================= */
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.requestFullscreen) tg.requestFullscreen();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
                
                tg.BackButton.show();
                tg.BackButton.onClick(function() {
                    window.location.href = 'index.html';
                });
            }

            // Brauzer / Apparat orqaga qaytish tugmasi uchun
            window.history.pushState({ page: 'xabar' }, "", "");
            window.onpopstate = function(event) {
                window.location.href = 'index.html';
            };
        });
    </script>
</body>
</html>
