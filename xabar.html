<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twitter UI Clone</title>
<style>
  body {
    background-color: #000000;
    color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    margin: 0;
  }
  
  .tweet-container {
    display: flex;
    max-width: 600px;
    width: 100%;
    padding: 12px 16px;
    background-color: #000000;
    border-bottom: 1px solid #2f3336;
    border-top: 1px solid #2f3336;
    box-sizing: border-box;
  }
  
  .avatar-container {
    margin-right: 12px;
  }
  
  .avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    background-color: #333;
  }
  
  .content-container {
    flex: 1;
    min-width: 0;
  }
  
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  
  .user-info {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
  }
  
  .display-name {
    font-weight: 700;
    font-size: 15px;
    color: #e7e9ea;
  }
  
  .verified-badge {
    width: 1.25em;
    height: 1.25em;
    fill: #1d9bf0;
    display: inline-block;
  }
  
  .username, .timestamp {
    color: #71767b;
    font-size: 15px;
  }
  
  .header-actions {
    display: flex;
    align-items: center;
    color: #71767b;
    gap: 16px;
  }
  
  .header-icon {
    width: 18.75px;
    height: 18.75px;
    fill: currentColor;
    cursor: pointer;
  }

  .header-icon:hover {
    fill: #e7e9ea;
  }
  
  .tweet-text {
    font-size: 18px;
    line-height: 24px;
    color: #e7e9ea;
    margin-bottom: 12px;
    margin-top: 0;
    word-wrap: break-word;
    font-weight: 400;
  }
  
  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #71767b;
    margin-top: 12px;
  }
  
  .action-group {
    display: flex;
    gap: 0;
    flex: 1;
    justify-content: space-between;
    max-width: 425px;
  }
  
  .action-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: color 0.2s;
  }
  
  .action-item:hover {
    color: #1d9bf0;
  }
  
  .action-item.retweet:hover { color: #00ba7c; }
  .action-item.like:hover { color: #f91880; }
  
  .action-item svg {
    width: 18.75px;
    height: 18.75px;
    fill: currentColor;
  }

  .right-actions {
    display: flex;
    gap: 16px;
  }
</style>
</head>
<body>

<div class="tweet-container">
  <div class="avatar-container">
    <!-- Profil rasmi uchun rasm havolasini src ichiga qo'yishingiz mumkin -->
    <img src="https://via.placeholder.com/48" alt="Profile avatar" class="avatar">
  </div>
  
  <div class="content-container">
    <div class="header">
      <div class="user-info">
        <span class="display-name">Madinabonu</span>
        <svg class="verified-badge" viewBox="0 0 24 24" aria-label="Verified account">
          <path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.918-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.337 2.25c-.416-.165-.866-.25-1.336-.25-2.21 0-3.918 1.79-3.918 4 0 .495.084.965.238 1.4-1.273.65-2.148 2.02-2.148 3.6 0 1.46.726 2.76 1.848 3.515-.102.378-.157.777-.157 1.185 0 2.21 1.71 3.998 3.918 3.998.47 0 .92-.084 1.336-.25C8.49 21.08 9.798 22 11.25 22h1.5c1.45 0 2.76-.918 3.336-2.25.416.165.866.25 1.336.25 2.21 0 3.918-1.79 3.918-4 0-.408-.054-.807-.157-1.185 1.12-.755 1.848-2.055 1.848-3.515zm-11.45 4.67l-3.34-3.34 1.414-1.41 1.926 1.92 5.097-5.09 1.414 1.41-6.51 6.51z"></path>
        </svg>
        <span class="username">@Madina...</span>
        <span class="timestamp">· 19h</span>
      </div>
      
      <div class="header-actions">
        <!-- Yashirilgan izohlar belgisi -->
        <svg class="header-icon" viewBox="0 0 24 24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm4.12 12.707l-1.414 1.414L12 13.414l-2.707 2.707-1.414-1.414L10.586 12 7.879 9.293l1.414-1.414L12 10.586l2.707-2.707 1.414 1.414L13.414 12l2.706 2.707z"></path></svg>
        <!-- Options (3 nuqta) -->
        <svg class="header-icon" viewBox="0 0 24 24"><path d="M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm9 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"></path></svg>
      </div>
    </div>
    
    <p class="tweet-text">
      Jin ursin bunaqa havoni!!! O'pishishli havo ham jonga tegdi, endi baxtli yashayotganingda yolg'izligingni eslatadigan
    </p>
    
    <div class="actions">
      <div class="action-group">
        <!-- Comment -->
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></svg>
          <span>5</span>
        </div>
        <!-- Retweet -->
        <div class="action-item retweet">
          <svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z"></path></svg>
          <span>2</span>
        </div>
        <!-- Like -->
        <div class="action-item like">
          <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"></path></svg>
          <span>25</span>
        </div>
        <!-- Views/Analytics -->
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z"></path></svg>
          <span>1,9K</span>
        </div>
      </div>
      
      <!-- Bookmark va Share qismi -->
      <div class="right-actions">
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z"></path></svg>
        </div>
        <div class="action-item">
          <svg viewBox="0 0 24 24"><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"></path></svg>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
