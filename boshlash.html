<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi quote UI</title>
    <!-- Ikonkalar uchun FontAwesome ulangan -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Umumiy sozlamalar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000; /* Asosiy qora fon */
            color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        /* Ilova konteyneri (mobil o'lchamga moslash uchun) */
        .app-container {
            width: 100%;
            max-width: 400px; 
            background-color: #000000;
            height: 100%;
            position: relative;
        }

        /* Yuqori qism (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #151515; /* Pastki nozik chiziq */
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .share-btn {
            background: none;
            border: none;
            color: #666666; /* Kulrang matn */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Asosiy kontent qismi */
        .content {
            padding: 20px;
        }

        /* Profil va matn kiritish joyi */
        .input-section {
            display: flex;
            margin-bottom: 24px;
        }

        /* Rasm va uning ostidagi ip (chiziq) */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 15px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
        }

        .thread-line {
            width: 2px;
            height: 35px;
            background-color: #1a1a1a;
            margin-top: 8px;
        }

        /* Matn kiritish maydoni */
        .input-container {
            flex-grow: 1;
            padding-top: 10px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 17px;
            resize: none;
            outline: none;
            min-height: 50px;
        }

        textarea::placeholder {
            color: #666666;
        }

        /* Rasm qo'shish tugmasi */
        .add-image-btn {
            width: 100%;
            background-color: #0f0f0f;
            border: none;
            color: #666666;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-image-btn i {
            font-size: 18px;
        }

        .add-image-btn:hover {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Yuqori panel -->
        <header class="header">
            <button class="back-btn"><i class="fas fa-chevron-left"></i></button>
            <h1 class="title">Yangi quote</h1>
            <button class="share-btn">Ulashish</button>
        </header>

        <!-- Matn va rasm qo'shish qismi -->
        <main class="content">
            <div class="input-section">
                <!-- Foydalanuvchi rasmi va chiziq (Threads stilida) -->
                <div class="avatar-container">
                    <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" class="avatar">
                    <div class="thread-line"></div>
                </div>
                
                <!-- Input textarea -->
                <div class="input-container">
                    <textarea placeholder="Nima haqida yozmoqchisiz?"></textarea>
                </div>
            </div>

            <!-- Pastki tugma -->
            <button class="add-image-btn">
                <i class="far fa-image"></i> Rasm qo'shish
            </button>
        </main>
    </div>

</body>
</html>
