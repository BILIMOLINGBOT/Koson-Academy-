<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 114px;
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2;
            font-family: inherit;
        }

        .text-input::placeholder {
            color: #444444;
        }

        /* Katta markaziy rasm preview qatlami */
        .preview-overlay {
            position: fixed;
            inset: 0;
            display: none; /* Dastlab yashirin */
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 100;
            padding: 40px;
            box-sizing: border-box;
        }

        .preview-overlay.active {
            display: flex;
        }

        /* Katta rasm */
        .preview-image {
            max-width: 85vw;
            max-height: 75vh;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            object-fit: contain;
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }

        /* Yopish tugmasi (yuqori o'ng) */
        .preview-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .preview-close:hover {
            background-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.08);
        }

        /* Pastki o'ng burchakdagi tugmalar konteyneri */
        .actions {
            position: absolute;
            bottom: 30px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 50;
        }

        /* Rasm ikonkasi (galereyadan rasm tanlash) */
        .image-button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .image-button:hover {
            transform: scale(1.08);
            background-color: #262626;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .image-button:active {
            transform: scale(0.92);
        }

        /* Zamonaviy SVG ikonka */
        .image-button svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Yashirin file input */
        .file-input {
            display: none;
        }

        /* "Island" (kapsula) yuborish tugmasi */
        .send-button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* Tugma ichidagi dumaloq strelka */
        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>
        <input type="text" class="text-input" placeholder="Xabar yozing..." autofocus>
    </div>

    <!-- Katta markaziy rasm preview -->
    <div class="preview-overlay" id="previewOverlay">
        <button class="preview-close" id="previewClose" aria-label="Yopish">✕</button>
        <img class="preview-image" id="previewImage" alt="Tanlangan rasm">
    </div>

    <!-- Pastki o'ng burchakdagi tugmalar -->
    <div class="actions">
        <!-- Rasm tanlash ikonkasi -->
        <button class="image-button" id="imageButton" aria-label="Rasm qo'shish">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
            </svg>
        </button>

        <!-- Yashirin fayl input: faqat rasmlar -->
        <input type="file" id="fileInput" class="file-input" accept="image/*">

        <!-- Yuborish tugmasi -->
        <button class="send-button">
            Yuborish
            <div class="send-icon">↑</div>
        </button>
    </div>

    <script>
        const imageButton  = document.getElementById('imageButton');
        const fileInput    = document.getElementById('fileInput');
        const previewOverlay = document.getElementById('previewOverlay');
        const previewImage = document.getElementById('previewImage');
        const previewClose = document.getElementById('previewClose');

        // Rasm ikonkasi bosilganda galereyani ochish
        imageButton.addEventListener('click', () => {
            fileInput.click();
        });

        // Fayl tanlanganda katta preview'ni ko'rsatish
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    previewOverlay.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        });

        // Yopish tugmasi bosilganda preview'ni yopish
        previewClose.addEventListener('click', () => {
            previewOverlay.classList.remove('active');
        });

        // Overlay bo'sh joyiga bosilganda yopish
        previewOverlay.addEventListener('click', (e) => {
            if (e.target === previewOverlay) {
                previewOverlay.classList.remove('active');
            }
        });
    </script>

</body>
</html>
