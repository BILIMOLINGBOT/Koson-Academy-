<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303; /* To'q qora fon */
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Yuqori qism (Header) konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 24px 20px;
            gap: 12px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866; /* To'q ko'k rang */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px; /* Harfni markazlashtirish uchun */
            box-sizing: border-box;
        }

        /* Logotip yonidagi vertikal kursor chizig'i */
        .cursor-line {
            height: 28px;
            width: 2.5px;
            background-color: #4a90e2; /* Och ko'k rang */
            border-radius: 2px;
            animation: blink 1s step-end infinite; /* Miltillash effekti */
        }

        /* Miltillash (Blink) animatsiyasi */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>
        <div class="cursor-line"></div>
    </div>

</body>
</html>
