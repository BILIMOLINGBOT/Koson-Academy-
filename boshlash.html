<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow: hidden; /* Ekranda ortiqcha scroll bo'lmasligi uchun */
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 114px;
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2;
            font-family: inherit;
        }

        .text-input::placeholder {
            color: #444444;
        }

        /* ---------------- YENGI QISM: Markaziy Rasm Preview ---------------- */
        .preview-container {
            display: none; /* Dastlab yashirin */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background-color: #1a1a1a;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 80%;
            max-height: 70vh;
        }

        .preview-container.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-preview-large {
            max-width: 100%;
            max-height: calc(70vh - 20px);
            border-radius: 8px;
            object-fit: contain;
        }

        /* Rasmni yopish (bekor qilish) tugmasi */
        .close-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: #333;
            color: #fff;
            border: 2px solid #030303;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: #555;
        }
        /* ------------------------------------------------------------------- */

        /* Pastki o'ng burchakdagi tugmalar konteyneri */
        .actions {
            position: absolute;
            bottom: 30px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Rasm ikonkasi (galereyadan rasm tanlash) */
        .image-button {
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .image-button:hover {
            transform: scale(1.08);
            background-color: #262626;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .image-button:active {
            transform: scale(0.92);
        }

        .image-button svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 1.8;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Yashirin file input */
        .file-input {
            display: none;
        }

        /* "Island" (kapsula) yuborish tugmasi */
        .send-button {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* Tugma ichidagi dumaloq strelka */
        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>
        <input type="text" class="text-input" placeholder="Xabar yozing..." autofocus>
    </div>

    <!-- MARKAZIY RASM PREVIEW KONTEYNERI -->
    <div id="previewContainer" class="preview-container">
        <button id="closePreview" class="close-btn" aria-label="Rasmni o'chirish">✕</button>
        <img id="imagePreview" class="image-preview-large" alt="Tanlangan rasm">
    </div>

    <!-- Pastki o'ng burchakdagi tugmalar -->
    <div class="actions">
        <!-- Rasm tanlash ikonkasi -->
        <button class="image-button" id="imageButton" aria-label="Rasm qo'shish">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
            </svg>
        </button>

        <!-- Yashirin fayl input: faqat rasmlar -->
        <input type="file" id="fileInput" class="file-input" accept="image/*">

        <!-- Yuborish tugmasi -->
        <button class="send-button">
            Yuborish
            <div class="send-icon">↑</div>
        </button>
    </div>

    <script>
        const imageButton = document.getElementById('imageButton');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const closePreview = document.getElementById('closePreview');

        // Rasm ikonkasi bosilganda galereyani ochish
        imageButton.addEventListener('click', () => {
            fileInput.click();
        });

        // Fayl tanlanganda markaziy preview'ni ko'rsatish
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    previewContainer.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        });

        // "X" tugmasi bosilganda rasmni bekor qilish
        closePreview.addEventListener('click', () => {
            previewContainer.classList.remove('active');
            fileInput.value = ''; // Inputni tozalab qo'yish (boshqa safar ham bir xil rasmni tanlash imkoniyati uchun)
            imagePreview.src = '';
        });
    </script>

</body>
</html>
