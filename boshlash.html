<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303; /* To'q qora fon */
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative; /* Tugmani to'g'ri joylashtirish uchun */
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 64px; /* Dastlabki dizayndan yana 40px pastga tushirildi */
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866; /* To'q ko'k rang */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2; /* Matn yozishda chiqadigan kursorning ko'k rangi */
            font-family: inherit;
        }

        .text-input::placeholder {
            color: #444444; /* Yozishdan oldin ko'rinib turadigan xira matn rangi */
        }

        /* Pastki o'ng burchakdagi "Island" (kapsula) yuborish tugmasi */
        .send-button {
            position: absolute;
            bottom: 30px;
            right: 25px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px; /* Island shaklini beruvchi qism */
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tugma ustiga sichqoncha borgandagi effekt */
        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        /* Tugma bosilgandagi effekt */
        .send-button:active {
            transform: scale(0.95);
        }
        
        /* Tugma ichidagi dumaloq strelka */
        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>
        <!-- Avtomatik tarzda kursorni ishga tushiruvchi matn kiritish maydoni (autofocus) -->
        <input type="text" class="text-input" placeholder="Xabar yozing..." autofocus>
    </div>

    <!-- O'ng burchakdagi yuborish tugmasi -->
    <button class="send-button">
        Yuborish
        <div class="send-icon">↑</div>
    </button>

</body>
</html>
