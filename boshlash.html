<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303; /* To'q qora fon */
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 114px; /* 64px + 50px = 114px (logotip 50px pastga tushirildi) */
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Matn kiritish maydoni va rasm ikonkasi konteyneri */
        .input-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 10px;
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 20px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2;
            font-family: inherit;
        }

        .text-input::placeholder {
            color: #444444;
        }

        /* Rasm ikonkasi (tugma) */
        .image-button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.15s ease;
            flex-shrink: 0;
        }

        .image-button:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .image-button:active {
            transform: scale(0.92);
        }

        /* SVG rasm ikonkasi */
        .image-button svg {
            width: 22px;
            height: 22px;
            stroke: #888888;
            transition: stroke 0.2s ease;
        }

        .image-button:hover svg {
            stroke: #4a90e2;
        }

        /* Tanlangan rasm nomi ko'rsatiladigan joy */
        .file-name {
            font-size: 12px;
            color: #4a90e2;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Yashirin file input */
        .file-input {
            display: none;
        }

        /* Pastki o'ng burchakdagi yuborish tugmasi */
        .send-button {
            position: absolute;
            bottom: 30px;
            right: 25px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>

        <div class="input-wrapper">
            <!-- Matn kiritish maydoni -->
            <input type="text" class="text-input" placeholder="Xabar yozing..." autofocus>

            <!-- Tanlangan rasm nomi (boshida bo'sh) -->
            <span class="file-name" id="fileName"></span>

            <!-- Rasm ikonkasi (tugma) -->
            <button class="image-button" id="imageButton" type="button" title="Rasm qo'shish">
                <!-- SVG rasm ikonkasi -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>

            <!-- Yashirin file input (galereyadan rasm tanlash) -->
            <input type="file" class="file-input" id="fileInput" accept="image/*">
        </div>
    </div>

    <!-- O'ng burchakdagi yuborish tugmasi -->
    <button class="send-button">
        Yuborish
        <div class="send-icon">↑</div>
    </button>

    <script>
        const imageButton = document.getElementById('imageButton');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');

        // Ikonka bosilganda file inputni ochish
        imageButton.addEventListener('click', () => {
            fileInput.click();
        });

        // Rasm tanlanganda nomini ko'rsatish
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileName.textContent = file.name;
            } else {
                fileName.textContent = '';
            }
        });
    </script>

</body>
</html>
