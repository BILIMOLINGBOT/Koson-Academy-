<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Profil - Threads Style</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        .mobile-container{width:100%;max-width:420px;padding:20px 20px 200px;display:flex;flex-direction:column;align-items:center}
        .profile-pic-wrapper{display:flex;justify-content:center;width:100%;margin:60px 0 20px}
        .profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#1c1c1e;border:3px solid #1c1c1e}
        .name{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
        .last-seen{color:#8e8e93;font-size:15px;margin-bottom:30px;text-align:center}
        .stats-container{display:flex;width:100%;justify-content:space-between;margin-bottom:30px;padding:0 10px}
        .stat-item{display:flex;flex-direction:column;align-items:center;flex:1}
        .stat-divider{width:1px;background:#2c2c2e;height:40px;align-self:center}
        .stat-number{font-size:20px;font-weight:600;margin-bottom:6px}
        .stat-label{color:#8e8e93;font-size:14px}
        .action-buttons{display:flex;width:100%;gap:10px;margin-bottom:30px}
        .btn-edit{flex:1;background:#fff;color:#000;border:none;border-radius:100px;padding:14px 0;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease;display:flex;justify-content:center;align-items:center;gap:8px}
        .btn-edit:active{opacity:.8;transform:scale(.98)}
        .btn-edit svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .btn-settings{background:#1c1c1e;border:none;border-radius:50%;width:50px;height:50px;flex-shrink:0;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:all .2s ease}
        .btn-settings:active{transform:scale(.95) rotate(45deg);background:#2c2c2e}
        .btn-settings svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .tabs{display:flex;background:#1c1c1e;width:100%;border-radius:20px;padding:4px;margin-bottom:10px}
        .tab-item{color:#8e8e93;font-size:14px;padding:12px 6px;border-radius:16px;cursor:pointer;text-align:center;flex:1;transition:all .25s ease;user-select:none;font-weight:500;white-space:nowrap}
        .tab-item:active{transform:scale(.97)}
        .tab-item.active{background:#48484a;color:#fff;font-weight:600}
        
        .content-area{width:100%;padding:10px 0}
        
        /* Empty State */
        .empty-state{text-align:center;padding:40px 0;color:#8e8e93;font-size:16px;}
        .empty-icon{width:60px;height:60px;margin:0 auto 16px;border:2px solid #3f3f46;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#3f3f46}
        .empty-icon svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        
        /* Threads Style Posts */
        .posts-feed{display:none;width:100%;}
        .thread-post{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid #2c2c2e;width:100%;animation:fadeIn 0.4s ease;}
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        .thread-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#1c1c1e;flex-shrink:0;}
        .thread-content{flex:1;display:flex;flex-direction:column;}
        .thread-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
        .thread-name{font-weight:600;font-size:15px;color:#fff;display:flex;align-items:center;gap:5px;}
        .thread-time{color:#8e8e93;font-size:14px;}
        .thread-text{font-size:15px;color:#e5e5e5;line-height:1.45;margin-bottom:10px;word-break:break-word;}
        .thread-image{width:100%;max-height:350px;border-radius:12px;object-fit:cover;margin-bottom:12px;border:1px solid #2c2c2e;}
        .thread-actions{display:flex;gap:22px;color:#8e8e93;}
        .thread-action-btn{background:none;border:none;color:inherit;display:flex;align-items:center;gap:6px;cursor:pointer;padding:0;font-size:14px;transition:color 0.2s ease;}
        .thread-action-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}
        .thread-action-btn.liked{color:#ff3b30;}
        .thread-action-btn.liked svg{fill:#ff3b30;stroke:#ff3b30;}

        /* Floating Start Button */
        .start-btn{position:fixed;right:20px;bottom:110px;z-index:60;display:inline-flex;align-items:center;gap:8px;padding:14px 22px;background:linear-gradient(135deg,#fff 0%,#e5e5e5 100%);color:#000;border:none;border-radius:100px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(255,255,255,.15),0 2px 8px rgba(0,0,0,.4);transition:transform .2s ease;}
        .start-btn:active{transform:scale(.94);}
        .start-btn svg{width:20px;height:20px;stroke:#000;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}

        /* Modal Overlay (Yangi post oynasi) */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;backdrop-filter:blur(5px);}
        .modal-content{background:#18181b;width:100%;border-radius:24px 24px 0 0;padding:20px;display:flex;flex-direction:column;animation:slideUp 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.1);}
        @keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
        .modal-title{font-size:18px;font-weight:600;}
        .modal-close{background:none;border:none;color:#8e8e93;font-size:28px;line-height:1;cursor:pointer;}
        .modal-body{display:flex;gap:12px;margin-bottom:15px;}
        .post-textarea{background:transparent;border:none;color:#fff;font-size:16px;width:100%;outline:none;resize:none;min-height:80px;}
        .post-textarea::placeholder{color:#636366;}
        .modal-preview-img{display:none;width:100%;max-height:200px;border-radius:12px;object-fit:cover;margin:10px 0;border:1px solid #2c2c2e;}
        .modal-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid #2c2c2e;}
        .image-upload-btn{background:#2c2c2e;border:none;width:40px;height:40px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;color:#fff;}
        .submit-post-btn{background:#fff;color:#000;border:none;padding:10px 24px;border-radius:100px;font-weight:600;font-size:15px;cursor:pointer;opacity:0.5;pointer-events:none;transition:opacity 0.2s;}
        .submit-post-btn.active{opacity:1;pointer-events:auto;}

        /* Bottom Nav */
        .bottom-nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:92%;max-width:400px;background:rgba(24,24,27,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(63,63,70,.5);border-radius:2rem;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
        .bottom-nav-inner{display:flex;justify-content:space-around;align-items:center;padding:12px 8px}
        .nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;padding:0 12px;color:#a1a1aa;transition:transform .15s ease}
        .nav-btn.nav-active{color:#fff}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
        .nav-btn .nav-label{font-size:10px;font-weight:500}
        .nav-btn .nav-avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#1c1c1e}
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="profile-pic-wrapper">
        <img id="userPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" alt="Profil rasmi" class="profile-pic">
    </div>

    <h1 class="name" id="userName">
        Yuklanmoqda...
        <!-- Moviy tasdiq belgisi -->
        <svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#3b82f6"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 14.5l-4-4 1.4-1.4 2.6 2.6 6.6-6.6 1.4 1.4-8 8z"/></svg>
    </h1>
    <p class="last-seen" id="userStatus">Telegram foydalanuvchisi</p>

    <div class="stats-container">
        <div class="stat-item"><span class="stat-number" id="subsCount">250</span><span class="stat-label">Obunalar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="followersCount">10k</span><span class="stat-label">Obunachilar</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-number" id="postsCount">0</span><span class="stat-label">Postlar</span></div>
    </div>

    <div class="action-buttons" id="ownProfileActions">
        <button class="btn-edit" id="editBtn">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Tahrirlash
        </button>
        <button class="btn-settings" id="settingsBtn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
    </div>

    <div class="tabs" id="tabsContainer">
        <div class="tab-item active" data-tab="home">Bosh sahifa</div>
        <div class="tab-item" data-tab="posts">Postlar</div>
        <div class="tab-item" data-tab="video">Video</div>
    </div>

    <div class="content-area">
        <!-- Bo'sh xolat -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon" id="emptyIcon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
            <p id="contentText">Hali ma'lumot yo'q</p>
        </div>

        <!-- Postlar (Threads) ko'rinishi -->
        <div class="posts-feed" id="postsFeed"></div>
    </div>
</div>

<!-- Yangi post qo'shish tugmasi -->
<button class="start-btn" id="startBtn">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Post
</button>

<!-- YANGI POST OYNASI (MODAL) -->
<div class="modal-overlay" id="postModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Yangi post</h3>
            <button class="modal-close" id="closeModalBtn">×</button>
        </div>
        <div class="modal-body">
            <img id="modalAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" class="thread-avatar">
            <div style="flex:1;">
                <textarea class="post-textarea" id="postInput" placeholder="Nimalar bo'lyapti...?" rows="3"></textarea>
                <img id="postImagePreview" class="modal-preview-img">
            </div>
        </div>
        <div class="modal-footer">
            <button class="image-upload-btn" id="uploadImageBtn">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <input type="file" id="modalFileInput" accept="image/*" style="display:none;">
            <button class="submit-post-btn" id="submitPostBtn">Yuborish</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="nav-label">Uy</span>
        </a>
        <a href="reels.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="16" x2="22" y2="16"/><line x1="8" y1="2" x2="8" y2="8"/><line x1="16" y1="2" x2="16" y2="8"/><polygon points="10 12 15 14.5 10 17 10 12" fill="currentColor"/></svg>
            <span class="nav-label">Reels</span>
        </a>
        <a href="xabar.html" class="nav-btn">
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="nav-label">Xabar</span>
        </a>
        <a href="qidiruv.html" class="nav-btn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="nav-label">Qidiruv</span>
        </a>
        <a href="profil.html" class="nav-btn nav-active">
            <img id="navUserPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='40' r='18' fill='%233f3f46'/><ellipse cx='50' cy='90' rx='30' ry='22' fill='%233f3f46'/></svg>" alt="Profile" class="nav-avatar">
            <span class="nav-label">Profil</span>
        </a>
    </div>
</nav>

<script>
const tg = window.Telegram?.WebApp;
if(tg){
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#000000');
    tg.setBackgroundColor('#000000');
}

// Telegram Foydalanuvchi ma'lumotlarini yuklash
const u = tg?.initDataUnsafe?.user;
if(u){
    document.getElementById('userName').innerHTML = `${u.first_name || 'Foydalanuvchi'} ${u.last_name || ''} <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#3b82f6;margin-left:4px;"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1 14.5l-4-4 1.4-1.4 2.6 2.6 6.6-6.6 1.4 1.4-8 8z"/></svg>`;
    document.getElementById('userStatus').textContent = u.username ? '@' + u.username : 'Telegram foydalanuvchisi';
    if(u.photo_url){
        document.getElementById('userPhoto').src = u.photo_url;
        document.getElementById('navUserPhoto').src = u.photo_url;
        document.getElementById('modalAvatar').src = u.photo_url;
    }
}

// Menyu tablari
const icons = {
    home: `<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
    posts: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    video: `<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`
};
const texts = {home: "Hali ma'lumot yo'q", posts: "Hali post yo'q", video: "Hali video yo'q"};

document.getElementById('tabsContainer').addEventListener('click', e => {
    const tab = e.target.closest('.tab-item');
    if(!tab) return;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const k = tab.dataset.tab;
    
    const feed = document.getElementById('postsFeed');
    const emptyState = document.getElementById('emptyState');

    // Agar postlar tab'ida bo'lsa va postlar mavjud bo'lsa
    if(k === 'posts' && feed.children.length > 0) {
        feed.style.display = 'block';
        emptyState.style.display = 'none';
    } else {
        feed.style.display = 'none';
        emptyState.style.display = 'block';
        document.getElementById('contentText').textContent = texts[k];
        document.getElementById('emptyIcon').innerHTML = icons[k];
    }
    tg?.HapticFeedback?.selectionChanged();
});


// YANGI POST YARATISH LOGIKASI
const postModal = document.getElementById('postModal');
const startBtn = document.getElementById('startBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const postInput = document.getElementById('postInput');
const submitPostBtn = document.getElementById('submitPostBtn');
const uploadImageBtn = document.getElementById('uploadImageBtn');
const modalFileInput = document.getElementById('modalFileInput');
const postImagePreview = document.getElementById('postImagePreview');

// Oynani ochish
startBtn.addEventListener('click', () => {
    tg?.HapticFeedback?.impactOccurred('light');
    postModal.style.display = 'flex';
    postInput.focus();
});

// Oynani yopish
closeModalBtn.addEventListener('click', () => {
    postModal.style.display = 'none';
});

// Input tekshirish (Yuborish tugmasini faollashtirish)
postInput.addEventListener('input', () => {
    if(postInput.value.trim().length > 0 || postImagePreview.style.display === 'block') {
        submitPostBtn.classList.add('active');
    } else {
        submitPostBtn.classList.remove('active');
    }
});

// Rasm yuklash
uploadImageBtn.addEventListener('click', () => {
    modalFileInput.click();
});

modalFileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (e) => {
            postImagePreview.src = e.target.result;
            postImagePreview.style.display = 'block';
            submitPostBtn.classList.add('active');
        };
        reader.readAsDataURL(file);
    }
});

// Postni "Yuborish"
submitPostBtn.addEventListener('click', () => {
    const text = postInput.value.trim();
    const hasImage = postImagePreview.style.display === 'block';
    if(!text && !hasImage) return;

    tg?.HapticFeedback?.impactOccurred('heavy');

    const userName = document.getElementById('userName').textContent.trim();
    const userAvatar = document.getElementById('userPhoto').src;

    // Threads uslubidagi yangi post HTML'i
    const postHTML = `
        <div class="thread-post">
            <img src="${userAvatar}" class="thread-avatar">
            <div class="thread-content">
                <div class="thread-header">
                    <span class="thread-name">${userName}</span>
                    <span class="thread-time">Hozir</span>
                </div>
                ${text ? `<p class="thread-text">${text.replace(/\n/g, '<br>')}</p>` : ''}
                ${hasImage ? `<img src="${postImagePreview.src}" class="thread-image">` : ''}
                
                <div class="thread-actions">
                    <button class="thread-action-btn" onclick="this.classList.toggle('liked'); tg?.HapticFeedback?.impactOccurred('light');">
                        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 0
                    </button>
                    <button class="thread-action-btn">
                        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg> 0
                    </button>
                    <button class="thread-action-btn">
                        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    </button>
                </div>
            </div>
        </div>
    `;

    // Yangi postni lenta (feed) ga qo'shish
    const feed = document.getElementById('postsFeed');
    feed.insertAdjacentHTML('afterbegin', postHTML);

    // Postlar tab'iga avtomatik o'tish
    document.querySelector('[data-tab="posts"]').click();

    // Postlar sonini oshirish
    let count = parseInt(document.getElementById('postsCount').textContent);
    document.getElementById('postsCount').textContent = count + 1;

    // Modalni tozalash va yopish
    postInput.value = '';
    postImagePreview.style.display = 'none';
    postImagePreview.src = '';
    modalFileInput.value = '';
    submitPostBtn.classList.remove('active');
    postModal.style.display = 'none';
});

</script>
</body>
</html>
