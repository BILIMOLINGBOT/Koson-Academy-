<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 114px; /* Logotip 50px pastga tushirilgan */
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Zamonaviy input konteyneri (input + rasm ikonkasi) */
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: #121212; /* Yumshoq qora fon */
            border: 1px solid #222222;
            border-radius: 24px;
            padding: 6px 8px 6px 18px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        /* Inputga fokus bo'lganda konteyner effekti */
        .input-wrapper:focus-within {
            border-color: #4a90e2;
            background-color: #161616;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 17px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2;
            font-family: inherit;
            padding: 8px 0;
        }

        .text-input::placeholder {
            color: #555555;
        }

        /* Rasm ikonkasi tugmasi */
        .image-btn {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border: none;
            background-color: transparent;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #888888;
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
        }

        .image-btn:hover {
            background-color: #1e1e1e;
            color: #4a90e2;
        }

        .image-btn:active {
            transform: scale(0.9);
        }

        .image-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Yashirin file input */
        .file-input {
            display: none;
        }

        /* Tanlangan rasmning kichik ko'rinishi (preview) */
        .preview {
            display: none;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
            margin-right: 4px;
            border: 1px solid #333;
        }

        .preview.active {
            display: block;
        }

        /* Pastki o'ng burchakdagi "Island" yuborish tugmasi */
        .send-button {
            position: absolute;
            bottom: 30px;
            right: 25px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* Tugma ichidagi dumaloq strelka */
        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>

        <!-- Zamonaviy input konteyneri -->
        <div class="input-wrapper">
            <!-- Tanlangan rasm preview -->
            <img class="preview" id="preview" alt="preview">

            <input type="text" class="text-input" id="textInput" placeholder="Xabar yozing..." autofocus>

            <!-- Rasm ikonkasi -->
            <button class="image-btn" id="imageBtn" type="button" title="Rasm qo'shish">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <path d="M21 15l-5-5L5 21"></path>
                </svg>
            </button>

            <!-- Yashirin file input -->
            <input type="file" id="fileInput" class="file-input" accept="image/*">
        </div>
    </div>

    <!-- O'ng burchakdagi yuborish tugmasi -->
    <button class="send-button">
        Yuborish
        <div class="send-icon">↑</div>
    </button>

    <script>
        const imageBtn = document.getElementById('imageBtn');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');

        // Ikonka bosilganda galereya/fayl tanlash oynasini ochish
        imageBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // Rasm tanlanganda preview ko'rsatish
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.src = ev.target.result;
                    preview.classList.add('active');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>

</body>
</html>
