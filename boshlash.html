<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi quote UI - Yangilangan</title>
    <!-- Ikonkalar uchun FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px; 
            background-color: #000000;
            height: 100%;
            position: relative;
            overflow-y: auto;
        }

        /* Header qismi vertikal joylashtirildi */
        .header {
            display: flex;
            flex-direction: column;
            padding: 16px 20px 24px;
            border-bottom: 1px solid #151515;
        }

        /* Yuqori qator: tugmalar ham pastga tushirildi */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;   /* Orqaga qaytish va Ulashish tugmalari pastga */
        }

        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        /* "Yangi quote" sarlavhasi tugmalardan 90px pastda */
        .title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-top: 90px;
            padding-bottom: 4px;
        }

        .share-btn {
            background: none;
            border: none;
            color: #666666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .content {
            padding: 20px;
        }

        .input-section {
            display: flex;
            margin-bottom: 24px;
        }

        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 15px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
            flex-shrink: 0;
        }

        .thread-line {
            width: 2px;
            flex-grow: 1;
            background-color: #1a1a1a;
            margin-top: 8px;
            min-height: 30px;
        }

        .input-container {
            flex-grow: 1;
            padding-top: 10px;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 17px;
            resize: none;
            outline: none;
            min-height: 90px;
        }

        textarea::placeholder {
            color: #666666;
        }

        .add-image-btn {
            width: 100%;
            background-color: #0f0f0f;
            border: none;
            color: #666666;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-image-btn:hover {
            background-color: #1a1a1a;
        }

        #imagePreviewContainer {
            margin-top: 10px;
            display: none;
            position: relative;
        }

        #imagePreview {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            max-height: 300px;
            border: 1px solid #1a1a1a;
        }

        .remove-image-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header: tugmalar ham pastga tushirildi -->
        <header class="header">
            <div class="header-top">
                <button class="back-btn"><i class="fas fa-chevron-left"></i></button>
                <button class="share-btn">Ulashish</button>
            </div>
            <h1 class="title">Yangi quote</h1>
        </header>

        <main class="content">
            <div class="input-section">
                <div class="avatar-container">
                    <img src="https://i.pravatar.cc/150?img=11" alt="Avatar" class="avatar">
                    <div class="thread-line"></div>
                </div>
                
                <div class="input-container">
                    <textarea placeholder="Nima haqida yozmoqchisiz?"></textarea>
                    
                    <div id="imagePreviewContainer">
                        <img id="imagePreview" src="" alt="Tanlangan rasm">
                        <button class="remove-image-btn" id="removeImageBtn"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            </div>

            <input type="file" id="imageInput" accept="image/*" style="display: none;">

            <button class="add-image-btn" id="addImageBtn">
                <i class="far fa-image"></i> Rasm qo'shish
            </button>
        </main>
    </div>

    <script>
        const addImageBtn = document.getElementById('addImageBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImageBtn = document.getElementById('removeImageBtn');

        addImageBtn.addEventListener('click', () => {
            imageInput.click();
        });

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreviewContainer.style.display = 'block';
                    addImageBtn.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', () => {
            imageInput.value = '';
            imagePreview.src = '';
            imagePreviewContainer.style.display = 'none';
            addImageBtn.style.display = 'flex';
        });
    </script>
</body>
</html>
