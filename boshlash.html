<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive UI Design</title>
    <style>
        /* Umumiy sozlamalar va qora fon */
        body {
            margin: 0;
            padding: 0;
            background-color: #030303; /* To'q qora fon */
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: relative; /* Tugmani to'g'ri joylashtirish uchun */
        }

        /* Yuqori qism: Logotip va matn maydoni konteyneri */
        .header {
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-top: 114px; 
            gap: 15px;
        }

        /* 'j' harfi joylashgan ko'k dumaloq logotip */
        .logo {
            width: 42px;
            height: 42px;
            background-color: #0c3866; /* To'q ko'k rang */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            padding-bottom: 3px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Zamonaviy Input qutisi */
        .input-wrapper {
            display: flex;
            align-items: center;
            flex: 1; /* Qolgan barcha bo'sh joyni egallaydi */
            background-color: #1a1a1a; /* To'q kulrang fon */
            border-radius: 24px; /* Yaloq (yumaloq) burchaklar */
            padding: 10px 16px;
            border: 1px solid #333333; /* Xira ramka */
            transition: border 0.3s ease, background-color 0.3s ease;
        }

        /* Input ichiga bosilganda (focus) qutining o'zgarishi */
        .input-wrapper:focus-within {
            border-color: #4a90e2; /* Fokus bo'lganda ko'k ramka */
            background-color: #222222;
        }

        /* Matn yozish maydoni */
        .text-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            width: 100%;
            outline: none;
            caret-color: #4a90e2; /* Matn yozishda chiqadigan kursorning ko'k rangi */
            font-family: inherit;
        }

        .text-input::placeholder {
            color: #666666; /* Yozishdan oldin ko'rinib turadigan xira matn rangi */
        }

        /* Rasm yuklash ikonkasi (tugmasi) */
        .image-upload-label {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-left: 10px;
            color: #888888;
            padding: 4px;
            border-radius: 50%;
            transition: color 0.2s ease, background-color 0.2s ease;
        }

        .image-upload-label:hover {
            color: #ffffff;
            background-color: #333333;
        }

        .image-upload-label svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Asl input(file) ni yashiramiz, u label orqali chaqiriladi */
        #file-upload {
            display: none;
        }

        /* Pastki o'ng burchakdagi "Island" (kapsula) yuborish tugmasi */
        .send-button {
            position: absolute;
            bottom: 30px;
            right: 25px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 50px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s ease, background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .send-button:hover {
            transform: scale(1.05);
            background-color: #f5f5f5;
        }

        .send-button:active {
            transform: scale(0.95);
        }
        
        .send-icon {
            background-color: #000000;
            color: #ffffff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">j</div>
        
        <!-- Zamonaviy input qutisi -->
        <div class="input-wrapper">
            <input type="text" class="text-input" placeholder="Xabar yozing..." autofocus>
            
            <!-- Rasm tanlash uchun ikonka -->
            <label for="file-upload" class="image-upload-label" title="Rasm yuborish">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
            </label>
            <!-- Haqiqiy rasm yuklovchi yashirin input -->
            <input type="file" id="file-upload" accept="image/*">
        </div>

    </div>

    <!-- O'ng burchakdagi yuborish tugmasi -->
    <button class="send-button">
        Yuborish
        <div class="send-icon">↑</div>
    </button>

</body>
</html>
