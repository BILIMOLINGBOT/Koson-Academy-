<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jonli Efir</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        /* Kamera ekrani */
        #camera-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            transform: scaleX(-1);
        }

        /* Ustki qatlam (UI) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px) 16px;
            pointer-events: none;
        }

        /* Yuqori qism */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 90px;
            pointer-events: auto;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-chip {
            display: flex;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 4px 12px 4px 4px;
            gap: 8px;
        }

        .profile-chip img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Obuna bo'lish tugmasi */
        .subscribe-btn {
            background-color: #0095f6;
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
        }

        .subscribe-btn:active {
            opacity: 0.8;
            transform: scale(0.96);
        }

        .subscribe-btn.hidden {
            display: none;
        }

        .live-badge {
            background-color: #ff3b30;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .viewers-badge {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
        }

        .close-btn .stop-icon {
            width: 14px;
            height: 14px;
            background-color: white;
            border-radius: 3px;
        }

        /* O'ng tomon tugmalari */
        .side-tools {
            position: absolute;
            right: 16px;
            top: 180px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            pointer-events: auto;
        }

        .tool-btn {
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tool-btn:active {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .tool-btn.muted {
            background-color: #ff3b30;
        }

        .tool-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Pastki qism (Xabar yozish) */
        .bottom-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            margin-bottom: 10px;
        }

        .chat-input {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 14px 20px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .chat-input::placeholder {
            color: #e5e5ea;
        }

        .share-btn {
            width: 48px;
            height: 48px;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            flex-shrink: 0;
        }

        .share-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ===== Yuborilgan xabarlar ro'yxati ===== */
        .messages {
            position: absolute;
            left: 16px;
            bottom: 90px;
            width: calc(100% - 90px);
            max-height: 45vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 9;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .messages::-webkit-scrollbar {
            display: none;
        }

        /* Bubble: avatar + matn */
        .message-bubble {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            align-self: flex-start;
            max-width: 100%;
            animation: msgIn 0.25s ease-out;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            background-color: #1c1c1e;
        }

        .msg-content {
            background-color: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            padding: 7px 12px;
            border-radius: 14px;
            max-width: 100%;
            min-width: 0;
        }

        .msg-author {
            display: block;
            color: #6bb6ff;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 2px;
        }

        .msg-text {
            color: white;
            font-size: 14px;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Yuborilgan xabarlar -->
    <div class="messages" id="messages"></div>

    <div class="overlay">
        <div class="top-bar">
            <div class="header-left">
                <div class="profile-chip">
                    <img id="liveUserPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/></svg>" alt="User">
                    <div class="profile-info">
                        <span class="profile-name" id="liveUserName">Yuklanmoqda...</span>
                    </div>
                </div>
                <button class="subscribe-btn" id="subscribeBtn">Obuna bo'lish</button>
                <div class="live-badge">
                    <div class="live-dot"></div>
                    LIVE
                </div>
                <div class="viewers-badge">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    1
                </div>
            </div>

            <button class="close-btn" id="closeLiveBtn">
                <div class="stop-icon"></div>
            </button>
        </div>

        <div class="side-tools">
            <button class="tool-btn" id="micBtn" aria-label="Mikrofon">
                <svg id="micIconOn" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                <svg id="micIconOff" viewBox="0 0 24 24" style="display:none;"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>
            </button>

            <button class="tool-btn" id="effectsBtn">
                <svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8l-6.2 4.5 2.4-7.4L2 9.4h7.6z"/></svg>
            </button>
        </div>

        <div class="bottom-bar">
            <input type="text" class="chat-input" id="chatInput" placeholder="Xabar yozing...">
            <button class="share-btn" id="sendBtn" aria-label="Yuborish">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        const tgUser = tg?.initDataUnsafe?.user;

        if (tg) {
            tg.ready();
            tg.expand();

            if (tgUser) {
                const fullName = tgUser.first_name || 'Foydalanuvchi';
                document.getElementById('liveUserName').textContent = fullName;

                if (tgUser.photo_url) {
                    document.getElementById('liveUserPhoto').src = tgUser.photo_url;
                }
            }
        }

        // Foydalanuvchi ma'lumotlari (xabar bubble uchun)
        const myName = tgUser?.first_name || 'Siz';
        const myPhoto = tgUser?.photo_url || null;

        // Zaxira avatar (rasm bo'lmasa)
        const fallbackAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/><circle cx='50' cy='38' r='18' fill='%23555'/><path d='M15 95c0-20 16-32 35-32s35 12 35 32z' fill='%23555'/></svg>";

        document.getElementById('closeLiveBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('heavy');
            window.location.href = 'profil.html';
        });

        // ===== Mikrofon =====
        let isMicOn = false;
        const micBtn = document.getElementById('micBtn');
        const micIconOn = document.getElementById('micIconOn');
        const micIconOff = document.getElementById('micIconOff');

        micBtn.addEventListener('click', () => {
            isMicOn = !isMicOn;
            tg?.HapticFeedback?.impactOccurred('light');
            if (isMicOn) {
                micBtn.classList.remove('muted');
                micIconOn.style.display = 'block';
                micIconOff.style.display = 'none';
            } else {
                micBtn.classList.add('muted');
                micIconOn.style.display = 'none';
                micIconOff.style.display = 'block';
            }
        });

        // ===== Obuna bo'lish =====
        const subscribeBtn = document.getElementById('subscribeBtn');
        subscribeBtn.addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('medium');
            subscribeBtn.classList.add('hidden');
        });

        // ===== Xabar yuborish =====
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messages');

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Bubble wrapper
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            // Avatar rasmi (Telegram WebApp API dan)
            const avatar = document.createElement('img');
            avatar.className = 'msg-avatar';
            avatar.src = myPhoto || fallbackAvatar;
            avatar.alt = myName;
            // Rasm yuklanmasa — zaxira avatar
            avatar.onerror = () => { avatar.src = fallbackAvatar; };

            // Matn konteyneri
            const content = document.createElement('div');
            content.className = 'msg-content';

            // Muallif ismi
            const author = document.createElement('span');
            author.className = 'msg-author';
            author.textContent = myName;

            // Xabar matni
            const textEl = document.createElement('span');
            textEl.className = 'msg-text';
            textEl.textContent = text;

            content.appendChild(author);
            content.appendChild(textEl);
            bubble.appendChild(avatar);
            bubble.appendChild(content);
            messagesContainer.appendChild(bubble);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            chatInput.value = '';
            tg?.HapticFeedback?.impactOccurred('light');

            // 10 sekunddan keyin xabar yo'qoladi
            setTimeout(() => {
                if (bubble.parentNode) {
                    bubble.style.transition = 'opacity 0.4s, transform 0.4s';
                    bubble.style.opacity = '0';
                    bubble.style.transform = 'translateX(-10px)';
                    setTimeout(() => bubble.remove(), 400);
                }
            }, 10000);
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ===== Kamera =====
        const videoElement = document.getElementById('camera-feed');

        async function startCamera(facingMode = "user") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: facingMode },
                    audio: false
                });
                videoElement.srcObject = stream;
                videoElement.style.transform = facingMode === "user" ? "scaleX(-1)" : "scaleX(1)";
            } catch (err) {
                console.error("Kameraga ulanishda xatolik:", err);
            }
        }

        startCamera();
    </script>
</body>
</html>
