<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Qidiruv</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #000000);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* ISLAND NAV (notification.html bilan bir xil) */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s;position:relative}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
        .nav-badge{position:absolute;top:2px;right:25%;background:#ff2d55;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 5px;min-width:16px;text-align:center;line-height:1;border:2px solid #1c1c1e;z-index:10}
    </style>
</head>
<body class="text-white antialiased flex justify-center min-h-screen selection:bg-zinc-800 bg-black">

    <div class="w-full max-w-lg border-x border-zinc-900 min-h-screen flex flex-col relative bg-black pb-36 no-scrollbar">
        
        <!-- Header - Telegram Fullscreen tugmalariga moslangan -->
        <header class="sticky top-0 z-40 bg-black/80 backdrop-blur-xl border-b border-zinc-900 flex items-end px-4 pb-4" style="padding-top: 90px;">
            <h1 class="text-3xl font-bold tracking-tight text-white">Qidiruv</h1>
        </header>

        <!-- Qidiruv maydoni -->
        <div class="p-4 w-full">
            <div class="bg-zinc-900 rounded-xl px-4 py-3 flex items-center w-full">
                <svg class="w-5 h-5 text-zinc-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" class="bg-transparent border-none text-white text-base w-full focus:outline-none placeholder-zinc-500" placeholder="Qidirish...">
            </div>
        </div>

    </div>

    <!-- OROLCHA NAVIGATSIYA (notification.html bilan bir xil) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
            <a href="notification.html" class="nav-btn nav-inactive" id="navNotifBtn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-label">Bildirishnoma</span></a>
            <a href="qidiruv.html" class="nav-btn nav-active"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
            <a href="profil.html" class="nav-btn nav-inactive" id="navProfileLink"><span id="navAvatarSlot"></span><span class="nav-label">Profil</span></a>
        </div>
    </nav>

    <script>
        /* ================= DB VA SESSIYA ================= */
        const NOTIF_KEY = 'notifications';
        const DB = {
            _K: 'luz_users',
            _S: 'luz_current_user',
            getCurrentUser(){
                const id = localStorage.getItem(this._S);
                if (!id) return null;
                try {
                    const users = JSON.parse(localStorage.getItem(this._K)) || [];
                    return users.find(u => u.userId === id) || null;
                } catch { return null; }
            }
        };

        const currentUser = DB.getCurrentUser();
        // Agar tizimga kirmagan bo'lsa authorization ga o'tkazish
        if (!currentUser) window.location.href = 'authorization.html';

        /* ================= NAV AVATAR ================= */
        const navAvatarSlot = document.getElementById('navAvatarSlot');
        if (currentUser && navAvatarSlot) {
            const cuName = [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'Foydalanuvchi';
            const cuInit = cuName.trim().charAt(0).toUpperCase() || 'F';
            if (currentUser.photo_url) {
                navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
            } else {
                navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;
            }
        }

        /* ================= BILDIRISHNOMALAR BADGE ================= */
        function updateNotificationBadgeLocal() {
            const btn = document.getElementById('navNotifBtn');
            if (!btn) return;
            let unreadCount = 0;
            try {
                const list = JSON.parse(localStorage.getItem(NOTIF_KEY)) || [];
                unreadCount = list.filter(n => n.recipientId === currentUser?.userId && !n.isRead).length;
            } catch {}
            let badge = document.getElementById('notifBadge');
            if (unreadCount > 0) {
                if (!badge) {
                    badge = document.createElement('div');
                    badge.id = 'notifBadge';
                    badge.className = 'nav-badge';
                    btn.appendChild(badge);
                }
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            } else if (badge) {
                badge.remove();
            }
        }

        updateNotificationBadgeLocal();
        window.addEventListener('storage', (e) => { if (e.key === NOTIF_KEY) updateNotificationBadgeLocal(); });
        window.addEventListener('luz_notifs_updated', updateNotificationBadgeLocal);

        /* ================= TELEGRAM WEB APP VA ORQAGA QAYTISH ================= */
        document.addEventListener("DOMContentLoaded", function() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                if (tg.requestFullscreen) tg.requestFullscreen();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
                
                // Telegramning yuqori chap burchagidagi "Orqaga" (Back) tugmasini ko'rsatish
                tg.BackButton.show();
                tg.BackButton.onClick(function() {
                    window.location.href = 'index.html';
                });
            }

            // Brauzer va Android apparat orqaga qaytish tugmasini nazorat qilish
            window.history.pushState({ page: 'qidiruv' }, "", "");
            window.onpopstate = function(event) {
                window.location.href = 'index.html';
            };
        });
    </script>
</body>
</html>
