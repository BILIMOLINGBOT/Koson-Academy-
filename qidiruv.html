<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - L.uz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000; color: #fff; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 600px; border: 1px solid #2f3336; min-height: 100vh; }
    .header { padding: 20px; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; font-weight: 700; }
    .logout-btn { background: transparent; border: 1px solid #536471; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 700; }
    .logout-btn:hover { background: rgba(255,255,255,0.1); }
    .profile-card { padding: 30px; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #1da1f2, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; margin-bottom: 20px; }
    .name { font-size: 23px; font-weight: 700; margin-bottom: 5px; }
    .username { color: #8b98a5; font-size: 15px; margin-bottom: 20px; }
    .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2f3336; }
    .info-label { color: #8b98a5; font-size: 14px; }
    .info-value { font-weight: 600; font-size: 14px; }
    .user-id-highlight { color: #1da1f2; font-size: 16px; font-weight: 700; padding: 15px; background: #16181c; border-radius: 12px; margin: 20px 0; text-align: center; border: 1px solid #2f3336; }
    .error-box { padding: 40px; text-align: center; }
    .error-box h2 { margin-bottom: 15px; }
    .error-box a { color: #1da1f2; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Profil</h1>
      <button class="logout-btn" id="logoutBtn">Chiqish</button>
    </div>
    <div id="profileContent"></div>
  </div>

  <script>
    const USERS_KEY = 'luz_users';
    const SESSION_KEY = 'luz_current_user';

    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
      catch { return []; }
    }

    function getCurrentUser() {
      const id = localStorage.getItem(SESSION_KEY);
      if (!id) return null;
      return getUsers().find(u => u.userId === id) || null;
    }

    const user = getCurrentUser();
    const container = document.getElementById('profileContent');

    if (!user) {
      container.innerHTML = `
        <div class="error-box">
          <h2>Foydalanuvchi topilmadi</h2>
          <p>Iltimos, avval <a href="register.html">ro'yxatdan o'ting</a>.</p>
        </div>`;
      document.getElementById('logoutBtn').style.display = 'none';
    } else {
      const initials = (user.firstName[0] + user.lastName[0]).toUpperCase();
      const joined = new Date(user.createdAt).toLocaleDateString('uz-UZ');

      container.innerHTML = `
        <div class="profile-card">
          <div class="avatar">${initials}</div>
          <div class="name">${user.firstName} ${user.lastName}</div>
          <div class="username">@${user.username}</div>

          <div class="user-id-highlight">
            🆔 ${user.userId}
          </div>

          <div class="info-row">
            <span class="info-label">Telefon</span>
            <span class="info-value">${user.phone}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Username</span>
            <span class="info-value">@${user.username}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Noyob ID</span>
            <span class="info-value">${user.userId}</span>
          </div>
          <div class="info-row">
            <span class="info-label">Ro'yxatdan o'tdi</span>
            <span class="info-value">${joined}</span>
          </div>
        </div>
      `;
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(SESSION_KEY);
      window.location.href = 'register.html';
    });
  </script>
</body>
</html>
