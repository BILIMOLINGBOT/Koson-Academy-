<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qidiruv va Ikonkalar</title>
<style>
  body {
    background-color: #000;
    color: #fff;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .search-container {
    background-color: #1c1c1e;
    border-radius: 10px;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 400px;
    margin-bottom: 20px;
  }

  .search-icon {
    color: #8e8e93;
    margin-right: 10px;
  }

  .search-input {
    background: none;
    border: none;
    color: #fff;
    font-size: 16px;
    width: 100%;
    outline: none;
  }
  
  .search-input::placeholder {
      color: #8e8e93;
  }

  .icons-container {
    display: flex;
    gap: 20px;
  }

  .icon-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .icon-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 8px;
  }

  .icon-blue {
    background-color: #007aff;
  }

  .icon-white {
    background-color: #e5e5ea;
    color: #000;
    font-size: 24px;
    font-weight: bold;
  }

  .icon-label {
    font-size: 12px;
  }
  
  /* Ikonkalar uchun oddiy SVG lar */
  .bookmark-svg {
      fill: #fff;
      width: 24px;
      height: 24px;
  }
</style>
</head>
<body>

<div class="search-container">
  <div class="search-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
    </svg>
  </div>
  <input type="text" class="search-input" placeholder="Qidirish...">
</div>

<div class="icons-container">
  <div class="icon-item">
    <div class="icon-circle icon-blue">
        <svg class="bookmark-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
        </svg>
    </div>
    <span class="icon-label">Saqlangan</span>
  </div>

  <div class="icon-item">
    <div class="icon-circle icon-white">
      N
    </div>
    <span class="icon-label">NV</span>
  </div>
</div>

</body>
</html>
