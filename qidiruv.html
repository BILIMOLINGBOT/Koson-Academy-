<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card‑free registration · four steps</title>
  <style>
    /* Global reset & full‑page background */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;          /* soft, even background – no panel */
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
      color: #1e293b;
    }

    /* Main container – no card, no box, no shadow, no border */
    .registration-container {
      width: 100%;
      max-width: 420px;             /* comfortable width, not a card */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* everything sits directly on the page background */
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }

    /* heading – centered, clean */
    .step-heading {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #0f172a;
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
      background: transparent;
    }

    /* form wrapper – no container styling, just layout */
    .step-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;                 /* spacing between inputs and button */
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
      padding: 0;
    }

    /* input group – direct on background */
    .input-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      background: transparent;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
      margin-left: 0.25rem;
      background: transparent;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-family: inherit;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;          /* rounded input — allowed, only inputs/buttons */
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      color: #0f172a;
      box-shadow: none;
    }

    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .input-group input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    /* continue button – allowed styling, no card around it */
    .continue-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #1e293b;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 0.5rem;
      letter-spacing: 0.01em;
      box-shadow: none;
    }

    .continue-btn:hover {
      background: #0f172a;
    }

    .continue-btn:active {
      transform: scale(0.98);
    }

    .continue-btn:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }

    /* subtle step indicator – no card, just text */
    .step-indicator {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #64748b;
      letter-spacing: 0.3px;
      text-align: center;
      font-weight: 400;
      background: transparent;
    }

    /* responsive adjustments */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .registration-container {
        max-width: 100%;
      }

      .step-heading {
        font-size: 1.7rem;
        margin-bottom: 1.75rem;
      }

      .input-group input {
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
      }

      .continue-btn {
        padding: 0.85rem 1.2rem;
        font-size: 0.95rem;
      }
    }

    /* ensure no accidental card/box on any step */
    .card, .panel, .boxed, [class*="card"] {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
    }
  </style>
</head>
<body>
  <div class="registration-container" id="registrationContainer">
    <!-- step content will be rendered here by JavaScript -->
  </div>

  <script>
    (function() {
      // ----- registration data store (preserved across steps) -----
      const registrationData = {
        fullName: '',
        email: '',
        password: '',
        company: '',
        role: '',
        interests: ''
      };

      // ----- step definitions (four steps, clean layout, no cards) -----
      const steps = [
        {
          title: 'Create your account',
          fields: [
            { name: 'fullName', label: 'Full name', type: 'text', placeholder: 'Alex Johnson', autocomplete: 'name' },
            { name: 'email', label: 'Email address', type: 'email', placeholder: 'alex@example.com', autocomplete: 'email' }
          ],
          buttonLabel: 'Continue'
        },
        {
          title: 'Set a password',
          fields: [
            { name: 'password', label: 'Password', type: 'password', placeholder: '••••••••', autocomplete: 'new-password' }
          ],
          buttonLabel: 'Continue'
        },
        {
          title: 'Your work',
          fields: [
            { name: 'company', label: 'Company', type: 'text', placeholder: 'Acme Inc.', autocomplete: 'organization' },
            { name: 'role', label: 'Role', type: 'text', placeholder: 'Product designer', autocomplete: 'organization-title' }
          ],
          buttonLabel: 'Continue'
        },
        {
          title: 'Almost there',
          fields: [
            { name: 'interests', label: 'What are you interested in?', type: 'text', placeholder: 'Design, AI, productivity…' }
          ],
          buttonLabel: 'Complete registration'
        }
      ];

      let currentStep = 0;   // 0-indexed (step 1 = index 0)

      // ----- DOM elements -----
      const container = document.getElementById('registrationContainer');

      // ----- helper: render the current step directly on the background -----
      function renderStep() {
        const step = steps[currentStep];
        if (!step) return;

        // Build the inner HTML – NO wrapping card, panel, box, or container with background.
        // Everything is placed directly inside .registration-container (which is transparent).
        let fieldsHtml = '';
        step.fields.forEach(field => {
          fieldsHtml += `
            <div class="input-group">
              <label for="field-${field.name}">${field.label}</label>
              <input 
                type="${field.type}" 
                id="field-${field.name}" 
                name="${field.name}" 
                placeholder="${field.placeholder}" 
                value="${registrationData[field.name] || ''}"
                autocomplete="${field.autocomplete || 'off'}"
                data-field="${field.name}"
              >
            </div>
          `;
        });

        // Full step markup – clean, minimal, no card container anywhere.
        const stepHtml = `
          <h1 class="step-heading">${step.title}</h1>
          <form class="step-form" id="stepForm" novalidate>
            ${fieldsHtml}
            <button type="submit" class="continue-btn" id="continueBtn">${step.buttonLabel}</button>
          </form>
          <div class="step-indicator">Step ${currentStep + 1} of ${steps.length}</div>
        `;

        container.innerHTML = stepHtml;

        // ----- attach event listeners (no card, just form behaviour) -----
        const form = document.getElementById('stepForm');
        const continueBtn = document.getElementById('continueBtn');

        // Preserve input values as the user types (optional, but ensures data stays even before submit)
        const inputs = form.querySelectorAll('input');
        inputs.forEach(input => {
          input.addEventListener('input', (e) => {
            const fieldName = e.target.dataset.field;
            if (fieldName) {
              registrationData[fieldName] = e.target.value;
            }
          });
        });

        // Handle form submission (continue button)
        form.addEventListener('submit', (e) => {
          e.preventDefault();

          // Update registrationData with current field values (in case input events didn't fire)
          inputs.forEach(input => {
            const fieldName = input.dataset.field;
            if (fieldName) {
              registrationData[fieldName] = input.value;
            }
          });

          // Simple validation (required fields are not empty)
          let isValid = true;
          for (let field of step.fields) {
            const value = registrationData[field.name]?.trim() || '';
            if (value === '') {
              isValid = false;
              // highlight the specific input without using a container box
              const inputEl = document.getElementById(`field-${field.name}`);
              if (inputEl) {
                inputEl.style.borderColor = '#ef4444';
                inputEl.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
                // remove highlight on next input
                inputEl.addEventListener('input', function removeError() {
                  this.style.borderColor = '#e2e8f0';
                  this.style.boxShadow = 'none';
                  this.removeEventListener('input', removeError);
                }, { once: true });
              }
            }
          }

          if (!isValid) return;

          // --- Move to next step or finish ---
          if (currentStep < steps.length - 1) {
            currentStep++;
            renderStep();   // re-render with new step
          } else {
            // Final step: show completion message (still no card)
            showCompletion();
          }
        });

        // Focus first input for better UX
        if (inputs.length > 0) {
          inputs[0].focus();
        }
      }

      // ----- final confirmation screen – still no card, just text on background -----
      function showCompletion() {
        // Clean, minimal completion UI – all centered directly on the page background
        container.innerHTML = `
          <h1 class="step-heading">You're all set 🎉</h1>
          <div style="width:100%; text-align:center; margin: 1.5rem 0 1rem;">
            <p style="font-size:1.1rem; color:#334155; margin-bottom:1rem;">
              Thanks, ${registrationData.fullName || 'friend'}!
            </p>
            <p style="font-size:0.95rem; color:#475569; line-height:1.6;">
              Your registration is complete.<br>
              We'll reach out at <strong>${registrationData.email || 'your email'}</strong>.
            </p>
          </div>
          <div class="step-indicator" style="margin-top:2.5rem;">Registration complete</div>
        `;
        // No buttons, no card – just confirmation directly on background
      }

      // ----- initial render (step 1) -----
      renderStep();

      // Optional: prevent accidental form submission with Enter on the whole page (only form handles)
      // (not needed, but safe)
    })();
  </script>
</body>
</html>
