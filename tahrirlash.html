<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background-color: #FFC069;
            border-radius: 50%;
            margin: 0 auto 40px;
            cursor: pointer; 
            background-size: cover; 
            background-position: center; 
            transition: opacity 0.2s;
            /* Ikonkani markazga joylashtirish uchun: */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar:hover {
            opacity: 0.8; 
        }

        /* Kamera ikonkasi dizayni */
        .camera-icon {
            width: 40px;
            height: 40px;
            fill: rgba(0, 0, 0, 0.4); /* Ikonka rangi (biroz shaffof qora) */
            transition: fill 0.2s;
        }

        .avatar:hover .camera-icon {
            fill: rgba(0, 0, 0, 0.7);
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: transparent;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: #fff;
        }

        input[type="text"]::placeholder {
            color: #666;
        }
        
        .filled-input {
             background-color: #1A1A1A !important;
             border: none !important;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            background-color: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Rasm tanlash uchun yashirin input -->
        <input type="file" id="avatar-input" accept="image/*" style="display: none;">
        
        <!-- Avatar qismi va Ikonka -->
        <div class="avatar" id="avatar-preview">
            <svg class="camera-icon" id="camera-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"></path>
            </svg>
        </div>

        <h2>Ismingiz nima?</h2>

        <div class="form-group">
            <label for="ism">Ism</label>
            <input type="text" id="ism" placeholder="Ism">
        </div>

        <div class="form-group">
            <label for="familiya">Familiya</label>
            <input type="text" id="familiya" class="filled-input" placeholder="Familiya">
        </div>

        <h2 style="margin-top: 40px;">Foydalanuvchi nomi tanlang</h2>
        <p class="subtitle">Boshqa foydalanuvchi ishlatayotgan nomini tanlay olmaysiz</p>

        <div class="form-group">
            <label for="username">Foydalanuvchi nomi</label>
            <input type="text" id="username" placeholder="Foydalanuvchi nomi">
        </div>

        <button class="submit-btn">Davom etish</button>
    </div>

    <!-- JavaScript qismi -->
    <script>
        const avatarPreview = document.getElementById('avatar-preview');
        const avatarInput = document.getElementById('avatar-input');
        const cameraIcon = document.getElementById('camera-icon');

        // Avatarga bosganda fayl tanlash darchasini ochish
        avatarPreview.addEventListener('click', () => {
            avatarInput.click();
        });

        // Fayl tanlanganda uni avatarga rasm qilib qo'yish
        avatarInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    // Tanlangan rasmni fon qilib o'rnatish
                    avatarPreview.style.backgroundImage = `url('${e.target.result}')`;
                    // Rasm qo'yilgandan keyin kamera ikonkasini yashirish
                    cameraIcon.style.display = 'none';
                }
                
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
