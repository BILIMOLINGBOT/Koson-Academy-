<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .avatar {
            width: 120px;
            height: 120px;
            background-color: #FFC069;
            border-radius: 50%;
            margin: 0 auto 40px;
            cursor: pointer; /* Sichqoncha ko'rsatkichi qo'l shakliga kiradi */
            background-size: cover; /* Rasm to'liq moslashishi uchun */
            background-position: center; /* Rasm markazda turishi uchun */
            transition: opacity 0.2s;
        }

        .avatar:hover {
            opacity: 0.8; /* Ustiga bosganda biroz xiralashadi */
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: transparent;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: #fff;
        }

        input[type="text"]::placeholder {
            color: #666;
        }
        
        .filled-input {
             background-color: #1A1A1A !important;
             border: none !important;
        }

        .subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            background-color: #fff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Rasm tanlash uchun yashirin input -->
        <input type="file" id="avatar-input" accept="image/*" style="display: none;">
        
        <!-- Avatar qismi -->
        <div class="avatar" id="avatar-preview"></div>

        <h2>Ismingiz nima?</h2>

        <div class="form-group">
            <label for="ism">Ism</label>
            <input type="text" id="ism" placeholder="Ism">
        </div>

        <div class="form-group">
            <label for="familiya">Familiya</label>
            <input type="text" id="familiya" class="filled-input" placeholder="Familiya">
        </div>

        <h2 style="margin-top: 40px;">Foydalanuvchi nomi tanlang</h2>
        <p class="subtitle">Boshqa foydalanuvchi ishlatayotgan nomini tanlay olmaysiz</p>

        <div class="form-group">
            <label for="username">Foydalanuvchi nomi</label>
            <input type="text" id="username" placeholder="Foydalanuvchi nomi">
        </div>

        <button class="submit-btn">Davom etish</button>
    </div>

    <!-- JavaScript qismi -->
    <script>
        const avatarPreview = document.getElementById('avatar-preview');
        const avatarInput = document.getElementById('avatar-input');

        // Avatarga bosganda fayl tanlash darchasini ochish
        avatarPreview.addEventListener('click', () => {
            avatarInput.click();
        });

        // Fayl tanlanganda uni avatarga rasm qilib qo'yish
        avatarInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    avatarPreview.style.backgroundImage = `url('${e.target.result}')`;
                }
                
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
