<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels / TikTok UI Design</title>
    <!-- Ikonkalar uchun FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Asosiy konteyner (Mobil ekran o'lchamida) */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background-color: #333;
            overflow: hidden;
        }

        /* Orqa fon rasmi / video */
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* O'ng tomondagi tugmalar paneli */
        .right-sidebar {
            position: absolute;
            bottom: 20px;
            right: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .action-item i {
            font-size: 28px;
            margin-bottom: 5px;
            filter: drop-shadow(0px 0px 3px rgba(0,0,0,0.6));
        }

        /* Profil rasmi va qo'shish tugmasi */
        .profile-container {
            position: relative;
            width: 45px;
            height: 45px;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .plus-btn {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0095f6; /* Moviy rang */
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid white;
        }

        .diamond-icon {
            color: #5ce1e6; /* Olmos rangi */
        }

        /* Pastki chap ma'lumotlar qismi */
        .bottom-info {
            position: absolute;
            bottom: 20px;
            left: 15px;
            color: white;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            width: calc(100% - 70px);
        }

        .username {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .caption {
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 400;
        }

        .audio-track {
            display: flex;
            align-items: center;
            font-size: 13px;
            gap: 8px;
        }

        .audio-track i {
            font-size: 12px;
        }

        /* Gradient effekti (yozuvlar aniq ko'rinishi uchun pastdan qorayish) */
        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Orqa fon uchun rasm. "src" qismini o'zingizning rasmingiz bilan almashtiring -->
        <img src="https://via.placeholder.com/400x800/333/fff?text=Video+Background" alt="Background" class="background-image">
        
        <!-- Yozuvlar aniq o'qilishi uchun qoramtir gradient -->
        <div class="overlay-gradient"></div>

        <!-- O'ng paneldagi ikonlar -->
        <div class="right-sidebar">
            <div class="profile-container">
                <img src="https://via.placeholder.com/100" alt="Profile" class="profile-pic">
                <div class="plus-btn">+</div>
            </div>
            
            <div class="action-item">
                <i class="fa-regular fa-heart"></i>
            </div>
            
            <div class="action-item">
                <i class="fa-solid fa-gem diamond-icon"></i>
            </div>
            
            <div class="action-item">
                <i class="fa-solid fa-comment-dots"></i>
            </div>
            
            <div class="action-item">
                <i class="fa-regular fa-bookmark"></i>
            </div>
            
            <div class="action-item">
                <i class="fa-solid fa-share"></i>
            </div>
        </div>

        <!-- Pastki qismdagi ma'lumotlar -->
        <div class="bottom-info">
            <div class="username">@muhammad_721</div>
            <div class="caption">Gayguy🖐🏻</div>
            <div class="audio-track">
                <i class="fa-solid fa-music"></i>
                <span>Original audio · Muhammad</span>
            </div>
        </div>
    </div>

</body>
</html>
