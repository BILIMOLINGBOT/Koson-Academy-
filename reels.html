<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels / TikTok Scroll UI (Yashirin tugmalar)</title>
    <!-- Ikonkalar uchun FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Asosiy scroll bo'ladigan konteyner */
        .feed-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            background-color: #000;
        }

        /* Scroll qatorini yashirish */
        .feed-container::-webkit-scrollbar {
            display: none;
        }

        /* Bitta video/post dizayni */
        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #333;
            overflow: hidden;
            scroll-snap-align: start;
            cursor: pointer; /* Bosish mumkinligini bildirish uchun */
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* O'ng tomondagi tugmalar paneli - Boshlang'ich holatda yashiringan */
        .right-sidebar {
            position: absolute;
            bottom: 20px;
            right: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 10;
            opacity: 0; /* Yashirin */
            visibility: hidden; /* Bosilmasligi uchun */
            transition: opacity 0.3s ease, visibility 0.3s ease; /* Silliq paydo bo'lish effekti */
        }

        /* JavaScript orqali qo'shiladigan klass - Tugmalarni ko'rsatadi */
        .right-sidebar.show {
            opacity: 1;
            visibility: visible;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        .action-item i {
            font-size: 28px;
            margin-bottom: 5px;
            filter: drop-shadow(0px 0px 3px rgba(0,0,0,0.6));
        }

        .profile-container {
            position: relative;
            width: 45px;
            height: 45px;
            margin-bottom: 15px;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
        }

        .plus-btn {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #0095f6;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid white;
        }

        .diamond-icon {
            color: #5ce1e6;
        }

        /* O'ng paneldagi ikonlar aniq ko'rinishi uchun yengil qorayish */
        .overlay-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 100%);
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="feed-container">

        <!-- 1-Video / Rasm -->
        <div class="app-container">
            <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Background" class="background-image">
            <div class="overlay-gradient"></div>
            
            <div class="right-sidebar">
                <div class="profile-container">
                    <img src="https://via.placeholder.com/100" alt="Profile" class="profile-pic">
                    <div class="plus-btn">+</div>
                </div>
                <div class="action-item"><i class="fa-regular fa-heart"></i></div>
                <div class="action-item"><i class="fa-solid fa-gem diamond-icon"></i></div>
                <div class="action-item"><i class="fa-solid fa-comment-dots"></i></div>
                <div class="action-item"><i class="fa-regular fa-bookmark"></i></div>
                <div class="action-item"><i class="fa-solid fa-share"></i></div>
            </div>
        </div>

        <!-- 2-Video / Rasm -->
        <div class="app-container">
            <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80" alt="Background" class="background-image">
            <div class="overlay-gradient"></div>
            
            <div class="right-sidebar">
                <div class="profile-container">
                    <img src="https://via.placeholder.com/100/ff0000" alt="Profile" class="profile-pic">
                    <div class="plus-btn">+</div>
                </div>
                <div class="action-item"><i class="fa-regular fa-heart"></i></div>
                <div class="action-item"><i class="fa-solid fa-gem diamond-icon"></i></div>
                <div class="action-item"><i class="fa-solid fa-comment-dots"></i></div>
                <div class="action-item"><i class="fa-regular fa-bookmark"></i></div>
                <div class="action-item"><i class="fa-solid fa-share"></i></div>
            </div>
        </div>

    </div>

    <!-- JS qismi: Bosganda tugmalarni ko'rsatish/yashirish -->
    <script>
        // Barcha post/videolarni topamiz
        const containers = document.querySelectorAll('.app-container');

        containers.forEach(container => {
            container.addEventListener('click', function(event) {
                // Agar foydalanuvchi to'g'ridan-to'g'ri tugmalarni ustiga bossa, ularni yashirib qo'ymaslik uchun shart:
                if (!event.target.closest('.right-sidebar')) {
                    const sidebar = this.querySelector('.right-sidebar');
                    // "show" klassini qo'shish yoki olib tashlash
                    sidebar.classList.toggle('show');
                }
            });
        });
    </script>

</body>
</html>
