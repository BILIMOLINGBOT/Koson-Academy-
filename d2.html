<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>1-Dars | O'zingizni tanishtiring</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #1C1C1E;
      --player-bg: #0A0A0A;
      --accent: #FFFFFF;
      --blue-active: #007AFF;
      --text-secondary: #8E8E93;
      --border-subtle: #2C2C2E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixed Header */
    .header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 0.5px solid #2C2C2E;
      height: 64px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 22px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active {
      background: rgba(255,255,255,0.15);
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    /* Scrollable Content */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 80px 20px 210px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      background-color: #000000;
    }

    .text-item {
      margin-bottom: 24px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .text-item.active {
      border-color: #FFFFFF;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .text-item.playing {
      border-color: #007AFF;
      background-color: rgba(0, 122, 255, 0.08);
    }

    .en {
      font-size: 18px;
      font-weight: 600;
      display: block;
      color: #FFFFFF;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .uz {
      font-size: 15px;
      color: var(--text-secondary);
      display: block;
      line-height: 1.4;
    }

    /* Fixed Player Bottom */
    .player-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--player-bg);
      padding: 16px 20px 28px;
      border-top: 1px solid #222;
      z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(10, 10, 10, 0.92);
    }

    .progress-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 18px;
    }

    .bar-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: #8E8E93;
      border-radius: 4px;
      transition: width 0.3s ease;
      position: relative;
    }

    .bar-dot {
      position: absolute;
      right: -6px;
      top: -5px;
      width: 14px;
      height: 14px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 500;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      max-width: 400px;
      margin: 0 auto;
    }

    .player-controls i {
      font-size: 22px;
      color: #CCC;
      cursor: pointer;
      transition: 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .player-controls i:active {
      transform: scale(0.9);
      color: #FFF;
      background: rgba(255,255,255,0.1);
    }

    .player-controls i.active-repeat {
      color: var(--blue-active);
      text-shadow: 0 0 12px rgba(0, 122, 255, 0.6);
    }

    .btn-play-pause {
      width: 68px;
      height: 68px;
      background: #1C1C1E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid #2C2C2E;
    }

    .btn-play-pause:active {
      transform: scale(0.94);
      background: #2C2C2E;
    }

    .btn-play-pause i {
      font-size: 28px;
      color: #FFF;
      padding: 0;
    }

    .player-controls i.fa-backward-step,
    .player-controls i.fa-forward-step {
      font-size: 26px;
    }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
  <h1>O'zingizni tanishtiring</h1>
</div>

<main class="content-scroll" id="contentArea">
  <!-- JavaScript orqali matnlar qo'shiladi -->
</main>

<div class="player-fixed">
  <div class="progress-box">
    <div class="bar-container" id="progressBarContainer">
      <div class="bar-fill" id="progressFill">
        <div class="bar-dot"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="currentTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>
  </div>

  <div class="player-controls">
    <i class="fas fa-arrows-rotate" id="repeatBtn" title="Takrorlash"></i>

    <i class="fas fa-backward-step" id="prevBtn" title="Oldingi"></i>

    <div class="btn-play-pause" id="playBtn">
      <i class="fas fa-play"></i>
    </div>

    <i class="fas fa-forward-step" id="nextBtn" title="Keyingi"></i>
  </div>
</div>

<script>
  (function() {
    const sentences = [
      ["My name is Ali.", "Mening ismim Ali."],
      ["I am 20 years old.", "Men 20 yoshdaman."],
      ["I was born in 2005.", "Men 2005-yilda tug'ilganman."],
      ["I am the youngest in my family.", "Men oilamda eng kichikman."],
      ["I live in Tashkent.", "Men Toshkentda yashayman."],
      ["My city is beautiful.", "Mening shahrim chiroyli."],
      ["I live near the park.", "Men bog' yaqinida yashayman."],
      ["I moved to this city last year.", "Men o'tgan yili bu shaharga ko'chib kelganman."],
      ["I have a big family.", "Mening katta oilam bor."],
      ["I have two brothers and one sister.", "Mening ikkita aka-ukam va bir opam bor."],
      ["My father is a teacher.", "Mening otam o'qituvchi."],
      ["I live with my parents.", "Men ota-onam bilan yashayman."],
      ["I study at State University.", "Men Davlat Universitetida o'qiyman."],
      ["I am a student.", "Men talabaman."],
      ["I study English.", "Men ingliz tilini o'qiyman."],
      ["I will graduate next year.", "Men kelgusi yil bitiruvchiman."],
      ["I want to be a programmer.", "Men dasturchi bo'lmoqchiman."],
      ["I like reading books.", "Men kitob o'qishni yoqtiraman."],
      ["I enjoy playing football.", "Men futbol o'ynashdan zavq olaman."],
      ["I love listening to music.", "Men musiqa tinglashni yaxshi ko'raman."],
      ["I am interested in technology.", "Men texnologiyaga qiziqaman."],
      ["I like watching movies.", "Men filmlar ko'rishni yoqtiraman."],
      ["My hobby is drawing.", "Mening xobbim — chizish."],
      ["I enjoy taking photos.", "Men suratga tushishdan zavq olaman."],
      ["I play chess in my free time.", "Men bo'sh vaqtda shaxmat o'ynayman."],
      ["I like green color.", "Men yashil rangni yoqtiraman."],
      ["I love pizza and burgers.", "Men pitsa va burgerlarni yaxshi ko'raman."],
      ["I like summer most.", "Men yozni eng ko'p yoqtiraman."],
      ["I enjoy traveling.", "Men sayohat qilishdan zavq olaman."],
      ["I like spending time with friends.", "Men do'stlar bilan vaqt o'tkazishni yoqtiraman."],
      ["I don't like waking up early.", "Men erta turishni yoqtirmayman."],
      ["I hate waiting in lines.", "Men navbat kutishdan nafratlanaman."],
      ["I don't like loud music.", "Men baland musiqani yoqtirmayman."],
      ["I dislike cold weather.", "Men sovuq ob-havoni yoqtirmayman."],
      ["I don't eat fish.", "Men baliq yemayman."],
      ["I am a friendly person.", "Men do'stona odamman."],
      ["I am hard-working.", "Men mehnatsevar odamman."],
      ["I am always happy.", "Men har doim baxtli odamman."],
      ["I am a good listener.", "Men yaxshi tinglovchiman."],
      ["I try to be honest.", "Men rostgo'y bo'lishga harakat qilaman."],
      ["I want to travel around the world.", "Men butun dunyo bo'ylab sayohat qilmoqchiman."],
      ["I want to learn three languages.", "Men uchta til o'rganmoqchiman."],
      ["I hope to find a good job.", "Men yaxshi ish topishni umid qilaman."],
      ["I dream of visiting Japan.", "Men Yaponiyaga borishni orzu qilaman."],
      ["I plan to open my own business.", "Men o'z biznesimni ochmoqchiman."]
    ];

    // Audio bazaviy URL
    const AUDIO_BASE_URL = 'http://intermediate-lime-8o8gf9vrr1.edgeone.app/audio/';

    const container = document.getElementById('contentArea');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const playIcon = playBtn.querySelector('i');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBarContainer = document.getElementById('progressBarContainer');

    let currentIdx = 0;
    let isRepeatMode = false;
    let textItems = [];
    let audioElements = [];
    let currentAudio = null;
    let isPlaying = false;
    let totalDuration = 0;
    let updateTimer = null;

    // Har bir gap uchun audio element yaratish
    function createAudioElements() {
      audioElements = sentences.map((_, index) => {
        const audio = new Audio();
        audio.src = `${AUDIO_BASE_URL}${index + 1}.mp3`;
        audio.preload = 'auto';
        return audio;
      });
    }

    // Jami davomiylikni hisoblash (barcha audio yuklangandan keyin)
    function calculateTotalDuration() {
      let loadedCount = 0;
      totalDuration = 0;
      
      audioElements.forEach((audio, index) => {
        audio.addEventListener('loadedmetadata', () => {
          totalDuration += audio.duration || 0;
          loadedCount++;
          
          if (loadedCount === audioElements.length) {
            totalTimeSpan.textContent = formatTime(totalDuration);
          }
        });
        
        // Agar metadata allaqachon yuklangan bo'lsa
        if (audio.duration && !isNaN(audio.duration)) {
          totalDuration += audio.duration;
          loadedCount++;
          if (loadedCount === audioElements.length) {
            totalTimeSpan.textContent = formatTime(totalDuration);
          }
        }
      });
    }

    function renderTexts() {
      container.innerHTML = '';
      textItems = [];
      sentences.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'text-item';
        if (i === 0) item.classList.add('active');
        item.innerHTML = `<span class="en">${s[0]}</span><span class="uz">${s[1]}</span>`;
        
        // Gapga bosganda audio ijro qilish
        item.addEventListener('click', () => {
          playSentence(i);
        });
        
        container.appendChild(item);
        textItems.push(item);
      });
    }

    function updateActive(index) {
      textItems.forEach(item => {
        item.classList.remove('active');
        item.classList.remove('playing');
      });
      
      if (textItems[index]) {
        textItems[index].classList.add('active');
        textItems[index].classList.add('playing');
        textItems[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '00:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgressForIndex(index) {
      if (totalDuration <= 0) return;
      
      let elapsedBefore = 0;
      for (let i = 0; i < index; i++) {
        const dur = audioElements[i]?.duration;
        if (dur && !isNaN(dur)) {
          elapsedBefore += dur;
        }
      }
      
      const currentAudioDuration = audioElements[index]?.duration || 0;
      const progressPercent = ((elapsedBefore + currentAudioDuration) / totalDuration) * 100;
      progressFill.style.width = Math.min(progressPercent, 100) + '%';
    }

    function updateCurrentTimeDisplay() {
      if (!currentAudio || !isPlaying) return;
      
      let elapsedBefore = 0;
      for (let i = 0; i < currentIdx; i++) {
        const dur = audioElements[i]?.duration;
        if (dur && !isNaN(dur)) {
          elapsedBefore += dur;
        }
      }
      
      const currentTime = elapsedBefore + currentAudio.currentTime;
      currentTimeSpan.textContent = formatTime(currentTime);
    }

    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    function playSentence(index) {
      if (index < 0 || index >= sentences.length) return;
      
      // Avvalgi audioni to'xtatish
      stopCurrentAudio();
      
      currentIdx = index;
      currentAudio = audioElements[index];
      
      // UI yangilash
      updateActive(index);
      updateProgressForIndex(index);
      
      // Audio ijro qilish
      playCurrentAudio();
    }

    function playCurrentAudio() {
      if (!currentAudio) {
        currentAudio = audioElements[currentIdx];
      }
      
      currentAudio.currentTime = 0;
      
      currentAudio.play().then(() => {
        isPlaying = true;
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        
        // Progress yangilash uchun timer
        startProgressTimer();
        
      }).catch(err => {
        console.error('Audio ijro etishda xato:', err);
        isPlaying = false;
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
      });
    }

    function pauseCurrentAudio() {
      if (currentAudio && isPlaying) {
        currentAudio.pause();
        isPlaying = false;
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
        stopProgressTimer();
      }
    }

    function resumeCurrentAudio() {
      if (currentAudio && !isPlaying) {
        currentAudio.play().then(() => {
          isPlaying = true;
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
          startProgressTimer();
        }).catch(err => {
          console.error('Audio davom ettirishda xato:', err);
        });
      }
    }

    function startProgressTimer() {
      stopProgressTimer();
      updateTimer = setInterval(() => {
        if (currentAudio && isPlaying) {
          updateCurrentTimeDisplay();
          
          // Audio tugaganda keyingi gapga o'tish
          if (currentAudio.ended || currentAudio.currentTime >= currentAudio.duration - 0.1) {
            onAudioEnded();
          }
        }
      }, 250);
    }

    function stopProgressTimer() {
      if (updateTimer) {
        clearInterval(updateTimer);
        updateTimer = null;
      }
    }

    function onAudioEnded() {
      stopProgressTimer();
      
      if (isRepeatMode) {
        // Takrorlash rejimida shu gapni qayta ijro qilish
        playSentence(currentIdx);
      } else {
        // Keyingi gapga o'tish
        changeSentence(1);
      }
    }

    function changeSentence(step) {
      let newIndex = currentIdx + step;
      
      if (newIndex >= 0 && newIndex < sentences.length) {
        stopCurrentAudio();
        stopProgressTimer();
        currentIdx = newIndex;
        updateActive(currentIdx);
        updateProgressForIndex(currentIdx);
        
        // Agar ijro holatida bo'lsa, yangi audioni boshlash
        if (isPlaying || playIcon.classList.contains('fa-pause')) {
          currentAudio = audioElements[currentIdx];
          playCurrentAudio();
        } else {
          currentAudio = audioElements[currentIdx];
        }
      } else if (newIndex >= sentences.length) {
        // Oxirgi gapdan keyin to'xtash
        stopCurrentAudio();
        stopProgressTimer();
        isPlaying = false;
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
        currentTimeSpan.textContent = formatTime(totalDuration);
        progressFill.style.width = '100%';
        
        // Playing klassini olib tashlash
        textItems.forEach(item => item.classList.remove('playing'));
      }
    }

    // Play/Pause tugmasi
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        pauseCurrentAudio();
      } else {
        if (currentAudio && currentAudio.currentTime > 0 && !currentAudio.ended) {
          resumeCurrentAudio();
        } else {
          playSentence(currentIdx);
        }
      }
    });

    // Oldingi gap tugmasi
    prevBtn.addEventListener('click', () => {
      changeSentence(-1);
    });

    // Keyingi gap tugmasi
    nextBtn.addEventListener('click', () => {
      changeSentence(1);
    });

    // Takrorlash tugmasi
    repeatBtn.addEventListener('click', () => {
      isRepeatMode = !isRepeatMode;
      repeatBtn.classList.toggle('active-repeat', isRepeatMode);
    });

    // Progress bar orqali vaqtni o'zgartirish
    progressBarContainer.addEventListener('click', (e) => {
      if (totalDuration <= 0) return;
      
      const rect = progressBarContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percent = clickX / rect.width;
      const targetTime = percent * totalDuration;
      
      // Qaysi gapga to'g'ri kelishini topish
      let accumulatedTime = 0;
      let targetIndex = 0;
      
      for (let i = 0; i < audioElements.length; i++) {
        const dur = audioElements[i]?.duration || 0;
        if (accumulatedTime + dur >= targetTime) {
          targetIndex = i;
          break;
        }
        accumulatedTime += dur;
        targetIndex = i;
      }
      
      // Yangi gapni ijro qilish
      stopCurrentAudio();
      stopProgressTimer();
      currentIdx = targetIndex;
      updateActive(currentIdx);
      
      currentAudio = audioElements[currentIdx];
      
      // Gap ichidagi vaqtni sozlash
      const offsetInSentence = targetTime - accumulatedTime;
      if (currentAudio.duration && offsetInSentence > 0) {
        currentAudio.currentTime = Math.min(offsetInSentence, currentAudio.duration);
      }
      
      if (isPlaying || playIcon.classList.contains('fa-pause')) {
        currentAudio.play().then(() => {
          isPlaying = true;
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
          startProgressTimer();
        }).catch(() => {});
      }
    });

    
    // Audio tugaganda event listener qo'shish
    audioElements.forEach((audio, index) => {
      audio.addEventListener('ended', () => {
        if (currentAudio === audio) {
          onAudioEnded();
        }
      });
    });

    // Har bir audio yuklanganda progressni yangilash
    audioElements.forEach((audio, index) => {
      audio.addEventListener('loadedmetadata', () => {
        calculateTotalDuration();
      });
    });

    // Klaviatura orqali boshqarish
    document.addEventListener('keydown', (e) => {
      switch(e.key) {
        case ' ':
          e.preventDefault();
          playBtn.click();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          prevBtn.click();
          break;
        case 'ArrowRight':
          e.preventDefault();
          nextBtn.click();
          break;
      }
    });

    // Boshlang'ich holat
    createAudioElements();
    renderTexts();
    calculateTotalDuration();
    
    // Birinchi audioni tayyorlash
    currentAudio = audioElements[0];
    updateActive(0);
    
    // Agar totalDuration hali hisoblanmagan bo'lsa, default qiymat
    setTimeout(() => {
      if (totalDuration <= 0) {
        totalDuration = sentences.length * 3; // Har bir gapga taxminan 3 soniya
        totalTimeSpan.textContent = formatTime(totalDuration);
      }
    }, 2000);

    currentTimeSpan.textContent = '00:00';
    progressFill.style.width = '0%';

  })();
</script>
</body>
</html>
