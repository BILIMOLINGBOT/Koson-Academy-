


<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>1-Dars | O'zingizni tanishtiring</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #1C1C1E;
      --player-bg: #0A0A0A;
      --accent: #FFFFFF;
      --blue-active: #007AFF;
      --text-secondary: #8E8E93;
      --border-subtle: #2C2C2E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixed Header */
    .header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 0.5px solid #2C2C2E;
      height: 64px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 22px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active {
      background: rgba(255,255,255,0.15);
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    /* Scrollable Content */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 80px 20px 210px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      background-color: #000000;
    }

    .text-item {
      margin-bottom: 24px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .text-item.active {
      border-color: #FFFFFF;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .en {
      font-size: 18px;
      font-weight: 600;
      display: block;
      color: #FFFFFF;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .uz {
      font-size: 15px;
      color: var(--text-secondary);
      display: block;
      line-height: 1.4;
    }

    /* Fixed Player Bottom */
    .player-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--player-bg);
      padding: 16px 20px 28px;
      border-top: 1px solid #222;
      z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(10, 10, 10, 0.92);
    }

    .progress-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 18px;
    }

    .bar-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 4px;
      position: relative;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: #8E8E93;
      border-radius: 4px;
      transition: width 0.3s ease;
      position: relative;
    }

    .bar-dot {
      position: absolute;
      right: -6px;
      top: -5px;
      width: 14px;
      height: 14px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 500;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      max-width: 400px;
      margin: 0 auto;
    }

    .player-controls i {
      font-size: 22px;
      color: #CCC;
      cursor: pointer;
      transition: 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .player-controls i:active {
      transform: scale(0.9);
      color: #FFF;
      background: rgba(255,255,255,0.1);
    }

    .player-controls i.active-repeat {
      color: var(--blue-active);
      text-shadow: 0 0 12px rgba(0, 122, 255, 0.6);
    }

    .btn-play-pause {
      width: 68px;
      height: 68px;
      background: #1C1C1E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid #2C2C2E;
    }

    .btn-play-pause:active {
      transform: scale(0.94);
      background: #2C2C2E;
    }

    .btn-play-pause i {
      font-size: 28px;
      color: #FFF;
      padding: 0;
    }

    .player-controls i.fa-backward-step,
    .player-controls i.fa-forward-step {
      font-size: 26px;
    }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
  <h1>O'zingizni tanishtiring</h1>
</div>

<main class="content-scroll" id="contentArea">
  <!-- JavaScript orqali matnlar qo'shiladi -->
</main>

<div class="player-fixed">
  <div class="progress-box">
    <div class="bar-container">
      <div class="bar-fill" id="progressFill">
        <div class="bar-dot"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="currentTime">00:00</span>
      <span id="totalTime">01:53</span>
    </div>
  </div>

  <div class="player-controls">
    <i class="fas fa-arrows-rotate" id="repeatBtn" title="Takrorlash"></i>

    <i class="fas fa-backward-step" onclick="changeSentence(-1)" title="Oldingi"></i>

    <div class="btn-play-pause" id="playBtn">
      <i class="fas fa-play"></i> <!-- Play ikonkasi bilan boshlanadi -->
    </div>

    <i class="fas fa-forward-step" onclick="changeSentence(1)" title="Keyingi"></i>
  </div>
</div>

<script>
  (function() {
    // 3-parametr sifatida audio URL qo'shildi
    const sentences = [
  ["Hello! What is your name?", "Salom! Ismingiz nima?", ""],
  ["My name is Ali. What is your name?", "Mening ismim Ali. Sizning ismingiz nima?", ""],
  ["My name is Madina. Nice to meet you.", "Mening ismim Madina. Tanishganimdan xursandman.", ""],
  ["Nice to meet you too.", "Men ham tanishganimdan xursandman.", ""],
  ["How old are you?", "Siz necha yoshdasiz?", ""],
  ["I am 18 years old.", "Men 18 yoshdaman.", ""],
  ["Where are you from?", "Siz qayerdansiz?", ""],
  ["I am from Uzbekistan.", "Men Oʻzbekistondanman.", ""],
  ["Which city do you live in?", "Siz qaysi shaharda yashaysiz?", ""],
  ["I live in Tashkent.", "Men Toshkentda yashayman.", ""],
  ["Are you a student?", "Siz talabamisiz?", ""],
  ["Yes, I am a student.", "Ha, men talabaman.", ""],
  ["What do you study?", "Siz nima oʻqiysiz?", ""],
  ["I study English.", "Men ingliz tilini oʻrganaman.", ""],
  ["Do you work?", "Siz ishlaysizmi?", ""],
  ["No, I do not work now.", "Yoʻq, hozir ishlamayman.", ""],
  ["What do you like to do?", "Siz nima qilishni yoqtirasiz?", ""],
  ["I like reading books.", "Men kitob oʻqishni yoqtiraman.", ""],
  ["Do you have brothers or sisters?", "Sizning aka-ukalaringiz yoki opa-singillaringiz bormi?", ""],
  ["Yes, I have one brother.", "Ha, mening bitta ukam bor.", ""],
  ["What is your favorite food?", "Sizning sevimli ovqatingiz nima?", ""],
  ["My favorite food is plov.", "Mening sevimli ovqatim palov.", ""],
  ["What is your favorite color?", "Sizning sevimli rangingiz nima?", ""],
  ["My favorite color is blue.", "Mening sevimli rangim koʻk.", ""],
  ["Can you speak English well?", "Siz ingliz tilida yaxshi gaplasha olasizmi?", ""],
  ["I can speak a little English.", "Men ozgina inglizcha gaplasha olaman.", ""],
  ["What do you do every day?", "Siz har kuni nima qilasiz?", ""],
  ["I go to school every day.", "Men har kuni maktabga boraman.", ""],
  ["What are you doing now?", "Hozir nima qilyapsiz?", ""],
  ["I am learning English now.", "Men hozir ingliz tilini oʻrganayapman.", ""],
  ["What did you do yesterday?", "Kecha nima qildingiz?", ""],
  ["I watched a movie yesterday.", "Men kecha kino koʻrdim.", ""],
  ["Were you at home yesterday evening?", "Kecha kechqurun uyda edingizmi?", ""],
  ["Yes, I was at home.", "Ha, men uyda edim.", ""],
  ["Do you have a phone?", "Sizning telefoningiz bormi?", ""],
  ["Yes, I have a smartphone.", "Ha, mening smartfonim bor.", ""],
  ["What is your dream?", "Sizning orzuingiz nima?", ""],
  ["My dream is to speak English fluently.", "Mening orzuim ingliz tilida ravon gapirish.", ""],
  ["Thank you for talking with me.", "Men bilan suhbatlashganingiz uchun rahmat.", ""],
  ["You are welcome. See you later!", "Arzimaydi. Keyin koʻrishamiz!", ""]
];
      

    const container = document.getElementById('contentArea');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const playBtn = document.getElementById('playBtn');
    const playIcon = playBtn.querySelector('i');

    let currentIdx = 0;
    let isRepeatMode = false;
    let textItems = [];
    
    // Audio obyektini yaratish
    const lessonAudio = new Audio();
    let isPlaying = false;

    function renderTexts() {
      container.innerHTML = '';
      textItems = [];
      sentences.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'text-item';
        if (i === 0) item.classList.add('active');
        item.innerHTML = `<span class="en">${s[0]}</span><span class="uz">${s[1]}</span>`;
        
        // Matn bosilganda o'sha gapga o'tish va pley qilish funksiyasi
        item.addEventListener('click', () => {
          currentIdx = i;
          updateActive(currentIdx);
          updateProgressForIndex(currentIdx);
          loadAndPlayAudio();
        });

        container.appendChild(item);
        textItems.push(item);
      });
    }

    function updateActive(index) {
      textItems.forEach(item => item.classList.remove('active'));
      if (textItems[index]) {
        textItems[index].classList.add('active');
        textItems[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgressForIndex(index) {
      // Darsning umumiy davomiyligi bo'yicha progress (iOS dizayndagidek qoldirildi)
      const progressPercent = ((index + 1) / sentences.length) * 100;
      progressFill.style.width = progressPercent + '%';
      
      const totalDuration = 113; // 01:53 sekund hisobida
      const perSentence = totalDuration / sentences.length;
      const currentSeconds = index * perSentence;

      if (currentTimeSpan) {
        currentTimeSpan.textContent = formatTime(currentSeconds);
      }
    }

    // Audioni yuklash va avtomatik chalish
    function loadAndPlayAudio() {
      const audioUrl = sentences[currentIdx][2];
      
      if (audioUrl) {
        lessonAudio.src = audioUrl;
        if (isPlaying) {
          lessonAudio.play().catch(e => console.log("Audio xatosi:", e));
        }
      } else {
        lessonAudio.pause();
        // Agar audio topilmasa, test uchun pauza qilib qo'yish yoki keyingisiga o'tkazish mumkin.
      }
    }

    // Oldingi/Keyingi gaplarga o'tish
    window.changeSentence = function(step) {
      if (isRepeatMode && step === 1) {
        loadAndPlayAudio(); // Takrorlash yoqilgan bo'lsa xuddi shu audioni qaytadan chaladi
        return;
      }
      
      let newIndex = currentIdx + step;
      if (newIndex >= 0 && newIndex < sentences.length) {
        currentIdx = newIndex;
        updateActive(currentIdx);
        updateProgressForIndex(currentIdx);
        loadAndPlayAudio();
      }
    };

    // Takrorlash (Repeat) funksiyasi
    repeatBtn.addEventListener('click', function() {
      isRepeatMode = !isRepeatMode;
      this.classList.toggle('active-repeat');
    });

    // Audio tugagach nima bo'lishini nazorat qilish
    lessonAudio.addEventListener('ended', function() {
      if (isRepeatMode) {
        lessonAudio.play();
      } else {
        changeSentence(1);
      }
    });

    // Play/Pause tugmasi logikasi
    playBtn.addEventListener('click', function() {
      isPlaying = !isPlaying;
      
      if (isPlaying) {
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        
        const currentUrl = sentences[currentIdx][2];
        if (currentUrl && lessonAudio.src !== currentUrl) {
            lessonAudio.src = currentUrl;
        }
        if (currentUrl) {
            lessonAudio.play().catch(e => console.log("Audio xatosi:", e));
        }
      } else {
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
        lessonAudio.pause();
      }
    });

    // Boshlang'ich holatni sozlash
    renderTexts();
    updateProgressForIndex(0);

  })();
</script>
</body>
</html>
