<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bildirishnomalar - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* iOS Design System & index.html bilan bir xil stil */
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column;min-height:100vh}
        
        /* Yuqori qism */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 90px 20px 14px 20px; 
            background: rgba(18, 18, 20, 0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }
        
        .header-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: transparent; border: none; width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #eff3f4; cursor: pointer; transition: background 0.2s ease;
        }
        .icon-btn:active { background: rgba(255, 255, 255, 0.1); }
        .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Notification List (index.html post-item bilan bir xil tuzilma) */
        .notif-list { display: flex; flex-direction: column; width: 100%; }
        
        .notif-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            width: 100%;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: #000;
            cursor: pointer;
            transition: background 0.15s ease;
            animation: fadeIn 0.3s ease-out;
        }
        .notif-item:active { background: rgba(255, 255, 255, 0.03); }
        .notif-item.unread { background: rgba(29, 155, 240, 0.08); }

        /* index.html dagi .post-avatar va .post-avatar-initial bilan bir xil */
        .notif-avatar-wrapper { flex-shrink: 0; cursor: pointer; }
        .notif-avatar, .notif-avatar-initial {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .notif-avatar {
            object-fit: cover;
            background: #1c1c1e;
            display: block;
        }
        .notif-avatar-initial {
            background: linear-gradient(135deg, #3a3a3c 0%, #1c1c1e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }

        .notif-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        
        /* Profil nomi va vaqti bir qatorda */
        .notif-head-info {
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 3px;
            min-width: 0;
        }
        .notif-user {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
        .notif-user:active { opacity: 0.7; }
        .notif-others {
            font-size: 14px;
            font-weight: 400;
            color: #8e8e93;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .notif-time {
            font-size: 13px;
            color: #8e8e93;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .verified-badge-sm {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
            display: inline-block;
            vertical-align: middle;
            margin-left: 4px;
        }

        /* Profil nomi ostidagi like / reply holati */
        .notif-status {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
        }
        .notif-status svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        .notif-status.type-like { color: #ff2d55; }
        .notif-status.type-like svg { fill: #ff2d55; }
        .notif-status.type-reply { color: #1d9bf0; }
        .notif-status.type-reply svg { fill: #1d9bf0; }
        .notif-status.type-follow { color: #1d9bf0; }
        .notif-status.type-follow svg { fill: #1d9bf0; }

        /* Post yoki izoh matni (preview) */
        .notif-preview {
            font-size: 14px;
            line-height: 1.4;
            color: #8e8e93;
            margin-top: 4px;
            word-break: break-word;
            white-space: pre-wrap;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Empty State */
        .empty-container { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; margin-top: 20%; animation: fadeIn 0.4s ease-out; }
        .empty-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #e7e9ea; }
        .empty-text { color: #71767b; font-size: 15px; line-height: 1.5; max-width: 82%; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ISLAND NAV */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s;position:relative}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
        .nav-badge{position:absolute;top:2px;right:25%;background:#ff2d55;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 5px;min-width:16px;text-align:center;line-height:1;border:2px solid #1c1c1e;z-index:10}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="header-title">Bildirishnomalar</h1>
        <div class="header-actions">
            <button class="icon-btn" id="markReadBtn" title="Barchasini o'qilgan deb belgilash">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
            <button class="icon-btn" id="clearBtn" title="Barchasini o'chirish">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <div class="notif-list" id="notifList"></div>

    <main class="empty-container" id="emptyState">
        <h2 class="empty-title">Hech narsa yo'q</h2>
        <p class="empty-text">Barcha layklar va izohlar shu yerda paydo boʻladi.</p>
    </main>
</div>

<!-- OROLCHA NAVIGATSIYA -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
        <a href="notification.html" class="nav-btn nav-active" id="navNotifBtn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-label">Bildirishnoma</span></a>
        <a href="qidiruv.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
        <a href="profil.html" class="nav-btn nav-inactive"><span id="navAvatarSlot"></span><span class="nav-label">Profil</span></a>
    </div>
</nav>

<script>
    /* ================= SYSTEM INITIALIZATION ================= */
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
        try {
            tg.ready();
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        } catch (e) {}
    }

    const NOTIF_KEY = 'notifications';
    const POST_STORE_KEY = 'tg_feed_posts_v1';
    const USERS_KEY = 'luz_users';
    const CURRENT_USER_KEY = 'luz_current_user';
    const VERIFIED_KEY = 'luz_verified_badge';

    const VERIFIED_BADGE_SM_SVG = `<svg class="verified-badge-sm" viewBox="0 0 24 24" aria-label="Tasdiqlangan"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path><path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>`;

    function getUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; } catch { return []; }
    }

    function getUserById(uid) {
        if (!uid) return null;
        return getUsers().find(u => String(u.userId) === String(uid)) || null;
    }

    function getCurrentUser() {
        const id = localStorage.getItem(CURRENT_USER_KEY);
        if (id) {
            const found = getUserById(id);
            if (found) return found;
        }
        if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const tU = tg.initDataUnsafe.user;
            return {
                userId: String(tU.id),
                firstName: tU.first_name || '',
                lastName: tU.last_name || '',
                photo_url: tU.photo_url || null
            };
        }
        return null;
    }

    let currentUser = getCurrentUser() || {};

    function isUserVerified(uid) {
        if (String(uid) === String(currentUser?.userId)) {
            const saved = localStorage.getItem(VERIFIED_KEY);
            if (saved !== null) return saved === '1';
        }
        const u = getUserById(uid);
        return Boolean(u && (u.verified || u.isVerified));
    }

    function updateNavAvatar() {
        currentUser = getCurrentUser() || {};
        const cuName = [currentUser.firstName, currentUser.lastName].filter(Boolean).join(' ') || 'F';
        const cuInit = cuName.trim().charAt(0).toUpperCase();
        document.getElementById('navAvatarSlot').innerHTML = currentUser.photo_url
            ? `<img class="nav-avatar" src="${currentUser.photo_url}" alt="">`
            : `<div class="nav-avatar-initial">${cuInit}</div>`;
    }
    updateNavAvatar();

    /* ================= HELPERS ================= */
    function formatExactTime(dateInput) {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return '';
        const diffSec = Math.floor((new Date() - d) / 1000);
        if (diffSec < 5) return 'hozir';
        if (diffSec < 60) return diffSec + ' soniya oldin';
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return diffMin + ' daqiqa oldin';
        const diffHour = Math.floor(diffMin / 60);
        if (diffHour < 24) return diffHour + ' soat oldin';
        const diffDay = Math.floor(diffHour / 24);
        if (diffDay < 7) return diffDay + ' kun oldin';
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        return `${dd}.${mm}.${d.getFullYear()}`;
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    function goToProfile(uid) {
        if (!uid) return;
        if (String(uid) === String(currentUser?.userId)) window.location.href = 'profil.html';
        else window.location.href = `profil.html?id=${encodeURIComponent(uid)}`;
    }

    const STATUS_HTML = {
        like: `<div class="notif-status type-like"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><span>like</span></div>`,
        comment: `<div class="notif-status type-reply"><svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg><span>reply</span></div>`,
        reply: `<div class="notif-status type-reply"><svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg><span>reply</span></div>`,
        follow: `<div class="notif-status type-follow"><svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>obuna boʻldi</span></div>`
    };

    /* ================= PREVIEW MATNI (post / izoh / javob) ================= */
    function getPostById(id) {
        try { return (JSON.parse(localStorage.getItem(POST_STORE_KEY)) || []).find(p => p.id === id) || null; } catch { return null; }
    }
    function findCommentById(list, id) {
        for (const c of (list || [])) {
            if (c.id === id) return c;
            const r = findCommentById(c.replies, id);
            if (r) return r;
        }
        return null;
    }
    function getPreviewText(n) {
        if (!n.postId) return '';
        const post = getPostById(n.postId);
        if (!post) return '';
        if (n.type === 'like') {
            if (post.text) return post.text;
            if (post.type === 'image') return '📷 Rasm';
            if (post.type === 'video') return '🎥 Video';
            return '';
        }
        if (n.type === 'comment' || n.type === 'reply') {
            const c = findCommentById(post.comments, n.commentId);
            return c ? (c.text || '') : '';
        }
        return '';
    }

    /* ================= SENDER MA'LUMOTLARI (index.html bilan bir xil) ================= */
    function resolveSender(sender) {
        const u = getUserById(sender.id);
        const fullName = u
            ? ([u.firstName, u.lastName].filter(Boolean).join(' ') || sender.name || 'Foydalanuvchi')
            : (sender.name || 'Foydalanuvchi');
        const avatar = (u && u.photo_url) ? u.photo_url : (sender.avatar || null);
        return {
            id: sender.id,
            name: fullName,
            avatar: avatar,
            verified: isUserVerified(sender.id)
        };
    }

    
    /* ================= NOTIFICATION LOGIC ================= */
    const Store = {
        load: () => { try { return JSON.parse(localStorage.getItem(NOTIF_KEY)) || []; } catch { return []; } },
        save: (data) => { localStorage.setItem(NOTIF_KEY, JSON.stringify(data)); window.dispatchEvent(new Event('luz_notifs_updated')); }
    };

    function buildGroups(myNotifs) {
        const sorted = myNotifs.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const map = new Map();
        const groups = [];

        sorted.forEach(n => {
            const sender = { id: n.senderId, name: n.senderName, avatar: n.senderAvatar };
            if (n.type === 'like' || n.type === 'follow') {
                const key = n.type === 'like' ? 'like::' + n.postId : 'follow';
                let g = map.get(key);
                if (!g) {
                    g = { type: n.type, first: n, ids: [], senders: [], latest: n.createdAt, unread: false };
                    map.set(key, g);
                    groups.push(g);
                }
                g.ids.push(n.id);
                if (!n.isRead) g.unread = true;
                if (!g.senders.some(s => String(s.id) === String(n.senderId))) g.senders.push(sender);
            } else {
                groups.push({ type: n.type, first: n, ids: [n.id], senders: [sender], latest: n.createdAt, unread: !n.isRead });
            }
        });
        return groups;
    }

    function renderNotifications() {
        currentUser = getCurrentUser() || {};
        if (!currentUser || !currentUser.userId) return;

        const allNotifs = Store.load();
        const myNotifs = allNotifs.filter(n => String(n.recipientId) === String(currentUser.userId));

        const list = document.getElementById('notifList');
        const emptyState = document.getElementById('emptyState');

        list.innerHTML = '';

        if (myNotifs.length === 0) {
            emptyState.style.display = 'flex';
        } else {
            emptyState.style.display = 'none';
            buildGroups(myNotifs).forEach(g => {
                const n = g.first;
                const mainSender = resolveSender(g.senders[0]);
                const othersCount = g.senders.length - 1;
                const init = (mainSender.name || 'F').trim().charAt(0).toUpperCase();

                /* index.html dagi .post-avatar bilan bir xil rasm */
                const avatarHtml = mainSender.avatar
                    ? `<img class="notif-avatar" src="${mainSender.avatar}" alt="" loading="lazy">`
                    : `<div class="notif-avatar-initial">${init}</div>`;

                const preview = getPreviewText(n);

                const item = document.createElement('div');
                item.className = `notif-item ${g.unread ? 'unread' : ''}`;

                item.innerHTML = `
                    <div class="notif-avatar-wrapper">${avatarHtml}</div>
                    <div class="notif-body">
                        <div class="notif-head-info">
                            <div class="notif-user">${escapeHtml(mainSender.name)}${mainSender.verified ? VERIFIED_BADGE_SM_SVG : ''}</div>
                            ${othersCount > 0 ? `<span class="notif-others">va yana ${othersCount} kishi</span>` : ''}
                            <div class="notif-time">${escapeHtml(formatExactTime(g.latest))}</div>
                        </div>
                        ${STATUS_HTML[g.type] || ''}
                        ${preview ? `<div class="notif-preview">${escapeHtml(preview)}</div>` : ''}
                    </div>
                `;

                item.querySelector('.notif-avatar-wrapper').addEventListener('click', (e) => {
                    e.stopPropagation();
                    goToProfile(mainSender.id);
                });

                item.querySelector('.notif-user').addEventListener('click', (e) => {
                    e.stopPropagation();
                    goToProfile(mainSender.id);
                });

                item.addEventListener('click', () => {
                    if (g.unread) {
                        const notifs = Store.load();
                        let changed = false;
                        notifs.forEach(x => {
                            if (g.ids.includes(x.id) && !x.isRead) {
                                x.isRead = true;
                                changed = true;
                            }
                        });
                        if (changed) Store.save(notifs);
                    }

                    if (g.type === 'follow') {
                        if (g.senders.length === 1) goToProfile(mainSender.id);
                    } else if (n.postId) {
                        window.location.href = `index.html?post=${encodeURIComponent(n.postId)}`;
                    }
                });

                list.appendChild(item);
            });
        }
        updateNotificationBadgeLocal();
    }

    /* Actions */
    document.getElementById('markReadBtn').addEventListener('click', () => {
        let notifs = Store.load();
        let changed = false;
        notifs.forEach(n => {
            if (String(n.recipientId) === String(currentUser.userId) && !n.isRead) {
                n.isRead = true;
                changed = true;
            }
        });
        if (changed) {
            Store.save(notifs);
            renderNotifications();
        }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm("Barcha bildirishnomalar o'chirilsinmi?")) {
            let notifs = Store.load();
            notifs = notifs.filter(n => String(n.recipientId) !== String(currentUser.userId));
            Store.save(notifs);
            renderNotifications();
        }
    });

    /* Live Syncing */
    window.addEventListener('pageshow', () => {
        updateNavAvatar();
        renderNotifications();
    });
    window.addEventListener('storage', (e) => {
        if (e.key === NOTIF_KEY || e.key === POST_STORE_KEY || e.key === USERS_KEY || e.key === VERIFIED_KEY) {
            updateNavAvatar();
            renderNotifications();
        }
    });
    window.addEventListener('luz_notifs_updated', renderNotifications);

    /* Pastki navigatsiyadagi o'qilmagan xabarlar soni (badge) */
    function updateNotificationBadgeLocal() {
        const btn = document.getElementById('navNotifBtn');
        if (!btn) return;
        const unreadCount = Store.load().filter(n => String(n.recipientId) === String(currentUser?.userId) && !n.isRead).length;
        let badge = document.getElementById('notifBadge');
        if (unreadCount > 0) {
            if (!badge) {
                badge = document.createElement('div');
                badge.id = 'notifBadge';
                badge.className = 'nav-badge';
                btn.appendChild(badge);
            }
            badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
        } else if (badge) {
            badge.remove();
        }
    }

    renderNotifications();
</script>
</body>
</html>
