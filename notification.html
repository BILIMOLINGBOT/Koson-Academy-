<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bildirishnoma - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* iOS Design System Fonts & Resets */
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#fff;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column;min-height:100vh;}
        
        /* Yuqori qism */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(16px + env(safe-area-inset-top)) 20px 15px 20px; 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
            margin: 0;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 2;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Bo'sh holat */
        .empty-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            text-align: center;
            margin-top: 30%;
            animation: fadeIn 0.4s ease-out;
        }
        .empty-container.show { display: flex; }

        .empty-icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #8e8e93;
        }

        .empty-icon svg { width: 32px; height: 32px; stroke: currentColor; fill: none; stroke-width: 1.5; }
        .empty-text { color: #8e8e93; font-size: 16px; line-height: 1.5; font-weight: 500; max-width: 80%; }

        /* Bildirishnomalar Ro'yxati */
        .notif-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-top: 10px;
        }

        .notif-item {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease;
            cursor: pointer;
            transition: background 0.15s;
        }
        .notif-item:active { background: rgba(255,255,255,0.03); }
        .notif-item.unread { background: rgba(0, 122, 255, 0.08); }
        .notif-item.unread:active { background: rgba(0, 122, 255, 0.12); }

        .notif-icon-wrapper {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 14px;
            position: relative;
            background: #1c1c1e;
        }

        .notif-icon-wrapper svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Ikonka ranglari */
        .icon-like { stroke: #ff2d55; fill: #ff2d55; }
        .icon-comment { stroke: #34c759; }
        .icon-reply { stroke: #0a84ff; }
        .icon-follow { stroke: #af52de; }

        .notif-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .notif-text {
            font-size: 15px;
            line-height: 1.4;
            color: #f2f2f7;
            word-break: break-word;
        }
        
        .notif-text b { font-weight: 600; color: #fff; }

        .notif-time {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 4px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* "ISLAND" PASTKI NAVIGATSIYA */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
        
        .toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:rgba(28,28,30,0.9);backdrop-filter:blur(10px);color:#fff;padding:12px 24px;border-radius:16px;font-size:14px;font-weight:500;z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;box-shadow:0 8px 30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.1);max-width:80%;text-align:center}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <button class="icon-btn" id="clearBtn" aria-label="Tozalash">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
        <h1 class="header-title">Bildirishnoma</h1>
        <div style="width: 40px;"></div> 
    </header>

    <main class="empty-container" id="emptyState">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        </div>
        <p class="empty-text">Barcha bildirishnomalar shu yerda paydo boʻladi</p>
    </main>

    <div class="notif-list" id="notifList"></div>
</div>

<!-- OROLCHA NAVIGATSIYA -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
        <a href="notification.html" class="nav-btn nav-active"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-label">Bildirishnoma</span></a>
        <a href="qidiruv.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
        <a href="profil.html" class="nav-btn nav-inactive" id="navProfileLink"><span id="navAvatarSlot"><div class="nav-avatar-initial">F</div></span><span class="nav-label">Profil</span></a>
    </div>
</nav>

<div class="toast" id="toast"></div>

<script>
    /* ================= TELEGRAM ================= */
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
        try {
            tg.ready(); tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        } catch (e) {}
    }

    /* ================= DB & UTIL ================= */
    const DB = {
        _K: 'luz_users', _S: 'luz_current_user',
        getCurrentUser(){
            const id = localStorage.getItem(this._S); if (!id) return null;
            try { const users = JSON.parse(localStorage.getItem(this._K)) || []; return users.find(u => u.userId === id) || null; } catch { return null; }
        }
    };
    
    function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function formatExactTime(dateInput){
        const d = dateInput instanceof Date ? dateInput : new Date(dateInput); if (isNaN(d.getTime())) return '';
        const diffSec = Math.floor((new Date() - d) / 1000);
        if (diffSec < 5) return 'hozir'; if (diffSec < 60) return diffSec + ' soniya oldin';
        const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa oldin';
        const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat oldin';
        const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun oldin';
        const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}.${d.getFullYear()}`;
    }
    
    let toastTimer;
    function showToast(msg){
        const t = document.getElementById('toast'); if (!t) return;
        t.textContent = msg; t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    /* ================= AVATAR SET ================= */
    const currentUser = DB.getCurrentUser() || { firstName: 'Foydalanuvchi' };
    const navAvatarSlot = document.getElementById('navAvatarSlot');
    const cuInit = (currentUser.firstName || 'F').charAt(0).toUpperCase();
    if (currentUser.photo_url) navAvatarSlot.innerHTML = `<img class="nav-avatar" src="${currentUser.photo_url}" alt="${cuInit}">`;
    else navAvatarSlot.innerHTML = `<div class="nav-avatar-initial">${cuInit}</div>`;

    /* ================= NOTIFICATIONS STORE ================= */
    const NOTIF_KEY = 'luz_notifications_v1';
    
    const ICONS_MAP = {
        like: `<svg class="icon-like" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
        comment: `<svg class="icon-comment" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
        reply: `<svg class="icon-reply" viewBox="0 0 24 24"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>`,
        follow: `<svg class="icon-follow" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`
    };

    function loadNotifications() {
        try {
            const raw = localStorage.getItem(NOTIF_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch { return []; }
    }

    function saveNotifications(data) {
        localStorage.setItem(NOTIF_KEY, JSON.stringify(data));
    }

    function renderNotifications() {
        const notifs = loadNotifications();
        const listEl = document.getElementById('notifList');
        const emptyState = document.getElementById('emptyState');
        
        listEl.innerHTML = '';
        
        if (notifs.length === 0) {
            emptyState.classList.add('show');
        } else {
            emptyState.classList.remove('show');
            notifs.forEach(n => {
                const item = document.createElement('div');
                item.className = 'notif-item' + (n.read ? '' : ' unread');
                
                let actionText = '';
                if (n.type === 'like') actionText = 'sizning postingizga yoqdi';
                else if (n.type === 'comment') actionText = 'sizga izoh yozdi';
                else if (n.type === 'reply') actionText = 'sizga javob yozdi';
                else if (n.type === 'follow') actionText = 'sizga obuna boʻldi';

                item.innerHTML = `
                    <div class="notif-icon-wrapper">
                        ${ICONS_MAP[n.type] || ICONS_MAP.like}
                    </div>
                    <div class="notif-content">
                        <div class="notif-text"><b>${escapeHtml(n.actorName)}</b> ${actionText}</div>
                        <div class="notif-time">${formatExactTime(n.createdAt)}</div>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    // O'qildi qilish
                    n.read = true;
                    saveNotifications(notifs);
                    item.classList.remove('unread');
                    
                    // Manzilga yo'naltirish
                    if (n.type === 'follow') {
                        window.location.href = `profil.html?id=${n.actorId}`;
                    } else if (n.postId) {
                        window.location.href = `index.html?post=${n.postId}`;
                    }
                });
                
                listEl.appendChild(item);
            });
        }
    }
    
    // Tozalash tugmasi
    document.getElementById('clearBtn').addEventListener('click', () => {
        saveNotifications([]);
        renderNotifications();
        showToast("Tozalandi");
    });

    renderNotifications();
</script>
</body>
</html>
