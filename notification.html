<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bildirishnomalar - L.uz</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* iOS Design System & X (Twitter) Style */
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Roboto",sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{background:#000!important;color:#e7e9ea;overscroll-behavior-y:none}
        body{display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased}
        
        .mobile-container{width:100%;max-width:420px;padding:0 0 140px 0;display:flex;flex-direction:column;min-height:100vh;}
        
        /* Yuqori qism */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(16px + env(safe-area-inset-top)) 16px 12px 16px; 
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #2f3336;
        }
        
        .header-title {
            font-size: 19px;
            font-weight: 700;
            color: #e7e9ea;
        }
        
        .header-actions { display: flex; gap: 12px; }
        .icon-btn {
            background: transparent; border: none; width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #eff3f4; cursor: pointer; transition: background 0.2s ease;
        }
        .icon-btn:active { background: rgba(255, 255, 255, 0.1); }
        .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Notification List */
        .notif-list { display: flex; flex-direction: column; width: 100%; }
        
        .notif-item {
            display: flex; gap: 12px; padding: 14px 16px;
            border-bottom: 1px solid #2f3336; background: #000;
            cursor: pointer; transition: background 0.15s;
            animation: fadeIn 0.3s ease-out;
        }
        .notif-item:active { background: rgba(255, 255, 255, 0.05); }
        .notif-item.unread { background: rgba(29, 155, 240, 0.08); } /* X ko'k rang ohangi */
        
        .notif-icon-col { width: 28px; display: flex; justify-content: flex-end; padding-top: 4px; }
        .notif-icon-col svg { width: 22px; height: 22px; }
        .icon-like { fill: #f91880; color: #f91880; }
        .icon-follow { fill: #1d9bf0; color: #1d9bf0; }
        .icon-comment, .icon-reply { fill: #1d9bf0; color: #1d9bf0; }

        .notif-body { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        .notif-avatar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .notif-avatar, .notif-avatar-initial { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .notif-avatar-initial { background: linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; }
        
        .notif-text { font-size: 15px; line-height: 1.4; color: #e7e9ea; word-break: break-word; }
        .notif-text strong { font-weight: 700; color: #eff3f4; }
        
        .notif-time { font-size: 13px; color: #71767b; white-space: nowrap; margin-left: 10px; }

        /* Empty State */
        .empty-container { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; margin-top: 20%; animation: fadeIn 0.4s ease-out; }
        .empty-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #e7e9ea; }
        .empty-text { color: #71767b; font-size: 15px; line-height: 1.5; max-width: 80%; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ISLAND NAV */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s;position:relative}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="modern-header">
        <h1 class="header-title">Bildirishnomalar</h1>
        <div class="header-actions">
            <button class="icon-btn" id="markReadBtn" title="Barchasini o'qilgan deb belgilash">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
            <button class="icon-btn" id="clearBtn" title="Barchasini o'chirish">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </header>

    <div class="notif-list" id="notifList"></div>

    <main class="empty-container" id="emptyState">
        <h2 class="empty-title">Hech narsa yo'q</h2>
        <p class="empty-text">Barcha layklar, izohlar va obunalar haqidagi xabarlar shu yerda paydo boʻladi.</p>
    </main>
</div>

<!-- OROLCHA NAVIGATSIYA -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <a href="index.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
        <a href="notification.html" class="nav-btn nav-active"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-label">Bildirishnoma</span></a>
        <a href="qidiruv.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
        <a href="profil.html" class="nav-btn nav-inactive"><span id="navAvatarSlot"></span><span class="nav-label">Profil</span></a>
    </div>
</nav>

<script>
    /* ================= SYSTEM INITIALIZATION ================= */
    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    if (tg) {
        try {
            tg.ready(); tg.expand();
            if (tg.setHeaderColor) tg.setHeaderColor('#000000');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
        } catch (e) {}
    }

    const NOTIF_KEY = 'notifications';
    
    function getCurrentUser() {
        const id = localStorage.getItem('luz_current_user'); if (!id) return null;
        try { return (JSON.parse(localStorage.getItem('luz_users')) || []).find(u => u.userId === id) || null; } catch { return null; }
    }
    const currentUser = getCurrentUser() || {};
    
    // Bottom Nav Avatar
    const cuInit = (currentUser.firstName || 'F').charAt(0).toUpperCase();
    document.getElementById('navAvatarSlot').innerHTML = currentUser.photo_url 
        ? `<img class="nav-avatar" src="${currentUser.photo_url}" alt="">` 
        : `<div class="nav-avatar-initial">${cuInit}</div>`;

    /* ================= HELPERS ================= */
    function formatExactTime(dateInput){
        const d = new Date(dateInput); if (isNaN(d.getTime())) return '';
        const diffSec = Math.floor((new Date() - d) / 1000);
        if (diffSec < 60) return diffSec + ' soniya oldin';
        const diffMin = Math.floor(diffSec / 60); if (diffMin < 60) return diffMin + ' daqiqa';
        const diffHour = Math.floor(diffMin / 60); if (diffHour < 24) return diffHour + ' soat';
        const diffDay = Math.floor(diffHour / 24); if (diffDay < 7) return diffDay + ' kun';
        const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0'); return `${dd}.${mm}`;
    }

    function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    const ICONS_SVG = {
        like: `<svg viewBox="0 0 24 24" class="icon-like"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
        follow: `<svg viewBox="0 0 24 24" class="icon-follow"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
        comment: `<svg viewBox="0 0 24 24" class="icon-comment"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>`,
        reply: `<svg viewBox="0 0 24 24" class="icon-reply"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>`
    };

    const TEXT_MAP = {
        like: "ga yoqdi",
        follow: "sizga Obuna boʻldi",
        comment: "sizga izoh yozdi",
        reply: "sizga javob yozdi"
    };

    /* ================= NOTIFICATION LOGIC ================= */
    const Store = {
        load: () => JSON.parse(localStorage.getItem(NOTIF_KEY)) || [],
        save: (data) => { localStorage.setItem(NOTIF_KEY, JSON.stringify(data)); window.dispatchEvent(new Event('luz_notifs_updated')); }
    };

    function renderNotifications() {
        if (!currentUser || !currentUser.userId) return;
        
        const allNotifs = Store.load();
        const myNotifs = allNotifs.filter(n => n.recipientId === currentUser.userId);
        
        const list = document.getElementById('notifList');
        const emptyState = document.getElementById('emptyState');
        
        list.innerHTML = '';
        
        if (myNotifs.length === 0) {
            emptyState.style.display = 'flex';
        } else {
            emptyState.style.display = 'none';
            myNotifs.forEach(n => {
                const item = document.createElement('div');
                item.className = `notif-item ${n.isRead ? '' : 'unread'}`;
                
                const init = (n.senderName || 'F').trim().charAt(0).toUpperCase();
                const av = n.senderAvatar ? `<img class="notif-avatar" src="${n.senderAvatar}">` : `<div class="notif-avatar-initial">${init}</div>`;
                
                item.innerHTML = `
                    <div class="notif-icon-col">${ICONS_SVG[n.type] || ''}</div>
                    <div class="notif-body">
                        <div class="notif-avatar-row">
                            ${av}
                            <span class="notif-time">${formatExactTime(n.createdAt)}</span>
                        </div>
                        <div class="notif-text">
                            <strong>${escapeHtml(n.senderName)}</strong> ${TEXT_MAP[n.type] || ''}
                        </div>
                    </div>
                `;
                
                item.addEventListener('click', () => {
                    // Mark as read
                    if (!n.isRead) {
                        const notifs = Store.load();
                        const found = notifs.find(x => x.id === n.id);
                        if (found) { found.isRead = true; Store.save(notifs); }
                    }
                    
                    // Navigate
                    if (n.type === 'follow') {
                        window.location.href = `profil.html?id=${n.senderId}`;
                    } else if (n.postId) {
                        window.location.href = `index.html?post=${n.postId}`;
                    }
                });
                
                list.appendChild(item);
            });
        }
        updateNotificationBadgeLocal();
    }

    /* Actions */
    document.getElementById('markReadBtn').addEventListener('click', () => {
        let notifs = Store.load();
        let changed = false;
        notifs.forEach(n => {
            if (n.recipientId === currentUser.userId && !n.isRead) { n.isRead = true; changed = true; }
        });
        if (changed) { Store.save(notifs); renderNotifications(); }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
        if(confirm("Barcha bildirishnomalar o'chirilsinmi?")) {
            let notifs = Store.load();
            notifs = notifs.filter(n => n.recipientId !== currentUser.userId);
            Store.save(notifs); renderNotifications();
        }
    });

    /* Live Syncing */
    window.addEventListener('storage', (e) => { if (e.key === NOTIF_KEY) renderNotifications(); });
    window.addEventListener('luz_notifs_updated', renderNotifications);
    
    // Bottom badge update just for this page's icon (hide badge if active)
    function updateNotificationBadgeLocal() {
        const notifs = Store.load();
        const unreadCount = notifs.filter(n => n.recipientId === currentUser?.userId && !n.isRead).length;
        // Sahifa aktiv, badgeni o'zida yashiramiz yoki shunchaki domni yangilaymiz.
        // Hozirgi dizaynda sahifa ichida bo'lsa uni ko'rish shart emas, baribir o'qiladi.
    }

    renderNotifications();
</script>
</body>
</html>
