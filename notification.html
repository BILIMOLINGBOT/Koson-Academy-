<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi Alifbo Konvertori</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-size: 18px;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid #3498db;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #2980b9;
        }
        .rules {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .rules ul {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Yangi Alifboda Yozish</h2>
        
        <!-- Yuqorida joylashgan input (textarea) -->
        <textarea id="textInput" placeholder="Shu yerga yozing. Matn avtomatik o'zgaradi..."></textarea>
        
        <div class="rules">
            <p><strong>Qoidalar (Avtomatik o'zgaradi):</strong></p>
            <ul>
                <li>Oʻ / O' ➔ <strong>Ö</strong> &nbsp; (oʻ / o' ➔ <strong>ö</strong>)</li>
                <li>Gʻ / G' ➔ <strong>Ğ</strong> &nbsp; (gʻ / g' ➔ <strong>ğ</strong>)</li>
                <li>Sh ➔ <strong>Ş</strong> &nbsp; (sh ➔ <strong>ş</strong>)</li>
                <li>Ch ➔ <strong>Ç</strong> &nbsp; (ch ➔ <strong>ç</strong>)</li>
            </ul>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('textInput');

        inputArea.addEventListener('input', function(e) {
            let text = e.target.value;
            
            // Kursorning qayerda turganini saqlab qolamiz
            let cursorStart = e.target.selectionStart;
            let originalLength = text.length;

            // Turli xil tutuq belgilarini inobatga olgan holda almashtirish (' ʻ ‘ `)
            text = text.replace(/O['ʻ‘`]/g, 'Ö');
            text = text.replace(/o['ʻ‘`]/g, 'ö');
            text = text.replace(/G['ʻ‘`]/g, 'Ğ');
            text = text.replace(/g['ʻ‘`]/g, 'ğ');
            
            // Harf birikmalarini almashtirish
            text = text.replace(/Sh/g, 'Ş');
            text = text.replace(/sh/g, 'ş');
            text = text.replace(/SH/g, 'Ş');
            
            text = text.replace(/Ch/g, 'Ç');
            text = text.replace(/ch/g, 'ç');
            text = text.replace(/CH/g, 'Ç');

            // Agar matn o'zgargan bo'lsa, uni inputga qaytaramiz
            if (e.target.value !== text) {
                e.target.value = text;
                
                // Harf birikmalari (masalan 'sh' -> 'ş') uzunligi bittaga qisqargani uchun kursorni to'g'rilash
                let newLength = text.length;
                let lengthDiff = originalLength - newLength;
                
                e.target.setSelectionRange(cursorStart - lengthDiff, cursorStart - lengthDiff);
            }
        });
    </script>

</body>
</html>
