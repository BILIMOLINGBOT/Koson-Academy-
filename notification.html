<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxsus Klaviatura - W va C siz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            overflow: hidden;
        }
        .key { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #2c2d30; 
            border-radius: 8px; 
            font-weight: 500; 
            font-size: 1.35rem; 
            user-select: none; 
            cursor: pointer; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }
        .key:active { 
            background-color: #4a4b4f; 
        }
        .key-action { 
            background-color: #1f2022; 
            padding: 0 12px;
            font-size: 1.1rem;
        }
        .key-space { 
            flex-grow: 1; 
            max-width: 45%; 
        }
        /* Asosiy klaviatura balandligi */
        .keyboard-row {
            height: 48px;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Kiritish maydoni -->
    <div class="flex-1 p-5 flex flex-col">
        <!-- inputmode="none" orqali telefonning original klaviaturasi chiqishini to'xtatamiz -->
        <textarea id="textInput" class="w-full h-full bg-transparent text-3xl outline-none resize-none placeholder-gray-600" placeholder="Yozishni boshlang..." inputmode="none" autofocus></textarea>
    </div>

    <!-- Virtual Klaviatura (Telegram Mini App stilida) -->
    <div class="bg-[#1e1e1e] p-2 pb-8 flex flex-col gap-2 select-none" id="keyboard">
        
        <!-- 1-qator (W olib tashlandi, Ö qo'shildi) -->
        <div class="flex justify-center gap-1.5 keyboard-row">
            <div class="key flex-1 key-letter">q</div>
            <div class="key flex-1 key-letter">e</div>
            <div class="key flex-1 key-letter">r</div>
            <div class="key flex-1 key-letter">t</div>
            <div class="key flex-1 key-letter">y</div>
            <div class="key flex-1 key-letter">u</div>
            <div class="key flex-1 key-letter">i</div>
            <div class="key flex-1 key-letter">o</div>
            <div class="key flex-1 key-letter">p</div>
            <div class="key flex-1 key-letter">ö</div>
        </div>
        
        <!-- 2-qator (Ğ qo'shildi) -->
        <div class="flex justify-center gap-1.5 keyboard-row px-3">
            <div class="key flex-1 key-letter">a</div>
            <div class="key flex-1 key-letter">s</div>
            <div class="key flex-1 key-letter">d</div>
            <div class="key flex-1 key-letter">f</div>
            <div class="key flex-1 key-letter">g</div>
            <div class="key flex-1 key-letter">h</div>
            <div class="key flex-1 key-letter">j</div>
            <div class="key flex-1 key-letter">k</div>
            <div class="key flex-1 key-letter">l</div>
            <div class="key flex-1 key-letter">ğ</div>
        </div>

        <!-- 3-qator (C olib tashlandi, Ş va Ç qo'shildi) -->
        <div class="flex justify-center gap-1.5 keyboard-row">
            <div class="key key-action" onclick="toggleCaps()">⇧</div>
            <div class="key flex-1 key-letter">z</div>
            <div class="key flex-1 key-letter">x</div>
            <div class="key flex-1 key-letter">v</div>
            <div class="key flex-1 key-letter">b</div>
            <div class="key flex-1 key-letter">n</div>
            <div class="key flex-1 key-letter">m</div>
            <div class="key flex-1 key-letter">ş</div>
            <div class="key flex-1 key-letter">ç</div>
            <div class="key key-action" onclick="backspace()">⌫</div>
        </div>

        <!-- 4-qator (Boshqaruv tugmalari) -->
        <div class="flex justify-center gap-1.5 keyboard-row">
            <div class="key key-action">?123</div>
            <div class="key key-action text-xl">🌐</div>
            <div class="key key-space" onclick="insertText(' ')">UZ</div>
            <div class="key key-action text-2xl" onclick="insertText('.')">.</div>
            <div class="key key-action text-blue-500 text-xl font-bold" onclick="insertText('\n')">↵</div>
        </div>
    </div>

    <script>
        const input = document.getElementById('textInput');
        let isCaps = false;

        // Harflarni kiritish
        document.querySelectorAll('.key-letter').forEach(key => {
            key.addEventListener('click', (e) => {
                insertText(e.target.innerText);
            });
        });

        // Kursor turgan joyga matn qistirish
        function insertText(char) {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + char + text.substring(end);
            
            // Kursorni yangilash
            input.selectionStart = input.selectionEnd = start + 1;
            
            // Fokusni inputda ushlab turish (Telegram ekranida yopilib qolmasligi uchun)
            input.focus();
        }

        // O'chirish (Backspace)
        function backspace() {
            const start = input.selectionStart;
            if (start === 0) return;
            const text = input.value;
            input.value = text.substring(0, start - 1) + text.substring(start);
            input.selectionStart = input.selectionEnd = start - 1;
            input.focus();
        }

        // Katta/kichik harflarni o'zgartirish (Caps Lock)
        function toggleCaps() {
            isCaps = !isCaps;
            document.querySelectorAll('.key-letter').forEach(btn => {
                btn.innerText = isCaps ? btn.innerText.toUpperCase() : btn.innerText.toLowerCase();
            });
        }
        
        // Kursor ustiga bosilganda telefonning o'z klaviaturasi chiqib ketishini to'xtatish
        input.addEventListener('touchstart', (e) => {
            // Agar inputmode="none" ishlamasa, bu yordamchi bo'ladi
            input.focus();
        });
    </script>
</body>
</html>
