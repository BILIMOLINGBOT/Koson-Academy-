<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Roboto, Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    min-height: 100vh;
  }

  /* Orqaga qaytish paneli */
  .view-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background-color: #ffffff;
  }

  .back-btn {
    font-size: 20px;
    color: #0f0f0f;
    text-decoration: none;
    margin-right: 20px;
  }

  .view-header h2 {
    font-size: 16px;
    font-weight: 500;
  }

  /* Video Pleer qismi */
  .video-wrapper {
    width: 100%;
    background-color: #000;
  }

  video {
    width: 100%;
    display: block;
    max-height: 270px;
  }

  /* Video ostidagi ma'lumotlar */
  .video-description {
    padding: 16px;
  }

  .video-main-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    color: #0f0f0f;
    margin-bottom: 8px;
  }

  .video-view-count {
    font-size: 13px;
    color: #606060;
    margin-bottom: 16px;
  }

  /* Kanal ma'lumotlari */
  .channel-row {
    display: flex;
    align-items: center;
    border-top: 1px solid #e5e5e5;
    padding-top: 12px;
  }

  .channel-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 12px;
    object-fit: cover;
  }

  .channel-name {
    font-size: 15px;
    font-weight: 500;
    color: #0f0f0f;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> </a>
    <h2>Video Ijro etilmoqda</h2>
  </header>

  <div class="video-wrapper">
    <video controls autoplay poster="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Sizning brauzeringiz video tegini qo'llab-quvvatlamaydi.
    </video>
  </div>

  <div class="video-description">
    <h1 class="video-main-title">Apm Update — Yangi loyiha tafsilotlari</h1>
    <p class="video-view-count">176 marta ko'rildi · 12 soat oldin</p>

    <div class="channel-row">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="channel-avatar">
      <span class="channel-name">TRIPLE R</span>
    </div>
  </div>

</div>

</body>
</html>
