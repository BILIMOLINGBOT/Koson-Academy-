<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* Asosiy sozlamalar */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Roboto, Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  /* Mobil ekran o'lchami */
  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Orqaga qaytish paneli */
  .view-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background-color: #ffffff;
    border-bottom: 1px solid #f2f2f2;
  }

  .back-btn {
    font-size: 20px;
    color: #0f0f0f;
    text-decoration: none;
    margin-right: 20px;
  }

  .view-header h2 {
    font-size: 16px;
    font-weight: 500;
  }

  /* Video Pleer qismi */
  .video-wrapper {
    width: 100%;
    background-color: #000;
  }

  video {
    width: 100%;
    display: block;
    max-height: 270px;
  }

  /* Video ostidagi asosiy blok */
  .video-details-block {
    padding: 14px 16px;
  }

  .video-main-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    color: #0f0f0f;
    margin-bottom: 6px;
  }

  .video-view-count {
    font-size: 13px;
    color: #606060;
    margin-bottom: 16px; /* Boshqa elementlardan ajratish uchun joy */
  }

  /* LIKE, KOMMENT VA ULASHISH TUGMALARI */
  .interactions-bar {
    display: flex;
    gap: 22px; /* Rasmga mos ravishda oraliq masofa */
    margin-bottom: 20px;
    align-items: center;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 8px; /* Ikonka va raqam orasidagi masofa */
    background-color: transparent; /* Orqa fon olingan */
    border: none;
    padding: 0;
    font-size: 17px;
    font-weight: 400; /* Yupqaroq shrift */
    color: #111;
    cursor: pointer;
  }

  .action-btn svg {
    width: 26px;
    height: 26px;
  }

  /* KANAL VA OBUNA BO'LISH QISMI */
  .channel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f2f2f2;
    border-bottom: 1px solid #f2f2f2;
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .channel-left {
    display: flex;
    align-items: center;
  }

  .channel-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-right: 12px;
    object-fit: cover;
  }

  .channel-meta {
    display: flex;
    flex-direction: column;
  }

  .channel-name {
    font-size: 15px;
    font-weight: 600;
    color: #0f0f0f;
  }

  .sub-count {
    font-size: 12px;
    color: #606060;
  }

  /* Obuna bo'lish tugmasi */
  .subscribe-btn {
    background-color: #0f0f0f;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .subscribe-btn:hover {
    opacity: 0.9;
  }

  /* KOMMENTARIYA (IZOHLAR) QISMI */
  .comments-container {
    background-color: #f9f9f9;
    border-radius: 12px;
    padding: 12px;
  }

  .comments-header {
    font-size: 14px;
    font-weight: 600;
    color: #0f0f0f;
    margin-bottom: 10px;
  }

  .comments-header span {
    font-weight: 400;
    color: #606060;
    margin-left: 6px;
  }

  .comment-input-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
  }

  .comment-input-box input {
    flex-grow: 1;
    border: none;
    background-color: #e5e5e5;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }

  .comment-input-box input::placeholder {
    color: #606060;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h2>Video Player</h2>
  </header>

  <div class="video-wrapper">
    <video controls autoplay poster="https://streamable.com/qhxuf7">
      <source src="https://streamable.com/qhxuf7">
      Sizning brauzeringiz video tegini qo'llab-quvvatlamaydi.
    </video>
  </div>

  <div class="video-details-block">
    <h1 class="video-main-title">Apm Update — Yangi loyiha tafsilotlari</h1>
    <p class="video-view-count">176 marta ko'rildi · 12 soat oldin</p>

    <div class="interactions-bar">
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>76</span>
      </button>

      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>5</span>
      </button>

      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round">
          <path d="M20 10l-7-7v4C6 8 4 14 5 19c1.5-3 4-5 8-5v4l7-7z"></path>
        </svg>
      </button>
    </div>

    <div class="channel-row">
      <div class="channel-left">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="channel-avatar">
        <div class="channel-meta">
          <span class="channel-name">TRIPLE R</span>
          <span class="sub-count">45.8K obunachi</span>
        </div>
      </div>
      <button class="subscribe-btn">Obuna boʻlish</button>
    </div>

    

  </div>

</div>

</body>
</html>
