<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    /* iOS va zamonaviy qurilmalarga mos shrift */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    min-height: 100vh;
  }

  /* Orqaga qaytish paneli */
  .view-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background-color: #ffffff;
    border-bottom: 1px solid #e0e0e0;
  }

  .back-btn {
    font-size: 20px;
    color: #0f0f0f;
    text-decoration: none;
    margin-right: 20px;
  }

  .view-header h2 {
    font-size: 16px;
    font-weight: 500;
  }

  /* YouTube iframe uchun responsiv wrapper (16:9 o'lchamni saqlash uchun) */
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; 
    background-color: #000;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* Video ostidagi ma'lumotlar */
  .video-description {
    padding: 16px;
  }

  .video-main-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    color: #0f0f0f;
    margin-bottom: 8px;
  }

  .video-view-count {
    font-size: 13px;
    color: #606060;
    margin-bottom: 16px;
  }

  /* Kanal ma'lumotlari */
  .channel-row {
    display: flex;
    align-items: center;
    border-top: 1px solid #e5e5e5;
    padding-top: 12px;
  }

  .channel-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 12px;
    object-fit: cover;
  }

  .channel-name {
    font-size: 15px;
    font-weight: 500;
    color: #0f0f0f;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h2>Video</h2>
  </header>

  <div class="video-wrapper">
    <iframe 
      src="https://www.youtube.com/embed/yzfuPlkfrkg?autoplay=1" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
      allowfullscreen>
    </iframe>
  </div>

  <div class="video-description">
    <h1 class="video-main-title">Agar maqsadli, lekin dangasa bo'lsangiz... buni ko'ring</h1>
    <p class="video-view-count">1839 marta ko'rildi · 27-may, 2026</p>

    <div class="channel-row">
      <img src="https://ui-avatars.com/api/?name=Baxtiyor+Abidjanov&background=random" alt="Channel Avatar" class="channel-avatar">
      <span class="channel-name">Baxtiyor Abidjanov</span>
    </div>
  </div>

</div>

</body>
</html>
