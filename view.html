<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* --- ASOSIY CSS KODLARI (OLDINGIDEK SAQLANDI) --- */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #000000; display: flex; justify-content: center; color: #ffffff; }
  .app-container { width: 100%; max-width: 480px; background-color: #000000; min-height: 100vh; display: flex; flex-direction: column; }
  
  .view-header { display: flex; align-items: center; padding: 14px 16px; background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 0.5px solid #333333; position: sticky; top: 0; z-index: 10; }
  .back-btn { font-size: 22px; color: #ffffff; text-decoration: none; margin-right: 20px; }
  .view-header h2 { font-size: 17px; font-weight: 600; }
  
  .video-wrapper { width: 100%; background-color: #000; }
  video { width: 100%; display: block; max-height: 300px; }
  
  .video-details-block { padding: 16px; }
  .video-main-title { font-size: 20px; font-weight: 700; line-height: 1.4; color: #ffffff; margin-bottom: 8px; }
  .video-view-count { font-size: 14px; color: #98989d; margin-bottom: 24px; }
  
  .interactions-bar { display: flex; gap: 24px; margin-bottom: 24px; align-items: center; }
  .action-btn { display: flex; align-items: center; gap: 8px; background-color: #1c1c1e; border: none; padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: 500; color: #ffffff; cursor: pointer; transition: 0.2s; }
  .action-btn svg { width: 22px; height: 22px; stroke: #ffffff; transition: 0.2s; }
  
  .channel-row { display: flex; align-items: center; justify-content: space-between; border-top: 0.5px solid #333333; border-bottom: 0.5px solid #333333; padding: 16px 0; margin-bottom: 16px; }
  .channel-left { display: flex; align-items: center; text-decoration: none; color: inherit; cursor: pointer; }
  .channel-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 14px; object-fit: cover; }
  .channel-meta { display: flex; flex-direction: column; }
  .channel-name { font-size: 16px; font-weight: 600; color: #ffffff; }
  .sub-count { font-size: 13px; color: #98989d; }
  
  .subscribe-btn { background-color: #ffffff; color: #000000; border: none; padding: 10px 20px; border-radius: 24px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s, color 0.2s; }
  
  /* YANGI CSS: Obuna bo'lingan holat uchun */
  .subscribe-btn.subscribed { background-color: #333333; color: #ffffff; }

  /* TAVSIYA ETILGAN VIDEOLAR */
  .recommended-section { padding-top: 8px; }
  .video-card { background-color: #000000; margin-bottom: 16px; border-bottom: 0.5px solid #222222; padding-bottom: 14px; }
  .thumbnail-link { display: block; position: relative; text-decoration: none; }
  .thumbnail-link img { width: 100%; height: 240px; display: block; object-fit: cover; }
  .duration { position: absolute; bottom: 8px; right: 8px; background-color: rgba(0, 0, 0, 0.85); color: #ffffff; font-size: 12px; font-weight: 600; padding: 4px 6px; border-radius: 6px; line-height: 1; }
  .video-info { display: flex; padding: 12px 16px 0 16px; align-items: flex-start; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; margin-right: 12px; }
  .video-details { flex-grow: 1; padding-right: 12px; }
  .video-title { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-meta { font-size: 13px; color: #98989d; line-height: 1.4; }
  .more-options { flex-shrink: 0; color: #ffffff; cursor: pointer; font-size: 16px; padding: 4px; }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Video Player</h2>
  </header>

  <div class="video-wrapper">
    <video controls autoplay poster="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
    </video>
  </div>

  <div class="video-details-block">
    <h1 class="video-main-title">Apm Update — Yangi loyiha tafsilotlari</h1>
    <p class="video-view-count"><span id="view-count-text">176</span> marta ko'rildi · <span id="upload-time-text">... oldin</span></p>

    <div class="interactions-bar">
      <button id="like-btn" class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span id="like-count-text">76</span>
      </button>

      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>5</span>
      </button>
    </div>

    <div class="channel-row">
      <a href="profil.html" class="channel-left">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="channel-avatar">
        <div class="channel-meta">
          <span class="channel-name">TRIPLE R</span>
          <span id="sub-count-text" class="sub-count">45.8K obunachi</span>
        </div>
      </a>
      <button id="subscribe-btn" class="subscribe-btn">Obuna boʻlish</button>
    </div>
  </div>

  <div class="recommended-section">
    <div class="video-card">
      <a href="view.html" class="thumbnail-link">
        <img src="https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=800&q=80" alt="Brain thumbnail">
        <span class="duration">5:33</span>
      </a>
      <div class="video-info">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/BBC_News_2019.svg/100px-BBC_News_2019.svg.png" alt="Avatar" class="avatar" style="background: #b00; padding: 2px;">
        <div class="video-details">
          <h3 class="video-title">Is being bilingual good for you brain? | BBC Ideas</h3>
          <p class="video-meta">BBC News · 1,3 mln marta · 1 yil oldin</p>
        </div>
        <div class="more-options"><i class="fa-solid fa-ellipsis-vertical"></i></div>
      </div>
    </div>
  </div>

</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    
    // Noyob kalitlar (Haqiqiy bazada bular video ID si bo'ladi)
    const videoId = "video_001";
    const channelId = "channel_triple_r";

    // ----- 1. KO'RISHNI HISOBLASH (Views) -----
    const viewCountEl = document.getElementById("view-count-text");
    let views = localStorage.getItem(`${videoId}_views`);
    views = views ? parseInt(views) + 1 : 176; // Boshlang'ich qiymat 176
    localStorage.setItem(`${videoId}_views`, views);
    viewCountEl.innerText = formatNumber(views);

    // ----- 2. YUKLANGAN VAQT (Time Ago) -----
    const uploadTimeEl = document.getElementById("upload-time-text");
    let uploadDate = localStorage.getItem(`${videoId}_uploadDate`);
    
    // Agar birinchi marta ochilayotgan bo'lsa, xozirgi vaqtdan 12 soat oldingi vaqtni yozib qo'yamiz
    if (!uploadDate) {
      const pastTime = new Date().getTime() - (12 * 60 * 60 * 1000); // 12 soat oldin
      uploadDate = new Date(pastTime).toISOString();
      localStorage.setItem(`${videoId}_uploadDate`, uploadDate);
    }
    uploadTimeEl.innerText = timeAgo(new Date(uploadDate));

    // ----- 3. LIKE TIZIMI -----
    const likeBtn = document.getElementById("like-btn");
    const likeCountEl = document.getElementById("like-count-text");
    const likeIcon = likeBtn.querySelector("svg");
    
    let isLiked = localStorage.getItem(`${videoId}_isLiked`) === "true";
    let likes = parseInt(localStorage.getItem(`${videoId}_likes`)) || 76; // Boshlang'ich 76
    
    function updateLikeUI() {
      likeCountEl.innerText = formatNumber(likes);
      if (isLiked) {
        likeIcon.setAttribute("fill", "#ffffff"); // Ichini oq rangga boyash
      } else {
        likeIcon.setAttribute("fill", "none");
      }
    }
    updateLikeUI();

    likeBtn.addEventListener("click", () => {
      isLiked = !isLiked;
      likes = isLiked ? likes + 1 : likes - 1;
      localStorage.setItem(`${videoId}_isLiked`, isLiked);
      localStorage.setItem(`${videoId}_likes`, likes);
      updateLikeUI();
    });

    // ----- 4. OBUNA BO'LISH (Subscribe) -----
    const subBtn = document.getElementById("subscribe-btn");
    const subCountEl = document.getElementById("sub-count-text");
    
    let isSubbed = localStorage.getItem(`${channelId}_isSubbed`) === "true";
    let subs = parseInt(localStorage.getItem(`${channelId}_subs`)) || 45800; // Boshlang'ich 45.8K (45800)

    function updateSubUI() {
      subCountEl.innerText = `${formatNumber(subs)} obunachi`;
      if (isSubbed) {
        subBtn.innerText = "Obuna boʻlgansiz";
        subBtn.classList.add("subscribed");
      } else {
        subBtn.innerText = "Obuna boʻlish";
        subBtn.classList.remove("subscribed");
      }
    }
    updateSubUI();

    subBtn.addEventListener("click", () => {
      isSubbed = !isSubbed;
      subs = isSubbed ? subs + 1 : subs - 1;
      localStorage.setItem(`${channelId}_isSubbed`, isSubbed);
      localStorage.setItem(`${channelId}_subs`, subs);
      updateSubUI();
    });

    // --- Yordamchi funksiyalar ---
    
    // Raqamlarni qisqartirish (masalan: 45800 -> 45.8K)
    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1).replace('.0', '') + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1).replace('.0', '') + 'K';
      return num.toString();
    }

    // Vaqt farqini hisoblash funksiyasi
    function timeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + " yil oldin";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + " oy oldin";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + " kun oldin";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + " soat oldin";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + " daqiqa oldin";
      return Math.floor(seconds) + " soniya oldin";
    }

  });
</script>

</body>
</html>
