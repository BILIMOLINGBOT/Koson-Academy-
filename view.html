<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* Asosiy sozlamalar */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: Roboto, Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
  }

  /* Mobil ekran o'lchami */
  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Orqaga qaytish paneli */
  .view-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    background-color: #ffffff;
    border-bottom: 1px solid #f2f2f2;
  }

  .back-btn {
    font-size: 20px;
    color: #0f0f0f;
    text-decoration: none;
    margin-right: 20px;
  }

  .view-header h2 {
    font-size: 16px;
    font-weight: 500;
  }

  /* Video Pleer qismi */
  .video-wrapper {
    width: 100%;
    background-color: #000;
  }

  video {
    width: 100%;
    display: block;
    max-height: 270px;
  }

  /* Video ostidagi asosiy blok */
  .video-details-block {
    padding: 14px 16px;
  }

  .video-main-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    color: #0f0f0f;
    margin-bottom: 6px;
  }

  .video-view-count {
    font-size: 13px;
    color: #606060;
    margin-bottom: 12px;
  }

  /* LIKE VA ULASHISH TUGMALARI */
  .interactions-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background-color: #f2f2f2;
    border: none;
    padding: 8px 16px;
    border-radius: 18px; /* Yumaloq zamonaviy shakl */
    font-size: 14px;
    font-weight: 500;
    color: #0f0f0f;
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .action-btn:hover {
    background-color: #e5e5e5;
  }

  /* KANAL VA OBUNA BO'LISH QISMI */
  .channel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid #f2f2f2;
    border-bottom: 1px solid #f2f2f2;
    padding: 12px 0;
    margin-bottom: 16px;
  }

  .channel-left {
    display: flex;
    align-items: center;
  }

  .channel-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-right: 12px;
    object-fit: cover;
  }

  .channel-meta {
    display: flex;
    flex-direction: column;
  }

  .channel-name {
    font-size: 15px;
    font-weight: 600;
    color: #0f0f0f;
  }

  .sub-count {
    font-size: 12px;
    color: #606060;
  }

  /* Obuna bo'lish tugmasi */
  .subscribe-btn {
    background-color: #0f0f0f;
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .subscribe-btn:hover {
    opacity: 0.9;
  }

  /* KOMMENTARIYA (IZOHLAR) QISMI */
  .comments-container {
    background-color: #f9f9f9;
    border-radius: 12px;
    padding: 12px;
  }

  .comments-header {
    font-size: 14px;
    font-weight: 600;
    color: #0f0f0f;
    margin-bottom: 10px;
  }

  .comments-header span {
    font-weight: 400;
    color: #606060;
    margin-left: 6px;
  }

  .comment-input-box {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
  }

  .comment-input-box input {
    flex-grow: 1;
    border: none;
    background-color: #e5e5e5;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }

  .comment-input-box input::placeholder {
    color: #606060;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h2>Video Player</h2>
  </header>

  <div class="video-wrapper">
    <video controls autoplay poster="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Sizning brauzeringiz video tegini qo'llab-quvvatlamaydi.
    </video>
  </div>

  <div class="video-details-block">
    <h1 class="video-main-title">Apm Update — Yangi loyiha tafsilotlari</h1>
    <p class="video-view-count">176 marta ko'rildi · 12 soat oldin</p>

    <div class="interactions-bar">
      <button class="action-btn">
        <i class="fa-regular fa-thumbs-up"></i>
        <span>1.2K</span>
      </button>
      
      <button class="action-btn">
        <i class="fa-solid fa-share"></i>
        <span>Ulashish</span>
      </button>
    </div>

    <div class="channel-row">
      <div class="channel-left">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="channel-avatar">
        <div class="channel-meta">
          <span class="channel-name">TRIPLE R</span>
          <span class="sub-count">45.8K obunachi</span>
        </div>
      </div>
      <button class="subscribe-btn">Obuna boʻlish</button>
    </div>

    <div class="comments-container">
      <div class="comments-header">
        Izohlar <span>24</span>
      </div>
      <div class="comment-input-box">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="User Avatar" class="user-avatar">
        <input type="text" placeholder="Izoh qoldiring...">
      </div>
    </div>

  </div>

</div>

</body>
</html>
