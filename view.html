<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Player - View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #000000;
    display: flex;
    justify-content: center;
    color: #ffffff;
  }

  .app-container {
    width: 100%;
    max-width: 480px; 
    background-color: #000000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .view-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    background-color: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid #333333;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .back-btn {
    font-size: 22px;
    color: #ffffff;
    text-decoration: none;
    margin-right: 20px;
  }

  .view-header h2 {
    font-size: 17px;
    font-weight: 600;
  }

  .video-wrapper {
    width: 100%;
    background-color: #000;
  }

  video {
    width: 100%;
    display: block;
    max-height: 300px;
  }

  .video-details-block {
    padding: 16px;
  }

  .video-main-title {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
    color: #ffffff; /* To'q oq rang va qalin shrift */
    margin-bottom: 8px;
  }

  .video-view-count {
    font-size: 14px;
    color: #98989d;
    margin-bottom: 24px;
  }

  /* LIKE, KOMMENT VA ULASHISH TUGMALARI */
  .interactions-bar {
    display: flex;
    gap: 24px; 
    margin-bottom: 24px;
    align-items: center;
  }

  .action-btn {
    display: flex;
    align-items: center;
    gap: 8px; 
    background-color: #1c1c1e; /* Tugmalar foni uchun to'q kulrang */
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 500; 
    color: #ffffff;
    cursor: pointer;
  }

  .action-btn svg {
    width: 22px;
    height: 22px;
    stroke: #ffffff; /* SVG iconlari oq bo'lishi uchun */
  }

  /* KANAL VA OBUNA BO'LISH QISMI */
  .channel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 0.5px solid #333333;
    border-bottom: 0.5px solid #333333;
    padding: 16px 0;
    margin-bottom: 16px;
  }

  .channel-left {
    display: flex;
    align-items: center;
  }

  .channel-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    margin-right: 14px;
    object-fit: cover;
  }

  .channel-meta {
    display: flex;
    flex-direction: column;
  }

  .channel-name {
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
  }

  .sub-count {
    font-size: 13px;
    color: #98989d;
  }

  /* Obuna bo'lish tugmasi (iOS High Contrast) */
  .subscribe-btn {
    background-color: #ffffff;
    color: #000000;
    border: none;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .subscribe-btn:hover {
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="app-container">

  <header class="view-header">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <h2>Video Player</h2>
  </header>

  <div class="video-wrapper">
    <video controls autoplay poster="https://images.unsplash.com/photo-1559416523-140ddc3d238c?auto=format&fit=crop&w=800&q=80">
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Sizning brauzeringiz video tegini qo'llab-quvvatlamaydi.
    </video>
  </div>

  <div class="video-details-block">
    <h1 class="video-main-title">Apm Update — Yangi loyiha tafsilotlari</h1>
    <p class="video-view-count">176 marta ko'rildi · 12 soat oldin</p>

    <div class="interactions-bar">
      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>76</span>
      </button>

      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>5</span>
      </button>

      <button class="action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linejoin="round">
          <path d="M20 10l-7-7v4C6 8 4 14 5 19c1.5-3 4-5 8-5v4l7-7z"></path>
        </svg>
      </button>
    </div>

    <div class="channel-row">
      <div class="channel-left">
        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80" alt="Channel Avatar" class="channel-avatar">
        <div class="channel-meta">
          <span class="channel-name">TRIPLE R</span>
          <span class="sub-count">45.8K obunachi</span>
        </div>
      </div>
      <button class="subscribe-btn">Obuna boʻlish</button>
    </div>

  </div>

</div>

</body>
</html>
