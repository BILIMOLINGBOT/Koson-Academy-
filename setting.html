<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sozlamalar</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
            overscroll-behavior-y: none;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding-bottom: 130px; 
            background-color: #000000;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px 16px;
            margin-top: 20px; /* iOS safe area top uchun */
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-back:active {
            opacity: 0.6;
        }

        .btn-back svg {
            width: 24px;
            height: 24px;
            stroke: #0a84ff; /* iOS Blue */
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: -4px;
        }

        /* ===== SECTION (KARTASIZ - EDGE-TO-EDGE) ===== */
        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 400;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            padding: 0 16px 8px 16px;
        }

        .settings-group {
            background-color: #1c1c1e;
            border-top: 0.5px solid #2c2c2e;
            border-bottom: 0.5px solid #2c2c2e;
        }

        .setting-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .setting-item:active {
            background-color: #2c2c2e;
        }

        /* Bo'luvchi chiziq */
        .setting-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 58px; /* Ikonkadan o'tib boshlanadi */
            right: 0;
            height: 0.5px;
            background-color: #38383a;
        }

        .setting-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .setting-icon svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Ikonkalar uchun iOS ranglari */
        .bg-blue { background-color: #0a84ff; }
        .bg-indigo { background-color: #5e5ce6; }
        .bg-red { background-color: #ff453a; }
        .bg-green { background-color: #32d74b; }
        .bg-orange { background-color: #ff9f0a; }
        .bg-gray { background-color: #8e8e93; }

        .setting-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .setting-title {
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .setting-subtitle {
            font-size: 13px;
            color: #8e8e93;
            font-weight: 400;
        }

        .setting-value {
            font-size: 16px;
            color: #8e8e93;
            margin-left: auto;
            margin-right: 8px;
        }

        .setting-arrow {
            width: 14px;
            height: 14px;
            stroke: #5c5c5e;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* iOS toggle switch */
        .toggle-switch {
            position: relative;
            width: 51px;
            height: 31px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background-color: #39393d;
            border-radius: 31px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .toggle-track::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .toggle-switch input:checked + .toggle-track {
            background-color: #32d74b;
        }

        .toggle-switch input:checked + .toggle-track::before {
            transform: translateX(20px);
        }

        /* ===== BOTTOM NAVIGATION (4 ta bo'lim) ===== */
        .bottom-nav {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 380px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            z-index: 50;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
        }

        .bottom-nav-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
            text-decoration: none;
            color: #8e8e93;
            transition: color 0.2s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { transform: scale(0.92); }
        .nav-active { color: #ffffff; }

        .nav-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
        }

        .nav-avatar, .nav-avatar-initial {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-avatar-initial {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            background: linear-gradient(135deg, #3a3a3c 0%, #1c1c1e 100%);
            color: #fff;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%) translateY(20px);
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- HEADER -->
        <div class="page-header">
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-back" id="backBtn" aria-label="Orqaga">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    <span style="color:#0a84ff; font-size:17px; margin-left:2px;">Profil</span>
                </button>
                <h1 class="page-title">Sozlamalar</h1>
            </div>
        </div>

        <!-- HISOB -->
        <div class="section">
            <div class="section-title">Hisob</div>
            <div class="settings-group">
                <div class="setting-item" data-action="account">
                    <div class="setting-icon bg-blue">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Shaxsiy ma'lumotlar</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>

                <div class="setting-item" data-action="verified">
                    <div class="setting-icon bg-indigo">
                        <svg viewBox="0 0 24 24">
                            <polygon points="12 2 15 8 22 9 17 14 18 21 12 17.5 6 21 7 14 2 9 9 8 12 2"></polygon>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Tasdiqlangan belgi</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>

                <div class="setting-item" data-action="notification" style="cursor: default;">
                    <div class="setting-icon bg-red">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Bildirishnomalar</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notifToggle" checked>
                        <span class="toggle-track"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- MAXFIYLIK -->
        <div class="section">
            <div class="section-title">Maxfiylik va Xavfsizlik</div>
            <div class="settings-group">
                <div class="setting-item" data-action="privacy">
                    <div class="setting-icon bg-green">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Maxfiylik siyosati</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>

                <div class="setting-item" data-action="history">
                    <div class="setting-icon bg-orange">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Faollik tarixi</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
            </div>
        </div>

        <!-- QO'LLAB-QUVVATLASH VA HUJJATLAR -->
        <div class="section">
            <div class="section-title">Qo'shimcha</div>
            <div class="settings-group">
                <div class="setting-item" data-action="help">
                    <div class="setting-icon bg-blue">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Yordam</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
                <div class="setting-item" data-action="terms">
                    <div class="setting-icon bg-gray">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Shartlar va Qoidalar</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- OROLCHA NAVIGATSIYA -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Uy</span>
            </a>
            
            <a href="notification.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span class="nav-label">Bildirishnoma</span>
            </a>
            
            <a href="qidiruv.html" class="nav-btn nav-inactive">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="nav-label">Qidiruv</span>
            </a>
            
            <a href="profil.html" class="nav-btn nav-active" id="navProfileLink">
                <span id="navAvatarSlot"></span>
                <span class="nav-label">Profil</span>
            </a>
        </div>
    </nav>

    
    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            try {
                tg.ready(); tg.expand();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
            } catch {}
        }

        // Navigatsiya Avatarini yuklash
        function loadNavAvatar() {
            let userData = null;
            
            // Telegramdan yoki DB dan o'qiymiz (loyihangiz mantig'iga ko'ra)
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userData = tg.initDataUnsafe.user;
            } else {
                try {
                    const users = JSON.parse(localStorage.getItem('luz_users')) || [];
                    const cid = localStorage.getItem('luz_current_user');
                    userData = users.find(u => String(u.userId) === String(cid));
                } catch(e) {}
            }

            const slot = document.getElementById('navAvatarSlot');
            const name = userData ? [userData.first_name || userData.firstName, userData.last_name || userData.lastName].filter(Boolean).join(' ') : 'F';
            const init = (name.trim().charAt(0) || 'F').toUpperCase();
            
            if (userData && userData.photo_url) {
                slot.innerHTML = `<img src="${userData.photo_url}" class="nav-avatar" alt="Avatar">`;
            } else {
                slot.innerHTML = `<div class="nav-avatar-initial">${init}</div>`;
            }
        }
        loadNavAvatar();

        function haptic(type = 'light') {
            if (tg && tg.HapticFeedback) {
                if (type === 'selection') tg.HapticFeedback.selectionChanged();
                else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
                else tg.HapticFeedback.impactOccurred(type);
            }
        }

        document.getElementById('backBtn').addEventListener('click', function() {
            haptic('light');
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'profil.html';
        });

        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                if (window.history.length > 1) window.history.back();
                else window.location.href = 'profil.html';
            });
        }

        document.querySelectorAll('.setting-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (e.target.closest('.toggle-switch')) return;
                const action = this.dataset.action;
                haptic('light');

                switch(action) {
                    case 'account': showToast('Shaxsiy ma\'lumotlar'); break;
                    case 'verified': showToast('Tasdiqlangan belgi arizasi'); break;
                    case 'notification':
                        const toggle = document.getElementById('notifToggle');
                        toggle.checked = !toggle.checked;
                        toggle.dispatchEvent(new Event('change'));
                        break;
                    case 'privacy': showToast('Maxfiylik siyosati'); break;
                    case 'history': showToast('Faollik tarixi'); break;
                    case 'terms': showToast('Foydalanish shartlari'); break;
                    case 'help': showToast('Yordam markazi'); break;
                }
            });
        });

        const notifToggle = document.getElementById('notifToggle');
        notifToggle.addEventListener('change', function(e) {
            e.stopPropagation();
            haptic('selection');
            showToast(this.checked ? 'Bildirishnomalar yoqildi' : 'Bildirishnomalar o\'chirildi');
            try { localStorage.setItem('notifications_enabled', this.checked ? '1' : '0'); } catch (e) {}
        });

        try {
            const saved = localStorage.getItem('notifications_enabled');
            if (saved === '0') notifToggle.checked = false;
        } catch (e) {}

        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
