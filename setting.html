<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Sozlamalar</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
            overscroll-behavior-y: none;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            padding-bottom: 130px;
            background-color: #000000;
            min-height: 100vh;
        }

        /* ===== HEADER (Fullscreen tugmalari uchun 90px top padding) ===== */
        .page-header,
        .modern-header,
        .detail-header,
        .comment-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 90px 16px 16px;
            margin-top: 0;
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 10;
        }

        .btn-back {
            height: 36px;
            border-radius: 50%;
            background-color: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .btn-back:active {
            opacity: 0.6;
        }

        .btn-back svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-back-text {
            color: #ffffff;
            font-size: 17px;
            font-weight: 500;
            margin-left: 2px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: -4px;
        }

        /* ===== SECTION (KARTASIZ, FAQAT OQ VA QORA) ===== */
        .section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0 16px 8px 16px;
        }

        .settings-group {
            background-color: transparent;
        }

        .setting-item {
            display: flex;
            align-items: center;
            padding: 13px 16px;
            cursor: pointer;
            background-color: #000000;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .setting-item:active {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* Yupqa oq ajratuvchi chiziq */
        .setting-item:not(:last-child)::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 60px;
            right: 16px;
            height: 0.5px;
            background-color: rgba(255, 255, 255, 0.14);
        }

        .setting-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .setting-icon svg {
            width: 18px;
            height: 18px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .setting-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .setting-title {
            font-size: 16px;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .setting-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .setting-arrow {
            width: 15px;
            height: 15px;
            stroke: rgba(255, 255, 255, 0.45);
            fill: none;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Monoxrom Oq-Qora Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 51px;
            height: 31px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-track {
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 31px;
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .toggle-track::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 25px;
            height: 25px;
            background-color: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease;
        }

        .toggle-switch input:checked + .toggle-track {
            background-color: #ffffff;
            border-color: #ffffff;
        }

        .toggle-switch input:checked + .toggle-track::before {
            transform: translateX(20px);
            background-color: #000000;
        }

        /* ISLAND NAV (notification.html bilan bir xil) */
        .bottom-nav{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:380px;background:rgba(28,28,30,0.85);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:40px;z-index:50;box-shadow:0 10px 40px rgba(0,0,0,0.6);padding:6px 12px}
        .bottom-nav-inner{display:flex;justify-content:space-between;align-items:center;width:100%}
        .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;text-decoration:none;color:#8e8e93;transition:color .2s,transform .2s;position:relative}
        .nav-btn:active{transform:scale(.92)}
        .nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .nav-active{color:#fff}
        .nav-label{font-size:10px;font-weight:600}
        .nav-avatar,.nav-avatar-initial{width:26px;height:26px;border-radius:50%;object-fit:cover}
        .nav-avatar-initial{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:linear-gradient(135deg,#3a3a3c 0%,#1c1c1e 100%);color:#fff}
        .nav-badge{position:absolute;top:2px;right:25%;background:#ff2d55;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:2px 5px;min-width:16px;text-align:center;line-height:1;border:2px solid #1c1c1e;z-index:10}

        /* ===== TOAST (OQ VA QORA) ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 120px;
            transform: translateX(-50%) translateY(20px);
            background: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- HEADER -->
        <div class="page-header">
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-back" id="backBtn" aria-label="Orqaga">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    <span class="btn-back-text">Profil</span>
                </button>
                <h1 class="page-title">Sozlamalar</h1>
            </div>
        </div>

        <!-- HISOB -->
        <div class="section">
            <div class="section-title">Hisob</div>
            <div class="settings-group">
                <a href="personal-info.html" class="setting-item" data-action="account">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Shaxsiy ma'lumotlar</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <a href="verified-badge.html" class="setting-item" data-action="verified">
                    <div class="setting-icon">
                        <!-- Zamonaviy tasdiqlash belgisi (Modern Verified Badge) -->
                        <svg viewBox="0 0 24 24">
                            <path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z" fill="#ffffff" stroke="none"></path>
                            <path d="m9 12 2 2 4-4" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Tasdiqlangan belgi</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <div class="setting-item" data-action="notification" style="cursor: default;">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Bildirishnomalar</span>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="notifToggle" checked>
                        <span class="toggle-track"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- MAXFIYLIK -->
        <div class="section">
            <div class="section-title">Maxfiylik va Xavfsizlik</div>
            <div class="settings-group">
                <a href="privacy-policy.html" class="setting-item" data-action="privacy">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Maxfiylik siyosati</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <a href="activity-history.html" class="setting-item" data-action="history">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Faollik tarixi</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>
            </div>
        </div>

        <!-- QO'LLAB-QUVVATLASH VA HUJJATLAR -->
        <div class="section">
            <div class="section-title">Qo'shimcha</div>
            <div class="settings-group">
                <a href="help.html" class="setting-item" data-action="help">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Yordam</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>

                <a href="terms-and-conditions.html" class="setting-item" data-action="terms">
                    <div class="setting-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <div class="setting-content">
                        <span class="setting-title">Shartlar va Qoidalar</span>
                    </div>
                    <svg class="setting-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>
            </div>
        </div>
    </div>

    <!-- OROLCHA NAVIGATSIYA (notification.html bilan bir xil) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <a href="index.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Uy</span></a>
            <a href="notification.html" class="nav-btn nav-inactive" id="navNotifBtn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span class="nav-label">Bildirishnoma</span></a>
            <a href="qidiruv.html" class="nav-btn nav-inactive"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label">Qidiruv</span></a>
            <a href="profil.html" class="nav-btn nav-active" id="navProfileLink"><span id="navAvatarSlot"></span><span class="nav-label">Profil</span></a>
        </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const NOTIF_KEY = 'notifications';
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
            } catch {}
        }

        function getCurrentUser() {
            const cid = localStorage.getItem('luz_current_user');
            try {
                const users = JSON.parse(localStorage.getItem('luz_users')) || [];
                if (cid) {
                    const found = users.find(u => String(u.userId) === String(cid));
                    if (found) return found;
                }
            } catch(e) {}

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                return { ...u, userId: String(u.id) };
            }

            return cid ? { userId: String(cid) } : null;
        }

        const currentUser = getCurrentUser();

        function loadNavAvatar() {
            const slot = document.getElementById('navAvatarSlot');
            if (!slot) return;
            const name = currentUser ? [currentUser.first_name || currentUser.firstName, currentUser.last_name || currentUser.lastName].filter(Boolean).join(' ') : 'F';
            const init = (name.trim().charAt(0) || 'F').toUpperCase();

            if (currentUser && currentUser.photo_url) {
                slot.innerHTML = `<img src="${currentUser.photo_url}" class="nav-avatar" alt="Avatar">`;
            } else {
                slot.innerHTML = `<div class="nav-avatar-initial">${init}</div>`;
            }
        }
        loadNavAvatar();

        /* ================= BILDIRISHNOMALAR BADGE ================= */
        function updateNotificationBadgeLocal() {
            const btn = document.getElementById('navNotifBtn');
            if (!btn) return;
            let unreadCount = 0;
            try {
                const list = JSON.parse(localStorage.getItem(NOTIF_KEY)) || [];
                unreadCount = list.filter(n => String(n.recipientId) === String(currentUser?.userId) && !n.isRead).length;
            } catch {}
            let badge = document.getElementById('notifBadge');
            if (unreadCount > 0) {
                if (!badge) {
                    badge = document.createElement('div');
                    badge.id = 'notifBadge';
                    badge.className = 'nav-badge';
                    btn.appendChild(badge);
                }
                badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
            } else if (badge) {
                badge.remove();
            }
        }

        updateNotificationBadgeLocal();
        window.addEventListener('storage', (e) => { if (e.key === NOTIF_KEY) updateNotificationBadgeLocal(); });
        window.addEventListener('luz_notifs_updated', updateNotificationBadgeLocal);

        function haptic(type = 'light') {
            if (tg && tg.HapticFeedback) {
                if (type === 'selection') tg.HapticFeedback.selectionChanged();
                else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
                else tg.HapticFeedback.impactOccurred(type);
            }
        }

        document.getElementById('backBtn').addEventListener('click', function() {
            haptic('light');
            if (window.history.length > 1) window.history.back();
            else window.location.href = 'profil.html';
        });

        if (tg && tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(function() {
                if (window.history.length > 1) window.history.back();
                else window.location.href = 'profil.html';
            });
        }

        document.querySelectorAll('.setting-item').forEach(item => {
            item.addEventListener('click', function(e) {
                if (e.target.closest('.toggle-switch')) return;
                haptic('light');

                if (this.dataset.action === 'notification') {
                    const toggle = document.getElementById('notifToggle');
                    toggle.checked = !toggle.checked;
                    toggle.dispatchEvent(new Event('change'));
                }
            });
        });

        const notifToggle = document.getElementById('notifToggle');
        notifToggle.addEventListener('change', function(e) {
            e.stopPropagation();
            haptic('selection');
            showToast(this.checked ? 'Bildirishnomalar yoqildi' : 'Bildirishnomalar o\'chirildi');
            try { localStorage.setItem('notifications_enabled', this.checked ? '1' : '0'); } catch (e) {}
        });

        try {
            const saved = localStorage.getItem('notifications_enabled');
            if (saved === '0') notifToggle.checked = false;
        } catch (e) {}

        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
