<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Video yuklash</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #000000 !important;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .update-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 20px calc(20px + env(safe-area-inset-bottom));
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-top: 8px;
        }

        .back-btn {
            width: 40px; height: 40px;
            background-color: #1c1c1e;
            border: none;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
        }

        .back-btn:active { transform: scale(0.92); background-color: #2c2c2e; }

        .back-btn svg {
            width: 20px; height: 20px;
            stroke: currentColor; fill: none;
            stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
        }

        .header-spacer {
            width: 40px;
        }

        /* ========================= */
        /* 1-BOSQICH: GALEREYA       */
        /* ========================= */
        .step-gallery {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
            padding: 40px 0;
        }

        .gallery-icon {
            width: 100px; height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, #007aff 0%, #0051d5 100%);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 32px rgba(0, 122, 255, 0.35);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gallery-icon svg {
            width: 48px; height: 48px;
            stroke: #fff; fill: none;
            stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        .gallery-title {
            font-size: 22px;
            font-weight: 700;
        }

        .gallery-desc {
            font-size: 15px;
            color: #8e8e93;
            max-width: 300px;
            line-height: 1.5;
        }

        .pick-btn {
            margin-top: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            color: #000;
            border: none;
            border-radius: 100px;
            padding: 16px 36px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease;
        }

        .pick-btn:active { transform: scale(0.95); }

        .pick-btn svg {
            width: 20px; height: 20px;
            stroke: #000; fill: none;
            stroke-width: 2.2;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ========================= */
        /* 2-BOSQICH: PREVIEW        */
        /* ========================= */
        .step-preview {
            display: none;
            flex-direction: column;
            flex: 1;
            gap: 16px;
        }

        .step-preview.active { display: flex; }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 9 / 16;
            max-height: 55vh;
            background-color: #1c1c1e;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .video-badge-96 {
            position: absolute;
            top: 12px; left: 12px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px);
            border-radius: 100px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            color: #fff;
        }

        .video-badge-96 svg {
            width: 12px; height: 12px;
            stroke: #4ade80; fill: none;
            stroke-width: 2.5;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* Input qismi */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-size: 14px;
            font-weight: 500;
            color: #8e8e93;
            padding-left: 4px;
        }

        .title-input {
            width: 100%;
            background-color: #1c1c1e;
            border: 1.5px solid #2c2c2e;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 15px;
            color: #fff;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
            resize: none;
            min-height: 54px;
            max-height: 120px;
            line-height: 1.4;
        }

        .title-input:focus {
            border-color: #007aff;
            background-color: #1a1a1c;
        }

        .title-input::placeholder {
            color: #5c5c5e;
        }

        /* Yuborish tugmasi */
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #e5e5e5 100%);
            color: #000;
            border: none;
            border-radius: 100px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:active { transform: scale(0.97); }

        .submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn svg {
            width: 20px; height: 20px;
            stroke: #000; fill: none;
            stroke-width: 2.5;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* ========================= */
        /* 3-BOSQICH: YUKLANISH      */
        /* ========================= */
        .step-uploading {
            display: none;
            flex-direction: column;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            padding: 40px 0;
        }

        .step-uploading.active { display: flex; }

        .upload-spinner {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 4px solid #2c2c2e;
            border-top-color: #007aff;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .upload-title {
            font-size: 20px;
            font-weight: 700;
        }

        .upload-desc {
            font-size: 14px;
            color: #8e8e93;
        }

        .progress-bar {
            width: 100%;
            max-width: 260px;
            height: 6px;
            background-color: #2c2c2e;
            border-radius: 100px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #007aff, #4ade80);
            border-radius: 100px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: #8e8e93;
            font-weight: 500;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #2c2c2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="update-container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" id="backBtn" aria-label="Orqaga">
                <svg viewBox="0 0 24 24">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1 class="header-title" id="headerTitle">Video yuklash</h1>
            <div class="header-spacer"></div>
        </div>

        <!-- 1-BOSQICH: Galereya -->
        <div class="step-gallery" id="stepGallery">
            <div class="gallery-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </div>
            <h2 class="gallery-title">Video tanlang</h2>
            <p class="gallery-desc">Galereyadan 9:16 o'lchamidagi videoni tanlang</p>
            <button class="pick-btn" id="pickBtn">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Galereyadan tanlash
            </button>
        </div>

        <!-- 2-BOSQICH: Preview + Sarlavha -->
        <div class="step-preview" id="stepPreview">
            <div class="video-wrapper">
                <video id="previewVideo" controls playsinline></video>
                <div class="video-badge-96">
                    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    9:16
                </div>
            </div>

            <div class="input-section">
                <label class="input-label" for="titleInput">Sarlavha</label>
                <textarea
                    id="titleInput"
                    class="title-input"
                    placeholder="Videongizga sarlavha yozing..."
                    rows="2"
                    maxlength="150"
                ></textarea>
            </div>

            <button class="submit-btn" id="submitBtn" disabled>
                Yuborish
                <svg viewBox="0 0 24 24">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>

        <!-- 3-BOSQICH: Yuklanmoqda -->
        <div class="step-uploading" id="stepUploading">
            <div class="upload-spinner"></div>
            <div>
                <h2 class="upload-title">Yuklanmoqda...</h2>
                <p class="upload-desc">Iltimos, kuting</p>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="videoFileInput" accept="video/*" style="display:none">

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================
        // TELEGRAM
        // ============================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
        }

        // ============================
        // TOAST
        // ============================
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ============================
        // STORAGE
        // ============================
        const STORAGE_KEY = 'profile_posts_v1';

        function getPosts() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch { return []; }
        }

        function savePosts(posts) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
        }

        function addPost(post) {
            const posts = getPosts();
            posts.unshift(post);
            savePosts(posts);
        }

        // ============================
        // BOSQICHLAR
        // ============================
        const stepGallery = document.getElementById('stepGallery');
        const stepPreview = document.getElementById('stepPreview');
        const stepUploading = document.getElementById('stepUploading');
        const headerTitle = document.getElementById('headerTitle');

        function showStep(name) {
            stepGallery.style.display = 'none';
            stepPreview.classList.remove('active');
            stepUploading.classList.remove('active');

            if (name === 'gallery') {
                stepGallery.style.display = 'flex';
                headerTitle.textContent = 'Video yuklash';
            } else if (name === 'preview') {
                stepPreview.classList.add('active');
                headerTitle.textContent = 'Video ko\'rish';
            } else if (name === 'uploading') {
                stepUploading.classList.add('active');
                headerTitle.textContent = 'Yuklanmoqda';
            }
        }

        // ============================
        // VIDEO TANLASH
        // ============================
        const fileInput = document.getElementById('videoFileInput');
        let selectedFile = null;
        let selectedVideoURL = null;

        document.getElementById('pickBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Tekshirish: video ekanligiga
            if (!file.type.startsWith('video/')) {
                showToast('Iltimos, video fayl tanlang');
                return;
            }

            selectedFile = file;
            selectedVideoURL = URL.createObjectURL(file);

            // Preview'ga o'tish
            const video = document.getElementById('previewVideo');
            video.src = selectedVideoURL;

            showStep('preview');

            // Sarlavha inputga fokus
            setTimeout(() => document.getElementById('titleInput').focus(), 350);
        });

        // ============================
        // SARLAVHA INPUT
        // ============================
        const titleInput = document.getElementById('titleInput');
        const submitBtn = document.getElementById('submitBtn');

        titleInput.addEventListener('input', () => {
            const hasTitle = titleInput.value.trim().length > 0;
            submitBtn.disabled = !hasTitle;
        });

        // ============================
        // YUBORISH
        // ============================
        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showToast('Avval video tanlang');
                return;
            }

            const title = titleInput.value.trim();
            if (!title) {
                showToast('Sarlavha yozing');
                return;
            }

            tg?.HapticFeedback?.impactOccurred('medium');

            // Yuklanish bosqichiga o'tish
            showStep('uploading');

            // Simulyatsiya: progress
            await simulateUpload();

            // Saqlash
            try {
                // Blob URL ni saqlash uchun base64'ga aylantirish
                const base64 = await fileToBase64(selectedFile);

                const post = {
                    id: Date.now().toString(),
                    type: 'video',
                    title: title,
                    url: base64,
                    createdAt: new Date().toISOString()
                };

                addPost(post);

                showToast('Muvaffaqiyatli yuklandi! ✓');

                tg?.HapticFeedback?.notificationOccurred('success');

                // Profilga qaytish
                setTimeout(() => {
                    window.location.href = 'profil.html';
                }, 900);
            } catch (err) {
                console.error('Xatolik:', err);
                showToast('Xatolik yuz berdi. Qayta urinib ko\'ring.');
                showStep('preview');
            }
        });

        
        // Progress simulyatsiya
        function simulateUpload() {
            return new Promise((resolve) => {
                const fill = document.getElementById('progressFill');
                const text = document.getElementById('progressText');
                let progress = 0;

                const timer = setInterval(() => {
                    progress += Math.random() * 18 + 5;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(timer);
                        fill.style.width = '100%';
                        text.textContent = '100%';
                        setTimeout(resolve, 400);
                        return;
                    }
                    fill.style.width = progress + '%';
                    text.textContent = Math.floor(progress) + '%';
                }, 180);
            });
        }

        // Fayl → base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================
        // ORQAGA
        // ============================
        document.getElementById('backBtn').addEventListener('click', () => {
            tg?.HapticFeedback?.impactOccurred('light');

            if (stepPreview.classList.contains('active') || stepUploading.classList.contains('active')) {
                // Preview'dan galereyaga qaytish
                if (selectedVideoURL) URL.revokeObjectURL(selectedVideoURL);
                selectedFile = null;
                selectedVideoURL = null;
                titleInput.value = '';
                submitBtn.disabled = true;
                showStep('gallery');
            } else {
                // Galereyadan profilga
                window.location.href = 'profil.html';
            }
        });

        // ============================
        // URL PARAMETR
        // ============================
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type'); // 'video' | 'live'

        if (type === 'live') {
            headerTitle.textContent = 'Jonli efir';
            showToast('Jonli efir tez orada...');
            setTimeout(() => window.location.href = 'profil.html', 1500);
        } else {
            // 'video' bo'lsa yoki parametrsiz — galereyani ko'rsatish
            showStep('gallery');
        }

        // Auto-open gallery (ixtiyoriy)
        if (type === 'video') {
            setTimeout(() => {
                tg?.HapticFeedback?.impactOccurred('light');
                fileInput.click();
            }, 500);
        }
    </script>
</body>
</html>
