<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Lesson</title>

<style>

:root{
  --bg:#000;
  --card:#1C1C1E;
  --text:#fff;
  --secondary:#8E8E93;
  --blue:#007AFF;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  overflow:hidden;
}

/* HEADER */

.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:65px;
  display:flex;
  align-items:center;
  padding:0 20px;
  background:rgba(0,0,0,0.92);
  border-bottom:1px solid #222;
  z-index:1000;
}

.header h1{
  margin:0;
  font-size:22px;
}

/* CONTENT */

.content{
  height:100vh;
  overflow-y:auto;
  padding:85px 20px 180px;
}

.text-item{
  margin-bottom:20px;
  padding:14px;
  border-radius:18px;
  background:#111;
  transition:0.3s;
}

/* ENGLISH */

.en{
  display:block;
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
  line-height:1.5;
  padding:6px 8px;
  border-radius:10px;
  transition:0.3s;
}

/* UZBEK */

.uz{
  display:block;
  font-size:15px;
  color:var(--secondary);
  line-height:1.5;
  padding:6px 8px;
  border-radius:10px;
  transition:0.3s;
}

/* ACTIVE ENGLISH */

.active-en{
  background:rgba(255,255,255,0.08);
  color:white;
  border:1px solid rgba(255,255,255,0.2);

  box-shadow:
    0 0 12px rgba(255,255,255,0.15);

  transform:scale(1.01);
}

/* ACTIVE UZBEK */

.active-uz{
  background:rgba(0,122,255,0.15);
  color:#4DA3FF;

  border-left:4px solid var(--blue);

  padding-left:12px;
}

/* PLAYER */

.player{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:rgba(10,10,10,0.95);
  border-top:1px solid #222;
  padding:20px;
}

/* PROGRESS */

.progress{
  width:100%;
  height:5px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:20px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:white;
  transition:0.3s;
}

/* BUTTONS */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

button{
  border:none;
  outline:none;
  cursor:pointer;
}

.control-btn{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#1C1C1E;
  color:white;
  font-size:20px;
}

.play-btn{
  width:75px;
  height:75px;
  border-radius:50%;
  background:white;
  color:black;
  font-size:24px;
  font-weight:bold;
}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">
  <h1>O'zingizni tanishtiring</h1>
</div>

<!-- CONTENT -->

<div class="content" id="content"></div>

<!-- PLAYER -->

<div class="player">

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="controls">

    <button class="control-btn" onclick="changeSentence(-1)">
      ⏮
    </button>

    <button class="play-btn" id="playBtn">
      ▶
    </button>

    <button class="control-btn" onclick="changeSentence(1)">
      ⏭
    </button>

  </div>

</div>

<script>

const sentences = [

["My name is Ali.","Mening ismim Ali.",""],

["I am 20 years old.","Men 20 yoshdaman.",""],

["I live in Tashkent.","Men Toshkentda yashayman.",""],

["I study English.","Men ingliz tilini o‘rganaman.",""],

["I want to be a programmer.","Men dasturchi bo‘lmoqchiman.",""],

["I like reading books.","Men kitob o‘qishni yoqtiraman.",""],

["I love music.","Men musiqani yaxshi ko‘raman.",""]

];

const content = document.getElementById('content');

const progressFill =
document.getElementById('progressFill');

const playBtn =
document.getElementById('playBtn');

let currentIndex = 0;

let isPlaying = false;

const audio = new Audio();

let items = [];

/* RENDER */

function renderTexts(){

  content.innerHTML='';

  items=[];

  sentences.forEach((s,index)=>{

    const div=document.createElement('div');

    div.className='text-item';

    div.innerHTML=`

      <span class="en">
        ${s[0]}
      </span>

      <span class="uz">
        ${s[1]}
      </span>

    `;

    div.addEventListener('click',()=>{

      currentIndex=index;

      updateActive(currentIndex);

      updateProgress();

      playCurrentAudio();

    });

    content.appendChild(div);

    items.push(div);

  });

}

/* ACTIVE HIGHLIGHT */

function updateActive(index){

  items.forEach(item=>{

    const en=item.querySelector('.en');

    const uz=item.querySelector('.uz');

    en.classList.remove('active-en');

    uz.classList.remove('active-uz');

  });

  const currentItem=items[index];

  if(currentItem){

    currentItem
      .querySelector('.en')
      .classList.add('active-en');

    currentItem
      .querySelector('.uz')
      .classList.add('active-uz');

    currentItem.scrollIntoView({

      behavior:'smooth',

      block:'center'

    });

  }

}

/* PROGRESS */

function updateProgress(){

  const percent=
    ((currentIndex+1)/sentences.length)*100;

  progressFill.style.width=percent+'%';

}

/* PLAY AUDIO */

function playCurrentAudio(){

  const url=sentences[currentIndex][2];

  if(url){

    audio.src=url;

    audio.play();

  }

}

/* NEXT / PREV */

window.changeSentence=function(step){

  let newIndex=currentIndex+step;

  if(newIndex>=0 &&
     newIndex<sentences.length){

      currentIndex=newIndex;

      updateActive(currentIndex);

      updateProgress();

      if(isPlaying){

        playCurrentAudio();

      }

  }

}

/* PLAY BUTTON */

playBtn.addEventListener('click',()=>{

  isPlaying=!isPlaying;

  if(isPlaying){

    playBtn.innerHTML='⏸';

    playCurrentAudio();

  }else{

    playBtn.innerHTML='▶';

    audio.pause();

  }

});

/* AUDIO ENDED */

audio.addEventListener('ended',()=>{

  changeSentence(1);

});

/* START */

renderTexts();

updateActive(0);

updateProgress();

</script>

</body>
</html>
