<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>1-Dars | O'zingizni tanishtiring</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #000000;
      --card-bg: #1C1C1E;
      --player-bg: #0A0A0A;
      --accent: #FFFFFF;
      --blue-active: #007AFF;
      --text-secondary: #8E8E93;
      --border-subtle: #2C2C2E;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixed Header */
    .header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 0.5px solid #2C2C2E;
      height: 64px;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      font-size: 22px;
      margin-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .back-btn:active {
      background: rgba(255,255,255,0.15);
    }

    .header h1 {
      font-size: 20px;
      margin: 0;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    /* Language Switch */
    .lang-switch {
      margin-left: auto;
      background: #1C1C1E;
      border-radius: 30px;
      padding: 4px;
      display: flex;
      gap: 4px;
    }
    .lang-btn {
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: #8E8E93;
      border: none;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: #007AFF;
      color: white;
    }
    .lang-btn:active {
      opacity: 0.7;
    }

    /* Scrollable Content */
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 80px 20px 210px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      background-color: #000000;
    }

    .text-item {
      margin-bottom: 24px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      cursor: pointer;
    }

    .text-item.active {
      border-color: #FFFFFF;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .en {
      font-size: 18px;
      font-weight: 600;
      display: block;
      color: #FFFFFF;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .uz {
      font-size: 15px;
      color: var(--text-secondary);
      display: block;
      line-height: 1.4;
    }

    /* Fixed Player Bottom */
    .player-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--player-bg);
      padding: 16px 20px 28px;
      border-top: 1px solid #222;
      z-index: 1000;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(10, 10, 10, 0.96);
    }

    .progress-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 18px;
    }

    .bar-container {
      width: 100%;
      height: 4px;
      background: #333;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: #8E8E93;
      border-radius: 4px;
      transition: width 0.3s ease;
      position: relative;
    }

    .bar-dot {
      position: absolute;
      right: -6px;
      top: -5px;
      width: 14px;
      height: 14px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 500;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      max-width: 400px;
      margin: 0 auto;
    }

    .player-controls i {
      font-size: 22px;
      color: #CCC;
      cursor: pointer;
      transition: 0.2s;
      padding: 8px;
      border-radius: 50%;
    }

    .player-controls i:active {
      transform: scale(0.9);
      color: #FFF;
      background: rgba(255,255,255,0.1);
    }

    .player-controls i.active-repeat {
      color: var(--blue-active);
      text-shadow: 0 0 12px rgba(0, 122, 255, 0.6);
    }

    .btn-play-pause {
      width: 68px;
      height: 68px;
      background: #1C1C1E;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid #2C2C2E;
    }

    .btn-play-pause:active {
      transform: scale(0.94);
      background: #2C2C2E;
    }

    .btn-play-pause i {
      font-size: 28px;
      color: #FFF;
      padding: 0;
    }

    .player-controls i.fa-backward-step,
    .player-controls i.fa-forward-step {
      font-size: 26px;
    }

    /* current language badge */
    .current-lang-badge {
      font-size: 12px;
      color: #8E8E93;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn"><i class="fas fa-chevron-left"></i></a>
  <h1>O'zingizni tanishtiring</h1>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="uz">O'zbekcha</button>
  </div>
</div>

<main class="content-scroll" id="contentArea">
  <!-- JavaScript orqali matnlar qo'shiladi -->
</main>

<div class="player-fixed">
  <div class="progress-box">
    <div class="bar-container" id="progressBarContainer">
      <div class="bar-fill" id="progressFill">
        <div class="bar-dot"></div>
      </div>
    </div>
    <div class="time-labels">
      <span id="currentTime">00:00</span>
      <span id="totalTime">00:00</span>
    </div>
  </div>

  <div class="player-controls">
    <i class="fas fa-arrows-rotate" id="repeatBtn" title="Takrorlash"></i>
    <i class="fas fa-backward-step" id="prevBtn" title="Oldingi"></i>
    <div class="btn-play-pause" id="playBtn">
      <i class="fas fa-play"></i>
    </div>
    <i class="fas fa-forward-step" id="nextBtn" title="Keyingi"></i>
  </div>
  <div class="current-lang-badge" id="currentLangBadge">
    🔊 Ingliz tili audio
  </div>
</div>

<script>
  (function() {
    // ============================================================
    // MA'LUMOTLAR: Har bir gap uchun ingliz va o'zbek audio URLlari
    // ============================================================
    // Bu yerda siz haqiqiy audio fayl manzillarini kiritishingiz kerak.
    // Misol uchun, men namuna URL sifatida placeholder qo'ydim.
    // Siz ularni o'zingizning real audio fayllaringiz bilan almashtiring.
    // Agar audio mavjud bo'lmasa, bo'sh string qoldiring - u holda faqat matn ko'rinadi.
    
    const sentencesData = [
      { en: "Hello! What is your name?", uz: "Salom! Ismingiz nima?", en_audio: "https://www.image2url.com/r2/default/audio/1779891984450-f80ec430-45b9-4871-bffb-945682a3f02e.mp3", uz_audio: "https://www.example.com/audio/salom_ismingiz_nima_uz.mp3" },
      { en: "My name is Ali. What is your name?", uz: "Mening ismim Ali. Sizning ismingiz nima?", en_audio: "https://www.image2url.com/r2/default/audio/1779892425534-e538734c-059b-4684-ba11-eab1129da7b9.mp3", uz_audio: "" },
      { en: "My name is Madina. Nice to meet you.", uz: "Mening ismim Madina. Tanishganimdan xursandman.", en_audio: "https://www.image2url.com/r2/default/audio/1779892813470-5893ba96-d538-4443-8722-cab2dd1c78fd.mp3", uz_audio: "" },
      { en: "Nice to meet you too.", uz: "Men ham tanishganimdan xursandman.", en_audio: "https://www.image2url.com/r2/default/audio/1779893138216-3a43e86b-26b3-4d9b-bbd0-1decca20634f.mp3", uz_audio: "" },
      { en: "How old are you?", uz: "Siz necha yoshdasiz?", en_audio: "", uz_audio: "" },
      { en: "I am 18 years old.", uz: "Men 18 yoshdaman.", en_audio: "", uz_audio: "" },
      { en: "Where are you from?", uz: "Siz qayerdansiz?", en_audio: "", uz_audio: "" },
      { en: "I am from Uzbekistan.", uz: "Men Oʻzbekistondanman.", en_audio: "", uz_audio: "" },
      { en: "Which city do you live in?", uz: "Siz qaysi shaharda yashaysiz?", en_audio: "", uz_audio: "" },
      { en: "I live in Tashkent.", uz: "Men Toshkentda yashayman.", en_audio: "", uz_audio: "" },
      { en: "Are you a student?", uz: "Siz talabamisiz?", en_audio: "", uz_audio: "" },
      { en: "Yes, I am a student.", uz: "Ha, men talabaman.", en_audio: "", uz_audio: "" },
      { en: "What do you study?", uz: "Siz nima oʻqiysiz?", en_audio: "", uz_audio: "" },
      { en: "I study English.", uz: "Men ingliz tilini oʻrganaman.", en_audio: "", uz_audio: "" },
      { en: "Do you work?", uz: "Siz ishlaysizmi?", en_audio: "", uz_audio: "" },
      { en: "No, I do not work now.", uz: "Yoʻq, hozir ishlamayman.", en_audio: "", uz_audio: "" },
      { en: "What do you like to do?", uz: "Siz nima qilishni yoqtirasiz?", en_audio: "", uz_audio: "" },
      { en: "I like reading books.", uz: "Men kitob oʻqishni yoqtiraman.", en_audio: "", uz_audio: "" },
      { en: "Do you have brothers or sisters?", uz: "Sizning aka-ukalaringiz yoki opa-singillaringiz bormi?", en_audio: "", uz_audio: "" },
      { en: "Yes, I have one brother.", uz: "Ha, mening bitta ukam bor.", en_audio: "", uz_audio: "" },
      { en: "What is your favorite food?", uz: "Sizning sevimli ovqatingiz nima?", en_audio: "", uz_audio: "" },
      { en: "My favorite food is plov.", uz: "Mening sevimli ovqatim palov.", en_audio: "", uz_audio: "" },
      { en: "What is your favorite color?", uz: "Sizning sevimli rangingiz nima?", en_audio: "", uz_audio: "" },
      { en: "My favorite color is blue.", uz: "Mening sevimli rangim koʻk.", en_audio: "", uz_audio: "" },
      { en: "Can you speak English well?", uz: "Siz ingliz tilida yaxshi gaplasha olasizmi?", en_audio: "", uz_audio: "" },
      { en: "I can speak a little English.", uz: "Men ozgina inglizcha gaplasha olaman.", en_audio: "", uz_audio: "" },
      { en: "What do you do every day?", uz: "Siz har kuni nima qilasiz?", en_audio: "", uz_audio: "" },
      { en: "I go to school every day.", uz: "Men har kuni maktabga boraman.", en_audio: "", uz_audio: "" },
      { en: "What are you doing now?", uz: "Hozir nima qilyapsiz?", en_audio: "", uz_audio: "" },
      { en: "I am learning English now.", uz: "Men hozir ingliz tilini oʻrganayapman.", en_audio: "", uz_audio: "" },
      { en: "What did you do yesterday?", uz: "Kecha nima qildingiz?", en_audio: "", uz_audio: "" },
      { en: "I watched a movie yesterday.", uz: "Men kecha kino koʻrdim.", en_audio: "", uz_audio: "" },
      { en: "Were you at home yesterday evening?", uz: "Kecha kechqurun uyda edingizmi?", en_audio: "", uz_audio: "" },
      { en: "Yes, I was at home.", uz: "Ha, men uyda edim.", en_audio: "", uz_audio: "" },
      { en: "Do you have a phone?", uz: "Sizning telefoningiz bormi?", en_audio: "", uz_audio: "" },
      { en: "Yes, I have a smartphone.", uz: "Ha, mening smartfonim bor.", en_audio: "", uz_audio: "" },
      { en: "What is your dream?", uz: "Sizning orzuingiz nima?", en_audio: "", uz_audio: "" },
      { en: "My dream is to speak English fluently.", uz: "Mening orzuim ingliz tilida ravon gapirish.", en_audio: "", uz_audio: "" },
      { en: "Thank you for talking with me.", uz: "Men bilan suhbatlashganingiz uchun rahmat.", en_audio: "", uz_audio: "" },
      { en: "You are welcome. See you later!", uz: "Arzimaydi. Keyin koʻrishamiz!", en_audio: "", uz_audio: "" }
    ];

    // DOM elementlari
    const container = document.getElementById('contentArea');
    const repeatBtn = document.getElementById('repeatBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const playBtn = document.getElementById('playBtn');
    const playIcon = playBtn.querySelector('i');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const currentLangBadge = document.getElementById('currentLangBadge');

    // Holat o'zgaruvchilari
    let currentLang = 'en';      // 'en' yoki 'uz'
    let currentIdx = 0;
    let isRepeatMode = false;
    let isPlaying = false;
    let textItems = [];
    
    // Audio obyekti
    const lessonAudio = new Audio();
    
    // Progress bar yangilanishi uchun timeupdate interval (audio duration bo'lmaganda)
    let currentTimeInterval = null;

    // ========== Yordamchi funksiyalar ==========
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === Infinity) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Joriy gap uchun audio URLni olish
    function getCurrentAudioUrl() {
      const sentence = sentencesData[currentIdx];
      if (!sentence) return "";
      return currentLang === 'en' ? sentence.en_audio : sentence.uz_audio;
    }

    // Joriy gap matnini olish (asosiy ko'rinish uchun)
    function getCurrentDisplayText() {
      const sentence = sentencesData[currentIdx];
      if (!sentence) return { main: "", secondary: "" };
      if (currentLang === 'en') {
        return { main: sentence.en, secondary: sentence.uz };
      } else {
        return { main: sentence.uz, secondary: sentence.en };
      }
    }

    // Audio yuklash va agar play rejimida bo'lsa, chalish
    function loadCurrentAudio(autoplay = true) {
      const audioUrl = getCurrentAudioUrl();
      
      // oldingi event listenerlarni tozalash (to'planish oldini olish)
      lessonAudio.onended = null;
      lessonAudio.ontimeupdate = null;
      lessonAudio.onloadedmetadata = null;
      
      if (audioUrl && audioUrl.trim() !== "") {
        if (lessonAudio.src !== audioUrl) {
          lessonAudio.src = audioUrl;
          lessonAudio.load();
        }
        
        // Meta ma'lumot yuklanganda total time ni yangilash
        lessonAudio.onloadedmetadata = () => {
          if (lessonAudio.duration && isFinite(lessonAudio.duration)) {
            totalTimeSpan.textContent = formatTime(lessonAudio.duration);
          } else {
            totalTimeSpan.textContent = "00:00";
          }
        };
        
        // Vaqt o'zgarishini kuzatish
        lessonAudio.ontimeupdate = () => {
          if (lessonAudio.duration && isFinite(lessonAudio.duration)) {
            const current = lessonAudio.currentTime;
            currentTimeSpan.textContent = formatTime(current);
            const percent = (current / lessonAudio.duration) * 100;
            progressFill.style.width = percent + '%';
          }
        };
        
        // Audio tugagach
        lessonAudio.onended = () => {
          if (isRepeatMode) {
            lessonAudio.currentTime = 0;
            lessonAudio.play().catch(e => console.log("Repeatda xatolik:", e));
          } else {
            // Keyingi gapga o'tish
            changeSentence(1);
          }
        };
        
        if (autoplay && isPlaying) {
          lessonAudio.play().catch(e => console.log("Avto chalishda xatolik:", e));
        } else if (!autoplay && isPlaying) {
          // Agar audio o'zgartirilgan bo'lsa va play holatida bo'lsa, avtomatik davom ettirish
          lessonAudio.play().catch(e => console.log("Audio yuklashda xatolik:", e));
        }
      } else {
        // Agar audio mavjud bo'lmasa
        if (lessonAudio.src) {
          lessonAudio.pause();
          lessonAudio.src = "";
        }
        currentTimeSpan.textContent = "00:00";
        totalTimeSpan.textContent = "00:00";
        progressFill.style.width = '0%';
        
        if (isPlaying) {
          // Audio bo'lmaganda avtomatik ravishda keyingi gapga o'tmaslik, faqat to'xtatamiz
          // Lekin foydalanuvchi uchun ogohlantirish yo'q, faqat to'xtaydi
          isPlaying = false;
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
        }
      }
    }

    // Progress barni yangilash (faqat joriy indeks asosida umumiy progress)
    function updateOverallProgress() {
      const progressPercent = ((currentIdx + 1) / sentencesData.length) * 100;
      progressFill.style.width = progressPercent + '%';
    }
    
    // Umumiy progressni va time labelni yangilash (audio duration bo'lmasa)
    function updateUITexts() {
      updateOverallProgress();
      const display = getCurrentDisplayText();
      if (textItems[currentIdx]) {
        // matn ichidagi ma'lumotlarni yangilash
        const mainSpan = textItems[currentIdx].querySelector('.en');
        const secSpan = textItems[currentIdx].querySelector('.uz');
        if (currentLang === 'en') {
          mainSpan.textContent = display.main;
          secSpan.textContent = display.secondary;
        } else {
          mainSpan.textContent = display.main;
          secSpan.textContent = display.secondary;
        }
      }
      
      // Badge ni yangilash
      currentLangBadge.innerHTML = currentLang === 'en' ? '🇬🇧 Ingliz tili audio' : '🇺🇿 O\'zbek tili audio';
    }

    
    // Barcha matnlarni render qilish (tilga qarab)
    function renderTexts() {
      container.innerHTML = '';
      textItems = [];
      sentencesData.forEach((item, i) => {
        const mainText = currentLang === 'en' ? item.en : item.uz;
        const secondaryText = currentLang === 'en' ? item.uz : item.en;
        
        const div = document.createElement('div');
        div.className = 'text-item';
        if (i === currentIdx) div.classList.add('active');
        div.innerHTML = `<span class="en">${escapeHtml(mainText)}</span><span class="uz">${escapeHtml(secondaryText)}</span>`;
        
        div.addEventListener('click', () => {
          if (currentIdx === i && isPlaying) {
            // Agar bir xil gapni bossa, pauza/play emas, aks holda o'sha gapga o'tadi
          }
          currentIdx = i;
          updateActive(currentIdx);
          updateUITexts();
          // Agar o'ynatish rejimida bo'lsa, avtomatik yangi audioni yuklab chalaveradi
          if (isPlaying) {
            loadCurrentAudio(true);
          } else {
            loadCurrentAudio(false);
          }
        });
        
        container.appendChild(div);
        textItems.push(div);
      });
      updateActive(currentIdx);
    }
    
    // XSS himoyasi uchun oddiy escape
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }
    
    function updateActive(index) {
      textItems.forEach((item, i) => {
        if (i === index) {
          item.classList.add('active');
          item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          item.classList.remove('active');
        }
      });
    }
    
    function changeSentence(step) {
      if (isRepeatMode && step === 1) {
        // Takrorlash rejimida keyingi tugmasi bosilganda ayni gapni qayta chalish
        if (isPlaying) {
          lessonAudio.currentTime = 0;
          lessonAudio.play().catch(e => console.log("takrorlashda xatolik", e));
        } else {
          loadCurrentAudio(true);
          isPlaying = true;
          playIcon.classList.remove('fa-play');
          playIcon.classList.add('fa-pause');
        }
        return;
      }
      
      let newIndex = currentIdx + step;
      if (newIndex >= 0 && newIndex < sentencesData.length) {
        currentIdx = newIndex;
        updateActive(currentIdx);
        updateUITexts();
        
        // Audio yuklash va agar o'ynatish holatida bo'lsa, avtomatik chalish
        if (isPlaying) {
          loadCurrentAudio(true);
        } else {
          loadCurrentAudio(false);
        }
      } else if (newIndex === sentencesData.length && step === 1) {
        // Dars oxiriga yetdi, agar xohlasak to'xtatamiz
        if (isPlaying) {
          lessonAudio.pause();
          isPlaying = false;
          playIcon.classList.remove('fa-pause');
          playIcon.classList.add('fa-play');
        }
      }
    }
    
    // Tilni almashtirish funksiyasi
    function setLanguage(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      
      // Agar audio chalayotgan bo'lsa, avval to'xtatamiz
      const wasPlaying = isPlaying;
      if (wasPlaying) {
        lessonAudio.pause();
        isPlaying = false;
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
      }
      
      // Matnlarni qayta render qilish
      renderTexts();
      updateUITexts();
      
      // Joriy gap uchun yangi til audio faylini yuklash (lekin avtomatik chalinmaydi, faqat yuklab qo'yamiz)
      loadCurrentAudio(false);
      
      // Agar oldin chalayotgan bo'lsa, endi yangi til audioni chala boshlaymiz
      if (wasPlaying) {
        isPlaying = true;
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
        loadCurrentAudio(true);
      }
      
      // Tugmalarning aktiv ko'rinishini yangilash
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.getAttribute('data-lang') === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
    
    // Play/pause tugmasi
    function togglePlayPause() {
      const audioUrl = getCurrentAudioUrl();
      if (!audioUrl || audioUrl.trim() === "") {
        // Audio mavjud emas, hech nima qilmaymiz yoki keyingisiga o'tamiz? Faqat indikatsiya
        console.log("Bu gap uchun audio mavjud emas");
        return;
      }
      
      if (isPlaying) {
        lessonAudio.pause();
        isPlaying = false;
        playIcon.classList.remove('fa-pause');
        playIcon.classList.add('fa-play');
      } else {
        // Agar audio hali yuklanmagan yoki src o'zgargan bo'lsa
        if (!lessonAudio.src || lessonAudio.src !== audioUrl) {
          loadCurrentAudio(true);
        } else {
          lessonAudio.play().catch(e => console.log("Play xatosi:", e));
        }
        isPlaying = true;
        playIcon.classList.remove('fa-play');
        playIcon.classList.add('fa-pause');
      }
    }
    
    // Progress bar bosilganda audio vaqtini o'zgartirish
    function seekAudio(e) {
      const rect = progressBarContainer.getBoundingClientRect();
      let clickX = e.clientX - rect.left;
      let widthPercent = clickX / rect.width;
      if (widthPercent < 0) widthPercent = 0;
      if (widthPercent > 1) widthPercent = 1;
      
      if (lessonAudio.duration && isFinite(lessonAudio.duration)) {
        const seekTime = widthPercent * lessonAudio.duration;
        lessonAudio.currentTime = seekTime;
        // progress ni yangilash
        progressFill.style.width = (widthPercent * 100) + '%';
        currentTimeSpan.textContent = formatTime(seekTime);
      }
    }
    
    // ========== Event Listenerlar ==========
    prevBtn.addEventListener('click', () => changeSentence(-1));
    nextBtn.addEventListener('click', () => changeSentence(1));
    playBtn.addEventListener('click', togglePlayPause);
    repeatBtn.addEventListener('click', () => {
      isRepeatMode = !isRepeatMode;
      if (isRepeatMode) {
        repeatBtn.classList.add('active-repeat');
      } else {
        repeatBtn.classList.remove('active-repeat');
      }
    });
    progressBarContainer.addEventListener('click', seekAudio);
    
    // Til tugmalari
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const lang = btn.getAttribute('data-lang');
        setLanguage(lang);
      });
    });
    
    // Boshlang'ich render
    renderTexts();
    setLanguage('en'); // Ingliz tili default qilish (audio URL mavjud bo'lsa, birinchi gap uchun)
    
    // Agar birinchi gapda audio bo'lmasa, hech bo'lmaganda UI tayyor
    updateUITexts();
  })();
</script>
</body>
</html>
