<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduce Yourself - English Practice</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f7fb;
        margin:0;
        padding:20px;
    }

    .container{
        max-width:900px;
        margin:auto;
        background:white;
        padding:20px;
        border-radius:15px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        color:#2c3e50;
    }

    .controls{
        text-align:center;
        margin-bottom:20px;
    }

    button{
        padding:10px 20px;
        border:none;
        border-radius:8px;
        background:#3498db;
        color:white;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#2980b9;
    }

    .line{
        padding:10px;
        margin-bottom:8px;
        border-radius:8px;
        transition:0.3s;
    }

    .english{
        font-weight:bold;
        color:#222;
    }

    .uzbek{
        color:#666;
        margin-top:3px;
    }

    .active{
        background:#fff3b0;
        border-left:5px solid orange;
    }
</style>
</head>

<body>

<div class="container">

<h1>“O'zingizni tanishtiring”</h1>

<div class="controls">
    <button onclick="startReading()">▶ Play Audio</button>
</div>

<div id="text-container"></div>

</div>

<script>

const dialogues = [
{
en:"Hello! What is your name?",
uz:"Salom! Ismingiz nima?"
},
{
en:"My name is Ali. What is your name?",
uz:"Mening ismim Ali. Sizning ismingiz nima?"
},
{
en:"My name is Madina. Nice to meet you.",
uz:"Mening ismim Madina. Tanishganimdan xursandman."
},
{
en:"Nice to meet you too.",
uz:"Men ham tanishganimdan xursandman."
},
{
en:"How old are you?",
uz:"Siz necha yoshdasiz?"
},
{
en:"I am 18 years old.",
uz:"Men 18 yoshdaman."
},
{
en:"Where are you from?",
uz:"Siz qayerdansiz?"
},
{
en:"I am from Uzbekistan.",
uz:"Men Oʻzbekistondanman."
},
{
en:"Which city do you live in?",
uz:"Siz qaysi shaharda yashaysiz?"
},
{
en:"I live in Tashkent.",
uz:"Men Toshkentda yashayman."
},
{
en:"Are you a student?",
uz:"Siz talabamisiz?"
},
{
en:"Yes, I am a student.",
uz:"Ha, men talabaman."
},
{
en:"What do you study?",
uz:"Siz nima oʻqiysiz?"
},
{
en:"I study English.",
uz:"Men ingliz tilini oʻrganaman."
},
{
en:"Do you work?",
uz:"Siz ishlaysizmi?"
},
{
en:"No, I do not work now.",
uz:"Yoʻq, hozir ishlamayman."
},
{
en:"What do you like to do?",
uz:"Siz nima qilishni yoqtirasiz?"
},
{
en:"I like reading books.",
uz:"Men kitob oʻqishni yoqtiraman."
},
{
en:"Do you have brothers or sisters?",
uz:"Sizning aka-ukalaringiz yoki opa-singillaringiz bormi?"
},
{
en:"Yes, I have one brother.",
uz:"Ha, mening bitta ukam bor."
},
{
en:"What is your favorite food?",
uz:"Sizning sevimli ovqatingiz nima?"
},
{
en:"My favorite food is plov.",
uz:"Mening sevimli ovqatim palov."
},
{
en:"What is your favorite color?",
uz:"Sizning sevimli rangingiz nima?"
},
{
en:"My favorite color is blue.",
uz:"Mening sevimli rangim koʻk."
},
{
en:"Can you speak English well?",
uz:"Siz ingliz tilida yaxshi gaplasha olasizmi?"
},
{
en:"I can speak a little English.",
uz:"Men ozgina inglizcha gaplasha olaman."
},
{
en:"What do you do every day?",
uz:"Siz har kuni nima qilasiz?"
},
{
en:"I go to school every day.",
uz:"Men har kuni maktabga boraman."
},
{
en:"What are you doing now?",
uz:"Hozir nima qilyapsiz?"
},
{
en:"I am learning English now.",
uz:"Men hozir ingliz tilini oʻrganayapman."
},
{
en:"What did you do yesterday?",
uz:"Kecha nima qildingiz?"
},
{
en:"I watched a movie yesterday.",
uz:"Men kecha kino koʻrdim."
},
{
en:"Were you at home yesterday evening?",
uz:"Kecha kechqurun uyda edingizmi?"
},
{
en:"Yes, I was at home.",
uz:"Ha, men uyda edim."
},
{
en:"Do you have a phone?",
uz:"Sizning telefoningiz bormi?"
},
{
en:"Yes, I have a smartphone.",
uz:"Ha, mening smartfonim bor."
},
{
en:"What is your dream?",
uz:"Sizning orzuingiz nima?"
},
{
en:"My dream is to speak English fluently.",
uz:"Mening orzuim ingliz tilida ravon gapirish."
},
{
en:"Thank you for talking with me.",
uz:"Men bilan suhbatlashganingiz uchun rahmat."
},
{
en:"You are welcome. See you later!",
uz:"Arzimaydi. Keyin koʻrishamiz!"
}
];

const container = document.getElementById("text-container");

dialogues.forEach((item,index)=>{
    const div = document.createElement("div");
    div.className = "line";
    div.id = "line-"+index;

    div.innerHTML = `
        <div class="english">${item.en}</div>
        <div class="uzbek">${item.uz}</div>
    `;

    container.appendChild(div);
});

function speakLine(text,index){

    return new Promise((resolve)=>{

        document.querySelectorAll(".line").forEach(el=>{
            el.classList.remove("active");
        });

        document.getElementById("line-"+index).classList.add("active");

        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";
        speech.rate = 0.9;

        speech.onend = resolve;

        speechSynthesis.speak(speech);

    });
}

async function startReading(){

    speechSynthesis.cancel();

    for(let i=0;i<dialogues.length;i++){

        await speakLine(dialogues[i].en,i);

    }

    document.querySelectorAll(".line").forEach(el=>{
        el.classList.remove("active");
    });
}

</script>

</body>
</html>
